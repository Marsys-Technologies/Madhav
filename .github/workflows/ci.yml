  governance-gates:
    # v1.2 follow-on (2026-05-28): four gates from session_queue.yaml that the
    # seal-time ci.yml was missing (per OPERATOR_CLEANUP_REPORT_v1_0 line 57 +
    # v1.2 patch §R5). Each step is non-blocking on the existing baseline
    # (exit-code-3 known_residuals whitelist) but blocks NEW regressions.
    name: Governance Gates (drift / schema / edge / native-literal / py-sidecar)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # CI efficiency audit (2026-07-31): the sidecar install below was 145s of
          # this job's 435s, uncached on every run. Caching keyed on both requirement
          # files so a change to either invalidates correctly.
          cache: 'pip'
          cache-dependency-path: |
            platform/python-sidecar/requirements-ci.txt

      - name: Install Python dependencies
        run: pip install pyyaml pytest

      # ── SAMĀPTI B-N8-CI-GATES / finding F-29 (2026-07-30) ──────────────────────
      # Both steps below accepted exit 3 UNCONDITIONALLY, so the entire MEDIUM/LOW
      # severity band passed green permanently and without limit: one pre-existing
      # medium violation and four hundred new ones produced the identical green
      # tick. The schema_validator comment additionally asserted "schema_validator
      # exits 0. Gate hardened." — factually false at the time it was read here: a
      # live run on this same tree reports "43 violations; exit=3". drift_detector
      # at least names a `known_residuals[]` whitelist; schema_validator has no
      # whitelist mechanism at all, so exit 3 was a blanket pass.
      #
      # Both steps now pin a COUNT CEILING at the T0 baseline fixed by Dvārapāla
      # Ruling 4 (216 drift findings / 43 schema violations, measured at
      # origin/main and reproduced independently). Exit 3 still passes — but only
      # while the count does not GROW. A new medium/low violation now reddens CI,
      # which is the entire point of a baseline: it is a ratchet, not an amnesty.
      # Lowering a ceiling after cleanup is encouraged; raising one requires a
      # recorded ruling, not a quiet edit.
      - name: drift_detector — repo scan
        # Exit code policy: 0=clean, 3=baseline residuals, 1/2=regression (fail).
        # Whitelist location: platform/scripts/governance/drift_detector.py known_residuals[]
        # Current whitelisted tickets: WARN.2–WARN.8 (dead Gemini mirror pointers,
        # historical PHASE_B_PLAN refs — booked for quarterly governance pass 2026-07-24)
        # Use || to capture exit code without set -e aborting on non-zero exit.
        env:
          DRIFT_BASELINE_MAX: '216'   # DVA Ruling 4 T0 baseline. Lower freely; raise only by ruling.
        run: |
          ec=0
          out=$(python platform/scripts/governance/drift_detector.py) || ec=$?
          printf '%s\n' "$out"
          if [ "$ec" != 0 ] && [ "$ec" != 3 ]; then
            echo "::error::drift_detector exit=$ec (expected 0 or 3)"; exit "$ec"
          fi
          n=$(printf '%s\n' "$out" | sed -n 's/^drift_detector: \([0-9]*\) findings.*/\1/p' | tail -1)
          if [ -z "$n" ]; then
            echo "::error::Could not parse drift_detector's finding count from its output. Refusing to pass a gate whose result could not be read."
            exit 1
          fi
          echo "drift_detector findings: $n (baseline ceiling ${DRIFT_BASELINE_MAX})"
          if [ "$n" -gt "${DRIFT_BASELINE_MAX}" ]; then
            echo "::error::drift_detector findings ${n} EXCEEDS the ${DRIFT_BASELINE_MAX} T0 baseline (DVA Ruling 4). New drift must be fixed, not absorbed into the whitelist."
            exit 1
          fi

      - name: schema_validator — repo scan
        # Exit code policy: 0=clean, 3=medium/low only, 1/2/4+ = fail.
        # NOTE (F-29): the previous comment here claimed the validator "exits 0. Gate
        # hardened." It does not, and has not for some time — 43 violations / exit=3
        # on this tree. The 2026-05-31 governance pass did resolve the four SESSION_LOG
        # entries it named; that was mistaken for the whole picture. Corrected to state
        # the live behaviour, with a ceiling so the band can no longer grow silently.
        env:
          SCHEMA_BASELINE_MAX: '43'   # DVA Ruling 4 T0 baseline. Lower freely; raise only by ruling.
        run: |
          ec=0
          out=$(python platform/scripts/governance/schema_validator.py) || ec=$?
          printf '%s\n' "$out"
          if [ "$ec" != 0 ] && [ "$ec" != 3 ]; then
            echo "::error::schema_validator exit=$ec (expected 0 or 3)"; exit "$ec"
          fi
          n=$(printf '%s\n' "$out" | sed -n 's/^schema_validator: \([0-9]*\) violations.*/\1/p' | tail -1)
          if [ -z "$n" ]; then
            echo "::error::Could not parse schema_validator's violation count from its output. Refusing to pass a gate whose result could not be read."
            exit 1
          fi
          echo "schema_validator violations: $n (baseline ceiling ${SCHEMA_BASELINE_MAX})"
          if [ "$n" -gt "${SCHEMA_BASELINE_MAX}" ]; then
            echo "::error::schema_validator violations ${n} EXCEEDS the ${SCHEMA_BASELINE_MAX} T0 baseline (DVA Ruling 4). A new medium/low violation is a regression, not a residual."
            exit 1
          fi

      - name: msr_referential_integrity — self-test (§N.5 constituent guard)
        # Hard gate (WP-2.4 / LCA-9b-5). Every bodha_msr_signals.constituent_facts_array
        # entry MUST resolve to a real chart_facts.fact_id (CLAUDE.md §N.5). The
        # DB-free --self-test proves the guard by mutation: it exits 1 unless the
        # clean fixture is clean AND a fixture with one broken constituent is caught.
        # Live-DB scan (--chart-id) runs at W3 rebuild verification.
        run: python platform/scripts/governance/msr_referential_integrity.py --self-test

      - name: schema_pin_mimamsa_predictions — self-test (SAMĀPTI B-PB-SCHEMA-PIN)
        # DB-free CI-safe gate. Proves the mimamsa_predictions schema-hash function
        # (platform/scripts/governance/MIMAMSA_PREDICTIONS_SCHEMA_PIN.json baseline)
        # is deterministic AND sensitive to column/constraint/index mutation, so the
        # pin can actually catch drift and isn't a tautology. Live --verify against
        # DATABASE_URL is a manual/future-session runbook, not wired into CI (no DB
        # in this job) — see 00_ARCHITECTURE/briefs/pariprashna_build/PB_SCHEMA_HASH_PIN_v1_0.md.
        run: python platform/scripts/governance/schema_pin_mimamsa_predictions.py --self-test

      - name: assert_no_native_literal — repo scan
        # Hard gate: no literal native birth-chart values in code outside L1.
        # G4_no_native_lit per PROJECT_ARCHITECTURE B.10.
        run: bash platform/scripts/governance/assert_no_native_literal.sh

      - name: dag_edge_guard — self-test (§N.8 / SAMĀPTI F-02)
        # Hard gate. Before this step existed, dag_edge_guard's docstring claimed it ran
        # "as a CI gate" and caught undeclared-read drift "the moment" it appeared, while
        # its ONLY automated caller was a test carrying @pytest.mark.skipif(not
        # DATABASE_URL) — and CI has no DB, so it skipped on every run. No mutation to any
        # writer could turn it red. Three real HARD violations were found by a human
        # running it by hand, which is exactly what the claim said would not be necessary.
        #
        # SCOPE OF THIS GATE, stated so it is not itself an overclaim: --self-test is
        # DB-free and proves the DETECTOR by mutation (a seeded undeclared cross-asset
        # read must be flagged; the same read with the edge declared must come back
        # clean). It proves NOTHING about the live registry. The live scan needs
        # DATABASE_URL and runs in fresh_chart_smoke.yml — see that workflow and the
        # module docstring.
        run: |
          cd platform/python-sidecar
          python -m pipeline.orchestrator.dag_edge_guard --self-test

      - name: kala_derivation_completeness_guard — self-test (§N.8 / SAMĀPTI F-02)
        # Hard gate. Same class as above and worse: this guard had ZERO automated
        # invocation anywhere in the repo — its own test file exercises only the pure
        # evaluate() and never calls analyze()/main(). Nothing ran it.
        #
        # SCOPE: DB-free detector mutation proof only (clean fixture must stay clean; a
        # fixture with one seeded derivation gap must be caught). The live scan needs
        # DATABASE_URL *and* per-chart kala_* rows, so it runs in fresh_chart_smoke.yml
        # after the fixture-chart build — the only automated context with both.
        run: |
          cd platform/python-sidecar
          python -m pipeline.orchestrator.kala_derivation_completeness_guard --self-test

      - name: edge_security_smoke — sanity
        # Lightweight smoke: shell + yaml + JSON shape check on infra/edge
        # without an actual edge-stack endpoint. Full edge smoke depends on the
        # live HTTPS LB and is a deploy-time check, not a CI check.
        run: bash platform/scripts/governance/edge_security_smoke.sh --ci-only

      - name: pytest — pyjhora_adapter + pipeline
        # Hard gate. All tests here are self-contained (conn=None dry-run or
        # @pytest.mark.skipif(not DATABASE_URL) for integration tests).
        # test_a3_schema_smoke.py uses pytestmark to skip when DATABASE_URL
        # is absent — CI has no DB, so those 6 tests skip cleanly.
        # The || true soft-pass was removed 2026-05-30 (CF.V13.8 resolved).
        # natal_engine/ deleted by pyjhora engine replacement (2026-06-01);
        # pyjhora_adapter tests live under tests/test_pyjhora_adapter/ (covered by tests/).
        # TEARDOWN-EXCLUDED (Layer-0 rebuild arc, 2026-06-02):
        #   tests/test_pyjhora_adapter/ — pyjhora_adapter package cleared (empty dir);
        #   tests/test_dasha_chain.py — imports pipeline.transit_search (removed in teardown);
        #   tests/extractors/test_cgm_extractor.py — pipeline.extractors.cgm_extractor removed.
        #   tests/test_l0_remedy_corpus.py — tests target _get_conn/_in_memory_query/query_remedy
        #     removed from module during L0 Brahma seal (3a6ec226); planet case also mismatched.
        #     Re-enable when remedy_corpus retrieval interface is restored (L1 build arc).
        #   Re-enable when L0 engine rebuild re-populates these modules.
        # D15b-F2 (D-1.6 Lane S-6, 2026-07-16): bodha_writers/__tests__/ (74 tests, DB-free,
        # 0.06s) lives OUTSIDE tests/ and was never collected by this command — `pytest tests/`
        # is a positional-arg scope, not a repo-wide discovery, so a whole test package sat
        # invisible to CI. Added as a second positional arg; verified green standalone and in
        # combination with tests/ before landing here.
        #
        # CI efficiency audit (2026-07-31) — two changes, both count-verified:
        #   1. requirements.txt → requirements-ci.txt. The runtime file pulls
        #      sentence-transformers (→ torch), ragas, google-cloud-aiplatform, openai,
        #      anthropic and tiktoken, none of which this suite imports; the install was
        #      145s. The CI file is the verified subset (10s). See its header before
        #      editing — geopy/geocoder/timezonefinder/pytz are NOT dead entries, PyJHora
        #      imports them internally, and httpx is required by starlette.testclient.
        #   2. NO pytest-xdist — tried, then reverted as UNPROVEN (not as disproven).
        #      `-n 4 --dist loadfile` was 2.9x faster locally (226s -> 78s). Three CI
        #      samples of the identical suite (4647 passed / 12 skipped every time):
        #          285.77s  serial, full reqs   (run 30587431953)
        #          323.49s  xdist -n 4          (run 30594499554)
        #          422.22s  serial, slim reqs   (run 30595102066)
        #      Serial alone spans 285s..422s, and the xdist sample sits INSIDE that
        #      range — so this runner's variance is larger than the effect being
        #      measured, and n=1 per arm proves nothing either way. Reverted because
        #      unproven complexity is not worth carrying, NOT because xdist is slower.
        #      To settle it, run each arm several times and compare medians; do not
        #      re-add (or re-reject) on a single sample.
        # Verified in a clean venv against the slim file: 4647 passed, 12 skipped,
        # 7 subtests passed — identical to the pre-change run. Any drift is a regression.
        run: |
          pip install -r platform/python-sidecar/requirements-ci.txt --quiet
          cd platform/python-sidecar
          pytest tests/ bodha_writers/__tests__ \
            --ignore=tests/test_pyjhora_adapter \
            --ignore=tests/test_dasha_chain.py \
            --ignore=tests/extractors/test_cgm_extractor.py \
            --ignore=tests/test_l0_remedy_corpus.py \
            -m "not integration" \
            -q --tb=short --no-header

