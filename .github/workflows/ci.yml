name: CI — Ganga Quality Gate

# DUPLICATE-TRIGGER FIX (CI efficiency audit, 2026-07-31). The `push:` list used to
# include 'feature/**'. That caused a PR opened from such a branch to run this
# entire workflow TWICE per push — once for `push`, once for `pull_request` — because
# the two events land in DIFFERENT concurrency groups (`github.ref` is
# refs/heads/<branch> for push but refs/pull/<n>/merge for pull_request), so the
# concurrency block below cannot dedupe them.
#
# This was PROVEN, not assumed. A scratch branch `feature/ci-concurrency-probe` with an
# open PR was pushed to, and commit d8e82d5 produced BOTH a push run and a
# pull_request run of all four always-on workflows — 8 runs for one commit. (The same
# probe also confirmed the concurrency groups DO work within an event type: push A's
# four runs went `cancelled` the instant push B landed 7s later.)
#
# `push: [main]` is retained — post-merge runs on main are legitimate and gate deploy.
# To revert: put 'feature/**' back in the push branches list.
on:
  push:
    branches: [main]
  pull_request:
    # shad-darshana/integration (added 2026-08-01, resume-rebase): the campaign's lane
    # PRs target this branch, not main (SHAD_DARSHANA_NIGHT_RUN_v1_0.md §B.1, v1.1) --
    # deliberately pull_request-only, NOT also added to push.branches above, precisely
    # to avoid recreating the double-fire bug this file's own DUPLICATE-TRIGGER FIX
    # (above) just proved and eliminated for 'feature/**': the final gate-close PR's
    # HEAD branch is shad-darshana/integration itself, so if that branch were also in
    # push.branches, a push landing on it while that PR is open would fire both a push
    # run and a pull_request(synchronize) run for the same commit.
    #
    # parishkara/integration (added 2026-08-10, PARIṢKĀRA remediation campaign, native
    # go-ahead — carve-in per campaign-coordination §3): same reasoning as
    # shad-darshana/integration above — pull_request-only, not in push.branches, since
    # parishkara/integration is itself the HEAD branch of the campaign's gate-close PR.
    # Root cause this fixes: every PARIṢKĀRA lane PR into parishkara/integration ran
    # ZERO CI checks (branch was never in this allowlist), merging on PARĪKṢAKA verifier
    # verdict alone. This is additive only — no existing trigger path changes.
    branches: [main, 'shad-darshana/integration', 'parishkara/integration']
  # MERGE-QUEUE PRECONDITION (CI efficiency audit, 2026-07-31). This is the ONLY change in
  # the PR that adds it, deliberately, because getting it wrong hangs every queued PR.
  #
  # A merge queue runs its checks against a temporary `refs/heads/gh-readonly-queue/...`
  # ref and reports them on a `merge_group` event. A required check whose workflow does
  # not declare `merge_group:` NEVER REPORTS on that event, and the queue waits for it
  # forever. All four of this repo's required checks — TypeScript (src only), Unit Tests,
  # Secret Scan (unit 0b.2), Governance Gates — live in THIS file, so this trigger is
  # exactly what makes a queue viable here.
  #
  # No other workflow needs it: nothing else in .github/workflows/ contributes a required
  # check (verified 2026-07-31 against branch protection). The advisory workflows are
  # deliberately left off the queue — they would double queue latency for checks that
  # cannot block a merge anyway.
  #
  # shad-darshana/integration is NOT on the merge queue (the ruleset that defines it
  # targets refs/heads/main only, per repos/.../rulesets/20141220 -- verified 2026-08-01)
  # so this stays [main] only; do not add the integration branch here.
  #
  # Shape copied from this repo's own prior art: the (now-deleted) chat-v2-smoke.yml
  # declared `merge_group: branches: [main]`. Recovered from cec28c1c^.
  #
  # To revert: delete these three lines.
  merge_group:
    branches: [main]
  # D-2 Lane V-0 (BIND_D-2.md §F1.7 ledger row 2): the census-battery job below hits the LIVE
  # deployed connector with real credentials and takes several minutes (135-tool paced sweep) —
  # it must never run on every push/PR (cost, rate-limit risk, and it needs a secret that may not
  # exist on every fork/branch). workflow_dispatch is the minimal addition that lets the wave's
  # gate runner (CONDUCTOR_PROTOCOL §2 step 7) invoke it on demand via `gh workflow run` without
  # changing push/pull_request behavior for any other job in this file.
  workflow_dispatch:

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes.
#
# Cancellation is scoped to pull_request ONLY — the force-push/rebase churn this was
# aimed at. Two events must never be cancelled:
#   - push to main: deploy.yml triggers on this workflow's `workflow_run` completion, so
#     cancelling a main run would swallow the deploy it was supposed to gate.
#   - merge_group: a cancelled check on a queue ref can be read as a failure and evict the
#     PR from the queue. Note the previous expression (`github.ref != 'refs/heads/main'`)
#     would have evaluated TRUE for a merge-queue ref
#     (refs/heads/gh-readonly-queue/main/...) and cancelled it — corrected here as part of
#     making the queue viable, since queue refs did not exist when that expression was
#     written.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: TypeScript (src only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: tsc — src only (exclude tests)
        # Capture tsc output; only fail on errors outside test directories.
        # Uses || true so set -e doesn't abort before we can inspect output.
        # Filters both tests/ and __tests__/ paths (grep -v "tests/" misses __tests__/).
        run: |
          tsc_out=$(npx tsc --noEmit --skipLibCheck 2>&1 || true)
          non_test=$(printf '%s\n' "$tsc_out" | grep "error TS" | grep -Ev "(tests/|__tests__/)" || true)
          if [ -n "$non_test" ]; then printf '%s\n' "$non_test"; exit 1; fi

  typecheck-mcp:
    name: TypeScript — platform-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform-mcp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      NODE_ENV: test
    steps:
      # SAMPURTI-fix (2026-08-10): citation_verify_gate.test.ts resolves historical commit SHAs via
      # `git cat-file -e`; default depth=1 (shallow clone) fails for any SHA not at HEAD. Full
      # history required so all census-evidence citations resolve during the test run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci

      - name: MIG-1 — migration number guard (cross-directory duplicate)
        # DURABLE GUARD. SAMĀPTI brief v2.0 §4.4 · protocol:
        # 00_ARCHITECTURE/MIGRATION_AND_MERGE_PROTOCOL_v1_0.md
        #
        # The repo has TWO migration directories sharing ONE number sequence
        # (platform/migrations/ + platform/supabase/migrations/), and migrate.ts keys
        # _migrations_applied on the bare filename — so nothing ever enforced the number.
        # 467 was consequently claimed by two branches at once (f7160b5c vs 455033ed) and
        # only untangled by a manual renumber (75a5d9e6). This step fails the PR instead.
        #
        # Runs BEFORE `npm test` on purpose: a number collision is a merge-coordination
        # fault, and the author should see it in the first seconds of CI, not after the
        # full suite. Also covered by tests/unit/migrations/migration_number_guard.test.ts
        # under `npm test`; this step exists so the failure is unmistakable in the log
        # (same rationale as WP-1.7 / GT-36 below).
        #
        # Mutation-proven: adding a duplicate number in EITHER directory makes it exit 1.
        run: npm run guard:migration-numbers


      - run: npm test -- --reporter=verbose

      - name: WP-1.7 — MCP surgical whitelist resolution invariant (LCA-1/LCA-13)
        # DURABLE GUARD. Fails CI if ANY MCP_TO_RETRIEVAL_TOOL whitelist value fails to
        # resolve end-to-end via getToolByName (the local-bench-vs-deployed root cause:
        # whitelisted tool names whose targets were absent from TOOL_NAME_TO_URI → 500).
        # Runs as a dedicated, named gate (also covered by `npm test`) so a regression is
        # unmistakable in CI logs. Mutation-proven: removing a URI makes this step fail.
        run: npx vitest run src/lib/retrieval/registry/whitelist_resolution_invariant.test.ts

      - name: GT-36 — parity_check bridge-failure invariant (RETRIEVAL_PLANE_ELEVATION_PLAN §1.5/§3 R-0.5)
        # DURABLE GUARD. checkParity()/runParityCheck() previously had NO caller anywhere
        # in CI (confirmed dead by repo-wide grep during S-4 investigation) and carried a
        # bug where a failed MCP bridge import silently downgraded to an empty URI set,
        # auto-passing whenever the Consume Chat registry was also empty. This step is now
        # the live enforcement of the fixed invariant: a failed bridge import is ALWAYS a
        # hard failure. Run as a dedicated, named gate for the same "unmistakable in CI
        # logs" reason as WP-1.7 above. Does NOT hard-gate on pre-existing MCP_TOOL_TO_URI
        # staleness (a separate, larger backlog — see parity_check.test.ts file header);
        # it hard-gates only on the bridge module failing to load.
        run: npx vitest run src/lib/retrieval/registry/parity_check.test.ts

  # ─────────────────────────────────────────────────────────────────────────────
  # SPLIT OUT of `unit-tests` (2026-07-31, CI close-out review of PR #895).
  #
  # The Postgres service and the 7 SAMĪKṢĀ DB-integration tests originally hung off
  # `unit-tests`, which is one of the FOUR REQUIRED checks on main. A service container
  # that fails to start there fails a required check and blocks EVERY merge in the repo,
  # including PRs with nothing to do with the sidecar or the DB. On its own job the
  # identical flake is contained and diagnosable, and `unit-tests` keeps exactly the
  # dependency surface it had before.
  #
  # The container itself is approved on its merits: a directly-measured 31s
  # `Initialize containers` buys 7 real DB-integration tests (verified against main:
  # same 713 test files, 670 passed/43 skipped -> 677 passed/36 skipped).
  #
  # NOT a required check, deliberately — adding one is a branch-protection decision, not
  # a workflow edit. To revert the split: move `services:`, the two SAMIKSHA_* env vars
  # and the provision step back onto `unit-tests` and delete this job.
  # ─────────────────────────────────────────────────────────────────────────────
  db-integration-tests:
    name: DB Integration Tests (SAMĪKṢĀ, throwaway Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      NODE_ENV: test
      # Two separate databases, deliberately: samiksha_test carries migration 470
      # pre-applied (the files that assume the ledger table already exists — see
      # l5_roundtrip_harness.sh, the pattern this mirrors); samiksha_e2e is left bare
      # because confirm_e2e.db.test.ts builds its own idempotent schema and would collide
      # with samiksha_test's partial message_parts stub otherwise.
      SAMIKSHA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/samiksha_test
      SAMIKSHA_E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/samiksha_e2e
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci

      - name: SAMĀPTI A5/G3 — provision the SAMĪKṢĀ throwaway test DB
        # Mirrors platform/tests/pariprashna/samiksha/l5_roundtrip_harness.sh's local
        # recipe: a minimal message_parts(id) stub (just enough for migration 470's FK to
        # resolve) then migration 470 itself, the real DDL these tests run against.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE samiksha_test;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE samiksha_e2e;"
          psql -h localhost -U postgres -d samiksha_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h localhost -U postgres -d samiksha_test -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE message_parts (id uuid PRIMARY KEY DEFAULT gen_random_uuid());"
          psql -h localhost -U postgres -d samiksha_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/470_pariprashna_samiksha_prediction_ledger.sql
          psql -h localhost -U postgres -d samiksha_test -v ON_ERROR_STOP=1 \
            -c "SELECT to_regclass('public.brahma_mimamsa_prediction_ledger') AS ledger;"

      - name: SAMĪKṢĀ DB-integration suites (skip themselves without the env vars above)
        run: npx vitest run tests/pariprashna/samiksha src/lib/pariprashna/samiksha --reporter=verbose

      - name: RATE-07 — provision the rate-limit bucket DB (migration 580, real file)
        # A third throwaway database, bare: migration 580 is self-contained
        # (CREATE TABLE IF NOT EXISTS, no FK to anything) and applying the REAL
        # migration file — rather than a hand-copied DDL — is the point. If the
        # migration and the code ever disagree, this step is where it surfaces.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE rate07_test;"
          psql -h localhost -U postgres -d rate07_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/580_mcp_oauth_rate_buckets.sql
          psql -h localhost -U postgres -d rate07_test -v ON_ERROR_STOP=1 \
            -c "SELECT to_regclass('public.mcp_rate_buckets') AS buckets;"

      - name: RATE-07 — cross-instance atomicity + TTL cleanup against real Postgres
        # The claim "concurrent charges each observe a distinct count" rests on
        # Postgres serialising ON CONFLICT DO UPDATE per row. A mocked test cannot
        # establish that; this step is the detector behind the claim (§N.8).
        env:
          MCP_RATE_LIMIT_DB_TEST: '1'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rate07_test
        run: npx vitest run src/lib/__tests__/mcp/oauth_rate_limit.db.test.ts --reporter=verbose

  pratijna-v4-fixture-property-tests:
    # PRATIJÑĀ v4 Lane B3 — the CI tier of the campaign's three-tier
    # verification plan (00_ARCHITECTURE/briefs/adhisthana/MASTER_PLAN_v1_0.md
    # §5): "real-data snapshot fixture (one chart's facts+signals+Index
    # exported, versioned, refresh procedure documented) + property tests".
    #
    # Pattern chosen: the `db-integration-tests` job immediately above (a
    # throwaway `postgres:16` service container this job restores its own
    # schema+data into), NOT `fresh_chart_smoke.yml`'s full-production-schema
    # snapshot-and-restore. Rationale (disclosed per this lane's own task
    # brief, which asked for this choice to be justified): the property tests
    # here only ever touch 5 specific tables (chart_divisionals, chart_facts,
    # chart_fact_identity, reference_planets, charts) via ChartReaderV4/
    # PratijnaV4Engine — a committed, versioned, ~1.8MB gzipped fixture
    # (platform/python-sidecar/tests/fixtures/pratijna_v4_snapshot/) restores
    # in seconds and needs no live Cloud SQL Auth Proxy connection at all,
    # unlike fresh_chart_smoke.yml's full-schema approach (which exists for a
    # DIFFERENT purpose — catching schema/vocabulary drift across the ENTIRE
    # 107-asset writer fleet, not exercising one already-built engine against
    # one chart's already-computed facts). Runs on every PR (unlike
    # fresh_chart_smoke.yml's Wednesday-only cadence) because restoring a
    # ~1.8MB fixture and running the engine against it is fast enough to gate
    # every PR on, and this is exactly the kind of regression (a change to
    # bo_pratijna_v4_engine.py/bo_pratijna_karyatva.py silently breaking one
    # of the master plan's named properties) that should fail loudly on the
    # PR that introduces it, not wait for a weekly smoke run.
    name: PRATIJÑĀ v4 Fixture Property Tests (Lane B3)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pratijna_v4_fixture
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            platform/python-sidecar/requirements-ci.txt

      - name: Install Python dependencies
        run: pip install -r platform/python-sidecar/requirements-ci.txt --quiet

      - name: Provision the fixture database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE pratijna_v4_fixture;"

      - name: Restore the pratijna_v4_snapshot fixture (schema + gzipped per-table CSVs)
        # See platform/python-sidecar/tests/fixtures/pratijna_v4_snapshot/README.md
        # for what this fixture is and how to regenerate it, and
        # platform/scripts/fixtures/restore_pratijna_v4_snapshot.py's own
        # module docstring for the restore procedure itself (identical to
        # what a developer runs locally to reproduce this job).
        run: |
          python3 platform/scripts/fixtures/restore_pratijna_v4_snapshot.py "$DATABASE_URL"

      - name: pytest — PRATIJÑĀ v4 CI-tier property tests
        # Mutation-proven properties, not rubber stamps: three of these
        # tests (test_near_maximal_occurrence_check_is_a_real_detector,
        # test_citation_resolution_check_is_a_real_detector,
        # test_r13_audit_check_is_a_real_detector) exist specifically to
        # prove the OTHER property checks in this file would actually catch
        # a seeded defect, not just pass vacuously on the one fixture chart
        # available (§N.8 Earned-Signal Principle).
        working-directory: platform/python-sidecar
        run: |
          pytest tests/test_pratijna_v4_snapshot_properties.py -v --tb=short

  planner-regression:
    name: Planner Regression Gate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: platform

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Planner regression gate (mocked — no LLM)
        # Replays fixtures/regression_baseline.json through the scoring path.
        # Asserts tool_recall >= RECALL_THRESHOLD and tool_precision >= PRECISION_THRESHOLD
        # as defined in planner_smoke_runner.ts. No live LLM calls; no secrets required.
        run: npm run eval:planner-regression

      - name: Registry regression guard (BF.GAP.001 — no LLM)
        # Pure data assertions on MODELS/STACK_ROUTING/FAMILY_WORKER.
        # Guards against deepseek-v4-flash re-entering routing tables.
        run: npx vitest run tests/planner --reporter=verbose

  icr-pr-gate:
    name: ICR PR Gate (synthetic smoke)
    runs-on: ubuntu-latest
    # continue-on-error: true — PERMANENT DESIGN DECISION (not a temp soft-pass)
    # The --dry-run --synthetic invocation tests script importability only.
    # Real ICR gate behavior runs in icr_weekly_scan.yml (Sunday cadence).
    # Hardening this to a hard gate would require a live DB + real PR diff context
    # which is not available in the PR CI environment. Do not remove this flag.
    continue-on-error: true
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: ICR gate — synthetic conflict detection smoke
        # Runs the gate against a synthetic MSR fragment containing one citation-free
        # signal. Gate must exit non-zero (detecting the violation) — tested via vitest
        # in tests/icr/icr_pr_gate.test.ts. This CI step runs a dry-run to ensure
        # the script is importable and executes without syntax errors.
        run: |
          npx tsx scripts/governance/icr_pr_gate.ts --dry-run --synthetic
          echo "icr_pr_gate_importable: PASS"

  secret-scan:
    # NAME KEPT AS-IS (DVA RULING 82): main's branch protection requires the
    # status-check CONTEXT "Secret Scan (unit 0b.2)" by exact name
    # (strict: true, enforce_admins: true). Renaming this job — even to a more
    # accurate "repo-wide" label — breaks that binding: every future PR would
    # face a permanently-pending required check, the exact setup for someone to
    # "fix" by deleting the required-context binding later. The scope widening
    # itself (see the comment block below) is real and unaffected by the name.
    name: Secret Scan (unit 0b.2)
    runs-on: ubuntu-latest
    # Stream B modernization unit 0b.2 — on_red: halt_queue.
    #
    # BLOCKING. No `continue-on-error` — a red job here makes this workflow red,
    # and "Deploy to Cloud Run" fires on `workflow_run` gated on this workflow's
    # conclusion == 'success', so a literal credential also blocks the deploy.
    # Do not add `continue-on-error` to this job.
    #
    # Scope widened 2026-07-30 (SAMĀPTI DVĀRAPĀLA RULING 3, lane
    # B-SECRETSCAN-SCOPE): the scanner previously read an allowlist of 8
    # directories while claiming a repo-wide scan, and a live production DB
    # credential sat unseen in 27 tracked files for ~2 months. See the §SCOPE
    # block in secret_scan.sh for the current, reconciled bounds.

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # DVA RULING 30 — the gate must measure the tree that is actually being
        # merged, never a stale or partial one.
        #   · on pull_request, actions/checkout@v4 checks out refs/pull/N/merge
        #     — the merge of the PR head into the base. That IS the tree that
        #     lands, and is exactly what must be scanned. Do not override `ref:`
        #     to github.event.pull_request.head.sha: that would scan the branch
        #     in isolation and miss a credential arriving via the base.
        #   · `git ls-files` (the scanner's file enumeration) needs the index,
        #     which a depth-1 checkout provides. Do not switch to a sparse or
        #     partial checkout — a smaller tree is a smaller census.
        # The scanner prints the SHA it actually scanned in its own output, so
        # every CI log states what was measured.

      - name: Report the tree under scan
        # Provenance, printed before any verdict: "a census that cannot say what
        # it measured is not a census."
        run: |
          echo "event=${{ github.event_name }}"
          echo "scanning commit: $(git rev-parse HEAD)"
          echo "base ref:        ${{ github.base_ref || github.ref_name }}"
          git status --porcelain | head -5

      - name: Self-test scanner against fixtures
        # Three assertions, all blocking:
        #   1. every secret_scan_fixtures/fail/* trips the scanner — including
        #      the five fixtures reproducing the SAMAPTI-SEC-001 shapes;
        #   2. every secret_scan_fixtures/pass/* stays clean (no false positives);
        #   3. the scan surface actually reaches 00_ARCHITECTURE/,
        #      platform/migrations/, platform/src/, platform-mcp/src/, infra/
        #      and 99_ARCHIVE/ — the trees the old allowlist could not see.
        # (3) is what stops this gate from ever going green by scanning nothing.
        run: bash platform/scripts/governance/secret_scan.sh --self-test

      - name: Scan repository for literal credentials
        # Repo-wide: every file `git ls-files --cached --others --exclude-standard`
        # reports, minus the explicitly-reasoned SUPPRESS_RE exclusions.
        # Fails on ANY finding not itemized in secret_scan_inherited.txt, on any
        # itemized finding whose count grew, and on any itemized finding past its
        # expiry date. The register can only shrink or expire.
        run: bash platform/scripts/governance/secret_scan.sh

  coverage-gate:
    name: Coverage Gate (COV-S7)
    runs-on: ubuntu-latest
