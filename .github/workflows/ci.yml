name: CI — Ganga Quality Gate

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  # D-2 Lane V-0 (BIND_D-2.md §F1.7 ledger row 2): the census-battery job below hits the LIVE
  # deployed connector with real credentials and takes several minutes (135-tool paced sweep) —
  # it must never run on every push/PR (cost, rate-limit risk, and it needs a secret that may not
  # exist on every fork/branch). workflow_dispatch is the minimal addition that lets the wave's
  # gate runner (CONDUCTOR_PROTOCOL §2 step 7) invoke it on demand via `gh workflow run` without
  # changing push/pull_request behavior for any other job in this file.
  workflow_dispatch:

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes.
#
# cancel-in-progress is deliberately FALSE on main: deploy.yml triggers on this
# workflow's `workflow_run` completion, so cancelling a main run would swallow the
# deploy that run was supposed to gate. On PR branches (the force-push/rebase churn
# this is actually aimed at) superseded runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    name: TypeScript (src only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: tsc — src only (exclude tests)
        # Capture tsc output; only fail on errors outside test directories.
        # Uses || true so set -e doesn't abort before we can inspect output.
        # Filters both tests/ and __tests__/ paths (grep -v "tests/" misses __tests__/).
        run: |
          tsc_out=$(npx tsc --noEmit --skipLibCheck 2>&1 || true)
          non_test=$(printf '%s\n' "$tsc_out" | grep "error TS" | grep -Ev "(tests/|__tests__/)" || true)
          if [ -n "$non_test" ]; then printf '%s\n' "$non_test"; exit 1; fi

  typecheck-mcp:
    name: TypeScript — platform-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform-mcp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci

      - name: MIG-1 — migration number guard (cross-directory duplicate)
        # DURABLE GUARD. SAMĀPTI brief v2.0 §4.4 · protocol:
        # 00_ARCHITECTURE/MIGRATION_AND_MERGE_PROTOCOL_v1_0.md
        #
        # The repo has TWO migration directories sharing ONE number sequence
        # (platform/migrations/ + platform/supabase/migrations/), and migrate.ts keys
        # _migrations_applied on the bare filename — so nothing ever enforced the number.
        # 467 was consequently claimed by two branches at once (f7160b5c vs 455033ed) and
        # only untangled by a manual renumber (75a5d9e6). This step fails the PR instead.
        #
        # Runs BEFORE `npm test` on purpose: a number collision is a merge-coordination
        # fault, and the author should see it in the first seconds of CI, not after the
        # full suite. Also covered by tests/unit/migrations/migration_number_guard.test.ts
        # under `npm test`; this step exists so the failure is unmistakable in the log
        # (same rationale as WP-1.7 / GT-36 below).
        #
        # Mutation-proven: adding a duplicate number in EITHER directory makes it exit 1.
        run: npm run guard:migration-numbers

      - run: npm test -- --reporter=verbose

      - name: WP-1.7 — MCP surgical whitelist resolution invariant (LCA-1/LCA-13)
        # DURABLE GUARD. Fails CI if ANY MCP_TO_RETRIEVAL_TOOL whitelist value fails to
        # resolve end-to-end via getToolByName (the local-bench-vs-deployed root cause:
        # whitelisted tool names whose targets were absent from TOOL_NAME_TO_URI → 500).
        # Runs as a dedicated, named gate (also covered by `npm test`) so a regression is
        # unmistakable in CI logs. Mutation-proven: removing a URI makes this step fail.
        run: npx vitest run src/lib/retrieval/registry/whitelist_resolution_invariant.test.ts

      - name: GT-36 — parity_check bridge-failure invariant (RETRIEVAL_PLANE_ELEVATION_PLAN §1.5/§3 R-0.5)
        # DURABLE GUARD. checkParity()/runParityCheck() previously had NO caller anywhere
        # in CI (confirmed dead by repo-wide grep during S-4 investigation) and carried a
        # bug where a failed MCP bridge import silently downgraded to an empty URI set,
        # auto-passing whenever the Consume Chat registry was also empty. This step is now
        # the live enforcement of the fixed invariant: a failed bridge import is ALWAYS a
        # hard failure. Run as a dedicated, named gate for the same "unmistakable in CI
        # logs" reason as WP-1.7 above. Does NOT hard-gate on pre-existing MCP_TOOL_TO_URI
        # staleness (a separate, larger backlog — see parity_check.test.ts file header);
        # it hard-gates only on the bridge module failing to load.
        run: npx vitest run src/lib/retrieval/registry/parity_check.test.ts

  planner-regression:
    name: Planner Regression Gate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: platform

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Planner regression gate (mocked — no LLM)
        # Replays fixtures/regression_baseline.json through the scoring path.
        # Asserts tool_recall >= RECALL_THRESHOLD and tool_precision >= PRECISION_THRESHOLD
        # as defined in planner_smoke_runner.ts. No live LLM calls; no secrets required.
        run: npm run eval:planner-regression

      - name: Registry regression guard (BF.GAP.001 — no LLM)
        # Pure data assertions on MODELS/STACK_ROUTING/FAMILY_WORKER.
        # Guards against deepseek-v4-flash re-entering routing tables.
        run: npx vitest run tests/planner --reporter=verbose

  icr-pr-gate:
    name: ICR PR Gate (synthetic smoke)
    runs-on: ubuntu-latest
    # continue-on-error: true — PERMANENT DESIGN DECISION (not a temp soft-pass)
    # The --dry-run --synthetic invocation tests script importability only.
    # Real ICR gate behavior runs in icr_weekly_scan.yml (Sunday cadence).
    # Hardening this to a hard gate would require a live DB + real PR diff context
    # which is not available in the PR CI environment. Do not remove this flag.
    continue-on-error: true
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: ICR gate — synthetic conflict detection smoke
        # Runs the gate against a synthetic MSR fragment containing one citation-free
        # signal. Gate must exit non-zero (detecting the violation) — tested via vitest
        # in tests/icr/icr_pr_gate.test.ts. This CI step runs a dry-run to ensure
        # the script is importable and executes without syntax errors.
        run: |
          npx tsx scripts/governance/icr_pr_gate.ts --dry-run --synthetic
          echo "icr_pr_gate_importable: PASS"

  secret-scan:
    name: Secret Scan (unit 0b.2)
    runs-on: ubuntu-latest
    # Stream B modernization unit 0b.2 — on_red: halt_queue.
    # Any literal credential introduced by a future PR fails this job.

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test scanner against fixtures
        # Validates that the scanner catches seeded fail fixtures and
        # tolerates pass fixtures. Exits non-zero if either side breaks.
        run: bash platform/scripts/governance/secret_scan.sh --self-test

      - name: Scan tree for literal credentials
        # Scans scripts/, platform/scripts/, platform-mcp/scripts/,
        # .github/workflows/, and cloudbuild*.yaml files. Hard fail on
        # any literal credential. Prefers gitleaks if on PATH.
        run: bash platform/scripts/governance/secret_scan.sh

  coverage-gate:
    name: Coverage Gate (COV-S7)
    runs-on: ubuntu-latest
    # continue-on-error removed 2026-05-25: M5 Coverage Campaign is COMPLETE and the
    # baseline is now clean (exit 0). Gate is a hard blocker from this point forward.

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Coverage gate — manifest + asset binding check
        # Fails if any tool in RETRIEVAL_TOOLS[] has no manifest entry (exit 1)
        # or any canonical asset layer dir has no tool_name binding (exit 2)
        # or both (exit 3). Exit 0 = all checks pass. See COV-S7_BRIEF_v1_0.md.
        run: python platform/scripts/governance/coverage_gate.py

  naming-lint:
    name: Naming Governance Gate (unit 0a.0)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Naming lint — self-test (bundled fixtures)
        # Bundled PASS/FAIL fixtures verify the linter wires through correctly
        # before scanning the real repo.
        run: python platform/scripts/governance/naming_lint.py --self-test

      - name: Naming lint — repo scan (baseline-aware)
        # Fails ONLY on NEW violations not in naming_baseline.json. Pre-existing
        # violations are reported but not failing — they're tracked for later
        # waves to clean up. See platform/scripts/governance/naming_rules.yaml.
        run: python platform/scripts/governance/naming_lint.py

  fact-category-pin-lint:
    # ŚUDDHA-VĀCA Phase C, lane:ci-lint (brief §5 C.7 — the systemic guard).
    # Permanent CI enforcement against the whole "D1 defect class": a selector
    # that picks/reduces a chart_facts row by fact_category alone, without
    # pinning fact_key, so which row wins is undefined the moment more than
    # one row matches (the exact bugs fixed individually this wave in
    # bo_laksana.py P0-5 and registry_bridge.ts P0-1 — see
    # SUDDHA_VACA_FIX_LEDGER_v1_0.md). Stdlib-only script (no pyyaml needed).
    name: Fact-Category Pinning Gate (§5 C.7)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fact-category pin lint — self-test (bundled fixtures)
        # Bundled PASS/FAIL fixtures (Python SQL + TypeScript .find/.filter)
        # prove the scanner catches the unsafe pattern in both languages and
        # does NOT flag the correctly key-pinned + ordered/sorted form, before
        # it's trusted to scan the real repo.
        run: python platform/scripts/governance/check_fact_category_pinning.py --self-test

      - name: Fact-category pin lint — repo scan (allowlist-aware)
        # Fails ONLY on violations not present in
        # fact_category_pin_allowlist.json, each entry of which carries a
        # written justification. Pre-existing debt found at rollout is
        # allowlisted with an honest disposition (see that file); a NEW,
        # non-allowlisted violation is always a hard fail — this lint has no
        # baseline-style auto-accept for future violations.
        run: python platform/scripts/governance/check_fact_category_pinning.py

  earned-signal-lint:
    # SAMĀPTI v2.0 §7.5, lane B-N8-LINT — the standing CLAUDE.md §N.8
    # Earned-Signal guard, and a deliberate sibling to fact-category-pin-lint
    # above (same shape: bundled fixtures + self-test, then an allowlist-aware
    # repo scan). Enforces ONE mechanisable corollary of §N.8: a field whose
    # name asserts a status / verification / grade / gate / violation-count must
    # not be bound to an edit-time constant — the sanctioned value for a signal
    # with no detector is None/null, in either polarity. The ground-truth
    # defects it was calibrated against are F-09/F-10/F-11/F-23 in
    # 00_ARCHITECTURE/briefs/samapti/SAMAPTI_N8_EARNED_SIGNAL_REGISTER_v1_0.md.
    #
    # SCOPE, STATED HONESTLY (the lane's own charter forbids overclaiming): this
    # catches the LITERAL class only. PROXY, dataflow-TAUTOLOGY and
    # CANNOT-FAIL-GATE findings are NOT caught, and a green here is not evidence
    # that a status field is earned. The script's module docstring enumerates
    # every uncaught class and every deliberate suppression, with counts.
    # Stdlib-only script (no pyyaml needed).
    name: Earned-Signal Gate (§N.8)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Earned-signal lint — self-test (bundled fixtures)
        # The lint's own can-fail proof. FAIL fixtures cover all five Python
        # binding sites and both TypeScript ones, and each declares an exact
        # EXPECT-VIOLATIONS count so a partial regression (four of five sites
        # still firing) fails rather than passing quietly. PASS fixtures pin the
        # boundary: a real detector, an honest None, a rebound counter, a
        # string-literal union in a type position, and — deliberately — register
        # finding F-07, a PROXY violation this lint does not claim to catch.
        run: python platform/scripts/governance/check_earned_signal.py --self-test

      - name: Earned-signal lint — repo scan (allowlist-aware)
        # Fails ONLY on violations not present in earned_signal_allowlist.json.
        # That file records 169 pre-existing violations across 81 (file, field)
        # groups found at rollout, each with a stated disposition CATEGORY —
        # including entries that say plainly "not individually reviewed", which
        # is the §N.8-honest disposition rather than a fabricated justification.
        # Each group is frozen by `max_occurrences`: the backlog can be paid
        # down but never grown, and occurrence N+1 in a covered group is a hard
        # fail exactly like a brand-new one.
        run: python platform/scripts/governance/check_earned_signal.py

  governance-gates:
    # v1.2 follow-on (2026-05-28): four gates from session_queue.yaml that the
    # seal-time ci.yml was missing (per OPERATOR_CLEANUP_REPORT_v1_0 line 57 +
    # v1.2 patch §R5). Each step is non-blocking on the existing baseline
    # (exit-code-3 known_residuals whitelist) but blocks NEW regressions.
    name: Governance Gates (drift / schema / edge / native-literal / py-sidecar)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # CI efficiency audit (2026-07-31): the sidecar install below was 145s of
          # this job's 435s, uncached on every run. Caching keyed on both requirement
          # files so a change to either invalidates correctly.
          cache: 'pip'
          cache-dependency-path: |
            platform/python-sidecar/requirements-ci.txt

      - name: Install Python dependencies
        run: pip install pyyaml pytest

      - name: drift_detector — repo scan
        # Exit code policy: 0=clean, 3=baseline residuals (both pass), 1/2=regression (fail).
        # exit 0 = clean; exit 3 = known_residuals (whitelisted, passes CI)
        # Whitelist location: platform/scripts/governance/drift_detector.py known_residuals[]
        # Current whitelisted tickets: WARN.2–WARN.8 (dead Gemini mirror pointers,
        # historical PHASE_B_PLAN refs — booked for quarterly governance pass 2026-07-24)
        # exit 1 or 2 = real failure; investigate immediately
        # Use || to capture exit code without set -e aborting on non-zero exit.
        run: |
          ec=0; python platform/scripts/governance/drift_detector.py || ec=$?
          [ "$ec" = 0 ] || [ "$ec" = 3 ] || { echo "drift_detector exit=$ec (expected 0 or 3)"; exit "$ec"; }

      - name: schema_validator — repo scan
        # Hard gate: SESSION_LOG governance pass (2026-05-31) confirmed all 4 previously-known
        # pre-existing entries (GH-LEARNING-LAYER-FRONTMATTER, DAR-P7-S26,
        # UDA-1-GOVERNANCE-CLOSE, UDA-234-GOVERNANCE-CLOSE) now have valid
        # session_open/session_close YAML blocks. schema_validator exits 0. Gate hardened.
        run: |
          ec=0; python platform/scripts/governance/schema_validator.py || ec=$?
          [ "$ec" = 0 ] || [ "$ec" = 3 ] || { echo "schema_validator exit=$ec (regression — all known pre-existing violations were resolved 2026-05-31)"; exit "$ec"; }

      - name: msr_referential_integrity — self-test (§N.5 constituent guard)
        # Hard gate (WP-2.4 / LCA-9b-5). Every bodha_msr_signals.constituent_facts_array
        # entry MUST resolve to a real chart_facts.fact_id (CLAUDE.md §N.5). The
        # DB-free --self-test proves the guard by mutation: it exits 1 unless the
        # clean fixture is clean AND a fixture with one broken constituent is caught.
        # Live-DB scan (--chart-id) runs at W3 rebuild verification.
        run: python platform/scripts/governance/msr_referential_integrity.py --self-test

      - name: assert_no_native_literal — repo scan
        # Hard gate: no literal native birth-chart values in code outside L1.
        # G4_no_native_lit per PROJECT_ARCHITECTURE B.10.
        run: bash platform/scripts/governance/assert_no_native_literal.sh

      - name: dag_edge_guard — self-test (§N.8 / SAMĀPTI F-02)
        # Hard gate. Before this step existed, dag_edge_guard's docstring claimed it ran
        # "as a CI gate" and caught undeclared-read drift "the moment" it appeared, while
        # its ONLY automated caller was a test carrying @pytest.mark.skipif(not
        # DATABASE_URL) — and CI has no DB, so it skipped on every run. No mutation to any
        # writer could turn it red. Three real HARD violations were found by a human
        # running it by hand, which is exactly what the claim said would not be necessary.
        #
        # SCOPE OF THIS GATE, stated so it is not itself an overclaim: --self-test is
        # DB-free and proves the DETECTOR by mutation (a seeded undeclared cross-asset
        # read must be flagged; the same read with the edge declared must come back
        # clean). It proves NOTHING about the live registry. The live scan needs
        # DATABASE_URL and runs in fresh_chart_smoke.yml — see that workflow and the
        # module docstring.
        run: |
          cd platform/python-sidecar
          python -m pipeline.orchestrator.dag_edge_guard --self-test

      - name: kala_derivation_completeness_guard — self-test (§N.8 / SAMĀPTI F-02)
        # Hard gate. Same class as above and worse: this guard had ZERO automated
        # invocation anywhere in the repo — its own test file exercises only the pure
        # evaluate() and never calls analyze()/main(). Nothing ran it.
        #
        # SCOPE: DB-free detector mutation proof only (clean fixture must stay clean; a
        # fixture with one seeded derivation gap must be caught). The live scan needs
        # DATABASE_URL *and* per-chart kala_* rows, so it runs in fresh_chart_smoke.yml
        # after the fixture-chart build — the only automated context with both.
        run: |
          cd platform/python-sidecar
          python -m pipeline.orchestrator.kala_derivation_completeness_guard --self-test

      - name: edge_security_smoke — sanity
        # Lightweight smoke: shell + yaml + JSON shape check on infra/edge
        # without an actual edge-stack endpoint. Full edge smoke depends on the
        # live HTTPS LB and is a deploy-time check, not a CI check.
        run: bash platform/scripts/governance/edge_security_smoke.sh --ci-only

      - name: pytest — pyjhora_adapter + pipeline
        # Hard gate. All tests here are self-contained (conn=None dry-run or
        # @pytest.mark.skipif(not DATABASE_URL) for integration tests).
        # test_a3_schema_smoke.py uses pytestmark to skip when DATABASE_URL
        # is absent — CI has no DB, so those 6 tests skip cleanly.
        # The || true soft-pass was removed 2026-05-30 (CF.V13.8 resolved).
        # natal_engine/ deleted by pyjhora engine replacement (2026-06-01);
        # pyjhora_adapter tests live under tests/test_pyjhora_adapter/ (covered by tests/).
        # TEARDOWN-EXCLUDED (Layer-0 rebuild arc, 2026-06-02):
        #   tests/test_pyjhora_adapter/ — pyjhora_adapter package cleared (empty dir);
        #   tests/test_dasha_chain.py — imports pipeline.transit_search (removed in teardown);
        #   tests/extractors/test_cgm_extractor.py — pipeline.extractors.cgm_extractor removed.
        #   tests/test_l0_remedy_corpus.py — tests target _get_conn/_in_memory_query/query_remedy
        #     removed from module during L0 Brahma seal (3a6ec226); planet case also mismatched.
        #     Re-enable when remedy_corpus retrieval interface is restored (L1 build arc).
        #   Re-enable when L0 engine rebuild re-populates these modules.
        # D15b-F2 (D-1.6 Lane S-6, 2026-07-16): bodha_writers/__tests__/ (74 tests, DB-free,
        # 0.06s) lives OUTSIDE tests/ and was never collected by this command — `pytest tests/`
        # is a positional-arg scope, not a repo-wide discovery, so a whole test package sat
        # invisible to CI. Added as a second positional arg; verified green standalone and in
        # combination with tests/ before landing here.
        #
        # CI efficiency audit (2026-07-31) — two changes, both count-verified:
        #   1. requirements.txt → requirements-ci.txt. The runtime file pulls
        #      sentence-transformers (→ torch), ragas, google-cloud-aiplatform, openai,
        #      anthropic and tiktoken, none of which this suite imports; the install was
        #      145s. The CI file is the verified subset (10s). See its header before
        #      editing — geopy/geocoder/timezonefinder/pytz are NOT dead entries, PyJHora
        #      imports them internally, and httpx is required by starlette.testclient.
        #   2. NO pytest-xdist — tried, then reverted as UNPROVEN (not as disproven).
        #      `-n 4 --dist loadfile` was 2.9x faster locally (226s -> 78s). Three CI
        #      samples of the identical suite (4647 passed / 12 skipped every time):
        #          285.77s  serial, full reqs   (run 30587431953)
        #          323.49s  xdist -n 4          (run 30594499554)
        #          422.22s  serial, slim reqs   (run 30595102066)
        #      Serial alone spans 285s..422s, and the xdist sample sits INSIDE that
        #      range — so this runner's variance is larger than the effect being
        #      measured, and n=1 per arm proves nothing either way. Reverted because
        #      unproven complexity is not worth carrying, NOT because xdist is slower.
        #      To settle it, run each arm several times and compare medians; do not
        #      re-add (or re-reject) on a single sample.
        # Verified in a clean venv against the slim file: 4647 passed, 12 skipped,
        # 7 subtests passed — identical to the pre-change run. Any drift is a regression.
        run: |
          pip install -r platform/python-sidecar/requirements-ci.txt --quiet
          cd platform/python-sidecar
          pytest tests/ bodha_writers/__tests__ \
            --ignore=tests/test_pyjhora_adapter \
            --ignore=tests/test_dasha_chain.py \
            --ignore=tests/extractors/test_cgm_extractor.py \
            --ignore=tests/test_l0_remedy_corpus.py \
            -m "not integration" \
            -q --tb=short --no-header

  density-census:
    # doctrine-waves D-1.5b Lane B-7 (CLAUDE.md §N.6 — Serving Density Principle).
    # Mechanically verifies the §N.6 density/layering discipline on the two surfaces that
    # implement it (judgment_query, ganita_yogas_get) — offline, no live MCP connector or DB
    # needed (see platform/scripts/audit/density_harness/run.ts's module doc-comment for the
    # BEHAVIORAL vs CENSUS assertion split). Scoped to two known-good test files rather than
    # platform-mcp's full `npm test` — that suite currently carries pre-existing unrelated
    # failures (tracked separately; not a B-7 regression) and wiring the whole suite into CI
    # is a follow-on hygiene item, not this lane's job.
    name: Density Census (§N.6)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Setup Python (vidhi registry parity gate shells the Python DB-seed writers)
        # PARIŚODHANA B2: check_vidhi_registry_parity.mjs runs `python bg_vidhi_*.py --dump-json`
        # (no DB, no pip deps — the writers guard their orchestrator import for standalone dump mode).
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: platform-mcp deps (density harness imports response_budget.ts)
        working-directory: platform-mcp
        run: npm ci
      - name: density_harness — §N.6 census + hardFloor behavioral proof
        run: npx tsx scripts/audit/density_harness/run.ts
      - name: response_budget hardFloor regression test (platform-mcp)
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/response_budget_hard_floor.test.ts
      - name: envelope codegen parity test (platform-mcp) — GT-9
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/r5_codegen_parity.test.ts
      - name: vidhi registry codegen drift check (platform) — GT-56
        run: npm run codegen:vidhi:check
      - name: vidhi registry codegen parity test (platform-mcp) — GT-56
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/vidhi_codegen_parity.test.ts
      - name: vidhi registry Ω8 parity gate (TS ↔ Python DB-seed writers ↔ Ω8-regen coverage) — PARIŚODHANA B2
        # Keeps the FOUR Vidhi registry copies (canonical TS, generated mirror, SQL seed, Python
        # seed writers) from silently drifting — the Python writers had drifted to 37 primitives /
        # 8 floors before B2 (a latent regression bomb). Deep-compares the canonical TS dump against
        # the two Python writers' --dump-json output + asserts Ω8-regen floor coverage + re-runs the
        # floor-coverage gate (14/14). See check_vidhi_registry_parity.mjs's header.
        run: node scripts/census/check_vidhi_registry_parity.mjs
      - name: R-1 projection compiler — generate (chat/MCP/census/docs projections, additive-only)
        # RETRIEVAL_PLANE_ELEVATION_PLAN_v1_0.md §3 R-1 item 2. DB-free (getCatalog() only
        # enumerates already-registered descriptor objects; TOOL_CONTRACTS is a static
        # in-memory array) — proves the generator runs clean against the live registry on
        # every push, same as the vidhi/envelope generators above. Writes NEW generated
        # artifacts under src/generated/projections/ + a comparison report under
        # 00_ARCHITECTURE/briefs/retrieval_impl/ — nothing here is wired into any live-
        # serving path (see the generator's own header comment).
        run: npm run codegen:projections
      - name: R-1 projection compiler parity/completeness gate
        # Same source, tested directly (r5_codegen_parity discipline): imports the SAME
        # pure builder functions the generator step above calls and asserts (1) every live
        # capability is accounted for by the census/chat/MCP/docs projections with no drops
        # or dupes, (2) every emitted entry is structurally valid (non-empty name/description,
        # valid JSON-Schema input_schema, MCP-legal tool names), and (3) the comparison
        # machinery vs. TOOL_CONTRACTS and the real registry_bridge.ts hand-written blocks is
        # itself sound (mechanical-extractor tripwire against silent breakage). Divergence
        # between generated and hand-written surfaces is EXPECTED and not itself a failure —
        # see R1_PROJECTION_COMPILER_REPORT.md.
        run: npx vitest run src/lib/retrieval/registry/__tests__/projection_compiler_parity.test.ts

  census-battery:
    # D-2 Lane V-0 (BRIEF_D2.md §F1 Lane V-0 / BIND_D-2.md §F1.7 ledger rows 1-5). Runs the
    # master-acceptance harness (§G.0 six wealth conclusions + the full paced 135-tool census +
    # completeness-receipt validator + alias-count check) against the DEPLOYED connector — this
    # is a live-estate check, not a source-tree check like density-census above, so it is
    # workflow_dispatch-only (see the `on:` block comment) and requires an MCP credential secret.
    # Manual invocation (the wave's gate runner, CONDUCTOR_PROTOCOL §2 step 7): `gh workflow run
    # "CI — Ganga Quality Gate" --ref <branch>` after adding this job's name to the dispatch, or
    # `gh workflow run ci.yml -f job=census-battery` once repo actions support job-level dispatch
    # inputs — until then, a workflow_dispatch run executes every job in this file; this job's
    # own `if` guard is what makes it a no-op on ordinary push/pull_request events.
    name: Census Battery (D-2 §G master gate)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: doctrine_harness — §G.0 wealth conclusions + census + receipt + alias check
        env:
          MARSYS_MCP_KEY: ${{ secrets.MARSYS_MCP_KEY }}
        run: |
          if [ -z "$MARSYS_MCP_KEY" ]; then
            echo "MARSYS_MCP_KEY secret not configured — skipping the live census battery (never a fabricated pass)." >&2
            exit 0
          fi
          npx tsx scripts/audit/doctrine_harness/run_master_gate.ts
