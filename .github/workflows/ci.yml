        # (a surviving candidate's own judgment_ledger must not be emptied by a trim of the
        # lattice_adjudication.ledgers[] bookkeeping copy).
        working-directory: platform-mcp
        run: npx vitest run src/tools/kala_views/__tests__/elect_budget_trim_f122.test.ts src/tools/kala_views/__tests__/elect_sections_coverage.test.ts src/tools/kala_views/__tests__/elect_ledger_alias_f122.test.ts
      - name: kala_now_get coverage-honesty + F-38 entitlement-gate regression (platform-mcp)
        # Covers the original kala_darshana_confluence coverage-honesty regression AND the
        # PARIŚEṢA-V4 F-38 gate: kala_now_get must reject an unentitled/nonexistent chart_id
        # via remoteAuthorize BEFORE any data fetch, and must never echo a raw upstream
        # error string (which was leaking `HTTP 404: Chart '<uuid>' not found` verbatim).
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/kala_now_get.test.ts
      - name: kala_now_get kota_chakra + sudarshana_varsha serving regression (platform-mcp) — ṢAḌ-DARŚANA W3 items 16/17
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/kala_now_get_kota_sudarshana_w3.test.ts
      - name: kala_now_get moorti_nirnaya + vedha_gochara serving regression (platform-mcp) — ṢAḌ-DARŚANA W3 items 4/5 (closes R-19)
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/kala_now_get_moorti_vedha_w3.test.ts
      - name: kala_life_arc_get include_lel_events no-op disclosure regression (platform-mcp) — F-26
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/register_p1_synthesis_life_arc_lel_noop.test.ts
      - name: synth_chart_brief_get top_discoveries honest-fields regression (platform-mcp) — F-129
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/f129_top_discoveries_honest_fields.test.ts
      - name: bodha_pratijna_get MCP tool registration regression (platform-mcp) — F-67
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/f67_bodha_pratijna_get_registration.test.ts
      - name: F-123 kala_explain_get dead-pointer regression (real now.ts/ahead.ts/priority.ts sites) (platform-mcp)
        working-directory: platform-mcp
        run: npx vitest run src/tools/kala_views/f123_dead_pointer_regression.test.ts
      - name: F-06 ref_remedies_chart_get scope-honesty regression (platform-mcp) — PARIŚEṢA-V4
        # The tool advertised "Chart-specific remedy suggestions" while querying a
        # global L0 corpus table that has no chart_id column. Locks the corrected
        # description and the provenance-only chart_id parameter.
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/f06_remedies_scope_honesty.test.ts
      - name: RATE-07 OAuth rate-limit gate + route wiring (platform-mcp) — PARIŚEṢA-V4
        # Two files, both required: the first proves the gate's BEHAVIOUR (identity
        # derivation vs. XFF spoofing, 429 + Retry-After, fail-closed on store
        # failure, no charging before validation); the second proves the gate is
        # actually ATTACHED to all five OAuth mutation routes. A passing behaviour
        # test on an unattached middleware is exactly the §N.8 defect class.
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/rate07_oauth_rate_limit.test.ts src/__tests__/rate07_oauth_route_wiring.test.ts
      - name: F-118 kala_upaya_get duplicate-collapse + actionability regression (platform-mcp) — PARIŚEṢA-V4
        # The tool served intervention_count=100 over 14 distinct labels — 50 byte-identical
        # phala_mitigation severity classifications (empty remedy program) plus 13 bodha_rm
        # remedies stored once per ayanamsha. Both files are required: the lib file proves the
        # collapse/actionability/discrimination DETECTORS behave (including the cases that make
        # each read false — §N.8), the tool file proves they are actually WIRED into the served
        # response against a fixture reproducing the live row shape.
        working-directory: platform-mcp
        run: npx vitest run src/lib/kala_upaya_diagnosis.test.ts src/tools/kala_views/upaya.test.ts src/tools/kala_views/upaya_weak_promise_gate.test.ts
      - name: vidhi registry codegen drift check (platform) — GT-56
        run: npm run codegen:vidhi:check
      - name: vidhi registry codegen parity test (platform-mcp) — GT-56
        working-directory: platform-mcp
        run: npx vitest run src/__tests__/vidhi_codegen_parity.test.ts
      - name: vidhi registry Ω8 parity gate (TS ↔ Python DB-seed writers ↔ Ω8-regen coverage) — PARIŚODHANA B2
        # Keeps the FOUR Vidhi registry copies (canonical TS, generated mirror, SQL seed, Python
        # seed writers) from silently drifting — the Python writers had drifted to 37 primitives /
        # 8 floors before B2 (a latent regression bomb). Deep-compares the canonical TS dump against
        # the two Python writers' --dump-json output + asserts Ω8-regen floor coverage + re-runs the
        # floor-coverage gate (14/14). See check_vidhi_registry_parity.mjs's header.
        run: node scripts/census/check_vidhi_registry_parity.mjs
      - name: R-1 projection compiler — generate (chat/MCP/census/docs projections, additive-only)
        # RETRIEVAL_PLANE_ELEVATION_PLAN_v1_0.md §3 R-1 item 2. DB-free (getCatalog() only
        # enumerates already-registered descriptor objects; TOOL_CONTRACTS is a static
        # in-memory array) — proves the generator runs clean against the live registry on
        # every push, same as the vidhi/envelope generators above. Writes NEW generated
        # artifacts under src/generated/projections/ + a comparison report under
        # 00_ARCHITECTURE/briefs/retrieval_impl/ — nothing here is wired into any live-
        # serving path (see the generator's own header comment).
        run: npm run codegen:projections
      - name: R-1 projection compiler parity/completeness gate
        # Same source, tested directly (r5_codegen_parity discipline): imports the SAME
        # pure builder functions the generator step above calls and asserts (1) every live
        # capability is accounted for by the census/chat/MCP/docs projections with no drops
        # or dupes, (2) every emitted entry is structurally valid (non-empty name/description,
        # valid JSON-Schema input_schema, MCP-legal tool names), and (3) the comparison
        # machinery vs. TOOL_CONTRACTS and the real registry_bridge.ts hand-written blocks is
        # itself sound (mechanical-extractor tripwire against silent breakage). Divergence
        # between generated and hand-written surfaces is EXPECTED and not itself a failure —
        # see R1_PROJECTION_COMPILER_REPORT.md.
        run: npx vitest run src/lib/retrieval/registry/__tests__/projection_compiler_parity.test.ts

  census-battery:
    # D-2 Lane V-0 (BRIEF_D2.md §F1 Lane V-0 / BIND_D-2.md §F1.7 ledger rows 1-5). Runs the
    # master-acceptance harness (§G.0 six wealth conclusions + the full paced 135-tool census +
    # completeness-receipt validator + alias-count check) against the DEPLOYED connector — this
    # is a live-estate check, not a source-tree check like density-census above, so it is
    # workflow_dispatch-only (see the `on:` block comment) and requires an MCP credential secret.
    # Manual invocation (the wave's gate runner, CONDUCTOR_PROTOCOL §2 step 7): `gh workflow run
    # "CI — Ganga Quality Gate" --ref <branch>` after adding this job's name to the dispatch, or
    # `gh workflow run ci.yml -f job=census-battery` once repo actions support job-level dispatch
    # inputs — until then, a workflow_dispatch run executes every job in this file; this job's
    # own `if` guard is what makes it a no-op on ordinary push/pull_request events.
    name: Census Battery (D-2 §G master gate)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: doctrine_harness — §G.0 wealth conclusions + census + receipt + alias check
        env:
          MARSYS_MCP_KEY: ${{ secrets.MARSYS_MCP_KEY }}
        run: |
          if [ -z "$MARSYS_MCP_KEY" ]; then
            echo "MARSYS_MCP_KEY secret not configured — skipping the live census battery (never a fabricated pass)." >&2
            exit 0
          fi
          npx tsx scripts/audit/doctrine_harness/run_master_gate.ts
