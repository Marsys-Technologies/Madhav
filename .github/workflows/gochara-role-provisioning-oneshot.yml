# Gochara verifier/sealer ROLE PROVISIONING — ONE-SHOT. DRAFT: HOLD. Codex reviews this file BEFORE it is ever dispatched.
#
# Authority: the native's direct ruling #1 (2026-10-02): SQL admin route = option A — a reviewed one-shot workflow over the
# existing governed ownership-admin secret, run under the owner's credentials by the steward. Stage grant-l1-reads uses the protected
# data_plane_migrator secret instead (precedent: kala-verifier-role-oneshot.yml grant-usage, owner-approved 2026-10-08; owner step 1 fix 2026-10-21).
#   decisions/NATIVE_DIRECT_RULINGS_20261002.md · runbooks/ROLES_AND_SEAL_PROVISIONING_RUNBOOK_v1_0.md (acts 1, 2a, 2b)
#
# It does exactly one thing, and only the statements in platform/scripts/gochara-provision-roles.sh (reviewed with it):
#   create-roles     SQL CREATE ROLE for gochara_verifier and gochara_sealer (both PASSWORD NULL; never `gcloud sql users create`),
#                    post-check pg_has_role(...,'cloudsqlsuperuser','MEMBER') = false, the verifier's password generated in the run
#                    and written straight to Secret Manager; refuses if either role already exists.
#   sealer-password  act 2b only, after the live-gate proof (see the runbook §7.1).
#   grant-l1-reads   J-4b-a55j (SR-GRANTS-MINIMAL): SELECT on chart_facts and chart_dashas plus USAGE on schema public (C-04) for the two principals, nothing else, closure-checked in the same transaction.
#                    Owner step 1 fix (2026-10-21): this stage alone runs over the protected data_plane_migrator secret (the ownership admin owns nothing after the data-plane
#                    cutover and cannot grant on public or on the L1 tables), issuing each GRANT as data_plane_l1_owner / data_plane_schema_owner. No new stage, no new secret.
#   sealer-credential  J-4b-a55j (SR-GRANTS-MINIMAL): the sealer's password generated in the run and its DSN written straight to Secret Manager (gochara-sealer-db-url);
#                    replaces the person-run staging of act 2b. Never printed, never read. PREPARED, NOT DISPATCHED: its secret container, its temporary
#                    secretVersionManager binding and its consumer (the seal job, J-5s) are production steps recorded in J4B_A55J_PREBUILD_v1_0.md.
# It prints only non-secret verification facts. No artifact is uploaded. It is workflow_dispatch ONLY.
#
# AFTER USE this file is removed or disabled in a follow-up PR (the runbook's rollback step); until then it must never be dispatched
# without the steward telling the owner the sequence is starting.
name: Gochara role provisioning (one-shot, reviewed)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'create-roles (acts 1+2a), sealer-password (act 2b, staged), grant-l1-reads (J-4b-a55j: L1 SELECT + schema public USAGE) or sealer-credential (J-4b-a55j)'
        required: true
        type: choice
        options: [create-roles, sealer-password, grant-l1-reads, sealer-credential]
      dsn_tail:
        description: 'create-roles: the NON-SECRET tail of the verifier DSN, e.g. @/dbname?host=/cloudsql/<connection-name>; sealer-credential: the sealer tail @127.0.0.1:5432/<dbname> (starts with @, no credentials)'
        required: false
        type: string
      confirm:
        description: 'Type exactly: PROVISION-GOCHARA-ROLES'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gochara-role-provisioning
  cancel-in-progress: false

env:
  WIF_PROVIDER: projects/938361928218/locations/global/workloadIdentityPools/github/providers/github-actions
  WIF_SERVICE_ACCOUNT: github-actions@madhav-astrology.iam.gserviceaccount.com

jobs:
  provision:
    name: Provision (${{ inputs.stage }})
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'PROVISION-GOCHARA-ROLES'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the existing governed environment that holds the ownership-admin secret (deployment branches: protected only)
    environment: data-plane-production-cutover
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.1/cloud-sql-proxy.linux.amd64" \
            -o cloud-sql-proxy
          echo "276139ff5d5dc484c51e1a9c065d69a9f6e47d5b726f94dced253b0227df2056  cloud-sql-proxy" | sha256sum -c -         # pinned (Fable): the v2.10.1 linux/amd64 binary as served on 2026-10-02
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 \
            madhav-astrology:asia-south1:amjis-postgres >cloud-sql-proxy-5432.log 2>&1 &
          proxy_pid=$!
          ready=false
          for _ in {1..20}; do
            if kill -0 "$proxy_pid" 2>/dev/null && (echo >"/dev/tcp/127.0.0.1/5432") 2>/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::Cloud SQL Auth Proxy did not become ready on 127.0.0.1:5432."
            exit 1
          fi

      - name: Install the PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Run the reviewed provisioning script (prints non-secret facts only)
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          DSN_TAIL: ${{ inputs.dsn_tail }}
          ADMIN_DATABASE_URL: ${{ secrets.DATA_PLANE_OWNERSHIP_ADMIN_DATABASE_URL }}
          # grant-l1-reads ONLY: the protected data_plane_migrator route (member of the schema and L1 owner roles; the ownership admin owns nothing after the cutover).
          # Same secret and route as kala-verifier-role-oneshot.yml (stage grant-usage). Read from the environment by the script, never from argv.
          MIGRATOR_DATABASE_URL: ${{ secrets.DATA_PLANE_MIGRATOR_DATABASE_URL }}
          SEALER_PASSWORD_STAGING: ${{ secrets.GOCHARA_SEALER_PASSWORD_STAGING }}
          GCLOUD_PROJECT: madhav-astrology
        run: bash platform/scripts/gochara-provision-roles.sh
