name: Elevation Campaign — Serving Gates (Stream α / SATYA, Lane K1)

# α's (SATYA) K1 CI gate battery — platform/scripts/census/elev_gates/**. Gates so far:
#   - smoke_gate.ts          — every registered MCP tool called; fails on HTTP >=500 or a hang.
#   - budget_census_gate.ts  — every tool's worst-case response measured against its declared
#                              MCP_RESPONSE_BUDGET_KB ceiling (registry_bridge.ts).
#   - receipt_gate.ts        — fixed-catalog multi-select tools (categories[]/domains[]/include[])
#                              checked for "✓ over an empty array" and count/array-mismatch
#                              structural violations via _structural_checks.ts's two walkers.
#   - absence_lint_gate.ts   — static grep lint over platform-mcp/src/tools/** +
#                              platform/src/lib/retrieval/registry/** for ontological-absence
#                              phrasing not backed by a resolver-miss code path nearby. Pure
#                              source-tree scan, no MCP calls — report-only (WARN) by default;
#                              ABSENCE_LINT_STRICT=true upgrades ungrounded candidates to FAIL.
#   - w1_bare_empty_census_gate.ts — SATYA-ŚEṢA W1 (SATYA_SHESHA_BRIEF_v1_0.md §2 W1). Probes
#                              all 46 Phase-0.7-census concepts by their naive English/Sanskrit
#                              name against chart_facts_query's `keyword` filter (the S4-03
#                              front door); FAILS the build on any bare empty (no rows AND no
#                              resolver_suggestion). ADDITIVE — does not gate or modify any
#                              pre-existing job in this workflow.
#
# Each script runs in TWO modes, matching the codebase's TAP-9 discipline ("an absent oracle
# must be declared, never silently passed" — see tap-ci.yml's header for the same doctrine):
#   PLAN mode (no MCP_SERVER_URL) — static-only (source-tree enumeration/scan + call-plan),
#     always exits 0, no network calls, no secret required. Runs on every push/PR.
#   LIVE mode (MCP_SERVER_URL + MARSYS_MCP_KEY secret set) — drives the real deployed
#     connector. Gated the same way ci.yml's own census-battery job gates its live run: never
#     on every push (rate-limit risk + a multi-minute paced sweep across all three gates), only
#     on workflow_dispatch, and it degrades to an explicit skip (never a fabricated pass) if the
#     secret is not configured for this repo/branch.
#
# This workflow does not run in the authoring sandbox (no CI access there) — its syntactic
# validity and consistency with ci.yml's own Node/npm-ci/working-directory conventions is what
# was checked before landing it; the first real execution is CI's, not this session's.

# Trigger scoping (CI efficiency audit, 2026-07-31). This workflow previously ran on
# EVERY pull request with no path filter. Its gates only ever read two source trees —
# verified by reading the scripts, not by assuming:
#   _tool_enumeration.ts  -> platform-mcp/src/tools        (smoke / budget-census / receipt)
#   absence_lint_gate.ts  -> platform/src/lib/retrieval/registry
# so a PR touching neither cannot change any gate's verdict. Measured over the last 60
# commits to main, 75% of them touch none of the paths below.
#
# Safe because none of this workflow's checks is required by branch protection on main
# (verified 2026-07-31: the only required checks are TypeScript (src only), Unit Tests,
# Secret Scan, Governance Gates). A non-required check that stops firing simply does not
# appear; it cannot leave a PR permanently pending. NEVER add a path filter to ci.yml.
#
# To revert: delete the `paths:` block.
# DUPLICATE-TRIGGER FIX (CI efficiency audit, 2026-07-31). The `push:` list used to
# include 'feature/**'. That caused a PR opened from such a branch to run this
# entire workflow TWICE per push — once for `push`, once for `pull_request` — because
# the two events land in DIFFERENT concurrency groups (`github.ref` is
# refs/heads/<branch> for push but refs/pull/<n>/merge for pull_request), so the
# concurrency block below cannot dedupe them.
#
# This was PROVEN, not assumed. A scratch branch `feature/ci-concurrency-probe` with an
# open PR was pushed to, and commit d8e82d5 produced BOTH a push run and a
# pull_request run of all four always-on workflows — 8 runs for one commit. (The same
# probe also confirmed the concurrency groups DO work within an event type: push A's
# four runs went `cancelled` the instant push B landed 7s later.)
#
# `push: [main]` is retained — post-merge runs on main are legitimate and gate deploy.
# To revert: put 'feature/**' back in the push branches list.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      # The gates' own source
      - 'platform/scripts/census/elev_gates/**'
      # What the gates actually scan
      - 'platform-mcp/src/**'
      - 'platform/src/lib/retrieval/**'
      # This file
      - '.github/workflows/elev-serving-gates.yml'
  workflow_dispatch:

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes. Pure check workflow — safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI efficiency audit (2026-07-31) — the five PLAN-mode gates below were five
  # separate jobs, each spending ~30s on its own `npm ci` to run one ~1-second tsx
  # script: 233 runner-seconds for about five seconds of actual gate work. They are
  # one job now.
  #
  # The Elevation arc itself is closed (PŪRṆA-VIRĀMA, 2026-07-27), but these gates
  # still guard live serving code, so they are consolidated — NOT retired. Same five
  # scripts, same semantics. The runner loop runs ALL five even after one fails, then
  # exits non-zero, preserving the "see every failing gate in one run" property that
  # separate jobs gave. absence_lint_gate stays report-only (WARN) as before: it is
  # invoked through the same loop but its result is reported, not counted as failure,
  # unless ABSENCE_LINT_STRICT upgrades it (see the workflow header).
  plan-gates:
    name: K1 + W1 — PLAN-mode serving gates (smoke / budget / receipt / absence / bare-empty)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: K1 + W1 PLAN-mode gates (no live calls)
        run: |
          failed=""
          run_gate() {
            echo "::group::$1"
            if npx tsx "scripts/census/elev_gates/$2"; then
              echo "PASS  $1"
            else
              echo "FAIL  $1"
              failed="$failed\n  - $1"
            fi
            echo "::endgroup::"
          }
          run_gate "smoke_gate — static tool enumeration + call plan"                smoke_gate.ts
          run_gate "budget_census_gate — MCP_RESPONSE_BUDGET_KB ledger extraction"   budget_census_gate.ts
          run_gate "receipt_gate — multi-category param scan + drift check"          receipt_gate.ts
          run_gate "w1_bare_empty_census_gate — 46-concept census validation"        w1_bare_empty_census_gate.ts
          if [ -n "$failed" ]; then
            printf 'PLAN-mode serving gates FAILED:%b\n' "$failed" >&2
            exit 1
          fi
          echo "All four blocking PLAN-mode gates passed."

      # REPORT-ONLY, and here is exactly why it stays that way (triaged 2026-08-01).
      #
      # The detector is SOUND — mutation-proven twice: ABSENCE_LINT_STRICT=true goes red on a
      # seeded served absence claim, and did so again AFTER the scope narrowing below.
      #
      # SCOPE NARROWED 2026-08-01: the lint used to match raw source lines and reported 21
      # STRICT findings. Full triage classified ALL 21 as false positives of three kinds —
      # 13 pure comments/docblocks, 5 Postgres error-matching regexes (/column ".*" does not
      # exist|.../, i.e. code that DETECTS a DB error, the opposite of claiming absence), and
      # 1 trailing comment on a type-union line. `servedTextOnly()` in absence_lint_gate.ts now
      # strips comments and regex literals before matching, deliberately KEEPING string
      # literals in scope because a string is the one thing that plausibly IS served.
      # Result: 21 -> 2.
      #
      # NOT ARMED, and not because of volume — because neither survivor is a defect:
      #   tool_search.ts:30        a tool DESCRIPTION advising the model to search the catalog
      #                            "before assuming a needed capability does not exist" — the
      #                            inverse of an ungrounded absence claim.
      #   register_d9_judgment.ts  served text disclosing a real gap AND its handling
      #     :363                   ("bhanga_checked reports false, not fabricated") — honest
      #                            disclosure; the grounding token merely falls outside the
      #                            ±25-line window the heuristic can see.
      # Arming today would red-gate `main` on two non-defects. Per §N.8 that is worse than
      # leaving it honest: a gate should not block on findings nobody believes.
      #
      # TO ARM: get native sign-off on those two specific lines (ground them, reword them, or
      # accept them), then set ABSENCE_LINT_STRICT=true and drop continue-on-error.
      - name: absence lint (REPORT-ONLY — detector sound, 2 known non-defect findings; see comment)
        continue-on-error: true
        run: npx tsx scripts/census/elev_gates/absence_lint_gate.ts

  serving-gates-live:
    # D-2 Lane V-0 precedent (ci.yml's census-battery job): a live-estate check against the
    # deployed connector is workflow_dispatch-only and self-skips (exit 0, not a fabricated
    # pass) when its credential secret is absent — never a hard requirement on every push.
    name: K1 — serving gates (LIVE mode, deployed connector)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: K1 + W1 gates — smoke + budget-census + receipt + bare-empty-census (LIVE, paced)
        env:
          MCP_SERVER_URL: ${{ secrets.MARSYS_MCP_URL }}
          MCP_BEARER: ${{ secrets.MARSYS_MCP_KEY }}
        run: |
          if [ -z "$MCP_SERVER_URL" ]; then
            echo "MARSYS_MCP_URL secret not configured — skipping the live K1/W1 gate battery (never a fabricated pass)." >&2
            exit 0
          fi
          npx tsx scripts/census/elev_gates/smoke_gate.ts
          npx tsx scripts/census/elev_gates/budget_census_gate.ts
          npx tsx scripts/census/elev_gates/receipt_gate.ts
          # SATYA-ŚEṢA W1 (SATYA_SHESHA_BRIEF_v1_0.md §2 W1) — ADDITIVE: 46-concept bare-empty
          # census against BOTH canonical charts. A bare empty here fails this job (and the
          # build), same discipline as the pre-existing K1 gates above.
          npx tsx scripts/census/elev_gates/w1_bare_empty_census_gate.ts
