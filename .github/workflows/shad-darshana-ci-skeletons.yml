name: ṢAḌ-DARŚANA — W0.6 CI Skeletons (Lane shad-darshana-ci-skeletons)

# SHAD_DARSHANA_BRIEF_v2_0.md §0.6 / §3 W0.6's six CI skeletons:
#   1. specificity_gate_v0.ts               — item 1  (E3 hard-gate precursor)
#   2. shad_darshana_w0_prose_survival_battery.test.ts — item 2 (hardFloor prose survival)
#   3. shad_darshana_w0_tri_plane_no_dead_end.test.ts (unit) +
#      tri_plane_no_dead_end_gate.ts (live) — item 3 (item 43)
#   4. completeness_census_seed.ts           — item 4  (registry 1-44 + E1-E8)
#   5. authority_basis_census_seed.ts        — item 5  (item 44 seed)
#   6. shad_darshana_w0_mode3_routing.test.ts (unit) +
#      mode3_single_route_gate.ts (live)     — item 6  (Elevation §8 Mode-3 routing rule)
#
# Same PLAN/LIVE discipline as the precedent this lane follows
# (`.github/workflows/elev-serving-gates.yml`'s own header, quoted in spirit here):
#   PLAN mode (no MCP_SERVER_URL) — static-only (source-tree registration checks + call
#     plan), always exits 0 for the registration-dependent live gates (specificity,
#     tri-plane, mode3-route) since the eight kala_* facades are built by concurrent
#     sibling lanes that may not be merged yet. The two pure-static census seeds
#     (completeness, authority-basis) are FULL real gates even in this job — they need no
#     live server and have real teeth (CLAUDE.md §N.7) from day one.
#   LIVE mode (MCP_SERVER_URL + MARSYS_MCP_KEY secret) — drives the real deployed
#     connector. workflow_dispatch only (never on every push — rate-limit + secret
#     availability), and self-skips (exit 0, not a fabricated pass) if the secret is not
#     configured for this repo/branch.
#
# The two unit-level vitest batteries (prose-survival, tri-plane unit half, mode3-routing)
# need no live server and no facade merge — they exercise `kala_envelope.ts` /
# `argument_composer.ts` / `response_budget.ts` directly (already merged at W0.3) and are
# expected green from the moment this PR lands. Cherry-picked by exact test file, matching
# this repo's own established precedent (see `density-census` job in `ci.yml`'s own header
# comment: "platform-mcp's full `npm test` currently carries pre-existing unrelated
# failures ... wiring the whole suite into CI is a follow-on hygiene item, not this lane's
# job" — the same reasoning applies here, unchanged).

# Trigger scoping (CI efficiency audit, 2026-07-31). This workflow previously ran on
# EVERY pull request with no path filter. What it actually reads, verified by reading
# the scripts:
#   _kala_tool_registration.ts -> platform-mcp/src/tools   (all five PLAN-mode gates)
#   the three unit batteries   -> platform-mcp/src/__tests__/shad_darshana_w0_* plus the
#                                 kala_envelope / argument_composer / response_budget
#                                 modules they exercise, all under platform-mcp/src.
# Measured over the last 60 commits to main, 76% touch none of the paths below.
#
# Safe because none of this workflow's checks is required by branch protection on main
# (verified 2026-07-31). A non-required check that stops firing simply does not appear;
# it cannot leave a PR permanently pending. NEVER add a path filter to ci.yml.
#
# NOTE, unrelated to triggers but recorded where it will be seen: the three PLAN-mode
# gates print "exit 0 always" and cannot fail without an MCP_SERVER_URL secret (none
# exists), and their registration census reports 4 of the 8 kala_* tools as unregistered
# when all 8 are in fact registered via registry_bridge.ts — the detector greps for a
# string literal next to server.tool() and cannot see through
# `server.tool(TOOL_NAME, …)`. See CI_EFFICIENCY_AUDIT_v1_0.md §4.8.
#
# To revert: delete the `paths:` block.
# DUPLICATE-TRIGGER FIX (CI efficiency audit, 2026-07-31). The `push:` list used to
# include 'feature/**'. That caused a PR opened from such a branch to run this
# entire workflow TWICE per push — once for `push`, once for `pull_request` — because
# the two events land in DIFFERENT concurrency groups (`github.ref` is
# refs/heads/<branch> for push but refs/pull/<n>/merge for pull_request), so the
# concurrency block below cannot dedupe them.
#
# This was PROVEN, not assumed. A scratch branch `feature/ci-concurrency-probe` with an
# open PR was pushed to, and commit d8e82d5 produced BOTH a push run and a
# pull_request run of all four always-on workflows — 8 runs for one commit. (The same
# probe also confirmed the concurrency groups DO work within an event type: push A's
# four runs went `cancelled` the instant push B landed 7s later.)
#
# `push: [main]` is retained — post-merge runs on main are legitimate and gate deploy.
# To revert: put 'feature/**' back in the push branches list.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      # The gates' own source
      - 'platform/scripts/census/shad_darshana_gates/**'
      # What the gates and unit batteries actually read
      - 'platform-mcp/src/**'
      # This file
      - '.github/workflows/shad-darshana-ci-skeletons.yml'
  workflow_dispatch:

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes. Pure check workflow — safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-batteries:
    name: W0.6 — unit-level batteries (prose-survival, tri-plane, mode3-routing)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform-mcp/package-lock.json
      - run: npm ci
      - name: item 2 — minimum-budget prose-survival battery (hardFloor)
        run: npx vitest run src/__tests__/shad_darshana_w0_prose_survival_battery.test.ts
      - name: item 3 — tri-plane no-dead-end battery (unit level)
        run: npx vitest run src/__tests__/shad_darshana_w0_tri_plane_no_dead_end.test.ts
      - name: item 6 — Mode-3 single-route assertion (unit level; SKIPS honestly pre-merge of the sibling upaya-ritual-stub lane)
        run: npx vitest run src/__tests__/shad_darshana_w0_mode3_routing.test.ts

  # CI efficiency audit (2026-07-31) — items 1/3/4/5/6 were five separate jobs, each
  # spending ~30s on its own `npm ci` to run one ~1-second tsx script: 256 runner-
  # seconds for about five seconds of actual gate work. They are one job now.
  #
  # Nothing about the gates changed — same five scripts, same PLAN-mode semantics,
  # same pass/fail meaning. The runner loop below deliberately runs ALL five even
  # after one fails, then exits non-zero at the end, so consolidating does not cost
  # the "see every failing gate in a single run" property that separate jobs gave.
  plan-gates:
    name: W0.6 — PLAN-mode gates (items 1, 3, 4, 5, 6)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: items 1/3/4/5/6 — census seeds + PLAN-mode registration gates
        # items 4 and 5 (completeness / authority-basis census seeds) are FULL real
        # gates with teeth even here — they need no live server (CLAUDE.md §N.7).
        # items 1, 3 and 6 are PLAN mode: static registration census + call plan.
        run: |
          failed=""
          run_gate() {
            echo "::group::$1"
            if npx tsx "scripts/census/shad_darshana_gates/$2"; then
              echo "PASS  $1"
            else
              echo "FAIL  $1"
              failed="$failed\n  - $1"
            fi
            echo "::endgroup::"
          }
          run_gate "item 4 — completeness_census_seed (registry 1-44 + E1-E8)" completeness_census_seed.ts
          run_gate "item 5 — authority_basis_census_seed (item 44)"            authority_basis_census_seed.ts
          run_gate "item 1 — specificity_gate_v0 (PLAN)"                       specificity_gate_v0.ts
          run_gate "item 3 — tri_plane_no_dead_end_gate (PLAN)"                tri_plane_no_dead_end_gate.ts
          run_gate "item 6 — mode3_single_route_gate (PLAN)"                   mode3_single_route_gate.ts
          if [ -n "$failed" ]; then
            printf 'W0.6 PLAN-mode gates FAILED:%b\n' "$failed" >&2
            exit 1
          fi
          echo "All five W0.6 PLAN-mode gates passed."

  live-gates:
    # Mirrors elev-serving-gates.yml's own `serving-gates-live` job precedent exactly:
    # workflow_dispatch-only, self-skips (exit 0, not a fabricated pass) when the secret
    # is absent.
    name: W0.6 — live gates (deployed connector; items 1/3/6)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: items 1/3/6 — specificity + tri-plane + mode3-route (LIVE, paced)
        env:
          MCP_SERVER_URL: ${{ secrets.MARSYS_MCP_URL }}
          MCP_BEARER: ${{ secrets.MARSYS_MCP_KEY }}
        run: |
          if [ -z "$MCP_SERVER_URL" ]; then
            echo "MARSYS_MCP_URL secret not configured — skipping the live W0.6 gate battery (never a fabricated pass)." >&2
            exit 0
          fi
          npx tsx scripts/census/shad_darshana_gates/specificity_gate_v0.ts
          npx tsx scripts/census/shad_darshana_gates/tri_plane_no_dead_end_gate.ts
          npx tsx scripts/census/shad_darshana_gates/mode3_single_route_gate.ts
