name: ṢAḌ-DARŚANA — W0.6 CI Skeletons (Lane shad-darshana-ci-skeletons)

# SHAD_DARSHANA_BRIEF_v2_0.md §0.6 / §3 W0.6's six CI skeletons:
#   1. specificity_gate_v0.ts               — item 1  (E3 HARD gate since 2026-08-02; filename keeps the historical _v0)
#   2. shad_darshana_w0_prose_survival_battery.test.ts — item 2 (hardFloor prose survival)
#   3. shad_darshana_w0_tri_plane_no_dead_end.test.ts (unit) +
#      tri_plane_no_dead_end_gate.ts (live) — item 3 (item 43)
#   4. completeness_census_seed.ts           — item 4  (registry 1-44 + E1-E8)
#   5. authority_basis_census_seed.ts        — item 5  (item 44 seed)
#   6. shad_darshana_w0_mode3_routing.test.ts (unit) +
#      mode3_single_route_gate.ts (live)     — item 6  (Elevation §8 Mode-3 routing rule)
#
# STATUS AS OF 2026-08-02 (lane w2-specificity-hard) — supersedes the 2026-07-31 note.
#
#   Item 1 (specificity) is RE-ARMED on the PR/push path in PLAN mode — see the
#   `specificity-gate-plan` job. The 2026-07-31 retirement named its re-arming
#   precondition: "RE-ARMING REQUIRES FIXING THE DETECTOR FIRST". That precondition is
#   now satisfied: _kala_tool_registration.ts resolves `server.tool(TOOL_NAME, …)`
#   const-identifier registration (same-file const lookup), and a vitest battery
#   (platform/scripts/census/shad_darshana_gates/__tests__/) proves all 8 kala_* views
#   are detected. The gate itself was upgraded to the W2 HARD criterion
#   (SHAD_DARSHANA_BRIEF_v2_0.md §3 W2 "specificity gate HARD-green"): PLAN mode is no
#   longer "exit 0 always" — it FAILS on a registration-census regression and on any
#   comparator non-vacuity self-check violation (a deliberately-generic fixture pair
#   must be rejected on every run); LIVE mode applies a structural pairwise criterion
#   (byte-identity, masked-template identity, identical-evidence sets) across ALL built
#   charts, not mere byte-identity. Full-cohort statistical gating over the 10k
#   bg_synthetic_cohort stays honestly deferred (those charts are not built/served) and
#   the gate says so in its own output. §N.8 non-vacuity was verified by mutation on
#   2026-08-02: pointing SHAD_DARSHANA_MCP_TOOLS_ROOT at an empty dir produces exit 1
#   (also asserted permanently in the vitest battery).
#
#   Items 3 and 6 (tri-plane, mode3-route) REMAIN RETIRED to workflow_dispatch: their
#   PLAN modes still cannot fail by construction. Their registration-census false
#   negative is fixed as a side effect (shared detector), but "cannot fail" is the §N.8
#   disqualifier and still holds for them — see the block comment above the
#   `retired-plan-gates` job, and CI_EFFICIENCY_AUDIT_v1_0.md §4.8.
#
#   Items 4 and 5 (completeness / authority-basis census seeds) REMAIN on the PR path.
#   They are real gates, and unlike the above that claim was verified by mutation on
#   2026-07-31 rather than taken from the header: breaking EXPECTED_COUNT, and separately
#   repointing authority_basis's own MCP_TOOLS_ROOT, each produce exit 1; restoring each
#   produces exit 0.
#   LIVE mode (MCP_SERVER_URL + MARSYS_MCP_KEY secret) — drives the real deployed
#     connector. workflow_dispatch only (never on every push — rate-limit + secret
#     availability), and self-skips (exit 0, not a fabricated pass) if the secret is not
#     configured for this repo/branch.
#
# The two unit-level vitest batteries (prose-survival, tri-plane unit half, mode3-routing)
# need no live server and no facade merge — they exercise `kala_envelope.ts` /
# `argument_composer.ts` / `response_budget.ts` directly (already merged at W0.3) and are
# expected green from the moment this PR lands. Cherry-picked by exact test file, matching
# this repo's own established precedent (see `density-census` job in `ci.yml`'s own header
# comment: "platform-mcp's full `npm test` currently carries pre-existing unrelated
# failures ... wiring the whole suite into CI is a follow-on hygiene item, not this lane's
# job" — the same reasoning applies here, unchanged).

# Trigger scoping (CI efficiency audit, 2026-07-31). This workflow previously ran on
# EVERY pull request with no path filter. What it actually reads, verified by reading
# the scripts:
#   _kala_tool_registration.ts -> platform-mcp/src/tools   (all five PLAN-mode gates)
#   the three unit batteries   -> platform-mcp/src/__tests__/shad_darshana_w0_* plus the
#                                 kala_envelope / argument_composer / response_budget
#                                 modules they exercise, all under platform-mcp/src.
# Measured over the last 60 commits to main, 76% touch none of the paths below.
#
# Safe because none of this workflow's checks is required by branch protection on main
# (verified 2026-07-31). A non-required check that stops firing simply does not appear;
# it cannot leave a PR permanently pending. NEVER add a path filter to ci.yml.
#
# NOTE (updated 2026-08-02): the registration-census false negative described in
# CI_EFFICIENCY_AUDIT_v1_0.md §4.8 (4 of 8 kala_* tools reported unregistered because
# the detector could not see through `server.tool(TOOL_NAME, …)`) is FIXED — the
# detector now resolves same-file const identifiers and is covered by a vitest battery.
# Of the three formerly-retired PLAN gates, item 1 (specificity) additionally gained a
# real PLAN-mode failure path and is re-armed below; items 3 and 6 remain
# dispatch-only because their PLAN modes still cannot fail.
#
# To revert: delete the `paths:` block.
# DUPLICATE-TRIGGER FIX (CI efficiency audit, 2026-07-31). The `push:` list used to
# include 'feature/**'. That caused a PR opened from such a branch to run this
# entire workflow TWICE per push — once for `push`, once for `pull_request` — because
# the two events land in DIFFERENT concurrency groups (`github.ref` is
# refs/heads/<branch> for push but refs/pull/<n>/merge for pull_request), so the
# concurrency block below cannot dedupe them.
#
# This was PROVEN, not assumed. A scratch branch `feature/ci-concurrency-probe` with an
# open PR was pushed to, and commit d8e82d5 produced BOTH a push run and a
# pull_request run of all four always-on workflows — 8 runs for one commit. (The same
# probe also confirmed the concurrency groups DO work within an event type: push A's
# four runs went `cancelled` the instant push B landed 7s later.)
#
# `push: [main]` is retained — post-merge runs on main are legitimate and gate deploy.
# To revert: put 'feature/**' back in the push branches list.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      # The gates' own source
      - 'platform/scripts/census/shad_darshana_gates/**'
      # What the gates and unit batteries actually read
      - 'platform-mcp/src/**'
      # This file
      - '.github/workflows/shad-darshana-ci-skeletons.yml'
  workflow_dispatch:

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes. Pure check workflow — safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-batteries:
    name: W0.6 — unit-level batteries (prose-survival, tri-plane, mode3-routing)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform-mcp/package-lock.json
      - run: npm ci
      - name: item 2 — minimum-budget prose-survival battery (hardFloor)
        run: npx vitest run src/__tests__/shad_darshana_w0_prose_survival_battery.test.ts
      - name: item 3 — tri-plane no-dead-end battery (unit level)
        run: npx vitest run src/__tests__/shad_darshana_w0_tri_plane_no_dead_end.test.ts
      - name: item 6 — Mode-3 single-route assertion (unit level; SKIPS honestly pre-merge of the sibling upaya-ritual-stub lane)
        run: npx vitest run src/__tests__/shad_darshana_w0_mode3_routing.test.ts

  # CI efficiency audit (2026-07-31) — items 1/3/4/5/6 were five separate jobs, each
  # spending ~30s on its own `npm ci` to run one ~1-second tsx script: 256 runner-
  # seconds for about five seconds of actual gate work. They are one job now.
  #
  # Nothing about the gates changed — same five scripts, same PLAN-mode semantics,
  # same pass/fail meaning. The runner loop below deliberately runs ALL five even
  # after one fails, then exits non-zero at the end, so consolidating does not cost
  # the "see every failing gate in a single run" property that separate jobs gave.
  census-seeds:
    name: W0.6 — census seeds (items 4, 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: items 4/5 — completeness + authority-basis census seeds
        # These two are REAL gates and stay on the PR path. Their header claimed as
        # much; the claim was verified by mutation rather than taken on trust
        # (2026-07-31):
        #   completeness_census_seed  — EXPECTED_COUNT 44+8 -> 44+9 gives exit 1 and a
        #                               "status": "FAIL" row; restoring gives exit 0.
        #   authority_basis_census_seed — repointing its own MCP_TOOLS_ROOT (line 49, it
        #                               declares its own, it does NOT share
        #                               _kala_tool_registration's) at a nonexistent dir
        #                               gives exit 1 / FAIL=1; restoring gives exit 0.
        # Both are falsifiable. They are NOT part of the retirement below.
        run: |
          failed=""
          run_gate() {
            echo "::group::$1"
            if npx tsx "scripts/census/shad_darshana_gates/$2"; then
              echo "PASS  $1"
            else
              echo "FAIL  $1"
              failed="$failed\n  - $1"
            fi
            echo "::endgroup::"
          }
          run_gate "item 4 — completeness_census_seed (registry 1-44 + E1-E8)" completeness_census_seed.ts
          run_gate "item 5 — authority_basis_census_seed (item 44)"            authority_basis_census_seed.ts
          if [ -n "$failed" ]; then
            printf 'W0.6 census seeds FAILED:%b\n' "$failed" >&2
            exit 1
          fi
          echo "Both W0.6 census seeds passed."

  # W2 HARD specificity gate (item 1), PLAN mode — RE-ARMED on the PR/push path
  # 2026-08-02 (lane w2-specificity-hard) per the retirement note's own re-arm
  # condition: the registration detector is fixed (const-identifier resolution,
  # vitest-proven on all 8 kala_* views) and the gate now has real PLAN-mode failure
  # paths (registration-census regression; comparator non-vacuity self-check —
  # a deliberately-generic reading pair must FAIL on every run). No secret needed.
  # LIVE mode (real pairwise comparison across built charts) stays on
  # workflow_dispatch via the live-gates job below, where MCP_SERVER_URL is available.
  specificity-gate-plan:
    name: W2 — specificity gate, HARD criterion (item 1, PLAN mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: item 1 — specificity_gate (PLAN mode; FAIL-capable)
        run: npx tsx scripts/census/shad_darshana_gates/specificity_gate_v0.ts
      - name: item 1 — detector + criterion vitest battery (registration census on all 8 views; non-vacuity incl. script-level exit-1 proof)
        run: npx vitest run scripts/census/shad_darshana_gates/__tests__/

  # ─────────────────────────────────────────────────────────────────────────────
  # RETIRED 2026-07-31 — items 3 and 6 (PLAN mode). §N.8 earned-signal failure.
  # (Item 1, specificity, was originally retired with them; it was fixed and
  # re-armed 2026-08-02 — see the `specificity-gate-plan` job above.)
  #
  # These ran on every PR and COULD NOT FAIL. Each prints, in its own report
  # line, "exit 0 always" when MCP_SERVER_URL is unset — and no such secret exists in
  # this repo. Corroborating: this workflow has 0 failures across 100 runs.
  #
  # Their second disqualifier — the registration census reporting kala_now_get,
  # kala_ahead_get, kala_priority_get and kala_explain_get as unregistered because
  # the detector (_kala_tool_registration.ts) could not resolve
  # `server.tool(TOOL_NAME, …)` const-identifier registration — is FIXED as of
  # 2026-08-02 (shared detector, vitest-proven on all 8 views). What still holds for
  # items 3 and 6 is the first disqualifier: their PLAN modes have no failure path.
  # RE-ARM for them = give each a real PLAN-mode criterion first (the specificity
  # gate's registration-census + fixture-self-check pattern is the worked precedent),
  # then delete the `if:` line below. Do not re-arm on the strength of a gate going
  # green. Full evidence: CI_EFFICIENCY_AUDIT_v1_0.md §4.8.
  # ─────────────────────────────────────────────────────────────────────────────
  retired-plan-gates:
    name: W0.6 — RETIRED PLAN-mode gates (items 3, 6) [dispatch-only]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: items 3/6 — PLAN-mode registration gates (RETIRED — cannot fail)
        run: |
          echo "NOTE: these gates exit 0 regardless of findings when MCP_SERVER_URL is"
          echo "unset. Their registration census is fixed (2026-08-02) but they still"
          echo "have no PLAN-mode failure path. Read the output as a report, NOT as a"
          echo "verdict. (Item 1, specificity, was re-armed on the PR path — see the"
          echo "specificity-gate-plan job.)"
          failed=""
          run_gate() {
            echo "::group::$1"
            if npx tsx "scripts/census/shad_darshana_gates/$2"; then
              echo "PASS  $1"
            else
              echo "FAIL  $1"
              failed="$failed\n  - $1"
            fi
            echo "::endgroup::"
          }
          run_gate "item 3 — tri_plane_no_dead_end_gate (PLAN)" tri_plane_no_dead_end_gate.ts
          run_gate "item 6 — mode3_single_route_gate (PLAN)"    mode3_single_route_gate.ts
          # ṢAḌ-DARŚANA W4 gate G6 (Lane R). Unlike the three W0.6 gates above, this one
          # is NOT advisory: its PLAN-mode detectors (D-ONE-ENGINE, D-MORTALITY-SOURCE,
          # D-MORTALITY-NONVACUOUS, FIXTURE-SHAPE) run entirely on source text and a
          # committed fixture, so a FAIL here is a real, reproducible finding with no
          # live dependency. Its live detectors self-report SKIPPED (never PASS) without
          # MCP_SERVER_URL — see the live-gates job below.
          run_gate "W4 item 40 — yajna_mode2_fixture_gate (PLAN)" yajna_mode2_fixture_gate.ts
          if [ -n "$failed" ]; then
            printf 'W0.6 retired PLAN-mode gates reported FAILED:%b\n' "$failed" >&2
            exit 1
          fi

  live-gates:
    # Mirrors elev-serving-gates.yml's own `serving-gates-live` job precedent exactly:
    # workflow_dispatch-only, self-skips (exit 0, not a fabricated pass) when the secret
    # is absent.
    name: W0.6 — live gates (deployed connector; items 1/3/6)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: items 1/3/6 — specificity + tri-plane + mode3-route (LIVE, paced)
        env:
          MCP_SERVER_URL: ${{ secrets.MARSYS_MCP_URL }}
          MCP_BEARER: ${{ secrets.MARSYS_MCP_KEY }}
        run: |
          if [ -z "$MCP_SERVER_URL" ]; then
            echo "MARSYS_MCP_URL secret not configured — skipping the live W0.6 gate battery (never a fabricated pass)." >&2
            exit 0
          fi
          npx tsx scripts/census/shad_darshana_gates/specificity_gate_v0.ts
          npx tsx scripts/census/shad_darshana_gates/tri_plane_no_dead_end_gate.ts
          npx tsx scripts/census/shad_darshana_gates/mode3_single_route_gate.ts
          # W4 G6 — the canned Mode-2 fixture, both charts, plus the live §5.4 mortality
          # refusal probes (G16 parts a and c). Requires the extended bg_muhurta_lattice
          # to be BUILT in production: an unbuilt lattice makes the fixture honestly fail
          # on missing atoms, which is correct behaviour but is NOT a discharge.
          npx tsx scripts/census/shad_darshana_gates/yajna_mode2_fixture_gate.ts
