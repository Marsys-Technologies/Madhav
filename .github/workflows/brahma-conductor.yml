# Scheduled trigger disabled 2026-06-18 — brahma autonomous-build path superseded
# by the orchestrator + L0/L1 closure passes. Manual (workflow_dispatch) only.
# Re-enable schedule only if the autonomous conductor is reinstated.
# repository_dispatch (brahma-conductor-kick) also removed — Cloud Scheduler
# backup trigger brahma-prahara-watchdog is already PAUSED in GCP.
name: Brahma Conductor — Autonomous Build Driver

on:
  # Manual trigger for smoke test and first-start
  workflow_dispatch:
    inputs:
      smoke_only:
        description: 'Run SMOKE test only (no full build dispatch)'
        required: false
        default: 'false'
        type: boolean

# Serialise per ref but NEVER cancel: this workflow mutates real infrastructure
# (deploy / terraform / commit-push), and killing it mid-flight can leave a
# half-applied state. Queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  id-token: write    # required for Workload Identity Federation

env:
  WIF_PROVIDER: projects/938361928218/locations/global/workloadIdentityPools/github/providers/github-actions
  WIF_SERVICE_ACCOUNT: brahma-conductor-bot@madhav-astrology.iam.gserviceaccount.com

jobs:
  brahma-conductor:
    name: Brahma Conductor Batch
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      BOT_SA: brahma-conductor-bot@madhav-astrology.iam.gserviceaccount.com
      SMRITI_PATH: 00_ARCHITECTURE/CONDUCTOR/brahma/smriti/build_state.yaml
      MAX_BUDGET_USD: 5000

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install driver deps
        run: pip install pyyaml --quiet

      # ── SMOKE TEST ──────────────────────────────────────────────────────────
      - name: SMOKE — Read Smṛti and verify rig
        id: smoke
        run: |
          python3 - <<'PYEOF'
          import yaml, sys, os

          smriti_path = os.environ.get('SMRITI_PATH',
            '00_ARCHITECTURE/CONDUCTOR/brahma/smriti/build_state.yaml')

          with open(smriti_path) as f:
              d = yaml.safe_load(f)

          # Verify required fields
          assert d['meta']['autonomous_mode'] is True, "SMOKE FAIL: autonomous_mode not true"
          assert d['meta']['max_fix_attempts'] == 5, "SMOKE FAIL: max_fix_attempts != 5"
          assert d['meta']['max_run_budget_usd'] == 5000, "SMOKE FAIL: budget ceiling wrong"

          total = d['queue_summary']['total_sessions']
          pending = d['queue_summary']['pending']
          assert total == 45, f"SMOKE FAIL: expected 45 sessions, got {total}"

          # Check L0 Wave 1 assets are pending with no deps (self-decides on start)
          l0_wave1 = ['BG-0-1', 'BG-0-2', 'BG-0-3', 'BG-0-5']
          assets_by_id = {a['id']: a for a in d['assets']}
          for aid in l0_wave1:
              a = assets_by_id[aid]
              assert a['status'] == 'pending', f"SMOKE FAIL: {aid} not pending"
              assert a['depends_on'] == [], f"SMOKE FAIL: {aid} has unexpected deps"

          # Gate decision smoke: find released (all deps green → release)
          green_ids = {a['id'] for a in d['assets'] if a['status'] == 'green'}
          released = [a['id'] for a in d['assets']
                      if a['status'] == 'pending'
                      and all(dep in green_ids for dep in a.get('depends_on', []))]
          assert len(released) >= 4, f"SMOKE FAIL: expected ≥4 Wave-1 assets released, got {released}"

          print(f"SMOKE PASS ✓")
          print(f"  Sessions: {total} (pending: {pending})")
          print(f"  L0 Wave-1 released: {released}")
          print(f"  Budget ceiling: ${d['meta']['max_run_budget_usd']}")
          print(f"  Safety rails: max_fix_attempts={d['meta']['max_fix_attempts']}, autonomous_mode=True")
          PYEOF

      - name: SMOKE — Report gate decision (no human prompt)
        run: |
          echo "=== SMOKE GATE DECISION ==="
          echo "Input: Smṛti queue with 45 sessions, 0 green"
          echo "Decision: L0 Wave-1 (BG-0-1, BG-0-2, BG-0-3, BG-0-5) released — all depends_on satisfied"
          echo "Action: Dispatch 4 parallel build agents (Racayitā → Śilpī → Review Swarm ×5 → Pratiṣṭhā → Gate-3)"
          echo "Human prompt required: NONE"
          echo "Autonomous mode: CONFIRMED"
          echo "SMOKE TEST: PASS ✓"

      # ── FULL CONDUCTOR BATCH (skipped during smoke-only run) ────────────────
      - name: Read Smṛti — find released assets
        if: ${{ github.event.inputs.smoke_only != 'true' }}
        id: find-released
        run: |
          python3 - <<'PYEOF'
          import yaml, json, os

          smriti_path = os.environ['SMRITI_PATH']
          with open(smriti_path) as f:
              d = yaml.safe_load(f)

          # Check budget ceiling
          spent = float(d['budget']['total_spent_usd'])
          cap = float(os.environ['MAX_BUDGET_USD'])
          if spent >= cap:
              print(f"BUDGET CEILING: ${spent:.2f} >= ${cap}. Halting batch.")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write("released=[]\n")
                  out.write("budget_halted=true\n")
              raise SystemExit(0)

          # Check instrument complete
          assets = d.get('assets', [])
          final = next((a for a in assets if a['id'] == 'MI-L5-VERIFY'), None)
          if final and final['status'] == 'green':
              print("INSTRUMENT COMPLETE — all layers green. Disabling schedule.")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write("instrument_complete=true\n")
                  out.write("released=[]\n")
              raise SystemExit(0)

          green_ids = {a['id'] for a in assets if a['status'] == 'green'}
          released = [a['id'] for a in assets
                      if a['status'] == 'pending'
                      and all(dep in green_ids for dep in a.get('depends_on', []))]

          # Cap at 8 per batch (context budget)
          batch = released[:8]
          print(f"Released this batch: {batch}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"released={json.dumps(batch)}\n")
              out.write(f"total_spent={spent:.2f}\n")
          PYEOF

      - name: Mark released assets in_progress in Smṛti
        if: ${{ github.event.inputs.smoke_only != 'true' && steps.find-released.outputs.released != '[]' }}
        run: |
          python3 - <<'PYEOF'
          import yaml, json, datetime, os

          smriti_path = os.environ['SMRITI_PATH']
          released = json.loads('${{ steps.find-released.outputs.released }}')

          with open(smriti_path) as f:
              d = yaml.safe_load(f)

          for a in d['assets']:
              if a['id'] in released:
                  a['status'] = 'in_progress'

          d['meta']['last_updated'] = datetime.datetime.now(
              datetime.timezone.utc).isoformat()
          d['meta']['batch_count'] = d['meta'].get('batch_count', 0) + 1

          with open(smriti_path, 'w') as f:
              yaml.dump(d, f, allow_unicode=True, sort_keys=False)

          print(f"Smṛti updated: {len(released)} assets → in_progress")
          PYEOF

      - name: Commit Smṛti state update
        if: ${{ github.event.inputs.smoke_only != 'true' && steps.find-released.outputs.released != '[]' }}
        run: |
          git config user.email "brahma-conductor-bot@madhav-astrology.iam.gserviceaccount.com"
          git config user.name "Brahma Conductor Bot"
          git add 00_ARCHITECTURE/CONDUCTOR/brahma/smriti/build_state.yaml
          git commit -m "chore(brahma/smriti): batch ${{ steps.find-released.outputs.batch_count }} — mark released assets in_progress [BRAHMA-BOT]" || echo "Nothing to commit"
          git push origin main || echo "Push skipped (no changes)"
