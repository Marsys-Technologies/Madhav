# chat-v2 smoke gate
#
# After R7-CI-WIRING (this commit): CI smoke runs E2E if secrets are provisioned;
# otherwise still skips — workflow exits 0 vacuously.
# Firebase + SMOKE_SESSION_COOKIE + SMOKE_CHART_ID are injected via `env:` below.
# Local operator runs (with cookies minted) exercise the gate normally.
#
# Operator follow-up (one-time setup):
#   1. Mint a long-lived __session cookie via platform/scripts/dev/mint_session_cookie.ts
#   2. Provision GitHub Actions secrets: SMOKE_SESSION_COOKIE, SMOKE_CHART_ID
#   3. Verify NEXT_PUBLIC_FIREBASE_* + FIREBASE_ADMIN_CREDENTIALS already provisioned
#   4. Enable `chat-v2 smoke / smoke` as required check on main branch protection
#

name: chat-v2 smoke

on:
  pull_request:
    paths:
      - 'platform/src/components/consume/ConsumeChatV2.tsx'
      - 'platform/src/components/chat-v2/**'
      - 'platform/src/components/chat/ConversationSidebarV2.tsx'
      - 'platform/src/components/chat/AssistantMessage.tsx'
      - 'platform/src/components/chat/Composer.tsx'
      - 'platform/src/app/api/chat/consume/route.ts'
      - 'platform/src/lib/synthesis/**'
      - 'platform/src/lib/citations/**'
      - 'platform/src/lib/providers/**'
      - 'platform/src/lib/streams/**'
      - 'platform/src/lib/retrieve/**'
      - 'platform/tests/e2e/chat-v2/round6-walkthrough.spec.ts'
      - 'platform/tests/e2e/chat-v2/fixtures/round6-mock-route.ts'
  merge_group:
    branches:
      - main

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes. Pure check workflow — safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run chat-v2 smoke spec
        run: npx playwright test tests/e2e/chat-v2/round6-walkthrough.spec.ts --project=chromium --reporter=list
        env:
          SMOKE_SESSION_COOKIE: ${{ secrets.SMOKE_SESSION_COOKIE }}
          SMOKE_CHART_ID: ${{ secrets.SMOKE_CHART_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_ADMIN_CREDENTIALS: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS }}
          # Without secrets provisioned, the spec skips (test.skip guard) and
          # the workflow exits 0 vacuously.
