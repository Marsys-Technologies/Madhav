name: ṢAḌ-DARŚANA — Circularity Guard (live-DB LEL-invariance proof)

# The campaign's own hard, unsoftenable gate (SHAD_DARSHANA_BRIEF_v2_0.md §7 rail): "the
# field never reads the LEL; CI invariance test is itself an untouchable gate, live from
# W1 with item 10." The empirical half of that test —
# test_circularity_guard_ka_jivana_parva_invariant_under_lel_mutation, in
# platform/python-sidecar/tests/l3/test_ka_jivana_parva_circularity_guard.py — is marked
# @pytest.mark.integration, and ci.yml's only pytest invocation runs `-m "not integration"`.
# That means the empirical proof has never run automatically since it was written; it ran
# once, by hand, at authorship. This workflow is the missing standing gate.
#
# The test hardcodes a DSN at 127.0.0.1:5433 and reads/writes-then-rolls-back real rows for
# the canonical chart (482012f1) — it needs the actual Cloud SQL instance, not a disposable
# container. This job starts the Cloud SQL Auth Proxy exactly as deploy.yml's
# "Start Cloud SQL Auth Proxy" step does (same WIF identity, same instance connection name),
# on port 5433 to match the test's hardcoded expectation.
#
# Deliberately scoped, not repo-wide: this workflow runs ONLY this one test file. Other
# @pytest.mark.integration tests referenced in this file's own docstring
# (test_cr131_gochara_db_reachability.py, test_ka_gochara_sweep.py) share the same
# never-runs-in-CI gap but are pre-existing and out of this campaign's scope — fixing them
# is a separate, follow-on hygiene item for whoever owns those tests.
#
# Deliberately NOT a required branch-protection check (yet): triggers are workflow_dispatch,
# a nightly schedule, and pushes to main touching ka_* writer paths — it does not gate any
# PR merge. Safe by construction regardless: the test opens one transaction, never commits,
# and rolls back in a `finally` (mirrors the FROZEN writer contract's own
# "ctx.db_conn is NEVER committed by the writer" rule).

on:
  workflow_dispatch: {}
  schedule:
    - cron: '17 20 * * *'  # nightly, off-peak IST morning
  push:
    branches: [main]
    paths:
      - 'platform/python-sidecar/pipeline/orchestrator/writers/ka_*.py'
      - 'platform/python-sidecar/services/ka_*/**'
      - 'platform/python-sidecar/tests/l3/test_ka_jivana_parva_circularity_guard.py'
      # W2 Lane C: the ka_kshetra-specific half of the Guard. The W1 file above
      # names its own proxy honestly ("THIS TEST MUST BE RE-POINTED AT
      # `ka_kshetra` ... ONCE W2 LANDS"); this is that re-pointing. Both are kept
      # until the field runs in production, so neither gate is retired on a promise.
      - 'platform/python-sidecar/tests/l3/ka_kshetra/**'

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes. Pure check workflow — safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WIF_PROVIDER: projects/938361928218/locations/global/workloadIdentityPools/github/providers/github-actions
  WIF_SERVICE_ACCOUNT: github-actions@madhav-astrology.iam.gserviceaccount.com

jobs:
  circularity-guard-live:
    name: Circularity Guard — live-DB invariance proof (item 10, ṢAḌ-DARŚANA)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Start Cloud SQL Auth Proxy (port 5433 — matches the test's hardcoded DSN)
        run: |
          curl -fsSL \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.1/cloud-sql-proxy.linux.amd64" \
            -o cloud-sql-proxy && chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5433 \
            madhav-astrology:asia-south1:amjis-postgres &
          sleep 5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sidecar dependencies
        run: |
          cd platform/python-sidecar
          pip install -r requirements.txt --quiet

      - name: Run the Circularity Guard — static census (defense in depth, DB-free)
        run: |
          cd platform/python-sidecar
          pytest tests/l3/test_ka_jivana_parva_circularity_guard.py -m "not integration" -v --tb=short

      - name: Run the Circularity Guard — ka_kshetra field (W2 Lane C, all three halves)
        # Static census + the vacuity check that proves the census can fail + the
        # dynamic CG-1 hash-invariance proof over two full writer builds whose
        # fixtures differ only in lived-history rows. All DB-free, so unlike the
        # W1 empirical half above this one ALSO runs in the ordinary ci.yml pytest
        # job on every PR — it is duplicated here so the Guard's own workflow
        # reports the field's status in one place.
        run: |
          cd platform/python-sidecar
          pytest tests/l3/ka_kshetra/test_circularity_guard.py -v --tb=short

      - name: Run the Circularity Guard — empirical live-DB invariance proof
        # If the proxy tunnel above failed to come up in time, the test's own
        # `except Exception: pytest.skip(...)` means this step would report a skip, not a
        # false pass — visible in the step summary either way, never silently green.
        run: |
          cd platform/python-sidecar
          pytest tests/l3/test_ka_jivana_parva_circularity_guard.py -m integration -v --tb=short -rs
