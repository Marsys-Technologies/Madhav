name: Paripraśna Post-Deploy Behaviour Smoke (P3-E / PB-4 F-6)

# PARIPRASHNA_P3_P4_OVERNIGHT_AUTONOMOUS_RUN_v2_0.md §4, lane P3-E.
#
# THE GAP THIS CLOSES: `scripts/operator/end_to_end_smoke.sh` (run by
# deploy.yml after every amjis-web deploy) says so in its own header —
# "Honestly NOT covered, and deliberately not claimed: no DB round-trip, no
# authenticated request, no chart render. Those need a web canary credential
# that does not exist yet." That is PB-4 finding F-6. Every OTHER post-deploy
# check in this repo (fresh_chart_smoke.yml, gochara-smoke-probe.yml,
# elev-serving-gates.yml) either checks the DB directly or calls the MCP
# door — none of them drive a real authenticated turn through the WEB door
# (`/api/pariprashna`), which is the door THE FLIP (P3-F) makes the default
# for everyone. This workflow is that missing check.
#
# ── TWO JOBS, AND WHY THEY ARE NOT INTERCHANGEABLE ───────────────────────
#
# 1. `assertion-selftest` — runs `post_deploy_behavior_smoke.ts` with
#    SMOKE_SELFTEST=1. Zero network calls, zero secrets, zero cost. It
#    evaluates the SAME assertion function used by the live job against a
#    REAL captured production turn record, then applies one targeted mutation
#    per assertion and requires that assertion to go false while every other
#    assertion stays exactly as it was. This is the CLAUDE.md §N.8
#    demonstrated-can-fail evidence for the assertion LOGIC.
#
#    IT IS NOT A BEHAVIOUR SMOKE. It observes nothing about the deployed
#    revision. A green here must NEVER be counted toward the DD-7 / W-1
#    green×7 cadence that gates THE FLIP (P3-F) — that counter is fed by the
#    `behaviour-smoke` job below and by nothing else. The job name says so.
#
# 2. `behaviour-smoke` — the real thing: one live authenticated turn against
#    the deployed `/api/pariprashna` route on the SYNTHETIC test chart
#    (`1c826d5a-41cb-4450-b4dc-59d440e5f75a`, Abhinandan Mohanty — NEVER the
#    native's real chart), asserting real engine behaviour. This is the only
#    job whose green counts toward green×7.
#
# ── CREDENTIAL STATUS (read before dispatching) ──────────────────────────
#
# `behaviour-smoke` needs the GitHub Actions repo secrets
# FIREBASE_ADMIN_CREDENTIALS + NEXT_PUBLIC_FIREBASE_API_KEY, from which
# `probe/ask.ts` mints a fresh single-use Firebase session cookie for the
# fixed `probe-service-account` principal on every run.
#
# AS OF 2026-08-23 THIS JOB CANNOT PASS: the repo secret
# FIREBASE_ADMIN_CREDENTIALS (set 2026-05-18) holds a ONE-CHARACTER
# placeholder, not a service-account JSON object — proved live by a
# shape-only diagnostic on run 32600417256 (`length=1 chars; does NOT start
# with '{'`), which is exactly what produced ask.ts's
# `SyntaxError: No number after minus sign in JSON at position 1`. No
# workflow in this repo had ever consumed that secret before this one
# (deploy.yml reads the real credential from Secret Manager via Cloud Run's
# `--set-secrets firebase-admin-credentials:1`, never from GitHub), so the
# placeholder had never been exercised and nothing detected it.
#
# Repairing it is a CREDENTIAL OPERATION and is therefore out of scope for
# every agent in the overnight run (charter §9). The preflight below fails
# LOUDLY and precisely rather than letting the job die in a JSON.parse stack
# trace — but it does not, and must not, route around the gap.
#
# The GCP-side fallback is closed too, not merely unused: `ask.ts` would fall
# back to `gcloud secrets versions access` if the env var were unset, but the
# CI WIF identity `github-actions@madhav-astrology.iam.gserviceaccount.com`
# holds NO secretmanager role at either resource or project level (verified
# read-only, 2026-08-23: `firebase-admin-credentials` grants
# secretAccessor to `938361928218-compute@…` only). Granting it would also be
# a credential/IAM operation.
#
# ── TRIGGERING ───────────────────────────────────────────────────────────
# `behaviour-smoke`: workflow_dispatch (the overnight conductor's 45-minute
# cadence; CI's own run history, not any agent's word, is what counts
# green×7) plus an opportunistic workflow_run hook on deploy.yml. It
# deliberately does NOT run on pull_request — it costs one real
# retrieval+synthesis turn against production per run, which is not something
# every PR touching this file should spend.
# `assertion-selftest`: runs on all three triggers including pull_request
# (paths-scoped to this workflow's own two files), because editing the
# assertion logic without re-proving it can still individually fail is
# precisely the regression it exists to catch. It is free.
#
# ADDITIVE-ONLY: this file adds no trigger to, and modifies no step of, any
# existing workflow.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ['Deploy to Cloud Run']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pariprashna-post-deploy-smoke.yml'
      - 'platform/scripts/probe/post_deploy_behavior_smoke.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── §N.8 evidence for the assertion logic. Free. NOT a behaviour smoke. ──
  assertion-selftest:
    name: Assertion self-test (fixtures, no live turn — NOT countable toward green×7)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Self-test — GOOD fixture all-pass, then one targeted mutation per assertion
        env:
          SMOKE_SELFTEST: '1'
        run: npx tsx scripts/probe/post_deploy_behavior_smoke.ts

  # ── The real behaviour smoke. The ONLY job whose green counts toward the
  #    DD-7 / W-1 green×7 cadence that gates THE FLIP. ──────────────────────
  behaviour-smoke:
    name: Live authenticated turn — behaviour assertions
    runs-on: ubuntu-latest
    # Never on pull_request (see the trigger note above — a real paid turn).
    # For workflow_run, only follow a SUCCESSFUL deploy; a failed deploy's
    # smoke would just re-test whatever revision was already live, which the
    # 45-minute dispatch cadence already covers.
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    env:
      FIREBASE_ADMIN_CREDENTIALS: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
    steps:
      # NOTE: this step must run BEFORE checkout and must NOT inherit the
      # job-level `working-directory: platform` default — that directory does
      # not exist yet pre-checkout. Confirmed live: the first version of this
      # workflow ran the preflight under `defaults.run.working-directory` and
      # failed with "No such file or directory" before ever reaching the
      # secret check.
      #
      # SHAPE, NEVER CONTENT. Nothing below echoes, decodes, or otherwise
      # exposes a secret value; only a boolean shape verdict and, on failure
      # only (i.e. when the value is by definition not a real credential), its
      # byte length. This exists because the FIRST live run of this workflow
      # died inside ask.ts's `JSON.parse` with an opaque
      # "No number after minus sign in JSON at position 1" — a
      # misconfigured-secret condition wearing an engine-failure costume. A
      # smoke that stands in front of a production flip must be able to tell
      # those two apart (CLAUDE.md §N.8: a signal needs a detector that
      # measures the specific claim it asserts).
      - name: Preflight — required secrets present AND well-shaped (fail loud, never a fabricated pass)
        working-directory: .
        run: |
          fail=0
          if [ -z "${FIREBASE_ADMIN_CREDENTIALS}" ]; then
            echo "::error::[p3-e-smoke] FIREBASE_ADMIN_CREDENTIALS is not set."
            fail=1
          else
            shaped=1
            case "${FIREBASE_ADMIN_CREDENTIALS}" in
              \{*) : ;;
              *) shaped=0 ;;
            esac
            if [ "${#FIREBASE_ADMIN_CREDENTIALS}" -lt 500 ]; then shaped=0; fi
            if [ "$shaped" -eq 0 ]; then
              echo "::error::[p3-e-smoke] FIREBASE_ADMIN_CREDENTIALS is set but is NOT a plausible service-account JSON object (expected a value starting with '{' and at least 500 bytes long; the real credential is ~2300). Observed length: ${#FIREBASE_ADMIN_CREDENTIALS} bytes. This is a MISCONFIGURED SECRET, not an engine failure — do NOT read this run as a behavioural red against the deployed revision."
              echo "::error::[p3-e-smoke] Repair (operator only — a credential operation, out of scope for automated agents): re-upload the same service-account JSON that Cloud Run already uses, e.g. 'gcloud secrets versions access 1 --secret=firebase-admin-credentials --project=madhav-astrology | gh secret set FIREBASE_ADMIN_CREDENTIALS --repo Marsys-Technologies/Madhav'"
              fail=1
            fi
          fi
          if [ -z "${NEXT_PUBLIC_FIREBASE_API_KEY}" ]; then
            echo "::error::[p3-e-smoke] NEXT_PUBLIC_FIREBASE_API_KEY is not set."
            fail=1
          elif [ "${#NEXT_PUBLIC_FIREBASE_API_KEY}" -lt 30 ]; then
            echo "::error::[p3-e-smoke] NEXT_PUBLIC_FIREBASE_API_KEY is set but is implausibly short (${#NEXT_PUBLIC_FIREBASE_API_KEY} bytes; a Firebase web API key is ~39). Likely a placeholder."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "[p3-e-smoke] required secrets present and well-shaped."

      # ── BLOCKING-2 (completeness audit 2026-08-23) ────────────────────────
      # A `workflow_run`-triggered job checks out the DEFAULT BRANCH TIP, not
      # the commit whose deploy triggered it. Observed: smoke 32615193678
      # labelled itself `0253f5e8e` at 03:22:42Z while production was serving
      # the deploy of `97d2b7312` — and `0253f5e8e`'s own deploy did not start
      # until 03:30:21Z, eight minutes LATER. Three more runs showed the same
      # 7-9 minute skew.
      #
      # Two things were wrong at once: the run was ATTRIBUTED to a commit that
      # was never on the serving revision, and it ran PROBE CODE from a
      # different commit than the artifact under test. The DD-7 green×7 counter
      # — which gates THE FLIP and the irreversible P4-B deletion — is read off
      # that attribution, so both would have counted greens against the wrong
      # artifact.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # The attribution the DD-7 green×7 counter must be read against. This is
      # a detector, not a label: if the pin above ever silently stops working
      # (action upgrade, expression change), HEAD and the intended SHA diverge
      # and this step goes RED instead of quietly mis-attributing another green.
      - name: Record and verify smoke attribution (DD-7 counter reads THIS sha)
        working-directory: .
        run: |
          set -euo pipefail
          INTENDED='${{ github.event.workflow_run.head_sha || github.sha }}'
          ACTUAL="$(git rev-parse HEAD)"
          TRIGGER='${{ github.event_name }}'
          echo "attributed_sha=$INTENDED"
          echo "checked_out_sha=$ACTUAL"
          echo "trigger=$TRIGGER"
          {
            echo "### Paripraśna smoke attribution"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| trigger | \`$TRIGGER\` |"
            echo "| attributed sha (count greens against this) | \`$INTENDED\` |"
            echo "| checked-out sha | \`$ACTUAL\` |"
            if [ "$TRIGGER" = 'workflow_run' ]; then
              echo "| triggering deploy run | \`${{ github.event.workflow_run.id }}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$INTENDED" != "$ACTUAL" ]; then
            echo "::error::Attribution skew: intended $INTENDED but checked out $ACTUAL." \
                 "The DD-7 counter would credit the wrong artifact. Failing loud (BLOCKING-2)."
            exit 1
          fi
          echo "attribution verified: smoke is running the code that was deployed."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Live behaviour smoke — real authenticated turn on the synthetic chart
        run: npx tsx scripts/probe/post_deploy_behavior_smoke.ts

      - name: Annotate failure
        if: failure()
        working-directory: .
        run: |
          echo "::error::[p3-e-smoke] Post-deploy behaviour smoke FAILED — see the step above for which assertion failed and why."
          echo "::error::[p3-e-smoke] This is a real engine-behaviour check (receipt assembly / persistence chain, facts_consumed grounding, citation pipeline, safety-gate execution, non-trivial prose, zero stream errors) — NOT a liveness ping. Do not count this toward green×7 (DD-7 / W-1) until it is understood."
