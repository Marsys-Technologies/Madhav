name: TAP CI — Total Audit Protocol Suite

# R6 lane 5-harness. Implements the CI/regression half of
# 00_ARCHITECTURE/TOTAL_AUDIT_PROTOCOL_v1_0.md §3 + the Phase 5 "VERIFICATION
# HARNESS" line of MARSYS_DEFECT_GAP_REGISTER_v2_0.md's phased implementation
# plan: "TAP CI suite: the 7 seam-conservation checks (TAP-5 spec), TAP-6 grep
# set, TAP-7 8 gates, S-13 live coverage matrix."
#
# Merged EARLY per design (TOTAL_AUDIT_PROTOCOL_v1_0.md §5 "Immediate (with
# R6)"), then ratcheted as other R6 lanes land fixes:
#   - TAP-6 (method-audit grep) and the SC-17/18/19 boot-time pointer check
#     are pure static analysis — they run on every push/PR, no DB needed,
#     and gate merges today.
#   - TAP-5 (seam conservation), TAP-7 (distribution gates), and S-13 (live
#     coverage matrix) need a reachable Postgres — they run against a
#     DATABASE_URL secret when configured, and degrade to an explicit
#     SKIPPED-WITH-REASON (never a silent pass) when it is not. See
#     platform/scripts/audit/tap/README.md for the Cloud SQL Auth Proxy
#     invocation the real pipeline should wire in.
#   - The per-tool MCP smoke battery needs a deployed platform-mcp instance;
#     it runs in PLAN mode (enumerate + classify, no live calls) here and
#     documents expected-fail (known-dead, register-cited) vs expected-pass
#     for every one of the 109 registered tools.
#
# Every job that cannot achieve a hard PASS in this environment is marked
# QUARANTINED/SKIPPED with an explicit register-row citation — per TAP-9
# discipline (TOTAL_AUDIT_PROTOCOL_v1_0.md §3), an absent oracle must be
# declared, never silently passed.

# Trigger scoping (CI efficiency audit, 2026-07-31). This workflow previously ran on
# EVERY pull request with no path filter. Its three live gates scan, verified by reading
# each script's own roots rather than inferring them:
#   tap6_method_grep.ts       -> platform/python-sidecar  (every pattern's `root:`)
#   sc_pointer_validation.ts  -> platform-mcp/src  +  platform/src/lib/retrieval
#   r18_param_noop_audit.ts   -> platform-mcp/src/tools
# The DB-backed gates (TAP-5 / TAP-7 / S-13) and the MCP smoke battery are already
# `if:`-guarded on secrets that do not exist in this repo, so they contribute nothing
# either way. Measured over the last 60 commits to main, 55% touch none of the paths
# below — a lower skip rate than the other two lanes because python-sidecar is busy.
#
# Safe because none of this workflow's checks is required by branch protection on main
# (verified 2026-07-31). NEVER add a path filter to ci.yml.
#
# To revert: delete the `paths:` block.
# DUPLICATE-TRIGGER FIX (CI efficiency audit, 2026-07-31). The `push:` list used to
# include 'feature/**' and 'r6/**'. That caused a PR opened from such a branch to run this
# entire workflow TWICE per push — once for `push`, once for `pull_request` — because
# the two events land in DIFFERENT concurrency groups (`github.ref` is
# refs/heads/<branch> for push but refs/pull/<n>/merge for pull_request), so the
# concurrency block below cannot dedupe them.
#
# This was PROVEN, not assumed. A scratch branch `feature/ci-concurrency-probe` with an
# open PR was pushed to, and commit d8e82d5 produced BOTH a push run and a
# pull_request run of all four always-on workflows — 8 runs for one commit. (The same
# probe also confirmed the concurrency groups DO work within an event type: push A's
# four runs went `cancelled` the instant push B landed 7s later.)
#
# `push: [main]` is retained — post-merge runs on main are legitimate and gate deploy.
# To revert: put 'feature/**' and 'r6/**' back in the push branches list.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      # The gates' own source
      - 'platform/scripts/audit/tap/**'
      # What the gates actually scan
      - 'platform/python-sidecar/**'
      - 'platform-mcp/src/**'
      - 'platform/src/lib/retrieval/**'
      # This file
      - '.github/workflows/tap-ci.yml'

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes. Pure check workflow — safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tap6-method-audit:
    name: TAP-6 — Method audit grep set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run TAP-6 grep set (no DB required)
        working-directory: platform
        run: npx tsx scripts/audit/tap/tap6_method_grep.ts

  sc-pointer-validation:
    name: Boot-time pointer validation (SC-17/18/19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run pointer resolution check (no DB required)
        working-directory: platform
        run: npx tsx scripts/audit/tap/sc_pointer_validation.ts

  # CI efficiency audit (2026-07-31) — the secret-gated TAP gates below are now
  # `if:`-guarded on their secret being present, instead of running unconditionally
  # under continue-on-error.
  #
  # WHY: `gh secret list` shows this repo has NO TAP_DATABASE_URL,
  # TAP_MCP_SERVER_URL, TAP_MCP_SMOKE_BEARER_TOKEN or TAP7_API_BASE_URL. So every
  # one of these steps has, on every push and every PR since the workflow merged,
  # started a runner, compiled the script via npx tsx, exited 3
  # (SKIPPED-WITH-REASON) and been swallowed by continue-on-error — a green check
  # that asserted nothing.
  #
  # The gates are NOT deleted: TOTAL_AUDIT_PROTOCOL_v1_0.md §3 still wants them, and
  # the scripts are real. Guarding on the secret means they show as honestly SKIPPED
  # in the UI rather than falsely green, cost nothing while unconfigured, and light
  # up automatically the moment a secret is added — at which point drop the
  # remaining continue-on-error so a genuine failure blocks. See
  # platform/scripts/audit/tap/README.md for the Cloud SQL Auth Proxy wiring.
  # ─────────────────────────────────────────────────────────────────────────────
  # RETIRED 2026-07-31 to workflow_dispatch. Its secret, TAP_MCP_SERVER_URL, HAS NEVER
  # EXISTED in this repo and nothing is scheduled to create it. Every push and PR since
  # this workflow merged has started a runner purely to print a skip line.
  #
  # A job that has never been able to run is not a passing job. Retired rather than
  # deleted — the script is real and the battery is wanted.
  # RE-ARM: add the TAP_MCP_SERVER_URL secret (plus TAP_MCP_SMOKE_BEARER_TOKEN), then
  # delete the `if:` line below.
  # ─────────────────────────────────────────────────────────────────────────────
  mcp-tool-smoke-plan:
    name: MCP per-tool smoke battery [dispatch-only — needs TAP_MCP_SERVER_URL]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MCP_SERVER_URL: ${{ secrets.TAP_MCP_SERVER_URL }}
      MCP_SMOKE_BEARER_TOKEN: ${{ secrets.TAP_MCP_SMOKE_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enumerate + classify every registered tool
        working-directory: platform
        continue-on-error: true
        run: npx tsx scripts/audit/tap/mcp_tool_smoke.ts

  tap-db-gates:
    name: TAP-5 / TAP-7 / S-13 — DB-backed conservation + distribution gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.TAP_DATABASE_URL }}
      TAP7_API_BASE_URL: ${{ secrets.TAP7_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - name: npm ci (platform)
        working-directory: platform
        run: npm ci
      # R-18 — KEEP, always. Ratchet PROVEN 2026-07-31: a probe tool declaring a zod param
      # (`never_read_param`) never referenced in its own handler made this exit 1 and NAME
      # both the tool and the param. That is the real ratchet firing on a NEW violation, not
      # merely crash-on-missing-input. Nothing to change here; recorded so the next audit
      # does not re-litigate it.
      - name: R-18 param no-op audit (static, no DB required)
        working-directory: platform
        run: npx tsx --conditions=react-server scripts/audit/tap/r18_param_noop_audit.ts

      # TAP-5 — KEEP on the PR path, and NOTE THE CHANGE: the `if: env.DATABASE_URL != ''`
      # guard was REMOVED here (2026-07-31), which is a deliberate deviation worth reading.
      #
      # TAP-5 is cited as the pattern the other DB-backed gates should copy: it splits into
      # 7 laws, honestly marks the 5 DB-backed ones SKIPPED with a reason, and genuinely
      # executes the two STATIC ones (Law-4 table/column readers, Law-7 tool-pointer
      # resolution). Verified locally: with no DATABASE_URL it exits 0 having really run
      # Laws 4 and 7, and it has TEETH — injecting a bogus `instrument:` pointer makes it
      # exit 1 with "[FAIL] Law-7" naming the bogus tool.
      #
      # But under the old guard NONE of that happened in CI: no DATABASE_URL secret exists,
      # so the step was skipped entirely and its static half never ran. The exemplary
      # behaviour was invisible. Dropping the guard is what makes the claim true — the DB
      # laws still self-report SKIPPED, which is the honest-skip discipline we want, and
      # Laws 4 and 7 now actually gate. continue-on-error is also dropped: a Law-7 failure
      # is a real regression.
      # To revert: restore `if: env.DATABASE_URL != ''` and `continue-on-error: true`.
      - name: TAP-5 seam conservation (Laws 4 + 7 static; DB laws self-report SKIPPED)
        working-directory: platform
        run: npx tsx --conditions=react-server scripts/audit/tap/tap5_seam_conservation.ts

      # ── RETIRED 2026-07-31 to workflow_dispatch: S-13 and TAP-7 ──────────────────────
      # TAP_DATABASE_URL and TAP7_API_BASE_URL HAVE NEVER EXISTED in this repo and nothing
      # is scheduled to create them. Both steps have therefore exited 3 (SKIPPED-WITH-REASON)
      # on every push and PR, swallowed by continue-on-error — a runner started per PR to
      # print a skip. A gate that has never been able to run is not a passing gate.
      # Nothing deleted; the scripts are real.
      # RE-ARM: add the TAP_DATABASE_URL secret (and TAP7_API_BASE_URL for TAP-7), then
      # delete the `if:` line on the step.
      - name: S-13 live coverage matrix [dispatch-only — needs TAP_DATABASE_URL]
        if: github.event_name == 'workflow_dispatch'
        working-directory: platform
        continue-on-error: true
        run: npx tsx --conditions=react-server scripts/audit/tap/s13_coverage_matrix_live.ts
      - name: TAP-7 distribution gates [dispatch-only — needs TAP_DATABASE_URL + TAP7_API_BASE_URL]
        if: github.event_name == 'workflow_dispatch'
        working-directory: platform
        continue-on-error: true
        run: npx tsx --conditions=react-server scripts/audit/tap/tap7_distribution_gates.ts
