name: Verification Invariant (standing watchdog)

# Deliberately NOT a required PR check and NOT pull_request-triggered.
#
# It measures the DATA, which a PR does not change. Wiring it to PRs would add ~1 min to every
# PR to re-measure something no PR moved — the exact "gate that runs where it cannot learn
# anything" pattern this CI campaign spent its length removing.
#
# It exists because four M-22 layers were each DISCOVERED by an audit rather than REPORTED by
# anything watching. See platform/scripts/audit/verification_invariant.py for what each check
# watches and which past defect it would have caught.

on:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC daily — off the hour, away from the deploy windows
  workflow_dispatch:

concurrency:
  group: verification-invariant
  cancel-in-progress: false

jobs:
  invariant:
    name: verification_pass_status — claim-vs-evidence, vocabulary, detector liveness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install the minimum needed to import the vocabulary + talk to the DB
        # requirements-ci.txt (platform/python-sidecar) already pins PyJHora==4.8.6 and is the
        # repo's verified minimal set for exactly this import surface — see that file's header.
        # detector_liveness imports pipeline.orchestrator.writers.ga_nakshatra, which pulls in
        # pyjhora_adapter (jhora); without this the job fails with "No module named 'jhora'".
        run: pip install --quiet -r platform/python-sidecar/requirements-ci.txt

      # ── DB reachability (same pattern as #990 / tap-ci.yml's tap-db-gates job) ──────────
      # amjis-postgres has a public IP but ZERO authorized networks, so a runner cannot reach
      # it directly. deploy.yml (~lines 278-295) already solves this: authenticate via WIF,
      # then run the Cloud SQL Auth Proxy on 127.0.0.1:5432. PROD_DATABASE_URL is a
      # loopback-form connection string that only resolves once this proxy is listening —
      # without it the job fails with "connection ... 127.0.0.1:5432 ... Connection refused"
      # (confirmed by the one historical run of this workflow). Replicating the exact,
      # already-proven pair here, same as #990 did for S-13/TAP-7.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/938361928218/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-actions@madhav-astrology.iam.gserviceaccount.com

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.1/cloud-sql-proxy.linux.amd64" \
            -o cloud-sql-proxy && chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 \
            madhav-astrology:asia-south1:amjis-postgres &
          sleep 5

      # Detector liveness needs no database, so it runs even when the DB is unreachable —
      # a watchdog that goes quiet when one input is missing is not a watchdog.
      - name: Run the invariant
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set +e
          python platform/scripts/audit/verification_invariant.py
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "::warning::DATABASE_URL unavailable — data checks QUARANTINED; liveness still ran."
            exit 0
          fi
          exit $code
