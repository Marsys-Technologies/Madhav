name: Deploy to Cloud Run

on:
  # Deploy only after CI passes — prevents deploying broken builds.
  # Fires when "CI — Ganga Quality Gate" completes on main; the job-level
  # `if:` below gates on conclusion == 'success'.
  workflow_run:
    workflows: ["CI — Ganga Quality Gate"]
    types: [completed]
    branches: [main]
  # PR trigger: build-only job (no push, no Cloud Run deploy) catches
  # Dockerfile / Next.js build failures before merge.
  pull_request:
    branches: [main]
    paths:
      - 'platform/**'
      - 'platform-mcp/**'
      - '.github/workflows/deploy.yml'
  # Manual deploys stay available — but they are held to the SAME CI gate as an automatic
  # deploy unless an operator deliberately overrides it and says why. Until SAMĀPTI this
  # trigger bypassed the CI gate outright (`event_name == 'workflow_dispatch' || ...` on every
  # deploy job), observed 3x in one night — twice landing ~4 minutes AHEAD of CI completion.
  # See Dvārapāla RULING 71 / RULING 73-CLOSE and platform/scripts/ci/dispatch_gate.ts.
  workflow_dispatch:
    inputs:
      ci_gate:
        description: 'CI gate for this manual deploy'
        type: choice
        required: true
        default: require-ci-green
        options:
          - require-ci-green
          - EMERGENCY-OVERRIDE-CI-NOT-GREEN
      emergency_reason:
        description: 'Required when overriding: what is on fire (>= 20 chars, recorded in the run log)'
        type: string
        required: false
        default: ''
      force_all_services:
        description: 'Also deploy sidecar / MCP / pipeline-job even if their paths did not change'
        type: boolean
        required: false
        default: false
      data_plane_cutover:
        description: 'Explicitly authorize the protected data-plane bootstrap/cutover path for this exact SHA'
        type: boolean
        required: false
        default: false

# CI efficiency audit (2026-07-31). Two different behaviours in one workflow:
#   - pull_request  -> the `build-check` job only, which builds with `push: false`
#                      for both the web and pipeline-job images (verified). Nothing
#                      leaves the runner, so a superseded run is safe to cancel, and
#                      at ~346s it is worth cancelling.
#   - everything else (workflow_run on main, workflow_dispatch) -> the real deploy
#                      jobs, which push images and update Cloud Run. NEVER cancel
#                      these; killing one mid-flight can leave a half-applied state.
#                      They serialise on the group and queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_REGION: asia-south1
  WIF_PROVIDER: projects/938361928218/locations/global/workloadIdentityPools/github/providers/github-actions
  WIF_SERVICE_ACCOUNT: github-actions@madhav-astrology.iam.gserviceaccount.com
  # A workflow_run executes from the default branch by default, which may have
  # advanced after the CI run that authorized this deploy. Pin every deploy
  # checkout and immutable image tag to that CI run's exact head instead.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # ── PR build-check: build without push to catch Dockerfile/Next.js failures pre-merge ──
  build-check:
    name: Build Check (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A PR image build must not hold the merge queue at GitHub Actions' six-hour
    # default when a hosted BuildKit worker stalls before emitting progress.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy governance files into platform build context
        run: |
          mkdir -p platform/00_ARCHITECTURE
          cp 00_ARCHITECTURE/CAPABILITY_MANIFEST.json platform/00_ARCHITECTURE/CAPABILITY_MANIFEST.json
          cp 00_ARCHITECTURE/manifest_overrides.yaml platform/00_ARCHITECTURE/manifest_overrides.yaml
          cp 00_ARCHITECTURE/PLANNER_PROMPT_v*.md platform/00_ARCHITECTURE/
          cp -r 01_FACTS_LAYER platform/01_FACTS_LAYER
          cp -r 025_HOLISTIC_SYNTHESIS platform/025_HOLISTIC_SYNTHESIS
          cp -r 035_DISCOVERY_LAYER platform/035_DISCOVERY_LAYER

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: false
          cache-from: type=gha,scope=amjis-web
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=ci-placeholder
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-placeholder
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-placeholder
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-placeholder
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=ci-placeholder
            NEXT_PUBLIC_FIREBASE_APP_ID=ci-placeholder
            NEXT_PUBLIC_APP_URL=https://amjis-web.run.app
            NEXT_PUBLIC_NIM_STACK_DEGRADED=false
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=
            NEXT_PUBLIC_MARSYS_FLAG_R9_PERSONAS=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_SCROLL_DISCIPLINE=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_INTERACTIVE_TABLES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_MERMAID=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_CITATION_FRESHNESS=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_VALIDATOR_GATES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_EDIT_WHILE_STREAMING=false
            NEXT_PUBLIC_MARSYS_FLAG_R11C_TOOL_CARDS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_PROJECTS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_SEMANTIC_SEARCH=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_TOOL_FLOW=true
            NEXT_PUBLIC_MARSYS_FLAG_R11B_LOOK_AND_FEEL=true
            NEXT_PUBLIC_MARSYS_FLAG_R11V2_MULTI_PROVIDER_PARITY=true
            NEXT_PUBLIC_PARIPRASHNA_LIVE=1

      # The regular serving image is distinct from Dockerfile.pipeline. Building it
      # on every PR that reaches this protected check prevents a sidecar-only change
      # from first discovering packaging/import failures after merge.
      - name: Build regular sidecar image (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./platform  # widened from ./platform/python-sidecar for #2096 (reach sibling scripts/temporal)
          file: ./platform/python-sidecar/Dockerfile
          push: false
          load: true
          tags: amjis-sidecar:pr-check
          cache-from: type=gha,scope=amjis-sidecar

      - name: Verify Nirmana route and release smoke are packaged
        run: |
          docker run --rm --entrypoint python amjis-sidecar:pr-check -c \
            "from main import app; assert any(r.path == '/internal/nirmana/probe' for r in app.routes)"
          docker run --rm --entrypoint python amjis-sidecar:pr-check -c \
            "from pathlib import Path; assert Path('scripts/nirmana_probe_release_smoke.py').is_file(); assert Path('scripts/nirmana_probe_contracts.json').is_file()"

      # Build the orchestrator job image (no push) so a broken Dockerfile.pipeline
      # — e.g. a missing COPY for ga_writers/ — is caught at PR time. Context is the
      # repo root because Dockerfile.pipeline COPYs from repo-root paths
      # (platform/python-sidecar/* and 035_DISCOVERY_LAYER/*).
      - name: Build pipeline job image (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform/python-sidecar/Dockerfile.pipeline
          push: false
          load: true
          tags: brahma-pipeline:pr-check
          cache-from: type=gha,scope=brahma-pipeline

      - name: Verify ga_writers is importable in the pipeline image
        run: |
          docker run --rm --entrypoint python brahma-pipeline:pr-check \
            -c "import ga_writers; print('ga_writers OK:', ga_writers.__file__)"

  # ── Deploy gate + path-change detection ─────────────────────────────────────
  # Runs only on workflow_run success or manual dispatch (same guard as deploy
  # jobs). pull_request events never reach this job. Fallback: if HEAD~1
  # doesn't exist (first commit / shallow root), all three outputs default to
  # 'true' so gated jobs deploy safely rather than silently skip.
  #
  # SAMĀPTI: this job is now also the CI gate for MANUAL dispatches. Every deploy
  # job `needs: [changes]`, so failing here skips all of them — no `always()`
  # gymnastics, no new job topology, and the fail-closed direction is the safe one.
  changes:
    name: Gate & detect changed paths
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the CI workflow's conclusion for this SHA
      id-token: write # WIF auth: the gate reads each component's DEPLOYED commit from Cloud Run (#2169)
    outputs:
      web: ${{ steps.diff.outputs.web }}
      sidecar: ${{ steps.diff.outputs.sidecar }}
      mcp: ${{ steps.diff.outputs.mcp }}
      pipeline: ${{ steps.diff.outputs.pipeline }}
      force_all: ${{ steps.gate.outputs.force_all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      # ── SAMĀPTI: close the workflow_dispatch CI-gate bypass ──────────────────
      # A manual dispatch used to deploy regardless of CI. It now defaults to the
      # same CI-green requirement as an automatic deploy; bypassing it takes two
      # deliberate acts (select the EMERGENCY-OVERRIDE-CI-NOT-GREEN choice AND type
      # a >= 20-char reason), both recorded here. Emergency capability preserved —
      # that was RULING 73-CLOSE's stated objection to hardening this.
      # Decision logic + unit tests: platform/scripts/ci/dispatch_gate.ts.
      - name: Set up Node.js for the dispatch gate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve CI conclusion for this SHA
        id: ci_status
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest-first; take the most recent COMPLETED run of the CI workflow for THIS sha.
          RUNS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=50" \
            --jq '[.workflow_runs[] | select(.status=="completed")] | first' 2>/dev/null || echo '')
          if [ -z "$RUNS" ] || [ "$RUNS" = "null" ]; then
            CONCLUSION=none
            URL=""
          else
            CONCLUSION=$(printf '%s' "$RUNS" | jq -r '.conclusion // "none"')
            URL=$(printf '%s' "$RUNS" | jq -r '.html_url // ""')
          fi
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "CI conclusion for ${GITHUB_SHA}: $CONCLUSION ${URL}"

      - name: Manual-dispatch CI gate
        if: github.event_name == 'workflow_dispatch'
        env:
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_CI_GATE: ${{ inputs.ci_gate }}
          GATE_EMERGENCY_REASON: ${{ inputs.emergency_reason }}
          GATE_CI_CONCLUSION: ${{ steps.ci_status.outputs.conclusion }}
          GATE_CI_RUN_URL: ${{ steps.ci_status.outputs.url }}
          GATE_SHA: ${{ github.sha }}
        run: |
          cd platform && npx --yes tsx scripts/ci/dispatch_gate.ts
      # ── /SAMĀPTI dispatch gate ───────────────────────────────────────────────

      - name: Resolve force-all-services flag
        id: gate
        run: |
          # 'true' ONLY when an operator explicitly asked for it on a manual dispatch.
          # Previously every dispatch force-deployed all services implicitly, discarding
          # the path outputs this job had just computed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_all_services }}" = "true" ]; then
            echo "force_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "force_all=false" >> "$GITHUB_OUTPUT"
          fi

      # The gate reads each component's DEPLOYED commit from Cloud Run itself
      # (#2169) -- authenticate exactly the way the deploy jobs do.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Detect changed paths
        id: diff
        run: |
          # #2169, three failures deep in one hazard class ("deploy reports
          # green while silently doing less" -- DVA Ruling 58's class):
          # (1) HEAD~1 diffing missed backlog commits under a fast-merging
          # queue. (2) The #2172 fix diffed from the GitHub API's "most
          # recent successful deploy run" head_sha -- a live, mutable view
          # that under fast cadence resolved to this run's OWN sha: a
          # self-diff, always empty, silently skipping every component
          # rebuild (confirmed live 2026-09-07: pipeline image stale ~3.5h
          # across 17 green deploy runs; a real W4 build failed on it).
          # (3) This fix: the diff base is no longer any record ABOUT
          # deploys -- it is read from PRODUCTION ITSELF, per component.
          # Each deploy job stamps what it ships (revision label
          # `commit-sha` for services, the `:<sha>` image tag for the
          # pipeline job); that value changes only when a deploy genuinely
          # completes, so the diff accumulates the whole undeployed backlog
          # by construction and cannot wobble with API-view instability.
          # Skip is only chosen when diff(<deployed-sha>..HEAD) touches
          # none of the component's paths -- the gate itself is now the
          # §N.8 detector for "production already contains every relevant
          # commit"; there is no separate marker to forget to update.
          # FAIL-OPEN: any failure to resolve or fetch a component's
          # deployed sha deploys that component. The gate may only fail
          # toward doing MORE work, never silently less (charter C12
          # rewrite-floor test, applied to CI). All three resolution
          # commands were dry-run verified live against this project's
          # real Cloud Run surfaces before this landed.

          WEB_PATTERN='^(platform/|00_ARCHITECTURE/CAPABILITY_MANIFEST\.json$|00_ARCHITECTURE/manifest_overrides\.yaml$|00_ARCHITECTURE/PLANNER_PROMPT_v.*\.md$|01_FACTS_LAYER/|025_HOLISTIC_SYNTHESIS/|035_DISCOVERY_LAYER/)'
          SIDECAR_PATTERN='^platform/python-sidecar/'
          MCP_PATTERN='^platform-mcp/'
          PIPELINE_PATTERN='^(platform/python-sidecar/Dockerfile\.pipeline|platform/python-sidecar/ga_writers/|platform/python-sidecar/pipeline/|platform/python-sidecar/services/|platform/python-sidecar/brahmagyan/|platform/python-sidecar/pyjhora_adapter/|platform/python-sidecar/bodha_writers/|platform/python-sidecar/panchang_engine/|platform/python-sidecar/muhurat/|platform/python-sidecar/requirements|035_DISCOVERY_LAYER/)'

          deployed_sha() {
            # Prints the commit production reports for one component; empty on any failure.
            case "$1" in
              web|sidecar|mcp)
                local rev
                rev=$(gcloud run services describe "amjis-$1" --region "$GCP_REGION" \
                  --format='value(status.latestReadyRevisionName)' 2>/dev/null) || return 0
                [ -n "$rev" ] || return 0
                gcloud run revisions describe "$rev" --region "$GCP_REGION" \
                  --format="value(metadata.labels['commit-sha'])" 2>/dev/null || true
                ;;
              pipeline)
                local img
                img=$(gcloud run jobs describe brahma-build-pipeline-job --region "$GCP_REGION" \
                  --format='value(spec.template.spec.template.spec.containers[0].image)' 2>/dev/null) || return 0
                case "$img" in *:*) printf '%s' "${img##*:}" ;; esac
                ;;
            esac
          }

          decide() {
            # $1 component, $2 grep -E path pattern -> echoes the true/false decision.
            local component="$1" pattern="$2" sha changed
            sha=$(deployed_sha "$component")
            if [ -z "$sha" ]; then
              echo "::warning::${component}: deployed commit-sha unresolvable -- FAIL-OPEN, deploying" 1>&2
              echo true; return
            fi
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              git fetch --depth=1 origin "$sha" 1>&2 2>&1 || true
            fi
            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::warning::${component}: deployed sha ${sha} not fetchable -- FAIL-OPEN, deploying" 1>&2
              echo true; return
            fi
            changed=$(git diff --name-only "$sha" HEAD)
            echo "--- ${component}: deployed=${sha}" 1>&2
            printf '%s\n' "$changed" | sed 's/^/    /' 1>&2
            if printf '%s\n' "$changed" | grep -qE "$pattern"; then
              echo true
            else
              echo false
            fi
          }

          web=$(decide web "$WEB_PATTERN")
          sidecar=$(decide sidecar "$SIDECAR_PATTERN")
          mcp=$(decide mcp "$MCP_PATTERN")
          pipeline=$(decide pipeline "$PIPELINE_PATTERN")

          {
            echo "web=$web"
            echo "sidecar=$sidecar"
            echo "mcp=$mcp"
            echo "pipeline=$pipeline"
          } >> "$GITHUB_OUTPUT"

          echo "=== Outputs ==="
          echo "web=$web  sidecar=$sidecar  mcp=$mcp  pipeline=$pipeline"
  # ── /Path-change detection ───────────────────────────────────────────────────

  # ── Schema barrier (PARIŚEṢA-V4 / RATE-07, 2026-08-21) ──────────────────────
  # Migrations used to run as four steps INSIDE `deploy-web`, which made
  # `deploy-web` the de-facto schema barrier for the whole fleet. That was fine
  # while nothing else needed to order against it — but RATE-07 ships a
  # FAIL-CLOSED gate in `amjis-mcp` that queries a table created by migration
  # 580. If the MCP revision starts serving before that migration applies, every
  # OAuth mutation returns 503 until the migration lands. "The migration step
  # runs early in deploy-web, so it usually wins" is not a detector, and
  # CLAUDE.md §N.8 forbids resting a safety property on one.
  #
  # The migration is therefore its OWN job, and every service that ships code
  # against the schema declares `needs: [migrate]`. This is the minimal barrier:
  # ~1 minute of shared ordering (proxy + `migrate.ts`), NOT coupling to another
  # service's full build/deploy/smoke/promote pipeline. In particular
  # `deploy-mcp` does NOT depend on `deploy-web`: an unrelated web smoke flake
  # must never block an urgent MCP deploy.
  #
  # `needs: [changes]` is load-bearing, not cosmetic: it is what binds the
  # manual-dispatch CI gate (SAMĀPTI / RULING 73-CLOSE) to the job that writes to
  # the production database. Never let this job float free of `changes`.
  #
  # Runs unconditionally rather than behind a `platform/supabase/migrations/**`
  # path filter: `migrate.ts` is idempotent and skips already-applied files, so
  # the no-new-migration case is a fast no-op, whereas a path filter would have
  # to correctly predict every way a migration can reach main (merge commits,
  # squash, revert, force-push) to stay safe. A cheap always-run beats a clever
  # filter for a barrier whose failure mode is a fail-closed production outage.
  # DP-SD-019: inspect semantic state before GitHub decides whether to create a
  # protected-environment deployment. This read-only job emits the three
  # semantic states needed to choose the one-time privileged route.
  migration-state:
    name: Inspect DB Migration State
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      data_plane: ${{ steps.data-plane-ownership.outputs.state }}
      data_plane_isolation: ${{ steps.data-plane-isolation.outputs.state }}
      nirmana: ${{ steps.nirmana-ownership.outputs.state }}
      purna: ${{ steps.purna-ownership.outputs.state }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # #2159: workflow_run.head_sha can resolve to a stale commit under
      # fast-merging queues (the triggering event's own reported head_sha can
      # lag/misreport); deploy-web already guards against this (see its own
      # "Verify deployment source provenance" step below) but this job never
      # did, so a migration introduced by the very commit that triggered this
      # run could silently never apply while the job still reports success.
      - name: Verify deployment source provenance
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::Deployment checkout mismatch: expected $DEPLOY_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Migrating against immutable source SHA $ACTUAL_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      # ── A-S8: Run idempotent migrations before any service deploys ───────────
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.1/cloud-sql-proxy.linux.amd64" \
            -o cloud-sql-proxy && chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 \
            madhav-astrology:asia-south1:amjis-postgres >cloud-sql-proxy-5432.log 2>&1 &
          proxy_5432_pid=$!
          ready=false
          for _ in {1..20}; do
            if kill -0 "$proxy_5432_pid" 2>/dev/null \
              && (echo >"/dev/tcp/127.0.0.1/5432") 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::Cloud SQL Auth Proxy did not become ready on 127.0.0.1:5432."
            cat cloud-sql-proxy-5432.log || true
            exit 1
          fi

      - name: Set up Node.js for migration runner
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install migration runner deps
        run: cd platform && npm install --ignore-scripts --no-fund tsx pg

      - name: Validate production migration database route
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: cd platform && npx tsx scripts/validate-migration-database-routes.ts --prod

      - name: Inspect protected data-plane ownership state
        id: data-plane-ownership
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret not set — cannot read the protected data-plane state."
            exit 1
          fi
          ownership_state="$(cd platform && npx tsx scripts/data-plane-ownership-status.ts)" || exit 1
          if [ "$ownership_state" != "marked" ] && [ "$ownership_state" != "unmarked" ]; then
            echo "::error::Unexpected protected data-plane state."
            exit 1
          fi
          echo "state=$ownership_state" >> "$GITHUB_OUTPUT"

      # This read-only strict check is also the durable restart detector. If a
      # prior run committed the DB cutover but failed during job rebind/final
      # verification, the next run emits repair_required and re-enters the
      # protected finalization path instead of skipping to routine deploy.
      - name: Inspect protected data-plane runtime isolation
        id: data-plane-isolation
        env:
          GOOGLE_CLOUD_PROJECT: madhav-astrology
          GOOGLE_CLOUD_REGION: ${{ env.GCP_REGION }}
          DATA_PLANE_DEPLOY_PRINCIPAL: serviceAccount:github-actions@madhav-astrology.iam.gserviceaccount.com
          DATA_PLANE_CONTROL_PLANE_ADMIN_PRINCIPAL: ${{ vars.DATA_PLANE_CONTROL_PLANE_ADMIN_PRINCIPAL }}
          DATA_PLANE_SECRET_ISOLATION_MODE: strict
        run: |
          if (cd platform && npx tsx scripts/data-plane-secret-isolation-preflight.ts); then
            echo "state=strict" >> "$GITHUB_OUTPUT"
          else
            echo "state=repair_required" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect Nirmana evidence ownership handoff marker
        id: nirmana-ownership
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret not set — cannot read the Nirmana ownership marker."
            exit 1
          fi
          ownership_state="$(cd platform && npx tsx scripts/nirmana-evidence-ownership-status.ts)" || exit 1
          if [ "$ownership_state" != "marked" ] && [ "$ownership_state" != "unmarked" ]; then
            echo "::error::Unexpected Nirmana ownership marker state."
            exit 1
          fi
          echo "state=$ownership_state" >> "$GITHUB_OUTPUT"

      - name: Inspect Pūrṇa inquiry protected-owner handoff
        id: purna-ownership
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL is required to inspect the Pūrṇa ownership state."
            exit 1
          fi
          ownership_state="$(cd platform && npx tsx scripts/purna-inquiry-ownership-status.ts)" || exit 1
          case "$ownership_state" in
            armed|rearm_required|interrupted|cleanup_required|marked) ;;
            *) echo "::error::Invalid or partial Pūrṇa ownership state; refusing migration."; exit 1 ;;
          esac
          echo "state=$ownership_state" >> "$GITHUB_OUTPUT"

  # DP-SD-019/020: bootstrap-only credentials and the authenticated,
  # protected-branch-only environment exist only on this job. Automatic deploys
  # may inspect state but may never infer authorization to mutate it: a separate
  # exact-SHA manual dispatch is required, preventing unrelated main changes
  # from entering the privileged path merely because a legacy state is unmarked.
  privileged-bootstrap:
    name: One-time Protected DB Bootstrap
    needs: [changes, migration-state]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.data_plane_cutover == true &&
      (
        needs.migration-state.outputs.data_plane == 'unmarked' ||
        needs.migration-state.outputs.data_plane_isolation != 'strict' ||
        needs.migration-state.outputs.nirmana == 'unmarked' ||
        needs.migration-state.outputs.purna != 'marked'
      )
    runs-on: ubuntu-latest
    environment: data-plane-production-cutover
    concurrency:
      group: data-plane-production-cutover
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify deployment source provenance
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::Deployment checkout mismatch: expected $DEPLOY_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Bootstrapping immutable source SHA $ACTUAL_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.1/cloud-sql-proxy.linux.amd64" \
            -o cloud-sql-proxy && chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 \
            madhav-astrology:asia-south1:amjis-postgres >cloud-sql-proxy-5432.log 2>&1 &
          proxy_5432_pid=$!
          ready=false
          for _ in {1..20}; do
            if kill -0 "$proxy_5432_pid" 2>/dev/null \
              && (echo >"/dev/tcp/127.0.0.1/5432") 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::Cloud SQL Auth Proxy did not become ready on 127.0.0.1:5432."
            cat cloud-sql-proxy-5432.log || true
            exit 1
          fi

      - name: Set up Node.js for protected bootstrap
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install protected bootstrap deps
        run: cd platform && npm install --ignore-scripts --no-fund tsx pg

      # The job-level concurrency lock is held before this step starts. Re-read
      # all states inside that lock so a second run queued on stale output
      # cannot replay a cutover completed by the first run.
      - name: Refresh protected bootstrap state under the exclusive lock
        id: bootstrap-state
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PRIOR_DATA_PLANE_STATE: ${{ needs.migration-state.outputs.data_plane }}
          PRIOR_NIRMANA_STATE: ${{ needs.migration-state.outputs.nirmana }}
          PRIOR_PURNA_STATE: ${{ needs.migration-state.outputs.purna }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret not set — bootstrap state cannot be refreshed."
            exit 1
          fi
          read_protected_state() {
            local script="$1"
            local label="$2"
            local state=''
            local attempt
            for attempt in 1 2 3 4 5; do
              if state="$(cd platform && npx tsx "scripts/$script")"; then
                printf '%s' "$state"
                return 0
              fi
              if [ "$attempt" -lt 5 ]; then
                sleep "$((attempt * 2))"
              fi
            done
            echo "::error::$label state could not be read after 5 bounded attempts." >&2
            return 1
          }
          data_plane_state="$(read_protected_state data-plane-ownership-status.ts 'Protected data-plane')" || exit 1
          nirmana_state="$(read_protected_state nirmana-evidence-ownership-status.ts 'Nirmana ownership')" || exit 1
          purna_state="$(read_protected_state purna-inquiry-ownership-status.ts 'Pūrṇa ownership')" || exit 1
          for state in "$data_plane_state" "$nirmana_state"; do
            if [ "$state" != "marked" ] && [ "$state" != "unmarked" ]; then
              echo "::error::Unexpected protected bootstrap state under the exclusive lock."
              exit 1
            fi
          done
          case "$purna_state" in
            armed|rearm_required|interrupted|cleanup_required|marked) ;;
            *) echo "::error::Invalid or partial Pūrṇa ownership state under the exclusive lock."; exit 1 ;;
          esac
          if [ "$PRIOR_DATA_PLANE_STATE" = "marked" ] && [ "$data_plane_state" != "marked" ]; then
            echo "::error::Protected data-plane state regressed after the initial inspection."
            exit 1
          fi
          if [ "$PRIOR_NIRMANA_STATE" = "marked" ] && [ "$nirmana_state" != "marked" ]; then
            echo "::error::Nirmana ownership state regressed after the initial inspection."
            exit 1
          fi
          if [ "$PRIOR_PURNA_STATE" = "marked" ] && [ "$purna_state" != "marked" ]; then
            echo "::error::Pūrṇa ownership state regressed after the initial inspection."
            exit 1
          fi
          {
            echo "data_plane=$data_plane_state"
            echo "nirmana=$nirmana_state"
            echo "purna=$purna_state"
          } >> "$GITHUB_OUTPUT"

      - name: One-shot Nirmana evidence ownership preflight
        if: steps.bootstrap-state.outputs.nirmana == 'unmarked'
        env:
          NIRMANA_EVIDENCE_LEGACY_OWNER_DATABASE_URL: ${{ secrets.NIRMANA_EVIDENCE_LEGACY_OWNER_DATABASE_URL }}
          NIRMANA_CAMPAIGN_CONTROL_DATABASE_URL: ${{ secrets.NIRMANA_CAMPAIGN_CONTROL_DATABASE_URL }}
        run: |
          if [ -z "$NIRMANA_EVIDENCE_LEGACY_OWNER_DATABASE_URL" ]; then
            echo "::error::NIRMANA_EVIDENCE_LEGACY_OWNER_DATABASE_URL secret not set — cannot inspect or perform the ownership handoff."
            exit 1
          fi
          if [ -z "$NIRMANA_CAMPAIGN_CONTROL_DATABASE_URL" ]; then
            echo "::error::NIRMANA_CAMPAIGN_CONTROL_DATABASE_URL secret not set — cannot prove the preprovisioned control writer before handoff."
            exit 1
          fi
          cd platform && npx tsx scripts/nirmana-evidence-ownership-preflight.ts

      # Port 5433 is serialized: Pūrṇa uses it first against production, then
      # releases it before the isolated data-plane restore proof may claim it.
      - name: Start one-shot Pūrṇa admin proxy
        id: purna-admin-proxy
        if: >-
          steps.bootstrap-state.outputs.purna == 'armed' ||
          steps.bootstrap-state.outputs.purna == 'interrupted' ||
          steps.bootstrap-state.outputs.purna == 'cleanup_required'
        run: |
          ./cloud-sql-proxy --address 127.0.0.1 --port 5433 \
            madhav-astrology:asia-south1:amjis-postgres >cloud-sql-proxy-5433.log 2>&1 &
          proxy_5433_pid=$!
          echo "pid=$proxy_5433_pid" >> "$GITHUB_OUTPUT"
          ready=false
          for _ in {1..20}; do
            if kill -0 "$proxy_5433_pid" 2>/dev/null \
              && (echo >"/dev/tcp/127.0.0.1/5433") 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::Pūrṇa admin proxy did not become ready on 127.0.0.1:5433."
            cat cloud-sql-proxy-5433.log || true
            exit 1
          fi

      - name: Validate one-shot Pūrṇa admin database route
        id: purna-admin-route
        if: >-
          steps.bootstrap-state.outputs.purna == 'armed' ||
          steps.bootstrap-state.outputs.purna == 'interrupted' ||
          steps.bootstrap-state.outputs.purna == 'cleanup_required'
        env:
          PURNA_INQUIRY_ADMIN_DATABASE_URL: ${{ secrets.PURNA_INQUIRY_ADMIN_DATABASE_URL }}
        run: cd platform && npx tsx scripts/validate-migration-database-routes.ts --purna-admin

      - name: One-shot Pūrṇa protected-owner preflight
        id: purna-preflight
        if: steps.bootstrap-state.outputs.purna == 'armed'
        env:
          PURNA_INQUIRY_ADMIN_DATABASE_URL: ${{ secrets.PURNA_INQUIRY_ADMIN_DATABASE_URL }}
          PURNA_INQUIRY_SERVE_PASSWORD: ${{ secrets.PURNA_INQUIRY_SERVE_PASSWORD }}
        run: |
          if [ -z "$PURNA_INQUIRY_ADMIN_DATABASE_URL" ] || [ -z "$PURNA_INQUIRY_SERVE_PASSWORD" ]; then
            echo "::error::The two one-shot Pūrṇa ownership bootstrap secrets are required before migrations."
            exit 1
          fi
          cd platform && npx tsx scripts/purna-inquiry-ownership-preflight.ts

      # The data-plane cutover owns the public schema. The application role can
      # no longer grant CREATE there, so bridge only the Pūrṇa owner through the
      # existing deployment-only schema-owner delegate for the protected set.
      - name: Grant temporary Pūrṇa schema capability
        id: purna-schema-grant
        if: steps.bootstrap-state.outputs.purna == 'armed'
        env:
          DATA_PLANE_MIGRATOR_DATABASE_URL: ${{ secrets.DATA_PLANE_MIGRATOR_DATABASE_URL }}
        run: cd platform && npx tsx scripts/purna-inquiry-schema-capability.ts grant

      - name: Apply exact Pūrṇa protected-owner migrations
        if: steps.bootstrap-state.outputs.purna == 'armed'
        env:
          DATABASE_URL: ${{ secrets.PURNA_INQUIRY_ADMIN_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The one-shot Pūrṇa bootstrap URL is required for protected migrations."
            exit 1
          fi
          cd platform && npx tsx scripts/migrate.ts --only \
            1033_planner_inquiry_lifecycle.sql,1034_nirmana_purna_anvesana_wave1_output_digest_specs.sql,1037_planner_inquiry_action_reservations.sql,1038_planner_managed_prashna_jobs.sql,1039_purna_inquiry_protected_ownership.sql,1040_planner_inquiry_successor_lifecycle.sql

      - name: Revoke temporary Pūrṇa schema capability
        if: ${{ always() && steps.purna-admin-route.outcome == 'success' && (steps.bootstrap-state.outputs.purna == 'armed' || steps.bootstrap-state.outputs.purna == 'interrupted' || steps.bootstrap-state.outputs.purna == 'cleanup_required') }}
        env:
          DATA_PLANE_MIGRATOR_DATABASE_URL: ${{ secrets.DATA_PLANE_MIGRATOR_DATABASE_URL }}
        run: cd platform && npx tsx scripts/purna-inquiry-schema-capability.ts revoke

      # Run immediately after the protected set, before any unrelated migration.
      # If a prior runner died after preflight COMMIT, `interrupted` makes the next
      # run clean the privileged bootstrap first and then stop for explicit rearm.
      - name: Close and attest Pūrṇa protected-owner handoff
        if: ${{ always() && steps.purna-admin-route.outcome == 'success' && (steps.bootstrap-state.outputs.purna == 'armed' || steps.bootstrap-state.outputs.purna == 'interrupted' || steps.bootstrap-state.outputs.purna == 'cleanup_required') }}
        env:
          PURNA_INQUIRY_ADMIN_DATABASE_URL: ${{ secrets.PURNA_INQUIRY_ADMIN_DATABASE_URL }}
        run: |
          if [ -z "$PURNA_INQUIRY_ADMIN_DATABASE_URL" ]; then
            echo "::error::Pūrṇa bootstrap admin URL is required for mandatory membership cleanup."
            exit 1
          fi
          cd platform && npx tsx scripts/purna-inquiry-ownership-postflight.ts

      - name: Release one-shot Pūrṇa admin proxy port
        if: ${{ always() && steps.purna-admin-proxy.outcome == 'success' }}
        env:
          PURNA_PROXY_PID: ${{ steps.purna-admin-proxy.outputs.pid }}
        run: |
          if [ -z "$PURNA_PROXY_PID" ]; then
            echo "::error::Pūrṇa admin proxy PID was not captured."
            exit 1
          fi
          kill "$PURNA_PROXY_PID" 2>/dev/null || true
          for _ in {1..20}; do
            if ! kill -0 "$PURNA_PROXY_PID" 2>/dev/null \
              && ! (echo >"/dev/tcp/127.0.0.1/5433") 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Pūrṇa admin proxy did not release 127.0.0.1:5433."
          exit 1

      # While Pūrṇa is armed, its one-shot bootstrap is intentionally a temporary
      # cloudsqlsuperuser child. Mandatory postflight removes that membership.
      # Re-attest Nirmana only when its own marker was absent. Pūrṇa's pre-run
      # state is intentionally independent and remains stale after postflight.
      - name: Attest Nirmana ownership handoff as deployment-only migrator
        if: steps.bootstrap-state.outputs.nirmana == 'unmarked'
        env:
          NIRMANA_MIGRATOR_DATABASE_URL: ${{ secrets.NIRMANA_MIGRATOR_DATABASE_URL }}
        run: |
          if [ -z "$NIRMANA_MIGRATOR_DATABASE_URL" ]; then
            echo "::error::NIRMANA_MIGRATOR_DATABASE_URL secret not set — migration 633 cannot be attested. This credential is deployment-only and must never be mounted in Cloud Run."
            exit 1
          else
            cd platform && npx tsx scripts/nirmana-evidence-ownership-marker.ts
          fi

      - name: Require explicit bootstrap rearm after interrupted cleanup
        if: steps.bootstrap-state.outputs.purna == 'interrupted'
        run: |
          echo "::error::Interrupted Pūrṇa bootstrap authority was removed. Reprovision its one-shot login credential and cloudsqlsuperuser membership, then rerun."
          exit 1

      - name: Require Pūrṇa bootstrap provisioning or rearm
        if: steps.bootstrap-state.outputs.purna == 'rearm_required'
        run: |
          echo "::error::Pūrṇa ownership requires the disabled one-shot bootstrap to be explicitly rearmed with a fresh credential and its sole cloudsqlsuperuser edge before cleanup can resume."
          exit 1

      - name: Verify data-plane pre-transition isolation before privileged access
        if: steps.bootstrap-state.outputs.data_plane == 'unmarked' || needs.migration-state.outputs.data_plane_isolation != 'strict'
        env:
          GOOGLE_CLOUD_PROJECT: madhav-astrology
          GOOGLE_CLOUD_REGION: ${{ env.GCP_REGION }}
          DATA_PLANE_DEPLOY_PRINCIPAL: serviceAccount:github-actions@madhav-astrology.iam.gserviceaccount.com
          DATA_PLANE_CONTROL_PLANE_ADMIN_PRINCIPAL: ${{ vars.DATA_PLANE_CONTROL_PLANE_ADMIN_PRINCIPAL }}
          DATA_PLANE_SECRET_ISOLATION_MODE: pre_transition
        run: cd platform && npx tsx scripts/data-plane-secret-isolation-preflight.ts

      - name: Execute Native-authorized automated cutover under backup, restore, lease and quiescence
        if: steps.bootstrap-state.outputs.data_plane == 'unmarked'
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATA_PLANE_CUTOVER_AUTHORIZATION: ${{ secrets.DATA_PLANE_CUTOVER_AUTHORIZATION }}
          DATA_PLANE_RESTORE_VALIDATION_INSTANCE: ${{ secrets.DATA_PLANE_RESTORE_VALIDATION_INSTANCE }}
          DATA_PLANE_RESTORE_VALIDATION_CONNECTION_NAME: ${{ secrets.DATA_PLANE_RESTORE_VALIDATION_CONNECTION_NAME }}
          # The dedicated validation credential is bound to the authenticated
          # local proxy by the protected preflight.  Do not substitute the
          # generic verifier credential: it is a different connector contract.
          DATA_PLANE_RESTORE_VALIDATION_DATABASE_URL: ${{ secrets.DATA_PLANE_RESTORE_VALIDATION_DATABASE_URL }}
          DATA_PLANE_RESTORE_VALIDATION_PROXY_PORT: '5433'
          DATA_PLANE_CUTOVER_LEASE: ${{ secrets.DATA_PLANE_CUTOVER_LEASE }}
          DATA_PLANE_CUTOVER_ENVIRONMENT: data-plane-production-cutover
          GH_TOKEN: ${{ github.token }}
          DATA_PLANE_ADMIN_DATABASE_URL: ${{ secrets.DATA_PLANE_ADMIN_DATABASE_URL }}
          # Direct postgres authentication is a separately provisioned,
          # one-shot ownership route.  It must not be replaced by the
          # validation-proxy administrator credential above.
          DATA_PLANE_OWNERSHIP_ADMIN_DATABASE_URL: ${{ secrets.DATA_PLANE_OWNERSHIP_ADMIN_DATABASE_URL }}
          DATA_PLANE_MIGRATOR_DATABASE_URL: ${{ secrets.DATA_PLANE_MIGRATOR_DATABASE_URL }}
        run: |
          ./cloud-sql-proxy --address 127.0.0.1 --port 5433 \
            "$DATA_PLANE_RESTORE_VALIDATION_CONNECTION_NAME" >data-plane-validation-proxy.log 2>&1 &
          validation_proxy_pid=$!
          trap 'kill "$validation_proxy_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..20}; do
            if kill -0 "$validation_proxy_pid" 2>/dev/null \
              && (echo >"/dev/tcp/127.0.0.1/5433") 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::Authenticated validation Cloud SQL proxy failed to become ready."
            cat data-plane-validation-proxy.log || true
            exit 1
          fi
          cd platform
          npx tsx scripts/data-plane-protected-cutover.ts

      - name: Bind named build job to dedicated data-plane credential
        if: steps.bootstrap-state.outputs.data_plane == 'unmarked' || needs.migration-state.outputs.data_plane_isolation != 'strict'
        run: |
          gcloud run jobs update brahma-build-pipeline-job \
            --project=madhav-astrology \
            --region="$GCP_REGION" \
            --service-account=data-plane-builder-runtime@madhav-astrology.iam.gserviceaccount.com \
            --set-secrets=DATABASE_URL=data-plane-builder-db-url:latest \
            --quiet

      - name: Verify strict data-plane isolation after build-job rebind
        if: steps.bootstrap-state.outputs.data_plane == 'unmarked' || needs.migration-state.outputs.data_plane_isolation != 'strict'
        env:
          GOOGLE_CLOUD_PROJECT: madhav-astrology
          GOOGLE_CLOUD_REGION: ${{ env.GCP_REGION }}
          DATA_PLANE_DEPLOY_PRINCIPAL: serviceAccount:github-actions@madhav-astrology.iam.gserviceaccount.com
          DATA_PLANE_CONTROL_PLANE_ADMIN_PRINCIPAL: ${{ vars.DATA_PLANE_CONTROL_PLANE_ADMIN_PRINCIPAL }}
          DATA_PLANE_SECRET_ISOLATION_MODE: strict
        run: cd platform && npx tsx scripts/data-plane-secret-isolation-preflight.ts

      - name: Re-attest protected data-plane semantic state with deployment-only migrator
        if: steps.bootstrap-state.outputs.data_plane == 'unmarked' || needs.migration-state.outputs.data_plane_isolation != 'strict'
        env:
          DATABASE_URL: ${{ secrets.DATA_PLANE_MIGRATOR_DATABASE_URL }}
        run: cd platform && test "$(npx tsx scripts/data-plane-ownership-status.ts)" = marked

  # The routine path receives no DBA, Pūrṇa admin, data-plane migrator,
  # legacy-owner or Nirmana migrator credential and has no protected environment.
  # `always()` is used only to admit the intentional "all already marked" skip;
  # every failed, cancelled, partial or inconsistent predecessor remains closed.
  migrate:
    name: Apply Routine DB Migrations
    needs: [changes, migration-state, privileged-bootstrap]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      needs.changes.result == 'success' &&
      needs.migration-state.result == 'success' &&
      (
        (
          needs.migration-state.outputs.data_plane == 'marked' &&
          needs.migration-state.outputs.data_plane_isolation == 'strict' &&
          needs.migration-state.outputs.nirmana == 'marked' &&
          needs.migration-state.outputs.purna == 'marked' &&
          needs.privileged-bootstrap.result == 'skipped'
        ) ||
        (
          (
            needs.migration-state.outputs.data_plane == 'unmarked' ||
            needs.migration-state.outputs.data_plane_isolation != 'strict' ||
            needs.migration-state.outputs.nirmana == 'unmarked' ||
            needs.migration-state.outputs.purna != 'marked'
          ) &&
          needs.privileged-bootstrap.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    concurrency:
      group: data-plane-production-cutover
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify deployment source provenance
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::Deployment checkout mismatch: expected $DEPLOY_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Migrating against immutable source SHA $ACTUAL_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.1/cloud-sql-proxy.linux.amd64" \
            -o cloud-sql-proxy && chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 \
            madhav-astrology:asia-south1:amjis-postgres >cloud-sql-proxy-5432.log 2>&1 &
          proxy_5432_pid=$!
          ready=false
          for _ in {1..20}; do
            if kill -0 "$proxy_5432_pid" 2>/dev/null \
              && (echo >"/dev/tcp/127.0.0.1/5432") 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::Cloud SQL Auth Proxy did not become ready on 127.0.0.1:5432."
            cat cloud-sql-proxy-5432.log || true
            exit 1
          fi

      - name: Set up Node.js for migration runner
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install migration runner deps
        run: cd platform && npm install --ignore-scripts --no-fund tsx pg

      - name: Validate production migration database route
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: cd platform && npx tsx scripts/validate-migration-database-routes.ts --prod

      - name: Verify data-plane secret and runtime isolation
        env:
          GOOGLE_CLOUD_PROJECT: madhav-astrology
          GOOGLE_CLOUD_REGION: ${{ env.GCP_REGION }}
          DATA_PLANE_DEPLOY_PRINCIPAL: serviceAccount:github-actions@madhav-astrology.iam.gserviceaccount.com
          DATA_PLANE_CONTROL_PLANE_ADMIN_PRINCIPAL: ${{ vars.DATA_PLANE_CONTROL_PLANE_ADMIN_PRINCIPAL }}
        run: cd platform && npx tsx scripts/data-plane-secret-isolation-preflight.ts

      - name: Re-attest protected data-plane semantic state with routine credential
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret not set — protected data-plane state cannot be re-attested."
            exit 1
          fi
          cd platform && test "$(npx tsx scripts/data-plane-ownership-status.ts)" = marked

      - name: Re-attest Nirmana evidence ownership state with routine credential
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret not set — Nirmana ownership state cannot be re-attested."
            exit 1
          fi
          cd platform && test "$(npx tsx scripts/nirmana-evidence-ownership-status.ts)" = marked

      - name: Run general database migrations
        id: general-migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret not set — general migrations NOT applied. Failing build."
            exit 1
          else
            cd platform && npx tsx scripts/migrate.ts
          fi

      - name: Verify final Pūrṇa ownership marker
        if: success()
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          test "$(cd platform && npx tsx scripts/purna-inquiry-ownership-status.ts)" = marked
      # ── /A-S8: migrations ─────────────────────────────────────────────────────
  # ── /Schema barrier ─────────────────────────────────────────────────────────

  deploy-web:
    name: Build & Deploy Web
    # Only deploy on workflow_run (CI passed on main) or manual dispatch.
    # pull_request events are handled by the build-check job above.
    # `needs: [changes]` is load-bearing, not cosmetic: it is what binds the manual-dispatch
    # CI gate to this job — the one that promotes production traffic.
    # `needs: [migrate]` replaces the four migration steps this job used to run inline
    # (see the `migrate` job above); the ordering guarantee is unchanged for web —
    # migrations still complete before this job's image build — it is simply now a
    # barrier other services can also order against.
    needs: [changes, migrate]
    # `migrate` deliberately crosses an intentionally skipped
    # `privileged-bootstrap` when every protected ownership marker is already
    # current. GitHub propagates that skipped ancestor to downstream jobs unless
    # their condition is evaluated with `always()`, even though `migrate` itself
    # completed successfully. Evaluate explicitly, then keep the schema barrier
    # fail-closed by requiring both direct dependencies to have succeeded.
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.migrate.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Verify deployment source provenance
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::Deployment checkout mismatch: expected $DEPLOY_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Deploying immutable source SHA $ACTUAL_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # NOTE: migrations no longer run here. They ran as four inline steps at this
      # point until 2026-08-21 and now live in the dedicated `migrate` job, which
      # this job declares in `needs:`. Ordering for web is unchanged (migrations
      # still complete before the image build below); the extraction is what lets
      # `deploy-mcp` order against the schema WITHOUT ordering against this entire
      # job. Do not re-inline them.

      - name: Copy governance files into platform build context
        run: |
          mkdir -p platform/00_ARCHITECTURE
          cp 00_ARCHITECTURE/CAPABILITY_MANIFEST.json platform/00_ARCHITECTURE/CAPABILITY_MANIFEST.json
          cp 00_ARCHITECTURE/manifest_overrides.yaml platform/00_ARCHITECTURE/manifest_overrides.yaml
          cp 00_ARCHITECTURE/PLANNER_PROMPT_v*.md platform/00_ARCHITECTURE/
          cp -r 01_FACTS_LAYER platform/01_FACTS_LAYER
          cp -r 025_HOLISTIC_SYNTHESIS platform/025_HOLISTIC_SYNTHESIS
          cp -r 035_DISCOVERY_LAYER platform/035_DISCOVERY_LAYER

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:${{ env.DEPLOY_SHA }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:latest
          cache-from: type=gha,scope=amjis-web
          cache-to: type=gha,mode=max,scope=amjis-web
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_APP_URL=https://amjis-web.run.app
            NEXT_PUBLIC_NIM_STACK_DEGRADED=false
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_MARSYS_FLAG_R9_PERSONAS=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_SCROLL_DISCIPLINE=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_INTERACTIVE_TABLES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_MERMAID=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_CITATION_FRESHNESS=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_VALIDATOR_GATES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_EDIT_WHILE_STREAMING=false
            NEXT_PUBLIC_MARSYS_FLAG_R11C_TOOL_CARDS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_PROJECTS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_SEMANTIC_SEARCH=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_TOOL_FLOW=true
            NEXT_PUBLIC_MARSYS_FLAG_R11B_LOOK_AND_FEEL=true
            NEXT_PUBLIC_MARSYS_FLAG_R11V2_MULTI_PROVIDER_PARITY=true
            NEXT_PUBLIC_PARIPRASHNA_LIVE=1

      # ── A-S8: Deploy no-traffic, smoke, then promote ──────────────────────────
      - name: Define zero-traffic web candidate identity
        id: web-candidate
        env:
          RELEASE_SHA: ${{ env.DEPLOY_SHA }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          suffix="probe-${RELEASE_SHA:0:12}-${RELEASE_RUN_ID}-${RELEASE_ATTEMPT}"
          {
            echo "suffix=$suffix"
            echo "tag=$suffix"
            echo "revision=amjis-web-$suffix"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy web to Cloud Run (no traffic)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: amjis-web
          region: ${{ env.GCP_REGION }}
          image: asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:${{ env.DEPLOY_SHA }}
          suffix: ${{ steps.web-candidate.outputs.suffix }}
          # deploy-cloudrun otherwise uses github.sha for commit-sha, which is
          # the default-branch tip for workflow_run rather than the CI head.
          labels: |
            managed-by=github-actions
            commit-sha=${{ env.DEPLOY_SHA }}
          # Per-service least-priv runtime SA; no-traffic for pre-smoke safety.
          flags: >-
            --service-account=amjis-web-runtime@madhav-astrology.iam.gserviceaccount.com
            --no-traffic
            --tag=${{ steps.web-candidate.outputs.tag }}
            --min-instances=1
            --timeout=360s
            --remove-secrets=WATCHDOG_SECRET
            --remove-env-vars="^|^WATCHDOG_LEGACY_FALLBACK_ENABLED|# ── 4.observability (Wave 4) ──────────────────────────────────────────|# Vertex AI region pin for batched embeddings (lib/embeddings/embedText.ts).|# Region must match the prod Cloud Run region (asia-south1) to keep|# Vertex calls in-region for both latency + egress cost.|# NOTE: NEXT_PUBLIC_FIREBASE_* intentionally absent from runtime env_vars.|# These are NEXT_PUBLIC_ flags baked into the bundle at build time (see|# build-args above). Cloud Run env_vars are never read by Next.js at|# runtime — setting them here has zero effect and misleadingly implies|# that rotating them without a full rebuild would take effect.|# Campaign definitions|labels|and non-server receipts use this|# distinct Cloud-SQL principal.  Its absent secret fails those|# writes closed; neither the migrator nor legacy-owner credential|# is ever present in the serving revision.|# Server-reconstructed evidence (probe_accepted|integrity_verified|# asset_frozen|stage_transition_accepted|foundation_lane_accepted)|# uses this distinct Cloud-SQL principal instead. Its absent secret|# fails those writes closed the same way -- this was missing from|# the serving revision from when the ingress writer role and its|# secret were first provisioned (2026-08-27) until this line."
          # Pūrṇa inquiry state uses a separate LOGIN member of role_web_serve;
          # its secret is provisioned before merge and never falls back to DB_USER.
          # The signing ring is likewise dedicated and mounted only in web.
          # NIRMANA_EVIDENCE_INGRESS_DB_USER is the distinct Cloud SQL principal
          # for server-reconstructed evidence and fails those writes closed when
          # its separate secret is absent. NEXT_PUBLIC_FIREBASE_* values stay out
          # of this runtime list because they are baked into the image at build.
          env_vars: |
            NODE_ENV=production
            NIRMANA_DEPLOYED_SHA=${{ env.DEPLOY_SHA }}
            INSTANCE_CONNECTION_NAME=madhav-astrology:asia-south1:amjis-postgres
            DB_USER=amjis_app
            DB_NAME=amjis
            DB_INQUIRY_USER=amjis_inquiry_serve
            NIRMANA_CAMPAIGN_CONTROL_DB_USER=nirmana_campaign_control_writer
            NIRMANA_EVIDENCE_INGRESS_DB_USER=nirmana_evidence_ingress_writer
            GCP_PROJECT=madhav-astrology
            GOOGLE_CLOUD_PROJECT=madhav-astrology
            GCS_BUCKET_CHAT_ATTACHMENTS=madhav-astrology-chat-attachments
            GCS_BUCKET_CHART_DOCUMENTS=madhav-astrology-chart-documents
            ASTROLOGER_EMAIL=mail.abhisek.mohanty@gmail.com
            PYTHON_SIDECAR_URL=https://amjis-sidecar-938361928218.asia-south1.run.app
            NIRMANA_PROBE_RUNNER_URL=https://amjis-sidecar-938361928218.asia-south1.run.app/internal/nirmana/probe
            APP_URL=https://amjis-web-938361928218.asia-south1.run.app
            WATCHDOG_SCHEDULER_OIDC_AUDIENCE=https://amjis-web-938361928218.asia-south1.run.app
            WATCHDOG_SCHEDULER_SERVICE_ACCOUNT=amjis-scheduler@madhav-astrology.iam.gserviceaccount.com
            MCP_CALLER_OIDC_AUDIENCE=https://amjis-web-938361928218.asia-south1.run.app
            MCP_CALLER_OIDC_SERVICE_ACCOUNT=amjis-mcp-runtime@madhav-astrology.iam.gserviceaccount.com
            PURNA_READINESS_CANARY_KEY_ID=mcp_prod_tDO7obNw
            VERTEX_AI_LOCATION=asia-south1
            MARSYS_FLAG_HISTORY_COMPRESSION_ENABLED=true
            BOOTSTRAP_JOB_NAME=brahma-foundation-bootstrap
            BUILD_JOB_NAME=brahma-build-pipeline-job
            BQ_DATASET=brahma_l5_olap
            GCS_OLAP_PREFIX=gs://madhav-brahma-olap/parquet/
            MARSYS_REPO_ROOT=/app
            MARSYS_FLAG_VECTOR_SEARCH_ENABLED=true
            MARSYS_FLAG_BUILD_TRIGGER_ENABLED=true
            MARSYS_FLAG_OBSERVATORY_ENABLED=true
            INQUIRY_LIFECYCLE_SIGNING_KEY_CURRENT_KID=inquiry-v1
          secrets: |
            FIREBASE_ADMIN_CREDENTIALS=firebase-admin-credentials:1
            DB_PASSWORD=amjis-db-password:3
            DB_INQUIRY_PASSWORD=amjis-inquiry-db-password:2
            NIRMANA_CAMPAIGN_CONTROL_DB_PASSWORD=nirmana-campaign-control-db-password:latest
            NIRMANA_EVIDENCE_INGRESS_DB_PASSWORD=nirmana-evidence-ingress-db-password:latest
            OPENAI_API_KEY=openai-api-key:2
            GOOGLE_GENERATIVE_AI_API_KEY=GOOGLE_GENERATIVE_AI_API_KEY:1
            DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:1
            NVIDIA_NIM_API_KEY=NVIDIA_NIM_API_KEY:1
            PYTHON_SIDECAR_API_KEY=PYTHON_SIDECAR_API_KEY:1
            SUPER_ADMIN_EMAIL=SUPER_ADMIN_EMAIL:1
            MARSYS_CRON_SECRET=mcpt-scheduler-secret:latest
            MCP_INTERNAL_TOKEN=mcp-internal-token:1
            MCP_CANARY_KEY=mcp-canary-key:latest
            INQUIRY_LIFECYCLE_SIGNING_KEY_CURRENT=inquiry-lifecycle-signing-key:2

      - name: Resolve web candidate URL
        id: web-candidate-url
        env:
          CANDIDATE_TAG: ${{ steps.web-candidate.outputs.tag }}
        run: |
          candidate_url=$(gcloud run services describe amjis-web \
            --project=madhav-astrology \
            --region=${{ env.GCP_REGION }} \
            --format=json | jq --arg tag "$CANDIDATE_TAG" -r \
              '.status.traffic[] | select(.tag == $tag) | .url')
          test -n "$candidate_url"
          echo "url=$candidate_url" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke
        id: smoke
        env:
          SMOKE_WEB_URL: ${{ steps.web-candidate-url.outputs.url }}
        run: |
          bash scripts/operator/end_to_end_smoke.sh

      - name: Pūrṇa inquiry signing and RLS candidate canary
        env:
          SMOKE_WEB_URL: ${{ steps.web-candidate-url.outputs.url }}
          SMOKE_CHART_ID: ${{ secrets.SMOKE_CHART_ID }}
          EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
          EXPECTED_REVISION: ${{ steps.web-candidate.outputs.revision }}
        run: |
          if [ -z "$SMOKE_CHART_ID" ]; then
            echo "::error::SMOKE_CHART_ID is required for the non-vacuous Pūrṇa candidate canary."
            exit 1
          fi
          CANARY_KEY="$(gcloud secrets versions access latest \
            --secret=mcp-canary-key --project=madhav-astrology)" || {
            echo "::error::Could not read mcp-canary-key through the existing secret-specific deploy binding."
            exit 1
          }
          CANARY_BODY="$(jq -cn --arg chart_id "$SMOKE_CHART_ID" '{chart_id:$chart_id}')"
          STATUS="$(curl -sS -o "$RUNNER_TEMP/purna-readiness.json" -w '%{http_code}' \
            -X POST "$SMOKE_WEB_URL/api/mcp/inquiry/readiness" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $CANARY_KEY" \
            --data "$CANARY_BODY")"
          unset CANARY_KEY CANARY_BODY
          if [ "$STATUS" != "200" ]; then
            echo "::error::Pūrṇa candidate canary returned HTTP $STATUS; refusing traffic promotion."
            jq -c '{ok,error,failure_stage,failure_code}' "$RUNNER_TEMP/purna-readiness.json" 2>/dev/null || true
            exit 1
          fi
          jq -e '
            .ok == true and
            .deployed_sha == env.EXPECTED_SHA and
            .revision == env.EXPECTED_REVISION and
            .signing_round_trip == true and
            .database.dedicated_login == true and
            .database.least_privilege_role == true and
            .database.rls_tables == 4 and
            .database.same_principal_rows == 4 and
            .database.cross_principal_rows == 0 and
            .database.security_definer_search_path == true and
            .database.rolled_back == true
          ' "$RUNNER_TEMP/purna-readiness.json" >/dev/null || {
            echo "::error::Pūrṇa candidate canary did not earn every signing/database/RLS signal; refusing traffic promotion."
            exit 1
          }

      - name: Promote verified web candidate
        if: success()
        env:
          EXPECTED_REVISION: ${{ steps.web-candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic amjis-web \
            --project=madhav-astrology \
            --to-revisions="$EXPECTED_REVISION=100" \
            --region=${{ env.GCP_REGION }} \
            --quiet

      - name: Remove web candidate tag
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        env:
          CANDIDATE_TAG: ${{ steps.web-candidate.outputs.tag }}
        run: |
          gcloud run services update-traffic amjis-web \
            --project=madhav-astrology \
            --region=${{ env.GCP_REGION }} \
            --remove-tags="$CANDIDATE_TAG" \
            --quiet
      # ── /A-S8: deploy + smoke + promote ──────────────────────────────────────

      - name: Show deployment URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: echo "Deployed to $DEPLOY_URL"

  deploy-sidecar:
    name: Build & Deploy Sidecar
    needs: [changes]
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.sidecar == 'true')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # #2159: workflow_run.head_sha can resolve to a stale commit under
      # fast-merging queues -- guard against silently building/deploying
      # from the wrong source (see migrate/deploy-web's identical step).
      - name: Verify deployment source provenance
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::Deployment checkout mismatch: expected $DEPLOY_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Deploying immutable source SHA $ACTUAL_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sidecar image
        uses: docker/build-push-action@v6
        with:
          context: ./platform  # widened from ./platform/python-sidecar for #2096 (reach sibling scripts/temporal)
          file: ./platform/python-sidecar/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-sidecar:${{ env.DEPLOY_SHA }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-sidecar:latest
          cache-from: type=gha,scope=amjis-sidecar
          cache-to: type=gha,mode=max,scope=amjis-sidecar

      - name: Define zero-traffic candidate identity
        id: sidecar-candidate
        env:
          RELEASE_SHA: ${{ env.DEPLOY_SHA }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          suffix="probe-${RELEASE_SHA:0:12}-${RELEASE_RUN_ID}-${RELEASE_ATTEMPT}"
          {
            echo "suffix=$suffix"
            echo "tag=$suffix"
            echo "revision=amjis-sidecar-$suffix"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy sidecar candidate to Cloud Run (zero traffic)
        id: deploy-sidecar
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: amjis-sidecar
          region: ${{ env.GCP_REGION }}
          image: asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-sidecar:${{ env.DEPLOY_SHA }}
          suffix: ${{ steps.sidecar-candidate.outputs.suffix }}
          labels: |
            managed-by=github-actions
            commit-sha=${{ env.DEPLOY_SHA }}
          # ── 4.edge_and_infra_hygiene ──
          # Per-service least-priv runtime SA (see infra/iam/main.tf).
          flags: >-
            --timeout=300
            --cpu=2
            --memory=1Gi
            --min-instances=0
            --no-traffic
            --tag=${{ steps.sidecar-candidate.outputs.tag }}
            --service-account=amjis-sidecar-runtime@madhav-astrology.iam.gserviceaccount.com
          # ── /4.edge_and_infra_hygiene ──
          secrets: |
            PYTHON_SIDECAR_API_KEY=PYTHON_SIDECAR_API_KEY:1
            GOOGLE_GENERATIVE_AI_API_KEY=GOOGLE_GENERATIVE_AI_API_KEY:1
            DATABASE_URL=amjis-pipeline-db-url:latest

      - name: Resolve candidate revision URL
        id: sidecar-candidate-url
        env:
          CANDIDATE_TAG: ${{ steps.sidecar-candidate.outputs.tag }}
        run: |
          candidate_url=$(gcloud run services describe amjis-sidecar \
            --project=madhav-astrology \
            --region=${{ env.GCP_REGION }} \
            --format=json | jq --arg tag "$CANDIDATE_TAG" -r \
              '.status.traffic[] | select(.tag == $tag) | .url')
          test -n "$candidate_url"
          echo "url=$candidate_url/internal/nirmana/probe" >> "$GITHUB_OUTPUT"

      # The Actions identity never reads PYTHON_SIDECAR_API_KEY. Secret Manager
      # mounts it directly into this one-task Cloud Run Job under the existing
      # sidecar runtime service account, which already has secretAccessor.
      - name: Configure authenticated candidate smoke job
        env:
          CANDIDATE_URL: ${{ steps.sidecar-candidate-url.outputs.url }}
          EXPECTED_REVISION: ${{ steps.sidecar-candidate.outputs.revision }}
        run: |
          gcloud run jobs deploy amjis-sidecar-release-smoke \
            --project=madhav-astrology \
            --region=${{ env.GCP_REGION }} \
            --image=asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-sidecar:${{ env.DEPLOY_SHA }} \
            --service-account=amjis-sidecar-runtime@madhav-astrology.iam.gserviceaccount.com \
            --set-secrets=PYTHON_SIDECAR_API_KEY=PYTHON_SIDECAR_API_KEY:1 \
            --set-env-vars=NIRMANA_PROBE_CANDIDATE_URL="$CANDIDATE_URL",NIRMANA_PROBE_EXPECTED_REVISION="$EXPECTED_REVISION" \
            --command=python \
            --args=scripts/nirmana_probe_release_smoke.py \
            --task-timeout=300 \
            --max-retries=0 \
            --quiet

      - name: Run authenticated real probes against candidate
        run: |
          gcloud run jobs execute amjis-sidecar-release-smoke \
            --project=madhav-astrology \
            --region=${{ env.GCP_REGION }} \
            --wait \
            --quiet

      # No earlier step changes service traffic. Any build, deploy, job setup, or
      # real-probe failure stops here and leaves the previously serving revision.
      - name: Promote verified sidecar candidate
        env:
          EXPECTED_REVISION: ${{ steps.sidecar-candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic amjis-sidecar \
            --project=madhav-astrology \
            --region=${{ env.GCP_REGION }} \
            --to-revisions="$EXPECTED_REVISION=100" \
            --quiet

      - name: Remove sidecar candidate tag
        if: ${{ always() && steps.deploy-sidecar.outcome == 'success' }}
        env:
          CANDIDATE_TAG: ${{ steps.sidecar-candidate.outputs.tag }}
        run: |
          gcloud run services update-traffic amjis-sidecar \
            --project=madhav-astrology \
            --region=${{ env.GCP_REGION }} \
            --remove-tags="$CANDIDATE_TAG" \
            --quiet

  # ── 4.edge_and_infra_hygiene ──
  # MCP deploy moved off the legacy Cloud Build trigger into GH Actions WIF
  # (acceptance §6: deploy.yml is sole orchestrator). Image builds via Docker
  # here; trigger is GH Actions only. Image is pinned to Artifact Registry
  # (asia-south1-docker.pkg.dev/...), not legacy gcr.io.
  deploy-mcp:
    # ORDERING (PARIŚEṢA-V4 / RATE-07, 2026-08-21): `migrate` is now a dependency,
    # where before this job needed only `changes` and ran CONCURRENTLY with the
    # migration step.
    #
    # WHY: RATE-07's OAuth rate-limit gate is FAIL-CLOSED by design, so an MCP
    # revision serving before migration 580 creates `mcp_rate_buckets` returns 503
    # on every OAuth mutation until the migration lands. "The migration usually
    # finishes first" is not a detector, and CLAUDE.md §N.8 forbids resting a
    # safety property on one.
    #
    # WHAT THIS DOES *NOT* DO — and an earlier revision of this PR got wrong:
    # this job does NOT depend on `deploy-web`. A first attempt used
    # `needs: [changes, deploy-web]` on the stated premise that "when platform/**
    # is unchanged deploy-web is SKIPPED, so the coupling is conditional". That
    # premise was FALSE: `deploy-web` carries no path filter — its `if:` is
    # identical to `changes`'s own trigger gate — so it runs on every
    # deploy-triggering event and the `skipped` branch was unreachable. The real
    # effect would have been permanent serialisation of every MCP deploy behind
    # the entire web pipeline (Cloud SQL proxy → migrations → Next build/push →
    # Cloud Run deploy → smoke → traffic promotion), with any unrelated web smoke
    # flake blocking all MCP deploys — including urgent security fixes.
    # `needs: [migrate]` closes the identical ordering race at ~1 minute of
    # shared barrier instead. Do not reintroduce a `deploy-web` dependency here.
    #
    # `always()` is required here only to cross `migrate`'s intentionally skipped
    # bootstrap ancestor when protected ownership is already current. Direct
    # dependency results remain explicit and fail-closed: a skipped, failed or
    # cancelled `changes`/`migrate` job cannot admit an MCP deployment.
    needs: [changes, migrate]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.migrate.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.mcp == 'true')
    name: Build & Deploy MCP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # #2159: workflow_run.head_sha can resolve to a stale commit under
      # fast-merging queues -- guard against silently building/deploying
      # from the wrong source (see migrate/deploy-web's identical step).
      - name: Verify deployment source provenance
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::Deployment checkout mismatch: expected $DEPLOY_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Deploying immutable source SHA $ACTUAL_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Copy governance files into MCP build context
        run: |
          mkdir -p platform-mcp/00_ARCHITECTURE
          cp 00_ARCHITECTURE/CAPABILITY_MANIFEST.json platform-mcp/00_ARCHITECTURE/CAPABILITY_MANIFEST.json || true
          cp -r 01_FACTS_LAYER platform-mcp/01_FACTS_LAYER || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push MCP image (Artifact Registry, not gcr.io)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform-mcp/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-mcp:${{ env.DEPLOY_SHA }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-mcp:latest
          cache-from: type=gha,scope=amjis-mcp
          cache-to: type=gha,mode=max,scope=amjis-mcp

      # ── PARISHODHANA Phase C item 2: deploy-pipeline parity with deploy-web ────
      # A unique tagged URL binds smoke traffic to the zero-traffic candidate.
      # Promotion names the exact verified revision, and the temporary tag is
      # removed on both success and failure so it cannot become a stale bypass.
      - name: Define zero-traffic MCP candidate identity
        id: mcp-candidate
        env:
          RELEASE_SHA: ${{ env.DEPLOY_SHA }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          suffix="probe-${RELEASE_SHA:0:12}-${RELEASE_RUN_ID}-${RELEASE_ATTEMPT}"
          {
            echo "suffix=$suffix"
            echo "tag=$suffix"
            echo "revision=amjis-mcp-$suffix"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy MCP to Cloud Run (IAM-gated, least-priv SA)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: amjis-mcp
          region: ${{ env.GCP_REGION }}
          image: asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-mcp:${{ env.DEPLOY_SHA }}
          suffix: ${{ steps.mcp-candidate.outputs.suffix }}
          labels: |
            managed-by=github-actions
            commit-sha=${{ env.DEPLOY_SHA }}
          # amjis-mcp is publicly invokable (allUsers:roles/run.invoker). The app-level
          # Bearer gate in server.ts is the auth enforcement layer, not Cloud Run IAM.
          # F3 posture correction: --no-allow-unauthenticated was stale; removed.
          # --no-traffic: pre-smoke staging, same pattern as deploy-web's A-S8 step.
          # The managed Prashna bridge can spend 330s in the engine and leases jobs
          # for 450s. Cloud Run therefore permits the reviewed 360s request window,
          # while instance-based CPU keeps the post-response durable worker runnable.
          flags: >-
            --allow-unauthenticated
            --service-account=amjis-mcp-runtime@madhav-astrology.iam.gserviceaccount.com
            --min-instances=1
            --concurrency=80
            --memory=512Mi
            --timeout=360s
            --no-cpu-throttling
            --remove-secrets=MCP_CANARY_KEY
            --no-traffic
            --tag=${{ steps.mcp-candidate.outputs.tag }}
          env_vars: |
            NIRMANA_DEPLOYED_SHA=${{ env.DEPLOY_SHA }}
            PLATFORM_URL=https://amjis-web-938361928218.asia-south1.run.app
            PYTHON_SIDECAR_URL=https://amjis-sidecar-938361928218.asia-south1.run.app
            # M5: MCP_BASE_URL used for OAuth discovery + callback URL construction.
            # Firebase session verification is delegated to amjis-web (no firebase-admin
            # credentials needed in amjis-mcp — platform does the verifySessionCookie call).
            MCP_BASE_URL=https://madhav.marsys.in/mcp
            # SM-γ C4/C5 (SAMPŪRTI P3 FIELD-INTEGRATED activation, 2026-08-13):
            # C4: adds gochara_narrative to kala_now_get + a5_gochara_agreement to
            #     kala_explain_get. Flag-off = key entirely absent (§N.8 byte-identical).
            # C5: enriches ahead_autofile authority_basis with field_window/<id>@<peak>
            #     when a kala_field_window overlaps the filed prediction (v2 citation).
            SM_GAMMA_C4_ENABLED=true
            SM_GAMMA_C5_ENABLED=true
            # RATE-07 (PARIŚEṢA-V4): how many hops in front of amjis-mcp are trusted to
            # have APPENDED to X-Forwarded-For. The OAuth rate limiter reads the client
            # identity from the RIGHT, this many entries in; the leftmost entry is fully
            # caller-controlled and is never read. Set EXPLICITLY here — equal to the
            # code default (trustedProxyHops(), platform-mcp/src/lib/oauth_rate_limit.ts),
            # so this line changes no behaviour — because this file is where the ingress
            # topology is actually configured, and an unset variable is an operator
            # obligation nobody can see. THE RULE: add a GCLB / Cloud Armor / any further
            # reverse proxy in front of this service and you MUST raise this to match, in
            # the same PR. Getting it wrong is conservative, not permissive (identities
            # COLLAPSE into one over-restrictive bucket; an attacker cannot steer the
            # collapse onto a chosen third party), and the per-route global ceiling keeps
            # the endpoint protected regardless — but it degrades per-IP attribution.
            # OPEN ITEM for whoever owns the front door: MCP_BASE_URL above is the custom
            # domain https://madhav.marsys.in/mcp, while `1` is correct for DIRECT
            # *.run.app ingress (the path deploy.yml smoke-tests). If the custom domain
            # routes through an additional appending hop, this value is low by that hop
            # count. Disclosed, not silently guessed: raising it without confirming the
            # real chain would trust a header segment a caller can forge, which is the
            # permissive direction. Verify the live XFF chain, then set this deliberately.
            # Full analysis: ruling §3.2 (DISCLOSED AMBIGUITY — client-IP derivation).
            MCP_TRUSTED_PROXY_HOPS=1
            # RATE-07 SHIPS DISABLED IN THIS PR — AND MUST BE FLIPPED TO `true`
            # IN A ONE-LINE FOLLOW-UP. Tracked as follow-up item RATE-07-ENABLE;
            # this line is the whole change.
            #
            # WHY DISABLED: `consumeBuckets()` (platform-mcp/src/lib/oauth_rate_limit.ts)
            # POSTs to ${PLATFORM_URL}/api/mcp/rate-limit/check — a route THIS PR
            # creates, served by amjis-web. `deploy-mcp` and `deploy-web` both declare
            # `needs: [migrate]` and therefore run in PARALLEL (deliberately — see the
            # ordering comment at the top of this job; re-coupling them is a known
            # worse outcome, not an option). deploy-mcp is a small TS build and
            # normally promotes traffic BEFORE deploy-web finishes its Next build →
            # push → deploy → smoke → promote. In that window the new MCP revision
            # would be calling a route that does not exist on the OLD web revision:
            # 404 → RateLimitStoreUnavailable → the gate does exactly what it is
            # designed to do and answers 503 on ALL FIVE OAuth mutation endpoints.
            # `mcp_end_to_end_smoke.sh` probes no OAuth route, so nothing would catch
            # it before traffic promotion.
            #
            # Shipping disabled removes the window rather than racing it: with this
            # set, `rateLimitEnabled()` returns false and BOTH entrypoints
            # (`oauthRateLimit` middleware and `chargeValidatedSubject`) short-circuit
            # on their FIRST statement — no fetch, no response written, no process
            # state touched, control straight to the handler. The five endpoints
            # behave byte-for-byte as they did before this PR (§N.8: proved by the
            # "DISABLED PATH IS A TRUE NO-OP" tests in
            # platform-mcp/src/__tests__/rate07_oauth_rate_limit.test.ts, not asserted
            # here). The honest cost: they are also not yet PROTECTED by the limiter.
            #
            # HOW TO ENABLE (the follow-up PR, in full):
            #   1. Confirm https://amjis-web-…run.app/api/mcp/rate-limit/check is live
            #      on the CURRENT web revision — i.e. this PR's own deploy-web run has
            #      completed at least once and promoted traffic. A POST with a valid
            #      X-MCP-Internal-Token must return 200 with an `allowed` field (a 404
            #      means the route is not deployed yet — do not proceed).
            #   2. Change the line below to `MCP_OAUTH_RATE_LIMIT_ENABLED=true`, or
            #      delete it (the code default is ON — see rateLimitEnabled()).
            #   3. Merge. No code change, no migration, nothing else.
            # Rollback is this same line back to `false`; note migration 580's DOWN
            # section — turn the flag off BEFORE dropping mcp_rate_buckets.
            MCP_OAUTH_RATE_LIMIT_ENABLED=false
          secrets: |
            MCP_INTERNAL_TOKEN=mcp-internal-token:1
            PYTHON_SIDECAR_API_KEY=PYTHON_SIDECAR_API_KEY:1

      - name: Resolve MCP candidate URL
        id: mcp-candidate-url
        env:
          CANDIDATE_TAG: ${{ steps.mcp-candidate.outputs.tag }}
        run: |
          candidate_url=$(gcloud run services describe amjis-mcp \
            --project=madhav-astrology \
            --region=${{ env.GCP_REGION }} \
            --format=json | jq --arg tag "$CANDIDATE_TAG" -r \
              '.status.traffic[] | select(.tag == $tag) | .url')
          test -n "$candidate_url"
          echo "url=$candidate_url" >> "$GITHUB_OUTPUT"

      # NOTE on the runner-side fetch below: server.ts never reads MCP_CANARY_KEY
      # as a container env var — Bearer keys are
      # validated by call-through to amjis-web's /api/mcp/keys/validate (auth.ts), not
      # against a local secret. The runtime mount is explicitly removed above. What
      # the smoke probes below actually need is the PLAINTEXT key value inside the
      # GitHub Actions runner process, to
      # send as a real Authorization: Bearer header against the candidate revision —
      # that requires the *deploying* identity (WIF_SERVICE_ACCOUNT) to hold a
      # secret-specific accessor binding. Live read-only IAM inspection on
      # 2026-09-16 confirmed that exact binding already exists for github-actions;
      # do not replace it with a project-wide grant.
      - name: Fetch MCP canary key for post-deploy smoke
        id: canary_key
        run: |
          KEY=$(gcloud secrets versions access latest --secret="mcp-canary-key" --project=madhav-astrology 2>/tmp/canary_key_err) || {
            echo "::warning::Could not read mcp-canary-key from Secret Manager — verify its existing secret-specific deploy-identity binding and enabled version. Smoke will FAIL LOUD on the auth probes (by design; see mcp_end_to_end_smoke.sh)."
            cat /tmp/canary_key_err || true
            KEY=""
          }
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke
        id: smoke
        env:
          SMOKE_MCP_URL: ${{ steps.mcp-candidate-url.outputs.url }}
          MCP_CANARY_KEY: ${{ steps.canary_key.outputs.key }}
        run: |
          bash scripts/operator/mcp_end_to_end_smoke.sh

      - name: Attest exact MCP candidate identity
        env:
          SMOKE_MCP_URL: ${{ steps.mcp-candidate-url.outputs.url }}
          EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
          EXPECTED_REVISION: ${{ steps.mcp-candidate.outputs.revision }}
        run: |
          curl --fail --silent --show-error --max-time 15 \
            "$SMOKE_MCP_URL/health" > "$RUNNER_TEMP/mcp-candidate-health.json"
          jq -e --arg sha "$EXPECTED_SHA" --arg revision "$EXPECTED_REVISION" \
            '.status == "ok" and .deployed_sha == $sha and .revision == $revision' \
            "$RUNNER_TEMP/mcp-candidate-health.json" >/dev/null || {
              echo "::error::MCP health did not attest the exact zero-traffic candidate."
              exit 1
            }

      # Pūrṇa Anveṣaṇa: this MCP revision registers tools whose durable job and
      # raw-lifecycle stores are served by the matching amjis-web revision. The
      # two images still build in parallel, but MCP traffic must not move first.
      # A revision label alone is insufficient because --no-traffic makes a new
      # revision ready before it is live; require the 100%-traffic web revision
      # to carry this exact source SHA, then prove both dependent routes exist
      # and preserve their unauthenticated fail-closed boundary.
      - name: Wait for matching web revision and inquiry routes
        env:
          WEB_SERVICE_URL: https://amjis-web-938361928218.asia-south1.run.app
        run: |
          ready=false
          for attempt in $(seq 1 80); do
            service_json=$(gcloud run services describe amjis-web \
              --region="${GCP_REGION}" --format=json 2>"$RUNNER_TEMP/web-service-readiness.err" || true)
            traffic_revision=$(jq -r \
              '[.status.traffic[]? | select((.percent // 0) == 100) | .revisionName][0] // empty' \
              <<<"$service_json" 2>/dev/null || true)
            traffic_sha=""
            if [ -n "$traffic_revision" ]; then
              traffic_sha=$(gcloud run revisions describe "$traffic_revision" \
                --region="${GCP_REGION}" --format="value(metadata.labels['commit-sha'])" \
                2>"$RUNNER_TEMP/web-revision-readiness.err" || true)
            fi
            if [ "$traffic_sha" = "$DEPLOY_SHA" ]; then
              inquiry_status=$(curl --silent --show-error --output "$RUNNER_TEMP/inquiry-readiness.json" \
                --write-out '%{http_code}' --max-time 15 --request POST \
                --header 'Content-Type: application/json' --data '{}' \
                "${WEB_SERVICE_URL}/api/mcp/inquiry" || true)
              jobs_status=$(curl --silent --show-error --output "$RUNNER_TEMP/prashna-jobs-readiness.json" \
                --write-out '%{http_code}' --max-time 15 --request POST \
                --header 'Content-Type: application/json' --data '{}' \
                "${WEB_SERVICE_URL}/api/mcp/prashna_jobs" || true)
              if [ "$inquiry_status" = 401 ] && [ "$jobs_status" = 401 ] \
                && jq -e '.ok == false and .error == "Unauthorized"' "$RUNNER_TEMP/inquiry-readiness.json" >/dev/null \
                && jq -e '.ok == false and .error == "Unauthorized"' "$RUNNER_TEMP/prashna-jobs-readiness.json" >/dev/null; then
                ready=true
                break
              fi
            fi
            echo "Web dependency not ready for ${DEPLOY_SHA} (attempt ${attempt}/80); MCP remains no-traffic."
            sleep 15
          done
          if [ "$ready" != true ]; then
            echo "::error::Matching web revision and inquiry routes were not ready; refusing MCP traffic promotion."
            exit 1
          fi

      - name: Prove MCP runtime OIDC and shared-token path
        env:
          SMOKE_MCP_URL: ${{ steps.mcp-candidate-url.outputs.url }}
          MCP_CANARY_KEY: ${{ steps.canary_key.outputs.key }}
        run: |
          JOB_ID="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          BODY="$(jq -cn --arg job_id "$JOB_ID" '{jsonrpc:"2.0",id:1039,method:"tools/call",params:{name:"prashna_status",arguments:{job_id:$job_id}}}')"
          STATUS="$(curl --silent --show-error --output "$RUNNER_TEMP/purna-mcp-oidc.json" \
            --write-out '%{http_code}' --max-time 30 --request POST \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --header "Authorization: Bearer ${MCP_CANARY_KEY}" \
            --data "$BODY" "${SMOKE_MCP_URL}/mcp")"
          unset BODY MCP_CANARY_KEY
          if [ "$STATUS" != 200 ]; then
            echo "::error::Candidate MCP OIDC probe returned HTTP $STATUS."
            exit 1
          fi
          PAYLOAD="$(sed -n 's/^data:[[:space:]]*//p' "$RUNNER_TEMP/purna-mcp-oidc.json" | head -n 1)"
          if [ -z "$PAYLOAD" ]; then PAYLOAD="$(cat "$RUNNER_TEMP/purna-mcp-oidc.json")"; fi
          TOOL_TEXT="$(jq -er '.result.content[0].text' <<<"$PAYLOAD")" || {
            echo "::error::Candidate MCP OIDC probe did not return an MCP tool envelope."
            exit 1
          }
          jq -e --arg job_id "$JOB_ID" \
            '.ok == false and .tool == "prashna_status" and .job_id == $job_id and (.error | startswith("Unknown or expired job_id"))' \
            <<<"$TOOL_TEXT" >/dev/null || {
              echo "::error::Candidate MCP did not reach the authenticated durable-store miss path."
              exit 1
            }

      - name: Promote verified MCP candidate
        if: success()
        env:
          EXPECTED_REVISION: ${{ steps.mcp-candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic amjis-mcp \
            --project=madhav-astrology \
            --to-revisions="$EXPECTED_REVISION=100" \
            --region=${{ env.GCP_REGION }} \
            --quiet

      - name: Remove MCP candidate tag
        if: ${{ always() && steps.deploy.outcome == 'success' }}
        env:
          CANDIDATE_TAG: ${{ steps.mcp-candidate.outputs.tag }}
        run: |
          gcloud run services update-traffic amjis-mcp \
            --project=madhav-astrology \
            --region=${{ env.GCP_REGION }} \
            --remove-tags="$CANDIDATE_TAG" \
            --quiet

      - name: Show deployment URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: echo "Deployed to $DEPLOY_URL"
      # ── /PARISHODHANA Phase C item 2 ──
  # ── /4.edge_and_infra_hygiene ──

  # ── Orchestrator Convergence Phase 1: brahma-pipeline job image under CI ──
  # The `brahma-build-pipeline-job` Cloud Run Job image was previously built
  # out-of-band by hand, so the deployed SHA was not reproducible from the repo
  # and silently lacked ga_writers/ (the bug this arc fixes). This job builds +
  # pushes the image from main on every deploy and re-points the Cloud Run Job at
  # the new SHA, so the job image can never again diverge from the code.
  # Context is the repo root (Dockerfile.pipeline COPYs repo-root paths).
  deploy-pipeline-job:
    name: Build & Deploy Pipeline Job Image
    needs: [changes, migrate]
    # Match the web/MCP schema-barrier contract: evaluate after the optional
    # bootstrap ancestor, but admit delivery only after both direct dependencies
    # have succeeded.
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.migrate.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.pipeline == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # #2159: workflow_run.head_sha can resolve to a stale commit under
      # fast-merging queues -- guard against silently building/deploying
      # from the wrong source (see migrate/deploy-web's identical step).
      - name: Verify deployment source provenance
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$DEPLOY_SHA" ]; then
            echo "::error::Deployment checkout mismatch: expected $DEPLOY_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Deploying immutable source SHA $ACTUAL_SHA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push pipeline job image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform/python-sidecar/Dockerfile.pipeline
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/brahma-pipeline:${{ env.DEPLOY_SHA }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/brahma-pipeline:latest
          cache-from: type=gha,scope=brahma-pipeline
          cache-to: type=gha,mode=max,scope=brahma-pipeline

      - name: Re-point Cloud Run Job at the new image
        run: |
          # F-185: KA_KSHETRA_HASH_SPILL_DIR was unconfigured, so the writer
          # silently fell back to TMPDIR (`/tmp`), which is RAM-backed tmpfs on
          # Cloud Run — no volume mount exists anywhere in this repo's infra to
          # give it a real disk. Interim disposition: pin it to `/tmp`
          # explicitly (so the choice is observable, not an implicit fallback —
          # the writer now logs the resolved path and filesystem kind at
          # startup) and raise --memory to cover the ~3-4.2GB RAM-backed spill
          # at the native chart's 10.5M-row scale on top of the job's existing
          # working set. Provisioning a disk-backed volume mount is out of
          # scope for this fix; see F-185 in the PARISESA-V4 findings.
          gcloud run jobs update brahma-build-pipeline-job \
            --region=${{ env.GCP_REGION }} \
            --image=asia-south1-docker.pkg.dev/madhav-astrology/amjis/brahma-pipeline:${{ env.DEPLOY_SHA }} \
            --service-account=data-plane-builder-runtime@madhav-astrology.iam.gserviceaccount.com \
            --update-secrets=DATABASE_URL=data-plane-builder-db-url:latest \
            --task-timeout=86400 \
            --memory=16Gi \
            --cpu=4 \
            --update-env-vars=GCP_PROJECT=madhav-astrology,PUBSUB_TOPIC=cockpit-events,KA_KSHETRA_HASH_SPILL_DIR=/tmp \
            --quiet

      - name: Verify ga_writers is importable in the pushed image
        run: |
          docker run --rm --entrypoint python \
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/brahma-pipeline:${{ env.DEPLOY_SHA }} \
            -c "import ga_writers; print('ga_writers OK:', ga_writers.__file__)"
  # ── /Orchestrator Convergence Phase 1 ──

  # A skipped prerequisite causes all dependent mutation jobs to skip, and
  # GitHub otherwise treats that graph as a successful workflow. This terminal
  # job is the earned-signal detector: when production's own revision says a
  # deployable component changed, the corresponding mutation must have actually
  # succeeded. It intentionally does not alter the migration barrier or any
  # protected-owner gate.
  deployment-outcome:
    name: Require earned deployment outcome
    needs: [changes, migrate, deploy-web, deploy-sidecar, deploy-mcp, deploy-pipeline-job]
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout detector
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require every source-implied mutation to succeed
        env:
          OUTCOME_EVENT_NAME: ${{ github.event_name }}
          OUTCOME_SHA: ${{ env.DEPLOY_SHA }}
          OUTCOME_CHANGES_RESULT: ${{ needs.changes.result }}
          OUTCOME_FORCE_ALL: ${{ needs.changes.outputs.force_all }}
          OUTCOME_WEB_CHANGED: ${{ needs.changes.outputs.web }}
          OUTCOME_SIDECAR_CHANGED: ${{ needs.changes.outputs.sidecar }}
          OUTCOME_MCP_CHANGED: ${{ needs.changes.outputs.mcp }}
          OUTCOME_PIPELINE_CHANGED: ${{ needs.changes.outputs.pipeline }}
          OUTCOME_MIGRATE_RESULT: ${{ needs.migrate.result }}
          OUTCOME_WEB_RESULT: ${{ needs.deploy-web.result }}
          OUTCOME_SIDECAR_RESULT: ${{ needs.deploy-sidecar.result }}
          OUTCOME_MCP_RESULT: ${{ needs.deploy-mcp.result }}
          OUTCOME_PIPELINE_RESULT: ${{ needs.deploy-pipeline-job.result }}
        run: cd platform && npx --yes tsx scripts/ci/deployment_outcome_gate.ts
