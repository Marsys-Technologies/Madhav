name: Deploy to Cloud Run

on:
  # Deploy only after CI passes — prevents deploying broken builds.
  # Fires when "CI — Ganga Quality Gate" completes on main; the job-level
  # `if:` below gates on conclusion == 'success'.
  workflow_run:
    workflows: ["CI — Ganga Quality Gate"]
    types: [completed]
    branches: [main]
  # PR trigger: build-only job (no push, no Cloud Run deploy) catches
  # Dockerfile / Next.js build failures before merge.
  pull_request:
    branches: [main]
    paths:
      - 'platform/**'
      - 'platform-mcp/**'
      - '.github/workflows/deploy.yml'
  # Keep workflow_dispatch for emergency manual deploys (bypasses CI gate).
  workflow_dispatch:

env:
  GCP_REGION: asia-south1
  WIF_PROVIDER: projects/938361928218/locations/global/workloadIdentityPools/github/providers/github-actions
  WIF_SERVICE_ACCOUNT: github-actions@madhav-astrology.iam.gserviceaccount.com

jobs:
  # ── PR build-check: build without push to catch Dockerfile/Next.js failures pre-merge ──
  build-check:
    name: Build Check (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy governance files into platform build context
        run: |
          mkdir -p platform/00_ARCHITECTURE
          cp 00_ARCHITECTURE/CAPABILITY_MANIFEST.json platform/00_ARCHITECTURE/CAPABILITY_MANIFEST.json
          cp 00_ARCHITECTURE/manifest_overrides.yaml platform/00_ARCHITECTURE/manifest_overrides.yaml
          cp 00_ARCHITECTURE/PLANNER_PROMPT_v1_0.md platform/00_ARCHITECTURE/PLANNER_PROMPT_v1_0.md
          cp 00_ARCHITECTURE/PLANNER_PROMPT_v2_0.md platform/00_ARCHITECTURE/PLANNER_PROMPT_v2_0.md
          cp -r 035_DISCOVERY_LAYER platform/035_DISCOVERY_LAYER
          cp -r 01_FACTS_LAYER platform/01_FACTS_LAYER
          cp -r 025_HOLISTIC_SYNTHESIS platform/025_HOLISTIC_SYNTHESIS

      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=ci-placeholder
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-placeholder
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-placeholder
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-placeholder
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=ci-placeholder
            NEXT_PUBLIC_FIREBASE_APP_ID=ci-placeholder
            NEXT_PUBLIC_APP_URL=https://amjis-web.run.app
            NEXT_PUBLIC_NIM_STACK_DEGRADED=false
            NEXT_PUBLIC_MARSYS_FLAG_R9_PROJECTS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_PERSONAS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_TOOL_FLOW=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_SEMANTIC_SEARCH=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_SCROLL_DISCIPLINE=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_INTERACTIVE_TABLES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_MERMAID=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_CITATION_FRESHNESS=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_VALIDATOR_GATES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_EDIT_WHILE_STREAMING=false
            NEXT_PUBLIC_MARSYS_FLAG_R11V2_MULTI_PROVIDER_PARITY=true
            NEXT_PUBLIC_MARSYS_FLAG_R11C_TOOL_CARDS=true
            NEXT_PUBLIC_MARSYS_FLAG_R11B_LOOK_AND_FEEL=true

  deploy-web:
    name: Build & Deploy Web
    # Only deploy on workflow_run (CI passed on main) or manual dispatch.
    # pull_request events are handled by the build-check job above.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Mirrors platform/cloudbuild.yaml copy-governance-files step.
      # Without this, the Dockerfile's COPY for 00_ARCHITECTURE and
      # 035_DISCOVERY_LAYER fails — those dirs live at the repo root, not in platform/.
      - name: Copy governance files into platform build context
        run: |
          mkdir -p platform/00_ARCHITECTURE
          cp 00_ARCHITECTURE/CAPABILITY_MANIFEST.json platform/00_ARCHITECTURE/CAPABILITY_MANIFEST.json
          cp 00_ARCHITECTURE/manifest_overrides.yaml platform/00_ARCHITECTURE/manifest_overrides.yaml
          cp 00_ARCHITECTURE/PLANNER_PROMPT_v1_0.md platform/00_ARCHITECTURE/PLANNER_PROMPT_v1_0.md
          cp 00_ARCHITECTURE/PLANNER_PROMPT_v2_0.md platform/00_ARCHITECTURE/PLANNER_PROMPT_v2_0.md
          cp -r 035_DISCOVERY_LAYER platform/035_DISCOVERY_LAYER
          cp -r 01_FACTS_LAYER platform/01_FACTS_LAYER
          cp -r 025_HOLISTIC_SYNTHESIS platform/025_HOLISTIC_SYNTHESIS

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:${{ github.sha }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:latest
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_MARSYS_FLAG_R9_PROJECTS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_PERSONAS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_TOOL_FLOW=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_SEMANTIC_SEARCH=true
            NEXT_PUBLIC_APP_URL=https://amjis-web.run.app
            NEXT_PUBLIC_NIM_STACK_DEGRADED=false
            NEXT_PUBLIC_MARSYS_FLAG_R10_SCROLL_DISCIPLINE=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_INTERACTIVE_TABLES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_MERMAID=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_CITATION_FRESHNESS=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_VALIDATOR_GATES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_EDIT_WHILE_STREAMING=false
            NEXT_PUBLIC_MARSYS_FLAG_R11V2_MULTI_PROVIDER_PARITY=${{ vars.NEXT_PUBLIC_MARSYS_FLAG_R11V2_MULTI_PROVIDER_PARITY || 'true' }}
            NEXT_PUBLIC_MARSYS_FLAG_R11C_TOOL_CARDS=true
            NEXT_PUBLIC_MARSYS_FLAG_R11B_LOOK_AND_FEEL=${{ vars.NEXT_PUBLIC_MARSYS_FLAG_R11B_LOOK_AND_FEEL || 'true' }}

      - name: Deploy web to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: amjis-web
          region: ${{ env.GCP_REGION }}
          image: asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:${{ github.sha }}
          # ── 4.edge_and_infra_hygiene ──
          # Per-service least-priv runtime SA (see infra/iam/main.tf).
          flags: --service-account=amjis-web-runtime@madhav-astrology.iam.gserviceaccount.com
          # ── /4.edge_and_infra_hygiene ──
          env_vars: |
            NODE_ENV=production
            MARSYS_FLAG_R11V2_USE_ADAPTERS=true
            MARSYS_FLAG_R11D_PROMPT_LAYOUT=true
            MARSYS_FLAG_R11D_ANTHROPIC_CACHE=true
            MARSYS_FLAG_R11E_ANTHROPIC_LOOP=true
            MARSYS_FLAG_R11E_GEMINI_LOOP=true
            MARSYS_FLAG_R11E_OPENAI_LOOP=true
            MARSYS_FLAG_R11E_DEEPSEEK_LOOP=true
            MARSYS_FLAG_R11E_NVIDIA_LOOP=true
            INSTANCE_CONNECTION_NAME=madhav-astrology:asia-south1:amjis-postgres
            DB_USER=amjis_app
            DB_NAME=amjis
            GCP_PROJECT=madhav-astrology
            GCS_BUCKET_CHAT_ATTACHMENTS=madhav-astrology-chat-attachments
            GCS_BUCKET_CHART_DOCUMENTS=madhav-astrology-chart-documents
            ASTROLOGER_EMAIL=mail.abhisek.mohanty@gmail.com
            PYTHON_SIDECAR_URL=https://amjis-sidecar-938361928218.asia-south1.run.app
            BUILD_STATE_GCS_BASE=https://storage.googleapis.com/madhav-marsys-build-artifacts
            # ── 4.observability (Wave 4) ──────────────────────────────────────────
            # Vertex AI region pin for batched embeddings (lib/embeddings/embedText.ts).
            # Region must match the prod Cloud Run region (asia-south1) to keep
            # Vertex calls in-region for both latency + egress cost.
            VERTEX_AI_LOCATION=asia-south1
            MARSYS_FLAG_HISTORY_COMPRESSION_ENABLED=true
            # NOTE: NEXT_PUBLIC_FIREBASE_* intentionally absent from runtime env_vars.
            # These are NEXT_PUBLIC_ flags baked into the bundle at build time (see
            # build-args above). Cloud Run env_vars are never read by Next.js at
            # runtime — setting them here has zero effect and misleadingly implies
            # that rotating them without a full rebuild would take effect.
          # Issue 11: these are pinned to :latest which auto-follows any rotation.
          # After each secret rotation, run:
          #   gcloud secrets versions list <name> --project=madhav-astrology
          # and pin to the explicit version number here.
          secrets: |
            FIREBASE_ADMIN_CREDENTIALS=firebase-admin-credentials:latest
            DB_PASSWORD=amjis-db-password:latest
            OPENAI_API_KEY=openai-api-key:latest
            ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
            GOOGLE_GENERATIVE_AI_API_KEY=GOOGLE_GENERATIVE_AI_API_KEY:latest
            DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:latest
            NVIDIA_NIM_API_KEY=NVIDIA_NIM_API_KEY:latest
            PYTHON_SIDECAR_API_KEY=PYTHON_SIDECAR_API_KEY:latest
            SUPER_ADMIN_EMAIL=SUPER_ADMIN_EMAIL:latest

      - name: Show deployment URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: echo "Deployed to $DEPLOY_URL"

  deploy-sidecar:
    name: Build & Deploy Sidecar
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push sidecar image
        uses: docker/build-push-action@v6
        with:
          context: ./platform/python-sidecar
          file: ./platform/python-sidecar/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-sidecar:${{ github.sha }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-sidecar:latest

      - name: Deploy sidecar to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: amjis-sidecar
          region: ${{ env.GCP_REGION }}
          image: asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-sidecar:${{ github.sha }}
          # ── 4.edge_and_infra_hygiene ──
          # Per-service least-priv runtime SA (see infra/iam/main.tf).
          flags: --timeout=300 --cpu=2 --memory=1Gi --min-instances=1 --service-account=amjis-sidecar-runtime@madhav-astrology.iam.gserviceaccount.com
          # ── /4.edge_and_infra_hygiene ──
          secrets: |
            PYTHON_SIDECAR_API_KEY=PYTHON_SIDECAR_API_KEY:latest
            ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
            GOOGLE_GENERATIVE_AI_API_KEY=GOOGLE_GENERATIVE_AI_API_KEY:latest

  # ── 4.edge_and_infra_hygiene ──
  # MCP deploy moved off the legacy Cloud Build trigger into GH Actions WIF
  # (acceptance §6: deploy.yml is sole orchestrator). Image still builds via
  # platform-mcp/cloudbuild.yaml or Docker here; trigger is GH Actions only.
  # Image is pinned to Artifact Registry (asia-south1-docker.pkg.dev/...),
  # not legacy gcr.io.
  deploy-mcp:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Build & Deploy MCP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Copy governance files into MCP build context
        run: |
          mkdir -p platform-mcp/00_ARCHITECTURE
          cp 00_ARCHITECTURE/CAPABILITY_MANIFEST.json platform-mcp/00_ARCHITECTURE/CAPABILITY_MANIFEST.json || true
          cp -r 01_FACTS_LAYER platform-mcp/01_FACTS_LAYER || true
          cp -r 025_HOLISTIC_SYNTHESIS platform-mcp/025_HOLISTIC_SYNTHESIS || true

      - name: Build and push MCP image (Artifact Registry, not gcr.io)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform-mcp/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-mcp:${{ github.sha }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-mcp:latest

      - name: Deploy MCP to Cloud Run (IAM-gated, least-priv SA)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: amjis-mcp
          region: ${{ env.GCP_REGION }}
          image: asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-mcp:${{ github.sha }}
          # IAM-gated (no --allow-unauthenticated); per-service runtime SA.
          flags: --no-allow-unauthenticated --service-account=amjis-mcp-runtime@madhav-astrology.iam.gserviceaccount.com --min-instances=1 --concurrency=80 --memory=512Mi
          env_vars: |
            PLATFORM_URL=https://amjis-web-938361928218.asia-south1.run.app
          secrets: |
            MCP_INTERNAL_TOKEN=mcp-internal-token:latest
  # ── /4.edge_and_infra_hygiene ──
