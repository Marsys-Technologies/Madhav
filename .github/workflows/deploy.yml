name: Deploy to Cloud Run

on:
  # Deploy only after CI passes — prevents deploying broken builds.
  # Fires when "CI — Ganga Quality Gate" completes on main; the job-level
  # `if:` below gates on conclusion == 'success'.
  workflow_run:
    workflows: ["CI — Ganga Quality Gate"]
    types: [completed]
    branches: [main]
  # PR trigger: build-only job (no push, no Cloud Run deploy) catches
  # Dockerfile / Next.js build failures before merge.
  pull_request:
    branches: [main]
    paths:
      - 'platform/**'
      - 'platform-mcp/**'
      - '.github/workflows/deploy.yml'
  # Manual deploys stay available — but they are held to the SAME CI gate as an automatic
  # deploy unless an operator deliberately overrides it and says why. Until SAMĀPTI this
  # trigger bypassed the CI gate outright (`event_name == 'workflow_dispatch' || ...` on every
  # deploy job), observed 3x in one night — twice landing ~4 minutes AHEAD of CI completion.
  # See Dvārapāla RULING 71 / RULING 73-CLOSE and platform/scripts/ci/dispatch_gate.ts.
  workflow_dispatch:
    inputs:
      ci_gate:
        description: 'CI gate for this manual deploy'
        type: choice
        required: true
        default: require-ci-green
        options:
          - require-ci-green
          - EMERGENCY-OVERRIDE-CI-NOT-GREEN
      emergency_reason:
        description: 'Required when overriding: what is on fire (>= 20 chars, recorded in the run log)'
        type: string
        required: false
        default: ''
      force_all_services:
        description: 'Also deploy sidecar / MCP / pipeline-job even if their paths did not change'
        type: boolean
        required: false
        default: false

# CI efficiency audit (2026-07-31). Two different behaviours in one workflow:
#   - pull_request  -> the `build-check` job only, which builds with `push: false`
#                      for both the web and pipeline-job images (verified). Nothing
#                      leaves the runner, so a superseded run is safe to cancel, and
#                      at ~346s it is worth cancelling.
#   - everything else (workflow_run on main, workflow_dispatch) -> the real deploy
#                      jobs, which push images and update Cloud Run. NEVER cancel
#                      these; killing one mid-flight can leave a half-applied state.
#                      They serialise on the group and queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GCP_REGION: asia-south1
  WIF_PROVIDER: projects/938361928218/locations/global/workloadIdentityPools/github/providers/github-actions
  WIF_SERVICE_ACCOUNT: github-actions@madhav-astrology.iam.gserviceaccount.com

jobs:
  # ── PR build-check: build without push to catch Dockerfile/Next.js failures pre-merge ──
  build-check:
    name: Build Check (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy governance files into platform build context
        run: |
          mkdir -p platform/00_ARCHITECTURE
          cp 00_ARCHITECTURE/CAPABILITY_MANIFEST.json platform/00_ARCHITECTURE/CAPABILITY_MANIFEST.json
          cp 00_ARCHITECTURE/manifest_overrides.yaml platform/00_ARCHITECTURE/manifest_overrides.yaml
          cp 00_ARCHITECTURE/PLANNER_PROMPT_v*.md platform/00_ARCHITECTURE/
          cp -r 01_FACTS_LAYER platform/01_FACTS_LAYER
          cp -r 025_HOLISTIC_SYNTHESIS platform/025_HOLISTIC_SYNTHESIS
          cp -r 035_DISCOVERY_LAYER platform/035_DISCOVERY_LAYER

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: false
          cache-from: type=gha,scope=amjis-web
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=ci-placeholder
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-placeholder
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-placeholder
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-placeholder
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=ci-placeholder
            NEXT_PUBLIC_FIREBASE_APP_ID=ci-placeholder
            NEXT_PUBLIC_APP_URL=https://amjis-web.run.app
            NEXT_PUBLIC_NIM_STACK_DEGRADED=false
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=
            NEXT_PUBLIC_MARSYS_FLAG_R9_PERSONAS=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_SCROLL_DISCIPLINE=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_INTERACTIVE_TABLES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_MERMAID=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_CITATION_FRESHNESS=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_VALIDATOR_GATES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_EDIT_WHILE_STREAMING=false
            NEXT_PUBLIC_MARSYS_FLAG_R11C_TOOL_CARDS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_PROJECTS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_SEMANTIC_SEARCH=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_TOOL_FLOW=true
            NEXT_PUBLIC_MARSYS_FLAG_R11B_LOOK_AND_FEEL=true
            NEXT_PUBLIC_MARSYS_FLAG_R11V2_MULTI_PROVIDER_PARITY=true

      # Build the orchestrator job image (no push) so a broken Dockerfile.pipeline
      # — e.g. a missing COPY for ga_writers/ — is caught at PR time. Context is the
      # repo root because Dockerfile.pipeline COPYs from repo-root paths
      # (platform/python-sidecar/* and 035_DISCOVERY_LAYER/*).
      - name: Build pipeline job image (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform/python-sidecar/Dockerfile.pipeline
          push: false
          load: true
          tags: brahma-pipeline:pr-check
          cache-from: type=gha,scope=brahma-pipeline

      - name: Verify ga_writers is importable in the pipeline image
        run: |
          docker run --rm --entrypoint python brahma-pipeline:pr-check \
            -c "import ga_writers; print('ga_writers OK:', ga_writers.__file__)"

  # ── Deploy gate + path-change detection ─────────────────────────────────────
  # Runs only on workflow_run success or manual dispatch (same guard as deploy
  # jobs). pull_request events never reach this job. Fallback: if HEAD~1
  # doesn't exist (first commit / shallow root), all three outputs default to
  # 'true' so gated jobs deploy safely rather than silently skip.
  #
  # SAMĀPTI: this job is now also the CI gate for MANUAL dispatches. Every deploy
  # job `needs: [changes]`, so failing here skips all of them — no `always()`
  # gymnastics, no new job topology, and the fail-closed direction is the safe one.
  changes:
    name: Gate & detect changed paths
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the CI workflow's conclusion for this SHA
    outputs:
      sidecar: ${{ steps.diff.outputs.sidecar }}
      mcp: ${{ steps.diff.outputs.mcp }}
      pipeline: ${{ steps.diff.outputs.pipeline }}
      force_all: ${{ steps.gate.outputs.force_all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ── SAMĀPTI: close the workflow_dispatch CI-gate bypass ──────────────────
      # A manual dispatch used to deploy regardless of CI. It now defaults to the
      # same CI-green requirement as an automatic deploy; bypassing it takes two
      # deliberate acts (select the EMERGENCY-OVERRIDE-CI-NOT-GREEN choice AND type
      # a >= 20-char reason), both recorded here. Emergency capability preserved —
      # that was RULING 73-CLOSE's stated objection to hardening this.
      # Decision logic + unit tests: platform/scripts/ci/dispatch_gate.ts.
      - name: Set up Node.js for the dispatch gate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve CI conclusion for this SHA
        id: ci_status
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest-first; take the most recent COMPLETED run of the CI workflow for THIS sha.
          RUNS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=50" \
            --jq '[.workflow_runs[] | select(.status=="completed")] | first' 2>/dev/null || echo '')
          if [ -z "$RUNS" ] || [ "$RUNS" = "null" ]; then
            CONCLUSION=none
            URL=""
          else
            CONCLUSION=$(printf '%s' "$RUNS" | jq -r '.conclusion // "none"')
            URL=$(printf '%s' "$RUNS" | jq -r '.html_url // ""')
          fi
          echo "conclusion=$CONCLUSION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "CI conclusion for ${GITHUB_SHA}: $CONCLUSION ${URL}"

      - name: Manual-dispatch CI gate
        if: github.event_name == 'workflow_dispatch'
        env:
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_CI_GATE: ${{ inputs.ci_gate }}
          GATE_EMERGENCY_REASON: ${{ inputs.emergency_reason }}
          GATE_CI_CONCLUSION: ${{ steps.ci_status.outputs.conclusion }}
          GATE_CI_RUN_URL: ${{ steps.ci_status.outputs.url }}
          GATE_SHA: ${{ github.sha }}
        run: |
          cd platform && npx --yes tsx scripts/ci/dispatch_gate.ts
      # ── /SAMĀPTI dispatch gate ───────────────────────────────────────────────

      - name: Resolve force-all-services flag
        id: gate
        run: |
          # 'true' ONLY when an operator explicitly asked for it on a manual dispatch.
          # Previously every dispatch force-deployed all services implicitly, discarding
          # the path outputs this job had just computed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_all_services }}" = "true" ]; then
            echo "force_all=true" >> "$GITHUB_OUTPUT"
          else
            echo "force_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed paths
        id: diff
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          echo "=== Changed files ==="
          printf '%s\n' "$CHANGED"
          echo "====================="

          sidecar=false
          mcp=false
          pipeline=false

          if printf '%s\n' "$CHANGED" | grep -q '^platform/python-sidecar/'; then
            sidecar=true
          fi

          if printf '%s\n' "$CHANGED" | grep -q '^platform-mcp/'; then
            mcp=true
          fi

          if printf '%s\n' "$CHANGED" | grep -qE \
            '^(platform/python-sidecar/Dockerfile\.pipeline|platform/python-sidecar/ga_writers/|platform/python-sidecar/pipeline/|platform/python-sidecar/services/|platform/python-sidecar/brahmagyan/|platform/python-sidecar/pyjhora_adapter/|platform/python-sidecar/bodha_writers/|platform/python-sidecar/panchang_engine/|platform/python-sidecar/muhurat/|platform/python-sidecar/requirements|035_DISCOVERY_LAYER/)'; then
            pipeline=true
          fi

          {
            echo "sidecar=$sidecar"
            echo "mcp=$mcp"
            echo "pipeline=$pipeline"
          } >> "$GITHUB_OUTPUT"

          echo "=== Outputs ==="
          echo "sidecar=$sidecar  mcp=$mcp  pipeline=$pipeline"
  # ── /Path-change detection ───────────────────────────────────────────────────

  deploy-web:
    name: Build & Deploy Web
    # Only deploy on workflow_run (CI passed on main) or manual dispatch.
    # pull_request events are handled by the build-check job above.
    # `needs: [changes]` is load-bearing, not cosmetic: it is what binds the manual-dispatch
    # CI gate to this job — the one that runs migrations and promotes production traffic.
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # ── A-S8: Run idempotent migrations before deploying ─────────────────────
      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.1/cloud-sql-proxy.linux.amd64" \
            -o cloud-sql-proxy && chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 \
            madhav-astrology:asia-south1:amjis-postgres &
          sleep 5

      - name: Set up Node.js for migration runner
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install migration runner deps
        run: cd platform && npm install --ignore-scripts --no-fund tsx pg

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PROD_DATABASE_URL secret not set — migrations NOT applied. Failing build."
            exit 1
          else
            cd platform && npx tsx scripts/migrate.ts
          fi
      # ── /A-S8: migrations ─────────────────────────────────────────────────────

      - name: Copy governance files into platform build context
        run: |
          mkdir -p platform/00_ARCHITECTURE
          cp 00_ARCHITECTURE/CAPABILITY_MANIFEST.json platform/00_ARCHITECTURE/CAPABILITY_MANIFEST.json
          cp 00_ARCHITECTURE/manifest_overrides.yaml platform/00_ARCHITECTURE/manifest_overrides.yaml
          cp 00_ARCHITECTURE/PLANNER_PROMPT_v*.md platform/00_ARCHITECTURE/
          cp -r 01_FACTS_LAYER platform/01_FACTS_LAYER
          cp -r 025_HOLISTIC_SYNTHESIS platform/025_HOLISTIC_SYNTHESIS
          cp -r 035_DISCOVERY_LAYER platform/035_DISCOVERY_LAYER

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ./platform/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:${{ github.sha }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:latest
          cache-from: type=gha,scope=amjis-web
          cache-to: type=gha,mode=max,scope=amjis-web
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_APP_URL=https://amjis-web.run.app
            NEXT_PUBLIC_NIM_STACK_DEGRADED=false
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_MARSYS_FLAG_R9_PERSONAS=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_SCROLL_DISCIPLINE=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_INTERACTIVE_TABLES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_MERMAID=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_CITATION_FRESHNESS=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_VALIDATOR_GATES=true
            NEXT_PUBLIC_MARSYS_FLAG_R10_EDIT_WHILE_STREAMING=false
            NEXT_PUBLIC_MARSYS_FLAG_R11C_TOOL_CARDS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_PROJECTS=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_SEMANTIC_SEARCH=true
            NEXT_PUBLIC_MARSYS_FLAG_R9_TOOL_FLOW=true
            NEXT_PUBLIC_MARSYS_FLAG_R11B_LOOK_AND_FEEL=true
            NEXT_PUBLIC_MARSYS_FLAG_R11V2_MULTI_PROVIDER_PARITY=true

      # ── A-S8: Deploy no-traffic, smoke, then promote ──────────────────────────
      - name: Deploy web to Cloud Run (no traffic)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: amjis-web
          region: ${{ env.GCP_REGION }}
          image: asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:${{ github.sha }}
          # Per-service least-priv runtime SA; no-traffic for pre-smoke safety.
          flags: >-
            --service-account=amjis-web-runtime@madhav-astrology.iam.gserviceaccount.com
            --no-traffic
            --min-instances=1
          env_vars: |
            NODE_ENV=production
            INSTANCE_CONNECTION_NAME=madhav-astrology:asia-south1:amjis-postgres
            DB_USER=amjis_app
            DB_NAME=amjis
            GCP_PROJECT=madhav-astrology
            GOOGLE_CLOUD_PROJECT=madhav-astrology
            GCS_BUCKET_CHAT_ATTACHMENTS=madhav-astrology-chat-attachments
            GCS_BUCKET_CHART_DOCUMENTS=madhav-astrology-chart-documents
            ASTROLOGER_EMAIL=mail.abhisek.mohanty@gmail.com
            PYTHON_SIDECAR_URL=https://amjis-sidecar-938361928218.asia-south1.run.app
            APP_URL=https://amjis-web-938361928218.asia-south1.run.app
            BUILD_REAPER_SA_EMAIL=build-reaper@madhav-astrology.iam.gserviceaccount.com
            VERTEX_AI_LOCATION=asia-south1
            MARSYS_FLAG_HISTORY_COMPRESSION_ENABLED=true
            BOOTSTRAP_JOB_NAME=brahma-foundation-bootstrap
            BUILD_JOB_NAME=brahma-build-pipeline-job
            BQ_DATASET=brahma_l5_olap
            GCS_OLAP_PREFIX=gs://madhav-brahma-olap/parquet/
            MARSYS_REPO_ROOT=/app
            MARSYS_FLAG_VECTOR_SEARCH_ENABLED=true
            MARSYS_FLAG_BUILD_TRIGGER_ENABLED=true
            MARSYS_FLAG_OBSERVATORY_ENABLED=true
            # NOTE: NEXT_PUBLIC_FIREBASE_* intentionally absent from runtime env_vars.
            # These are NEXT_PUBLIC_ flags baked into the bundle at build time (see
            # build-args above). Cloud Run env_vars are never read by Next.js at
            # runtime — setting them here has zero effect and misleadingly implies
            # that rotating them without a full rebuild would take effect.
          secrets: |
            FIREBASE_ADMIN_CREDENTIALS=firebase-admin-credentials:1
            DB_PASSWORD=amjis-db-password:3
            OPENAI_API_KEY=openai-api-key:2
            GOOGLE_GENERATIVE_AI_API_KEY=GOOGLE_GENERATIVE_AI_API_KEY:1
            DEEPSEEK_API_KEY=DEEPSEEK_API_KEY:1
            NVIDIA_NIM_API_KEY=NVIDIA_NIM_API_KEY:1
            PYTHON_SIDECAR_API_KEY=PYTHON_SIDECAR_API_KEY:1
            SUPER_ADMIN_EMAIL=SUPER_ADMIN_EMAIL:1
            MARSYS_CRON_SECRET=mcpt-scheduler-secret:latest
            MCP_INTERNAL_TOKEN=mcp-internal-token:1
            MCP_CANARY_KEY=mcp-canary-key:latest

      - name: Post-deploy smoke
        id: smoke
        env:
          SMOKE_WEB_URL: ${{ steps.deploy.outputs.url }}
        run: |
          bash scripts/operator/end_to_end_smoke.sh

      - name: Promote traffic to latest revision
        if: success()
        run: |
          gcloud run services update-traffic amjis-web \
            --to-latest \
            --region=${{ env.GCP_REGION }} \
            --quiet
      # ── /A-S8: deploy + smoke + promote ──────────────────────────────────────

      - name: Show deployment URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: echo "Deployed to $DEPLOY_URL"

  deploy-sidecar:
    name: Build & Deploy Sidecar
    needs: [changes]
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.sidecar == 'true')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push sidecar image
        uses: docker/build-push-action@v6
        with:
          context: ./platform/python-sidecar
          file: ./platform/python-sidecar/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-sidecar:${{ github.sha }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-sidecar:latest
          cache-from: type=gha,scope=amjis-sidecar
          cache-to: type=gha,mode=max,scope=amjis-sidecar

      - name: Deploy sidecar to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: amjis-sidecar
          region: ${{ env.GCP_REGION }}
          image: asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-sidecar:${{ github.sha }}
          # ── 4.edge_and_infra_hygiene ──
          # Per-service least-priv runtime SA (see infra/iam/main.tf).
          flags: >-
            --timeout=300
            --cpu=2
            --memory=1Gi
            --min-instances=0
            --service-account=amjis-sidecar-runtime@madhav-astrology.iam.gserviceaccount.com
          # ── /4.edge_and_infra_hygiene ──
          secrets: |
            PYTHON_SIDECAR_API_KEY=PYTHON_SIDECAR_API_KEY:1
            GOOGLE_GENERATIVE_AI_API_KEY=GOOGLE_GENERATIVE_AI_API_KEY:1

  # ── 4.edge_and_infra_hygiene ──
  # MCP deploy moved off the legacy Cloud Build trigger into GH Actions WIF
  # (acceptance §6: deploy.yml is sole orchestrator). Image builds via Docker
  # here; trigger is GH Actions only. Image is pinned to Artifact Registry
  # (asia-south1-docker.pkg.dev/...), not legacy gcr.io.
  deploy-mcp:
    needs: [changes]
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.mcp == 'true')
    name: Build & Deploy MCP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Copy governance files into MCP build context
        run: |
          mkdir -p platform-mcp/00_ARCHITECTURE
          cp 00_ARCHITECTURE/CAPABILITY_MANIFEST.json platform-mcp/00_ARCHITECTURE/CAPABILITY_MANIFEST.json || true
          cp -r 01_FACTS_LAYER platform-mcp/01_FACTS_LAYER || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push MCP image (Artifact Registry, not gcr.io)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform-mcp/Dockerfile
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-mcp:${{ github.sha }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-mcp:latest
          cache-from: type=gha,scope=amjis-mcp
          cache-to: type=gha,mode=max,scope=amjis-mcp

      # ── PARISHODHANA Phase C item 2: deploy-pipeline parity with deploy-web ────
      # --no-traffic stages the new revision at 0% traffic; steps.deploy.outputs.url
      # is the REVISION-specific URL (not the public service URL), so the smoke
      # step below hits the candidate directly before any real user does. Traffic
      # only moves via the explicit "Promote traffic to latest revision" step,
      # and --to-latest there means traffic always tracks the newest revision,
      # never a pinned name (this is the fix for the stale-pin incident class —
      # see 00_ARCHITECTURE/llm_consumption_audit/briefs/samapana/SAMAPANA_REPORT_v1_0.md).
      - name: Deploy MCP to Cloud Run (IAM-gated, least-priv SA)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: amjis-mcp
          region: ${{ env.GCP_REGION }}
          image: asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-mcp:${{ github.sha }}
          # amjis-mcp is publicly invokable (allUsers:roles/run.invoker). The app-level
          # Bearer gate in server.ts is the auth enforcement layer, not Cloud Run IAM.
          # F3 posture correction: --no-allow-unauthenticated was stale; removed.
          # --no-traffic: pre-smoke staging, same pattern as deploy-web's A-S8 step.
          flags: --allow-unauthenticated --service-account=amjis-mcp-runtime@madhav-astrology.iam.gserviceaccount.com --min-instances=1 --concurrency=80 --memory=512Mi --no-traffic
          env_vars: |
            PLATFORM_URL=https://amjis-web-938361928218.asia-south1.run.app
            PYTHON_SIDECAR_URL=https://amjis-sidecar-938361928218.asia-south1.run.app
            # M5: MCP_BASE_URL used for OAuth discovery + callback URL construction.
            # Firebase session verification is delegated to amjis-web (no firebase-admin
            # credentials needed in amjis-mcp — platform does the verifySessionCookie call).
            MCP_BASE_URL=https://madhav.marsys.in/mcp
          secrets: |
            MCP_INTERNAL_TOKEN=mcp-internal-token:1
            PYTHON_SIDECAR_API_KEY=PYTHON_SIDECAR_API_KEY:1
            MCP_CANARY_KEY=mcp-canary-key:latest

      # NOTE on the runner-side fetch below (distinct from the container-side mount
      # above): server.ts never reads MCP_CANARY_KEY as an env var — Bearer keys are
      # validated by call-through to amjis-web's /api/mcp/keys/validate (auth.ts), not
      # against a local secret. The mount above is included for parity/consistency
      # with the deploy-web secrets block only. What the smoke probes below actually
      # need is the PLAINTEXT key value inside the GitHub Actions runner process, to
      # send as a real Authorization: Bearer header against the candidate revision —
      # that requires the *deploying* identity (WIF_SERVICE_ACCOUNT) to itself hold
      # secretmanager.secretAccessor on mcp-canary-key, which, as of this PR, it does
      # NOT have (verified via `gcloud projects get-iam-policy madhav-astrology
      # --flatten="bindings[].members" --filter="bindings.members:github-actions@
      # madhav-astrology.iam.gserviceaccount.com"` — roles/artifactregistry.writer,
      # roles/cloudsql.client, roles/iam.serviceAccountUser, roles/run.developer only).
      # This is the exact structural gap the brief flags: the token exists in Secret
      # Manager, but nothing wired for a pre-traffic MCP canary can currently read it.
      # Native follow-up required before this step will succeed:
      #   gcloud secrets add-iam-policy-binding mcp-canary-key \
      #     --member="serviceAccount:github-actions@madhav-astrology.iam.gserviceaccount.com" \
      #     --role="roles/secretmanager.secretAccessor" \
      #     --project=madhav-astrology
      - name: Fetch MCP canary key for post-deploy smoke
        id: canary_key
        run: |
          KEY=$(gcloud secrets versions access latest --secret="mcp-canary-key" --project=madhav-astrology 2>/tmp/canary_key_err) || {
            echo "::warning::Could not read mcp-canary-key from Secret Manager — see native follow-up note above this step in deploy.yml. Smoke will FAIL LOUD on the auth probes (by design; see mcp_end_to_end_smoke.sh)."
            cat /tmp/canary_key_err || true
            KEY=""
          }
          if [ -n "$KEY" ]; then
            echo "::add-mask::$KEY"
          fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke
        id: smoke
        env:
          SMOKE_MCP_URL: ${{ steps.deploy.outputs.url }}
          MCP_CANARY_KEY: ${{ steps.canary_key.outputs.key }}
        run: |
          bash scripts/operator/mcp_end_to_end_smoke.sh

      - name: Promote traffic to latest revision
        if: success()
        run: |
          gcloud run services update-traffic amjis-mcp \
            --to-latest \
            --region=${{ env.GCP_REGION }} \
            --quiet

      - name: Show deployment URL
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: echo "Deployed to $DEPLOY_URL"
      # ── /PARISHODHANA Phase C item 2 ──
  # ── /4.edge_and_infra_hygiene ──

  # ── Orchestrator Convergence Phase 1: brahma-pipeline job image under CI ──
  # The `brahma-build-pipeline-job` Cloud Run Job image was previously built
  # out-of-band by hand, so the deployed SHA was not reproducible from the repo
  # and silently lacked ga_writers/ (the bug this arc fixes). This job builds +
  # pushes the image from main on every deploy and re-points the Cloud Run Job at
  # the new SHA, so the job image can never again diverge from the code.
  # Context is the repo root (Dockerfile.pipeline COPYs repo-root paths).
  deploy-pipeline-job:
    name: Build & Deploy Pipeline Job Image
    needs: [changes]
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && (needs.changes.outputs.force_all == 'true' || needs.changes.outputs.pipeline == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push pipeline job image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./platform/python-sidecar/Dockerfile.pipeline
          push: true
          tags: |
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/brahma-pipeline:${{ github.sha }}
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/brahma-pipeline:latest
          cache-from: type=gha,scope=brahma-pipeline
          cache-to: type=gha,mode=max,scope=brahma-pipeline

      - name: Re-point Cloud Run Job at the new image
        run: |
          gcloud run jobs update brahma-build-pipeline-job \
            --region=${{ env.GCP_REGION }} \
            --image=asia-south1-docker.pkg.dev/madhav-astrology/amjis/brahma-pipeline:${{ github.sha }} \
            --task-timeout=86400 \
            --memory=8Gi \
            --cpu=4 \
            --update-env-vars=GCP_PROJECT=madhav-astrology,PUBSUB_TOPIC=cockpit-events \
            --quiet

      - name: Verify ga_writers is importable in the pushed image
        run: |
          docker run --rm --entrypoint python \
            asia-south1-docker.pkg.dev/madhav-astrology/amjis/brahma-pipeline:${{ github.sha }} \
            -c "import ga_writers; print('ga_writers OK:', ga_writers.__file__)"
  # ── /Orchestrator Convergence Phase 1 ──
