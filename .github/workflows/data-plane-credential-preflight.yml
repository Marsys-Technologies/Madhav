name: Data-plane Admin Credential Preflight

on:
  workflow_dispatch:

concurrency:
  group: data-plane-admin-credential-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  credential-preflight:
    name: Read-only protected admin credential preflight
    runs-on: ubuntu-latest
    environment: data-plane-production-cutover
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable protected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify source provenance
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/938361928218/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-actions@madhav-astrology.iam.gserviceaccount.com

      - name: Download Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy

      - name: Start isolated validation proxy
        env:
          DATA_PLANE_RESTORE_VALIDATION_CONNECTION_NAME: ${{ secrets.DATA_PLANE_RESTORE_VALIDATION_CONNECTION_NAME }}
        run: |
          ./cloud-sql-proxy --address 127.0.0.1 --port 5433 "$DATA_PLANE_RESTORE_VALIDATION_CONNECTION_NAME" >credential-preflight-proxy.log 2>&1 &
          echo $! > credential-preflight-proxy.pid
          for _ in {1..20}; do
            (echo >"/dev/tcp/127.0.0.1/5433") 2>/dev/null && exit 0
            sleep 1
          done
          echo '::error::Authenticated isolated validation proxy did not become ready.'
          exit 1

      - name: Install diagnostic runtime
        working-directory: platform
        run: npm ci --ignore-scripts

      - name: Diagnose protected administrator connector without writes
        working-directory: platform
        env:
          DATA_PLANE_ADMIN_DATABASE_URL: ${{ secrets.DATA_PLANE_ADMIN_DATABASE_URL }}
          DATA_PLANE_RESTORE_VALIDATION_PROXY_PORT: '5433'
        run: npx tsx scripts/data-plane-admin-credential-diagnostic.ts

      - name: Stop isolated validation proxy
        if: always()
        run: kill "$(cat credential-preflight-proxy.pid)" 2>/dev/null || true
