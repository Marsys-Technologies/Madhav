name: IaC Plan (manual — reviewed plan only)

# PA-06: Terraform is deliberately dispatch-only. This workflow produces plans
# only; the Nirmana monitor uses its separate GCP-native reviewed-release path.
on:
  workflow_dispatch:
    inputs:
      module:
        description: "Which infra module to plan"
        required: true
        default: logging
        type: choice
        options:
          - iam
          - logging
          - scheduler
      action:
        description: "plan only"
        required: true
        default: plan
        type: choice
        options:
          - plan

# Never cancel an infrastructure operation.
concurrency:
  group: ${{ format('module-{0}', github.event.inputs.module) }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Workload Identity Federation

env:
  WIF_PROVIDER: projects/938361928218/locations/global/workloadIdentityPools/github/providers/github-actions
  WIF_PLAN_SERVICE_ACCOUNT: github-actions@madhav-astrology.iam.gserviceaccount.com

jobs:
  plan:
    name: Terraform plan — ${{ github.event.inputs.module }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject retired build-reaper module before authentication
        if: ${{ github.event.inputs.module == 'cloud_scheduler' }}
        run: |
          echo 'The default build-reaper module is retired. Follow the reviewed watchdog operator procedure in platform/scripts/provision_watchdog_scheduler.sh.' >&2
          exit 2

      - name: Reject all applies before authentication
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          echo 'GitHub Actions does not apply Terraform. Use the module-specific GCP-native reviewed-release path.' >&2
          exit 2

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_PLAN_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform plan
        working-directory: infra/${{ github.event.inputs.module }}
        run: bash apply.sh plan
