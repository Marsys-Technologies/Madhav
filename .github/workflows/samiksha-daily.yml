name: Samīkṣā Daily Job (PB-3 L-4)

# ONE consolidated daily job (T-3 binds: "every always-on subsystem is a future 2 a.m.
# debugging problem" — so this is a SINGLE scheduled run doing all three §14.5 things, never
# three cron entries):
#   (a) transition `open` predictions whose window has passed → `window_closed` (via the L-1
#       legal-transition DAL) — these become L-3's Resolve queue;
#   (b) detect `closing_soon` predictions (window_end − 14d) — a derived flag, no state write;
#   (c) dispatch ONE consolidated digest, only when non-empty, per-day idempotent.
#
# ADDITIVE-ONLY: this file is new. It adds no trigger to, and modifies no step of, any existing
# workflow.
#
# TRANSPORT: W-5 log-only stub — no email transport exists in this codebase, so the digest is
# LOGGED (visible in this workflow's run log), never emailed. Wire a real DigestTransport when
# one lands.
#
# SECRET: reads secrets.PROD_DATABASE_URL — the SAME repo secret deploy.yml's migration step
# reads (deploy.yml:203), not a bespoke DATABASE_URL. (SAMĀPTI A5/G2, 2026-07-30: this job
# previously read secrets.DATABASE_URL, a secret that does not exist in this repo, so every
# scheduled run silently no-op'd via the exit-0 branch below and reported GREEN — the exact
# misconfiguration this fix closes.)
#
# SAFETY (REVISED, A5/G2): a missing PROD_DATABASE_URL secret now FAILS the job LOUDLY
# (`exit 1` with a `::error::` annotation) instead of exiting 0. The prior silent-exit-0
# design was the root cause of the secret-name bug going undetected for as long as it did — a
# misconfigured run must never again be able to report green. If this repo genuinely wants the
# daily sweep OFF, disable/unschedule the workflow; do not rely on an absent secret to no-op it.
#
# IDEMPOTENCY CAVEAT (honest): the per-day digest sent-marker (DigestJournal) defaults to a file
# under the runner workspace, which a fresh ephemeral GitHub runner does NOT carry between
# separate invocations. The daily cron fires once/day, so same-day double-send is not a normal
# occurrence; the acceptance-tested guarantee (two runs of one --as-of in a persistent
# environment → exactly one digest) holds wherever the state dir persists. A DB-backed journal
# (a `samiksha_job_runs` table) is the production-grade store — deferred because migrations are
# lane L-1's charge, out of L-4's may_touch grant. See REPORT_PB-3 / daily_job.ts header.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily

# This is a stateful production workflow, not a pure check. A later scheduled run
# may complete rows that an earlier run did not reach, but it cannot reconstruct
# that interrupted run's receipt or digest. Serialize production runs; never cancel
# one in progress.
concurrency:
  group: samiksha-daily-production
  cancel-in-progress: false

jobs:
  samiksha-daily:
    name: Samīkṣā consolidated daily run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: platform
    # MERGE-RESOLUTION NOTE (2026-07-31). Merging main into this branch auto-combined two
    # changes into something strictly WORSE than either parent, with no conflict marker.
    # Recorded because the silent-combination failure mode is the point:
    #
    #   from main (#964): job-level `env: DATABASE_URL: ${{ secrets.DATABASE_URL }}` plus
    #     `if: env.DATABASE_URL != ''` on every step, to hoist the check ahead of npm ci.
    #   from this branch (A5/G2): the real fix — read secrets.PROD_DATABASE_URL and exit 1
    #     with a ::error:: annotation when it is missing.
    #
    #   COMBINED: the job-level env still read the NONEXISTENT secrets.DATABASE_URL, so
    #   env.DATABASE_URL was always empty, so EVERY step's `if:` was false — including the
    #   fail-loud step. The job would have reported SUCCESS with every step skipped, which
    #   is exactly the silent no-op this branch exists to eliminate, reintroduced by the
    #   merge that was supposed to preserve it.
    #
    # RESOLVED by keeping both intents and dropping the mechanism that broke them: the
    # step-scoped preflight reads PROD_DATABASE_URL (this branch's fix), and the preflight
    # FAILS rather than merely logging (this branch's semantics). That makes the per-step `if:`
    # guards unnecessary — a failed preflight stops the job before cloud auth, setup, or npm ci,
    # which retains #964's cost-saving intent without over-scoping the secret.
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — PROD_DATABASE_URL must be configured (fails before any setup cost)
        working-directory: ${{ github.workspace }}
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::[samiksha-daily] PROD_DATABASE_URL secret not configured — failing loudly (A5/G2: a misconfigured run must never report green)."
            echo "[samiksha-daily] Set the PROD_DATABASE_URL repo secret (the same secret deploy.yml's migration step reads) to enable the daily sweep."
            exit 1
          fi
          echo "[samiksha-daily] PROD_DATABASE_URL is configured; proceeding."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/938361928218/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-actions@madhav-astrology.iam.gserviceaccount.com

      - name: Start Cloud SQL Auth Proxy
        working-directory: ${{ github.workspace }}
        run: |
          curl -fsSL \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.10.1/cloud-sql-proxy.linux.amd64" \
            -o cloud-sql-proxy && chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 \
            madhav-astrology:asia-south1:amjis-postgres >cloud-sql-proxy.log 2>&1 &
          proxy_pid=$!
          for _ in {1..20}; do
            if kill -0 "$proxy_pid" 2>/dev/null && (echo >/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "[samiksha-daily] Cloud SQL Auth Proxy is ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::[samiksha-daily] Cloud SQL Auth Proxy did not become ready."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci

      - name: Run the consolidated daily job (log-only digest — W-5 stub)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "[samiksha-daily] npx tsx --conditions=react-server scripts/samiksha/daily_job.ts"
          npx tsx --conditions=react-server scripts/samiksha/daily_job.ts
