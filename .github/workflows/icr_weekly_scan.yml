name: ICR Weekly Conflict Scan

on:
  schedule:
    - cron: '0 2 * * 0'   # Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no PROPOSED/ writes)'
        type: boolean
        default: true

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes. Pure check workflow — safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  icr-scan:
    name: Weekly ICR Conflict Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Run ICR detector (scheduled_job_smoke)
        run: |
          npx tsx scripts/governance/icr_pr_gate.ts --dry-run --synthetic
          echo "scheduled_job_smoke: PASS"
