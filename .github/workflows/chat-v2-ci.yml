name: Chat V2 — Workstream CI

# Chat V2 workstream CI. Stages 1/2/3 (lint+typecheck+unit, component+integration,
# E2E chromium) are HARD gates; 5/6/7 follow.
#
# CI efficiency audit (2026-07-31) removed Stages 4, 10, 11, 12, 13, 14 and 15.
# They were not "not yet activated" — they were unreachable:
#   - Stages 4/10/11/12/14 gated on PR labels `beta`, `pre-merge`, `mobile-active`.
#     None of those labels exists in this repo (`gh label list`) and none has ever
#     been applied to a PR, so no run of these stages has ever occurred.
#   - Stage 13 (Stryker mutation) ran only on the weekly cron, where it echoed a
#     no-op because stryker.conf.json was never created and stryker is not a
#     dependency in platform/package.json.
#   - Stage 15 was `if: ${{ false }}`.
# The old weekly `schedule:` went with them — it existed solely for Stage 13. The
# nightly cron below is a NEW trigger, for Stage 7 (see that job's comment).
# Re-add any removed stage as a real gate when the work item lands; do not restore
# the label-gated scaffolding.
#
# (Stages 8 and 9 were removed earlier, also as echo-only no-ops.)

on:
  schedule:
    # 02:00 UTC nightly — Stage 7 (performance) only; every other stage is
    # pull_request-scoped and no-ops on this event.
    - cron: '0 2 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'platform/src/components/consume/**'
      - 'platform/src/components/chat/**'
      - 'platform/src/app/api/chat/**'
      - 'platform/src/lib/adapters/**'
      - 'platform/src/lib/synthesis/**'
      - 'platform/src/lib/streams/**'
      - 'platform/src/lib/persistence/**'
      - 'platform/src/lib/ppl/**'
      - 'platform/src/lib/citations/**'
      # Absorbed from the deleted chat-v2-smoke.yml (CI efficiency audit 2026-07-31)
      # so its trigger coverage is not lost. The other paths it watched were already
      # covered by the wildcards above; these three were not.
      - 'platform/src/components/chat-v2/**'
      - 'platform/src/lib/providers/**'
      - 'platform/src/lib/retrieve/**'
      - 'platform/tests/e2e/chat-v2/**'
      - 'platform/tests/unit/chat-v2/**'
      - 'platform/tests/components/chat-v2/**'
      - 'platform/tests/integration/chat-v2/**'
      - 'platform/tests/fixtures/chat-v2/**'
      - '.github/workflows/chat-v2-ci.yml'

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes. Pure check workflow — safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

defaults:
  run:
    working-directory: platform

# ─────────────────────────────────────────────────────────────────────────────
# Stage 1 — Lint + typecheck + unit tests
# Gate: HARD from α0
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  stage-1-lint-typecheck-unit:
    name: 'Stage 1 — Lint + Typecheck + Unit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      # SAMĀPTI B-N8-CI-GATES / finding F-30 (2026-07-30). Reconciled against the concurrent
      # 2026-07-31 CI-efficiency-audit's independent arrival at "continue-on-error is wrong here"
      # (same diagnosis, weaker remedy — see PŪRṆATĀ Step 4). This ratchet is kept over that
      # continue-on-error version: it can genuinely fail on a NEW error, which continue-on-error
      # structurally cannot, ever — the §N.8 Earned-Signal distinction this whole arc exists to
      # enforce. Lower ESLINT_ERROR_BASELINE as the pre-existing 26-error debt is paid.
      # This step previously ended in:
      #     --max-warnings 0 2>/dev/null \
      #     || echo "STAGE-1-LINT no-op (paths not fully populated yet)"
      # Both halves were wrong. The `2>/dev/null || echo` swallowed every ESLint
      # failure, and the message it printed instead was false: all ten paths are
      # populated (185 files at the time of writing), and ESLint reports 26 ERRORS
      # plus 93 warnings across them. The swallow was load-bearing, not defensive —
      # it was the only thing keeping this stage green.
      #
      # Un-swallowing outright would redden the chat-v2 workstream on 26 errors that
      # belong to another arc and are not this lane's to fix. So this is a RATCHET,
      # the same shape as ci.yml's governance baselines: the existing debt is pinned
      # and disclosed, and any NEW error fails the stage. Lower the baseline as the
      # debt is paid; raising it should require a recorded decision.
      - name: ESLint (chat-v2 paths)
        env:
          ESLINT_ERROR_BASELINE: '26'   # measured 2026-07-30 on origin/main. Lower freely.
        run: |
          set +e
          npx eslint \
            src/components/consume \
            src/components/chat \
            src/app/api/chat \
            src/lib/adapters \
            src/lib/synthesis \
            src/lib/streams \
            src/lib/persistence \
            src/lib/ppl \
            src/lib/citations \
            src/lib/fixtures \
            > eslint_chatv2.out 2>&1
          ec=$?
          set -e
          cat eslint_chatv2.out
          errs=$(grep -oE '\([0-9]+ errors' eslint_chatv2.out | tail -1 | grep -oE '[0-9]+' || true)
          if [ -z "$errs" ]; then
            if [ "$ec" -eq 0 ]; then
              errs=0
            else
              echo "::error::ESLint exited $ec but its summary line could not be parsed. Refusing to pass a gate whose result could not be read."
              exit 1
            fi
          fi
          echo "ESLint errors on chat-v2 paths: $errs (baseline ceiling ${ESLINT_ERROR_BASELINE})"
          if [ "$errs" -gt "${ESLINT_ERROR_BASELINE}" ]; then
            echo "::error::ESLint errors ${errs} exceed the ${ESLINT_ERROR_BASELINE} baseline — a NEW lint error landed on the chat-v2 paths."
            exit 1
          fi

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit tests — chat-v2
        run: npx vitest run tests/unit/chat-v2

# ─────────────────────────────────────────────────────────────────────────────
# Stage 2 — Component + integration tests
# Gate: HARD from α1
# ─────────────────────────────────────────────────────────────────────────────
  stage-2-component-integration:
    name: 'Stage 2 — Component + Integration'
    runs-on: ubuntu-latest
    needs: stage-1-lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Component tests — chat-v2
        run: |
          if find tests/components/chat-v2 -name "*.test.tsx" 2>/dev/null | grep -q .; then
            npx vitest run tests/components/chat-v2
          else
            echo "STAGE-2-COMPONENT no-op (no component tests yet — populates at α7+)"
          fi

      - name: Integration tests — chat-v2
        run: |
          if find tests/integration/chat-v2 -name "*.test.ts" 2>/dev/null | grep -q .; then
            npx vitest run tests/integration/chat-v2
          else
            echo "STAGE-2-INTEGRATION no-op (no integration tests yet — populates at α3+)"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Stage 3 — E2E Chromium
# Gate: HARD from α0 (spike test)
# ─────────────────────────────────────────────────────────────────────────────
  stage-3-e2e-chromium:
    name: 'Stage 3 — E2E (Chromium)'
    runs-on: ubuntu-latest
    needs: stage-1-lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests — chat-v2 (Chromium)
        run: npx playwright test tests/e2e/chat-v2 --config=tests/e2e/chat-v2/playwright.config.ts --project=chromium --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'
          # Firebase vars required for Next.js dev server startup (webServer in playwright.config.ts)
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# Stage 6 — Accessibility (axe-core)
# Gate: HARD, nightly/on-demand. NOT on the PR path — the harness is currently
#       BROKEN in CI; see the job comment. Expect this to be RED until fixed.
# ─────────────────────────────────────────────────────────────────────────────
  stage-6-a11y:
    name: 'Stage 6 — Accessibility (axe-core) [nightly]'
    runs-on: ubuntu-latest
    # ⚠️ THIS STAGE HAS NEVER PASSED IN CI. It fails with
    #     `Error: Timed out waiting 120000ms from config.webServer.`
    # i.e. the Playwright dev server never boots, so axe-core never runs at all.
    # `continue-on-error: true` hid that completely: it spent 190s on every chat-v2
    # PR reporting green while asserting nothing.
    #
    # CAUTION FOR ANYONE AUDITING THIS AGAIN — the GitHub API reports
    # `steps[].conclusion == "success"` for a continue-on-error step EVEN WHEN the
    # command exited 1. The audit that produced this comment initially concluded
    # "Stage 6 passes today" from that field and was wrong; only the job LOG shows
    # `Process completed with exit code 1`. Read the log, not the conclusion field.
    #
    # Stage 3 boots the same webServer successfully in the same workflow, so this is
    # specific to these jobs, not a global harness break — most likely resource
    # contention from several dev servers starting at once, or a config difference.
    #
    # Resolution: taken off the PR path (saves 190s/PR of pure noise) and made a
    # HARD nightly gate, so the breakage is visible and pressures a fix instead of
    # being swallowed. TO CLOSE: fix the webServer boot, confirm axe actually runs
    # green, then move back onto pull_request.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: a11y — axe-core audit
        run: npx playwright test tests/e2e/chat-v2/a11y/axe.spec.ts --config=tests/e2e/chat-v2/playwright.config.ts --project=chromium --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'

# ─────────────────────────────────────────────────────────────────────────────
# Stage 7 — Performance (streaming metrics + Web Vitals budgets)
# Gate: HARD, but nightly/on-demand rather than per-PR (CI efficiency audit,
#       2026-07-31). See the job comment for why it moved off the PR path.
# ─────────────────────────────────────────────────────────────────────────────
  stage-7-perf:
    name: 'Stage 7 — Performance [nightly]'
    runs-on: ubuntu-latest
    # ⚠️ LIKE STAGE 6, THIS HAS NEVER PASSED IN CI. The baseline run's log shows FOUR
    # `Timed out waiting 120000ms from config.webServer` errors across its two steps —
    # the dev server never boots, so neither the streaming nor the Web Vitals spec
    # actually executes. `continue-on-error: true` on both steps hid it entirely,
    # making this the single most expensive job in the workflow (313s per chat-v2 PR)
    # while asserting nothing at all.
    #
    # See the Stage 6 comment for the API-reports-success-for-continue-on-error trap
    # that made this look green to a first pass.
    #
    # Resolution: off the PR path, HARD nightly, so the breakage is visible instead of
    # swallowed. Note that perf assertions on shared runners are ALSO a genuine flake
    # source independent of this — so even once the webServer boot is fixed, prefer
    # keeping this nightly rather than per-PR. TO CLOSE: fix the boot, confirm both
    # specs actually run, then decide about promotion.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Streaming perf tests
        run: npx playwright test tests/e2e/chat-v2/perf/streaming.spec.ts --config=tests/e2e/chat-v2/playwright.config.ts --project=chromium --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'

      - name: Web Vitals budget assertions
        run: npx playwright test tests/e2e/chat-v2/perf/web-vitals.spec.ts --config=tests/e2e/chat-v2/playwright.config.ts --project=chromium --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'
