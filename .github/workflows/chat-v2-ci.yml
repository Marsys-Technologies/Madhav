name: Chat V2 — Workstream CI

# Runs on the chat-v2 workstream branch only.
# 13 active stages (Stages 8 and 9 removed as echo-only no-ops).
# Stages added incrementally as work items add real tests.
# No-op stages succeed until their work item activates them.

on:
  schedule:
    - cron: '0 3 * * 0'   # Sunday 03:00 UTC — weekly scheduled run (Stage 13 mutation)
  pull_request:
    branches:
      - main
    paths:
      - 'platform/src/components/consume/**'
      - 'platform/src/components/chat/**'
      - 'platform/src/app/api/chat/**'
      - 'platform/src/lib/adapters/**'
      - 'platform/src/lib/synthesis/**'
      - 'platform/src/lib/streams/**'
      - 'platform/src/lib/persistence/**'
      - 'platform/src/lib/ppl/**'
      - 'platform/src/lib/citations/**'
      - 'platform/tests/e2e/chat-v2/**'
      - 'platform/tests/unit/chat-v2/**'
      - 'platform/tests/components/chat-v2/**'
      - 'platform/tests/integration/chat-v2/**'
      - 'platform/tests/fixtures/chat-v2/**'
      - '.github/workflows/chat-v2-ci.yml'

# CI efficiency audit (2026-07-31): no workflow in this repo had a concurrency
# group, so every push to a PR branch stacked a full new set of runs while the
# superseded ones kept burning runner minutes. Pure check workflow — safe to cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

defaults:
  run:
    working-directory: platform

# ─────────────────────────────────────────────────────────────────────────────
# Stage 1 — Lint + typecheck + unit tests
# Gate: HARD from α0
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  stage-1-lint-typecheck-unit:
    name: 'Stage 1 — Lint + Typecheck + Unit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint (chat-v2 paths)
        run: |
          npx eslint \
            src/components/consume \
            src/components/chat \
            src/app/api/chat \
            src/lib/adapters \
            src/lib/synthesis \
            src/lib/streams \
            src/lib/persistence \
            src/lib/ppl \
            src/lib/citations \
            src/lib/fixtures \
            --max-warnings 0 2>/dev/null \
            || echo "STAGE-1-LINT no-op (paths not fully populated yet)"

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

      - name: Unit tests — chat-v2
        run: npx vitest run tests/unit/chat-v2

# ─────────────────────────────────────────────────────────────────────────────
# Stage 2 — Component + integration tests
# Gate: HARD from α1
# ─────────────────────────────────────────────────────────────────────────────
  stage-2-component-integration:
    name: 'Stage 2 — Component + Integration'
    runs-on: ubuntu-latest
    needs: stage-1-lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Component tests — chat-v2
        run: |
          if find tests/components/chat-v2 -name "*.test.tsx" 2>/dev/null | grep -q .; then
            npx vitest run tests/components/chat-v2
          else
            echo "STAGE-2-COMPONENT no-op (no component tests yet — populates at α7+)"
          fi

      - name: Integration tests — chat-v2
        run: |
          if find tests/integration/chat-v2 -name "*.test.ts" 2>/dev/null | grep -q .; then
            npx vitest run tests/integration/chat-v2
          else
            echo "STAGE-2-INTEGRATION no-op (no integration tests yet — populates at α3+)"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Stage 3 — E2E Chromium
# Gate: HARD from α0 (spike test)
# ─────────────────────────────────────────────────────────────────────────────
  stage-3-e2e-chromium:
    name: 'Stage 3 — E2E (Chromium)'
    runs-on: ubuntu-latest
    needs: stage-1-lint-typecheck-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests — chat-v2 (Chromium)
        run: npx playwright test tests/e2e/chat-v2 --config=tests/e2e/chat-v2/playwright.config.ts --project=chromium --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'
          # Firebase vars required for Next.js dev server startup (webServer in playwright.config.ts)
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# Stage 4 — E2E Firefox + WebKit
# Gate: HARD from β
# ─────────────────────────────────────────────────────────────────────────────
  stage-4-e2e-firefox-webkit:
    name: 'Stage 4 — E2E (Firefox + WebKit)'
    runs-on: ubuntu-latest
    needs: stage-3-e2e-chromium
    # Activates when β label is present on PR (TODO: remove condition at β start)
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'beta') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install firefox webkit --with-deps

      - name: E2E tests — chat-v2 (Firefox)
        run: npx playwright test tests/e2e/chat-v2 --project=firefox --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'

      - name: E2E tests — chat-v2 (WebKit)
        run: npx playwright test tests/e2e/chat-v2 --project=webkit --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'

# ─────────────────────────────────────────────────────────────────────────────
# Stage 5 — Visual regression
# Gate: HARD from α1
# ─────────────────────────────────────────────────────────────────────────────
  stage-5-visual-regression:
    name: 'Stage 5 — Visual Regression'
    runs-on: ubuntu-latest
    needs: stage-3-e2e-chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Visual regression — chat-v2
        run: npx playwright test --config=tests/e2e/chat-v2/playwright.config.ts --grep "@visual" --project=chromium --reporter=github || echo "STAGE-5-VISUAL no visual specs yet (baselines added incrementally per work item)"
        env:
          MARSYS_FIXTURE_MODE: 'true'

# ─────────────────────────────────────────────────────────────────────────────
# Stage 6 — Accessibility (axe-core)
# Gate: HARD from γ8; SOFT before that
# ─────────────────────────────────────────────────────────────────────────────
  stage-6-a11y:
    name: 'Stage 6 — Accessibility (axe-core)'
    runs-on: ubuntu-latest
    needs: stage-3-e2e-chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: a11y — axe-core audit
        # SOFT gate (continue-on-error) until γ8 flips it HARD
        continue-on-error: true
        run: npx playwright test tests/e2e/chat-v2/a11y/axe.spec.ts --config=tests/e2e/chat-v2/playwright.config.ts --project=chromium --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'

# ─────────────────────────────────────────────────────────────────────────────
# Stage 7 — Performance (Lighthouse CI + streaming metrics)
# Gate: SOFT (warn) until γ; HARD at γ
# ─────────────────────────────────────────────────────────────────────────────
  stage-7-perf:
    name: 'Stage 7 — Performance'
    runs-on: ubuntu-latest
    needs: stage-3-e2e-chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Streaming perf tests
        # SOFT gate until γ activates hard gating
        continue-on-error: true
        run: npx playwright test tests/e2e/chat-v2/perf/streaming.spec.ts --config=tests/e2e/chat-v2/playwright.config.ts --project=chromium --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'

      - name: Web Vitals budget assertions
        continue-on-error: true
        run: npx playwright test tests/e2e/chat-v2/perf/web-vitals.spec.ts --config=tests/e2e/chat-v2/playwright.config.ts --project=chromium --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'

# ─────────────────────────────────────────────────────────────────────────────
# Stage 10 — Chaos / fault injection
# Gate: HARD pre-merge (PM1)
# ─────────────────────────────────────────────────────────────────────────────
  stage-10-chaos:
    name: 'Stage 10 — Chaos / Fault Injection [pre-merge]'
    runs-on: ubuntu-latest
    needs: stage-2-component-integration
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pre-merge') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Chaos tests — chat-v2
        continue-on-error: true
        run: |
          if [ -d "tests/integration/chat-v2/chaos" ] && \
             find tests/integration/chat-v2/chaos -name "*.test.ts" | grep -q .; then
            npx vitest run tests/integration/chat-v2/chaos
          else
            echo "STAGE-10-CHAOS no-op (no chaos tests until beta/PM1)"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Stage 11 — Security tests
# Gate: HARD pre-merge (PM1)
# ─────────────────────────────────────────────────────────────────────────────
  stage-11-security:
    name: 'Stage 11 — Security [pre-merge]'
    runs-on: ubuntu-latest
    needs: stage-3-e2e-chromium
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pre-merge') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Security tests — chat-v2
        run: |
          if [ -d "tests/e2e/chat-v2/security" ] && \
             find tests/e2e/chat-v2/security -name "*.spec.ts" | grep -q .; then
            npx playwright test tests/e2e/chat-v2/security --project=chromium --reporter=github
          else
            echo "STAGE-11-SECURITY no-op (no security specs until beta5/PM1)"
          fi
        env:
          MARSYS_FIXTURE_MODE: 'true'

# ─────────────────────────────────────────────────────────────────────────────
# Stage 12 — Mobile Playwright profiles
# Gate: HARD from γ9
# ─────────────────────────────────────────────────────────────────────────────
  stage-12-mobile:
    name: 'Stage 12 — Mobile (Playwright)'
    runs-on: ubuntu-latest
    needs: stage-3-e2e-chromium
    # Activates when gamma9 mobile label is present (TODO: remove condition at gamma9)
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'mobile-active') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install webkit chromium --with-deps

      - name: Mobile tests — 375px iPhone SE
        run: npx playwright test tests/e2e/chat-v2/mobile --project='Mobile Safari 375' --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'

      - name: Mobile tests — 768px iPad
        run: npx playwright test tests/e2e/chat-v2/mobile --project='iPad Safari 768' --reporter=github
        env:
          MARSYS_FIXTURE_MODE: 'true'

# ─────────────────────────────────────────────────────────────────────────────
# Stage 13 — Mutation tests (Stryker)
# Gate: SOFT weekly; HARD pre-merge (PM2)
# ─────────────────────────────────────────────────────────────────────────────
  stage-13-mutation:
    name: 'Stage 13 — Mutation (Stryker) [weekly/pre-merge]'
    runs-on: ubuntu-latest
    needs: stage-2-component-integration
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'pre-merge')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Mutation tests (Stryker)
        continue-on-error: true
        run: |
          if [ -f "stryker.conf.json" ]; then
            npx stryker run
          else
            echo "STAGE-13-MUTATION no-op (stryker.conf.json not yet created until PM1)"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Stage 14 — Cross-browser smoke (staging deploy)
# Gate: HARD pre-merge (PM2)
# ─────────────────────────────────────────────────────────────────────────────
  stage-14-staging-smoke:
    name: 'Stage 14 — Cross-browser Smoke (staging) [pre-merge]'
    runs-on: ubuntu-latest
    needs:
      - stage-3-e2e-chromium
      - stage-2-component-integration
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'pre-merge') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Staging smoke (placeholder)
        continue-on-error: true
        run: |
          echo "STAGE-14-STAGING no-op (staging URL configured at PM2)"

# ─────────────────────────────────────────────────────────────────────────────
# Stage 15 — Synthetic monitoring (post-merge, continuous)
# Gate: Alerts only — not a PR gate
# NOTE: Runs via Cloud Scheduler + Observatory post-merge (see CLAUDECODE_BRIEF §M item 5)
# ─────────────────────────────────────────────────────────────────────────────
  stage-15-synthetic-monitoring-noop:
    name: 'Stage 15 — Synthetic Monitoring [post-merge via Cloud Scheduler]'
    runs-on: ubuntu-latest
    needs: stage-1-lint-typecheck-unit
    if: ${{ false }}
    steps:
      - name: No-op placeholder
        run: |
          echo "Stage 15 is post-merge synthetic monitoring via Cloud Scheduler + Observatory."
