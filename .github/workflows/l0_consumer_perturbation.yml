name: L0 Consumer-Perturbation Harness (W-L0-7)

# NIRMANA L0 Brahmagyan execution lane, packet W-L0-7
# (00_ARCHITECTURE/briefs/nirmana/L0_W_L0_7_PACKET_REPORT_v1_0.md v1.6).
#
# Runs the first-ever decorated-path consumer-perturbation rehearsal: builds
# the state-A fixture (platform/scripts/l0harness/build_fixture.py — 27-table
# production-probed schema, committed reference extracts, migrations
# 1121/1122/1123 applied verbatim, 1120 disclosed-skipped, 1124 never
# applied), then executes the frozen 9-step sequence
# (platform/scripts/l0harness/run_readings.py) and asserts the pinned verdict
# state (platform/scripts/l0harness/ci_expect.py).
#
# HERMETIC BY DESIGN — two deliberate departures from the fresh_chart_smoke
# vehicle this job is modelled on (.github/workflows/fresh_chart_smoke.yml):
#   1. NO cloud-sql-proxy / production pg_dump. The fixture is fully
#      self-contained from committed extracts (scripts/l0harness/
#      production_schema/*.json, production_seed/*.jsonl — MCP-probed from
#      production 2026-09-26, seed_manifest.json pinned). Production schema
#      drift after that date is invisible to this job BY CONSTRUCTION; the
#      state pin is declared in the packet report, and refreshing the
#      extracts is a deliberate human act, not a CI side effect.
#   2. NO `npx tsx scripts/migrate.ts`. The harness's whole point is state A:
#      this branch carries migrations 1120–1124, and migrate.ts would apply
#      them, destroying the pre-patch state the verdicts are pinned against
#      (1124 in particular must never apply — report v1.2/v1.5). The builder
#      applies 1121/1122/1123 itself, verbatim, under the 1123 patch-apply
#      oracle.
#
# NOT wired to push/pull_request: the expected state today is 2 PASS /
# 3 UNMEASURED behind four named producer-path findings (F-W-L0-7-9/-5/-8/-7,
# handed to the L1/L2 data-plane plan unfixed). Gating PRs on a harness whose
# verdicts are pinned UNMEASURED would be noise; the value here is detecting
# DIVERGENCE from the pin (either direction — ci_expect.py fails on a PASS
# turning FAIL and on an UNMEASURED silently becoming measured). Weekly
# schedule plus workflow_dispatch for on-demand verification.
#
# CI-only accommodation, disclosed: the pg15 service image password-protects
# every role, and the decorated path requires session_user =
# data_plane_builder (1035:578-580 / 1036:805-807 / 1036:941-943 — SET ROLE
# does not satisfy it), so the job sets a throwaway password on that role
# after the fixture build creates it. The local rehearsal uses trust auth and
# needs no such step. This is an environment accommodation, not a schema or
# grant change.

on:
  schedule:
    # Friday 04:00 UTC — offset from fresh_chart_smoke.yml (Wed 03:00) and
    # icr_weekly_scan.yml (Sun) so the expensive jobs don't compete.
    - cron: '0 4 * * 5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  l0-consumer-perturbation:
    name: W-L0-7 decorated-path rehearsal (state-A fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    services:
      postgres:
        # pgvector image: classical_text_chunks.embedding is vector(768)
        # (fixture_schema.py:52). pg15 matches the production major the
        # extracts were probed from.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      L0H_PGHOST: 127.0.0.1
      L0H_PGPORT: 5432
      L0H_PGSUPERUSER: postgres
      L0H_FIXTURE_DB: madhav_l0w7_fixture
      PGPASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install platform deps (tsx serve bridge — read_serve.ts)
        working-directory: platform
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python sidecar deps (decorated writer path)
        run: pip install -r platform/python-sidecar/requirements.txt --quiet

      - name: Build the state-A fixture
        working-directory: platform
        run: python3 scripts/l0harness/build_fixture.py

      - name: CI-only accommodation — throwaway password for data_plane_builder
        # The decorated producer path checks session_user (see header). The
        # role exists now (fixture build created it); run_readings.py's
        # step-0 rebuild drops/recreates the DATABASE, not cluster roles, so
        # this survives it.
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE data_plane_builder WITH LOGIN PASSWORD 'postgres';"

      - name: Run the frozen 9-step readings sequence
        working-directory: platform
        run: python3 scripts/l0harness/run_readings.py

      - name: Assert the pinned verdict state
        working-directory: platform
        run: python3 scripts/l0harness/ci_expect.py

      - name: Upload verdict artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l0w7-reading-verdicts
          path: |
            platform/scripts/l0harness/reading_verdicts.json
          retention-days: 90
