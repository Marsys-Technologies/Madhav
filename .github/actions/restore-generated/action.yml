name: Restore source-bound generated files
description: Restore the exact deterministic overlay checked by CI; verify source SHA and bytes.
inputs:
  run-id:
    description: CI workflow run id (empty for this run)
    required: false
    default: ''
  sha:
    description: Reviewed source SHA (empty means checked-out HEAD)
    required: false
    default: ''
  regenerate:
    description: Regenerate and verify from source without the artifact service (emergency dispatch only)
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      if: ${{ inputs.regenerate != 'true' }}
      with:
        name: ci-generated
        path: .
        run-id: ${{ inputs.run-id || github.run_id }}
        github-token: ${{ github.token }}
    - shell: bash
      if: ${{ inputs.regenerate != 'true' }}
      env:
        EXPECTED_SHA: ${{ inputs.sha }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: |
        args=()
        if [ -n "$EXPECTED_SHA" ]; then args+=(--sha "$EXPECTED_SHA"); fi
        python3 platform/scripts/governance/ci_generated.py verify "${args[@]}"
    - uses: actions/setup-node@v4
      if: ${{ inputs.regenerate == 'true' }}
      with:
        node-version: '20'
    - uses: actions/setup-python@v5
      if: ${{ inputs.regenerate == 'true' }}
      with:
        python-version: '3.11'
    - shell: bash
      if: ${{ inputs.regenerate == 'true' }}
      run: |
        npm ci --prefix platform
        python3 -m pip install -r platform/python-sidecar/requirements-ci.txt --quiet
    - shell: bash
      if: ${{ inputs.regenerate == 'true' }}
      env:
        EXPECTED_SHA: ${{ inputs.sha }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: |
        python3 platform/scripts/governance/ci_generated.py generate --destination "$RUNNER_TEMP/ci-generated-emergency"
        python3 platform/scripts/governance/ci_generated.py verify --manifest "$RUNNER_TEMP/ci-generated-emergency/ci-generated-manifest.json" --sha "$EXPECTED_SHA"
