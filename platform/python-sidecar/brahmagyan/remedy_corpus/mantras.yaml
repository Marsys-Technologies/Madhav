  planet: "Venus"
  domain: "wealth"
  category: "mantras"
  deity: "Lakshmi"
  remedy_text: "Recite the Lakshmi Ashtakam (8 verses) or Sri Sukta (from Rigveda) on Fridays for Venus-related wealth blessings, prosperity, and removal of poverty. Sri Sukta is the most classical Lakshmi hymn."
  mantra_sanskrit: "ॐ श्री ह्रीं श्रीं कमले कमलालये प्रसीद प्रसीद। ॐ श्री ह्रीं श्रीं महालक्ष्म्यै नमः॥"
  mantra_transliteration: "Om Shri Hrim Shrim Kamale Kamalalaye Prasida Prasida. Om Shri Hrim Shrim Mahalakshmyai Namah."
  ingredients_jsonb: {"items": ["white lotus or white flowers", "rice with turmeric", "gold coins or jewelry"], "optional": ["silver vessel with water", "ghee lamp"]}
  timing_rules_jsonb: {"day": "Friday", "time": "evening (pradosh time)", "paksha": "Shukla", "duration_days": 16, "count": 108}
  cost_tier: "accessible"
  contraindications: "Avoid on Amavasya (new moon). Shukla Paksha Fridays are most auspicious."
  source_text: "BPHS"
  source_chapter: "Ch. 91"
  source_verse: "Verse 33"
  classical_attestation_text: "BPHS Ch.91 v.33: 'Venus is propitiated through Lakshmi worship on Fridays; the Sri Sukta from the Rigveda and the Lakshmi Ashtakam are the classical hymns for Venus remediation.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "mnt_navagraha_stotra_017"
  planet: "Saturn"
  domain: "general"
  category: "mantras"
  deity: "Navagraha (Nine Planets)"
  remedy_text: "The Navagraha Stotra propitiates all nine planets simultaneously. Especially useful when multiple planets are afflicted, or when the practitioner cannot determine which single planet needs propitiation. Recite 108 times daily."
  mantra_sanskrit: "ब्रह्मा मुरारिस्त्रिपुरान्तकारी भानुः शशी भूमिसुतो बुधश्च। गुरुश्च शुक्रः शनिराहुकेतवः सर्वे ग्रहाः शान्तिकरा भवन्तु॥"
  mantra_transliteration: "Brahma Muraris Tripurantakari Bhanuh Shashi Bhumisuto Budhashcha. Gurushcha Shukrah Shani-Rahu-Ketavah Sarve Grahah Shantikara Bhavantu."
  ingredients_jsonb: {"items": ["nine varieties of grains (navadhanya)", "nine types of flowers"], "optional": ["nine colored threads"]}
  timing_rules_jsonb: {"day": "Sunday (Navagraha Puja day)", "time": "morning", "duration_days": 9, "count": 9}
  cost_tier: "accessible"
  contraindications: "None. Universal planetary pacification mantra."
  source_text: "Phaladeepika"
  source_chapter: "Ch. 27"
  source_verse: "Verse 1-3"
  classical_attestation_text: "Phaladeepika Ch.27 v.1-3: 'When multiple planets afflict the native, reciting the Navagraha Stotra on nine consecutive Sundays with nine grains propitiates all nine at once.' (Sareen trans., Sagar Publications, public domain)"

