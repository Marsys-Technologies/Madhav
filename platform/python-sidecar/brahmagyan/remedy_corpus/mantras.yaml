# Stream F — Mantra Remedies
# Sources: the navagraha bīja rows cite the Navagraha bīja tradition (Mantra Mahodadhi,
#          Mahīdhara, 16th c.); the stotra/nāma rows cite BPHS Ch. 91-94 (Upayas),
#          Phaladeepika Ch. 27, Saravali.
# Encoding: hand-curated from classical public-domain translations
# ZERO LLM — deterministic authoring only
#
# ── PARIŚEṢA-V4 F-178 (owner rulings R-1 / R-2, OWNER_RULINGS_20260821.md) ────────────
# Two defect classes were corrected in this file; both are guarded by
# tests/l0/test_f178_f180_mantra_transliteration_and_citation.py.
#
# R-2 — the 9 `*_beeja_*` rows attributed the `prāṃ prīṃ prauṃ saḥ` bīja class to BPHS
#       and carried a VERBATIM quotation ("BPHS Ch.91 v.NN: '...'") as
#       `classical_attestation_text`. That class is tantric/āgamic, transmitted through
#       compilations such as Mantra Mahodadhi — not BPHS — so the quotation was asserting
#       text that is not in the cited work. Reattributed; the quotation is REMOVED, not
#       replaced with an invented one from another edition (CLAUDE.md §N.7 item 6 — an
#       honest null beats a plausible-sounding substitute; owner ruling R-4 — "any row
#       whose attestation cannot be quoted stays null").
#
# R-1 — `mantra_transliteration` must transliterate this row's own `mantra_sanskrit`.
#       Corrected: Guruve→Gurave (गुरवे), Bhram/Bhroum→Bhraam/Bhraum (भ्रां/भ्रौं),
#       Sram→Sraam (स्रां), Bhuta-Krit→Bhuta-Krid (भूतकृद्), Shanir Ahukethavah→
#       Shani-Rahu-Ketavah (शनिराहुकेतवः), Shantikarah→Shantikara (शान्तिकरा).
#
# Column-contract note: owner ruling R-4 adopts `mantra_transliteration` = IAST. That
# contract is NOT applied in this file, deliberately — `l0_remedy_loader.py` maps this
# column to the DB's `mantra_text` (the recitation-ready japa form), so switching it to
# IAST here would replace the served japa string. Migrating this file to R-4 needs a
# loader change and is out of F-178's scope; the romanisation kept here is the corpus's
# own convention, made internally coherent with each row's Devanagari.

