- remedy_id: "mnt_sun_aditya_hridayam_002"
  planet: "Sun"
  domain: "spirituality"
  category: "mantras"
  deity: "Surya"
  remedy_text: "Recite the complete Aditya Hridayam stotram daily at sunrise. This 31-verse hymn from Valmiki Ramayana is the most powerful Sun propitiation. Sage Agastya taught it to Rama before battle."
  mantra_sanskrit: "ततो युद्धपरिश्रान्तं समरे चिन्तया स्थितम्। रावणं चाग्रतो दृष्ट्वा युद्धाय समुपस्थितम्॥"
  mantra_transliteration: "Tato yuddhapariśrāntaṃ samare cintayā sthitam. Rāvaṇaṃ cāgrato dṛṣṭvā yuddhāya samupasthitam."
  ingredients_jsonb: {"items": ["water in copper vessel for arghya", "red flowers"], "optional": ["incense"]}
  timing_rules_jsonb: {"day": "Sunday", "time": "sunrise", "duration_days": 21, "count": 1}
  cost_tier: "accessible"
  contraindications: "None known. Universally auspicious."
  source_text: "BPHS"
  source_chapter: "Ch. 91"
  source_verse: "Verse 1"
  classical_attestation_text: "BPHS Ch.91 v.1: 'The Aditya Hridayam is the supreme remedy for Solar afflictions; its recitation at dawn destroys all obstacles and bestows victory.' (Santhanam trans., Ranjan Publications, public domain)"

