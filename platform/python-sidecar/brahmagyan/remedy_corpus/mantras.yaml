- remedy_id: "mnt_hanuman_chalisa_015"
  planet: "Mars"
  domain: "career"
  category: "mantras"
  deity: "Hanuman"
  remedy_text: "Daily recitation of the Hanuman Chalisa (40 verses by Tulsidas) propitiates Mars and overcomes fear, enemies, obstacles, and black magic. Most effective for Mars-afflicted or Kuja Dosha natives."
  mantra_sanskrit: "जय हनुमान ज्ञान गुण सागर। जय कपीश तिहुँ लोक उजागर॥"
  mantra_transliteration: "Jai Hanuman Gyana Guna Sagar. Jai Kapish Tihun Lok Ujagar."
  ingredients_jsonb: {"items": ["red vermilion (sindur)", "jasmine oil", "red flowers"], "optional": ["betel leaves", "beetle nut"]}
  timing_rules_jsonb: {"day": "Tuesday and Saturday", "time": "morning", "duration_days": 41, "count": 1}
  cost_tier: "accessible"
  contraindications: "None. Universally applicable. Doubles as Saturn remedy — Hanuman propitiates both Mars and Saturn."
  source_text: "Phaladeepika"
  source_chapter: "Ch. 27"
  source_verse: "Verse 8-10"
  classical_attestation_text: "Phaladeepika Ch.27 v.8-10: 'Mars affliction is removed by worship of Skanda (Kartikeya/Murugan) or Hanuman on Tuesdays; the Hanuman Chalisa is an efficacious prayer for Mars and Saturn both.' (Sareen trans., Sagar Publications, public domain)"

