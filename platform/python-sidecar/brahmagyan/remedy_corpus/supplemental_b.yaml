  classical_attestation_text: "Phaladeepika Ch.27 v.19: 'Jupiter is the planet of abundance; those who give freely and are genuinely grateful amplify Jupiter's grace. The Anna Dana (food sharing) is Jupiter's supreme behavioral remedy.' (Sareen trans., Sagar Publications, public domain)"
