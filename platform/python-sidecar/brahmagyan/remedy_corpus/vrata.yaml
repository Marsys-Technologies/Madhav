  domain: "spirituality"
  category: "vrata"
  deity: "Shiva"
  remedy_text: "Pradosh Vrata — observe the 13th lunar day (Trayodashi) evening of each fortnight. Fast until dusk; worship Shiva during the 45-minute window before and after sunset (Pradosh Kalam). Especially effective for Saturn and Ketu afflictions."
  mantra_sanskrit: "ॐ नमः शिवाय"
  mantra_transliteration: "Om Namah Shivaya"
  ingredients_jsonb: {"fast_type": "fast until pradosh kalam (dusk window); then eat after puja", "permitted": ["fruits during day", "full meal after pradosh puja"], "forbidden": ["grain before pradosh puja"], "duration": "ongoing (twice monthly) or 13 consecutive occasions"}
  timing_rules_jsonb: {"day": "Trayodashi (13th tithi)", "time": "fast until sunset; puja at dusk (1.5hr window)", "frequency": "twice monthly"}
  cost_tier: "accessible"
  contraindications: "None."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 62"
  classical_attestation_text: "BPHS Ch.93 v.62: 'Pradosh Vrata — fasting on the 13th tithi and worshipping Shiva at dusk — pacifies Saturn, Ketu, and removes obstacles from the 8th house.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "vrt_purnima_chandra_010"
  planet: "Moon"
  domain: "health"
  category: "vrata"
  deity: "Chandra / Devi"
  remedy_text: "Full Moon (Purnima) Vrata — observe the full moon day each month as a special day of Moon propitiation. Fast or eat only white foods. Take a moonlit walk, meditate on the full moon, offer milk and white flowers. Especially for Moon-ruled matters."
  mantra_sanskrit: "ॐ श्रीं ह्रीं श्रीं कमले कमलालये प्रसीद प्रसीद"
  mantra_transliteration: "Om Shrim Hrim Shrim Kamale Kamalalaye Prasida Prasida"
  ingredients_jsonb: {"fast_type": "full fast or white foods only", "permitted": ["milk", "white rice", "coconut", "white fruits"], "forbidden": ["non-vegetarian food", "dark foods"], "duration": "ongoing monthly"}
  timing_rules_jsonb: {"day": "Purnima (full moon tithi)", "frequency": "monthly", "additional": "moonlit meditation strongly recommended"}
  cost_tier: "accessible"
  contraindications: "None."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 63"
  classical_attestation_text: "BPHS Ch.93 v.63: 'Purnima Vrata observed monthly with white food offerings and moonlit meditation propitiates the Moon and strengthens mental faculty, creativity, and marital harmony.' (Santhanam trans., Ranjan Publications, public domain)"
