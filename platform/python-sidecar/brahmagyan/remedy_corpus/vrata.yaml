  mantra_transliteration: "Om Namah Shivaya"
  ingredients_jsonb: {"fast_type": "one meal; white foods only", "permitted": ["white rice", "milk", "curd", "coconut", "white fruits"], "forbidden": ["colored foods", "non-vegetarian food", "alcohol"], "duration": "16 consecutive Mondays"}
  timing_rules_jsonb: {"day": "Monday", "duration_weeks": 16, "paksha_note": "Shukla Paksha Mondays considered doubly auspicious"}
  cost_tier: "accessible"
  contraindications: "Pregnant women: partial fast only. Medical conditions: consult doctor."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 56"
  classical_attestation_text: "BPHS Ch.93 v.56: 'The Solah Somavar (16 Monday) Vrata propitiates both the Moon and Shiva, granting mental peace, curing Moon-related diseases, and blessing marriage.' (Santhanam trans., Ranjan Publications, public domain)"

