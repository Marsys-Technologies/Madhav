- remedy_id: "vrt_sun_sunday_fast_001"
  planet: "Sun"
  domain: "career"
  category: "vrata"
  deity: "Surya"
  remedy_text: "Observe Sunday fast (Ravivara Vrata). Take one meal after sunset; avoid salt and oil during the day. Observe for 12 consecutive Sundays for complete effect. Wear red or orange cloth on fast day. Read Surya Kavacha."
  mantra_sanskrit: "ॐ सूर्याय नमः"
  mantra_transliteration: "Om Suryaya Namah"
  ingredients_jsonb: {"fast_type": "one meal after sunset; no salt or oil during day", "permitted": ["wheat bread without salt", "fruits", "milk"], "forbidden": ["salt", "oil", "non-vegetarian food"], "duration": "12 consecutive Sundays"}
  timing_rules_jsonb: {"day": "Sunday", "duration_weeks": 12, "break_conditions": ["illness permitted to break; compensate after recovery"]}
  cost_tier: "accessible"
  contraindications: "Not advised for diabetics without medical supervision. Pregnant women should modify (partial fast only)."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 55"
  classical_attestation_text: "BPHS Ch.93 v.55: 'Observing the Sunday fast (Ravivara Upavasa) for twelve consecutive weeks propitiates the Sun and removes obstacles caused by Solar afflictions in the chart.' (Santhanam trans., Ranjan Publications, public domain)"

