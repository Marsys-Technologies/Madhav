- remedy_id: "vrt_ekadashi_008"
  planet: "Jupiter"
  domain: "spirituality"
  category: "vrata"
  deity: "Vishnu"
  remedy_text: "Ekadashi Vrata — observe the 11th lunar day (Ekadashi) twice monthly (Shukla Paksha and Krishna Paksha Ekadashi). Fast on Ekadashi to propitiate Jupiter, Vishnu, and the overall chart. Considered the supreme planetary fast in Jyotish."
  mantra_sanskrit: "ॐ नमो भगवते वासुदेवाय"
  mantra_transliteration: "Om Namo Bhagavate Vasudevaya"
  ingredients_jsonb: {"fast_type": "complete water fast or fruits-only; no grains", "permitted": ["water", "fruits", "milk (some traditions)", "roots (sabudana, sweet potato)"], "forbidden": ["all grains", "non-vegetarian food", "alcohol"], "duration": "ongoing (twice monthly)"}
  timing_rules_jsonb: {"day": "Ekadashi (11th tithi of each paksha)", "frequency": "twice monthly", "duration_days": "indefinite — ongoing practice"}
  cost_tier: "accessible"
  contraindications: "Pregnant women and young children: modified observance. Medical conditions: consult physician."
  source_text: "Phaladeepika"
  source_chapter: "Ch. 27"
  source_verse: "Verse 21"
  classical_attestation_text: "Phaladeepika Ch.27 v.21: 'Ekadashi fasting twice monthly is the supreme upaya for all planetary afflictions, especially Jupiter and Moon. It removes karma accumulated over previous lives.' (Sareen trans., Sagar Publications, public domain)"

