  remedy_text: "Om Namo Bhagavate Vasudevaya — the 12-syllable Vishnu mantra (Dvadasakshari Mantra) for Jupiter propitiation. Jupiter is the Guru of the gods, directly associated with Vishnu. Reciting this mantra on Thursdays with tulsi mala is the supreme Jupiter mantra."
