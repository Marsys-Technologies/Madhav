- remedy_id: "man_moon_chandra_kavacham_027"
  planet: "Moon"
  domain: "health"
  category: "mantras"
  deity: "Chandra"
  remedy_text: "Chandra Kavacham — the Moon's protective armor prayer from BPHS. Recited on Mondays for protection from Moon-related ailments, emotional disturbances, and mental health challenges. The kavacham invokes Chandra's blessings in all directions."
  mantra_sanskrit: "ऐं क्लीं सोमाय नमः — Chandra beeja kavacham"
  mantra_transliteration: "Aim Kleem Somaya Namah (Chandra triple-beeja kavacham)"
  ingredients_jsonb: {"count": 108, "mala": "Moonstone or Sphatika mala", "items": ["white flowers", "milk offering", "white rice"]}
  timing_rules_jsonb: {"day": "Monday during Shukla Paksha", "time": "evening after sunset", "frequency": "weekly minimum"}
  cost_tier: "free"
  contraindications: "None."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 25"
  classical_attestation_text: "BPHS Ch.93 v.25: 'The Chandra Kavacham recited on Monday evenings during Shukla Paksha protects the mind from Moon afflictions and brings emotional stability.' (Santhanam trans., Ranjan Publications, public domain)"

