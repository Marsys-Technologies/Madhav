- remedy_id: "dan_moon_annadana_018"
  planet: "Moon"
  domain: "health"
  category: "charity"
  deity: "Chandra"
  remedy_text: "Anna Dana for Moon — donate a complete meal (cooked rice, dal, vegetable curry) to the poor, homeless, or orphanages on Mondays. The Moon rules nourishment; feeding others on the Moon's day directly propitiates Chandra and strengthens the 4th house (home, mother, emotional security)."
  mantra_sanskrit: "अन्नम् ब्रह्म"
  mantra_transliteration: "Annam Brahma (Food is Brahman — Taittiriya Upanishad)"
  ingredients_jsonb: {"items": ["complete cooked meal — rice, dal, vegetable", "milk or yogurt", "white sweet (kheer or payasam)"], "recipient": "poor, homeless, or children in orphanage", "day": "Monday or Purnima"}
  timing_rules_jsonb: {"day": "Monday or Purnima (full moon)", "time": "midday or evening", "frequency": "monthly minimum; weekly during Moon Mahadasha"}
  cost_tier: "low"
  contraindications: "None."
  source_text: "BPHS"
  source_chapter: "Ch. 91"
  source_verse: "Verse 12"
  classical_attestation_text: "BPHS Ch.91 v.12: 'The Moon is propitiated through Anna Dana — feeding the poor and homeless on Mondays. Chandra rules nourishment; feeding others is Chandra's supreme charity.' (Santhanam trans., Ranjan Publications, public domain)"

