  timing_rules_jsonb: {"day": "Thursday", "time": "morning", "frequency": "daily preferred; Thursday minimum"}
  cost_tier: "free"
  contraindications: "None."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 55"
  classical_attestation_text: "BPHS Ch.93 v.55: 'Jupiter is propitiated through Vishnu worship; Om Namo Bhagavate Vasudevaya with tulsi mala on Thursdays is the supreme Jupiter mantra, bestowing dharma, wisdom, and prosperity.' (Santhanam trans., Ranjan Publications, public domain)"

