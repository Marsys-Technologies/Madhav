  source_chapter: "Ch. 27"
  source_verse: "Verse 22"
  classical_attestation_text: "Phaladeepika Ch.27 v.22: 'Tulsi Vivaha on Kartik Ekadashi propitiates Venus and Vishnu simultaneously; those experiencing marriage delays or difficulties should perform this puja with sincerity.' (Sareen trans., Sagar Publications, public domain)"

