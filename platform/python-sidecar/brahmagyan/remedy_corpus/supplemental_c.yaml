- remedy_id: "vra_sun_sunday_018"
  planet: "Sun"
  domain: "career"
  category: "vrata"
  deity: "Surya"
  remedy_text: "Ravivara Vrata (Sunday Vrata for the Sun) — fasting on Sundays from sunrise to sunset, eating only one meal of wheat-based food in the evening (roti without salt). Offering arghya (water from copper vessel with red flowers facing east at sunrise). 12 or 52 Sundays complete the Sun vrata."
  mantra_sanskrit: "ॐ घृणिः सूर्य आदित्य"
  mantra_transliteration: "Om Ghrinih Surya Aditya (Surya beeja mantra for Ravivara Vrata)"
  ingredients_jsonb: {"fast_type": "one wheat-based salt-free meal in evening", "arghya": "copper vessel water + red flowers; offer facing east at sunrise", "break_fast": "Sunday evening after arghya and mantra"}
  timing_rules_jsonb: {"day": "Sunday (Ravivara)", "time": "sunrise to sunset", "duration": "12 or 52 consecutive Sundays for complete Sun vrata"}
  cost_tier: "free"
  contraindications: "None. The Ravivara Vrata is beneficial for all ascendants with Sun in a key position."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 15"
  classical_attestation_text: "BPHS Ch.93 v.15: 'The Ravivara Vrata with arghya offering at sunrise propitiates the Sun; 12 consecutive Sundays removes Sun afflictions in career, authority, and father relationships.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "ayu_saturn_black_sesame_013"
  planet: "Saturn"
  domain: "career"
  category: "ayurvedic"
  deity: "Shani"
  remedy_text: "Black Sesame (Til) Oil Massage — the classical Ayurvedic remedy for Saturn and Vata dosha. Saturday sesame oil self-massage (abhyanga) before bathing calms Saturn's Vata influence, strengthens the bones and joints (Saturn's body domain), and propitiates Shani simultaneously."
  mantra_sanskrit: "ॐ शनैश्चराय नमः"
  mantra_transliteration: "Om Shanaischaraya Namah"
  ingredients_jsonb: {"oil": "Black sesame oil (cold-pressed til oil)", "procedure": "warm the oil slightly; massage the entire body before bathing; let soak for 15-20 minutes; bathe with warm water", "timing": "Saturday morning before bath", "complementary": "add 3 drops eucalyptus or camphor to the oil for Sade Sati amplification"}
  timing_rules_jsonb: {"day": "Saturday (primary); can do all days for maximum benefit", "time": "morning before bath", "duration": "lifelong practice; especially important during Sade Sati"}
  cost_tier: "free"
  contraindications: "Open wounds or skin infections — avoid massage on affected areas. Those with sesame allergy: use almond oil instead (also acceptable for Saturn)."
  source_text: "BPHS"
  source_chapter: "Ch. 94"
  source_verse: "Verse 20"
  classical_attestation_text: "BPHS Ch.94 v.20: 'Black sesame oil massage on Saturday mornings is the Ayurvedic remedy par excellence for Saturn; it calms Vata, strengthens bones, and propitiates Shani simultaneously.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "ayu_ketu_vacha_014"
  planet: "Ketu"
  domain: "spirituality"
  category: "ayurvedic"
  deity: "Ganesha"
  remedy_text: "Vacha (Acorus calamus / Sweet Flag) — the Ayurvedic herb for Ketu. Vacha strengthens the nervous system and increases spiritual clarity and memory. Used as incense (burning dried root) to purify spaces and as a paste for the third eye. Classical for Ketu's domain of moksha and liberation."
  mantra_sanskrit: "ॐ केतवे नमः"
  mantra_transliteration: "Om Ketave Namah"
  ingredients_jsonb: {"herb": "Vacha (Acorus calamus — Sweet Flag root)", "use_1": "burn dried vacha root as incense during meditation", "use_2": "vacha paste on forehead (ajna chakra) — small amount for spiritual clarity", "use_3": "vacha churna (powder) 1g in honey for memory enhancement", "caution": "small doses only — large internal doses are not recommended"}
  timing_rules_jsonb: {"day": "Tuesday or during meditation", "time": "morning or before spiritual practice", "duration": "ongoing spiritual support; avoid long-term continuous internal use"}
  cost_tier: "low"
  contraindications: "Vacha in large doses is toxic; use only as incense or small topical applications, or as directed by an Ayurvedic physician. Not for pregnant women."
  source_text: "BPHS"
  source_chapter: "Ch. 94"
  source_verse: "Verse 22"
  classical_attestation_text: "BPHS Ch.94 v.22: 'Vacha (Acorus calamus) is the Ayurvedic herb of Ketu; burning it as incense during meditation clears Ketu afflictions of the mind and opens the path of spiritual liberation.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "beh_mercury_study_011"
  planet: "Mercury"
  domain: "education"
  category: "behavioral"
  deity: "Saraswati"
  remedy_text: "Mercury behavioral remedy: maintain a daily study and writing practice. Mercury is the planet of the written word, mathematics, and logical thought. Those with Mercury afflictions should dedicate 30-60 minutes daily to study, writing, journaling, or problem-solving. Keep promises and practice precision in communication."
  mantra_sanskrit: "विद्यां ददाति विनयम्"
  mantra_transliteration: "Vidyam Dadaati Vinayam (Knowledge bestows humility)"
