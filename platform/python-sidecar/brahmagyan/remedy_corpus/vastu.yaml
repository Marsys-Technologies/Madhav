  domain: "health"
  category: "vastu"
  deity: "Chandra"
  remedy_text: "Moon governs the North-West direction but resonates with water. Place a water fountain or aquarium in the North or North-East (water element zone) to activate Moon's beneficial qualities of nurturing, intuition, and emotional wellbeing."
  mantra_sanskrit: "ॐ चन्द्राय नमः"
  mantra_transliteration: "Om Chandraya Namah"
  ingredients_jsonb: {"direction": "North-East (Ishanya — water zone)", "elements": ["water fountain with clear water", "blue or white crystals", "lunar images or crescent moon symbols", "avoid broken water features"], "bedroom": "head should point east or south; avoid north (Moon energies increase sensitivity)"}
  timing_rules_jsonb: {"day": "Monday", "time": "during Shukla Paksha", "implementation": "one-time Vastu installation"}
  cost_tier: "accessible"
  contraindications: "Water feature must be kept clean; stagnant water amplifies negative Moon qualities (depression, stagnation)."
  source_text: "Brihat Samhita"
  source_chapter: "Ch. 53 (Vastu section)"
  source_verse: "Verse 12"
  classical_attestation_text: "Brihat Samhita Ch.53 v.12 (Varahamihira): 'Water in the North-East (Ishanya corner) activates the lunar and Ketu energies of that direction; a clean, flowing water feature brings emotional nurturing and health.' (Ramakrishna Bhat trans., Motilal Banarsidass, public domain)"

