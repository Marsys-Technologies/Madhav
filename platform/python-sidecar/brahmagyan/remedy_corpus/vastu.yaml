- remedy_id: "vas_sun_east_window_001"
  planet: "Sun"
  domain: "career"
  category: "vastu"
  deity: "Surya"
  remedy_text: "Sun governs the East direction. Ensure the east side of the home/workplace has maximum openings (windows, doors). Place a Surya Yantra on the east wall. Avoid heavy furniture blocking east. This activates Solar energy for career advancement."
  mantra_sanskrit: "ॐ सूर्याय नमः"
  mantra_transliteration: "Om Suryaya Namah"
  ingredients_jsonb: {"direction": "East", "elements": ["east windows should be clear and unblocked", "Surya Yantra on east wall", "red or orange color elements in east zone", "avoid water bodies (ponds, tanks) in east"], "workspace": "desk should face east for Solar professions (government, leadership)"}
  timing_rules_jsonb: {"day": "Sunday", "time": "sunrise (verify east is unobstructed)", "implementation": "one-time Vastu correction"}
  cost_tier: "accessible"
  contraindications: "East corrections are universally beneficial. No adverse effects."
  source_text: "BPHS"
  source_chapter: "Ch. 94"
  source_verse: "Verse 50"
  classical_attestation_text: "BPHS Ch.94 v.50: 'The East is governed by the Sun. Keeping the eastern zone of the home open and light-filled activates Solar energy, benefiting careers requiring authority, government connections, and recognition.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "vas_moon_north_water_002"
