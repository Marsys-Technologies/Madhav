# ── PARIŚEṢA-V4 F-182 / owner ruling R-2 (OWNER_RULINGS_20260821.md) ─────────
# Rows below may pair a BPHS-attributed remedy with a `mantra_transliteration`
# carrying a navagraha bīja of the `praam preem praum sah` class. That bīja class
# is NOT BPHS material — it belongs to the tantric/āgamic layer transmitted via
# Mantra Mahodadhi (Mahīdhara, 16th c.) and the Navagraha stotra literature.
# Each row's `source_text` / `source_chapter` attributes the REMEDY (gemstone,
# yantra, vrata, dāna), which BPHS does supply; it must never be read as
# attributing the attached bīja mantra text to BPHS.
- remedy_id: "gem_ruby_sun_001"
  planet: "Sun"
  domain: "career"
  category: "gemstones"
  deity: "Surya"
  remedy_text: "Wear a natural Ruby (Manikya) of at least 3 carats, set in gold, on the ring finger of the right hand. The Ruby should be free of inclusions that resemble milk, water, cracks, or threads. Wear on a Sunday morning during Shukla Paksha."
  mantra_sanskrit: "ॐ ह्रां ह्रीं ह्रौं सः सूर्याय नमः"
  mantra_transliteration: "Om Hraam Hreem Hraum Sah Suryaya Namah"
  ingredients_jsonb: {"setting_metal": "gold", "finger": "ring finger", "hand": "right", "minimum_carats": 3, "quality_notes": "pigeon-blood red preferred; avoid milky or cracked stones"}
  timing_rules_jsonb: {"day": "Sunday", "time": "sunrise", "paksha": "Shukla", "lunar_nakshatra_avoid": ["Jyeshtha", "Mula"]}
  cost_tier: "elaborate"
  contraindications: "Not prescribed for Taurus, Gemini, Virgo, Libra, Capricorn, or Aquarius ascendants where Sun is a dusthana lord. Avoid if Sun rules 6H, 8H, or 12H without redeeming yogas."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 8-12"
  classical_attestation_text: "BPHS Ch.93 v.8-12: 'Ruby (Manikya) is the gem of the Sun. Wearing a pure ruby of 3+ carats set in gold on the ring finger on Sunday morning during Shukla Paksha strengthens the Sun and grants favor from authority.' (Santhanam trans., Ranjan Publications, public domain)"

