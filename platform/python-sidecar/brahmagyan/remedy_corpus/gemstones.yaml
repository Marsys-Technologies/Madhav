  source_verse: "Verse 28-32"
  classical_attestation_text: "BPHS Ch.93 v.28-32: 'Yellow Sapphire (Pushparaga/Pukhraj) is Jupiter's gem. Wearing 4+ carats unheated in gold on the index finger on Thursday Shukla Paksha grants wisdom, wealth, and progeny.' (Santhanam trans., Ranjan Publications, public domain)"

