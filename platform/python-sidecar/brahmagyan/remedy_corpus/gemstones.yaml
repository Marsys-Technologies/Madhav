  mantra_sanskrit: "ॐ द्रां द्रीं द्रौं सः शुक्राय नमः"
  mantra_transliteration: "Om Draam Dreem Draum Sah Shukraya Namah"
  ingredients_jsonb: {"setting_metal": "platinum or white gold or silver", "finger": "middle finger", "hand": "right", "minimum_carats": 1, "alternative_gem": "White Sapphire (3+ carats)", "quality_notes": "colorless to near-colorless; avoid yellowish diamonds"}
  timing_rules_jsonb: {"day": "Friday", "time": "morning", "paksha": "Shukla", "lunar_nakshatra_prefer": ["Bharani", "Purva Phalguni", "Purva Ashadha"]}
  cost_tier: "elaborate"
  contraindications: "Test for 3-4 days before committing. Diamonds may intensify Venus's qualities — for Venus as 6H/8H/12H lord, they may intensify those themes. Not for Virgo ascendants as Venus rules 2H/9H benefically."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 33-37"
  classical_attestation_text: "BPHS Ch.93 v.33-37: 'Diamond (Heera) is Venus's gem. Wearing a colorless diamond in platinum on the middle finger on Friday morning brings marital happiness, artistic success, and luxury.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "gem_blue_sapphire_saturn_007"
  planet: "Saturn"
  domain: "career"
  category: "gemstones"
  deity: "Shani"
  remedy_text: "Wear a Blue Sapphire (Neelam) of at least 4 carats, set in gold or panchdhatu (five-metal alloy), on the middle finger of the right hand. MUST test for 3-7 days first — Blue Sapphire is the fastest-acting and most potentially adverse gem. Wear on Saturday during Krishna Paksha."
  mantra_sanskrit: "ॐ प्रां प्रीं प्रौं सः शनैश्चराय नमः"
  mantra_transliteration: "Om Praam Preem Praum Sah Shanaischaraya Namah"
  ingredients_jsonb: {"setting_metal": "gold or panchdhatu (gold+silver+copper+iron+zinc)", "finger": "middle finger", "hand": "right", "minimum_carats": 4, "quality_notes": "cornflower blue preferred; avoid black-blue or very pale; unheated strongly preferred"}
  timing_rules_jsonb: {"day": "Saturday", "time": "evening (dusk)", "paksha": "Krishna", "test_period_days": 7, "lunar_nakshatra_prefer": ["Pushya", "Anuradha", "Uttara Bhadrapada"]}
  cost_tier: "elaborate"
  contraindications: "MANDATORY 3-7 day trial period: place stone under pillow or on body for 3-7 days without permanent wearing. Adverse signs: nightmares, accidents, financial loss, quarrels. REMOVE IMMEDIATELY if adverse. Contraindicated for Aries, Cancer, Leo, Scorpio ascendants unless Saturn is exalted or yogakaraka."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 38-43"
  classical_attestation_text: "BPHS Ch.93 v.38-43: 'Blue Sapphire (Neelam) is Saturn's gem. It acts with extreme swiftness — test it for seven days before wearing permanently. For favorable Saturn, it brings rapid material success; for unfavorable Saturn, it causes swift calamity.' (Santhanam trans., Ranjan Publications, public domain)"

