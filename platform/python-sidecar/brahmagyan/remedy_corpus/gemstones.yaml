  domain: "health"
  category: "gemstones"
  deity: "Chandra"
  remedy_text: "Wear a natural Pearl (Moti) of at least 4 carats, set in silver, on the little finger of the right hand. Natural saltwater pearls are superior to freshwater cultured pearls. Energize on Monday during Shukla Paksha."
  mantra_sanskrit: "ॐ श्रां श्रीं श्रौं सः चन्द्राय नमः"
  mantra_transliteration: "Om Shraam Shreem Shraum Sah Chandraya Namah"
  ingredients_jsonb: {"setting_metal": "silver", "finger": "little finger", "hand": "right", "minimum_carats": 4, "quality_notes": "round, lustrous, no spots; natural saltwater preferred"}
  timing_rules_jsonb: {"day": "Monday", "time": "within 2 hours of moonrise", "paksha": "Shukla", "month_note": "Kartika or Shravana month preferred"}
  cost_tier: "moderate"
  contraindications: "Avoid during balsashad yoga or when Moon is waning and combust. Not recommended for Gemini or Virgo ascendants where Moon rules 2H/4H without specific yogas requiring Moon strengthening."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 13-17"
  classical_attestation_text: "BPHS Ch.93 v.13-17: 'Pearl (Moti) is the gem of the Moon. A natural pearl of 4+ carats in silver worn on the little finger on Mondays in Shukla Paksha strengthens the mind and cures Moon-related ailments.' (Santhanam trans., Ranjan Publications, public domain)"

