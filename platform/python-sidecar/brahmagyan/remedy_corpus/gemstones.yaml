  source_verse: "Verse 18-22"
  classical_attestation_text: "BPHS Ch.93 v.18-22: 'Red Coral (Moonga) is Mars's gem. Wearing 6+ carats in gold on the ring finger on Tuesday morning during Shukla Paksha pacifies Kuja Dosha and strengthens blood and vitality.' (Santhanam trans., Ranjan Publications, public domain)"

