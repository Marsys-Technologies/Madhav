  source_verse: "Verse 78-81"
  classical_attestation_text: "BPHS Ch.93 v.78-81: 'The Shani Yantra inscribed on iron or lead, placed in the west, propitiates Saturn during Sade Sati and reduces the karma burden of Saturn Mahadasha.' (Santhanam trans., Ranjan Publications, public domain)"

