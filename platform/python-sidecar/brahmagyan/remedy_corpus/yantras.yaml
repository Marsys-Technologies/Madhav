  timing_rules_jsonb: {"day": "Monday", "time": "moonrise or evening", "paksha": "Shukla (Purnima energization ideal)", "recharge": "annually on Sharad Purnima"}
  cost_tier: "accessible"
  contraindications: "None. Chandra Yantra in bedroom aids sleep and emotional healing."
  source_text: "BPHS"
