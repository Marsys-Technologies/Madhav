- remedy_id: "ynt_sri_yantra_venus_001"
  planet: "Venus"
  domain: "wealth"
  category: "yantras"
  deity: "Lakshmi / Tripura Sundari"
  remedy_text: "Install a Sri Yantra (Shri Chakra) at home or in the worship room, facing east or north. The Sri Yantra is the premier yantra for Venus, Lakshmi, and overall prosperity. Energize on a Friday during Shukla Paksha with white flowers and turmeric."
  mantra_sanskrit: "ॐ श्रीं ह्रीं श्रीं महालक्ष्म्यै नमः"
  mantra_transliteration: "Om Shrim Hrim Shrim Mahalakshmyai Namah"
  ingredients_jsonb: {"material_options": ["gold (premium)", "silver", "copper", "three-dimensional crystal"], "placement": "north or east wall of worship room", "energization": ["white flowers", "kumkum (vermilion)", "turmeric water", "ghee lamp"]}
  timing_rules_jsonb: {"day": "Friday", "time": "morning", "paksha": "Shukla", "recharge": "annually on Diwali"}
  cost_tier: "moderate"
  contraindications: "Must be kept in clean, ritually pure space. Do not place in bedroom or bathroom. If a family member is extremely ill, temporarily cover."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 70-73"
  classical_attestation_text: "BPHS Ch.93 v.70-73: 'The Sri Yantra (Shri Chakra) is the supreme yantra for Venus and Lakshmi propitiation. Installed in gold or copper and worshipped on Fridays it brings wealth and beauty.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "ynt_surya_yantra_002"
  planet: "Sun"
  domain: "career"
  category: "yantras"
  deity: "Surya"
  remedy_text: "Install a Surya Yantra at home facing east. A Surya Yantra is a 3×3 magic square with specific numbers arranged according to Parashara's specification. Energize on Sunday morning during Shukla Paksha with red flowers, sandalwood, and incense."
  mantra_sanskrit: "ॐ ह्रां ह्रीं ह्रौं सः सूर्याय नमः"
  mantra_transliteration: "Om Hraam Hreem Hraum Sah Suryaya Namah"
  ingredients_jsonb: {"material_options": ["copper (traditional)", "gold-plated copper", "copper-engraved plate"], "placement": "east-facing wall of home or workplace", "energization": ["red flowers", "red sandalwood paste", "incense", "ghee lamp"]}
  timing_rules_jsonb: {"day": "Sunday", "time": "sunrise", "paksha": "Shukla", "recharge": "annually on Ratha Saptami (Sun's chariot festival)"}
  cost_tier: "accessible"
  contraindications: "Surya Yantra installed but un-energized is ineffective. Must be properly consecrated."
  source_text: "BPHS"
  source_chapter: "Ch. 93"
  source_verse: "Verse 65-67"
  classical_attestation_text: "BPHS Ch.93 v.65-67: 'The Surya Yantra inscribed on copper and installed facing east strengthens the Sun in the horoscope and brings government favor and vitality.' (Santhanam trans., Ranjan Publications, public domain)"

