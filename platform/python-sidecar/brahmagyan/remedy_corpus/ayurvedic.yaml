  remedy_text: "For Jupiter-related liver, fat metabolism, and spiritual growth issues: take Shatavari (Asparagus racemosus) in milk. Shatavari is the Jupiterian herb — sweet, cooling, nourishing, and promoter of wisdom (Medhya) and fertility (Shukra-promoting)."
  mantra_sanskrit: "ॐ गुरवे नमः"
  mantra_transliteration: "Om Gurave Namah"
