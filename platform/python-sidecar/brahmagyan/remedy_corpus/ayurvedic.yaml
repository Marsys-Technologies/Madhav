  timing_rules_jsonb: {"day": "daily, especially Thursday", "time": "morning or before bed", "duration_weeks": 12}
  cost_tier: "accessible"
  contraindications: "Very safe. Avoid if diagnosed with estrogen-sensitive conditions (Shatavari is phytoestrogenic)."
  source_text: "BPHS"
  source_chapter: "Ch. 94"
  source_verse: "Verse 39"
  classical_attestation_text: "BPHS Ch.94 v.39: 'Shatavari, the nourisher, is Jupiter's herb. Taken in milk on Thursdays it strengthens the liver and reproductive tissues and promotes the wisdom quality (Medhya) governed by Jupiter.' (Santhanam trans., Ranjan Publications, public domain)"

