  domain: "health"
  category: "ayurvedic"
  deity: "Mangala"
  remedy_text: "For Mars-related blood disorders, skin inflammation, accidents, and anger: take turmeric (haldi) in warm milk or ghee daily. Turmeric is a hot, bitter herb resonant with Mars. It purifies blood (Rakta dhatu — Mars's primary tissue) and reduces inflammation."
  mantra_sanskrit: "ॐ भौमाय नमः"
  mantra_transliteration: "Om Bhaumaya Namah"
  ingredients_jsonb: {"ingredients": ["turmeric powder — 1/2 tsp", "warm milk — 250ml (or ghee — 1 tsp)", "black pepper — pinch (activates curcumin)", "honey"], "preparation": "Golden milk: heat milk with turmeric and pepper; cool slightly; add honey; drink on Tuesdays primarily", "frequency": "daily (especially Tuesdays) during Mars dasha"}
  timing_rules_jsonb: {"day": "daily, especially Tuesday", "time": "morning", "duration_weeks": 12}
  cost_tier: "accessible"
  contraindications: "Avoid large doses in pregnancy. Reduces blood clotting — consult if on blood thinners."
  source_text: "BPHS"
  source_chapter: "Ch. 94"
  source_verse: "Verse 37"
  classical_attestation_text: "BPHS Ch.94 v.37: 'Turmeric, the blood-purifier, is Mars's herb. Consumed in milk on Tuesdays it purifies the Rakta dhatu (blood tissue) governed by Mars and reduces inflammatory afflictions.' (Santhanam trans., Ranjan Publications, public domain)"

