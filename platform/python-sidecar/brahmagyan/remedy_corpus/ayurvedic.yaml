- remedy_id: "ayu_sun_saffron_001"
  planet: "Sun"
  domain: "health"
  category: "ayurvedic"
  deity: "Surya"
  remedy_text: "For Sun-afflicted health issues (heart, bones, eyes, right side of body): consume saffron (kesar) mixed in warm milk on Sundays. Saffron is Solar by nature — hot, red-orange, and tonifying for the vitality (Ojas)."
  mantra_sanskrit: "ॐ सूर्याय नमः"
  mantra_transliteration: "Om Suryaya Namah"
  ingredients_jsonb: {"ingredients": ["saffron (kesar) — 2-3 strands", "warm cow's milk — 250ml", "honey — 1 tsp", "cardamom — pinch"], "preparation": "Soak saffron in 1 tbsp warm water for 5 minutes; add to warm milk; add honey and cardamom; drink on empty stomach on Sundays", "frequency": "Sundays during Sun dasha or when Sun is afflicted"}
  timing_rules_jsonb: {"day": "Sunday", "time": "morning on empty stomach", "duration_weeks": 12}
  cost_tier: "moderate"
  contraindications: "Avoid during pregnancy in large doses. Not prescribed for those with Pitta excess (inflammatory conditions) — saffron increases Pitta."
  source_text: "BPHS"
  source_chapter: "Ch. 94"
  source_verse: "Verse 35"
  classical_attestation_text: "BPHS Ch.94 v.35: 'Saffron-infused milk taken on Sundays strengthens the Sun and fortifies the heart and vital energy (Ojas) — saffron partakes of the Solar nature.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "ayu_moon_ashwagandha_002"
  planet: "Moon"
  domain: "health"
  category: "ayurvedic"
  deity: "Chandra"
  remedy_text: "For Moon-related mental and nervous system issues: take Ashwagandha powder (1/2 tsp) mixed in warm milk with honey before bed, especially on Mondays. Ashwagandha is a Lunar herb — cooling, nourishing, and rejuvenating for the mind (Manas)."
  mantra_sanskrit: "ॐ चन्द्राय नमः"
  mantra_transliteration: "Om Chandraya Namah"
  ingredients_jsonb: {"ingredients": ["Ashwagandha (Withania somnifera) root powder — 1/2 tsp", "warm cow's milk — 250ml", "raw honey — 1 tsp", "ghee — 1/4 tsp (optional)"], "preparation": "Mix ashwagandha in warm milk; add honey when slightly cooled; drink before bed", "frequency": "daily (especially Mondays) during Moon dasha or when Moon is afflicted"}
  timing_rules_jsonb: {"day": "daily, especially Monday", "time": "before bed", "duration_weeks": 8}
  cost_tier: "accessible"
  contraindications: "Avoid during pregnancy. May cause drowsiness — do not drive after. Not prescribed when Moon governs a house with heavy Saturn or Mars influence without Vata-grounding modifications."
  source_text: "BPHS"
  source_chapter: "Ch. 94"
  source_verse: "Verse 36"
  classical_attestation_text: "BPHS Ch.94 v.36: 'Ashwagandha mixed in milk taken before sleep on Mondays strengthens the Moon, calms Vata disturbances of the mind, and restores Ojas depleted by Moon afflictions.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "ayu_mars_turmeric_003"
