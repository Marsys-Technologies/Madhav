- remedy_id: "dan_sun_wheat_001"
  planet: "Sun"
  domain: "career"
  category: "charity"
  deity: "Surya"
  remedy_text: "Donate wheat, jaggery (gur), copper coins or copper vessel, red cloth, or red lentils on Sundays to a temple, Brahmin, or person in need. This is the classical dana for the Sun."
  mantra_sanskrit: "ॐ सूर्याय नमः"
  mantra_transliteration: "Om Suryaya Namah"
  ingredients_jsonb: {"items": ["wheat (500g minimum)", "jaggery", "copper coin or vessel", "red cloth"], "recipients": ["Brahmin", "temple", "government servant", "father figure"], "day": "Sunday"}
  timing_rules_jsonb: {"day": "Sunday", "time": "before noon", "frequency": "weekly or during Sun dasha/antardasha", "minimum_repetitions": 12}
  cost_tier: "accessible"
  contraindications: "Dana must be given with sincerity; compelled giving without goodwill yields no remedial benefit."
  source_text: "BPHS"
  source_chapter: "Ch. 91"
  source_verse: "Verse 40"
  classical_attestation_text: "BPHS Ch.91 v.40: 'For the Sun, donate wheat, jaggery and copper on Sundays to propitiate the deity. The Sun's karaka items are gold, wheat, jaggery, copper, and red cloth.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "dan_moon_rice_002"
  planet: "Moon"
  domain: "health"
  category: "charity"
  deity: "Chandra"
  remedy_text: "Donate white rice, milk, silver, white cloth, conch shells, or curd on Mondays. Feeding the poor with white rice and milk on Mondays is considered the most effective Moon dana. Also feed cows with white foods."
  mantra_sanskrit: "ॐ चन्द्राय नमः"
  mantra_transliteration: "Om Chandraya Namah"
  ingredients_jsonb: {"items": ["white rice (500g minimum)", "milk or curd", "silver coin", "white cloth"], "recipients": ["Brahmin woman", "poor person", "cow", "elderly woman"], "day": "Monday"}
  timing_rules_jsonb: {"day": "Monday", "time": "evening (moonrise)", "paksha": "Shukla preferred", "frequency": "weekly during Moon dasha", "minimum_repetitions": 16}
  cost_tier: "accessible"
  contraindications: "Most effective during Shukla Paksha; less effective during Krishna Paksha."
  source_text: "BPHS"
  source_chapter: "Ch. 91"
  source_verse: "Verse 41"
  classical_attestation_text: "BPHS Ch.91 v.41: 'For the Moon, donate white rice, milk, silver and white cloth on Mondays. The Moon governs silver, rice, milk, curd, water, and white things.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "dan_mars_lentils_003"
  planet: "Mars"
  domain: "general"
  category: "charity"
  deity: "Mangala"
  remedy_text: "Donate red lentils (masoor dal), red cloth, copper vessel, blood donation (donate blood), or sweets made with jaggery on Tuesdays. Feeding crows with bread or offering red flowers at a Mars temple (Subrahmanya/Murugan) is also effective."
  mantra_sanskrit: "ॐ भौमाय नमः"
  mantra_transliteration: "Om Bhaumaya Namah"
  ingredients_jsonb: {"items": ["red masoor dal (500g)", "red cloth", "copper coin", "jaggery sweets"], "recipients": ["soldier or police officer", "younger sibling", "laborer", "crow"], "day": "Tuesday"}
  timing_rules_jsonb: {"day": "Tuesday", "time": "morning", "frequency": "weekly during Mars dasha or for Kuja Dosha", "minimum_repetitions": 21}
  cost_tier: "accessible"
  contraindications: "None. Mars dana is universally beneficial for Kuja Dosha natives."
  source_text: "BPHS"
  source_chapter: "Ch. 91"
  source_verse: "Verse 42"
  classical_attestation_text: "BPHS Ch.91 v.42: 'For Mars, donate red lentils, copper, and red cloth on Tuesdays. Mars governs red items, weapons, courage, land, brothers, and soldiers.' (Santhanam trans., Ranjan Publications, public domain)"

