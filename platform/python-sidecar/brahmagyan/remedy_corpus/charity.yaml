- remedy_id: "dan_general_annadana_010"
  planet: "Jupiter"
  domain: "wealth"
  category: "charity"
  deity: "Annapoorna (aspect of Devi)"
  remedy_text: "Annadana (donation of food to the hungry) is considered the highest form of dana across all planetary remedies. Feeding 108 people, or daily feeding of even one person who is hungry, propitiates all benefic planets simultaneously."
  mantra_sanskrit: "अन्नदाता सुखी भव"
  mantra_transliteration: "Annadaata Sukhi Bhava"
  ingredients_jsonb: {"items": ["cooked food (rice, dal, vegetables minimum)", "or cash donation to food charity"], "recipients": ["any hungry person", "temple langar", "old age home"], "day": "any"}
  timing_rules_jsonb: {"day": "any", "time": "lunchtime preferred", "frequency": "daily or on auspicious days (Ekadashi, Purnima)", "minimum_repetitions": 1}
  cost_tier: "accessible"
  contraindications: "None. Annadana is universally meritorious."
  source_text: "BPHS"
  source_chapter: "Ch. 94"
  source_verse: "Verse 1"
  classical_attestation_text: "BPHS Ch.94 v.1: 'Among all acts of charity, Anna-dana (food donation) is supreme — it propitiates all nine planets simultaneously and grants the merit of all other danas combined.' (Santhanam trans., Ranjan Publications, public domain)"
