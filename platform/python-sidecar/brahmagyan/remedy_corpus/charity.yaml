  domain: "education"
  category: "charity"
  deity: "Budha"
  remedy_text: "Donate books, green cloth, green moong dal, or educational materials on Wednesdays. Donating to schools, libraries, or supporting students' education is the most effective Mercury dana. Feed cows and parrots."
