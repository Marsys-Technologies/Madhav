  source_chapter: "Ch. 91"
  source_verse: "Verse 43"
  classical_attestation_text: "BPHS Ch.91 v.43: 'For Mercury, donate books, green cloth, and green moong on Wednesdays. Mercury governs intelligence, communication, commerce, and skin.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "dan_jupiter_gold_005"
  planet: "Jupiter"
  domain: "wealth"
  category: "charity"
  deity: "Brihaspati"
  remedy_text: "Donate yellow gram (chana dal), turmeric, yellow cloth, or gold on Thursdays. Feed Brahmins or priests. Donate to educational institutions, temples, or vedic scholars. Feeding birds (especially peacocks) with grain is also effective."
  mantra_sanskrit: "ॐ गुरवे नमः"
  mantra_transliteration: "Om Gurave Namah"
  ingredients_jsonb: {"items": ["chana dal/yellow gram (500g)", "turmeric", "yellow cloth", "gold ornament or coin"], "recipients": ["Brahmin", "teacher/guru", "temple priest", "child", "peacock"], "day": "Thursday"}
  timing_rules_jsonb: {"day": "Thursday", "time": "morning", "frequency": "weekly during Jupiter dasha", "minimum_repetitions": 19}
  cost_tier: "accessible"
  contraindications: "None. Jupiter dana has no known adverse effects."
  source_text: "BPHS"
  source_chapter: "Ch. 91"
  source_verse: "Verse 44"
  classical_attestation_text: "BPHS Ch.91 v.44: 'For Jupiter, donate yellow gram, turmeric, and gold on Thursdays to Brahmins and teachers. Jupiter governs gold, yellow cloth, wisdom, progeny, and sacred texts.' (Santhanam trans., Ranjan Publications, public domain)"

