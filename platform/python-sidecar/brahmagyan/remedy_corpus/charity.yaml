  category: "charity"
  deity: "Shukra"
  remedy_text: "Donate white rice, dairy products, sugar, ghee, white cloth, perfume, or silver on Fridays. Perform Kumari Puja (worship of young girls). Support women's welfare organizations. Donate white flowers to temples."
