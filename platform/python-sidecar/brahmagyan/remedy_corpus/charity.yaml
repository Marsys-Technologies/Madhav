  classical_attestation_text: "BPHS Ch.92 v.15: 'For Rahu, donate coconut with coins, barley, urad dal and release fish into water on Saturdays. Rahu governs foreigners, outcastes, serpents, and obscure paths.' (Santhanam trans., Ranjan Publications, public domain)"

