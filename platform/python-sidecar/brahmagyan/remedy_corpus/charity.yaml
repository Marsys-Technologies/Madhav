  timing_rules_jsonb: {"day": "Friday", "time": "morning to noon", "frequency": "weekly during Venus dasha or for delayed marriage", "minimum_repetitions": 16}
  cost_tier: "accessible"
  contraindications: "None."
  source_text: "BPHS"
  source_chapter: "Ch. 91"
  source_verse: "Verse 45"
  classical_attestation_text: "BPHS Ch.91 v.45: 'For Venus, donate white rice, dairy, silver, and white cloth on Fridays. Venus governs luxury, beauty, music, women, and marital happiness.' (Santhanam trans., Ranjan Publications, public domain)"

- remedy_id: "dan_saturn_sesame_007"
  planet: "Saturn"
  domain: "career"
  category: "charity"
  deity: "Shani"
  remedy_text: "Donate black sesame seeds (til), mustard oil, iron vessels, black cloth, shoes to the poor, or blankets on Saturdays. Feed crows and dogs. Serve elderly and disabled persons. Shani's primary dana is black sesame oil on Saturdays."
  mantra_sanskrit: "ॐ शनैश्चराय नमः"
  mantra_transliteration: "Om Shanaischaraya Namah"
  ingredients_jsonb: {"items": ["black sesame (til) 500g", "mustard oil", "iron vessel", "black cloth", "footwear for the poor"], "recipients": ["elderly person", "disabled person", "laborer", "crow", "dog"], "day": "Saturday"}
  timing_rules_jsonb: {"day": "Saturday", "time": "morning or evening", "frequency": "weekly, especially during Sade Sati or Saturn dasha", "minimum_repetitions": 23}
  cost_tier: "accessible"
  contraindications: "None. Saturn dana is especially important during Sade Sati (7.5 year Saturn transit) and during Saturn Mahadasha."
  source_text: "BPHS"
  source_chapter: "Ch. 91"
  source_verse: "Verse 46"
  classical_attestation_text: "BPHS Ch.91 v.46: 'For Saturn, donate black sesame, iron, and black cloth on Saturdays to laborers and the poor. Saturn governs longevity, karma, sorrow, servants, and iron.' (Santhanam trans., Ranjan Publications, public domain)"

