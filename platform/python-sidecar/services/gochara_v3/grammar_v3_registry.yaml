      relative to native's natal Moon nakshatra. Activates the v1 wired-but-dead
      nakshatra_ingress_tara primitive by sourcing natal Moon nakshatra from ClassContext.
    citation_status: classically_cited
    classical_citation: >-
      Muhurta Chintamani — Tara bala chapter; BPHS nakshatra transit quality.
      9-Tara cycle: Janma(1.00), Sampat(1.15), Vipat(0.75), Kshema(1.10),
      Pratyak(0.80), Sadhana(1.05), Naidhana(0.70), Mitra(1.15), Paramamitra(1.20).
    v1_lineage:
      replaces: "nakshatra_ingress_tara wired-but-dead in primitives.py:558 (natal_moon_nakshatra_id never passed)"
      v1_module: services.gochara_grammar.primitives
      change_type: refinement
      note: >-
        v1 call site (configuration_activity.py ~line 67) never passed natal_moon_nakshatra_id
        so the Tara-quality dict was never populated; v3 gets natal Moon nakshatra
        from ClassContext.natal_facts with zero extra DB round-trips.
    module_path: services.gochara_v3.mechanisms.w23_tara_bala
    admission_state: candidate
    ablation_evidence_link: "W4.3"
    admission_ruling_id: pending
    toggle_key: w23_tara_bala

  - mechanism_id: w24_sade_sati
    wave: "W2.4"
    lane: sade_sati
    description: >-
      Sade Sati fully — phase-quarter intensity modifier (VISHAKHA 1.15, JANMA 1.30,
      ANUMUKHA 1.10) plus cancellation rules from ga_sade_sati chart_facts rows.
      v1 used only a boolean phase-membership signal; v3 consumes all ~11k rows.
    citation_status: classically_cited
    classical_citation: >-
      Brihat Parashara Hora Shastra — Sade Sati chapter; ga_sade_sati writer stores
      per-phase timestamps (sade_sati_phase category) and cancellation data
      (sade_sati_cancellation_check category) in chart_facts (~11k rows).
    v1_lineage:
      replaces: "boolean phase-membership flag in gochara_intensity/permission.py"
      v1_module: services.gochara_intensity.permission
      change_type: refinement
      note: >-
        v1 consumed only a boolean is-in-Sade-Sati signal; v3 reads phase_type
        (VISHAKHA/JANMA/ANUMUKHA), applies 3-tier intensity multiplier, and
        applies -0.05 step-down when cancellation_active_flag is true.
    module_path: services.gochara_v3.mechanisms.w24_sade_sati
    admission_state: candidate
    ablation_evidence_link: "W4.3"
    admission_ruling_id: pending
    toggle_key: w24_sade_sati

  - mechanism_id: w25_kota_chakra
