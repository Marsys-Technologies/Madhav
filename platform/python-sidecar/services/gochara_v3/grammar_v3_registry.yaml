# grammar_v3_registry.yaml — UTK-R3 grammar-v3 mechanism registry
#
# Catalogs all 9 Wave-2 candidate mechanisms for the GOCHARA-UTKARSHA campaign.
# Format defined by UTK-R3 ruling; ablation evidence collected by W4.3.
#
# Field semantics:
#   mechanism_id       — canonical identifier matching MECHANISM_ID in the Python module
#   wave               — campaign wave string (e.g. "W2.1")
#   lane               — lane label
#   description        — one-line human description
#   citation_status    — "classically_cited" | "inferred" | "uncited"
#   classical_citation — verbatim citation text or "none"
#   v1_lineage         — provenance of the v1 predecessor, or new/addition
#     replaces         — what v1 mechanism (or stub) this replaced, or "new"
#     v1_module        — importable module path of the v1 code, or "none"
#     change_type      — "replacement" | "addition" | "refinement" | "new"
#     note             — one-line summary of what changed
#   module_path        — importable dotted path (relative to python-sidecar root)
#   admission_state    — "candidate" (Wave-2 default per UTK-R3)
#   ablation_evidence_link — "W4.3" (this wave)
#   admission_ruling_id    — "pending" (will be updated by ADJUDICATOR post-ablation)
#   toggle_key         — Python identifier that disables this mechanism when False

mechanisms:

  - mechanism_id: w21_av_gating
    wave: "W2.1"
    lane: ashtakavarga_gating
    description: >-
      Ashtakavarga bindu gating — real SAV/BAV bindus from ClassContext replaces
      the hardcoded bindu_count_resolved=False stub in gochara_grammar/primitives.py:786.
      Modifier schedule: bindus < 28 → 0.8 (damp), == 28 → 1.0 (neutral), > 28 → 1.2 (amplify).
    citation_status: classically_cited
    classical_citation: >-
      Brihat Parashara Hora Shastra — Ashtakavarga chapters; bg_transit_av_gates rules
      (gate_kind='sav_threshold') encode the same threshold logic via min_sav_score.
      SAV total 337 bindus / 12 signs = 28.08 per-sign mean used as damp/neutral/amplify boundary.
    v1_lineage:
      replaces: "bindu_count_resolved: False hardcoded stub in primitives.py:786"
      v1_module: services.gochara_grammar.primitives
      change_type: replacement
      note: >-
        v1 stub always returned False (bindu gating was disabled);
        v3 fetches real SAV/BAV bindus from ClassContext.av_gate_rows and
        applies the 3-tier modifier schedule.
    module_path: services.gochara_v3.mechanisms.w21_av_gating
    admission_state: candidate
    ablation_evidence_link: "W4.3"
    admission_ruling_id: pending
    toggle_key: w21_av_gating

  - mechanism_id: w22_moorti_nirnaya
    wave: "W2.2"
    lane: moorti_nirnaya
    description: >-
      Moorti nirnaya quality modifier — svarṇa/rajata/tāmra/loha 4-tier multiplier
      applied to gochara windows overlapping a graha sign-ingress span.
      Reads kala_moorti_nirnaya rows pre-fetched in ClassContext; no new DB access.
    citation_status: classically_cited
    classical_citation: >-
      Phaladeepika Ch.27 — Moorti nirnaya grades each sign-ingress as gold/silver/copper/iron
      quality based on Moon's nakshatra at ingress relative to janma nakshatra.
      bg_transit_moorti reference table (27 rows) encodes the same rule.
    v1_lineage:
      replaces: "kala_moorti_nirnaya table produced but never consumed in v1 gochara scoring"
      v1_module: services.ka_gochara_sweep.writer
      change_type: addition
      note: >-
        v1 built kala_moorti_nirnaya rows via ka_moorti_nirnaya writer but never
        read them in the gochara intensity path; v3 applies 4-tier multiplier per ingress span.
    module_path: services.gochara_v3.mechanisms.w22_moorti_nirnaya
    admission_state: candidate
    ablation_evidence_link: "W4.3"
    admission_ruling_id: pending
    toggle_key: w22_moorti_nirnaya

  - mechanism_id: w23_tara_bala
