    citation_status: classically_cited
    classical_citation: >-
      All three citation sources cataloged: citations.py (14 constants in __all__),
      primitives.py (12 primitive families + sign_occupation addendum, including 3
      uncited_extension families and 2 DB-inherited families),
      bg_transit_rules / bg_transit_av_gates (classical_citation columns, db_inherited source).
    v1_lineage:
      replaces: "citation strings exist in citations.py and primitives.py but none resolved to classical_text_chunks verse_refs"
      v1_module: services.gochara_grammar.citations
      change_type: addition
