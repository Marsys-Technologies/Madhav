      Tājaka Nīlakaṇṭhī Ch.1 / BPHS Tājaka chapter — Vārṣeśa is the primary annual
      significator. Kṛṣṇa Miśra / Tājaka tradition — Praveśa chart annual tone per domain.
      Sudarśana Cakra Paddhati — house placement of transit body modifies classical effectiveness.
    v1_lineage:
      replaces: "documented gap in gochara_intensity/permission.py:60-68 — all three annual signals excluded from G-3 scope"
      v1_module: services.gochara_intensity.permission
      change_type: addition
      note: >-
        v1 permission.py documented the annual-layer gap honestly (G-3 scope exclusion);
        W2.7 implements the three missing annual-context generators as independent toggles
        reading from ClassContext fields populated by L3/L1 annual builders.
    module_path: services.gochara_v3.mechanisms.w27_annual_stack
    admission_state: candidate
    ablation_evidence_link: "W4.3"
    admission_ruling_id: pending
    toggle_key: w27_annual_stack
