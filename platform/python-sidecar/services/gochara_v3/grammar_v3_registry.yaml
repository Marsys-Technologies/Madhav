    module_path: services.gochara_v3.mechanisms.w25_kota_chakra
    admission_state: candidate
    ablation_evidence_link: "W4.3"
    admission_ruling_id: pending
    toggle_key: w25_kota_chakra

  - mechanism_id: w26_real_eclipses
    wave: "W2.6"
    lane: real_eclipses
    description: >-
      Real eclipse amplification — replaces the v1 node×luminary proximity proxy
      (uncited_extension=True) with actual eclipse events from bg_sky_calendar
      (solar/lunar, computed via pyswisseph's real eclipse geometry).
    citation_status: classically_cited
    classical_citation: >-
      BPHS — Graha yuddha and eclipse (grahaṇa) chapters treat eclipses as amplifiers
      of gochara effects when they occur near sensitive natal degrees.
      bg_sky_events / bg_sky_calendar table (31,059-row sky calendar) holds real eclipse events.
    v1_lineage:
      replaces: "eclipse_degree proxy via Rahu/Ketu node×luminary proximity (uncited_extension=True in primitives.py)"
      v1_module: services.gochara_grammar.primitives
      change_type: replacement
      note: >-
        v1 eclipse_degree used node-luminary conjunction as a proxy; that is necessary
        but not sufficient for eclipses (latitude alignment required). uncited_extension=True
        was flagged in the original code. v3 uses real eclipse geometry from bg_sky_calendar.
    module_path: services.gochara_v3.mechanisms.w26_real_eclipses
    admission_state: candidate
    ablation_evidence_link: "W4.3"
    admission_ruling_id: pending
    toggle_key: w26_real_eclipses

  - mechanism_id: w27_annual_stack
    wave: "W2.7"
    lane: annual_context_stack
