      primitives (station_retro_loop, eclipse_degree, planetary_return) to evaluate house
      targets instead of silently skipping them. Modifier is always 1.0; this mechanism
      produces enabling data, not a lambda multiplier.
    citation_status: classically_cited
    classical_citation: >-
      L1 chart_facts bhava cusp data via fact_id reference (§N.5);
      ga_positions_writer bhava_cusps rows (sripati_madhya) — Sripati system per Parashara.
      §N.5: L1 is the authority; cusp degrees are referenced by fact_id, never re-derived.
    v1_lineage:
      replaces: "enrich_targets in gochara_intensity/enrichment.py resolves bhava to sign only (documented gap lines 46-58)"
      v1_module: services.gochara_intensity.enrichment
      change_type: refinement
      note: >-
        v1 enrichment left target_longitude_deg=None for bhava targets; degree-hungry
        primitives guarded on None and silently skipped all house targets (zero lambda
        contribution). v3 adds sripati_madhya cusp degree from L1 chart_facts per §N.5.
    module_path: services.gochara_v3.mechanisms.w28_bhava_degrees
    admission_state: candidate
    ablation_evidence_link: "W4.3"
    admission_ruling_id: pending
    toggle_key: w28_bhava_degrees

