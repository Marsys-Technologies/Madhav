<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23b8860b%22/%3E%3C/svg%3E">
  <title>Suvarṇa Tracker</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Suvarṇa</h1>
    <span class="sub">elevation campaign · runs on the Nikaṣa engine</span>
  </div>
  <div id="live" class="live live-connecting" aria-live="polite"><span class="dot"></span><span id="live-text">Connecting…</span></div>
</header>

<section class="overall" aria-label="Overall progress">
  <div class="pct"><span id="pct">–</span><small>% of plan complete</small></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="pct-bar"></div></div>
  <div id="counts" class="counts"></div>
</section>

<section id="health" class="health" aria-label="System health"></section>

<section class="where">
  <div class="panel"><h2>Running now</h2><div id="now" class="list"></div></div>
  <div class="panel"><h2>Ready next</h2><div id="next" class="list"></div></div>
  <div class="panel attn"><h2>Needs attention</h2><div id="attention" class="list"></div></div>
</section>

<section class="panel">
  <h2>The plan <small>parallel tracks run side by side; sequential tracks run top to bottom; J1 is the one join</small></h2>
  <div id="plan" class="plan"></div>
</section>

<section class="grid2">
  <div class="panel"><h2>Metrics</h2><div id="metrics"></div></div>
  <div class="panel"><h2>Your decisions</h2><div id="decisions"></div></div>
</section>

<section class="grid2">
  <div class="panel"><h2>Activity <small>newest first</small></h2><div id="activity" class="feed"></div></div>
  <div class="panel"><h2>Completed</h2><div id="done" class="list"></div></div>
</section>

<footer class="foot"><span id="foot"></span></footer>
<script src="/static/app.js"></script>
</body>
</html>
