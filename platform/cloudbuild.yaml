steps:
  - id: copy-governance-files
    name: 'ubuntu'
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p platform/00_ARCHITECTURE
        cp 00_ARCHITECTURE/CAPABILITY_MANIFEST.json platform/00_ARCHITECTURE/CAPABILITY_MANIFEST.json
        cp 00_ARCHITECTURE/manifest_overrides.yaml platform/00_ARCHITECTURE/manifest_overrides.yaml
        cp 00_ARCHITECTURE/PLANNER_PROMPT_v1_0.md platform/00_ARCHITECTURE/PLANNER_PROMPT_v1_0.md
        cp 00_ARCHITECTURE/PLANNER_PROMPT_v2_0.md platform/00_ARCHITECTURE/PLANNER_PROMPT_v2_0.md
        cp -r 035_DISCOVERY_LAYER platform/035_DISCOVERY_LAYER
        cp -r 01_FACTS_LAYER platform/01_FACTS_LAYER
        cp -r 025_HOLISTIC_SYNTHESIS platform/025_HOLISTIC_SYNTHESIS

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'platform/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}'
      - '--build-arg'
      - 'BUILD_STATE_GCS_BASE=${_BUILD_STATE_GCS_BASE}'
      - '--build-arg'
      - 'NEXT_PUBLIC_MARSYS_FLAG_R10_INTERACTIVE_TABLES=true'
      - '--build-arg'
      - 'NEXT_PUBLIC_MARSYS_FLAG_R10_MERMAID=true'
      - '--build-arg'
      - 'NEXT_PUBLIC_MARSYS_FLAG_R10_CITATION_FRESHNESS=true'
      - '-t'
      - 'asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:latest'
      - 'platform'

images:
  - 'asia-south1-docker.pkg.dev/madhav-astrology/amjis/amjis-web:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
