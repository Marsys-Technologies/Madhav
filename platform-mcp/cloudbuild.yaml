# cloudbuild.yaml — Cloud Build configuration for platform-mcp (amjis-mcp service)
#
# Triggered from the platform-mcp/ directory by the Cloud Build trigger
# configured for the feature/mcp-server branch and main.
#
# Steps:
#   1. Install all dependencies (including devDependencies for tsc)
#   2. Build TypeScript → dist/
#   3. Docker build
#   4. Docker push
#   5. Deploy to Cloud Run as amjis-mcp in asia-south1
#
# OPERATOR NOTE:
#   Before the first deploy, update the PLATFORM_URL env var below to the
#   actual amjis-web Cloud Run service URL (e.g. https://amjis-web-abc123-el.a.run.app).
#   Also set MCP_INTERNAL_TOKEN and MCP_SERVICE_ACCOUNT_EMAIL to match what
#   is configured on the amjis-web service.

steps:
  # Step 1: Build Docker image (multi-stage — TS compile happens inside Docker)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/amjis-mcp:$COMMIT_SHA'
      - '.'

  # Step 2: Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/amjis-mcp:$COMMIT_SHA'

  # Step 3: Deploy to Cloud Run
  #   Service: amjis-mcp (sibling to amjis-web + amjis-sidecar)
  #   Region: asia-south1 (same as platform services)
  #   Memory: 512 MB (thin adapter — all logic runs on platform)
  #   Min instances: 1 (avoid cold start on first MCP call)
  #   Concurrency: 80 (default Cloud Run concurrency)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - amjis-mcp
      - '--image=gcr.io/$PROJECT_ID/amjis-mcp:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--memory=512Mi'
      - '--min-instances=1'
      - '--concurrency=80'
      - '--allow-unauthenticated'
      - '--set-env-vars=PLATFORM_URL=$_PLATFORM_URL'

images:
  - 'gcr.io/$PROJECT_ID/amjis-mcp:$COMMIT_SHA'

substitutions:
  _PLATFORM_URL: https://amjis-web-qm256lasva-el.a.run.app
