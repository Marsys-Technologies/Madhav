  - canonical_id: "RETRIEVAL_TOOL_msr_sql"
    tool_name: "msr_sql"
    tool_description: "Primary MSR signal retrieval from Cloud SQL msr_signals table. Filters by signal_type (yoga, aspect, graha, etc.), temporal_activation (natal-permanent, dasha-conditional, etc.), valence (benefic, malefic, mixed), entities_involved, and dasha_activation lords. Returns a full ToolBundle of matching MSR signals with confidence, layer, and domain metadata. Use for any query requiring direct MSR corpus access filtered by astrological category. The canonical L2.5 synthesis signal store covering all 514 MSR signals across the native's chart."
    query_schema:
      type: object
      properties:
        signal_type:
          type: array
          description: "yoga|aspect|graha|house|rashi|nakshatra|dasha|transit|composite"
        temporal_activation:
          type: array
          description: "natal-permanent|dasha-conditional|transit-conditional|composite"
        valence:
          type: array
          description: "benefic|malefic|mixed|neutral"
        entities_involved_any:
          type: array
          description: "Entity IDs (e.g. GRH.SUN, HSE.07, DSH.MD.KETU)"
        dasha_activation:
          type: array
          description: "Dasha lord names (e.g. Ketu, Mercury) — prepended with DSH.MD."
    linked_data_asset_ids: ["MSR"]
    expose_to_planner: true
    token_cost_hint: med
    layer: "L2.5"
    expose_to_chat: true
    native_id: "abhisek"
    produced_during: "M5-A-COV-S2"

