<svg width="1440" height="1024" viewBox="0 0 1440 1024" xmlns="http://www.w3.org/2000/svg" font-synthesis="none">
  <!--
    Paripraśna — hero mockup (static, presentation image)
    Scenario: J1 settled. Career question · Śani daśā · mid-2027 window · Śaśa Yoga gloss.
    Signature elevation shown: the prediction card with the kāla-rekhā time hairline (§6.9, v0.2),
    plus the arrival line, the verdict tick (§6.3.1), the closing rule, and the D-19 pickers.
    Marsys tokens only. View in a browser for the Google fonts to render.
  -->
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2D88A"/>
      <stop offset="0.38" stop-color="#E0B85A"/>
      <stop offset="0.72" stop-color="#B8862E"/>
      <stop offset="1" stop-color="#E8C77A"/>
    </linearGradient>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
    text { -webkit-font-smoothing: antialiased; }
    .serif { font-family:'Cormorant Garamond',Georgia,serif; }
    .sans  { font-family:'Inter',system-ui,sans-serif; }
    .mono  { font-family:'JetBrains Mono',ui-monospace,monospace; }
    .ink      { fill:#EBE3D2; }
    .ink-dim  { fill:rgba(235,227,210,0.64); }
    .gold     { fill:#C9A24C; }
    .gold-dim { fill:#A37F37; }
    .gold-mute{ fill:#7A5A1F; }
    .eyebrow  { font-family:'Inter',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:0.28em; }
    .caps18   { letter-spacing:0.18em; text-transform:uppercase; }
    .chip     { font-family:'JetBrains Mono',monospace; font-size:12px; fill:#C9A24C; }
  </style>

  <!-- page -->
  <rect x="0" y="0" width="1440" height="1024" fill="#050505"/>

  <!-- the instrument frame -->
  <rect x="48" y="28" width="1344" height="968" rx="16" fill="#000000" stroke="rgba(201,162,76,0.25)" stroke-width="1"/>

  <!-- ── header ─────────────────────────────────────────────── -->
  <text x="88" y="70" class="serif" font-size="25" font-weight="600" fill="url(#foil)" letter-spacing="0.02em">Paripraśna</text>
  <text x="240" y="66" class="sans caps18 ink-dim" font-size="10" font-weight="500">Abhisek Mohanty&#160;&#160;·&#160;&#160;05 Feb 1984&#160;&#160;·&#160;&#160;10:43&#160;&#160;·&#160;&#160;Bhubaneswar</text>
  <circle cx="1108" cy="62" r="2.5" fill="#C9A24C" opacity="0.7"/>
  <text x="1352" y="66" text-anchor="end" class="mono gold-mute" font-size="10" letter-spacing="0.04em">build 482012f1 · priors v4 · 28 Jul 2026</text>
  <line x1="48" y1="96" x2="1392" y2="96" stroke="rgba(201,162,76,0.25)" stroke-width="1"/>

  <!-- arrival line (chrome, once per session — P9) -->
  <circle cx="364" cy="119" r="2" fill="#A37F37"/>
  <text x="376" y="123" class="sans ink-dim" font-size="12.5" font-weight="400">Śani daśā, fourth year&#160;&#160;·&#160;&#160;one prediction window open — mid-2027</text>

  <!-- ── user question (right-set, serif italic) ────────────── -->
  <text x="1080" y="170" text-anchor="end" class="serif ink" font-size="20" font-style="italic" opacity="0.92">&#8220;Is a career change on the cards over the next two years —</text>
  <text x="1080" y="200" text-anchor="end" class="serif ink" font-size="20" font-style="italic" opacity="0.92">and if so, when?&#8221;</text>

  <!-- ── ① working band, settled (flipped in place) ─────────── -->
  <rect x="360" y="226" width="720" height="40" rx="8" fill="rgba(201,162,76,0.06)" stroke="rgba(201,162,76,0.25)"/>
  <rect x="376" y="240" width="9" height="9" transform="rotate(45 380.5 244.5)" fill="none" stroke="#C9A24C" stroke-width="1.4"/>
  <text x="398" y="250.5" class="eyebrow gold" font-size="10.5">Grounded in 14 chart factors · 3 classical sources</text>
  <text x="1036" y="250.5" text-anchor="end" class="mono gold-dim" font-size="11">12s</text>
  <path d="M 1052 244 l 5 6 l 5 -6" fill="none" stroke="#7A5A1F" stroke-width="1.4"/>

  <!-- ── ② answer region ────────────────────────────────────── -->
  <!-- verdict block (anatomy §6.3.1): 21/34, gold tick in margin -->
  <rect x="344" y="282" width="2" height="18" fill="#C9A24C"/>
  <text x="360" y="296" class="serif ink" font-size="21" font-weight="500">Yes — the two years ahead carry a genuine occupational shift,</text>
  <text x="360" y="330" class="serif ink" font-size="21" font-weight="500">and it is initiated by you rather than forced from outside.<tspan class="chip" dy="-4">&#160;&#10214;1&#10215;</tspan></text>

  <!-- elaboration 19/30 -->
  <text x="360" y="372" class="serif ink" font-size="19" font-weight="500">Saturn&#8217;s period — <tspan font-style="italic" fill="#C9A24C">Śani daśā</tspan> <tspan class="ink-dim" font-size="16">(the disciplinarian&#8217;s cycle)</tspan> — has run since late</text>
  <text x="360" y="402" class="serif ink" font-size="19" font-weight="500">2022, and it has been the engine behind the pressure in your work.<tspan class="chip" dy="-4">&#160;&#10214;2&#10215;</tspan></text>
  <text x="360" y="432" class="serif ink" font-size="19" font-weight="500">Under <tspan font-style="italic" fill="#C9A24C">Śaśa Yoga</tspan> <tspan class="ink-dim" font-size="16">(Saturn strongly placed)</tspan>, the chart rewards the long,</text>
  <text x="360" y="462" class="serif ink" font-size="19" font-weight="500">deliberate move, not the sudden leap.</text>

  <text x="360" y="500" class="serif ink" font-size="19" font-weight="500">Three independent indications converge on the middle of 2027:<tspan class="chip" dy="-4">&#160;&#10214;3&#10215;&#160;&#10214;4&#10215;</tspan></text>
  <text x="360" y="530" class="serif ink" font-size="19" font-weight="500">the tenth lord&#8217;s sub-period opening, Jupiter&#8217;s transit to the career</text>
  <text x="360" y="560" class="serif ink" font-size="19" font-weight="500">house, and a <tspan font-style="italic" fill="#C9A24C">rāja-yoga</tspan> <tspan class="ink-dim" font-size="16">(a rise in station)</tspan> active in the same window.<tspan class="chip" dy="-4">&#160;&#10214;5&#10215;</tspan></text>

  <!-- ── prediction card — the signature component (§6.9) ───── -->
  <rect x="360" y="584" width="720" height="144" rx="6" fill="rgba(201,162,76,0.03)" stroke="rgba(201,162,76,0.5)" stroke-width="1"/>
  <text x="380" y="612" class="eyebrow gold" font-size="9.5">Time-indexed reading&#160;&#160;·&#160;&#160;window open</text>
  <text x="1060" y="612" text-anchor="end" class="mono gold-mute" font-size="10">PR-2026-014</text>
  <text x="380" y="642" class="serif ink" font-size="18" font-weight="500">An occupational shift, self-initiated, most likely around mid-2027.</text>

  <!-- the kāla-rekhā: reading date → window far edge; window segment; today-dot -->
  <line x1="380" y1="668" x2="1060" y2="668" stroke="rgba(201,162,76,0.25)" stroke-width="1"/>
  <line x1="742" y1="668" x2="898" y2="668" stroke="#C9A24C" stroke-width="2"/>
  <line x1="742" y1="663" x2="742" y2="673" stroke="#A37F37" stroke-width="1"/>
  <line x1="898" y1="663" x2="898" y2="673" stroke="#A37F37" stroke-width="1"/>
  <circle cx="392" cy="668" r="3" fill="#C9A24C"/>
  <text x="392" y="686" text-anchor="middle" class="sans gold-mute" font-size="8.5" letter-spacing="0.2em">TODAY</text>
  <text x="820" y="686" text-anchor="middle" class="sans gold-mute" font-size="8.5" letter-spacing="0.2em">APR – AUG 2027</text>

  <!-- confidence phrase chip (the number is held, not thrown — P6) -->
  <rect x="380" y="696" width="262" height="22" rx="11" fill="rgba(201,162,76,0.06)" stroke="rgba(201,162,76,0.25)"/>
  <text x="511" y="710.5" text-anchor="middle" class="sans gold-dim" font-size="10.5" font-weight="500">more likely than not — hold it loosely</text>
  <text x="1060" y="710.5" text-anchor="end" class="sans gold-mute" font-size="10">calibration behind the phrase&#160;&#160;›</text>

  <!-- ── ③ grounding ledger ─────────────────────────────────── -->
  <line x1="360" y1="752" x2="1080" y2="752" stroke="rgba(201,162,76,0.25)" stroke-width="1"/>
  <text x="360" y="776" class="sans caps18 gold-dim" font-size="10" font-weight="600">Grounding — 14 chart factors · 3 classical sources</text>
  <text x="1080" y="776" text-anchor="end" class="sans gold-mute" font-size="9.5" letter-spacing="0.12em">VIEW ALL&#160;&#160;⌄</text>

  <!-- row 1 -->
  <text x="360" y="802" class="mono gold" font-size="10.5">1</text>
  <text x="392" y="803" class="serif ink" font-size="15.5">Saturn–Moon angle in the tenth</text>
  <text x="650" y="802" class="sans gold-mute" font-size="10.5">Bodha synthesis · verified against the chart</text>
  <circle cx="972" cy="798.5" r="3.2" fill="#C9A24C"/>
  <text x="984" y="802" class="sans gold-dim" font-size="9.5" letter-spacing="0.1em">WELL-GROUNDED</text>
  <line x1="360" y1="812" x2="1080" y2="812" stroke="rgba(201,162,76,0.1)" stroke-width="1"/>
  <!-- row 2 -->
  <text x="360" y="830" class="mono gold" font-size="10.5">2</text>
  <text x="392" y="831" class="serif ink" font-size="15.5">Śani daśā active since Nov 2022</text>
  <text x="650" y="830" class="sans gold-mute" font-size="10.5">Vimśottarī cycle</text>
  <circle cx="972" cy="826.5" r="3.2" fill="#C9A24C"/>
  <text x="984" y="830" class="sans gold-dim" font-size="9.5" letter-spacing="0.1em">WELL-GROUNDED</text>
  <line x1="360" y1="840" x2="1080" y2="840" stroke="rgba(201,162,76,0.1)" stroke-width="1"/>
  <!-- row 3 -->
  <text x="360" y="858" class="mono gold" font-size="10.5">3</text>
  <text x="392" y="859" class="serif ink" font-size="15.5">Tenth-lord sub-period opens mid-2027</text>
  <text x="650" y="858" class="sans gold-mute" font-size="10.5">daśā timing · Bṛhat Parāśara 34.12</text>
  <circle cx="972" cy="854.5" r="3.2" fill="#C9A24C"/>
  <text x="984" y="858" class="sans gold-dim" font-size="9.5" letter-spacing="0.1em">WELL-GROUNDED</text>
  <line x1="360" y1="868" x2="1080" y2="868" stroke="rgba(201,162,76,0.1)" stroke-width="1"/>
  <!-- row 4 — catalog-only, shape + label, never color -->
  <text x="360" y="886" class="mono gold" font-size="10.5">4</text>
  <text x="392" y="887" class="serif ink" font-size="15.5" opacity="0.85">Rāja-yoga activation in window</text>
  <text x="650" y="886" class="sans gold-mute" font-size="10.5">awaiting cross-verification</text>
  <circle cx="972" cy="882.5" r="3.2" fill="none" stroke="#7A5A1F" stroke-width="1.2"/>
  <text x="984" y="886" class="sans gold-mute" font-size="9.5" letter-spacing="0.1em">CATALOG-ONLY</text>

  <!-- the closing rule — drawn by the Seal (§5.3) -->
  <line x1="688" y1="910" x2="752" y2="910" stroke="rgba(201,162,76,0.25)" stroke-width="1"/>

  <!-- ── composer: D-19 pickers + field ─────────────────────── -->
  <!-- Depth -->
  <rect x="360" y="924" width="124" height="22" rx="11" fill="none" stroke="rgba(201,162,76,0.25)"/>
  <text x="374" y="938.5" class="sans gold-mute" font-size="8.5" letter-spacing="0.18em">DEPTH</text>
  <text x="424" y="939" class="sans ink" font-size="11.5">Auto</text>
  <path d="M 462 935 l 4 5 l 4 -5" fill="none" stroke="#7A5A1F" stroke-width="1.2"/>
  <!-- Length -->
  <rect x="494" y="924" width="130" height="22" rx="11" fill="none" stroke="rgba(201,162,76,0.25)"/>
  <text x="508" y="938.5" class="sans gold-mute" font-size="8.5" letter-spacing="0.18em">LENGTH</text>
  <text x="564" y="939" class="sans ink" font-size="11.5">Auto</text>
  <path d="M 602 935 l 4 5 l 4 -5" fill="none" stroke="#7A5A1F" stroke-width="1.2"/>
  <!-- Model -->
  <rect x="634" y="924" width="158" height="22" rx="11" fill="none" stroke="rgba(201,162,76,0.25)"/>
  <circle cx="650" cy="935" r="3" fill="#C9A24C"/>
  <text x="660" y="939" class="sans ink" font-size="11.5">Claude Opus</text>
  <text x="738" y="938.5" class="mono gold-mute" font-size="9">A</text>
  <path d="M 752 935 l 4 5 l 4 -5" fill="none" stroke="#7A5A1F" stroke-width="1.2"/>
  <!-- footnote -->
  <text x="1080" y="939" text-anchor="end" class="mono gold-mute" font-size="10" letter-spacing="0.03em">acharya-grade · one register</text>

  <!-- field -->
  <rect x="360" y="956" width="720" height="34" rx="10" fill="#000000" stroke="rgba(201,162,76,0.25)"/>
  <text x="378" y="978" class="serif gold-mute" font-size="16" font-style="italic">Ask the chart</text>
  <circle cx="1058" cy="973" r="12" fill="rgba(201,162,76,0.06)" stroke="rgba(201,162,76,0.25)"/>
  <path d="M 1058 978 v -10 m -4 4 l 4 -4 l 4 4" fill="none" stroke="#C9A24C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
