<!doctype html>
<html lang="en">

<title>Kāla · Project progress</title>
<style>
:root{color-scheme:light;--page:#f4f5f7;--surface:#fff;--ink:#20262e;--muted:#596573;--line:#dfe4e9;--done:#26804b;--progress:#246ac1;--ready:#147d80;--waiting:#7e8893;--stuck:#af6810;--danger:#bb3835;--chip:#edf0f3;--shadow:0 2px 8px #20262e04}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#15191e;--surface:#1e242c;--ink:#edf0f4;--muted:#acb5c0;--line:#343e49;--done:#66bd89;--progress:#80b6ff;--ready:#6fc2c2;--waiting:#98a1ad;--stuck:#f1ba69;--danger:#ff9490;--chip:#2d3540;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--page:#15191e;--surface:#1e242c;--ink:#edf0f4;--muted:#acb5c0;--line:#343e49;--done:#66bd89;--progress:#80b6ff;--ready:#6fc2c2;--waiting:#98a1ad;--stuck:#f1ba69;--danger:#ff9490;--chip:#2d3540;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,summary{font:inherit}button{background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:8px 13px;cursor:pointer}button:hover{background:var(--chip)}:focus-visible{outline:3px solid var(--progress);outline-offset:4px}main{max-width:1180px;margin:auto;padding:38px 26px 50px}header{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;margin-bottom:25px}h1{font-size:29px;letter-spacing:-.8px;line-height:1.2;margin:6px 0 10px;font-weight:650}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:650;color:var(--muted)}.intro{margin:0;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:flex-end}.live{font-size:13px;color:var(--done);max-width:240px}.live::before{content:'●';padding-right:6px}.live.amber{color:var(--stuck)}.live.red{color:var(--danger)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px}h2{font-size:19px;letter-spacing:-.3px;margin:0 0 5px;font-weight:650}.sub{color:var(--muted);margin:0 0 20px;font-size:13px}.headline{display:grid;grid-template-columns:minmax(200px,1.05fr) minmax(0,2fr);gap:30px}.primary{border-right:1px solid var(--line);padding-right:28px}.big{font-size:66px;font-weight:650;line-height:1.1;letter-spacing:-3px;font-variant-numeric:tabular-nums}.big span{font-size:33px;letter-spacing:-1px}.complete-label{margin:4px 0 14px;color:var(--muted)}.progress-track{height:9px;background:var(--chip);border-radius:20px;overflow:hidden}.progress-fill{height:100%;background:var(--done)}.fine{font-size:12px;color:var(--muted);margin-top:10px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 18px;align-content:center}.metric-value{display:block;font-size:25px;line-height:1.3;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.metric-label{display:block;color:var(--muted);font-size:12px;line-height:1.45;margin-top:4px}.metric-note{display:block;font-size:11px;color:var(--muted);margin-top:4px}.engine{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);margin-top:22px;padding-top:16px;font-size:13px;flex-wrap:wrap}.engine-label{color:var(--muted)}.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;line-height:1.5;white-space:normal}.done{color:var(--done)}.in_progress{color:var(--progress)}.ready{color:var(--ready)}.waiting{color:var(--waiting)}.stuck{color:var(--stuck)}.error{color:var(--danger)}.unknown{color:var(--muted)}.notice{border-left:3px solid var(--stuck);padding:12px 16px;background:var(--surface);border-radius:7px;font-size:13px;margin-bottom:16px;overflow-wrap:anywhere}.notice p{margin:3px 0}.chart svg{width:100%;height:auto;display:block;overflow:visible}.chart{margin-top:12px}.chart text{fill:var(--muted);font-family:inherit;font-size:12px}.chart .grid{stroke:var(--line);stroke-width:1}.chart .total{stroke:var(--waiting);stroke-width:1.5;stroke-dasharray:6 5}.chart .scope-marker{stroke:var(--stuck);stroke-dasharray:3 4}.chart .wave4{stroke:var(--progress)}.chart .rest{stroke:var(--ready)}.chart .actual{stroke:var(--done);stroke-width:3;fill:none}.chart .actual.wave4{stroke:var(--progress)}.chart .actual.rest{stroke:var(--ready)}.chart .area{fill:var(--done);opacity:.08}.legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}.legend .sample{width:22px;border-top:2px solid currentColor}.legend .sample.dashed{border-top-style:dashed}.workstream{border-top:1px solid var(--line)}.workstream:first-of-type{border-top:0}.workstream summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1.05fr 1fr 25px;gap:24px;align-items:center;padding:20px 0}.workstream summary::-webkit-details-marker{display:none}.track-title{font-size:15px;font-weight:600}.track-description{font-size:12px;color:var(--muted);margin:3px 0 0}.track-next{font-size:12px;margin-top:8px;color:var(--muted)}.chevron{color:var(--muted);font-size:20px;text-align:center}.workstream[open] .chevron{transform:rotate(90deg)}.bar{height:10px;border-radius:10px;overflow:hidden;display:flex;background:var(--chip)}.bar span{height:100%}.bar .done{background:var(--done)}.bar .in_progress{background:var(--progress)}.bar .ready{background:var(--ready)}.bar .waiting{background:var(--waiting)}.bar .stuck{background:var(--stuck)}.track-stat{font-size:12px;margin-top:8px;color:var(--muted)}.items{padding-bottom:13px}.item{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}.item-main{min-width:0}.item-title{font-weight:550;overflow-wrap:anywhere}.item-id{font-size:10px;color:var(--muted);font-weight:400;margin-left:7px;white-space:nowrap}.item-detail{font-size:12px;color:var(--muted);margin:5px 0 0;overflow-wrap:anywhere}.item-meta{font-size:11px;color:var(--muted);margin-top:4px}.item .chip{flex-shrink:0;max-width:145px}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.two-cols>.panel{min-width:0}.empty{padding:18px 0 10px;color:var(--muted);font-size:13px}.agent{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.agent:first-child{border-top:0}.agent-icon{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--progress);font-size:13px;flex-shrink:0}.minor-heading{font-size:12px;color:var(--muted);font-weight:600;margin:20px 0 6px}.milestones{margin-top:15px}.milestone{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:14px;padding:12px 0;align-items:center}.milestone-point{height:10px;width:10px;border:2px solid currentColor;border-radius:50%;position:relative}.milestone:not(:last-child) .milestone-point::after{content:'';position:absolute;left:2px;top:10px;width:2px;height:31px;background:var(--line)}.milestone .chip{max-width:145px}.milestone-title{font-size:13px;overflow-wrap:anywhere}.completed-date{color:var(--muted);font-size:11px;white-space:nowrap}footer{font-size:12px;color:var(--muted);padding:4px 0}a{color:inherit}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.progress-line{display:flex;gap:12px;justify-content:space-between;border-top:1px solid var(--line);padding:9px 0;font-size:12px}.progress-line strong{white-space:nowrap;font-variant-numeric:tabular-nums}.closure-table{width:100%;border-collapse:collapse;margin-top:22px;font-size:13px}.closure-table th,.closure-table td{padding:10px 6px;text-align:right;border-top:1px solid var(--line)}.closure-table th:first-child{text-align:left}.closure-table caption{text-align:left;font-weight:600;margin-bottom:8px}.closure-table thead{color:var(--muted);font-size:12px}.closure-table tbody th{font-weight:400}.closure-table td{font-variant-numeric:tabular-nums}
@media(max-width:850px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.headline{grid-template-columns:190px minmax(0,1fr);gap:22px}.two-cols{grid-template-columns:1fr}.workstream summary{gap:16px;grid-template-columns:1fr 1fr 20px}}
@media(max-width:580px){main{padding:25px 16px 35px}header{display:block}.controls{justify-content:space-between;margin-top:20px}h1{font-size:26px}.panel{padding:20px 17px}.headline{display:block}.primary{border-right:0;border-bottom:1px solid var(--line);padding:0 0 22px;margin-bottom:22px}.big{font-size:60px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 18px}.workstream summary{grid-template-columns:minmax(0,1fr) 18px;gap:8px}.track-progress{grid-column:1;grid-row:2}.chevron{grid-column:2;grid-row:1/3}.item{gap:10px}.item .chip,.milestone .chip{max-width:108px;font-size:10px}.item-id{white-space:normal}.milestone{gap:10px}.chart text{font-size:14px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">Kāla project</div><h1>A clear view of progress</h1><p class="intro">What is finished, what is moving, and what needs attention.</p></div><div class="controls"><span id="live" class="live amber" role="status">Connecting…</span><button id="theme" type="button" aria-label="Switch colour mode">Dark mode</button></div></header>
<div id="alerts" aria-live="polite"></div>
<div id="dashboard" aria-busy="true"><div class="panel empty">Loading the latest project progress…</div></div>
<noscript><div class="notice">Enable JavaScript to see the live project progress.</div></noscript>
<footer>Refreshes every 10 seconds. Completion means finished or explicitly not needed. History uses recorded completion dates; reopened work is excluded.</footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date = value => { if(!value) return 'Date unavailable'; const d=new Date(value);return Number.isNaN(d.getTime())?'Date unavailable':d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); };
const since = value => {if(!value)return 'Start time unavailable';const seconds=Math.max(0,Math.floor((Date.now()-new Date(value).getTime())/1000));if(!Number.isFinite(seconds))return 'Start time unavailable';return seconds<60?`${seconds} s`:seconds<3600?`${Math.floor(seconds/60)} min`:seconds<86400?`${Math.floor(seconds/3600)} h ${Math.floor(seconds%3600/60)} min`:`${Math.floor(seconds/86400)} days ${Math.floor(seconds%86400/3600)} h`;};
const quantity = v => v===null || v===undefined ? '—' : String(v);
const sourceNames={tracker:'Project progress',events:'Completion history',processes:'Agent activity',direct_jobs:'Codex jobs',fleet_jobs:'Campaign jobs',job_timing:'Agent working time'};
const groupNames={done:'Done',in_progress:'In progress',ready:'Ready to start',waiting:'Waiting on earlier work',stuck:'Stuck or set aside'};
let summary=null, requestFailureSince=null, polling=false;
const unavailable = (source='tracker') => {const s=summary?.sources?.[source];return `<div class="empty">Data unavailable since ${esc(dateTime(s?.unavailable_since || requestFailureSince))}.</div>`;};
function dateTime(v){return v?new Date(v).toLocaleString():'the latest check';}
function itemRow(i,options={}){return `<div class="item"><div class="item-main"><div class="item-title">${esc(i.title)}<span class="item-id">${esc(i.id)}</span></div>${options.detail?`<p class="item-detail">${esc(i.detail || 'No reason has been recorded.')}</p>`:''}${options.since?`<div class="item-meta">${i.since?`${i.status==='review'?'Work began':'Started'} ${esc(since(i.since))} ago · ${esc(date(i.since))}`:'Start time unavailable'}</div>`:''}${options.completed?`<div class="item-meta">${esc(date(i.completed_at))}</div>`:''}</div>${options.completed?'':`<span class="chip ${esc(i.group)}">${esc(i.status_label)}</span>`}</div>`;}
function itemList(items,empty,options={}){return items===null||items===undefined?unavailable():items.length?items.map(i=>itemRow(i,options)).join(''):`<div class="empty">${esc(empty)}</div>`;}
function metric(value,label,note=''){return `<div><span class="metric-value">${esc(quantity(value))}</span><span class="metric-label">${esc(label)}</span>${note?`<span class="metric-note">${esc(note)}</span>`:''}</div>`;}
function headline(){const m=summary?.metrics, a=summary?.agents;
 const pct=m?.percent;const engine=summary?.engine_status;const agentNote=a?.by_engine?`${a.by_engine.Codex} Codex · ${a.by_engine.Claude} Claude${a.by_engine.Unknown?' · '+a.by_engine.Unknown+' unknown':''}`:'Count unavailable';
 return `<section class="panel" aria-label="Essential progress"><div class="headline"><div class="primary"><div class="big">${pct===null||pct===undefined?'—':esc(pct)}${pct!==null&&pct!==undefined?'<span>%</span>':''}</div><div class="complete-label">complete</div><div class="progress-track" role="progressbar" aria-label="Project completion" ${pct!==null&&pct!==undefined?`aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"`:'aria-valuetext="Unavailable"'}><div class="progress-fill" style="width:${pct??0}%"></div></div><div class="fine">${m?`${m.complete} of ${m.total} complete · ${m.not_applicable} not needed`:'Data unavailable'}</div>${(summary?.progress_lines||[]).map(r=>`<div class="progress-line"><span>${esc(r.label)}</span><strong>${r.complete} / ${r.total}</strong></div>`).join('')}<div class="fine">Each line counts finished and not-needed items.</div></div><div class="metrics">${metric(m?.in_progress,'In progress or being checked')}${metric(m?.ready,'Ready to start')}${metric(m?.waiting,'Waiting on earlier work')}${metric(m?.stuck,'Stuck or set aside')}${metric(m?.pace_per_day===null||m?.pace_per_day===undefined?null:m.pace_per_day.toFixed(1),'Items per day','7-day average · recorded completions')}${metric(m?.projected_finish?date(m.projected_finish+'T12:00:00Z'):null,'Projected finish','At current pace')}${metric(a?.count,'Agents working now',agentNote)}</div></div>${closureTable()}<div class="engine"><span class="engine-label">Engine status</span><span class="chip ${engine==='running'?'in_progress':engine==='emergency hold'?'error':engine==='paused'?'stuck':'unknown'}">${esc(engine?engine[0].toUpperCase()+engine.slice(1):'Unavailable')}</span><span class="fine" style="margin:0">${engine==='running'?'The tracker engine is responding.':engine==='paused'?'New work is paused.':engine==='emergency hold'?'An emergency hold has been reported.':'There is no current signal confirming the engine state.'}</span></div></section>`;
}
function closureTable(){const m=summary?.metrics;
 const cell=(window,key)=>quantity(m?.['closures_'+window]?.[key]);
 const hours=window=>{const v=m?.['agent_hours_per_closure_'+window];return v===null||v===undefined?'—':v.toFixed(2);};
 return `<table class="closure-table"><caption>Work closed and agent time</caption><thead><tr><th scope="col">Recorded closures</th><th scope="col">Last 24 hours</th><th scope="col">Last 7 days</th></tr></thead><tbody>${[['capability','Capabilities · code work'],['verdict','Verdicts · review checkpoints'],['planning','Planning · plans, registration and other records']].map(([key,label])=>`<tr><th scope="row">${label}</th><td>${cell('24h',key)}</td><td>${cell('7d',key)}</td></tr>`).join('')}<tr><th scope="row">Total items closed</th><td>${quantity(m?.completed_24h)}</td><td>${quantity(m?.completed_7d)}</td></tr><tr><th scope="row">Agent-hours per closed item</th><td>${hours('24h')}</td><td>${hours('7d')}</td></tr></tbody></table><div class="fine">One agent working for one hour is one agent-hour. Counts use dated, currently finished items. Not-needed items count as complete above, but are outside closure counts. Time includes all finished Codex jobs in each window, including checks and repair attempts. It runs from launch to the finish marker; delays recording a finish also count. No closures or missing timing data gives “—”.</div>`;
}
function chart(){const h=summary?.history;if(!h)return summary?.sources?.tracker?.available?unavailable('events'):unavailable();const s=h.series;
 if(!s.length)return '<div class="empty">No dated completions yet.</div>';
 const width=Math.min(900,Math.max(300,document.documentElement.clientWidth-100)),height=300,left=43,right=20,top=54,bottom=42,innerWidth=width-left-right,innerHeight=height-top-bottom;
 const max=Math.max(1,...s.map(p=>p.total??p.complete)),start=Date.parse(s[0].at),end=Date.parse(s[s.length-1].at);
 const x=at=>left+(Date.parse(at)-start)/Math.max(1,end-start)*innerWidth,y=v=>top+innerHeight-(v/max)*innerHeight;
 const ticks=[0,.25,.5,.75,1].map(f=>Math.round(max*f)).filter((v,i,a)=>a.indexOf(v)===i);
 const grid=ticks.map(v=>`<line class="grid" x1="${left}" y1="${y(v)}" x2="${width-right}" y2="${y(v)}"/><text x="${left-9}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
 const labels=[0,Math.floor((s.length-1)/2),s.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(s[i].at)}" y="${height-13}" text-anchor="${i===0?'start':i===s.length-1?'end':'middle'}">${esc(new Date(s[i].at).toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'}))}</text>`).join('');
 let scope='',previous=null;for(const p of s){if(p.total===null){previous=null;continue;}const xp=x(p.at);scope+=previous===null?`M ${xp},${y(p.total)} `:`H ${xp} V ${y(p.total)} `;previous=p.total;}
 const lines=[['wave4','wave4','Wave 4'],['rest','rest','Everything else'],['complete','','Total']].map(([key,cls,label])=>`<polyline class="actual ${cls}" points="${s.map(p=>`${x(p.at)},${y(p[key])}`).join(' ')}"><title>${label}: recorded complete items</title></polyline>`).join('');
 const markers=h.scope_changes.map(c=>`<line class="scope-marker" x1="${x(c.at)}" y1="${top-10}" x2="${x(c.at)}" y2="${height-bottom}"><title>${esc(c.label)} · ${esc(c.at)}</title></line><text x="${Math.max(left+55,Math.min(width-right-55,x(c.at)))}" y="${top-21}" text-anchor="middle">${c.before} → ${c.after} items</text>`).join('');
 return `<div class="chart"><svg viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="chart-title chart-description"><title id="chart-title">Complete items: Wave 4, everything else and total</title><desc id="chart-description">${h.dated_complete} complete items with recorded dates; ${h.undated_complete} complete items have no usable date. Complete means finished or not needed. Scope changes: ${esc(h.scope_changes.map(c=>c.label).join('; ')||'none recorded')}. Days are in UTC.</desc>${grid}<path class="total" fill="none" d="${scope}"/>${markers}${lines}${labels}</svg></div><div class="legend"><span style="color:var(--progress)"><i class="sample"></i>Wave 4 · Gochara 5.0</span><span style="color:var(--ready)"><i class="sample"></i>Everything else</span><span class="done"><i class="sample"></i>Total complete</span><span><i class="sample dashed"></i>Items in scope</span></div><div class="fine">${h.scope_changes.map(c=>`${esc(c.label)} (${esc(c.at.replace('T',' ').replace('+00:00',' UTC'))})`).join('<br>')}</div><div class="fine">${h.undated_complete} complete items lack a usable completion date and are outside these history lines; they remain in the headline. Recorded completions include not-needed items where dated. Reopened work is excluded. Scope history uses the owner’s recorded change and later tracker observations during this server run; earlier changes and Wave 4 scope sizes are unknown. Days use UTC.</div>`;
}
function workstreams(){if(!summary?.tracks)return unavailable();return summary.tracks.map(t=>{
 const counts=t.counts;const label=Object.entries(counts).map(([g,n])=>`${n} ${groupNames[g].toLowerCase()}`).join(', ');
 return `<details class="workstream" data-track="${esc(t.id)}"><summary><div><div class="track-title">${esc(t.title)}</div><p class="track-description">${esc(t.plain)}</p></div><div class="track-progress"><div class="bar" role="img" aria-label="${esc(label)}">${Object.entries(counts).map(([g,n])=>n?`<span class="${g}" style="width:${n/Math.max(t.total,1)*100}%"></span>`:'').join('')}</div><div class="track-stat">${counts.done} of ${t.total} done${t.items.some(i=>i.status==='not_applicable')?' (including not needed)':''}</div><div class="track-next">${t.next.length?'Next: '+t.next.map(i=>esc(i.title)).join(' · '):t.total===counts.done?'All listed work complete.':'No ready or active items.'}</div></div><span class="chevron" aria-hidden="true">›</span></summary><div class="items">${itemList(t.items,'No items listed in this workstream.')}</div></details>`;
 }).join('');}
function working(){const a=summary?.agents;let content='';
 if(!a?.complete)content+=unavailable(!summary?.sources?.processes?.available?'processes':!summary?.sources?.direct_jobs?.available?'direct_jobs':'fleet_jobs');
 if(a?.running?.length){content+=a.running.map(agent=>`<div class="agent"><span class="agent-icon" aria-hidden="true">${agent.engine==='Codex'?'C':'Cl'}</span><div class="item-main"><div class="item-title">${esc(agent.label)}${agent.item?`<span class="item-id">${esc(agent.item)}</span>`:''}</div><div class="item-meta">${esc(agent.engine)} · ${agent.started_at?'Working for '+esc(since(agent.started_at)):'Start time unavailable'}</div></div></div>`).join('');}
 else if(a?.complete)content+='<div class="empty">No agents are working at this moment.</div>';
 content+='<h3 class="minor-heading">Work in progress or being checked</h3>'+itemList(summary?.working_items,'No items are currently in progress or review.',{detail:true,since:true});return content;
}
function attention(){let content=itemList(summary?.attention,'No stuck or set-aside items.',{detail:true});content+='<h3 class="minor-heading">Decisions waiting on you</h3>';const decisions=summary?.owner_decisions;
 content+=decisions===null||decisions===undefined?unavailable():decisions.length?decisions.map(d=>`<div class="item"><div class="item-main"><div class="item-title">${esc(d.title)}<span class="item-id">${esc(d.id)}</span></div><p class="item-detail">${esc(d.detail||'A decision is needed before dependent work can continue.')}</p></div><span class="chip stuck">Your decision</span></div>`).join(''):'<div class="empty">No decisions are waiting on you.</div>';return content;}
function milestones(){const list=summary?.milestones;if(!list)return unavailable();return `<div class="milestones">${list.map(i=>`<div class="milestone"><span class="milestone-point ${esc(i.group)}" aria-hidden="true"></span><div class="milestone-title">${esc(i.title)}<span class="item-id">${esc(i.id)}</span></div><span class="chip ${esc(i.group)}">${esc(i.status_label)}</span></div>`).join('')}</div>`;}
function render(){const open=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.track));const focused=document.activeElement;const focusedTrack=focused?.closest?.('details')?.dataset.track;
 $('dashboard').innerHTML=headline()+`<section class="panel"><h2>Progress over time</h2><p class="sub">Completed work accumulates toward the full project.</p>${chart()}</section><section class="panel"><h2>Workstreams</h2><p class="sub">Open a row to see every item.</p><div class="legend" style="margin-bottom:8px">${Object.entries(groupNames).map(([g,label])=>`<span><i class="dot ${g}"></i>${esc(label)}</span>`).join('')}</div>${workstreams()}</section><div class="two-cols"><section class="panel"><h2>Working on now</h2><p class="sub">People's agents and the items currently moving.</p>${working()}</section><section class="panel"><h2>Up next</h2><p class="sub">Ready work, in the project's order.</p>${itemList(summary?.up_next,'No items are ready to start.')}</section></div><section class="panel"><h2>Needs attention</h2><p class="sub">Stuck work, work set aside and decisions waiting on you.</p>${attention()}</section><div class="two-cols"><section class="panel"><h2>Milestones</h2><p class="sub">Independent batch reviews, then the project close.</p>${milestones()}</section><section class="panel"><h2>Recently completed</h2><p class="sub">The latest 20 items with recorded completion dates.</p>${summary?.recently_completed===null||summary?.recently_completed===undefined?(summary?.sources?.tracker?.available?unavailable('events'):unavailable()):itemList(summary.recently_completed,'No dated completions yet.',{completed:true})}</section></div>`;
 document.querySelectorAll('details').forEach(d=>{if(open.has(d.dataset.track))d.open=true;if(focusedTrack===d.dataset.track)d.querySelector('summary').focus({preventScroll:true});});
 $('dashboard').setAttribute('aria-busy','false');renderAlerts();freshness();}
function renderAlerts(){let messages=[];if(requestFailureSince)messages.push(`Dashboard data unavailable since ${dateTime(requestFailureSince)}.`);
 else for(const [key,s] of Object.entries(summary?.sources||{})){if(!s.available)messages.push(`${sourceNames[key]||'Data'}: data unavailable since ${dateTime(s.unavailable_since)}.`);}
 if(summary?.sources?.tracker?.available && Date.now()-new Date(summary.observed_at).getTime()>60000) messages.push(`Progress was last observed at ${dateTime(summary.observed_at)}. These are the last known figures; current progress may have changed.`);
 $('alerts').innerHTML=messages.length?`<div class="notice">${messages.map(m=>`<p>${esc(m)}</p>`).join('')}</div>`:'';}
function freshness(){const live=$('live');if(requestFailureSince||!summary?.sources?.tracker?.available){live.className='live red';live.textContent='Data unavailable';return;}
 const seconds=Math.max(0,Math.floor((Date.now()-new Date(summary.observed_at).getTime())/1000));live.className='live'+(seconds>300?' red':seconds>60?' amber':'');live.textContent=`${seconds>300?'Out of date':seconds>60?'Update delayed':'Live'} · updated ${seconds<60?seconds+' s':Math.floor(seconds/60)+' min'} ago`;
 // A separately accessible timestamp retains the precise observation boundary.
 live.title='Project data observed '+dateTime(summary.observed_at);}
async function refresh(){if(polling)return;polling=true;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),130000);
 try{const response=await fetch('/api/summary',{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('Unavailable');const value=await response.json();if(!value.sources||!value.generated_at)throw new Error('Invalid summary');summary=value;requestFailureSince=null;render();}
 catch(_){requestFailureSince=requestFailureSince||new Date().toISOString();summary=null;render();}
 finally{clearTimeout(timeout);polling=false;}}
function setTheme(mode){document.documentElement.dataset.theme=mode;$('theme').textContent=mode==='dark'?'Light mode':'Dark mode';$('theme').setAttribute('aria-label',`Switch to ${mode==='dark'?'light':'dark'} mode`);}
let savedTheme=null;try{savedTheme=localStorage.getItem('kala-progress-theme');}catch(_){}
setTheme(savedTheme==='light'||savedTheme==='dark'?savedTheme:matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
$('theme').addEventListener('click',()=>{const mode=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(mode);try{localStorage.setItem('kala-progress-theme',mode);}catch(_){}});
window.addEventListener('resize',()=>{if(summary)render();});
refresh();setInterval(refresh,10000);setInterval(()=>{freshness();renderAlerts();},1000);
</script>
</body>
</html>
