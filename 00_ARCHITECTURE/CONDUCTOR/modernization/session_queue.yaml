# ─────────────────────────────────────────────────────────────────────────────
# session_queue.yaml — Platform Modernization Program (autonomous execution)
# Conductor walks this queue, hands eligible units to streams, runs check_commands
# (automated gates), cherry-picks green units to main, auto-rolls back on red.
# ZERO human approval gates. Safety = automated rails (see execution plan §6).
# ─────────────────────────────────────────────────────────────────────────────
program: PLATFORM_MODERNIZATION
plan:            00_ARCHITECTURE/PLATFORM_MODERNIZATION_MASTER_PLAN_v2_0.md   # v2.1
execution_plan:  00_ARCHITECTURE/PLATFORM_MODERNIZATION_EXECUTION_PLAN_v1_0.md
program_state:   00_ARCHITECTURE/CONDUCTOR/modernization/PROGRAM_STATE.md
integration:     conductor_cherry_pick_to_main_on_green
human_gates:     none
prod_mode:       zero_touch          # prod DB/deploy/secret/flag ops run autonomously
context_budget_subagents: 20         # re-kick after this many sub-agent spawns

streams:
  A: { worktree: ../MadhavStreamA, branch: prog/stream-a }
  B: { worktree: ../MadhavStreamB, branch: prog/stream-b }
  C: { worktree: ../MadhavStreamC, branch: prog/stream-c }

# Hard gates — a check_command exiting 0 = GREEN (barrier opens). Until green, any
# unit listing the gate in blockedBy is INELIGIBLE.
gates:
  naming_ci:        { status: PENDING, check: "python platform/scripts/governance/naming_lint.py" }
  jh_oracle_pinned: { status: RED,     check: "test -f python-sidecar/natal_engine/fixtures/jh_oracle.json", note: "NATIVE INPUT REQUIRED: pin JH version + ayanamsha, capture reference outputs" }
  G1_jh_parity:     { status: PENDING, check: "pytest python-sidecar/natal_engine/tests/test_jh_parity.py -q" }
  G2_authz_live:    { status: PENDING, check: "pnpm vitest run platform/src/lib/auth/__tests__/authorize_chart_access.test.ts" }
  G3_contract:      { status: PENDING, check: "pnpm vitest run platform/src/lib/contract/__tests__/unified_contract.test.ts" }
  G4_no_native_lit: { status: PENDING, check: "platform/scripts/governance/assert_no_native_literal.sh" }
  G5b_onfinish:     { status: GREEN,   check: "pnpm vitest run platform/src/app/api/chat/__tests__/onfinish_parity.golden.test.ts", note: "Set by 3.cutover 2026-05-28; 18/18 golden tests; runOnFinishWriteThrough closes 6 parity gaps. NB: run from platform/ for @/ alias resolution." }
  G6_tool_coverage: { status: PENDING, check: "pnpm vitest run platform/src/lib/contract/__tests__/tool_asset_coverage.test.ts", note: "100% asset coverage + 0 orphaned tools + 0 redundant duplicates (data_coverage tool)" }

