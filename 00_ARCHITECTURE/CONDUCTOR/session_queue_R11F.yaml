  - id: F-S4
    title: "Route.ts D.3 wiring — Gemini cachedContent integration"
    status: pending
    parallel_group: null
    commit_message: "feat(r11f-s4): wire Gemini cachedContent API into route.ts dispatch"
    acceptance_criteria:
      - "AC.S4.1: R11D_GEMINI_CACHE referenced in route.ts"
      - "AC.S4.2: adapter.cache() called + min-token threshold check"
      - "AC.S4.3: GoogleAdapter.chat() reads cachedContentName from cacheConfig"
      - "AC.S4.4: sub-threshold fallback works"
      - "AC.S4.5: vitest 0 failures"
      - "AC.S4.6: unit test for payload structure"
    prompt: >
      D.3 Gemini cache wiring.

      Step 1: Enhance GoogleAdapter.chat() (google/adapter.ts) to read
        request.cacheConfig?.providerPayload?.cachedContentName
        and pass as providerOptions.google.cachedContent to streamText().

      Step 2: In route.ts dispatch block, after building adapterChatReq,
        when configService.getFlag('R11D_GEMINI_CACHE') AND adapterId === 'google':
          a. Call adapter.cache({ cacheMode: 'cached_content_api', breakpointPositions: [] })
          b. Estimate token count: Math.ceil(systemContent?.length ?? 0 / 4)
          c. If tokens >= GEMINI_CACHE_MIN_TOKENS (32768 from cached_content.ts):
             - Build cachedContentPayload using buildCacheCreatePayload()
             - Create cachedContent via raw fetch to Gemini API:
               POST https://generativelanguage.googleapis.com/v1beta/cachedContents
               ?key=${process.env.GOOGLE_GENERATIVE_AI_API_KEY}
               body: JSON.stringify(cachedContentPayload)
             - Extract name from response json
             - Set adapterChatReq.cacheConfig = { ...cacheResponse, providerPayload: { cachedContentName: name } }
          d. If tokens < threshold: log warning, skip cache, proceed normally

      Step 3: Import buildCacheCreatePayload, GEMINI_CACHE_MIN_TOKENS from google/cached_content.ts

      Step 4: Write unit test for payload structure.
      Run vitest. Commit. Report PASS/FAIL.
    passed_at: null
    commit_sha: null

