# Governing design: L4_PHALA_CAMPAIGN_PLAN_v2_0.md + L4_PHALA_AUTONOMOUS_EXECUTION_v2_0.md
# Inputs: 12 briefs (CLAUDECODE_BRIEF_U1–U4 + CLAUDECODE_BRIEF_L4_PH_*),
#         L4_PHALA_REGISTRY_AND_WIRING_SPEC_v1_0.md, L4_PHALA_DECISIONS_LEDGER_v1_0.md (D20–D46),
#         L4_PHALA_HOLISTIC_REVIEW_v1_0.md (F1/F3/F5).
# Framework: AUTONOMY_RESILIENCE_PATTERN + BUILD_GUARANTOR_SWARM_CHARTER (reuse, do not reinvent).
