    SCOPE: Amend PLANNER_PROMPT_v2_0.md with 5 new R-rules (methodology Part IV, rules 1–5).
    Do NOT touch application code. This session only edits governance/prompt files.
    Read the current PLANNER_PROMPT_v2_0.md fully before amending.

    Add the following R-rules to the appropriate section of PLANNER_PROMPT_v2_0.md.
