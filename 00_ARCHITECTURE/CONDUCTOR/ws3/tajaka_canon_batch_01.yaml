  # ─── CH 6 — MANAHOO: INTERCEPTED ASPECT (DESTROYED PROMISE) ────────────────

  - rule_id: TAJAKA.ch6.v2.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch6.v2"
      text_excerpt: |
        "Manahoo (also Manauh) is the most destructive configuration in Tajaka. It
        occurs when a planet that was in Itthasala with another exits its sign before
        the aspect is completed, having changed sign mid-aspect. The promise that
        appeared to be forming is cut off; the matter will not fructify."
    condition: >
      Planet A (faster) was in Itthasala with Planet B, but Planet A exits its
      current sign and enters a new sign before the exact aspect with Planet B
      completes within the same sign context.
    assertion: >
      Manahoo operates; the apparent promise of the Itthasala is cut off and
      destroyed — the matter signified will not come to fruition in the year,
      despite the initial indication of Itthasala.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Core Tajaka doctrine, sutra-style declaration = 0.8 × 1.1 = 0.88. The 1.1
      reflects the uniformity of this teaching across multiple Tajaka commentators.
    caveats: >
      Applies in Varshaphal context only. Manahoo is unique to Tajaka; it has no
      parallel in Parashari or Jaimini systems. Once Manahoo is confirmed, no
      mitigation restores the promise for that year.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch6.v3.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch6.v3"
      text_excerpt: |
