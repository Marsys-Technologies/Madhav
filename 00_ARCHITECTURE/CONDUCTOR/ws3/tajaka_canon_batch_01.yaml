    condition: >
      A natural benefic (Jupiter, Venus, or unafflicted Mercury) forms Itthasala
      (applying aspect within moiety orb) with the Muntha degree in the annual chart.
    assertion: >
      The Muntha's positive potential is strengthened; difficulties associated with
      a weak or dusthana Muntha are moderated; the year's overall quality improves
      compared to what the Muntha placement alone would indicate.
