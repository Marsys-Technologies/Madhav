      verse_ref: "ch13.v1"
      text_excerpt: |
        "Harsha Yoga in the Tajaka annual chart occurs when the 6th lord is placed
        in the 6th house, or the 8th lord in the 8th house, or the 12th lord in the
        12th house of the annual chart. This yoga removes or neutralises the harmful
        potential of these dusthana lords, as each occupies its own malefic domain."
    condition: >
      In the annual chart: the 6th house lord is in the 6th house, OR the 8th lord
      is in the 8th house, OR the 12th lord is in the 12th house.
    assertion: >
      Harsha Yoga is formed; the dusthana lord is contained within its own house,
      neutralising its capacity to harm other houses; the year experiences reduced
      harm from enemies (6th), reduced health/accident risk (8th), or reduced losses/
      expenses (12th) depending on which dusthana is involved.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style enumeration = 0.8; 1 confirming text (Viparita Raja Yoga in BPHS
      shares the logic of dusthana lords in own dusthana) = 1.1. 0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only. Harsha Yoga in Tajaka parallels the
      Viparita Yoga concept in Parashari but is applied strictly to the annual chart.
      The yoga must be read in the annual chart, not the natal chart.
    verified: true
    stub: false
    stub_reason: null

