      house danger is mitigated.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style = 0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only. Sarala Yoga reduces rather than eliminates
      8th house risks; natal chart longevity factors must still be checked independently.
    verified: true
    stub: false
    stub_reason: null

