        square (90°), trine (120°), and opposition (180°). The semi-sextile, quincunx,
        and other minor aspects of Western astrology are not used. Planetary aspects
        are cast from sign to sign and refined by degree within the moiety orb."
    condition: >
      An aspect between two planets in the Tajaka annual chart is being evaluated.
    assertion: >
      Only the five Tajaka aspects (0°, 60°, 90°, 120°, 180°) are operative; all
      other angular separations are considered non-aspectual and irrelevant in the
      Itthasala/Ishrafa evaluation.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style enumeration = 0.8 × 1.1 = 0.88. Cross-text: Parashari also uses
      these aspects as primary (not identical but confirming the 5-aspect framework).
    caveats: >
      Applies in Varshaphal context only. Tajaka conjunction is the most powerful
      aspect; sextile and trine are benefic aspects; square and opposition can be
      either depending on the planets involved.
    verified: true
    stub: false
    stub_reason: null

