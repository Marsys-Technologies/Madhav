  # ─── CH 11 — MONTHLY TIMING: 16-MEASURES TECHNIQUE ─────────────────────────

  - rule_id: TAJAKA.ch11.v1.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch11.v1"
      text_excerpt: |
        "To time events within the Tajaka year on a monthly basis, the Tajaka system
        uses the '16 measures' technique. The year is divided by assigning proportional
        parts based on the strength of each planet in the annual chart. The stronger
        planets receive larger portions of the year."
    condition: >
      Monthly timing within the Tajaka year is being determined using the 16-measures
      (Shodashottari-style proportional) technique based on planetary strength in the
      annual chart.
    assertion: >
      Each planet receives a proportional time allocation for the year; stronger
      planets (by Tajaka dignity) govern longer periods; events signified by each
      planet tend to occur in its assigned month-period.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with qualifier ("tend to") = 0.8; complex conditional chain (strength
      proportionality) = 0.9. 0.8 × 0.9 = 0.72.
    caveats: >
      Applies in Varshaphal context only. The 16-measures technique requires precise
      calculation of Tajaka planetary strengths; approximations reduce reliability.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch11.v2.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch11.v2"
      text_excerpt: |
        "The Tri-Pataki Chakra is an alternative monthly timing method used in Tajaka.
        It assigns each of the twelve months to a specific sign of the zodiac in a
        fixed sequence starting from the sign of the annual Lagna, proceeding through
        the signs in order. When a planet transits the monthly sign, its annual chart
        promises are activated."
    condition: >
      Tri-Pataki Chakra monthly timing is being applied; the annual Lagna sign begins
      the sequence, and each subsequent sign governs one Tajaka month in order.
    assertion: >
      During the Tajaka month governed by a sign, transiting planets entering that
      sign, or the natal annual chart planet placed there, activates its annual chart
      promises; events related to that house's domain are more likely in that month.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with conditional chain = 0.8 × 0.9 = 0.72.
    caveats: >
      Applies in Varshaphal context only. The Tri-Pataki Chakra and the 16-measures
      technique are alternative (not additive) monthly timing methods; use one
      consistently per chart analysis.
    verified: true
    stub: false
    stub_reason: null

