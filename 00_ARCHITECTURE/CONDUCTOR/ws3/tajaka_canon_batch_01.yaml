      aspect with the slower planet completes.
    assertion: >
      Manahoo should be predicted rather than Itthasala; the apparent applying
      configuration will not complete, and the matter will not fructify.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
