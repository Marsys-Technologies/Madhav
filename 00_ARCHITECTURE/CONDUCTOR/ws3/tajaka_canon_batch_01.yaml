        the house it occupies. When Rahu is in a benefic house (kendra, trikona,
        11th), it amplifies good results; when in a malefic house (6th, 8th, 12th),
        it amplifies the difficulties of that house. Rahu's house placement in the
        annual chart should be noted carefully."
    condition: >
      Rahu occupies a specific house in the annual chart.
    assertion: >
      Rahu amplifies the significations of its house of placement: kendra/trikona/11th
      placement amplifies positive results; dusthana placement amplifies difficulties.
      The amplification is unpredictable in exact form — Rahu introduces foreign,
      unusual, or unexpected elements into the signified domain.
    scope: varshaphal
    school: tajaka
    confidence: 0.68
