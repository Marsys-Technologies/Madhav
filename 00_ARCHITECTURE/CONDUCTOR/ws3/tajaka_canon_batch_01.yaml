  # ─── CH 19 — EXALTATION AND DEBILITATION IN ANNUAL CHART ────────────────────

  - rule_id: TAJAKA.ch19.v1.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch19.v1"
      text_excerpt: |
        "A planet in its exaltation sign (uccha) in the annual chart is in its best
        possible Tajaka dignity. Its Itthasala promises are fulfilled most completely;
        it strengthens any yoga it participates in; and it adds its full natural
        signification as a support for the year."
    condition: >
      A planet occupies its exaltation sign in the annual chart (Sun in Aries,
      Moon in Taurus, Mars in Capricorn, Mercury in Virgo, Jupiter in Cancer,
      Venus in Pisces, Saturn in Libra).
    assertion: >
      The planet is in its best Tajaka dignity; its Itthasala configurations deliver
      the most complete results; yogas it participates in are strengthened; its
      natural significations actively support the year.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style declarative = 0.8 × 1.1 (BPHS exaltation principle confirms) = 0.88.
    caveats: >
      Applies in Varshaphal context only. Exaltation is one of the five Tajaka dignity
      factors for Varshesh assessment; it weights heavily in the Varshesh candidate
      evaluation.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch19.v2.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch19.v2"
      text_excerpt: |
        "A planet in its debilitation sign (neecha) in the annual chart is in its
        weakest Tajaka dignity. Its Itthasala promises may not fully materialise;
        even a strong Itthasala from a debilitated planet gives diminished results.
        Such a planet should not be relied upon as a primary indicator for the year."
    condition: >
      A planet occupies its debilitation sign in the annual chart (Sun in Libra,
      Moon in Scorpio, Mars in Cancer, Mercury in Pisces, Jupiter in Capricorn,
      Venus in Virgo, Saturn in Aries).
    assertion: >
      The planet is at its weakest Tajaka dignity; Itthasala promises it forms are
      diminished; it should not be selected as Varshesh (or its candidacy is
      significantly weakened); its natural significations are suppressed for the year.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style declarative = 0.8 × 1.1 = 0.88.
    caveats: >
