  # ─── CH 15 — ANNUAL CHART HOUSE ANALYSIS ────────────────────────────────────

  - rule_id: TAJAKA.ch15.v1.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch15.v1"
      text_excerpt: |
        "In analysing any house of the annual chart for its domain's events, the
        Tajaka method requires checking four factors: (1) the strength and placement
        of the house lord in the annual chart; (2) the natural significator's condition;
        (3) any Itthasala or Ishrafa involving the house lord or significator; and
        (4) the relevant Saham and its lord."
    condition: >
      A specific house's domain (e.g., 7th for marriage, 10th for career) is being
      analysed in the annual chart for event likelihood.
    assertion: >
      All four Tajaka factors must be assessed: (1) annual chart house lord; (2)
      natural significator condition; (3) Itthasala/Ishrafa involving these planets;
      (4) relevant Saham and its lord. Convergence of multiple factors increases
      prediction reliability.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sutra-style enumeration = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. This is the foundational Tajaka house
      analysis protocol; omitting any of the four factors reduces acharya-grade
      reliability.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch15.v2.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch15.v2"
      text_excerpt: |
        "When three or more of the four Tajaka house factors converge positively for
        a given house's domain, the event is highly probable in the year. When only
        two factors align, the event is probable. When one or zero factors align,
        the event is unlikely to occur during the year."
    condition: >
      The four Tajaka house factors (lord placement, significator condition, Itthasala
      status, Saham lord) are being counted for positive alignment for a specific
      house domain.
    assertion: >
      Three or more positive factors: high probability of the domain's event manifesting.
      Two positive factors: moderate probability. One or zero positive factors: low
      probability of manifestation in the current year.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sutra-style probability grading = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. The natal Dasha and natal chart indicators
      are prerequisites; the annual chart refines timing, it does not override the
      natal promise.
    verified: true
    stub: false
    stub_reason: null

