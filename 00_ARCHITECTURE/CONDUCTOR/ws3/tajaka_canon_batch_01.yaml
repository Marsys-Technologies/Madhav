      verse_ref: "ch13.v2"
      text_excerpt: |
        "Sarala Yoga in the annual chart occurs when the 8th lord is placed in the
        6th or 12th house. The 8th lord, removed from its own house of sudden events
        and crises, redirects its energy into the domains of service/debt (6th) or
        isolation/foreign (12th), producing less acute harm than if it remained in
        the 8th."
    condition: >
      In the annual chart: the 8th house lord is placed in the 6th house or the
      12th house.
    assertion: >
      Sarala Yoga is formed; the 8th lord's potential for sudden crises, accidents,
      or health emergencies is redirected, reducing the risk of acute 8th house events
