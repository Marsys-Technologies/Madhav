  # ─── CH 20 — TAJAKA ASPECT PRIORITISATION ────────────────────────────────────

  - rule_id: TAJAKA.ch20.v1.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch20.v1"
      text_excerpt: |
        "When multiple Itthasala configurations exist in an annual chart, the astrologer
        should prioritise them as follows: (1) Itthasala involving the Varsha Lagna
        lord is most important; (2) Itthasala involving the Muntha or Muntha lord is
        second; (3) Itthasala involving the Varshesh is third; (4) other Itthasalas
        rank by the natural benefic/malefic nature of the planets involved."
    condition: >
      Multiple Itthasala configurations are present in the annual chart and their
      relative importance is being assessed.
    assertion: >
      Priority order: (1) Lagna lord Itthasala (highest); (2) Muntha/Muntha lord
      Itthasala; (3) Varshesh Itthasala; (4) other Itthasalas by benefic/malefic
      nature. The Lagna lord's applying aspects determine the year's primary narrative.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sutra-style enumeration = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. This priority ordering is specific to
      Neelakanthi's method; other Tajaka texts may use different prioritisation.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch20.v2.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch20.v2"
      text_excerpt: |
        "Itthasala formed by the Lagna lord of the annual chart with the 10th lord
        in the annual chart is a prime indicator of career progress in the year.
        When both planets are strong and the Itthasala is of the Purnaphala type,
        career advancement is very likely."
    condition: >
      The annual Lagna lord forms Purnaphala Itthasala (same-sign applying aspect)
      with the 10th house lord of the annual chart, and both planets are strong by
      Tajaka dignities.
    assertion: >
      Career progress, professional advancement, or recognition of the native's
      work is very likely during the year; the convergence of Lagna lord (personal
      initiative) and 10th lord (career) in the strongest Itthasala type is a
      prime career indicator.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka with qualifier ("very likely") = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. Even this strong configuration must be
      supported by the natal chart's 10th house and the Dasha period for
      definitive career predictions.
    verified: true
    stub: false
    stub_reason: null

