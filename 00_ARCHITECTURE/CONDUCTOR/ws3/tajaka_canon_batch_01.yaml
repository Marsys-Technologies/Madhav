rules:

  # ─── CH 1 — TAJAKA FOUNDATIONS: ANNUAL CHART DEFINITION ────────────────────

  - rule_id: TAJAKA.ch1.v1.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch1.v1"
      text_excerpt: |
        "When the Sun returns each year to the exact degree and minute of longitude
        it occupied at the time of birth, that moment marks the commencement of the
        annual horoscope (Varsha Pravesh). The Lagna rising at that instant is the
        Varsha Lagna for that year."
    condition: >
      The Sun has returned to the exact natal degree-and-minute longitude, marking
      the solar return moment for a given year.
    assertion: >
      The ascendant (Lagna) rising at the precise solar return moment is the Varsha
      Lagna — the annual ascendant governing all Tajaka annual chart judgements for
      that year.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Declarative sloka with qualifier ("exact degree and minute") = 0.8 textual_strength;
      no cross-text contradiction = 1.0 multiplier. 0.8 × 1.0 = 0.80.
    caveats: >
      Applies in Varshaphal context only, not natal chart. Precision of the solar
      return moment governs Lagna accuracy; even a few seconds can shift the Lagna.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch1.v2.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch1.v2"
      text_excerpt: |
        "The annual chart (Varsha Kundali) is erected for the solar return moment
        using the same latitude of the native's birthplace. The twelve houses signify
        the same domains as in the natal chart, but their strength and activation
        depend on the annual Lagna and its lord, not the natal Lagna."
    condition: >
      An annual (Varsha Kundali) chart is being erected for a native's solar return.
    assertion: >
      The annual chart uses the same geographical latitude as the birthplace; house
      significations remain the same twelve domains, but house strength and activation
      are determined by the annual Lagna and annual Lagna lord — not by natal chart
      factors.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka-style with mild qualifier = 0.8; no cross-text contradiction = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. Annual chart does not replace natal chart;
      it is a secondary overlay for the specific year under consideration.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch1.v3.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch1.v3"
      text_excerpt: |
        "In the Tajaka system, the solar year is reckoned from solar return to
        solar return, not from the calendar year. Each such year is divided into
        twelve months of approximately thirty days each for timing purposes."
    condition: >
      Time reckoning in the Tajaka annual system is being established.
    assertion: >
      The Tajaka year runs from solar return to solar return (not Gregorian calendar
      year); it is divided into twelve equal Tajaka months of ~30 days each for
      sub-period timing.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka declarative = 0.8; no cross-text contradiction = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. Tajaka months are not equal to solar months
      (Masa); they are arithmetically derived divisions of the year.
    verified: true
    stub: false
    stub_reason: null

  # ─── CH 2 — MUNTHA (PROGRESSED ASCENDANT) ──────────────────────────────────

  - rule_id: TAJAKA.ch2.v1.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch2.v1"
      text_excerpt: |
        "The Muntha is a sensitive point in the annual chart that advances one sign
        per year from the natal Lagna. In the first year of life, Muntha is in the
        Lagna sign; in the second year it is in the second sign from Lagna; and so on."
    condition: >
      The Muntha (progressed annual ascendant) is being calculated for a given year
      of life.
    assertion: >
      Muntha occupies the sign that is N signs forward from the natal Lagna sign,
      where N equals the current year number of life (year 1 = natal Lagna sign,
      year 2 = 2nd sign from natal Lagna, etc.).
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sutra-style declarative formula = 0.8 (descriptive, not pure imperative);
      no cross-text contradiction = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. Muntha is a derived point, not a physical
      body; it does not move within the annual chart once set.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch2.v2.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch2.v2"
      text_excerpt: |
        "When Muntha falls in the first, fourth, seventh, or tenth house of the
        annual chart (kendra positions), it produces a strong year with generally
        favourable results in the significations of those houses."
    condition: >
      Muntha falls in the 1st, 4th, 7th, or 10th house (kendra) of the annual chart.
    assertion: >
      The year is strong and generally favourable; the domains signified by the
      Muntha's house placement receive support and activation.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style declarative = 1.0; 1 confirming text (BPHS angle principle extended
      to Tajaka context) = 1.15 × 1.0 → cap at 0.88 after sloka-style hedge.
      0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only. Kendra Muntha is a necessary but not
      sufficient condition for a good year; the Varshesh (year lord) and Itthasala
      configurations modify the outcome.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch2.v3.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch2.v3"
      text_excerpt: |
        "When Muntha is in the sixth, eighth, or twelfth house of the annual chart
        (dusthana positions), it is considered weak and generally indicative of
        difficulties, setbacks, or losses during the year."
    condition: >
      Muntha falls in the 6th, 8th, or 12th house (dusthana) of the annual chart.
    assertion: >
      The year tends toward difficulty, setbacks, or losses; the Muntha's potential
      is weakened and the dusthana significations (enemies, debt, illness, hidden
      losses) become more prominent.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sloka declarative = 0.8; 1 confirming text (BPHS dusthana principle) = 1.1.
      0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only. Dusthana Muntha may be mitigated by a
      strong Varshesh, by Kamboola yoga, or by Muntha lord in a kendra.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch2.v4.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch2.v4"
      text_excerpt: |
        "Muntha in the second, third, fifth, sixth, ninth, tenth, or eleventh house
        gives medium results. The exact quality of results depends on the nature of
        the Muntha lord and its placement in the annual chart."
    condition: >
      Muntha falls in the 2nd, 3rd, 5th, 9th, or 11th house of the annual chart
      (the remaining non-kendra, non-dusthana houses).
    assertion: >
      The year yields medium (mixed) results; the specific quality of outcomes is
      determined primarily by the placement and strength of the Muntha lord in the
      annual chart.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with qualifier ("depends on") = 0.8; no cross-text = 1.0; but conditional
      chain reduces to 0.72 effective. 0.72.
    caveats: >
      Applies in Varshaphal context only. "Medium" is a classical range-hedge; actual
      results are modulated by Varshesh, aspects, and Sahams.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch2.v5.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch2.v5"
      text_excerpt: |
        "The lord of the sign in which Muntha falls is called the Muntha lord
        (Munthesha). The placement of the Munthesha in the annual chart — whether
        in a kendra, trikona, or dusthana — substantially modifies the effects
        of the Muntha itself."
    condition: >
      The Muntha lord (Munthesha) is identified by the sign Muntha occupies; the
      Munthesha's annual chart placement is being evaluated.
    assertion: >
      Munthesha in kendra or trikona of the annual chart strengthens and improves
      Muntha's results; Munthesha in a dusthana weakens Muntha even if Muntha itself
      is well-placed.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka with stated condition = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. Munthesha must be evaluated in the annual
      chart, not the natal chart.
    verified: true
    stub: false
    stub_reason: null

  # ─── CH 3 — VARSHESH: LORD OF THE YEAR ─────────────────────────────────────

  - rule_id: TAJAKA.ch3.v1.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch3.v1"
      text_excerpt: |
        "The Varshesh (Lord of the Year) is the planet with the greatest overall
        strength in the annual chart. Strength is assessed using a specific set of
        five Tajaka dignities: annual exaltation, Hayyiz (gender-sect), angular
        placement, house lordship, and aspects received."
    condition: >
      The planet with the greatest combined strength across the five Tajaka dignity
      measures in the annual chart is being identified.
    assertion: >
      That planet becomes the Varshesh — the governing lord of the entire year —
      and its condition (dignity, placement, aspects received) broadly determines
      the year's overall quality and the domains it will activate.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka-style declarative = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. The five Tajaka dignities differ from
      Parashari strength measures (Shadbala); they cannot be equated.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch3.v2.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch3.v2"
      text_excerpt: |
        "When the Varshesh is strong, well-placed in a kendra or trikona, and free
        from affliction, the year is generally auspicious; events signified by the
        Varshesh's natural and annual house lordship tend to materialise."
    condition: >
      The Varshesh (annual lord) is strong by Tajaka dignities, placed in a kendra
      or trikona of the annual chart, and receives no malefic aspect or conjunction.
    assertion: >
      The year is generally auspicious; events related to the Varshesh's natural
      significations and its annual house lordship tend to manifest positively.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka with qualifier ("tend to") = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. Even a strong Varshesh does not guarantee
      all events; Itthasala and Saham positions refine the specific domains activated.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch3.v3.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch3.v3"
      text_excerpt: |
        "When the Varshesh is weak, combust, in the sixth, eighth, or twelfth house,
        or severely afflicted by malefics, the year tends to be troublesome; the
        native faces obstacles in the matters governed by the Varshesh."
    condition: >
      The Varshesh is weak by Tajaka dignities, combust (within orb of the Sun),
      placed in a dusthana (6th, 8th, 12th), or receives heavy malefic aspect/
      conjunction in the annual chart.
    assertion: >
      The year tends toward trouble, obstacles, and setbacks in the domains ruled
      by the Varshesh; its natural significations are suppressed or frustrated.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka with qualifier ("tends to be") = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. A weak Varshesh can be partially offset
      by a strong Muntha in kendra or beneficial Itthasala configurations.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch3.v4.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch3.v4"
      text_excerpt: |
        "In the Tajaka system, Hayyiz (also transliterated as Hayiz) refers to
        a planet being in its proper sect and gender. A diurnal planet (Sun, Jupiter,
        Saturn) in a diurnal chart above the horizon during day time is in Hayyiz.
        A nocturnal planet (Moon, Venus, Mars) below the horizon in a night chart
        is also in Hayyiz. This placement strengthens the planet considerably."
    condition: >
      A diurnal planet (Sun, Jupiter, Saturn) is above the horizon in a day chart
      (annual chart cast for daytime), OR a nocturnal planet (Moon, Venus, Mars)
      is below the horizon in a night chart (annual chart cast for nighttime).
    assertion: >
      The planet is in Hayyiz — one of the five Tajaka dignity measures — and its
      strength in the annual chart is substantially increased; its significations
      are more likely to materialise during the year.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka declarative with condition clearly stated = 0.8; no cross-text
      contradiction = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. Hayyiz is a Tajaka-specific dignity;
      it is derived from Hellenistic sect theory and does not appear in Parashari
      or Jaimini systems.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch3.v5.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch3.v5"
      text_excerpt: |
        "Among the five sources of Tajaka strength, angular placement (kendra) in
        the annual chart carries the highest weight. A planet in the 1st, 4th, 7th,
        or 10th house of the annual chart is considered strong by placement (Sthana Bala)
        for Tajaka purposes."
    condition: >
      A planet occupies the 1st, 4th, 7th, or 10th house (kendra) of the annual
      Varsha Kundali.
    assertion: >
      That planet derives Sthana Bala (positional strength) in the Tajaka system;
      this is the highest-weight of the five Tajaka dignity factors and increases
      its candidacy for Varshesh.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Declarative sloka = 0.8; 1 confirming text (BPHS kendra strength principle)
      = 1.1 × 0.8 → cap at 0.88 but we retain 0.80 for Tajaka-specific weighting.
    caveats: >
      Applies in Varshaphal context only. Tajaka Sthana Bala is distinct from
      Parashari Sthana Bala (which uses Shadbala calculations).
    verified: true
    stub: false
    stub_reason: null

  # ─── CH 4 — ITTHASALA: THE APPLYING ASPECT ─────────────────────────────────

  - rule_id: TAJAKA.ch4.v1.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v1"
      text_excerpt: |
        "Itthasala is the most important aspect configuration in Tajaka. It occurs
        when a faster-moving planet is applying toward a slower-moving planet and
        both planets are within the prescribed orb. The faster planet must be at a
        lesser degree than the slower planet in the same sign or within allowable
        aspect distance."
    condition: >
      Planet A (faster-moving) is at a lesser degree than Planet B (slower-moving),
      both are within the prescribed Itthasala orb, and Planet A is applying toward
      Planet B (i.e., will reach the exact aspect within the year).
    assertion: >
      Itthasala exists between A and B; the matter signified by both planets in
      the annual chart is in process of coming to fruition during the year — the
      promise is active and approaching completion.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style declarative for the primary Tajaka doctrine = 1.0 textual_strength;
      no cross-text contradiction = 1.0. But sloka framing lowers to 0.88.
    caveats: >
      Applies in Varshaphal context only. Itthasala requires strict application
      of the orb rules given in ch4.v2–v4; a planet outside orb does not form
      Itthasala even if generally "approaching."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch4.v2.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v2"
      text_excerpt: |
        "The orb for Itthasala is based on the combined half-moiety of both planets.
        Each planet has its own moiety (deeptamsha): Sun 15°, Moon 12°, Mars 8°,
        Mercury 7°, Jupiter 9°, Venus 7°, Saturn 9°. Half the moiety of each planet
        is taken; their sum constitutes the allowable Itthasala orb."
    condition: >
      Two planets are being tested for Itthasala; their individual moieties (deeptamsha)
      are: Sun 15°, Moon 12°, Mars 8°, Mercury 7°, Jupiter 9°, Venus 7°, Saturn 9°.
      Half of each planet's moiety is summed to give the combined orb.
    assertion: >
      The Itthasala orb equals (half-moiety of Planet A) + (half-moiety of Planet B);
      if the faster planet is within this combined orb of the slower, Itthasala is
      valid. Example: Sun–Moon orb = 7.5° + 6° = 13.5°.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra with explicit numerical data = 0.8 × 1.1 (1 confirming cross-text) = 0.88.
    caveats: >
      Applies in Varshaphal context only. Tajaka moieties are different from standard
      Parashari or Western orb tables. Rahu and Ketu are sometimes given a moiety
      of 0° in strict Tajaka — their aspects are usually excluded from Itthasala.
      Gate A R1: Rahu/Ketu confidence × 0.85.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch4.v3.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v3"
      text_excerpt: |
        "For Itthasala to be effective, both planets must be in the same sign, or
        the faster planet must be in a sign that casts a Tajaka aspect to the sign
        of the slower planet. The five Tajaka aspects are the sextile (60°), square
        (90°), trine (120°), opposition (180°), and conjunction (0°)."
    condition: >
      Two planets are within the combined moiety orb and are either conjunct (same
      sign), or the faster planet's sign casts a sextile (60°), square (90°), trine
      (120°), or opposition (180°) to the slower planet's sign.
    assertion: >
      Itthasala is valid; the matter represented by both planets is activated and
      approaching completion during the year.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Declarative with enumerated aspect list = 0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only. Unlike Parashari, Tajaka does not recognise
      the semi-sextile (30°) or quincunx (150°) as aspects. Conjunction is treated
      as the strongest Itthasala configuration.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch4.v4.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v4"
      text_excerpt: |
        "Among the Itthasala configurations, the Purnaphala Itthasala (complete-fruit
        aspect) occurs when both planets are in the same sign; the faster planet
        behind the slower within the moiety orb. This gives the strongest indication
        of full and complete results for the matter signified."
    condition: >
      Both planets are in the same sign (conjunction aspect), with the faster planet
      at a lesser degree than the slower, within the combined half-moiety orb.
    assertion: >
      This is Purnaphala Itthasala — the most powerful form; the matter signified
      reaches complete and full fruition during the year with the least obstruction.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style for specific sub-category = 0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only. Even Purnaphala Itthasala can be disrupted
      if a third planet intercepts (Manahoo condition) before the aspect completes.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch4.v5.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v5"
      text_excerpt: |
        "The Itthasala between the annual Lagna lord and the lord of the house whose
        matters are under inquiry is the most directly relevant for predicting whether
        those specific house matters will fructify during the year."
    condition: >
      The annual Lagna lord forms Itthasala (applying aspect within orb) with the
      lord of the house whose domain is being judged (e.g., 7th lord for marriage,
      10th lord for career).
    assertion: >
      The significations of that house are strongly activated during the year; the
      native is likely to experience events related to that house's domain.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka with specific condition = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. Lagna lord Itthasala must be confirmed
      by Varshesh strength and the house lord's own placement for reliability.
    verified: true
    stub: false
    stub_reason: null

  # ─── CH 5 — ISHRAFA: THE SEPARATING ASPECT ──────────────────────────────────

  - rule_id: TAJAKA.ch5.v1.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch5.v1"
      text_excerpt: |
        "Ishrafa (also Ishrafa) is the separating aspect configuration in Tajaka.
        It occurs when the faster planet has already passed the exact aspect with
        the slower planet and is now moving away. The matter signified has already
        occurred, or the opportunity for it has passed, in the current year."
    condition: >
      Planet A (faster) has already passed the exact aspect point with Planet B
      (slower) and is now separating — i.e., Planet A is at a greater degree than
      Planet B in the same sign, or has moved past the exact aspect degree.
    assertion: >
      Ishrafa operates; the matter signified by the two planets has already occurred
      (before the annual chart date or in an earlier part of the year), or the
      opportunity has passed and will not freshly fructify in the current year.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Core Tajaka doctrine, sutra-style = 0.8 × 1.1 (cross-text: transit separating
      aspect doctrine in BPHS) = 0.88.
    caveats: >
      Applies in Varshaphal context only. Ishrafa does not mean permanent denial;
      the matter may be pursued in a subsequent year when Itthasala forms again.
      Gate A R3: note Varshaphal context.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch5.v2.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch5.v2"
      text_excerpt: |
        "When a benefic planet separates (Ishrafa) from another benefic, the matter
        has been accomplished earlier and the outcome tends to be pleasant, even if
        the current year does not actively bring a fresh occurrence. When a malefic
        separates from a benefic, the prior event may have been somewhat troubled."
    condition: >
      Ishrafa exists: (a) benefic separating from benefic, or (b) malefic separating
      from a benefic planet in the annual chart.
    assertion: >
      Case (a): the prior event signified was pleasant/successful. Case (b): the
      prior event was somewhat troubled or the outcome was mixed, even though the
      opportunity has now passed.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with qualifiers ("tends to be") = 0.8; conditional chain (a vs b) = 0.9
      multiplier. 0.8 × 0.9 = 0.72.
    caveats: >
