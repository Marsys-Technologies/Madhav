rules:

  # ─── ADHYAYA 4 PADA 4: ADDITIONAL YOGAS AND SCHOOL-SPECIFIC PRINCIPLES ───

  - rule_id: JAIMINI.4.4.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.1"
      text_excerpt: |
        "Jaimini on exaltation signs as raja indicators" — in Jaimini, planets in
        exaltation in either the natal chart or the navamsha have heightened raja
        (kingly) qualities. Exalted planets in trikona (1H, 5H, 9H) or kendra (1H,
        4H, 7H, 10H) from Lagna create inherent rajayoga potential, especially if
        they are the Atmakaraka or Amatyakaraka. (Rath: Exaltation in kendra or
        trikona = the simplest Jaimini rajayoga baseline.)
    condition: |
      A planet is exalted AND occupies a kendra (1H, 4H, 7H, 10H) or trikona
      (1H, 5H, 9H) from natal Lagna.
    assertion: |
      An exalted planet in kendra or trikona creates a basic rajayoga potential in
      the Jaimini framework. This is amplified if the exalted planet is the AK or AmK.
      The Chara Dasha of this planet's rashi activates the rajayoga results.
    scope: yoga
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by classical tradition (1.0) = 0.85; reduced to 0.80"
    caveats: "Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.2.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.2"
      text_excerpt: |
        "Jaimini on lord of own sign (own-sign planet) as strong" — a planet in its
        own sign (swa kshetra) in Jaimini is considered fully powerful in expressing its
        significations without modification. Own-sign planets in kendra or trikona are
        among the simplest powerful configurations. The dasha of an own-sign planet's
        rashi delivers results with exceptional purity. (Rath: Swa = own nature fully
        expressed; no modification by foreign environment.)
    condition: |
      A planet occupies its own sign (swa kshetra) in the natal chart.
    assertion: |
      A planet in its own sign expresses its significations with maximum purity and
      clarity. When this planet is in a kendra or trikona, it creates a powerful,
      reliable indication in that domain. The Chara Dasha of its rashi delivers that
      domain's results with exceptional clarity.
    scope: misc
    school: jaimini
    confidence: 0.82
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by all classical traditions (1.15) = 0.85; reduced to 0.82"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.3.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.3"
      text_excerpt: |
        "Jaimini on Kemadruma-type isolation: Atmakaraka without argala" — when the
        Atmakaraka has no benefic argala from any direction (no benefics in 2nd, 4th,
        5th, or 11th from AK), the soul is isolated without support. This indicates
        a native who must develop internal spiritual resources, as external support for
        the soul's mission is lacking. (Rath: AK without benefic argala = the isolated
        soul; must develop self-sufficiency at the deepest level.)
    condition: |
      The Atmakaraka has no benefic planets in any of its argala positions (2nd, 4th,
      5th, or 11th) from its natal rashi.
    assertion: |
      The Atmakaraka is isolated from benefic support. The native must cultivate inner
      spiritual resources and self-sufficiency, as the soul's mission lacks external
      backing. This configuration often produces deeply self-reliant individuals who
      develop their gifts through solitary effort.
    scope: misc
    school: jaimini
    confidence: 0.70
    confidence_rationale: "Prose commentary synthesis (0.60) × Rath (1.0) = 0.60; upgraded to 0.70 for logical internal consistency with argala framework"
    caveats: "This is a Rath synthesis applying argala to AK isolation. Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.4.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.4"
      text_excerpt: |
        "Jaimini on Saturn in 8th from Lagna: longevity support" — Saturn in the 8th
        from natal Lagna is one of the strongest longevity indicators in the Jaimini
        system. Saturn in its own sign (Capricorn or Aquarius) in the 8th strongly
        supports Purnayu. Even Saturn in its enemy sign in the 8th provides some
        longevity protection through discipline. (Rath: Saturn in 8th = karmic debt
        holder; also life force maintainer through discipline and austerity.)
    condition: |
      Saturn occupies the 8th house from natal Lagna in the natal chart.
    assertion: |
      Saturn in the 8th from Lagna is a strong Purnayu (long life) indicator in Jaimini.
      Saturn in own sign or exaltation in 8th = maximum longevity support. Saturn in
      a weak condition in 8th still provides some longevity through discipline, though
      with hardship. This is the 'Ayur yoga' through Saturn.
    scope: misc
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by classical Jaimini tradition (1.0) = 0.85; reduced to 0.80"
    caveats: "Results vary by Saturn's dignity in 8th. Saturn debilitated in 8th may not give Purnayu."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.5.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.5"
      text_excerpt: |
        "Jaimini on Jupiter in 5th from Karakamsha: mantra siddhi" — Jupiter in the
        5th from Karakamsha indicates not just intelligence and children (as established),
        but also specifically mantra siddhi (mastery of sacred syllables and mantras).
        The native has an innate capacity to connect with sacred sound and may be a
        gifted mantra practitioner or teacher. (Rath: Jupiter 5th from KL = mantra siddhi
        is the soul's primary spiritual tool in this life.)
    condition: |
      Jupiter occupies the 5th house from the Karakamsha Lagna in the natal chart.
    assertion: |
      Beyond intelligence and children, Jupiter in 5th from KL specifically indicates
      mantra siddhi — the native has an innate ability to work with sacred sound,
      mantras, and vibrational healing. This is one of the primary spiritual gifts
      in the Jaimini framework.
    scope: divisional
    school: jaimini
    confidence: 0.78
    confidence_rationale: "Implicit sutra form (0.85) × Rath commentary on mantra siddhi (1.0) = 0.85; reduced to 0.78 for mantra-siddhi being interpretive layer"
    caveats: "Mantra siddhi framing is Rath's specific interpretive layer. Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.6.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.6"
      text_excerpt: |
        "Jaimini on Venkatest (Venus-Ketu) combination in Karakamsha: tantra" —
        when Venus and Ketu both occupy or aspect the Karakamsha Lagna, the native
        is drawn to tantric practices, sacred arts, or esoteric mysticism combined
        with aesthetic sensitivity. This is a powerful yoga for a tantric practitioner
        or an artist working with sacred themes. (Rath: Venus+Ketu on KL = the tantric
        soul; sacred pleasure and mystical practice combined.)
    condition: |
      Both Venus and Ketu occupy or aspect the Karakamsha Lagna sign in the natal chart.
    assertion: |
      Native has soul-level inclinations toward tantric practices, sacred arts, mysticism
      combined with aesthetic expression, or working with sacred sexuality and pleasure as
      a path to liberation. This is a Jaimini indicator for a tantric path (Vamachara or
      Dakshinachara traditions).
    scope: yoga
    school: jaimini
    confidence: 0.57
    confidence_rationale: "Implicit sutra form (0.85) × Ketu nodes factor (×0.85) = 0.72; reduced to 0.57 for tantric-path interpretation being highly commentarial"
    caveats: |
      The tantric path interpretation is specifically Rath's reading. Traditional texts
      do not necessarily frame Venus+Ketu on KL this way. Results vary enormously by
      lagna and chart context.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.7.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.7"
      text_excerpt: |
        "Jaimini on aspecting planets strengthening or weakening rashi" — in Jaimini,
        when a rashi is aspected by its own lord, the rashi is strengthened (svabhipreta:
        the lord blesses its own sign). When aspected by an enemy planet, the rashi's
        results are colored by that enemy's nature. When aspected by a friend, the
        rashi's results are refined and elevated. (Rath: Rashi quality = its lord's
        quality + aspecting planets' qualities together.)
    condition: |
      A rashi is aspected by its own lord, a friendly planet, or an enemy planet.
    assertion: |
      A rashi aspected by its own lord gives results with maximum integrity — the sign's
      full potential is expressed. A rashi aspected by friendly planets gives refined,
      elevated results in its domain. A rashi aspected by enemy planets gives mixed or
      challenged results. This applies to all Jaimini rashi analyses including dasha rashis.
    scope: misc
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × classical tradition (1.0) = 0.85; reduced to 0.80"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.8.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.8"
      text_excerpt: |
        "Jaimini on Bhrigu Bindu equivalent: AK-Moon midpoint" — while Bhrigu Bindu
        is a Parashari concept, Jaimini employs a related concept using the midpoint
        between the AK and the Moon. Transits and dashas that activate this midpoint
        indicate periods of heightened emotional-soul integration and important
        psychological breakthroughs. (Rath: AK-Moon midpoint = the soul-heart axis;
        its activation = emotional and spiritual synthesis events.)
    condition: |
      The midpoint between the Atmakaraka's natal position and the Moon's natal
      position is calculated and used as a sensitive point.
    assertion: |
      Chara Dasha activation of the AK-Moon midpoint rashi, or transit of significant
      planets over this midpoint, indicates periods of heightened emotional-spiritual
      integration, psychological breakthroughs, and deepening of soul-heart connection.
    scope: misc
    school: jaimini
    confidence: 0.58
    confidence_rationale: "Prose commentary (0.60) × Rath synthesis (1.0) = 0.60; reduced to 0.58 for this being a commentary-level synthesis point"
    caveats: "AK-Moon midpoint as a sensitive axis is primarily Rath's synthesis. Not a standalone verified sutra."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.9.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.9"
      text_excerpt: |
        "Jaimini Rajayoga: Lagna lord with 5th lord in Jaimini aspect" — when the
        Lagna lord and the 5th lord are in mutual Jaimini rashi aspect, a powerful
        combination of vitality (Lagna lord) and intelligence/past merit (5th lord) is
        formed. This is a Rajayoga of physical and intellectual self-expression.
        (Rath: Lagna lord + 5L mutual aspect = body and mind aligned for peak expression.)
    condition: |
      The lord of the natal Lagna and the lord of the 5th house are in mutual Jaimini
      rashi aspect.
    assertion: |
      The native has a natural alignment of physical vitality and intellectual gifts —
      body and mind work together seamlessly. This creates a Rajayoga of self-expression
      and authentic achievement. Success in creative, intellectual, or performative domains
      is strongly indicated.
    scope: yoga
    school: jaimini
    confidence: 0.78
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.78"
    caveats: "Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.10.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.10"
      text_excerpt: |
        "Jaimini on Cancellation of Debility (Neecha Bhanga) in D9" — when a planet
        is debilitated in the natal chart but its debility is cancelled in the navamsha
        (by occupying exaltation, own sign, or by the lord of its exaltation sign being
        in the exaltation sign in D9), the debility is partially or fully cancelled at
        the soul level. The native struggles with the planet's domain in early life but
        develops mastery through inner work. (Rath: Neecha Bhanga in D9 = the soul
        conquers its karmic weakness through inner development.)
    condition: |
      A planet is debilitated in the natal (D1) chart but occupies its exaltation or
      own sign in the Navamsha (D9) chart, or has its debility cancelled in the D9.
    assertion: |
      Debility cancelled in D9 indicates that the soul will overcome this planet's
      domain challenges through inner development. Early life may show the D1 debility's
      difficulties, but over time the soul's inner work resolves the debility's effects.
      This is a positive long-term indicator for that domain.
    scope: divisional
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × Rath + classical tradition (1.0) = 0.85; reduced to 0.80"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.11.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.11"
      text_excerpt: |
        "Jaimini on mutual aspects of Lagna lord and 7th lord: marriage yoga" —
        when the Lagna lord and the 7th lord are in mutual Jaimini rashi aspect, a
        natural marriage yoga is formed — the self and the other are in natural
        relationship. This is one of the strongest Jaimini marriage indicators when
        combined with Venus or Darakaraka involvement. (Rath: 1L-7L mutual aspect
        = self and partner naturally connected; marriage is natural and relatively easy.)
    condition: |
      The lord of the natal Lagna and the lord of the 7th house are in mutual Jaimini
      rashi aspect.
    assertion: |
      A natural marriage yoga is formed when 1L and 7L are in mutual Jaimini aspect.
      The native and their partner type are naturally compatible. Marriage comes more
      easily and harmoniously. Combined with DK activation in the dasha, this confirms
      favorable marriage timing and quality.
    scope: yoga
    school: jaimini
    confidence: 0.78
    confidence_rationale: "Implicit sutra form (0.85) × Rath + classical (1.0) = 0.85; reduced to 0.78"
    caveats: "Results vary by lagna and by the specific planets serving as 1L and 7L."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.12.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.12"
      text_excerpt: |
        "Jaimini on Atmakaraka in own sign or exaltation in natal chart: extraordinary life" —
        when the Atmakaraka is in its own sign or exaltation in the natal (D1) chart, the
        native has extraordinary soul strength in this life. The soul's mission is not just
        active but powerful — the native often achieves notable things in their field because
        their soul's energy is at maximum effectiveness. (Rath: AK in dignity = the soul is
        a champion in this life; the karmic mandate is powerful and expressed with force.)
    condition: |
      The Atmakaraka planet occupies its own sign or exaltation sign in the natal chart (D1).
    assertion: |
      AK in own sign or exaltation in D1 indicates an exceptionally strong soul mandate in
      this life. The native tends toward notable achievement in the AK's domain because the
      soul operates at maximum effectiveness. Life force, purpose, and will are concentrated
      and powerful.
    scope: misc
    school: jaimini
    confidence: 0.82
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by tradition (1.0) = 0.85; reduced to 0.82"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.13.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.13"
      text_excerpt: |
        "Jaimini on the 2nd house from Atmakaraka: speech as the soul's tool" —
        the 2nd house from the Atmakaraka shows how the soul communicates its purpose.
        Benefics here give the native eloquent, impactful speech aligned with the soul's
        mission; malefics give harsh or misdirected speech. Jupiter in 2nd from AK =
        wisdom through speech. Venus = artistic speech or music as the soul's language.
        (Rath: 2nd from AK = the soul's voice and values; how the soul expresses itself
        outwardly.)
    condition: |
      The 2nd house from the Atmakaraka's natal rashi is analyzed for its occupants.
    assertion: |
      Benefics in 2nd from AK give eloquent, soul-aligned speech and communication.
      Jupiter = philosophical wisdom through words; Venus = artistic or musical expression;
      Mercury = intellectual and literary expression. Malefics = harsh or misdirected
      speech that obscures the soul's purpose.
    scope: misc
    school: jaimini
    confidence: 0.78
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.78"
    caveats: "Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.14.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.14"
      text_excerpt: |
        "Jaimini on the 3rd house from Atmakaraka: courage as the soul's expression" —
        the 3rd house from the Atmakaraka shows how the soul expresses its will and
        courage in the world. Benefics in 3rd from AK give the native genuine courage
        aligned with their soul mission; malefics give cowardice or reckless courage.
        Mars in 3rd from AK = exceptional physical and moral courage for the soul.
        (Rath: 3rd from AK = the soul's courage manifestation point.)
    condition: |
      The 3rd house from the Atmakaraka's natal rashi is analyzed for its occupants.
    assertion: |
      Benefics in 3rd from AK give the native genuine, soul-aligned courage and
      initiative. Mars in 3rd from AK = exceptional physical and moral courage aligned
      with soul purpose. Malefics without good aspect = courage challenges (cowardice
      or recklessness) that the soul must consciously develop.
    scope: misc
    school: jaimini
    confidence: 0.75
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.75"
    caveats: "Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.15.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.15"
      text_excerpt: |
        "Jaimini on Arudha Lagna (AL): the image self vs. the true self" — the Arudha
        Lagna is calculated as the sign equidistant from the Lagna lord's position as
        the lord is from the Lagna (with exceptions for 1st and 7th house lords).
        The Arudha Lagna shows the native's public image, social persona, and how
        others perceive them — distinct from the natal Lagna (true self). (Rath:
        AL = the Maya self; what the world sees rather than what the soul is.)
    condition: |
      The Arudha Lagna (AL) is calculated from the natal Lagna lord's position.
    assertion: |
      The Arudha Lagna shows the native's public image and social persona. Planets in
      or aspecting the AL describe what others project onto the native (fame, reputation,
      or negative perception). The gap between Lagna (true self) and AL (image self) shows
      the native's degree of authenticity in public life.
    scope: misc
    school: jaimini
    confidence: 0.82
    confidence_rationale: "Sutra declarative implicit form (0.85) × confirmed by Rath, K.N. Rao, and classical Jaimini (1.15) = 0.85; reduced to 0.82"
    caveats: |
      Arudha Lagna exceptions: when the lord is in 1st house, count from 10th; when
      lord is in 7th house, count from 4th. These exception rules are widely accepted.
      Results vary by lagna.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.16.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.16"
      text_excerpt: |
        "Jaimini on Arudha Pada of each house: the image of each life domain" — each
        of the 12 houses has an Arudha Pada (image point) calculated from its lord.
        The Arudha of the 7th (A7) shows the image of the spouse and partnership. The
        Arudha of the 2nd (A2) shows the image of wealth. Etc. The Arudha Padas reveal
        how each life domain appears in the world versus its true nature.
        (Rath: Arudha Padas = the Maya layer of each house; the social/perceived layer.)
    condition: |
      The Arudha Pada of any house is calculated from that house's lord's position using
      the same formula as Arudha Lagna.
    assertion: |
      Each house has an Arudha Pada that shows the public perception or image of that
      house's domain. A2 shows wealth image; A3 shows courage image; A7 shows partner
      image; A10 shows career image. Malefics in an Arudha Pada = negative public image
      in that domain; benefics = positive public image.
    scope: misc
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by Rath and PJC tradition (1.0) = 0.85; reduced to 0.80"
    caveats: "Arudha Pada calculation is universally accepted in Jaimini; interpretation of specific Arudha Padas varies. Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.17.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.17"
      text_excerpt: |
        "Jaimini on Arudha Lagna with malefics: negative public image" — malefic
        planets in the Arudha Lagna or aspecting it by Jaimini rashi drishti create a
        negative or feared public image. The native may be perceived as harsh, threatening,
        or controversial in the public sphere, regardless of their true character. Saturn
        in AL = seen as cold or distant; Mars in AL = seen as aggressive; Rahu = seen as
        deceptive or foreign. (Rath: Malefics in AL = the world's misperception of the native.)
    condition: |
      Malefic planets occupy or aspect the Arudha Lagna by Jaimini rashi drishti.
    assertion: |
      The native is perceived more negatively by the public than their true character
      warrants. Saturn in AL = perceived as cold, rigid, or distant; Mars = aggressive
      or volatile; Rahu = deceptive, foreign, or unconventional (positively or negatively).
      This does not reflect the true character (Lagna) but the social projection.
    scope: misc
    school: jaimini
    confidence: 0.75
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.75"
    caveats: "Rahu in AL: nodes factor would normally apply (×0.85), reducing to 0.64 for Rahu specifically. Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.18.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.18"
      text_excerpt: |
        "Jaimini on benefics in Arudha Lagna: positive public image, fame" — benefic
        planets in the Arudha Lagna or aspecting it give a positive, even excellent
        public image. Jupiter in AL = seen as wise and learned; Venus = seen as beautiful
        or artistic; Moon in AL = seen as nurturing or popular. Benefics in AL are one
        of the strongest Jaimini fame indicators. (Rath: Benefics in AL = the world sees
        the native's gifts; fame and good reputation come naturally.)
    condition: |
      Benefic planets occupy or aspect the Arudha Lagna by Jaimini rashi drishti.
    assertion: |
      The native is perceived favorably by the public. Jupiter in AL = perceived as
      learned and wise; Venus = beautiful and artistic; Mercury = intelligent; Moon =
      popular and nurturing. Benefics in AL are a primary Jaimini fame and positive
      reputation indicator. The Chara Dasha of the AL's rashi activates this public perception.
    scope: misc
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × Rath + K.N. Rao (1.0) = 0.85; reduced to 0.80"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.4.4.19.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.4.19"
      text_excerpt: |
        "Jaimini on Upapada Lagna (UL): the image of the spouse and marriage" — the
        Upapada Lagna (UL, Arudha of the 12th house) shows the image and nature of
        the spouse as they appear in the world, and the nature of the marriage bond.
        Benefics in or aspecting UL = virtuous, beautiful, or prosperous spouse;
        malefics = challenges in the marriage image or difficult spouse traits.
        (Rath: UL = the marriage reality as seen by the world; most important Jaimini
        marriage indicator after the Darakaraka.)
    condition: |
