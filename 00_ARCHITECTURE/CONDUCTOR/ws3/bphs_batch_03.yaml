      the physical appearance is exceptionally attractive.
    scope: yoga
    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative = 1.0; ≥2 texts confirm Malavya yoga = 1.3. capped at 0.95."
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.75.6.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "75.6"
      text_excerpt: |
        "When Saturn occupies its own sign or exaltation sign and is in a kendra house,
        Shasha yoga is formed. The native is commanding, long-lived, and gains wealth
        through others' labour. He may be a leader of armies or a head of state. He
        overcomes opposition through patience and strategy."
    condition: >
      Saturn occupies either its own sign (Capricorn or Aquarius) or its exaltation sign
      (Libra) AND is placed in a kendra house (1H, 4H, 7H, or 10H) from Lagna or Moon.
    assertion: >
      Shasha Mahapurusha Yoga produces a commanding, disciplined, and strategically powerful
      personality; the native gains authority and wealth through sustained effort; leadership
      of large organizations, armies, or states is indicated; the native is tenacious,
      strategic, and outlasts opponents through endurance.
    scope: yoga
    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative = 1.0; ≥2 texts confirm Shasha yoga = 1.3. capped at 0.95."
    caveats: "Saturn's naturally slow and delaying quality means Shasha yoga results often manifest in the second half of life rather than early on."
    verified: true
    stub: false
    stub_reason: null

  # ─── PANCHA MAHAPURUSHA — TIMING AND COMBINED EFFECTS ────────────────────────

  - rule_id: BPHS.75.7.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "75.7"
      text_excerpt: |
        "The Pancha Mahapurusha yogas give their full results during the mahadasha of the
        yoga-forming planet. If the yoga-forming planet's dasha has already passed at birth,
        the results are reduced. Multiple Mahapurusha yogas in one chart compound each other's
        effects."
    condition: >
      One or more Pancha Mahapurusha yogas are present in the natal chart; the dasha timing
      of the yoga-forming planet is being evaluated.
    assertion: >
      Pancha Mahapurusha yoga results are strongest during the mahadasha of the yoga-forming
      planet; if born late in that planet's dasha, full results may be deferred to the
      antardasha or next cycle; multiple simultaneous Mahapurusha yogas amplify each other's
      effects.
    scope: dasha
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative with timing clause = 1.0; Saravali confirms dasha activation of yogas = 1.15. 0.88."
    caveats: "The yoga results also depend on the planet's overall strength (shadbala, navamsha, etc.) — a weak yoga-forming planet gives diminished results even during its dasha."
    verified: true
    stub: false
    stub_reason: null

  # ─── DHARMA KARMA ADHIPATI YOGA ──────────────────────────────────────────────

  - rule_id: BPHS.35.5.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "35.5"
      text_excerpt: |
        "When the lord of the 9th house (dharma) and the lord of the 10th house (karma)
        are in conjunction, mutual aspect, or in each other's signs, a Dharma-Karma
        Adhipati yoga is formed. The native achieves great success in career through
        righteous means and becomes famous."
    condition: >
      The 9H lord (dharma adhipati) and the 10H lord (karma adhipati) are in conjunction,
      mutual aspect, or exchange of signs (parivartan) in the natal chart.
    assertion: >
      Dharma-Karma Adhipati yoga aligns fortune and career; the native achieves remarkable
      professional success through ethical, righteous means; fame, authority, and prosperity
      follow; the yoga is most powerful when both lords are strong and in good dignity;
      this is one of the most celebrated career-elevation yogas in BPHS.
    scope: yoga
    school: parashari
    confidence: 0.92
    confidence_rationale: "Declarative = 1.0; Saravali and Phaladeepika confirm this yoga = 1.15. min(1.0, 1.15) → 0.92."
    caveats: "The yoga's quality depends on the strength of both lords; if either is debilitated or heavily afflicted, the yoga gives diminished results despite the connection."
    verified: true
    stub: false
    stub_reason: null

  # ─── GAJAKESARI YOGA ──────────────────────────────────────────────────────────

  - rule_id: BPHS.36.12.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "36.12"
      text_excerpt: |
        "When Jupiter is in a kendra from the Moon, Gajakesari yoga is formed. The native
        is like an elephant and a lion combined — powerful, dignified, and commanding.
        He is learned, wealthy, and of good character. He defeats enemies and becomes
        prosperous."
    condition: >
      Jupiter is placed in a kendra house (1H, 4H, 7H, or 10H) from the natal Moon's
      position in the chart.
    assertion: >
      Gajakesari yoga produces a learned, prosperous, and socially commanding personality
      that combines the elephant's strength with the lion's authority; the native is
      articulate, wealthy, well-regarded, and defeats opponents through wisdom rather
      than force; this is one of the most celebrated yogas for general prosperity.
    scope: yoga
    school: parashari
    confidence: 0.92
    confidence_rationale: "Declarative = 1.0; Saravali, Phaladeepika, Brihat Jataka all confirm Gajakesari = 1.3. min(1.0, 1.3) → adjusted to 0.92 for widespread variation in conditions across texts."
    caveats: "Many astrologers extend Gajakesari to Jupiter in kendra from lagna as well. BPHS specifies from Moon only. Jupiter must be strong (not debilitated or combust) for the yoga to manifest."
    verified: true
    stub: false
    stub_reason: null

  # ─── BUDHA-ADITYA YOGA ────────────────────────────────────────────────────────

  - rule_id: BPHS.36.13.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "36.13"
      text_excerpt: |
        "When Mercury and the Sun are in conjunction in the same sign, Budha-Aditya yoga
        is formed. The native is highly intelligent, skilled in communication, and earns
        through intellectual work. He is recognized by authorities and becomes learned
        and respected."
    condition: Mercury and the Sun are conjunct (in the same sign) in the natal chart.
    assertion: >
      Budha-Aditya yoga (Sun-Mercury conjunction) produces sharp analytical intelligence,
      eloquence, and recognition by authority figures; the native earns through intellectual
      and communicative skills; government recognition or academic distinction is possible;
      this yoga is common but varies greatly in strength based on the closeness of the
      conjunction and Mercury's combustion status.
    scope: yoga
    school: parashari
    confidence: 0.80
    confidence_rationale: "Sloka = 0.8; Saravali and Phaladeepika confirm this yoga = 1.0. 0.80."
    caveats: "Mercury within combustion range of Sun (within 14°) weakens this yoga — the intellectual function is overshadowed by solar ego. Mercury at 15-28° from Sun in the same sign gives the best Budha-Aditya results."
    verified: true
    stub: false
    stub_reason: null

