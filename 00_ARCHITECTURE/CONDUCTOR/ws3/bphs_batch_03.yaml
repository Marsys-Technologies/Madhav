    caveats: "Chandra-Mangal can also produce emotional volatility and the combination of Moon's sensitivity with Mars's aggression may create temperamental challenges."
    verified: true
    stub: false
    stub_reason: null

  # ─── SARASWATI YOGA ──────────────────────────────────────────────────────────

  - rule_id: BPHS.36.16.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "36.16"
      text_excerpt: |
        "When Venus, Mercury, and Jupiter are all together in a kendra or trikona house
        (or in 2nd house), Saraswati yoga is formed. The native is exceptionally gifted
        in arts, learning, and creative expression. He becomes a renowned scholar or artist."
    condition: >
      Venus, Mercury, and Jupiter are all placed in kendra houses (1H, 4H, 7H, 10H),
      trikona houses (1H, 5H, 9H), or the 2H in the natal chart.
    assertion: >
      Saraswati Yoga (yoga of the goddess of learning and arts) produces exceptional
      talent in arts, music, literature, mathematics, and creative expression; the native
      becomes renowned in intellectual or artistic pursuits; all three natural benefics
      combining their energies amplifies intelligence, grace, and creative output.
    scope: yoga
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative = 1.0; Saravali and Phaladeepika confirm Saraswati yoga = 1.15. 0.88."
    caveats: "All three planets must be in good dignity (not debilitated or heavily afflicted) for the yoga to fully manifest. Even with this yoga, other chart factors determine the specific domain of expression."
    verified: true
    stub: false
    stub_reason: null

  # ─── ARISHTA YOGAS ────────────────────────────────────────────────────────────

  - rule_id: BPHS.38.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "38.2"
      text_excerpt: |
        "When the lords of the ascendant and the 8th house are conjunct or in mutual aspect,
        and are afflicted by malefics, severe health difficulties and threats to longevity
        are indicated. This is a primary Arishta (calamity) yoga."
    condition: >
      The lagna lord and the 8H lord are conjunct or in mutual aspect AND are additionally
      afflicted by malefic aspects or conjunctions.
    assertion: >
      The 1L-8L connection with malefic affliction creates an Arishta yoga — the native's
      vitality (1H) is connected to the house of death (8H) through additional malefic
      pressure; recurring health crises, longevity challenges, or karmic difficulties are
      indicated; Arishta yogas are most potent during the dashas of the involved planets.
    scope: yoga
    school: parashari
    confidence: 0.80
    confidence_rationale: "Sloka with conditional ('are afflicted') = 0.8; Saravali confirms 1L-8L danger = 1.0. 0.80."
    caveats: "Arishta yogas must be evaluated against Arishta-bhanga (cancellation) factors before predicting health crises. Strong 1H and lagna lord generally protect against Arishta."
    verified: true
    stub: false
    stub_reason: null

