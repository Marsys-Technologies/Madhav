    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.38.5.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "38.5"
      text_excerpt: |
        "When the Moon is afflicted by both Saturn and Mars (by conjunction or aspect),
        and the lagna is also weak, the native suffers from mental disorders, emotional
