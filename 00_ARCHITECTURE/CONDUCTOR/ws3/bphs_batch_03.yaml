  # ─── RAJA YOGAS — KENDRA-TRIKONA COMBINATIONS ────────────────────────────────

  - rule_id: BPHS.34.21.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "34.21"
      text_excerpt: |
        "If the lords of a trikona and a kendra are in their own signs, or exalted, or
        conjunct in a kendra or trikona, an excellent Raja yoga is formed. The native
        rises to the status of a king or high authority."
    condition: >
      A kendra lord AND a trikona lord are simultaneously in their own signs, exalted,
      OR conjunct in a kendra or trikona house.
    assertion: >
      This Raja Yoga condition produces royal-equivalent status and authority; the native
      rises to leadership, political power, or the equivalent of royal authority in their
      domain; the dasha of either involved planet activates the yoga; when both planets are
      strong and well-placed, results are exceptional.
    scope: yoga
    school: parashari
    confidence: 0.92
    confidence_rationale: "Declarative fundamental Raja Yoga rule = 1.0; Saravali, Phaladeepika confirm = 1.15. 0.92."
    caveats: "The concept of 'king' should be contextualised to the native's social and historical context — in modern times it indicates the highest levels of authority, recognition, or professional success in one's field."
    verified: true
    stub: false
    stub_reason: null

