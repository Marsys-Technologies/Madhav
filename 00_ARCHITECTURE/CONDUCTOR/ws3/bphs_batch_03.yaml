        fragrant body. He enjoys great pleasure, wealth, a loving spouse, and conveyances.
        He is fond of music and arts and lives a long and pleasurable life."
    condition: >
      Venus occupies either its own sign (Taurus or Libra) or its exaltation sign (Pisces)
