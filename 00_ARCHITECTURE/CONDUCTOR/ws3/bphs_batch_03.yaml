  # ─── PANCHA MAHAPURUSHA YOGAS ────────────────────────────────────────────────

  - rule_id: BPHS.75.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "75.2"
      text_excerpt: |
        "When Mars occupies its own sign or exaltation sign and is in a kendra house
        (1st, 4th, 7th, or 10th from Lagna or Moon), Ruchaka yoga is formed. The native
        is physically powerful, courageous, of reddish complexion, and conquers enemies.
        He is famous for his valour and may be a military leader."
    condition: >
      Mars occupies either its own sign (Aries or Scorpio) or its exaltation sign (Capricorn)
      AND is placed in a kendra house (1H, 4H, 7H, or 10H) from Lagna or Moon.
    assertion: >
      Ruchaka Mahapurusha Yoga produces an exceptionally courageous, physically powerful,
      and martial personality; the native excels in military affairs, athletics, surgery, or
      engineering; enemies are overcome; fame for valor and leadership is conferred;
      the native has exceptional physical stamina and competitive drive.
    scope: yoga
    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative yoga condition = 1.0; Saravali, Phaladeepika, Brihat Jataka all confirm Ruchaka yoga = 1.3. capped at 0.95."
    caveats: "The yoga must be unafflicted — strong malefic aspects on Mars can dilute the Ruchaka results. From Moon as well as Lagna is considered."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.75.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "75.3"
      text_excerpt: |
        "When Mercury occupies its own sign or exaltation sign and is in a kendra house,
        Bhadra yoga is formed. The native is highly intelligent, eloquent, and learned.
        He has a lion-like face, is well-built, and lives long. He is skilled in mathematics
        and is respected by scholars."
    condition: >
      Mercury occupies either its own sign (Gemini or Virgo) or its exaltation sign (Virgo)
      AND is placed in a kendra house (1H, 4H, 7H, or 10H) from Lagna or Moon.
    assertion: >
      Bhadra Mahapurusha Yoga produces exceptional intelligence, eloquence, mathematical
      skill, and scholarly excellence; the native is articulate, business-minded, and
      respected by learned people; the physique is strong with a prominent forehead;
      success in trade, communication, and intellectual pursuits is marked.
    scope: yoga
    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative = 1.0; ≥2 texts confirm Bhadra yoga = 1.3. capped at 0.95."
    caveats: "Mercury must be strong (unafflicted) and in a dignified position for Bhadra to fully manifest. A combust Mercury, even in own sign, weakens the yoga."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.75.4.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "75.4"
      text_excerpt: |
        "When Jupiter occupies its own sign or exaltation sign and is in a kendra house,
        Hamsa yoga is formed. The native is noble, just, handsome, and of generous disposition.
        He walks like a swan (hamsa), has a high forehead, and is devoted to dharma. He may
        be a teacher, judge, or philosopher."
    condition: >
      Jupiter occupies either its own sign (Sagittarius or Pisces) or its exaltation sign
      (Cancer) AND is placed in a kendra house (1H, 4H, 7H, or 10H) from Lagna or Moon.
    assertion: >
      Hamsa Mahapurusha Yoga produces a noble, dharmic, and spiritually elevated personality;
      the native is graceful, learned, and just; they excel as teachers, judges, philosophers,
      or spiritual leaders; material prosperity combined with wisdom is conferred; the native
      is naturally compassionate and respected.
    scope: yoga
    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative = 1.0; ≥2 texts confirm Hamsa yoga = 1.3. capped at 0.95."
    caveats: "Jupiter combust (unusual as Jupiter has a narrow combustion orb) significantly weakens Hamsa. Jupiter's aspect position relative to the Sun matters for the yoga's clarity."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.75.5.1
