  # ─── PERMANENT PLANETARY FRIENDSHIPS (BPHS Ch. 3) ──────────────────────────

  - rule_id: BPHS.3.55.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "3.55"
      text_excerpt: |
        "The Sun's permanent friends are the Moon, Mars, and Jupiter. Mercury is his
        enemy. Venus and Saturn are neutral to the Sun."
    condition: >
      Sun is being evaluated for its permanent (naisargika) friendship and enmity
      relationships with other grahas.
    assertion: >
      The Sun permanently regards Moon, Mars, and Jupiter as friends; Mercury as an
      enemy; and Venus and Saturn as neutral (sama). These relationships are fixed and
      do not change by transit or house position.
    scope: graha
    school: parashari
    confidence: 0.95
    confidence_rationale: >
      Declarative sutra-style statement = 1.0 textual_strength; confirmed by Brihat Jataka
      Ch.2, Saravali Ch.3, Phaladeepika ≥2 texts = 1.3 corroboration.
      min(1.0, 1.0 × 1.3) capped at 0.95.
    caveats: >
      Permanent friendship is one of two components; temporary friendship (based on
      transit position relative to natal) must be combined to get compound (tatkalika)
      friendship per BPHS Ch. 3.
    verified: true
    stub: false
    stub_reason: null

