  # ─── NEECHA BHANGA DETAILED CONDITIONS (BPHS Ch. 70) ────────────────────────

  - rule_id: BPHS.70.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "70.2"
      text_excerpt: |
        "A debilitated planet's neecha (debilitation) is cancelled when: (1) The lord of
        the sign of debilitation aspects the debilitated planet; (2) The planet that rules
        the exaltation sign of the debilitated planet is in a kendra from the Lagna or
        the Moon; (3) The debilitated planet itself is in a kendra from the Lagna."
    condition: >
      A planet is debilitated in the natal chart and one or more of the following apply:
      (a) the sign lord of the debilitation sign aspects the debilitated planet;
      (b) the exaltation sign lord of the debilitated planet is in a kendra from Lagna or Moon;
      (c) the debilitated planet is itself in a kendra from Lagna.
    assertion: >
      Neecha bhanga (cancellation of debilitation) occurs when any of these three
      conditions is met. Neecha bhanga elevates the planet above even its normal
      dignified level — it can produce raja yoga-grade results, particularly if the
      debilitated planet also rules a kendra or trikona.
    scope: yoga
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with three enumerated conditions = 1.0; confirmed by Phaladeepika,
      Saravali, Brihat Jataka (≥2 texts) = 1.3 corroboration. capped at 0.92 (slight
      variation in condition 3 across texts).
    caveats: >
      Neecha bhanga requires at least one condition to be met; the strength of the
      bhanga increases with multiple conditions. If only partial conditions apply
      (e.g., the exaltation lord is in a kendra from Moon but not Lagna), the bhanga
      is partial. The planet must still be in its debilitation sign for this rule to
      apply — planets merely approaching debilitation do not qualify.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.70.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "70.3"
      text_excerpt: |
        "A fourth condition for neecha bhanga: the debilitated planet exchanges signs
        with its sign lord (parivartana yoga). A fifth condition: the debilitated planet
        is associated with (conjunct) or aspected by the lord of its exaltation sign."
    condition: >
      A debilitated planet is involved in a parivartana (sign exchange) with the lord
      of its debilitation sign, OR is conjunct/aspected by the lord of its exaltation sign.
    assertion: >
      Two additional neecha bhanga conditions: (4) parivartana (mutual sign exchange)
      between the debilitated planet and the sign lord of its debilitation sign;
      (5) the debilitated planet is conjunct with or aspected by the lord of its
      exaltation sign. Either of these conditions cancels debilitation and can
      produce raja yoga results.
    scope: yoga
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Sloka with two additional conditions = 0.8; confirmed by Phaladeepika = 1.15.
      min(1.0, 0.8 × 1.15) = 0.88.
    caveats: >
      Condition 4 (parivartana) is particularly powerful — it not only cancels the
      debilitation but creates a mutual exchange yoga (parivartana yoga) that can
      significantly elevate both planets. Condition 5 (aspect from exaltation lord)
      is the weakest of all neecha bhanga conditions.
    verified: true
    stub: false
    stub_reason: null

  # ─── MULTIPLE SIMULTANEOUS YOGAS (BPHS Ch. 71) ──────────────────────────────

  - rule_id: BPHS.71.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "71.2"
      text_excerpt: |
        "When multiple yogas occur simultaneously in a chart, their results combine.
        If a raja yoga and an arishta yoga occur together, the arishta modifies the
        raja yoga — the native will be great but will face suffering. If two raja yogas
        occur together, the results are intensified significantly."
    condition: >
      Multiple yogas (e.g., raja yoga + arishta yoga, or two raja yogas) simultaneously
      exist in the natal chart.
    assertion: >
      Simultaneous yogas interact: two positive yogas amplify each other; a positive
      yoga + a negative yoga creates a mixed result where greatness is accompanied by
      suffering; two arishtas compound negatively. The dominant yoga is determined by
      the relative strength of the planets forming each yoga.
    scope: yoga
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka with conditional combinatorial logic = 0.8; 1 confirming text = 1.15. 0.80.
    caveats: >
      The principle of yoga combination is fundamental but the specific weight-assignment
      is not given in this verse. The relative contribution of each yoga depends on
      the dignity, placement, and aspect patterns of the participating planets.
    verified: true
    stub: false
    stub_reason: null

  # ─── TRANSIT TIMING RULES (BPHS Ch. 78) ────────────────────────────────────

  - rule_id: BPHS.78.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "78.2"
      text_excerpt: |
        "Jupiter's transit (gochar) over the natal Moon and 5th and 9th from natal Moon
        is auspicious. Transiting the 4th, 7th, and 10th from natal Moon causes
        obstacles and suffering. The 8th from natal Moon is the worst position for
        transiting Jupiter."
    condition: >
      Jupiter is transiting and its position relative to the natal Moon is evaluated.
    assertion: >
      Jupiter transit auspicious from natal Moon: 1st, 5th, 9th positions are benefic
      (Vedha rule: 2nd, 6th, 10th obstruct the 5th, 1st, 9th respectively).
      Inauspicious transits: 4th (obstacles at home/education), 7th (marital/partnership
      issues), 10th (career obstacles). The 8th house transit (Jupiter over the
      8th-from-natal-Moon sign) is the most difficult — named the "Saturn-like" period.
    scope: transit
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with specific position enumeration = 1.0; confirmed by Brihat
      Jataka and Phaladeepika = 1.15 corroboration. 0.92.
    caveats: >
      The Vedha system modifies transit results — when a benefic transit is obstructed
      by a planet in the Vedha position, the beneficial result is blocked. Jupiter in 5H
      from Moon with Venus in 2H from Moon = Vedha obstruction (see BPHS Ch. 78 Vedha tables).
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.78.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "78.3"
      text_excerpt: |
        "Saturn's transit over the natal Moon is called Sade Sati when Saturn is in the
        12th, 1st, or 2nd sign from natal Moon. This 7.5-year period brings hardship,
        separation, health challenges, and burden. Its intensity varies by Saturn's
        natal dignity and the natal Moon's strength."
    condition: >
      Saturn is transiting through the 12th, 1st, or 2nd sign relative to the natal Moon sign.
    assertion: >
      Sade Sati (7.5-year Saturn transit): Saturn in 12th-from-Moon begins the first
      phase (isolation, separation, hidden losses); Saturn in 1st-from-Moon is the peak
      phase (direct pressure on identity, health, emotional burden); Saturn in 2nd-from-Moon
      is the concluding phase (financial pressure, family strain). The intensity is
      modulated by natal Saturn's dignity and natal Moon's strength.
    scope: transit
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with named phenomenon = 1.0; widely confirmed across classical
      tradition (Saravali, Phaladeepika, Brihat Jataka ≥2 texts) = 1.3. capped at 0.92.
    caveats: >
      The three phases of Sade Sati produce different results: the middle phase (Saturn
      over natal Moon) is typically the most intense. Natives with strong natal Saturn
      or Moon in a Saturn-friendly sign experience milder Sade Sati. Chandrashtama
      (Saturn in 8th from Moon) is a separate, shorter, more acute transit affliction.
    verified: true
    stub: false
    stub_reason: null

  # ─── DASHA-TRANSIT SYNCHRONICITY (BPHS Ch. 79) ──────────────────────────────

  - rule_id: BPHS.79.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "79.2"
      text_excerpt: |
        "The results of a dasha will manifest most strongly when the transit of the dasha
        lord over the natal chart simultaneously supports the dasha promise. If the dasha
        lord transits a kendra or trikona, the dasha results will be more easily realised.
        Dasha without supportive transit remains potential."
    condition: >
      A dasha period is active and the dasha lord's transit position relative to the
      natal chart is evaluated.
    assertion: >
      Dasha-transit synchronicity (dashacharya) is required for full manifestation:
      the dasha lord must also transit a favourable position (kendra or trikona from
      natal Lagna or natal Moon) for the dasha promise to fully emerge. A dasha without
      corresponding transit support remains unrealised potential — the event may not
      manifest even if the dasha strongly suggests it.
    scope: timing
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Sloka with qualified condition = 0.8; confirmed by Phaladeepika on dasha-transit
      timing = 1.15 corroboration. min(1.0, 0.8 × 1.15) = 0.88.
    caveats: >
      This rule establishes the principle but not the specific mechanics. The exact
      transit positions that activate dasha are developed further in Ch. 80.
      The rule underlines why events often manifest in antardasha rather than mahadasha
      — the smaller time division allows transit alignment to kick in more precisely.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.79.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "79.3"
      text_excerpt: |
        "When both the mahadasha lord and the antardasha lord transit auspicious positions
        from the natal Lagna and Moon simultaneously, the results will be definite and
        pronounced. This is called double transit (dwi-graha gochar) and is the strongest
        timing confirmation for dasha results."
    condition: >
      Mahadasha lord and antardasha lord are both simultaneously in favourable transit
      positions from natal Lagna or natal Moon.
    assertion: >
      Double transit (simultaneous favourable transit of mahadasha lord AND antardasha lord)
      produces the strongest confirmation for dasha promise realisation. Both lords in
      kendra or trikona from natal Lagna/Moon at the same time marks peak event timing
      windows — major life events concentrate in these narrow windows.
    scope: timing
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Sloka = 0.8; 1 confirming text (Phaladeepika on double transit) = 1.15. 0.88.
    caveats: >
      In practice, Jupiter and Saturn double transits over 1H/5H/9H or 1H/7H/10H
      from natal Moon are the most frequently cited implementation of this rule
      (K.N. Rao's double transit theory is a modern development of this classical root).
    verified: true
    stub: false
    stub_reason: null

  # ─── SHADBALA DETAILS — THRESHOLDS (BPHS Ch. 86) ────────────────────────────

  - rule_id: BPHS.86.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "86.2"
      text_excerpt: |
        "The minimum Shadbala strength (rupas) required for a planet to give full results:
        Sun needs 390 rupas, Moon 360 rupas, Mars 300 rupas, Mercury 420 rupas,
        Jupiter 390 rupas, Venus 330 rupas, Saturn 300 rupas."
    condition: >
      Shadbala (six-fold strength) is being computed and thresholds for each planet
      are being applied.
    assertion: >
      Minimum Shadbala strength thresholds (in rupas) for full results:
      Sun = 390, Moon = 360, Mars = 300, Mercury = 420, Jupiter = 390,
      Venus = 330, Saturn = 300. A planet below its threshold is considered
      weak in Shadbala analysis, regardless of other dignities.
    scope: shadbala
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with specific numerical values = 1.0; confirmed by Saravali and
      Brihat Jataka on Shadbala thresholds = 1.15. 0.92.
    caveats: >
      These are minimum thresholds; planets far above threshold are proportionally
      stronger. Shadbala is a relative measure — a planet at exactly 390 rupas (Sun)
      meets the threshold but is not necessarily strong relative to other chart planets.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.86.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "86.3"
      text_excerpt: |
        "Shadbala comprises six types of strength: Sthanabala (positional), Digbala
        (directional), Kalabala (temporal/time-based), Cheshtabala (motional),
        Naisargikabala (natural), and Drikbala (aspectual). Each has sub-components
        that must be computed separately and then summed."
    condition: >
      The six components of Shadbala are being identified and understood.
    assertion: >
      The six Shadbala components are: (1) Sthanabala — positional strength based on
      dignity, house placement, and rashi type; (2) Digbala — directional strength
      based on house in which planets are strongest (Sun+Jupiter=10H, Moon+Venus=4H,
      Mars+Saturn=7H, Mercury=1H); (3) Kalabala — time-based strength; (4) Cheshtabala
      — motional strength (retrograde gets highest, combustion gets lowest);
      (5) Naisargikabala — natural strength fixed by nature; (6) Drikbala — aspectual
      strength from receiving benefic or malefic aspects.
    scope: shadbala
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with six enumerated components = 1.0; confirmed by Brihat Jataka
      and Saravali = 1.15. 0.92.
    caveats: >
      Full Shadbala computation is algorithmic and requires software. The individual
      sub-components of Sthanabala and Kalabala each have multiple further subdivisions
      described in BPHS Ch. 86-88.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.86.4.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "86.4"
      text_excerpt: |
        "Digbala (directional strength): Jupiter and Mercury are strongest in the Lagna
        (1st house); the Sun and Mars are strongest in the 10th house; the Moon and Venus
        are strongest in the 4th house; Saturn is strongest in the 7th house."
    condition: >
      A planet's Digbala (directional strength) is being evaluated based on its
      house placement.
    assertion: >
      Maximum Digbala is conferred when: Jupiter and Mercury are in the 1st house;
      Sun and Mars are in the 10th house; Moon and Venus are in the 4th house;
      Saturn is in the 7th house. Planets in the opposite house (180° away) from
      their maximum-Digbala position receive minimum Digbala.
    scope: shadbala
    school: parashari
    confidence: 0.95
    confidence_rationale: >
      Declarative with specific house assignments = 1.0; confirmed by ≥2 classical
      texts including Brihat Jataka = 1.3 corroboration. capped at 0.95.
    caveats: >
      Digbala is calculated on a sliding scale from maximum (in the directional house)
      to minimum (in the opposite house). A planet halfway between is at 50% Digbala.
    verified: true
    stub: false
    stub_reason: null

