      verse_ref: "54.2"
      text_excerpt: |
        "Kalachakra Dasha is based on the Moon's nakshatra pada (quarter) at birth.
        Each nakshatra has four padas; the pada determines which of two Kalachakra cycles
        (deha or jiva cycle) commences. Navamsha signs provide the dasha sequence."
    condition: >
      Kalachakra Dasha sequence is being determined from the natal Moon's nakshatra pada.
    assertion: >
      Kalachakra Dasha uses the natal Moon's nakshatra pada as the entry point into
      one of two cycles — Deha (body) cycle or Jiva (life force) cycle. The dasha
      sequence proceeds through Navamsha signs in a specific order. This is the most
      complex of the BPHS dasha systems.
    scope: dasha
    school: parashari
