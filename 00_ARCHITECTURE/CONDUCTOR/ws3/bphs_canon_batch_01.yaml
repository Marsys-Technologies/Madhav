      results from their lordship.
    scope: bhava
    school: parashari
    confidence: 0.95
    confidence_rationale: >
      Declarative = 1.0; ≥2 texts confirm = 1.3. capped at 0.95.
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.6.5.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "6.5"
      text_excerpt: |
        "Gemini, Virgo, Libra, Aquarius, and the first half of Sagittarius are
        sheersshodaya (rising head-first). Cancer, Scorpio, and Pisces are prishthodaya
        (rising feet/back first). Capricorn and Taurus and the second half of Sagittarius
        are ubhayodaya. Leo and Aries are also sheersshodaya."
    condition: >
      A rashi is being classified by its rising direction (sheersshodaya, prishthodaya,
      or ubhayodaya) for judging strength and timing.
    assertion: >
      Sheersshodaya signs (rising head-first: Gemini, Virgo, Libra, Leo, Aquarius, first
      half Sagittarius, Aries) are stronger by day. Prishthodaya signs (Cancer, Scorpio,
      Pisces) are stronger by night. This classification affects how quickly results
      manifest — head-rising signs deliver results in the early part of a dasha;
      back-rising signs in the later part.
    scope: bhava
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka with multiple subdivisions = 0.8; 1 confirming text (Brihat Jataka
      on rising-sign direction) = 1.15. 0.80 maintained due to recension variation
      on Taurus/Capricorn placement.
    caveats: >
      The assignment of Taurus and Capricorn varies slightly across recensions.
      The timing implication (early vs late in dasha) is from commentary tradition,
      not the verse itself.
    verified: true
    stub: false
    stub_reason: null

  # ─── RASHI ATTRIBUTES — ADDITIONAL (BPHS Ch. 7) ────────────────────────────

  - rule_id: BPHS.7.1.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "7.1"
      text_excerpt: |
        "Each sign has a corresponding body part: Aries governs the head, Taurus the face,
        Gemini the arms and shoulders, Cancer the chest, Leo the stomach, Virgo the hips
        and intestines, Libra the navel and lower abdomen, Scorpio the genitals, Sagittarius
        the thighs, Capricorn the knees, Aquarius the calves, Pisces the feet."
    condition: >
      A sign is being evaluated for its anatomical correspondence (kalapurusha body parts).
    assertion: >
      The natural zodiac (Kalapurusha) assigns each sign to a body part in the order
      from head to feet: Aries=head, Taurus=face/throat, Gemini=arms/shoulders,
      Cancer=chest/heart, Leo=stomach, Virgo=hips/intestines, Libra=navel/lower abdomen,
      Scorpio=genitals/pelvis, Sagittarius=thighs, Capricorn=knees, Aquarius=calves/ankles,
      Pisces=feet. Malefics in or afflicting a sign can indicate disease in the
      corresponding body part.
    scope: bhava
    school: parashari
    confidence: 0.95
    confidence_rationale: >
      Declarative = 1.0; ≥2 texts confirm Kalapurusha anatomy = 1.3. capped at 0.95.
    caveats: >
      Body-part rulership is kalapurusha-based (natural zodiac). Lagna-based 6H/8H/12H
      and sign affliction analysis provides the primary disease judgment; kalapurusha
      provides secondary corroboration.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.7.2.1
    source_verse:
      canonical_id: BPHS
