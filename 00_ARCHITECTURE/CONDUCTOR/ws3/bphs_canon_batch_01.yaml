  # ─── KARAKA-BHAVA DESTRUCTION RULE ──────────────────────────────────────────

  - rule_id: BPHS.10.13.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "10.13"
      text_excerpt: |
        "When the karaka of a bhava is placed in that very bhava, the bhava gets destroyed
        or severely damaged. This is called karako bhava nashaya — the significator
        placed in its own house destroys the house."
    condition: >
      The natural significator (naisargika karaka) of a bhava is placed in that same bhava
      in the natal chart (e.g., Jupiter in 5H, Venus in 7H, Sun in 1H, etc.).
    assertion: >
      Karaka placed in its own bhava is destructive to that bhava's significations —
      this is "karako bhava nashaya." Jupiter in 5H can reduce children; Venus in 7H
      can damage marriage; Sun in 1H can create ego-health conflicts. The rule applies
      generally to all karaka-bhava placements.
    scope: bhava
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative rule with named principle = 1.0; confirmed by Brihat Jataka,
      Saravali, Phaladeepika (≥2 texts) = 1.3 corroboration. capped at 0.92 (retaining
      some uncertainty for the "severely damaged" qualification level which varies).
    caveats: >
      The rule is not absolute — a well-dignified karaka in its own bhava may paradoxically
      become overpowering rather than damaging, especially for the 1H (Sun in Lagna can
      mean vitality/authority, not damage). The "destruction" is most pronounced when the
      karaka is also afflicted by malefics. Commentary tradition refines this as
      "overabundance of the significator quality displaces the practical results."
    verified: true
    stub: false
    stub_reason: null

