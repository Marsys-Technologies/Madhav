  # ─── TEMPORARY PLANETARY FRIENDSHIP (TATKALIKA MAITRI) ─────────────────────

  - rule_id: BPHS.3.62.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "3.62"
      text_excerpt: |
        "Planets occupying the 2nd, 3rd, 4th, 10th, 11th, and 12th signs from any planet
        become its temporary friends. Those in other signs become temporary enemies."
    condition: >
      Any graha is being evaluated for its temporary (tatkalika) friendship with another
      graha based on their relative sign positions in the natal chart.
    assertion: >
      A graha occupying the 2nd, 3rd, 4th, 10th, 11th, or 12th sign from a reference
      graha is its temporary friend. A graha occupying the 1st (same sign), 5th, 6th,
      7th, 8th, or 9th sign is its temporary enemy.
    scope: graha
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative sutra = 1.0; 1 other text (Saravali) confirms = 1.15 corroboration.
      min(1.0, 1.0 × 1.15) = 0.92 (rounded).
    caveats: >
      Temporary friendship is calculated from natal positions, not transit. The 1st sign
      (same sign) is enemy, not neutral — planets in the same sign are temporary enemies
      of each other per this schema.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.3.63.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "3.63"
      text_excerpt: |
        "Add the permanent and temporary friendships: Friend + Friend = Great Friend
        (Adhi Mitra); Friend + Enemy = Neutral (Sama); Neutral + Friend = Friend;
        Neutral + Enemy = Enemy; Enemy + Enemy = Great Enemy (Adhi Shatru);
        Enemy + Friend = Neutral."
    condition: >
      Combining permanent (naisargika) and temporary (tatkalika) friendship to determine
      the compound (panchadha) friendship relationship.
    assertion: >
      The compound relationship is the sum of permanent and temporary: Friend+Friend =
      Great Friend; Friend+Enemy or Enemy+Friend = Neutral; Neutral+Friend = Friend;
      Neutral+Enemy = Enemy; Enemy+Enemy = Great Enemy. This five-fold classification
      (panchadha maitri) is the operative friendship for chart interpretation.
    scope: graha
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative combinatorial rule = 1.0; confirmed by Saravali = 1.15 corroboration.
      0.92.
    caveats: >
      Compound friendship is natally fixed (it combines natal temporary + permanent);
      it changes when a different chart is analysed. Used primarily for assessing
      planetary strength and yoga formation quality.
    verified: true
    stub: false
    stub_reason: null

  # ─── PLANETARY WAR (GRAHA YUDDHA) ──────────────────────────────────────────

  - rule_id: BPHS.4.1.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "4.1"
      text_excerpt: |
        "When two planets occupy the same degree or are within one degree of each other
        in the same sign, a planetary war (graha yuddha) is said to occur. The Sun and
        Moon do not enter into planetary war."
    condition: >
      Two planets (excluding Sun and Moon) occupy the same sign and are within
      approximately 1° of each other.
    assertion: >
      A planetary war (graha yuddha) occurs when any two planets other than Sun and
      Moon are within 1° of each other in the same sign. The Sun and Moon are excluded
      from graha yuddha.
    scope: graha
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative definitional rule = 1.0; 1 text (Saravali Ch.7) confirms = 1.15.
      0.92.
    caveats: >
      Some recensions specify the orb as less than 1° strictly (exact conjunction);
      others allow up to 1°. Rahu and Ketu also excluded in most traditional readings
      as they are shadow planets without a physical body for war.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.4.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "4.2"
      text_excerpt: |
        "The planet with greater latitude (north latitude preferred) or greater brightness
        is the victor in a planetary war. The defeated planet loses its power to give results."
    condition: >
      Two planets are in graha yuddha (within 1° in the same sign).
    assertion: >
      The victor of a planetary war is the planet with greater northern latitude or
      greater brightness at the time of war. The defeated planet is rendered incapable
      of giving its significations — it becomes effectively combust or incapacitated.
    scope: graha
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Sloka with qualifier on brightness/latitude method — slight ambiguity = 0.8;
      1 confirming text (Saravali Ch.7) = 1.15 corroboration. min(1.0, 0.8 × 1.15) = 0.92.
      Adjusted to 0.88 given dual criteria creating interpretive ambiguity.
    caveats: >
      "Greater latitude" typically means the planet with higher north latitude wins.
      When latitudes are equal, brightness (visual magnitude) determines victor.
      The exact rule for simultaneous brightness+latitude judgment varies by
      commentator tradition.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.4.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "4.3"
      text_excerpt: |
        "If the victorious planet is a benefic, the results of its house will be enhanced.
        If the defeated planet is a natural benefic, the auspicious results of that bhava
        will be destroyed."
    condition: >
      A graha yuddha has occurred and the victor and defeated planet are identified.
    assertion: >
      Victory of a natural benefic in graha yuddha enhances the results of its ruled
      houses. Defeat of a natural benefic destroys the auspicious results of the bhavas
      it rules.
    scope: graha
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka with conditional framing = 0.8; 1 confirming text = 1.15. But the conditional
      nature (benefic-specific) warrants careful handling → 0.80 maintained.
    caveats: >
      The rule applies specifically to natural benefics. Natural malefics defeated in
      war may paradoxically reduce their malefic effects — this nuance is addressed
      in BPHS commentary, not the verse itself.
    verified: true
    stub: false
    stub_reason: null

  # ─── COMBUSTION (ASTA / MOUDYA) RULES ──────────────────────────────────────

  - rule_id: BPHS.4.5.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "4.5"
      text_excerpt: |
        "When a planet is within a certain distance of the Sun, it becomes combust (asta)
        and loses its ability to give results. Mars within 17°, Mercury within 12° (14°
        retrograde), Jupiter within 11°, Venus within 10° (8° retrograde), Saturn within
        15° of the Sun becomes combust."
    condition: >
      A planet is within the following orb of the Sun (longitudinal difference):
      Mars within 17°, Mercury within 12° (14° if retrograde), Jupiter within 11°,
      Venus within 10° (8° if retrograde), Saturn within 15°.
    assertion: >
      A planet within the specified degrees of the Sun is combust (asta) and loses most
      of its power to deliver significations — both as a significator and as a house lord.
      Retrograde planets have slightly different combustion orbs.
    scope: graha
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with specific degree values = 1.0; confirmed by Saravali Ch.4 and
      Brihat Jataka = 1.15 corroboration. min(1.0, 1.0 × 1.15) = 0.92 (rounding down
      from 1.15 cap for cross-text minor variation in orbs).
    caveats: >
      Saravali and Brihat Jataka give slightly different combustion orbs; the values
      here are from Santhanam's BPHS translation. Moon is never combust (luminaries
      do not combust each other). The Moon is separated as a special case throughout.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.4.6.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "4.6"
      text_excerpt: |
        "A combust planet, even if in exaltation or in its own sign, cannot fully give its
        results. However, if retrograde and combust simultaneously, the planet regains some
        of its power."
    condition: >
      A planet is both combust (asta) and in high dignity (exaltation or own sign), or
      alternatively, both combust and retrograde simultaneously.
    assertion: >
      Combustion overrides exaltation/own-sign strength — a combust planet cannot fully
      deliver its significations even in high dignity. Exception: retrograde combustion
      partially neutralises the debilitating effect of combustion, restoring some efficacy.
    scope: graha
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka with qualifier ("cannot fully") = 0.8; 1 confirming text (Saravali on
      retrograde combustion exception) = 1.15. min(1.0, 0.8 × 1.15) = 0.92.
      Adjusted to 0.80 due to interpretive variation on "some power" retrograde exception.
    caveats: >
      The retrograde + combust exception is acknowledged in Saravali but not universally
      accepted by all commentators. The degree of power restoration varies by tradition.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.4.7.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "4.7"
      text_excerpt: |
        "The Moon does not become combust. However, when within 12 degrees of the Sun
        (the amavasya window), the Moon is afflicted and its capacity to benefit the
        chart is weakened."
    condition: >
      Moon is within 12° of the Sun (approaching or separating from amavasya/new Moon).
    assertion: >
      Moon does not become formally combust (asta) — it is a luminary and combustion
      applies only to the five tara grahas. However, Moon within 12° of the Sun is
      weakened in its ability to confer benefic results — this is a special condition
      distinct from formal combustion.
    scope: graha
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka with clarifying distinction = 0.8; 1 confirming text = 1.15. 0.80 maintained
      as this verse is a clarification not a primary sutra.
    caveats: >
      The 12° rule for Moon's amavasya affliction is Parashara's; other texts use
      slightly different orbs (8° or 15°). Waning Moon (Krishna Paksha) is already
      treated as a functional malefic by BPHS Ch. 26 independent of this rule.
    verified: true
    stub: false
    stub_reason: null

  # ─── RASHI ATTRIBUTES — ADDITIONAL (BPHS Ch. 6) ────────────────────────────

  - rule_id: BPHS.6.1.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "6.1"
      text_excerpt: |
        "Aries, Cancer, Libra, and Capricorn are movable (chara) signs. Taurus, Leo,
        Scorpio, and Aquarius are fixed (sthira) signs. Gemini, Virgo, Sagittarius,
        and Pisces are dual (dvisva or ubhaya) signs."
    condition: >
      A rashi is being classified by its modality (chara/sthira/dvisva).
    assertion: >
      The four movable (cardinal) signs are Aries, Cancer, Libra, Capricorn. The four
      fixed signs are Taurus, Leo, Scorpio, Aquarius. The four dual (mutable) signs are
      Gemini, Virgo, Sagittarius, Pisces. This classification affects house lord
      strength in Jaimini-style readings and general delineation.
    scope: bhava
    school: parashari
    confidence: 0.95
    confidence_rationale: >
      Declarative = 1.0; ≥2 texts confirm = 1.3 corroboration. capped at 0.95.
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.6.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "6.2"
      text_excerpt: |
        "Aries, Taurus, Gemini, Cancer, Leo, and Virgo are northern rashis (uttara).
        Libra, Scorpio, Sagittarius, Capricorn, Aquarius, and Pisces are southern rashis
        (dakshina). The northern signs are stronger by day; southern signs stronger by night."
    condition: >
      A sign is being evaluated for its directional strength and day/night quality.
    assertion: >
      Signs Aries through Virgo (1–6) are northern; Libra through Pisces (7–12) are southern.
      Northern signs are stronger during daytime and in natal charts of natives born during
      the day; southern signs during nighttime.
    scope: bhava
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka with day/night qualifier = 0.8; 1 confirming text = 1.15. 0.80 maintained
      for practical application uncertainty.
    caveats: >
      This north/south rashi classification is used in ashtakavarga and some dasha
      strength calculations, not primarily in house delineation.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.6.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "6.3"
      text_excerpt: |
        "Aries, Leo, and Sagittarius are fiery (agni) signs. Taurus, Virgo, and Capricorn
        are earthy (prithvi) signs. Gemini, Libra, and Aquarius are airy (vayu) signs.
        Cancer, Scorpio, and Pisces are watery (jala) signs."
    condition: >
      A rashi is being classified by its elemental nature (tattva/bhuta).
    assertion: >
      The four elemental triplicities are: Fire signs (Aries, Leo, Sagittarius), Earth signs
