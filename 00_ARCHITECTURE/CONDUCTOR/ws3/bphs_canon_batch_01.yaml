    scope: bhava
    school: parashari
    confidence: 0.95
    confidence_rationale: >
      Declarative = 1.0; ≥2 texts confirm = 1.3. capped at 0.95.
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.6.4.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "6.4"
      text_excerpt: |
        "Aries, Gemini, Leo, Libra, Sagittarius, and Aquarius are odd (vishama) signs —
        they are masculine. Taurus, Cancer, Virgo, Scorpio, Capricorn, and Pisces are
        even (sama) signs — they are feminine."
    condition: >
      A rashi is being classified by its odd/even (masculine/feminine) quality.
    assertion: >
      Odd-numbered signs (1,3,5,7,9,11 = Aries through Aquarius, every other) are masculine
      (vishama, odd); even-numbered signs (2,4,6,8,10,12) are feminine (sama, even).
