  - rule_id: BPHS.26.9.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "26.9"
      text_excerpt: |
        "The Moon gains paksha bala (phase strength) in proportion to its distance from
        the Sun. A full Moon (180 degrees from Sun) has maximum paksha bala. A new Moon
        (0 degrees from Sun) has zero paksha bala. The Sun gains strength as it approaches
        the full Moon (minimum) to 0 degrees (maximum — solar paksha bala is inverse of
        Moon's)."
    condition: The Moon's or Sun's paksha bala is being evaluated.
    assertion: >
      Moon's paksha bala ranges from 0 (new moon) to maximum (full moon); the closer to
      full moon, the stronger the Moon is in the chart; conversely, the Sun's paksha bala
      is strongest when the Moon is new and weakens as the Moon approaches fullness;
      this affects the overall shadbala scores of both luminaries.
    scope: shadbala
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative strength principle = 1.0; Saravali confirms paksha bala concept = 1.15. 0.92 → 0.88."
    caveats: "Paksha bala is a continuous gradient — not binary (waxing/waning). Charts at exact full moon or new moon show extreme values."
    verified: true
    stub: false
    stub_reason: null

