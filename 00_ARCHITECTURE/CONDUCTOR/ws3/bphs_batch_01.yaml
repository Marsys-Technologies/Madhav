  # ─── PANCHADHA MAITRI (COMPOUND FRIENDSHIP) ──────────────────────────────────

  - rule_id: BPHS.3.48.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "3.48"
      text_excerpt: |
        "To determine the compound (temporal) friendship between two planets: if they are
        in mutual kendra positions (1-1, 1-4, 1-7, 1-10), they become temporary friends.
        If a planet occupies the 2nd, 3rd, 4th, 10th, 11th, or 12th house from another,
        it becomes a temporary friend. If in the 1st, 5th, 6th, 7th, 8th, or 9th — temporary
        enemy."
    condition: >
      Two planets are in specific mutual positional relationships in a natal chart; their
      combined (panchadha maitri) friendship is being evaluated.
    assertion: >
      Panchadha maitri is computed by combining permanent (naisargika) friendship with
      temporary (tatkalika) friendship: permanent friend + temporary friend = great friend;
      permanent friend + temporary enemy = neutral; permanent enemy + temporary friend =
      neutral; permanent enemy + temporary enemy = great enemy. This compound relationship
      determines the exact quality of inter-planetary interaction in the chart.
    scope: graha
    school: parashari
    confidence: 0.80
    confidence_rationale: "Sloka with conditional logic = 0.8; Saravali confirms the panchadha maitri framework = 1.0. 0.80."
    caveats: "Temporary friendship is chart-specific and changes for every horoscope; this rule requires applying it to the specific planetary positions of the chart in question."
    verified: true
    stub: false
    stub_reason: null

