      verse_ref: "ch8.v8"
      text_excerpt: |
        "A retrograde planet in the annual chart is in an intensified state: it appears
        to move backward, reviewing and reconsidering matters related to its significations.
        Events signified by a retrograde planet in the annual chart may involve revisiting
        past matters, second chances, delays, or reversals."
    condition: >
      A planet is retrograde (in apparent backward motion) at the moment of the
      annual solar return and therefore retrograde in the annual chart.
    assertion: >
      Events signified by the retrograde planet in the annual chart involve revisiting
      past matters, second chances, unexpected reversals, or delays; the planet's
      forward progress is temporarily suspended, and its significations operate in
      a reflective or recursive mode.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
