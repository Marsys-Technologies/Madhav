      of TAJAKA.ch4.APPROX.1.1 for the general retrograde principle (though the
      specific Itthasala modification remains a stub).
    caveats: >
      Applies in Varshaphal context only. A retrograde benefic can still form
      effective Itthasala; a retrograde planet's Itthasala orb calculations remain
