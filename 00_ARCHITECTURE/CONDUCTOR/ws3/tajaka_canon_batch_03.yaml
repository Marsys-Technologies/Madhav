        environmental tone, regardless of which house Muntha occupies. Conversely,
        Muntha in a sign owned by a natural malefic (Aries, Scorpio, Capricorn,
        Aquarius) adds a degree of harshness or austerity to the year's environmental tone."
    condition: >
      Muntha falls in a benefic-owned sign (Venus: Taurus/Libra; Mercury: Gemini/Virgo;
      Jupiter: Sagittarius/Pisces) OR in a malefic-owned sign (Mars: Aries/Scorpio;
      Saturn: Capricorn/Aquarius; Sun: Leo; Moon: Cancer is neutral/benefic).
    assertion: >
      Benefic-owned sign Muntha: gentle, supportive annual environmental tone,
      regardless of house. Malefic-owned sign Muntha: adds harshness, austerity,
      or challenge to the environmental tone; house placement still governs overall
      quality but is coloured by the sign's lord.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with qualifier = 0.8 × 0.9 = 0.72.
    caveats: >
      Applies in Varshaphal context only. Sign ownership colouring is a secondary
      Muntha modifier; house placement (kendra vs. dusthana) remains the primary
      Muntha quality indicator.
    verified: true
    stub: false
    stub_reason: null

