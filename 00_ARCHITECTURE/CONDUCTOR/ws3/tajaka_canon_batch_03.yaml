    stub: false
    stub_reason: null

  # ─── TAJAKA SUMMARY: SCHOOL DIVERGENCES FOR CONCORDANCE ─────────────────────

  - rule_id: TAJAKA.ch1.v12.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch1.v12"
      text_excerpt: |
        "Summary of key Tajaka divergences from Parashari: (1) Tajaka uses applying/
        separating distinction in aspects (Itthasala/Ishrafa); Parashari does not.
        (2) Tajaka uses moiety orbs; Parashari uses full-sign aspects. (3) Tajaka
        has Muntha and Varshesh as primary annual tools; Parashari has no equivalent.
        (4) Tajaka Sahams are distinct from any Parashari calculation."
    condition: >
      A summary of methodological divergences between Tajaka and Parashari is being
      catalogued for multi-school concordance analysis.
    assertion: >
      Four primary Tajaka-Parashari divergences: (1) aspect direction-sensitivity
      vs. sign-based; (2) moiety orbs vs. full-sign; (3) Muntha/Varshesh tools have
      no Parashari equivalent; (4) Sahams are distinct from all Parashari calculations.
      These divergences prevent direct rule-for-rule Tajaka-Parashari mapping.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style enumeration for concordance = 0.8 × 1.1 = 0.88.
    caveats: >
      This is a concordance-layer rule for the MARSYS multi-school engine. Applicable
      specifically when comparing Tajaka annual indications against Parashari natal
      indications for the same life domain.
    verified: true
    stub: false
    stub_reason: null

