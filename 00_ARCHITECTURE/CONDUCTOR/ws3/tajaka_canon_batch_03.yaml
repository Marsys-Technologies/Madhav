  # ─── TAJAKA: ANNUAL PLANETARY PERIOD DURATION ESTIMATES ──────────────────────

  - rule_id: TAJAKA.ch11.v4.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch11.v4"
      text_excerpt: |
        "In the 16-measures technique, the approximate monthly durations assigned to
        each planet in a standard-strength year are as follows: Sun — 1.5 months;
        Moon — 1 month; Mars — 0.75 months; Mercury — 1.25 months; Jupiter — 1.5 months;
        Venus — 1.25 months; Saturn — 1.75 months. Total approximately 9 months
        (the remaining 3 months distributed proportionally by relative strength)."
    condition: >
      Standard base durations for each planet in the 16-measures technique are
      being applied to a Tajaka annual chart.
    assertion: >
      Base monthly allocations (before strength-based adjustment): Sun 1.5m, Moon 1m,
      Mars 0.75m, Mercury 1.25m, Jupiter 1.5m, Venus 1.25m, Saturn 1.75m. These are
      starting points; actual allocation adjusts proportionally by each planet's
      Tajaka strength score for the specific annual chart.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with numerical data = 0.8; however, the "approximately 9 months" caveat
      introduces uncertainty about how the remaining 3 months are distributed,
      reducing to 0.72. This partially resolves TAJAKA.ch11.APPROX.1.1.
    caveats: >
      Applies in Varshaphal context only. The base durations are a starting framework;
      the specific chart's planetary strengths adjust them. Different Tajaka commentators
      give slightly different base figures; Neelakanthi's values are used here.
    verified: true
    stub: false
    stub_reason: null

