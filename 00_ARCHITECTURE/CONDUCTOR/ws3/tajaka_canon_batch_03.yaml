  # ─── TAJAKA QUALITY CONTROL: PRACTITIONER DISCIPLINE RULES ──────────────────

  - rule_id: TAJAKA.ch20.v9.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch20.v9"
      text_excerpt: |
        "The Tajaka astrologer must compute Itthasala/Ishrafa from the actual degree
        positions of planets in the annual chart — not from their sign positions alone.
        A common error is declaring Itthasala merely because two planets are in the same
        sign; they must also be within the moiety orb and the faster must be at a lesser
        degree."
    condition: >
      Two planets are in the same sign in the annual chart; a check is being made
      for Itthasala.
    assertion: >
      Same-sign co-placement is necessary but not sufficient for Itthasala; the faster
      planet must also be at a lesser degree (approaching the slower) AND both must
      be within the combined half-moiety orb. Planets in the same sign where the
      faster is already past the slower (greater degree) are in Ishrafa, not Itthasala.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style corrective rule = 0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only. This is the most common practitioner error
      in Tajaka analysis; the degree-order check is non-negotiable for correct
      Itthasala identification.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch20.v10.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch20.v10"
      text_excerpt: |
        "Tajaka predictions should always be stated as tendencies and probabilities,
        not as certainties. The text of Neelakanthi itself uses words like 'tends to',
        'is likely', 'may occur' — this probabilistic language is not weakness but
        wisdom. Astrology, including Tajaka, is a probability instrument, not a
        destiny instrument."
    condition: >
      A Tajaka annual chart prediction is being formulated for communication to
      the native.
    assertion: >
      All Tajaka predictions must be framed probabilistically: "tends to", "is likely",
      "may occur", "inclines toward". Deterministic language ("will happen", "will
      definitely") violates the Neelakanthi text's own framing and overstates the
      instrument's reliability.
    scope: varshaphal
    school: tajaka
    confidence: 0.95
    confidence_rationale: >
      Sutra-style meta-ethical rule = 1.0; cross-text BPHS also uses probabilistic
      language = 1.15 → cap at 0.95.
    caveats: >
      This rule applies universally to all Tajaka predictions. Per MARSYS ethical
      framework: probabilistic, calibrated language is required for all annual chart
      outputs. This is a hard constraint.
    verified: true
    stub: false
    stub_reason: null

