        "The first planet the annual Lagna lord applies to in Itthasala (the first
        Itthasala by degree-closeness) defines the opening theme of the year. The
        native's initial focus and the first significant events of the year tend to
        be in the domain of the planet the Lagna lord first applies to."
    condition: >
      The annual Lagna lord has multiple Itthasala targets; the one with the smallest
      degree-separation (closest applying aspect within orb) is the first Itthasala.
    assertion: >
      The first Itthasala of the Lagna lord defines the year's opening theme; the
      domain of the planet first applied to (by degree-closeness) tends to produce
      the earliest and most immediately prominent events of the year.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with qualifier = 0.8 × 0.9 = 0.72.
    caveats: >
      Applies in Varshaphal context only. "Opening theme" refers to the first 1–3
      Tajaka months; later Itthasalas (wider orb, therefore later completion) define
      the middle and later parts of the year respectively.
    verified: true
    stub: false
    stub_reason: null

