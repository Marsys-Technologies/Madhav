  # ─── LORD OF DUSTHANA IN DUSTHANA — VIPARITA RAJA YOGA ───────────────────────

  - rule_id: BPHS.39.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "39.2"
      text_excerpt: |
        "If the lord of the 6th, 8th, or 12th house is placed in another of these three
        houses, a Viparita Raja Yoga is formed. The native gains power and success through
        the reversal of misfortunes — enemies are destroyed, debts are removed, and losses
        become gains."
    condition: >
      The lord of the 6H, 8H, or 12H is placed in any of the other two dusthana houses
      (e.g., 6L in 8H, 8L in 12H, 12L in 6H, etc.) in the natal chart.
    assertion: >
      Viparita Raja Yoga occurs when dusthana lords exchange into other dusthanas; the native
      gains through reversals — apparent misfortunes transform into opportunities; enemies are
      defeated, diseases overcome, debts cleared, and losses convert to gains; this yoga is
      activated most powerfully during the dasha of the involved planet(s).
    scope: yoga
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative yoga condition = 1.0; Saravali and Phaladeepika confirm Viparita Raja Yoga = 1.15. 0.92 → 0.88."
    caveats: "Viparita Raja Yoga's benefits depend on the involved dusthana lords not aspecting or weakening good houses. A strong Viparita Yoga can backfire if the dusthana lord also aspects 1H/5H/9H malefically."
    verified: true
    stub: false
    stub_reason: null

  # ─── BHAVA PARIVARTAN YOGA ────────────────────────────────────────────────────

  - rule_id: BPHS.27.20.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "27.20"
      text_excerpt: |
        "When two house lords mutually exchange houses (each in the other's sign), a Parivartan
        yoga (Nabhas yoga variant) is formed. The two houses become interconnected and each
        lord acts as if it were in its own house. Parivartan between good lords gives excellent
        results."
    condition: Two house lords are in mutual exchange — each in the other's sign — in the natal chart.
    assertion: >
      Parivartan yoga (mutual exchange) effectively places both planets in their own houses
      in terms of functional power; the two houses whose lords are in exchange become linked
      and mutually supportive; Parivartan between trikona lords and kendra lords produces
      powerful rajayoga-type results.
    scope: yoga
    school: parashari
    confidence: 0.80
    confidence_rationale: "Sloka = 0.8; Saravali confirms parivartan concept = 1.0. 0.80."
    caveats: "Parivartan between a dusthana lord and a good house lord can be challenging — it drags the good house's lord into dusthana territory."
    verified: true
    stub: false
    stub_reason: null

