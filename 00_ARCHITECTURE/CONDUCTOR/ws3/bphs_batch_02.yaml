    assertion: >
      Malefic planets in upachaya houses (3H, 6H, 10H, 11H) improve significantly over time
      — their natural assertive and challenging quality drives competitive success; natural
      benefics in upachaya houses give moderate but growing results; all planets in upachaya
      houses reward persistence and long-term effort.
    scope: bhava
    school: parashari
