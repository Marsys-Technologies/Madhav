      text_excerpt: |
        "The upachaya houses (3rd, 6th, 10th, and 11th) improve over time. Malefic planets
        in upachaya houses give better results as the native ages. Natural benefics in
        upachaya houses give moderate results early and improve. The upachaya houses reward
        sustained effort and persistence."
