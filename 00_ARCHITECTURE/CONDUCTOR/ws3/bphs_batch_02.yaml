  - rule_id: BPHS.11.16.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "11.16"
      text_excerpt: |
        "If the significator (karaka) of a house is placed in that same house, the signification
        suffers. For example, Jupiter (karaka for children) in the 5th house may reduce children.
        The Sun (karaka for father) in the 9th may cause difficulty with the father."
    condition: The natural significator (karaka) of a house is placed in that same house.
    assertion: >
      Karako bhavo nashto — when the natural karaka of a house occupies that house, the
      signification of that house tends to suffer or be reduced; Jupiter in 5H may reduce
      children despite otherwise being a benefic in a trinal house; Sun in 9H may harm the
      father despite otherwise being well-placed in a dharma house.
    scope: bhava
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative principle with examples = 1.0; Saravali and Phaladeepika confirm Karako bhavo nashto = 1.15. 0.92 → 0.88."
    caveats: "This rule is contested in practice — many astrologers find Jupiter in 5H does not reliably reduce children. The degree of debilitation of the karaka and aspects received modulate this rule."
    verified: true
    stub: false
    stub_reason: null

  # ─── BHAVA MADHYA (CUSP) AND STRENGTH ────────────────────────────────────────

  - rule_id: BPHS.11.18.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "11.18"
      text_excerpt: |
        "The middle degree (bhava madhya) of each house is the strongest point of that house.
        A planet at or near the bhava madhya has maximum influence on that house's significations.
        As a planet moves away from the madhya toward the cusp, its influence weakens."
    condition: A planet is placed near the middle (madhya) degree of a house vs. near the cusp.
    assertion: >
      Planets at or near the bhava madhya (house midpoint) exert maximum influence on that
      house's significations; planets near the cusp border between two houses have diluted
      influence on both; this principle is relevant in equal and unequal house system readings.
    scope: bhava
    school: parashari
    confidence: 0.80
    confidence_rationale: "Declarative principle = 1.0; but varies by house system in use = 0.8 after adjustment. Saravali partially confirms. 0.80."
    caveats: "This principle applies more clearly in the Sripati/Alcabitius unequal house system than in equal-sign houses where house madhya equals sign midpoint."
    verified: true
    stub: false
    stub_reason: null

