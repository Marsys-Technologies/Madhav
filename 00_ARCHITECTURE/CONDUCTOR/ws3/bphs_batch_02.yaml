        powerful. A strong 6th lord in good position can create powerful adversaries."
    condition: The sixth house lord occupies the sixth house itself or a kendra/trikona house.
    assertion: >
      6L in its own house (6H) destroys the native's enemies and conquers disease/debt;
      conversely, 6L placed in a kendra or trikona strengthens enemies and adversaries
