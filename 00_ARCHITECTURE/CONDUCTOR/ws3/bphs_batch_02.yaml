      A Raja Yoga is formed when kendra and trikona lords are in mutual conjunction or aspect;
      the yoga gives rise to authority, fame, and prosperity — particularly during the dasha
      of either of the involved planets; the stronger and more dignified the planets, the more
      powerful the yoga's results.
