  # ─── TAJAKA AND PARASHARI: KEY DIVERGENCES ───────────────────────────────────

  - rule_id: TAJAKA.ch1.v6.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch1.v6"
      text_excerpt: |
        "Tajaka differs fundamentally from Parashari in its treatment of aspects.
        In Parashari, planets cast special full/half/quarter aspect from their sign
        to other signs regardless of degree. In Tajaka, the aspect must be within
        the precise moiety orb and must be an applying aspect (Itthasala) to be
        operative. A separating Tajaka aspect (Ishrafa) is analytically different
        from a Parashari aspect."
    condition: >
      The distinction between Tajaka and Parashari aspect methodology is being
      clarified for a combined multi-system chart analysis.
    assertion: >
      Tajaka aspects are degree-precise and direction-sensitive (applying vs. separating);
      they cannot be conflated with Parashari aspects, which are sign-based and
      direction-neutral. A configuration that appears as a Parashari aspect may not
      qualify as Tajaka Itthasala, and vice versa.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style comparative clarification = 0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only — and specifically to the distinction between
      systems. This rule is critical for MARSYS multi-school analysis to prevent
      conflating Parashari and Tajaka aspect judgements.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch1.v7.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch1.v7"
      text_excerpt: |
        "Unlike Parashari, Tajaka does not recognise the permanent special aspects
        of Mars (4th and 8th), Jupiter (5th and 9th), and Saturn (3rd and 10th).
        In the annual chart, all five Tajaka aspects (0°, 60°, 90°, 120°, 180°)
        apply equally to all planets; no planet casts a unique long-range aspect
        in Tajaka."
    condition: >
      The annual chart is being analysed using the Tajaka method; Parashari special
      aspects (Mars to 4H/8H, Jupiter to 5H/9H, Saturn to 3H/10H) are in question.
    assertion: >
      Parashari special aspects are NOT operative in the Tajaka annual chart analysis;
      all planets use the standard five Tajaka aspects only. Applying Parashari
      special aspects to a Tajaka annual chart analysis is a methodological error.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style explicit correction = 0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only. When a Tajaka annual chart is used in
      conjunction with a Parashari natal chart reading, the systems must be kept
      methodologically separate; only Tajaka aspects are used in the annual chart,
      only Parashari aspects in the natal chart.
    verified: true
    stub: false
    stub_reason: null

