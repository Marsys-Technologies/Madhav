  # ─── ANNUAL CHART INTEGRATION: COMBINING FACTORS ────────────────────────────

  - rule_id: TAJAKA.ch15.v3.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch15.v3"
      text_excerpt: |
        "In combining the Tajaka annual chart indications, the native's natal Dasha
        period must always be the first reference. If the Dasha does not support the
        event, the annual chart cannot produce it. The annual chart only activates
        what is possible within the Dasha's scope."
    condition: >
      An annual chart indication (positive Itthasala, Saham activation, strong
      Muntha/Varshesh) is being assessed against the native's concurrent natal
      Dasha period.
    assertion: >
      If the natal Dasha period supports the indicated event (e.g., Dasha of 7th
      lord for marriage), the annual chart indication strengthens and times it.
      If the Dasha does not support the event, the annual chart indication alone
      cannot produce it — it remains a potential that goes unrealised in that year.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style with explicit prioritisation rule = 0.8; 1 confirming text (BPHS
      Dasha-transit integration doctrine) = 1.1. 0.8 × 1.1 = 0.88.
    caveats: >
      This is the most important integration principle in Tajaka: the Dasha is the
      engine, the annual chart is the timing instrument. Applies in Varshaphal context
      and governs all annual chart predictions.
