rules:

  # ─── ITTHASALA REFINEMENTS ───────────────────────────────────────────────────

  - rule_id: TAJAKA.ch4.v6.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v6"
      text_excerpt: |
        "When the planet forming Itthasala with the Lagna lord is also the lord of
        the house whose matters are under enquiry, the Itthasala is doubly significant.
        The planet serves as both the subject and its own lord, concentrating the
        indication strongly."
    condition: >
      The planet forming Itthasala with the annual Lagna lord is simultaneously the
      lord of the house whose domain is being judged (e.g., the 7th lord for marriage
      is in Itthasala with the Lagna lord, and the 7th lord and the Itthasala planet
      are the same planet).
    assertion: >
      The double-significance Itthasala strongly concentrates the annual indication;
      the domain in question (7th, 5th, 10th, etc.) is more forcefully activated
      than in a standard single-lord Itthasala.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka with qualifier ("doubly significant") = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. This configuration requires the same planet
      to wear two roles simultaneously; check that the house lordship is correctly
      calculated for the annual Lagna (not natal Lagna).
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch4.v7.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v7"
      text_excerpt: |
        "Itthasala involving the Moon as one of the two planets is particularly
        important for timing, since the Moon's relatively rapid movement means the
        applying aspect completes earliest and first activates the promise. Moon
        Itthasalas often indicate the initial phase of the year when a matter first
        emerges."
    condition: >
      The Moon is one of the two planets in an Itthasala configuration in the annual
      chart; the Moon is the faster-moving planet applying toward the slower planet.
    assertion: >
      The Moon Itthasala activates the promised matter earliest in the year (within
      the first 1–3 months); it often marks the initial emergence or first visible
      sign of the matter, rather than its final completion.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka declarative with logical basis = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. Moon Itthasala timing depends on the
      Moon's position in the annual chart and her daily motion (~13°/day); actual
      timing calculation requires exact degree-analysis.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch4.v8.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v8"
      text_excerpt: |
        "Saturn Itthasala in the annual chart indicates a matter that develops slowly
        over many months or only matures toward the end of the year. Saturn's applying
        aspects are the last to complete; events they signify are subject to delay,
        hard work, and patient waiting."
    condition: >
      Saturn is one of the two planets in an Itthasala configuration; Saturn is
      typically the slower planet (the one being applied to, or the applying planet
      when Saturn is faster in a specific configuration).
    assertion: >
      Events indicated by Saturn Itthasala develop slowly and mature toward the end
      of the year or over many months; they require patience, sustained effort, and
      tolerance of delays; sudden fruition is unlikely.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka declarative = 0.8; 1 confirming text (BPHS Saturn transit principle of
      delay) = 1.1 → retain 0.80 for Tajaka-specific context.
    caveats: >
      Applies in Varshaphal context only. Saturn Itthasala is not inherently malefic;
      when Saturn is the natural significator of the queried domain (e.g., longevity,
      labour) its Itthasala is appropriate and reliable.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch4.v9.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v9"
      text_excerpt: |
        "An Itthasala in which a benefic planet applies to a malefic planet gives
        mixed results: the benefic's significations are somewhat constrained or
        coloured by the malefic's nature. The matter is likely to happen but with
        more difficulty, cost, or complication than hoped."
    condition: >
      In the Itthasala, the faster planet is a natural benefic (Jupiter, Venus,
      unafflicted Mercury) and the slower planet is a natural malefic (Saturn, Mars,
      Rahu, Ketu).
    assertion: >
      Mixed results: the matter signified is likely to occur, but it comes with
      difficulty, extra cost, complication, or a tinge of the malefic's nature;
      the outcome is not as clean or straightforward as a pure benefic Itthasala.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with qualifier ("likely to happen but") = 0.8 × 0.9 = 0.72.
    caveats: >
      Applies in Varshaphal context only. Rahu as the malefic reduces confidence by
      × 0.85 per Gate A R1 → effective 0.61 when Rahu is the slow planet.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch4.v10.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v10"
      text_excerpt: |
        "An Itthasala in which a malefic applies to a benefic is considered more
        troublesome than the reverse. The malefic's energy infects the benefic's
        domain; the matter may occur but carries damage, or the good result is
        preceded by a period of difficulty."
    condition: >
      In the Itthasala, the faster-moving planet is a natural malefic (Saturn, Mars,
      Rahu, Ketu) applying toward a natural benefic (Jupiter, Venus, Mercury).
    assertion: >
      The malefic's energy infects the benefic's domain; the signified matter may
      occur but is preceded by or accompanied by difficulty; positive results
      are partial or delayed.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with qualifier = 0.8 × 0.9 = 0.72.
    caveats: >
      Applies in Varshaphal context only. Rahu as the malefic: Gate A R1 × 0.85 →
      0.61 effective. Context-specific: a natural malefic that is also the functional
      benefic (yogakaraka) for a specific Lagna type may give better results.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch4.v11.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch4.v11"
      text_excerpt: |
        "A benefic-to-benefic Itthasala is the most auspicious configuration in
        Tajaka. Both planets enhance each other's significations; the matter promised
        is likely to come with ease, joy, or abundance. Jupiter–Venus Itthasala is
        cited as the supreme example."
    condition: >
      Both planets in the Itthasala are natural benefics (Jupiter, Venus, unafflicted
      Mercury, or the Moon when waxing and well-placed); the faster applies to the slower.
    assertion: >
      The most auspicious Itthasala type; the matter signified is likely to occur
      with ease and abundance; Jupiter–Venus Itthasala is the strongest example,
      signifying fulfilment of good fortune, wealth, and relationship happiness.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style declaration = 0.8; 1 confirming text (BPHS dual-benefic yoga
      principle) = 1.1. 0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only. The Moon must be waxing (Shukla Paksha)
      and free from severe malefic aspects to count as a natural benefic here.
    verified: true
    stub: false
    stub_reason: null

  # ─── ISHRAFA: QUALITY OF PAST EVENTS ─────────────────────────────────────────

  - rule_id: TAJAKA.ch5.v5.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch5.v5"
      text_excerpt: |
        "When Ishrafa is present between the Lagna lord and the significator of a
        domain in the annual chart, the native may feel that the opportunity for
        the year's event has passed before they could act, or that matters are
        already in a post-peak phase. The window has closed."
    condition: >
      The annual Lagna lord and the relevant significator planet are in Ishrafa
      (separating aspect) in the annual chart.
    assertion: >
      The opportunity window for the signified matter has effectively closed for
      the year; the native may sense belatedness or missed timing; the matter should
      be pursued in a future year when Itthasala forms instead.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka declarative = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. Ishrafa between Lagna lord and significator
      does not prevent all activity — only the characteristic annual "ripening" is
      absent; some matters may still progress slowly through other configurations.
    verified: true
    stub: false
    stub_reason: null

  # ─── NAKTA: AGENT INTERMEDIARY RULES ─────────────────────────────────────────

  - rule_id: TAJAKA.ch5.v6.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch5.v6"
      text_excerpt: |
        "Mercury can serve as the agent in Nakta yoga just as the Moon does, when
        Mercury is in Itthasala with both parties who are not in direct Itthasala
        with each other. Mercury as agent indicates the intermediary is of a Mercurian
        nature — a sibling, colleague, merchant, or communication channel."
    condition: >
      Planets A and B are not in direct Itthasala; Mercury is in Itthasala with
      both A and B in the annual chart.
    assertion: >
      Nakta yoga with Mercury as agent: the matter between A and B may fructify
      through a sibling, colleague, merchant, communication, or Mercurian-type
      intermediary; the facilitation has a distinctly intellectual or commercial
      flavour.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with qualifier ("may fructify") = 0.8 × 0.9 = 0.72.
    caveats: >
      Applies in Varshaphal context only. Mercury Nakta is considered somewhat
      weaker than Moon Nakta because Mercury's facilitation is intellectual rather
      than emotional/instinctive.
    verified: true
    stub: false
    stub_reason: null

  # ─── KAMBOOLA: PROTECTION TYPES IN ANNUAL CHART ─────────────────────────────

  - rule_id: TAJAKA.ch7.v3.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch7.v3"
      text_excerpt: |
        "When Kamboola yoga is formed, it does not necessarily produce positive events
        of its own; rather, it protects against the worsening of adverse configurations.
        A native with 8th house Muntha and Kamboola yoga will face difficulties but
        they will be less severe than without the yoga."
    condition: >
      Kamboola yoga is present in the annual chart alongside an adverse configuration
      (such as Muntha in dusthana, malefic Itthasala, or weak Varshesh).
    assertion: >
      Kamboola acts as a protective buffer; adverse events are moderated, less acute,
      or shorter in duration; the yoga does not produce good events independently
      but reduces harm from existing adverse configurations.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka with clarifying qualification = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. The protective effect of Kamboola is
      proportional to its grade (Shrestha > Madhyama > Adhama); Adhama Kamboola
      provides only modest protection.
    verified: true
    stub: false
    stub_reason: null

  # ─── SAHAM TIMING: LORD AND TRANSIT ACTIVATION ──────────────────────────────

  - rule_id: TAJAKA.ch9.v9.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch9.v9"
      text_excerpt: |
        "The timing of a Saham's activation within the year is determined by the
        transit of the Moon over the Saham's degree. The month in which the Moon
        transits the exact degree of a major Saham is the most likely period for
        that Saham's domain events to manifest."
    condition: >
      The Moon transits the exact degree of a major Saham (Punya, Vivaha, Putra,
      Rajya, Mritu, Matru, Pitru) during the Tajaka year.
    assertion: >
      The month when the Moon crosses the Saham's exact degree is the most likely
      timing window for the Saham's domain events to manifest; this is the primary
      monthly timing tool for Saham-based predictions.
    scope: varshaphal
    school: tajaka
    confidence: 0.80
    confidence_rationale: >
      Sloka declarative = 0.8; no cross-text = 1.0. 0.80.
    caveats: >
      Applies in Varshaphal context only. The Moon's monthly transit of each Saham
      degree provides 12 potential activation windows per year; the strongest is
      confirmed by the 16-measures or Tri-Pataki month assignment.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: TAJAKA.ch9.v10.1
    source_verse:
      canonical_id: TAJAKA
      verse_ref: "ch9.v10"
      text_excerpt: |
        "When the Sun transits the sign of a major Saham, the domain of that Saham
        receives solar illumination and becomes more prominent in the native's
        awareness and circumstances. The Sun's annual transit through each Saham's
        sign activates it for approximately one month."
    condition: >
      The Sun transits the sign containing a major Saham degree during the Tajaka year.
    assertion: >
      The Saham's domain becomes more prominent and visible for approximately one
      solar month; events related to that domain are more likely to emerge into
      conscious awareness and outward circumstance during that period.
    scope: varshaphal
    school: tajaka
    confidence: 0.72
    confidence_rationale: >
      Sloka with qualifier ("more prominent") = 0.8 × 0.9 = 0.72.
    caveats: >
      Applies in Varshaphal context only. Solar transit activation is secondary to
      Moon transit activation for fine monthly timing; use both for stronger
      confirmation.
    verified: true
    stub: false
    stub_reason: null

  # ─── VARSHESH: YEAR LORD AND DOMAIN PREDICTION ───────────────────────────────

