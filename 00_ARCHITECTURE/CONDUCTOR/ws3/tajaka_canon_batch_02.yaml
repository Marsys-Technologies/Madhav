        the Varshesh naturally signifies, and whatever house it occupies or lords in
        the annual chart, those domains are most active and prominently featured
        during the year. The native's attention and fate gravitate toward the Varshesh's
        domains."
    condition: >
      The Varshesh (Lord of the Year, planet with highest Tajaka strength) is
      identified in the annual chart.
    assertion: >
      The Varshesh's natural significations, occupied house, and lorded house(s) in
      the annual chart are the primary thematic domains of the year; the native's
      energy, attention, and significant life events cluster around these domains.
    scope: varshaphal
    school: tajaka
    confidence: 0.88
    confidence_rationale: >
      Sutra-style declarative = 0.8 × 1.1 = 0.88.
    caveats: >
      Applies in Varshaphal context only. Varshesh must be computed using Tajaka
      dignities (not Shadbala); misidentification of Varshesh invalidates downstream
      annual predictions.
    verified: true
    stub: false
    stub_reason: null

