  - topic_id: TC.042
    topic: "Pancha Mahapurusha Yoga — Ruchaka (Mars)"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Ruchaka yoga is formed when Mars is in its own sign (Aries/Scorpio) or
      exaltation (Capricorn) in a kendra (1/4/7/10). Results: courageous,
      commanding, military/martial nature, leadership. Broadly accepted.
    qualifications:
      - school: parashari
        note: >
          Full yoga requires Mars in kendra from lagna (not just from Moon); strength
          in navamsa also required. Results are strongest when no malefic aspect or
          conjunction diminishes Mars.
      - school: kp
        note: >
          KP: Yoga formation is a background factor; the sub-lord of the relevant
          house cusp governs whether the yoga's promise manifests in a given period.
          Yoga can exist but be dormant if sub-lord connectivity does not support it.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.36.1.1, KP.4.ch12.yoga.1]

