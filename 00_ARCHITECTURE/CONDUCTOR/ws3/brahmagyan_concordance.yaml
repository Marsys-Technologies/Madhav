    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      House 7 signifies spouse, marital partnership, open enemies, and (with
      12th) foreign travel. Agreement across all schools on core themes.
    qualifications:
      - school: jaimini
        note: >
          Darakaraka (lowest-degree planet) and 7th from Karakamsha jointly
