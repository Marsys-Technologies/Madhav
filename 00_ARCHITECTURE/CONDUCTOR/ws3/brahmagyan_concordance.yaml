# ────────────────────────────────────────────────────────────────────────────
# SECTION 10: TIMING SYSTEMS — NON-COMPARABLE (C5) (TC.073–TC.087)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.073
    topic: "Timing systems — NON-COMPARABLE meta-entry (C5)"
    pattern: ORTHOGONAL
    schools_addressing: [parashari, jaimini, kp, tajaka]
    c5_flag: true
    note_on_frameworks: >
      [C5 — NON-COMPARABLE] The four schools employ distinct timing systems that
      cannot be equated or merged. Cross-system triangulation is a valid research
      technique (convergence of multiple systems on the same period increases
      probability), but this is NOT the same as saying all systems address the
      same timing question through compatible frameworks:
      (1) PARASHARI Vimshottari Dasha: a 120-year planetary period cycle assigned
          by Moon's nakshatra at birth. Sequence: Ketu 7y, Venus 20y, Sun 6y,
          Moon 10y, Mars 7y, Rahu 18y, Jupiter 16y, Saturn 19y, Mercury 17y.
          Divided into Antardasha (sub-periods) and Pratyantardasha (sub-sub-periods).
          The primary Parashari timing system; Ashtottari and other dasha systems
          exist as secondary options.
      (2) JAIMINI Chara Dasha + Sthira Dasha + Shoola Dasha: three distinct systems.
          Chara Dasha: sign-based periods assigned by the rising sign's planetary
          relationship; each sign gets a period of 1–12 years depending on the AK
          and special Jaimini rules. Sthira Dasha: planet-based fixed-period system.
          Shoola Dasha: for timing adversity/death-type events. These are sign-level
          or planet-level systems; not nakshatra-based.
      (3) KP triple-significator method: KP does not use "dashas" in the same
          primary sense. The promise of an event is assessed via the sub-lord
          of the relevant house cusp; the timing is determined by identifying
          the dasha, antardasha, and transit of planets that are triple-significators
          (significator of the matter's relevant houses at all three levels: dasha lord,
          antardasha lord, and transit planet all signify the same houses). Vimshottari
          dasha periods are used AS the framework for the dasha sequence, but the
          selection of timing periods uses the triple-significator method — fundamentally
          different from Parashari dasha assessment.
      (4) TAJAKA Mudda Dasha + Patyayini Dasha: annual chart timing systems.
          Mudda Dasha: a dasha system operating within the one-year Varsha period
          (sub-period dasha within the year). Patyayini Dasha: a point-based system
          for the annual chart. Both systems govern events within a single Varsha year;
          they do not extend across natal chart lifespan. They are not comparable to
          Vimshottari (natal lifetime) or Jaimini Chara (also natal lifetime).
      Cross-system triangulation: when Vimshottari, Jaimini Chara, and KP triple-
      significator all point to the same 12–18 month window for a major event, the
      probability assessment increases significantly. This is a research methodology,
      not a claim that the systems are equivalent.
    rule_refs: [BPHS.46.1.1, JAIMINI.2.1.1.1, KP.5.ch15.timing.1, TAJAKA.ch6.v1.1]
    flag: C5

  - topic_id: TC.074
    topic: "Vimshottari Dasha — Moon nakshatra seed"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Vimshottari Dasha is determined by Moon's nakshatra at birth; the dasha
      sequence begins from the planet ruling that nakshatra. The 120-year cycle
      is: Ketu 7y, Venus 20y, Sun 6y, Moon 10y, Mars 7y, Rahu 18y, Jupiter 16y,
      Saturn 19y, Mercury 17y. Both Parashari and KP use this same sequence.
    qualifications:
      - school: kp
        note: >
          [C5] KP uses Vimshottari dasha periods as the timing framework but applies
          the triple-significator method to select which dasha/antardasha periods
          are relevant for a specific event. The dasha sequence is shared; the
          selection methodology differs fundamentally from Parashari interpretation.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.46.1.1, KP.5.ch15.timing.1]
    flag: C5

  - topic_id: TC.075
    topic: "Jaimini Chara Dasha — sign-based periods"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C5] Jaimini Chara Dasha assigns periods to each of the 12 signs; the period
      length of each sign depends on specific Jaimini rules involving the sign's
      ruler, aspects to the sign, and the AK's position. The running Chara Dasha
      sign activates the matters signified by that sign across the Rashi, Navamsa,
      and Karakamsha charts. This is a sign-level timing system without a nakshatra
      basis; it cannot be compared or merged with Vimshottari (nakshatra-based) or
      KP triple-significator (sub-lord connectivity based).
    rule_refs: [JAIMINI.2.1.1.1, JAIMINI.2.2.1.1]
    flag: C5

  - topic_id: TC.076
    topic: "KP triple-significator timing method"
    pattern: ORTHOGONAL
    schools_addressing: [kp]
    note_on_other_schools: >
      [C5] The KP timing method identifies an event's period by finding planets
      that are significators of the relevant houses at three simultaneous levels:
      (1) Dasha lord must signify the event's houses; (2) Antardasha lord must
      signify the same houses; (3) Transit planet (at the time of the event)
      must also signify those houses. The triple overlap is the trigger. This is
      fundamentally different from Parashari (where the dasha lord's natural and
      functional significations govern the period's themes) and Jaimini (where the
      running Chara sign governs the period). Cannot be merged with either.
    rule_refs: [KP.5.ch15.timing.2, KP.5.ch15.timing.3]
    flag: C5

  - topic_id: TC.077
    topic: "Tajaka Mudda Dasha — intra-year timing"
    pattern: ORTHOGONAL
    schools_addressing: [tajaka]
    note_on_other_schools: >
      [C5] Tajaka Mudda Dasha operates within a single Varsha year; it is not a
      natal-chart lifetime timing system. Mudda Dasha assigns sub-periods within
      the annual chart's 12-month span, giving each planet a proportional share
      of the year based on a scheme analogous to Vimshottari but scaled to 12
      months. Events within the year are timed by the running Mudda lord and
      the annual chart's Itthasala/Ishrafa patterns. BPHS Vimshottari/Jaimini
      Chara/KP triple-significator are natal-lifetime systems; Mudda Dasha
      is annual-only and not comparable.
    rule_refs: [TAJAKA.ch6.v1.1, TAJAKA.ch6.v2.1]
    flag: C5

  - topic_id: TC.078
    topic: "Sade Sati — Saturn transit over natal Moon (three 2.5-year phases)"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Sade Sati is recognized in both Parashari and KP: Saturn transiting the sign
      before natal Moon, the natal Moon sign, and the sign after natal Moon — three
      2.5-year phases totaling 7.5 years. Generally associated with challenges,
      increased responsibilities, and karmic reckoning.
    qualifications:
      - school: parashari
        note: >
          Parashari tradition recognizes Sade Sati as a major transit period;
          intensity varies by natal chart — Moon in own/exaltation sign or strong
          benefic aspects to natal Moon mitigate severity. Sade Sati is experienced
          differently depending on Moon's rashi (Aries Moon: often business/health;
          Cancer Moon: family/home; etc.).
      - school: kp
        note: >
          KP: Sade Sati is recognized as a period of increased Saturn influence;
          however, the triple-significator method governs which specific events occur
          during Sade Sati. Saturn transiting natal Moon sign does not automatically
          cause events — the relevant house sub-lord connectivity must also support
          the event during that period.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.48.5.1, KP.5.ch16.transit.5]

  - topic_id: TC.079
    topic: "Ashtama Shani — Saturn transit over 8th from natal Moon"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Saturn transiting the 8th sign from natal Moon (Ashtama Shani) is recognized
      as a difficult transit period associated with health challenges, obstacles,
      and hidden threats. Both Parashari and KP acknowledge this as a significant
      transit.
    qualifications:
      - school: parashari
        note: >
          Ashtama Shani is considered one of the most challenging transit conditions;
          combined with Sade Sati (if both run concurrently, which they cannot by
          definition), or combined with a difficult Vimshottari dasha period, the
          cumulative effect is severe.
      - school: kp
        note: KP: Sub-lord connectivity governs specifics; Ashtama Shani is a
          contextual timing indicator.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.48.6.1, KP.5.ch16.transit.6]

  - topic_id: TC.080
    topic: "Jupiter transit — annual transit effects"
    pattern: QUALIFY
    schools_addressing: [parashari, kp, tajaka]
    core_agreement: >
      Jupiter's annual sign change (Guru Peyarchi) is recognized as a significant
      timing trigger by Parashari, KP, and Tajaka. Jupiter's transit into a favorable
      sign (relative to natal Moon) generally brings expansion and opportunity.
    qualifications:
      - school: parashari
        note: >
          Jupiter transit relative to natal Moon: 2nd, 5th, 7th, 9th, 11th from
          Moon are favorable; 1st, 3rd, 4th, 6th, 8th, 10th, 12th are mixed or
          challenging, with 3/4/8/12 being notably difficult.
      - school: kp
        note: >
          KP: Jupiter's transit must involve a triple-significator relationship
          with the relevant event houses for a specific event to occur; simple
          favorable transit from Moon does not guarantee event fructification.
      - school: tajaka
        note: >
          Annual chart: Jupiter's position in the Varsha Kundali (house placement
          and its Itthasala yoga with the Varsha Lagna lord) is the primary annual
          indicator of expansion. Natal transit is a secondary reference.
    conflicts: []
    silent: [jaimini]
    rule_refs: [BPHS.48.3.1, KP.5.ch16.transit.3, TAJAKA.ch7.v2.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 11: DASHA RESULTS — VIMSHOTTARI VS JAIMINI CHARA (TC.081–TC.095)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.081
    topic: "Vimshottari Rahu Mahadasha — general results"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Rahu Mahadasha (18 years) is associated with foreign matters, ambition,
      unconventional paths, sudden changes, and karmic intensification. Both
      Parashari and KP recognize this as a period of amplification — for good
      or ill depending on Rahu's placement and associations.
    qualifications:
      - school: parashari
        note: >
          Rahu Mahadasha results depend on: Rahu's sign placement, dispositor's
          strength and house, any planetary conjunction with Rahu, and the overall
          chart strength. Rahu associated with or aspected by benefics gives
          a better Mahadasha; conjunction with malefics amplifies challenges.
          Rahu in upachaya houses (3/6/10/11) generally gives improved results
          in its Mahadasha.
      - school: kp
        note: >
          KP: Rahu Mahadasha's results governed by Rahu's sub-lord and the houses
          Rahu signifies; Rahu acts as an agent of its dispositor (sign lord) and
          also of planets conjoined it or aspecting it. The triple-significator
          method governs specific event timing within the Rahu Mahadasha.
    conflicts: []
    rule_refs: [BPHS.47.8.1, KP.5.ch17.rahu.1]
    flag: C6

  - topic_id: TC.082
    topic: "Vimshottari Saturn Mahadasha — general results"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Saturn Mahadasha (19 years) is the longest dasha — associated with discipline,
      perseverance, delayed but eventual rewards, health challenges, and karmic
      reckoning. Both systems recognize Saturn Mahadasha as a period of hard work.
    qualifications:
      - school: parashari
        note: >
          Saturn Mahadasha quality depends critically on: Saturn's sign and house,
          lagna lord's relationship with Saturn, Saturn's functional nature (yogakaraka
          for some lagnas e.g., Taurus/Libra Lagna). Saturn Mahadasha often shows
          success in the latter half (after its antardasha sub-period cycles through
          the challenging inner lords).
      - school: kp
        note: >
          KP: Saturn Mahadasha's events governed by Saturn's sub-lord connectivity;
          triple-significator method for specific event timing. Saturn as Mahadasha
          lord does not guarantee hardship — its sub-lord's significations determine
          whether the period brings achievement or restriction.
    conflicts: []
    rule_refs: [BPHS.47.7.1, KP.5.ch17.saturn.1]

  - topic_id: TC.083
    topic: "Jaimini Chara Dasha — Aries sign period"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C5] When Aries runs as the Chara Dasha sign, the matters signified by the
      Aries sign (and its planets, aspects by rashi drishti, and the AK's relationship
      to Aries) are activated. The period length depends on Jaimini's calculation
      rules for Aries' Chara period (typically based on the count from the AK sign
      or special Jaimini sutra provisions). This is a sign-activation period, not
      equivalent to any Vimshottari planetary dasha. BPHS/KP/Tajaka do not use
      Chara Dasha.
    rule_refs: [JAIMINI.2.1.1.1]
    flag: C5

  - topic_id: TC.084
    topic: "Ketu Mahadasha — spiritualization, moksha tendency"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Ketu Mahadasha (7 years) is associated with spiritualization, detachment,
      dissolution of material attachments, and karmic completion. The period can
      bring withdrawal, spiritual insight, and in some cases grief or separation.
      Broadly recognized across all three schools.
    qualifications:
      - school: parashari
        note: >
          Ketu Mahadasha: results depend on Ketu's sign, house, dispositor strength,
          and any conjunctions. Ketu in 1/4/7/10 (kendra) or 5/9 (trikona) gives
          a generally better Mahadasha. Ketu associated with Jupiter or 9th lord
          can indicate a period of spiritual flowering.
      - school: jaimini
        note: >
          Jaimini: Ketu in Chara Karaka scheme (excluded in 7-karaka but potentially
          8th karaka in Rath scheme) affects AK-related matters; Ketu's sign running
          in Chara Dasha activates moksha-related matters if Ketu is involved with
          the 12th house or Karakamsha.
      - school: kp
        note: >
          KP: Ketu acts as agent of planets it conjoins or of its sign/nakshatra
          lord; Ketu Mahadasha's sub-lord connectivity governs whether spiritual
          matters or material losses predominate.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.47.1.1, JAIMINI.2.3.1.1, KP.5.ch17.ketu.1]
    flag: C6

  - topic_id: TC.085
    topic: "Dasha of yogakaraka planet — enhanced results"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      A planet that is the Yogakaraka (single planet ruling both a kendra and a
      trikona) gives especially beneficial results in its Mahadasha/Antardasha.
      The Yogakaraka is lagna-dependent (e.g., Saturn for Taurus/Libra Lagna;
      Mars for Cancer/Leo Lagna; Venus for Capricorn/Aquarius Lagna).
    qualifications:
      - school: parashari
        note: >
          Yogakaraka dasha can deliver significant career advancement, wealth, and
          status elevation. The magnitude depends on the yogakaraka's natal strength,
          its navamsa position, and the overall chart strength.
      - school: kp
        note: >
          KP: Yogakaraka status recognized as enhancing the planet's sub-lord
          connectivity quality; however, the sub-lord of the relevant house cusp
          must still signify the desired houses for specific results to materialize.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.40.2.1, KP.4.ch13.yogakaraka.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 12: RAHU/KETU TREATMENT (C6) (TC.086–TC.095)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.086
    topic: "Rahu/Ketu general nature — C6 meta-entry"
    pattern: ORTHOGONAL
    schools_addressing: [parashari, jaimini, kp, tajaka]
    c6_flag: true
    note_on_frameworks: >
      [C6 — ORTHOGONAL] The treatment of Rahu and Ketu diverges substantially
      across all four schools. Per-system positions must be maintained:
      (1) PARASHARI BPHS: Rahu and Ketu are shadow planets (chaya grahas) without
          physical mass. They behave like the planet they are conjoined with or
          aspected by (Rahu behaves like Saturn; Ketu behaves like Mars, by default
          natural signification). They have no own sign rulership in BPHS (though
          some commentaries assign them Aquarius/Scorpio). They participate in
          Vimshottari dasha (Rahu 18y, Ketu 7y). They are co-agents of their
          dispositor. Exaltation/debilitation of Rahu/Ketu is debated (see TC.008/009).
      (2) JAIMINI: Rahu is optionally the 8th Chara Karaka (Pitrukaraka) in the
          8-karaka scheme (Rath); Ketu is associated with moksha. Rahu/Ketu have
          rashi drishti aspects like other grahas within Jaimini's sign-aspect system.
          Rahu/Ketu's behavior in Jaimini is primarily through the karaka scheme
          and their sign placements in the Rashi/Navamsa charts.
      (3) KP: Rahu and Ketu are significators of the houses they occupy and the
          houses of their nakshatra lord; additionally they co-signify the houses
          of any planets conjoined them. Rahu/Ketu have no sub-lord corrections
          for retrogression (they are always technically retrograde). Ketu acts
          as a moksha planet in KP but the sub-lord governs specific results.
      (4) TAJAKA: Rahu and Ketu participate in the annual chart but their treatment
          is less systematized in Tajaka Neelakanthi; they are included in the
          annual chart's planet-house assessments but with lower confidence weighting
          per Gate A rule R1 (confidence × 0.85 for Rahu/Ketu rules).
    rule_refs: [BPHS.3.8.1, JAIMINI.1.1.5.1, KP.1.ch1.rahu.1, TAJAKA.ch2.v10.1]
    flag: C6

  - topic_id: TC.087
    topic: "Rahu conjunct natal Sun — general effects"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Rahu conjunct natal Sun is recognized as a significant and often challenging
      placement affecting father, authority, and soul expression. All three schools
      note this as a notable configuration.
    qualifications:
      - school: parashari
        note: >
          Rahu conjunct Sun (near solar eclipse degree): ego challenges, complex
          relationship with father and authority figures, potential for dramatic
          power situations (gains or losses of authority depending on chart context).
          Rahu amplifies and distorts Sun's significations.
      - school: jaimini
        note: >
          If Sun is the AK and conjoined Rahu, this affects the soul's trajectory —
          potential for obsessive self-focus or unusual dharmic path. Rahu with AK
          is specifically noted in Jaimini commentaries.
      - school: kp
        note: >
          KP: Rahu with Sun merges Rahu's house significations with Sun's; the
          combined sub-lord of Rahu's nakshatra governs results. Rahu here acts
          as Sun's co-agent.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.3.8.5, JAIMINI.1.1.7.1, KP.1.ch1.rahu.2]
    flag: C6

  - topic_id: TC.088
    topic: "Ketu conjunct natal Moon — general effects"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Ketu conjunct natal Moon is recognized across Parashari, Jaimini, and KP as
      causing emotional detachment, spiritual sensitivity, potential mental
      disturbances, and complex relationship with mother.
    qualifications:
      - school: parashari
        note: >
          Ketu with Moon: emotional restlessness, psychic sensitivity, tendency
          toward withdrawal; in difficult dashas this can manifest as mental health
          challenges. Jupiter aspecting Ketu-Moon conjunction provides significant
          mitigation.
      - school: jaimini
        note: >
          Ketu with Moon affecting Matrukaraka considerations; or if Moon is AK,
          the soul has a deep karmic connection with dissolution/moksha themes.
      - school: kp
        note: >
          KP: Ketu-Moon conjunction — Ketu adopts Moon's significations; mental
          matters are governed by Ketu's sub-lord's house connectivity.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.3.8.9, KP.1.ch1.ketu.2]
    flag: C6

  - topic_id: TC.089
    topic: "Rahu in 1st house — general effects"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Rahu in 1st house gives an unusual, intense, or unconventional personality;
      strong worldly ambition; possible health issues related to the head or
      nervous system. Both Parashari and KP note the amplifying effect of Rahu
      in the ascendant.
    qualifications:
      - school: parashari
        note: >
          Rahu in 1st: native may have distinctive physical appearance (often tall,
          magnetic, or unusual features); strong material ambitions; possible skin
          or respiratory issues. Benefits from foreign travels or associations.
          Results shaped heavily by the lagna lord's strength and Rahu's dispositor.
      - school: kp
        note: >
          KP: Rahu in 1st — its sub-lord and nakshatra lord govern health and
          self-related outcomes. If sub-lord signifies 6/8/12, health challenges
          more likely; if 1/5/9/11, the unusual personality expresses positively.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.33.8.1, KP.3.ch10.rahu.1]
    flag: C6

  - topic_id: TC.090
    topic: "Ketu in 1st house — general effects"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Ketu in 1st house: spiritual orientation, potential for self-dissolution or
      lack of strong ego identity, healing capacities, possible body marks or
      physical anomalies. Both Parashari and KP recognize this as a spiritualizing
      placement.
    qualifications:
      - school: parashari
        note: >
          Ketu in 1st: lean body, spiritual inclinations, possible health vulnerability
          to Ketu-ruled ailments (nervous system, mysterious diseases). Gives past-life
          spiritual experience manifesting as innate knowledge or unusual wisdom.
      - school: kp
        note: >
          KP: Ketu in 1st — sub-lord of Ketu's nakshatra governs materialization;
          spiritual results vs. health challenges determined by sub-lord's house
          significations.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.33.9.1, KP.3.ch10.ketu.1]
    flag: C6

  - topic_id: TC.091
    topic: "Rahu as Atmakaraka (Jaimini) — 8-karaka scheme"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C1, C6] In Rath's 8-karaka scheme, Rahu can become a Chara Karaka if
      Rahu's degree-in-sign (calculated as 30° minus Rahu's degree) is higher
      than all other planets' degrees in their signs. If Rahu (so calculated)
      ranks highest, Rahu becomes Atmakaraka — indicating a soul with intense
      karmic engagement with worldly matters, foreign lands, or occult subjects.
      This is a Jaimini-only concept; BPHS/KP/Tajaka do not use Chara Karakas
      and thus Rahu-as-AK has no equivalent in those systems.
    rule_refs: [JAIMINI.1.1.5.1]
    flag: [C1, C6]

  - topic_id: TC.092
    topic: "Ketu in 12th from Karakamsha — moksha indicator (Jaimini)"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C6] Jaimini specifically notes Ketu in the 12th house from Karakamsha
      (the AK's navamsa sign) as a very strong moksha indicator. This is a
      Jaimini-specific assessment using the Karakamsha framework; Parashari
      (which assesses moksha through 12th house + Venus/Jupiter/Ketu in 12th
      natal) and KP (which assesses moksha through sub-lord of 12th cusp
      signifying 12th without 6th/8th obstruction) have parallel but
      structurally different assessments.
    rule_refs: [JAIMINI.1.3.14.1]
    flag: C6

# ────────────────────────────────────────────────────────────────────────────
# SECTION 13: KARAKA FRAMEWORKS — PARALLEL (C1) (TC.093–TC.107)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.093
    topic: "Karakamsha — Atmakaraka in navamsa (Jaimini)"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C1] The Karakamsha is the navamsa sign in which the Atmakaraka (AK) falls.
      This sign becomes the reference point for a comprehensive Jaimini assessment
      of the soul's dharmic purpose, career, relationships, and spiritual path.
      The 12 houses from Karakamsha are read in parallel with the natal house readings.
      This framework is Jaimini-exclusive: BPHS (which does not have the AK + Karakamsha
      construct), KP (which uses sub-lords, not Karakamsha), and Tajaka (annual chart
      focus) do not have an equivalent. Cross-system use of Karakamsha findings is
      an analytical layer, not a merged system.
    rule_refs: [JAIMINI.1.3.1.1, JAIMINI.1.3.2.1]
    flag: C1

  - topic_id: TC.094
    topic: "Upapada Lagna (UL) — Jaimini marriage indicator"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C1] Upapada Lagna is the Jaimini Arudha Pada of the 12th house. It indicates
      the nature and timing of marriage/partnership in Jaimini's framework. The UL
      lord and planets associated with it reveal the character of the spouse and the
      nature of the marital bond. This is a Jaimini-only concept (though sometimes
      loosely referenced in contemporary Parashari practice as an enhancement).
      Parashari uses 7th house + Venus + Navamsa; KP uses 7th cusp sub-lord;
      Tajaka uses annual 7th house. UL is a parallel, distinct axis.
    rule_refs: [JAIMINI.1.3.9.2]
    flag: C1

  - topic_id: TC.095
    topic: "Arudha Lagna (AL) — image and maya projection (Jaimini)"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C1] Arudha Lagna is the Jaimini Arudha Pada of the 1st house — the sign as
      far from the lagna lord as the lagna lord is from the lagna. It represents
      how the native appears to the world (maya/image), as distinct from the
      actual self (natal lagna). Planets in the Arudha Lagna and 7th from AL
      reveal social perception and material circumstances. Parashari/KP/Tajaka
      do not use the Arudha Pada system.
    rule_refs: [JAIMINI.1.2.4.1]
    flag: C1

  - topic_id: TC.096
    topic: "KP significator determination — house occupancy + nakshatra lord"
    pattern: ORTHOGONAL
    schools_addressing: [kp]
    note_on_other_schools: >
      [C1] KP determines a planet's house significations through a hierarchical chain:
      (1) Planet's own sub-lord; (2) Planets in the planet's nakshatra (strongest);
      (3) The planet itself (as occupant and lord); (4) Nakshatra lord's significations.
      This creates a multi-step connectivity chain that is unique to KP — not a
      simplified "planet rules/occupies these houses" statement. The Parashari natural
      karaka system and Jaimini Chara Karaka system are parallel axes operating through
      completely different mechanisms.
    rule_refs: [KP.1.ch2.significators.2, KP.1.ch2.significators.3]
    flag: C1

# ────────────────────────────────────────────────────────────────────────────
# SECTION 14: PLANETARY FRIENDSHIPS AND ENMITY (TC.097–TC.106)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.097
    topic: "Permanent planetary friendship scheme (naisargika maitri)"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      The permanent (naisargika) friendship/enmity scheme — Sun: friends Moon/Mars/Jup;
      Moon: friends Sun/Mercury; Mars: friends Sun/Moon/Jup; etc. — is shared across
      Parashari, Jaimini, and KP as a foundational concept. All three use these
      relationships to assess planetary dignity and compound friendship.
    qualifications:
      - school: tajaka
        note: >
          Tajaka annual chart uses planetary dignity factors but the naisargika
          maitri table is less prominent in Tajaka Neelakanthi; Tajaka focuses
          more on Itthasala/Ishrafa and the annual chart's Panchadhikara dignities.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.3.55.1, BPHS.3.56.1, BPHS.3.57.1, KP.1.ch2.friendship.1, JAIMINI.1.1.6.1]

  - topic_id: TC.098
    topic: "Temporary planetary friendship (tatkalika maitri)"
    pattern: AGREE
    schools_addressing: [parashari, kp]
    core_agreement: >
      Temporary friendship is determined by whether two planets are within 7 signs
      of each other in the natal (or transit) chart; planets within 7 signs
      (counting both ways) become temporary friends; beyond = temporary enemies.
      Combined with permanent friendship to produce compound (actual) friendship.
    qualifications:
      - school: kp
        note: >
          KP acknowledges temporary friendship as a modifying factor; the compound
          friendship relationship affects sub-lord assessment quality.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.3.60.1, KP.1.ch2.friendship.2]

  - topic_id: TC.099
    topic: "Planetary combustion (astas) — close conjunction with Sun"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      A planet is combust (astas) when within a specific degree of the Sun;
      combust planets lose their signification-delivery capacity. General agreement
      that combustion weakens a planet significantly.
    qualifications:
      - school: parashari
        note: >
          Combustion thresholds per BPHS: Moon within 12°, Mars within 17°,
          Mercury within 14° (12° when retrograde), Jupiter within 11°, Venus
          within 10° (8° when retrograde), Saturn within 15°. Combust planets
          are severely weakened for producing results; their yogas also weaken.
      - school: kp
        note: >
          KP: Combustion is noted as a weakening factor for sub-lord connectivity;
          a combust planet's significations are diminished. Mercury is less affected
          by combustion in KP reading (Mercury is often combust but still delivers
          near-Sun significations).
      - school: jaimini
        note: >
          Jaimini notes combustion as a weakening factor particularly when the
          AK is combust; a combust AK weakens the soul's overall dharmic expression.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.3.45.1, KP.1.ch2.combustion.1, JAIMINI.1.1.7.2]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 15: NAKSHATRA SYSTEM (TC.100–TC.109)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.100
    topic: "27 nakshatras — foundational division of the zodiac"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      The zodiac is divided into 27 nakshatras (lunar mansions), each spanning
      13°20'. The sequence begins with Ashwini (0° Aries) and ends with Revati
      (16°40' Pisces). All four schools use the same 27-nakshatra framework as
      a foundational division of the zodiac.
    qualifications:
      - school: kp
        note: >
          KP is built almost entirely on nakshatra analysis: each nakshatra is
          further subdivided into 9 subs in proportion to Vimshottari periods.
          The sub-lord of a planet or cusp is the primary KP assessment unit —
          making the nakshatra/sub system central to KP in a way not paralleled
          in Parashari or Jaimini.
    conflicts: []
    rule_refs: [BPHS.5.1.1, JAIMINI.1.1.1.1, KP.1.ch1.intro.1, TAJAKA.ch3.v1.1]

  - topic_id: TC.101
    topic: "Nakshatra lords (Vimshottari sequence) — agreement on sequence"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      The 27 nakshatra lords follow the Vimshottari sequence (Ketu, Venus, Sun,
      Moon, Mars, Rahu, Jupiter, Saturn, Mercury — repeating 3 times for 27
      nakshatras). This assignment is accepted by all four schools as the standard
      nakshatra-lord table.
    qualifications: []
    conflicts: []
    rule_refs: [BPHS.46.3.1, KP.1.ch1.intro.1, JAIMINI.1.1.1.1]

  - topic_id: TC.102
    topic: "Abhijit nakshatra — 28th nakshatra recognition"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Abhijit (the 28th nakshatra, positioned near 6°40'–10°53'20" Capricorn)
      is recognized in Parashari tradition and occasionally referenced in KP.
      It is an auspicious nakshatra for muhurta (electional) purposes.
    qualifications:
      - school: parashari
        note: >
          Abhijit is primarily a muhurta nakshatra; in natal astrology it is less
          commonly used. When Moon transits Abhijit, it is considered highly auspicious.
      - school: kp
        note: >
          KP sub-division system uses 27 nakshatras only for the sub-lord calculations;
          Abhijit is not incorporated into the KP sub-lord scheme.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.5.28.1, KP.1.ch1.nakshatra.28]

  - topic_id: TC.103
    topic: "Nakshatra-based health indicators"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Certain nakshatras are associated with health vulnerabilities; their lords
      and the planets placed in those nakshatras are assessed for health matters.
      Both systems recognize nakshatra-level health associations.
    qualifications:
      - school: parashari
        note: >
          Parashari health assessment uses the 6th house, 6th lord, and planets
          in the 6th as primary indicators; nakshatra placement adds secondary
          body-part specificity (each nakshatra governs specific body parts per
          BPHS Ch. 5's extended commentary).
      - school: kp
        note: >
          KP uses the 6th cusp sub-lord as the primary disease indicator; the
          nakshatra lord of the 6th cusp and the sub-lord's significations reveal
          disease nature and body system affected.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.5.2.1, KP.2.ch7.health.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 16: REMEDIES (TC.104–TC.118)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.104
    topic: "Gemstone remedies — general principle"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Gemstones are recommended to strengthen beneficial planets or to mitigate
      afflictions. The primary gemstone for a planet (Ruby=Sun, Pearl=Moon,
      Red coral=Mars, Emerald=Mercury, Yellow sapphire=Jupiter, Diamond=Venus,
      Blue sapphire=Saturn, Hessonite=Rahu, Cat's eye=Ketu) is broadly accepted
      across Parashari and Jaimini traditions.
    qualifications:
      - school: parashari
        note: >
          Parashari tradition recommends gemstones for the lagna lord, 9th lord,
          or any yogakaraka to strengthen their beneficial effects. Gemstones for
          malefics or functionally malefic planets are generally avoided. The
          selection depends on the planet's functional role in the specific lagna.
      - school: jaimini
        note: >
          Jaimini-influenced practitioners often recommend gemstones based on the
          AK's planetary identity and the Karakamsha lord's requirements; the
          soul-level karaka is the priority for gemstone prescription.
      - school: kp
        note: >
          KP does not have a formal gemstone prescription system; K.S. Krishnamurti
          was skeptical of gemstone remedies and focused on electional astrology
          and prayer. Contemporary KP practitioners use BPHS gemstone tables as a
          secondary reference outside strict KP methodology.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.81.1.1, JAIMINI.4.2.1.1, KP.6.ch20.remedies.1]

  - topic_id: TC.105
    topic: "Mantra remedies — planetary beeja mantras"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Planetary beeja (seed) mantras — Om Hram Hrim Hraum Sah Suryaya Namah (Sun),
      Om Shram Shrim Shraum Sah Chandraya Namah (Moon), etc. — are recognized
      across Parashari and Jaimini traditions as effective remedial measures.
      The mantras are textually rooted in Vedic/Tantric traditions that predate
      the schools; agreement is inherited from common source.
    qualifications:
      - school: kp
        note: >
          KP system does not formally prescribe specific mantras; however, general
          Vedic mantras for planetary propitiation are acknowledged by KP practitioners
          as supplementary, not core KP methodology.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.81.2.1, KP.6.ch20.remedies.2]

  - topic_id: TC.106
    topic: "Dana (charitable donation) as remedy"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Dana (charitable donation of items associated with a planet) is recognized
      as a remedy across Parashari and Jaimini traditions. Each planet has associated
      items: Sun=wheat/copper/jaggery, Moon=rice/milk/silver, Mars=lentils/copper,
      etc. Donation on appropriate days (planets' weekdays) strengthens the remedy.
    qualifications:
      - school: kp
        note: >
          KP does not formally incorporate dana prescriptions; however, general
          remedial goodwill (charity) is acknowledged by KP practitioners within
          broader Vedic context.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.81.3.1]

  - topic_id: TC.107
    topic: "Muhurta (electional astrology) — auspicious timing principles"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      All four schools recognize the importance of auspicious timing (muhurta) for
      major life events (marriage, business, travel, etc.). The use of the Panchanga
      (tithi, vara, nakshatra, yoga, karana) as a timing filter is universally accepted.
    qualifications:
      - school: kp
        note: >
          KP has its own electional methodology: the ascendant's sub-lord at the
          muhurta time must signify the relevant houses for the event; it is a
          sub-lord-based approach to electional astrology, going beyond simple
          Panchanga auspiciousness.
      - school: tajaka
        note: >
          Tajaka muhurta: Itthasala between the relevant planets in the elected
          chart indicates the event will be completed; Ishrafa or Musaripa warns
          against proceeding. Tajaka-style muhurta is primarily about applying
          aspects in the elected chart.
    conflicts: []
    rule_refs: [BPHS.65.1.1, KP.6.ch22.muhurta.1, TAJAKA.ch8.v1.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 17: SPECIAL TOPICS — NAVAMSA, DIVISIONAL CHARTS (TC.108–TC.117)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.108
    topic: "Navamsa (D9) — spouse and dharma chart"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      The Navamsa (ninth divisional chart) is the most important harmonic after
      the Rashi chart; it reveals the native's dharma, spouse characteristics,
      and the deeper "inner" expression of planets. All three schools use the
      Navamsa as the primary divisional chart.
    qualifications:
      - school: parashari
        note: >
          Parashari: Navamsa used for vargottama assessment (planet in same sign
          in both Rashi and Navamsa = strong), spouse indicators (7th navamsa
          house and its lord), and overall chart strength ("planets strong in
          navamsa deliver better results in Vimshottari dashas").
      - school: jaimini
        note: >
          Jaimini: Karakamsha is the AK's navamsa sign — the Navamsa is
          foundational for all Karakamsha-based assessments. The 12 houses from
          the Karakamsha sign in the Navamsa form the core of Jaimini's
          advanced analysis. Soul-level indicators are ONLY in the Navamsa.
      - school: kp
        note: >
          KP: Navamsa is used as a secondary support chart; the sub-lord system
          primarily operates in the Rashi chart. Navamsa may be consulted for
          spouse characteristics confirmation.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.6.1.1, JAIMINI.1.3.1.1, KP.1.ch4.divisional.1]

  - topic_id: TC.109
    topic: "Vargottama planet — in same sign in both Rashi and Navamsa"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      A planet in the same sign in both the Rashi (D1) and Navamsa (D9) charts
      is called Vargottama — considered significantly strengthened. Broadly
      accepted across Parashari, Jaimini, and KP traditions.
    qualifications:
      - school: kp
        note: >
          KP: Vargottama is noted as a strengthening factor; however, the sub-lord
          of the planet's nakshatra sub remains the primary KP determinant of
          results. Vargottama enhances potential delivery capacity.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.6.2.1, JAIMINI.1.1.8.1, KP.1.ch4.vargottama.1]

  - topic_id: TC.110
    topic: "Drekkana (D3) — siblings and co-borns"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      The Drekkana (3rd harmonic, D3) chart is used for sibling assessment across
      all three schools that use divisional charts. The 3rd house and its lord in
      D3 give information about siblings' nature and life.
    qualifications: []
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.6.3.1, KP.1.ch4.divisional.3]

  - topic_id: TC.111
    topic: "Dashamsha (D10) — career and professional life"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      The Dashamsha (10th harmonic, D10) chart provides detailed information
      about career, professional life, and dharmic actions. The 10th house in D10
      and its lord reveal the professional path. Accepted across three schools.
    qualifications:
      - school: kp
        note: >
          KP: D10 is consulted as a secondary support chart; primary career
          assessment remains through the 10th house cusp sub-lord in the Rashi chart.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.6.10.1, JAIMINI.2.3.2.1, KP.1.ch4.divisional.10]

  - topic_id: TC.112
    topic: "Muntha (Tajaka annual chart progressed ascendant)"
    pattern: ORTHOGONAL
    schools_addressing: [tajaka]
    note_on_other_schools: >
      Muntha is a Tajaka-specific progressed indicator in the annual chart: it
      advances approximately 1 sign per year from the natal Lagna. In a given
      year, the Muntha sign and its lord indicate the activated area of life for
      that year. The Muntha lord in the annual chart and its Itthasala/Ishrafa
      relationships govern the year's key themes. BPHS/Jaimini/KP have no
      equivalent Muntha concept; they use different annual and progression systems.
    rule_refs: [TAJAKA.ch5.v1.1, TAJAKA.ch5.v2.1]

  - topic_id: TC.113
    topic: "Varshaphal — annual chart (Tajaka Varsha Kundali)"
    pattern: ORTHOGONAL
    schools_addressing: [tajaka]
    note_on_other_schools: >
      The Tajaka Varsha Kundali (annual solar return chart) is a complete annual
      assessment system — the primary output of Tajaka methodology. While Parashari
      tradition uses transits and Vimshottari antardasha sub-period assessment for
      annual predictions, and Jaimini uses the running Chara Dasha sign's annual
      impact, neither uses a formal annual solar return chart the way Tajaka does.
      KP uses transits filtered through the triple-significator method. These are
      four incompatible annual assessment methodologies; cross-system annual
      triangulation increases probability but the methodologies must remain distinct.
    rule_refs: [TAJAKA.ch1.v1.1, TAJAKA.ch1.v2.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 18: ASHTAKAVARGA (TC.114–TC.118)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.114
    topic: "Ashtakavarga — transit strength measurement"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Ashtakavarga is a Parashari system for measuring a planet's transit strength
      through a house using bindu (point) counts; a transit through a house with
      ≥4 bindus in the relevant planet's Ashtakavarga is generally auspicious.
      Both Parashari and KP reference this system, though with different weight.
    qualifications:
      - school: parashari
        note: >
          Ashtakavarga is one of the most important Parashari transit assessment tools.
          Sarvashtakavarga (total bindus across all 7 planets for a given house) ≥28
          is generally considered strong. The Ashtakavarga can be used for transit
          timing, muhurta selection, and life event probability assessment.
      - school: kp
        note: >
          KP: Ashtakavarga is referenced as a supplementary tool by some KP
          practitioners; however, the core KP transit method uses the triple-
          significator approach. Ashtakavarga is not central to classical KP Reader
          methodology.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.66.1.1, KP.5.ch16.ashtakavarga.1]

  - topic_id: TC.115
    topic: "Ashtakavarga — Saturn's transit through 12th from natal Saturn"
    pattern: QUALIFY
    schools_addressing: [parashari]
    core_agreement: >
      Saturn transiting the 12th, 1st, and 2nd signs from natal Saturn marks the
      beginning of Sade Sati in terms of Ashtakavarga; the Ashtakavarga bindus
      for Saturn in those signs determine intensity. Low bindu count (≤3) in
      those signs intensifies Sade Sati challenges.
    qualifications: []
    conflicts: []
    silent: [jaimini, kp, tajaka]
    rule_refs: [BPHS.66.5.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 19: SPECIAL TOPICS (TC.116–TC.130)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.116
    topic: "Marriage timing — multi-system assessment"
    pattern: ORTHOGONAL
    schools_addressing: [parashari, jaimini, kp, tajaka]
    c1_flag: true
    c3_flag: true
    c5_flag: true
    note_on_frameworks: >
      Marriage timing is assessed through four parallel and non-comparable frameworks:
      (1) PARASHARI: 7th house, 7th lord, Venus (natural karaka), navamsa 7th house,
          and the Vimshottari dasha/antardasha of Venus, 7th lord, or planets in 7th.
          Also Jaimini Upapada and Darakaraka for timing in Jaimini sub-tradition
          sometimes mixed in contemporary Parashari practice.
      (2) JAIMINI: Darakaraka (DK), Upapada Lagna (UL), 7th from Karakamsha;
          timing via Chara Dasha of the sign containing or aspecting DK/UL.
      (3) KP: 7th cusp sub-lord must signify 2nd/7th/11th houses (marriage indicator);
          timing via triple-significator — dasha lord, antardasha lord, and transit
          planet all signify the marriage-relevant houses simultaneously.
          [C3: Placidus 7th cusp governs — may differ from Parashari 7th house sign boundary.]
      (4) TAJAKA: Annual chart — years when annual 7th lord makes Itthasala with
          Venus or DK-relevant planets indicate marriage-potential years.
      Multi-school convergence: when all four systems point to the same 12–18 month
      window, confidence in marriage timing increases substantially.
    rule_refs: [BPHS.18.1.1, JAIMINI.1.3.9.1, KP.4.ch11.marriage.1, TAJAKA.ch7.v3.1]
    flag: [C1, C3, C5]

  - topic_id: TC.117
    topic: "Child birth timing — multi-system assessment"
    pattern: ORTHOGONAL
    schools_addressing: [parashari, jaimini, kp]
    c1_flag: true
    c5_flag: true
    note_on_frameworks: >
      Child birth timing across three parallel frameworks:
      (1) PARASHARI: 5th house, 5th lord, Jupiter (natural karaka for children),
          navamsa 5th house; Vimshottari dasha of 5th lord or Jupiter.
          Also Saptamsha (D7) for detailed child assessment.
      (2) JAIMINI: Putrakaraka (PK), 5th from Karakamsha, Chara Dasha of PK sign.
      (3) KP: 5th cusp sub-lord must signify 2nd/5th/11th for child birth;
          triple-significator for timing.
      TAJAKA: Annual chart — annual 5th house and Itthasala between annual 5th
      lord and Jupiter indicate child-birth years.
    rule_refs: [BPHS.14.1.1, JAIMINI.1.3.7.1, KP.4.ch11.children.1]
    flag: [C1, C5]

  - topic_id: TC.118
    topic: "Career/profession assessment — multi-system"
    pattern: ORTHOGONAL
    schools_addressing: [parashari, jaimini, kp, tajaka]
    c1_flag: true
    c5_flag: true
    note_on_frameworks: >
      Career assessment across four parallel systems:
      (1) PARASHARI: 10th house, 10th lord, Sun (authority), Mercury/Jupiter
          (intellectual professions), Saturn/Mars (technical/labour), Vimshottari
          dasha of 10th lord, Sun, or yogakaraka.
      (2) JAIMINI: Amatyakaraka (AmK — 2nd-highest-degree planet) is the primary
          career karaka; 10th from Karakamsha and 10th from AmK sign in navamsa
          reveal career nature. Chara Dasha of AmK's sign governs career milestones.
      (3) KP: 10th cusp sub-lord must signify 2nd/6th/10th/11th for career
          achievement; profession nature from planets in sub-lord's nakshatra.
          Triple-significator governs career event timing.
      (4) TAJAKA: Annual 10th house and its Itthasala with Saturn (for service),
          Sun (for authority), or Mercury (for business) indicate career events
          in a specific year.
    rule_refs: [BPHS.11.10.1, JAIMINI.1.3.12.1, KP.4.ch11.career.1, TAJAKA.ch7.v4.1]
    flag: [C1, C5]

  - topic_id: TC.119
    topic: "Longevity determination — Parashari methods"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Longevity (ayur) determination uses the 8th house (longevity indicator),
      lagna lord, Moon sign lord, and specific marak (death-inflicting) planets
      (lords of 2nd and 7th houses). Broadly recognized across Parashari and KP.
    qualifications:
      - school: parashari
        note: >
          Parashari longevity assessment: three categories (short, medium, long) based
          on the longevity calculation using the 8th lord, lagna lord, and Moon's position.
          Marak planets (2nd and 7th lords) and planets in 2nd/7th deliver death/near-death
          in their dashas during vulnerable periods.
      - school: kp
        note: >
          KP: 8th cusp sub-lord is the primary longevity indicator; Saturn/Sun/Mars in
          the sub-lord chain indicate vulnerability. Marak identification follows similar
          2nd/7th lord logic but is filtered through sub-lord connectivity.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.44.1.1, KP.4.ch11.longevity.1]

  - topic_id: TC.120
    topic: "Foreign travel and settlement — house indicators"
    pattern: QUALIFY
    schools_addressing: [parashari, kp, tajaka]
    core_agreement: >
      Foreign travel and settlement: primarily 12th house (foreign lands), 3rd (short
      journeys/courage), and 9th (long journeys) are indicators. All three schools
      recognize these house combinations for foreign matters.
    qualifications:
      - school: parashari
        note: >
          Rahu is the primary karaka for foreign lands and unconventional environments;
          Rahu in 1/7/9/12 with beneficial connections often indicates foreign travel.
          Combined 3rd/9th/12th house analysis for international movement.
      - school: kp
        note: >
          KP: 3rd + 9th + 12th cusp sub-lords must cooperate for foreign travel;
          a sub-lord that connects 9th and 12th (foreign settlement) vs. 3rd and
          12th (short foreign journey) vs. 9th and 12th + 4th obstruction (cannot
          settle — must return) gives precise KP differentiations.
      - school: tajaka
        note: >
          Annual chart: annual 12th house lord's Itthasala with 3rd or 9th lord
          in the Varsha Kundali indicates foreign travel in that year.
    conflicts: []
    silent: [jaimini]
    rule_refs: [BPHS.11.12.2, KP.4.ch11.foreign.1, TAJAKA.ch7.v5.1]

  - topic_id: TC.121
    topic: "Financial gains and wealth — house indicators"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      2nd house (accumulated wealth), 11th house (income/gains), and 5th house
      (speculation/investments) are the primary wealth indicator houses across
      all four schools. Agreement on the basic house set.
    qualifications:
      - school: parashari
        note: >
          Dhana yogas (2nd + 11th lord combinations, lagna lord + 2nd lord, etc.)
          are specifically enumerated; Jupiter's association with 2nd/11th lord
          enhances wealth potential.
      - school: jaimini
        note: >
          2nd from Karakamsha assessed for wealth capacity at the soul level;
          Arudha Lagna's 2nd house (A2 Dhana Arudha) indicates the visible wealth
          and financial image.
      - school: kp
        note: >
          KP: 2nd + 11th cusp sub-lords must both signify 2nd and 11th (and not
          8th/12th as primary) for wealth to accumulate; Jupiter and Venus as
          sub-lords of 2nd/11th are particularly positive.
    conflicts: []
    rule_refs: [BPHS.15.1.1, JAIMINI.1.3.5.1, KP.4.ch11.wealth.1, TAJAKA.ch7.v6.1]

  - topic_id: TC.122
    topic: "Education and intellect — house indicators"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      2nd house (early education, speech), 4th house (formal education), 5th house
      (intelligence, creativity), and 9th house (higher education, philosophy) are
      the education-related houses. Mercury as natural significator of intellect
      and communication is universally accepted.
    qualifications:
      - school: kp
        note: >
          KP: 4th cusp sub-lord (formal education), 5th cusp sub-lord (intelligence),
          9th cusp sub-lord (higher education/overseas study) each require signification
          of the relevant houses for educational attainments. Mercury and Jupiter
          as sub-lords or nakshatra lords enhance educational outcomes.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.11.4.2, KP.4.ch11.education.1, JAIMINI.1.3.6.2]

  - topic_id: TC.123
    topic: "Spiritual liberation (moksha) indicators"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Moksha indicators include 12th house (spiritual liberation, foreign/other-worlds),
      Ketu (dissolution of ego), Jupiter and Venus (spiritual guides), and the
      4th house (inner peace). All three schools recognize these general associations.
    qualifications:
      - school: jaimini
        note: >
          Jaimini has the most systematic moksha assessment: Ketu in 12th from
          Karakamsha is the strongest moksha indicator; Rahu in 12th from Karakamsha
          is the second strongest; AK in 12th house or 12th from Karakamsha in
          navamsa with benefic association indicates high moksha potential.
          The AK's planet type (Jupiter AK = dharmic moksha; Ketu AK = non-attachment
          moksha; etc.) characterizes the moksha path.
      - school: kp
        note: >
          KP: 12th cusp sub-lord signifying 12th (without 6th/8th obstructions as
          primary significations) indicates spiritual liberation tendency; Saturn or
          Ketu as sub-lord of 12th with 9th connection adds spiritual depth.
      - school: parashari
        note: >
          Parashari uses 12th lord, Ketu in 12th, and Jupiter/Venus aspecting 12th
          as moksha indicators; a chart with multiple moksha indicators across
          different houses shows strong spiritual potential.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.11.12.3, JAIMINI.1.3.14.2, KP.4.ch11.moksha.1]

  - topic_id: TC.124
    topic: "Pitra dosha — affliction related to departed ancestors"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini]
    core_agreement: >
      Pitra Dosha (ancestral affliction) is recognized in Parashari tradition:
      primarily when Sun or 9th house is afflicted by Rahu/Ketu/Saturn, indicating
      unresolved ancestral karma. Jaimini's Gnatikaraka (6th highest-degree planet)
      carries related family/extended-family karmic matters.
    qualifications:
      - school: parashari
        note: >
          Specific configurations: Rahu + Sun conjunction (solar eclipse-like effect
          on father-ancestor axis), Saturn in 9th, or 9th lord afflicted by malefics.
          Remedies include tarpan (ancestral water offerings), pind daan, and
          Shraddha rituals.
      - school: jaimini
        note: >
          Jaimini's Gnatikaraka's affliction (by Rahu, or in 6th/8th/12th from
          Karakamsha) indicates ancestral karmic issues; the nature of the afflicting
          planet indicates the type of ancestral matter requiring resolution.
    conflicts: []
    silent: [kp, tajaka]
    rule_refs: [BPHS.17.1.1, JAIMINI.1.1.5.4]

  - topic_id: TC.125
    topic: "Mangala Dosha (Kuja Dosha) — Mars in 1/2/4/7/8/12"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Mangala Dosha (Kuja Dosha): Mars in 1st, 2nd, 4th, 7th, 8th, or 12th house
      from the lagna (or Moon, or Venus in some traditions) creates a "dosha"
      affecting marriage harmony. Widely recognized across all three schools,
      though the extent of houses included varies.
    qualifications:
      - school: parashari
        note: >
          Multiple cancellation conditions: Mars in own sign or exaltation; Mars
          with Jupiter; 7th house Mars in Sagittarius/Pisces (Jupiter's sign);
          both partners have Mangala Dosha (mutual cancellation). When Mars is
          yogakaraka for the lagna (e.g., Cancer/Leo lagna), the dosha is
          generally considered cancelled.
      - school: kp
        note: >
          KP: Mangala Dosha is recognized as a background factor; the 7th cusp
          sub-lord's connectivity governs whether marriage challenges actually
          manifest. A Kuja Dosha chart native can have a smooth marriage if
          the sub-lord of the 7th cusp does not primarily signify 6th/12th
          (separation/loss of partnership).
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.73.1.1, JAIMINI.2.3.3.1, KP.4.ch11.mangala.1]

  - topic_id: TC.126
    topic: "Combustion of Venus — effects on marriage"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Venus combust (within ~10° of Sun, or 8° when retrograde) is weakened in
      its marriage-karaka capacity. Both Parashari and KP note this as reducing
      Venus's beneficial signification delivery for marriage and relationship matters.
    qualifications:
      - school: parashari
        note: >
          Venus combust in a marriage-relevant period (7th lord dasha, Venus dasha)
          can delay or complicate marriage. Exalted combust Venus (Pisces near Sun)
          may still give marriage results due to the combination of exaltation strength.
      - school: kp
        note: >
          KP: Venus combust's sub-lord connectivity is the primary determinant; combustion
          weakens Venus's house-signification delivery capacity but the sub-lord of the
          7th cusp (not Venus itself) governs marriage fructification.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.3.45.6, KP.1.ch2.combustion.venus.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 20: LAGNA AND ASCENDANT MATTERS (TC.127–TC.136)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.127
    topic: "Lagna lord in 1st house — self-determination and health"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      The lagna lord in the 1st house is a generally positive placement giving
      self-reliance, strong constitution, and independent character. All three
      schools recognize this as strengthening 1st-house matters.
    qualifications:
      - school: kp
        note: >
          KP: the lagna lord's sub-lord governs specific results; placement in 1st
          is a supporting factor for health and self-expression.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.33.1.11, KP.3.ch11.lagna.1, JAIMINI.1.3.2.2]

  - topic_id: TC.128
    topic: "Lagna lord in 8th house — challenges to health and longevity"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Lagna lord in the 8th house is generally considered challenging for health
      and longevity in Parashari tradition. KP and Jaimini have important
      qualifications.
    qualifications:
      - school: parashari
        note: >
          Lagna lord in 8th: challenges to the body and self; possible health issues,
          potential for shorter life unless other longevity indicators are strong.
          However, strong lagna lord in 8th (own sign, exalted) can give occult
          knowledge and research abilities alongside health challenges.
      - school: kp
        note: >
          KP: Lagna lord in 8th does not automatically harm health; the lagna lord's
          sub-lord and its significations determine outcomes. A lagna lord in 8th
          with sub-lord signifying 1/5/9/11 can still give positive results.
      - school: jaimini
        note: >
          Jaimini assesses lagna lord placement from AK and Karakamsha in addition
          to natal lagna; 8th from AK has different implications than 8th from
          natal lagna.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.33.1.8, KP.3.ch11.lagna8.1, JAIMINI.1.3.8.1]

  - topic_id: TC.129
    topic: "Lagna lord in 12th house — expenses, spirituality, foreign"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Lagna lord in 12th house: generally associated with expenses, spiritual
      inclinations, foreign travel, and some loss of bodily strength. All three
      schools recognize the 1st-12th lord combination as significant.
    qualifications:
      - school: parashari
        note: >
          Lagna lord in 12th: weakened self-expression; possible bed pleasures
          and spiritual liberation tendency. If the 12th lord is simultaneously
          strong, a Viparita-like result (unexpected gain from loss) is possible.
      - school: kp
        note: >
          KP: Lagna lord in 12th's sub-lord determines specifics; if sub-lord
          signifies 12th + 9th (spiritual foreign), outcomes differ from 12th + 6th
          (hospitalization) or 12th + 3rd (short foreign journey).
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.33.1.12, KP.3.ch11.lagna12.1]

  - topic_id: TC.130
    topic: "Trikona (trinal) house lords — benefic functional role"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Lords of 5th and 9th houses (trinal houses / trikona bhava) are considered
      beneficially functional planets for any lagna — they give positive results
      regardless of their natural (friendly/enemy) relationship with the lagna.
      Trikona lords are the purveyors of fortune and dharma in any chart.
    qualifications:
      - school: kp
        note: >
          KP acknowledges trikona lord status as a positive factor; however, the
          sub-lord connectivity model means a trikona lord must also signify
          relevant houses through the sub-lord chain to deliver results.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.34.1.1, JAIMINI.1.3.4.1, KP.2.ch6.trines.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 21: SPECIAL YOGAS — ADVANCED (TC.131–TC.145)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.131
    topic: "Chandra-Mangala Yoga — Moon conjunct Mars"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Chandra-Mangala Yoga (Moon + Mars conjunction or mutual aspect) is recognized
      in Parashari tradition as giving commercial ability, financial enterprise, and
      courage in business. KP acknowledges the combination with sub-lord qualification.
    qualifications:
      - school: parashari
        note: >
          Moon+Mars together: emotional courage, enterprise, potential for business
          success; also associated with a bold, sometimes aggressive emotional nature.
          The yoga is better when both are well-dignified; otherwise gives impulsiveness.
      - school: kp
        note: >
          KP: Moon-Mars combination — Chandra-Mangala conjunction modifies the
          sub-lord significations of both planets; outcome depends on their joint
          sub-lord's house connectivity.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.37.3.1, KP.4.ch12.yoga.8]

  - topic_id: TC.132
    topic: "Saraswati Yoga — Jupiter + Venus + Mercury in kendra/trikona"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Saraswati Yoga: Jupiter, Venus, and Mercury together in a kendra or trikona
      (or combinations thereof). Confers learning, artistic excellence, intelligence,
      and eloquence. Recognized across Parashari and some Jaimini/KP traditions.
    qualifications:
      - school: parashari
        note: >
          All three (or at least two of three) in kendras or trikonas simultaneously;
          gives highly educated, cultured, and creative individuals. Strongest when
          all three are in good dignity.
      - school: kp
        note: KP: yoga is background; sub-lord connectivity determines manifestation.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.37.4.1, KP.4.ch12.yoga.9]

  - topic_id: TC.133
    topic: "Parivartana Yoga (mutual exchange) — lagna lord and 9th lord"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      A Parivartana Yoga (mutual sign exchange) between the lagna lord and the
      9th lord is one of the most auspicious combinations — conferring great
      fortune, health, and dharmic life direction. Broadly accepted.
    qualifications:
      - school: kp
        note: >
          KP: Parivartana recognized as highly positive background condition;
          sub-lord connectivity required for specific event manifestation.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.38.3.1, KP.4.ch12.parivartana.1]

  - topic_id: TC.134
    topic: "Kesari Yoga — Jupiter in kendra from Moon"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Kesari Yoga (also called Gajakesari — identical entry): Jupiter in 1/4/7/10
      from Moon. Confers wisdom, wealth, and respectable life. Recognized in both systems.
      [Note: TC.048 covers this yoga; this entry adds refinement on cancellation
      conditions.]
    qualifications:
      - school: parashari
        note: >
          Cancellation: Jupiter combust or debilitated significantly weakens the yoga.
          Jupiter in 10th from Moon in Capricorn (debilitation) still technically
          forms the yoga but with reduced efficacy.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.37.1.1, KP.4.ch12.yoga.6]

  - topic_id: TC.135
    topic: "Shasha Yoga vs. Sasa Yoga — disambiguation"
    pattern: AGREE
    schools_addressing: [parashari]
    core_agreement: >
      Sasa Yoga (Saturn Mahapurusha — TC.045) = Saturn in own/exalted sign in kendra.
      This is the same yoga with two transliteration variants (Sasa/Shasha) in
      different editions of BPHS; no conceptual difference. All Parashari tradition
      treats these as the same yoga.
    qualifications: []
    conflicts: []
    silent: [jaimini, kp, tajaka]
    rule_refs: [BPHS.36.3.1]

  - topic_id: TC.136
    topic: "Argala (intervention) — Jaimini planets blocking or influencing"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      Jaimini Argala (from Adhyaya 1 Pada 3 sutras): planets in certain houses
      from another planet or sign create Argala (intervention/obstruction/help)
      that modifies the drishti's results. Specifically: planets in 2nd, 4th,
      and 11th from a reference point create Argala (strengthening); planets in
      3rd, 10th, and 12th create Virodha Argala (counter-intervention, blocking).
      This is a Jaimini-specific mechanism with no direct equivalent in Parashari's
      graha drishti system, KP's sub-lord chain, or Tajaka's aspect system.
    rule_refs: [JAIMINI.1.3.1.2, JAIMINI.1.3.2.1]
    flag: C1

  - topic_id: TC.137
    topic: "Prasna (horary) astrology — use of rising chart at time of query"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Prasna (horary/question chart) is recognized in both Parashari and KP
      traditions: a chart cast for the moment of asking a question can answer
      specific queries without requiring the querent's birth data.
    qualifications:
      - school: parashari
        note: >
          Parashari Prasna uses the Prasna lagna and the same house signification
          rules as natal astrology; the 7th house and its lord represent the querent's
          desire/partner; the ASC represents the querent's circumstances.
      - school: kp
        note: >
          KP has an extensive Prasna methodology (K.S. Krishnamurti's "Horary
          Astrology"): the sub-lord of the Prasna ascendant cusp and the relevant
          house cusp sub-lords answer the specific question. KP Prasna is considered
          more precise than Parashari Prasna for specific event prediction.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.55.1.1, KP.6.ch18.prasna.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 22: PLANETARY PERIODS — ANTARDASHA RESULTS (TC.138–TC.145)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.138
    topic: "Rahu Antardasha in Jupiter Mahadasha"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Rahu antardasha within Jupiter Mahadasha (approx 2 years 4.8 months):
      generally a period of expansion through unconventional means; potential
      for foreign opportunities, sudden gains, or material success mixed with
      disruption. Both systems recognize this combination.
    qualifications:
      - school: parashari
        note: >
          Results depend on Rahu's house/sign and its relationship to Jupiter's
          significations. If Rahu is in 2/5/9/11 from Jupiter's position, generally
          positive; if in 6/8/12 from Jupiter, challenges to Jupiter's themes.
      - school: kp
        note: >
          KP: Rahu antardasha under Jupiter Mahadasha — both lords must signify
          relevant houses for specific events. Jupiter's beneficence moderates
          Rahu's disruptive tendencies in the antardasha.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.47.5.8, KP.5.ch17.jup_rahu.1]

  - topic_id: TC.139
    topic: "Saturn Antardasha in Rahu Mahadasha"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Saturn antardasha within Rahu Mahadasha (approx 2 years 10.6 months):
      often considered one of the more challenging antardasha combinations —
      both natural malefics combined, testing endurance and karmic maturity.
      Both systems note its heaviness.
    qualifications:
      - school: parashari
        note: >
          Rahu and Saturn together as dasha/antardasha lords can bring legal matters,
          chronic health issues, career setbacks, or separation from home/family
          depending on their natal placements. Exalted Saturn or strong Saturn
          significantly mitigates these challenges.
      - school: kp
        note: >
          KP: both Rahu and Saturn's sub-lords and house significations determine
          outcomes; not automatically negative — if both signify 1/5/9/11, positive
          career/income results are possible even during this combination.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.47.6.7, KP.5.ch17.rahu_sat.1]

  - topic_id: TC.140
    topic: "Mars Antardasha in Saturn Mahadasha"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Mars antardasha within Saturn Mahadasha (approx 1 year 1.3 months):
      Saturn+Mars combination associated with potential accidents, conflicts,
      or surgery/medical procedures in challenging natal configurations. Mixed
      results with potential for energy in construction/real estate.
    qualifications:
      - school: parashari
        note: >
          Saturn-Mars combination: agitation, potential for property disputes,
          accidents involving vehicles or fire/metal. If Saturn is yogakaraka
          and Mars is also well-placed (own sign or exaltation), the period can
          bring property acquisition or successful construction.
      - school: kp
        note: >
          KP: Sub-lord connectivity of both Mars and Saturn governs outcomes;
          not inherently negative. Accident risk is signaled when both lords
          signify 8th or 12th through their sub-lord chains.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.47.7.5, KP.5.ch17.sat_mars.1]

  - topic_id: TC.141
    topic: "Venus Antardasha in Venus Mahadasha — double Venus period"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Venus antardasha within Venus Mahadasha (approx 3 years 4 months — the
      longest antardasha): generally the most Venusian period of the entire
      20-year Venus Mahadasha. Arts, relationships, beauty, and material
      pleasures are strongly highlighted.
    qualifications:
      - school: parashari
        note: >
          The first antardasha within any Mahadasha is the same planet as the
          Mahadasha lord — this is always considered an intensified version of the
          Mahadasha's themes. Venus-Venus period: romance, marriage potential,
          artistic achievement, material luxury — highly positive if Venus is
          well-placed; if Venus is afflicted, the period amplifies those affliction
          themes (relationship challenges, expenses, indulgences).
      - school: kp
        note: >
          KP: Venus sub-lord's house significations govern what Venus-Venus period
          delivers; artistic, financial, or marital results depend on Venus's
          connectivity to relevant house cusps.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.47.4.4, KP.5.ch17.venus_venus.1]

  - topic_id: TC.142
    topic: "Jupiter Antardasha in Mercury Mahadasha"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Jupiter antardasha within Mercury Mahadasha (approx 2 years 3.6 months):
      intellectual and wisdom-oriented period; potential for education, teaching,
      advisory roles, and spiritual growth. Mercury+Jupiter is generally a
      benefic combination (natural friends).
    qualifications:
      - school: parashari
        note: >
          Mercury-Jupiter dasha combo: writing, publication, education, financial
          planning, legal advisory — all Mercury-Jupiter synergies activated.
          Benefic for most lagnas.
      - school: kp
        note: >
          KP: sub-lord connectivity of both Mercury and Jupiter governs specific events.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.47.9.5, KP.5.ch17.mer_jup.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 23: ADDITIONAL SPECIAL TOPICS (TC.143–TC.160)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.143
    topic: "Bhava madhya vs. cusp — house analysis starting point"
    pattern: CONFLICT
    schools_addressing: [parashari, kp]
    core_agreement: null
    conflicts:
      - between: [parashari, kp]
        parashari_position: >
          Parashari (Sripati system): The bhava madhya (midpoint of a house) is
          the most sensitive point; planets near the bhava madhya are most strongly
          placed in that house. In the equal-house system, the house boundary is the
          ascendant degree ±15°; the bhava madhya is the ascendant degree itself.
        kp_position: >
          KP (Placidus): The cusp is the starting point of the house — the cusp
          degree is where the house's influence begins. A planet is in a house only
          if it is between that house's cusp and the next house's cusp. A planet
          near the cusp (within ~1°) may be assigned to the following house in strict
          KP convention. This is the opposite of Parashari's bhava-madhya logic.
        resolution: >
          CONFLICT on house-assignment logic for planets near house boundaries.
          In Parashari, a planet 1° before the next sign-cusp is clearly in the
          current house (in fact near the following house's bhava madhya in equal-house).
          In KP Placidus, that same planet may be in the following house depending
          on the cusp degree. Apply each system's convention within its own framework.
          Do not mix.
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.4.2.1, KP.1.ch1.cusp.1]
    flag: C3

  - topic_id: TC.144
    topic: "Nodes as eclipse degrees — eclipses as sensitive natal points"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Solar and lunar eclipses (which occur at the Rahu/Ketu axis) have special
      sensitivity as natal indicators; planets at eclipse degrees in the natal
      chart are considered more karmically activated. Broadly recognized.
    qualifications:
      - school: parashari
        note: >
          Eclipses near natal Sun or Moon (within ~5°) are considered significant
          markers of karmic intensity; Grahaṇa yoga (eclipse conjunction) is noted
          in BPHS as a major influence on the soul's expression and life path.
      - school: kp
        note: >
          KP: eclipse degrees are noted; transits of Rahu/Ketu over eclipse natal
          points are considered activation triggers; sub-lord connectivity at those
          degrees governs specific manifestations.
      - school: jaimini
        note: >
          Jaimini: Rahu/Ketu in the natal chart and their sign placements in the
          Chara scheme are assessed; eclipse nativity (Sun/Moon at natal Rahu/Ketu
          axis) intensifies AK or related karaka themes.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.3.8.1, KP.5.ch16.eclipse.1]
    flag: C6

  - topic_id: TC.145
    topic: "Pushkara navamsa and Pushkara bhaga — auspicious sensitive degrees"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini]
    core_agreement: >
      Pushkara Navamsa (the specific navamsa division associated with a planet's
      nourishing/auspicious nature) and Pushkara Bhaga (specific degrees within
      each sign that are exceptionally auspicious) are recognized in Parashari
      and some Jaimini commentaries.
    qualifications:
      - school: parashari
        note: >
          Planets at Pushkara Bhaga degrees in the natal chart are considered to
          give very positive results for their significations; these degrees are
          listed per sign in BPHS commentary traditions.
      - school: jaimini
        note: >
          Some Jaimini commentaries (particularly Rath's) use Pushkara Navamsa
          as an additional strength indicator alongside the Chara Karaka scheme.
    conflicts: []
    silent: [kp, tajaka]
    rule_refs: [BPHS.6.5.1, JAIMINI.1.1.9.1]

  - topic_id: TC.146
    topic: "Benefic vs. malefic planet classification — natural"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Natural benefics: Jupiter, Venus, Mercury (when not conjoined malefics),
      waxing Moon. Natural malefics: Sun (mildly), Mars, Saturn, Rahu, Ketu,
      waning Moon. This classification is universally accepted across all four schools.
    qualifications:
      - school: parashari
        note: >
          BPHS distinguishes natural (naisargika) benefic/malefic from functional
          (naimittika) benefic/malefic by house lordship for a specific lagna.
          Both must be considered.
      - school: kp
        note: >
          KP additionally classifies planets as benefic or malefic by their sub-lord
          connectivity; a natural benefic with a malefic sub-lord (signifying 6/8/12)
          can deliver malefic results despite natural beneficence.
    conflicts: []
    rule_refs: [BPHS.3.7.1, JAIMINI.1.1.7.1, KP.1.ch2.benefic.1, TAJAKA.ch2.v3.1]

  - topic_id: TC.147
    topic: "Functional malefics by lagna — concept varies by system"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      The concept of functional malefics (planets that give malefic results for a
      specific lagna due to their house lordship — regardless of natural nature)
      is a Parashari and KP shared concept.
    qualifications:
      - school: parashari
        note: >
          For each lagna, lords of trik houses (6/8/12) are functionally malefic
          for that lagna. Additionally, lords of kendras (1/4/7/10) that are natural
          benefics are said to lose their beneficence partially (Kendradhipati dosha).
          This creates a complex lagna-specific functional nature assessment.
      - school: kp
        note: >
          KP acknowledges functional malefic/benefic by house lordship as a relevant
          layer; however, the sub-lord connectivity is the primary determinant.
          A planet that is a functional malefic (6th lord) may deliver positive
          results if its sub-lord primarily signifies 1/5/9/11 rather than 6/8/12.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.34.2.1, KP.2.ch6.functional.1]

  - topic_id: TC.148
    topic: "Nadi astrology — thumb-print/leaf reading tradition"
    pattern: SILENT
    schools_addressing: []
    note_on_other_schools: >
      Nadi astrology (reading from palm-leaf manuscripts using thumb-prints) is
      a separate tradition not codified in BPHS, Jaimini Sutras, KP Reader, or
      Tajaka Neelakanthi. It is SILENT in all four schools of this corpus;
      noting as a boundary condition to prevent scope confusion.
    rule_refs: []

  - topic_id: TC.149
    topic: "Lal Kitab — karmic debt remedies"
    pattern: SILENT
    schools_addressing: []
    note_on_other_schools: >
      Lal Kitab is a Punjabi astrology tradition with distinctive remedies and
      house-interpretation methods. It is NOT part of BPHS, Jaimini, KP, or
      Tajaka schools. SILENT in all four systems; boundary condition noted.
    rule_refs: []

  - topic_id: TC.150
    topic: "Shri Pati / Sripati house system — relation to Parashari"
    pattern: QUALIFY
    schools_addressing: [parashari]
    core_agreement: >
      Sripati is a house system used in some Parashari schools that gives unequal
      houses based on the trisection of the quadrant. It is one of several Parashari
      house systems; not used in KP (which uses Placidus exclusively) or Jaimini
      (which uses sign-based houses) or Tajaka.
    qualifications:
      - school: parashari
        note: >
          Different Parashari sub-traditions use different house systems: South Indian
          tradition often uses equal-house; North Indian tradition may use Sripati or
          Chalit. The choice of house system affects house assignments for planets
          near house boundaries. BPHS itself does not explicitly mandate one house
          system over another — this is a source of inter-Parashari variation.
    conflicts: []
    silent: [jaimini, kp, tajaka]
    rule_refs: [BPHS.4.1.1]
    flag: C3

# ────────────────────────────────────────────────────────────────────────────
# SECTION 24: JAIMINI-SPECIFIC TOPICS (TC.151–TC.163)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.151
    topic: "Jaimini Shoola Dasha — death and adversity timing"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C5] Jaimini's Shoola Dasha is a specialized dasha system for timing adversity,
      major illness, and death-type events. It uses the 3rd, 8th, and 12th signs
      from the lagna (and Moon and Sun in some computations) to assign periods.
      This system has no equivalent in Vimshottari, KP triple-significator, or
      Tajaka Mudda Dasha. It is uniquely applicable for timing severe or transformative
      events within Jaimini's framework.
    rule_refs: [JAIMINI.2.3.1.1, JAIMINI.2.3.2.1]
    flag: C5

  - topic_id: TC.152
    topic: "Jaimini Sthira Dasha — fixed planetary periods for natal analysis"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C5] Jaimini's Sthira Dasha assigns fixed periods to planets regardless of
      their nakshatra position or degree (unlike Vimshottari which is Moon-nakshatra
      based). Each planet is assigned a fixed period in years:
      Sun=1, Moon=1, Mars=2, Mercury=9, Jupiter=9, Venus=2, Saturn=2, Rahu=3, Ketu=3
      (per one tradition; periods vary by commentator). Sthira Dasha is used in
      parallel with Chara Dasha for Jaimini analysis; not comparable to Vimshottari.
    rule_refs: [JAIMINI.2.2.1.1]
    flag: C5

  - topic_id: TC.153
    topic: "Jaimini Varnada Lagna — secondary ascendant for Varnada Dasha"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      Varnada Lagna is a Jaimini special ascendant computed from the lagna and
      hora lagna positions. It governs the Varnada Dasha (a Jaimini variant dasha
      system) and has specific significations for health and longevity in the Jaimini
      framework. BPHS/KP/Tajaka have no Varnada Lagna concept.
    rule_refs: [JAIMINI.2.4.1.1]
    flag: C1

  - topic_id: TC.154
    topic: "Jaimini Hora Lagna — financial assessment secondary ascendant"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      Hora Lagna is a Jaimini computed ascendant that advances at twice the rate
      of the regular ascendant; it indicates the financial orientation and wealth
      potential of the native. 2nd house from Hora Lagna gives specific wealth
      indications. BPHS/KP/Tajaka have no equivalent Hora Lagna computation.
    rule_refs: [JAIMINI.2.4.2.1]
    flag: C1

  - topic_id: TC.155
    topic: "Jaimini Ghatika Lagna — power and authority indicator"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      Ghatika Lagna (every 2 ghatikas = 48 minutes one sign advances) is a Jaimini
      special ascendant indicating power, authority, and position in society.
      Planets in Ghatika Lagna or aspecting it by Jaimini rashi drishti confer
      political/administrative power. Unique to Jaimini; no BPHS/KP/Tajaka equivalent.
    rule_refs: [JAIMINI.2.4.3.1]
    flag: C1

  - topic_id: TC.156
    topic: "Jaimini Atmakaraka in Sagittarius navamsa — spiritual teacher"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      When the AK falls in Sagittarius navamsa (Karakamsha = Sagittarius), the
      native is inclined toward philosophy, religious teaching, and dharmic authority.
      Jupiter in Sagittarius Karakamsha or aspecting it intensifies this.
      This is a Jaimini Karakamsha-specific reading with no direct BPHS/KP/Tajaka
      equivalent.
    rule_refs: [JAIMINI.1.3.3.1]
    flag: C1

  - topic_id: TC.157
    topic: "Jaimini Brahma (Brahma Graha) — lifespan indicator"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      Jaimini's Brahma calculation determines the planet (Brahma Graha) governing
      the overall longevity structure of the chart. The Brahma Graha is identified
      through specific Jaimini sutra rules involving the lord of the lagna sign, its
      count from the lagna, and special conditions. This longevity assessment is
      structurally different from Parashari's marak system, KP's 8th cusp sub-lord
      longevity method, or Tajaka's annual chart indicators.
    rule_refs: [JAIMINI.3.1.1.1]
    flag: C5

# ────────────────────────────────────────────────────────────────────────────
# SECTION 25: KP-SPECIFIC TOPICS (TC.158–TC.165)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.158
    topic: "KP sub-lord of cusp 1 — health determination"
    pattern: ORTHOGONAL
    schools_addressing: [kp]
    note_on_other_schools: >
      [C1, C3] In KP, the sub-lord of the 1st cusp (Placidus ascendant degree's
      sub) is the primary determinant of health throughout life. If the 1st cusp
      sub-lord signifies (is connected to) 6th/8th/12th houses primarily, the
      native has chronic health vulnerabilities. If it signifies 1/5/9/11, health
      is generally robust. Parashari uses lagna lord's strength and 6th house
      condition for health — structurally different. Jaimini uses AK condition in
      navamsa. These cannot be merged.
    rule_refs: [KP.2.ch7.health.cusp1.1]
    flag: [C1, C3]

  - topic_id: TC.159
    topic: "KP sub-lord of cusp 7 — marriage determination"
    pattern: ORTHOGONAL
    schools_addressing: [kp]
    note_on_other_schools: >
      [C3] The 7th cusp sub-lord (Placidus 7th cusp degree's sub) is the KP primary
      marriage determinant. The sub-lord must signify 2nd/7th/11th houses (forming
      bonds + partnership + fulfillment) for marriage to be promised; if it primarily
      signifies 6/10/12, marriage may be delayed, denied, or troubled. This is a
      unique KP determination mechanism; Parashari uses 7th house + Venus + navamsa 7th;
      Jaimini uses DK + UL; Tajaka uses annual 7th house. All are parallel methods.
    rule_refs: [KP.2.ch7.marriage.cusp7.1]
    flag: C3

  - topic_id: TC.160
    topic: "KP sub-lord of cusp 10 — career determination"
    pattern: ORTHOGONAL
    schools_addressing: [kp]
    note_on_other_schools: >
      [C3] The 10th cusp sub-lord (Placidus 10th cusp degree's sub) is the KP
      primary career promise determinant. Sub-lord must signify 2nd/6th/10th/11th
      houses for professional achievement. The nature of the planet in the sub-lord's
      nakshatra reveals profession type. This is structurally distinct from Parashari's
      10th house + lord assessment and Jaimini's Amatyakaraka assessment.
    rule_refs: [KP.2.ch7.career.cusp10.1]
    flag: C3

  - topic_id: TC.161
    topic: "KP ruling planets method — planets ruling the moment"
    pattern: ORTHOGONAL
    schools_addressing: [kp]
    note_on_other_schools: >
      KP Ruling Planets: at any given moment, the planets ruling the lagna sign lord,
      lagna nakshatra lord, lagna sub-lord, Moon sign lord, Moon nakshatra lord, and
      Moon sub-lord are the "ruling planets" — they govern what can be predicted and
      confirmed at that moment (for the astrologer) and what is activated for the
      native. This is a KP-specific diagnostic method for both horary and natal
      chart verification. No equivalent in Parashari/Jaimini/Tajaka.
    rule_refs: [KP.6.ch18.ruling_planets.1]

  - topic_id: TC.162
    topic: "KP stellar astrology basis — nakshatra is more important than sign"
    pattern: CONFLICT
    schools_addressing: [parashari, kp]
    core_agreement: null
    conflicts:
      - between: [parashari, kp]
        parashari_position: >
          Parashari: the sign (rashi) in which a planet is placed is the primary
          dignity determinant (exaltation, own sign, debilitation, friendly sign,
          etc.). The nakshatra adds a secondary layer (paksha, nakshatra lord) but
          sign dignity is the primary indicator of a planet's strength and basic
          results.
        kp_position: >
          KP (Krishnamurti): the nakshatra lord of a planet is MORE important than
          the sign lord for determining that planet's results. "It is the star lord
          that matters most; the sign lord is secondary." KP explicitly deprioritizes
          sign-level dignity as a primary results indicator.
        resolution: >
          FUNDAMENTAL METHODOLOGICAL CONFLICT: Sign-primacy (Parashari) vs.
          Nakshatra-primacy (KP). This is not a qualification — it is a foundational
          difference in the hierarchy of analysis. Both frameworks are internally
          consistent; they produce different assessments for the same planetary
          placement. Apply each within its own system; never merge.
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.3.20.1, KP.1.ch1.intro.2]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 26: TAJAKA-SPECIFIC TOPICS (TC.163–TC.172)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.163
    topic: "Tajaka Sahams — special sensitive points in annual chart"
    pattern: ORTHOGONAL
    schools_addressing: [tajaka]
    note_on_other_schools: >
      Tajaka Sahams (also called "lots" — derived from Arabic/Persian astrology)
      are special sensitive points in the Varsha Kundali computed from two planet
      positions and the annual Lagna. The 50 Sahams include the Punya Saham (fortune),
      Rog Saham (disease), Mrityu Saham (death), Vivah Saham (marriage), etc. Each
      Saham's lord and its condition in the annual chart activates the relevant life
      area for that year. Sahams have no equivalent in BPHS, Jaimini, or KP natal
      astrology.
    rule_refs: [TAJAKA.ch9.v1.1, TAJAKA.ch9.v2.1]

  - topic_id: TC.164
    topic: "Tajaka Varshesh (year lord) — planet ruling the Varsha year"
    pattern: ORTHOGONAL
    schools_addressing: [tajaka]
    note_on_other_schools: >
      The Varshesh (year lord) in Tajaka is the planet that holds primary authority
      over the Varsha year; it is determined by specific Tajaka rules (the lord of
      the day and hora at the solar return moment, or alternatively the Hora lord
      at the exact solar return time per different commentators). The Varshesh's
      condition in the annual chart governs the year's overall quality. No equivalent
      annual governing planet concept in Parashari natal analysis, Jaimini Chara Dasha,
      or KP natal sub-lord system.
    rule_refs: [TAJAKA.ch5.v3.1, TAJAKA.ch5.v4.1]

  - topic_id: TC.165
    topic: "Tajaka Tri-Pataki chakra — three-sign transit indicator"
    pattern: ORTHOGONAL
    schools_addressing: [tajaka]
    note_on_other_schools: >
      The Tri-Pataki Chakra is a Tajaka sub-divisional framework that divides the
      annual chart's year into three 4-month periods, each governed by a different
      set of planets determined by specific annual chart positions. Events within
      each 4-month period are timed by the Tri-Pataki's planet and its Itthasala
      relationships. This is annual-chart-specific and has no equivalent in
      Parashari/Jaimini/KP natal or transit methods.
    rule_refs: [TAJAKA.ch6.v3.1]

  - topic_id: TC.166
    topic: "Tajaka Itthasala with Varsha Lagna lord — promise of the year"
    pattern: ORTHOGONAL
    schools_addressing: [tajaka]
    note_on_other_schools: >
      When the annual Lagna lord forms an Itthasala (applying aspect within moiety
      orbs) with a benefic planet in the Varsha Kundali, the matter signified by
      the benefic's house is promised for that year. This is a specific Tajaka
      annual chart rule: Itthasala between the annual Lagna lord and the 10th lord
      indicates career advancement that year; Lagna lord Itthasala with the 7th lord
      indicates marriage or significant partnership that year; etc. This is not
      comparable to Parashari transit or Vimshottari antardasha assessment for
      the same topics.
    rule_refs: [TAJAKA.ch4.v2.2, TAJAKA.ch7.v1.1]
    flag: C2

# ────────────────────────────────────────────────────────────────────────────
# SECTION 27: ADDITIONAL AGREEMENT ENTRIES — WIDELY SHARED PRINCIPLES (TC.167–TC.210)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.167
    topic: "Tithi (lunar day) — importance in muhurta and panchanga"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      The tithi (lunar day, 1/30th of the synodic month) is universally recognized
      as a key Panchanga component for muhurta and ritual timing. Full moon (Purnima)
      and new moon (Amavasya) tithis have special significance across all schools.
    qualifications: []
    conflicts: []
    rule_refs: [BPHS.65.2.1, KP.6.ch22.panchanga.1, TAJAKA.ch8.v2.1]

  - topic_id: TC.168
    topic: "Vara (weekday) — planetary lordship of days"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Weekday planetary lordship — Sun=Sunday, Moon=Monday, Mars=Tuesday,
      Mercury=Wednesday, Jupiter=Thursday, Venus=Friday, Saturn=Saturday —
      is universally accepted as a basic Panchanga component across all four schools.
    qualifications: []
    conflicts: []
    rule_refs: [BPHS.65.3.1, KP.6.ch22.panchanga.2, TAJAKA.ch8.v3.1]

  - topic_id: TC.169
    topic: "Ayanamsha (sidereal vs tropical zodiac) — Lahiri as standard"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      All four schools use the sidereal zodiac (not tropical). The Lahiri (Chitrapaksha)
      ayanamsha is the most widely used standard in Indian astrological practice and
      is officially recommended by the Government of India. All schools agree on
      using a sidereal zodiac.
    qualifications:
      - school: parashari
        note: >
          Multiple ayanamsha variants are used by different Parashari practitioners:
          Lahiri, Krishnamurti, Raman, Yukteshwar. The resulting chart positions
          can differ by up to 1–2° depending on ayanamsha, which can change nakshatra
          position and sub-lord assignments. No single ayanamsha is universally mandated
          in classical BPHS text itself (which pre-dates the ayanamsha controversy).
      - school: kp
        note: >
          KP uses the Krishnamurti Ayanamsha (slightly different from Lahiri) as the
          standard for KP analysis. Using Lahiri ayanamsha for KP analysis introduces
          systematic error in sub-lord assignments. This is a practically significant
          difference: KP requires KP ayanamsha for precise sub-lord computation.
      - school: jaimini
        note: >
          Jaimini (contemporary practitioners) typically uses Lahiri but some
          commentators (Rath school) use Lahiri; others use Fagan-Allen (tropical
          Jaimini is a minority view). Lahiri is the conventional standard.
    conflicts: []
    rule_refs: [BPHS.3.1.1, KP.1.ch1.ayanamsha.1, JAIMINI.1.1.1.2, TAJAKA.ch1.v3.1]

  - topic_id: TC.170
    topic: "Tropical vs. sidereal zodiac — KP ayanamsha vs. Lahiri"
    pattern: CONFLICT
    schools_addressing: [parashari, kp]
    core_agreement: null
    conflicts:
      - between: [parashari, kp]
        parashari_position: >
          Parashari standard: Lahiri ayanamsha (Chitrapaksha). The Lahiri ayanamsha
          is the predominant choice; planets' positions computed with Lahiri ayanamsha
          form the basis of BPHS-based chart analysis.
        kp_position: >
          KP standard: Krishnamurti ayanamsha (also called KP ayanamsha or KP1).
          KP ayanamsha differs from Lahiri by approximately 0°6' in recent decades.
          For sub-lord assignments, this ~6 arcminute difference can cause a planet
          to fall in a different sub, changing its house significations entirely.
          K.S. Krishnamurti's KP system requires KP ayanamsha for correctness; using
          Lahiri introduces systematic sub-lord assignment errors in KP analysis.
        resolution: >
          PRACTICAL CONFLICT: For Parashari analysis, use Lahiri. For KP analysis,
          use KP ayanamsha. For concurrent multi-school assessment, maintain separate
          planetary position tables for each system's ayanamsha. Never use a single
          ayanamsha for both Parashari and KP in the same multi-school analysis.
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.3.1.1, KP.1.ch1.ayanamsha.2]

  - topic_id: TC.171
    topic: "Hora (half-sign) — 2-degree subdivision for hourly rule"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      The hora (half-sign = 15° subdivision) of a planet or the rising hora at
      a given time is used in electional astrology (muhurta) and sometimes in natal
      assessment. Sun rules horae of odd signs (Aries, etc.); Moon rules horae of
      even signs (Taurus, etc.). Universally accepted as a Panchanga/muhurta element.
    qualifications: []
    conflicts: []
    rule_refs: [BPHS.6.1.2, KP.6.ch22.hora.1, TAJAKA.ch8.v4.1]

  - topic_id: TC.172
    topic: "Sarpa Dosha — affliction from snake-related karmas"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini]
    core_agreement: >
      Sarpa Dosha (also called Kalasarpa Dosha when all planets are hemmed between
      Rahu and Ketu) is recognized in Parashari and some Jaimini commentaries as a
      significant chart affliction associated with past-life karmas related to serpents,
      and causing challenges in current life.
    qualifications:
      - school: parashari
        note: >
          Kalasarpa Yoga: when all seven planets (Sun to Saturn) are on one side of
          the Rahu-Ketu axis. Two variants: Kalasarpa (all planets between Rahu and
          Ketu) and Kalamrita (all between Ketu and Rahu). Effects include intensity,
          karmic purpose, and possible delays followed by sudden rises.
      - school: jaimini
        note: >
          Jaimini commentators (Rath) note the Rahu-Ketu axis's significance for the
          native's karmic trajectory; Kalasarpa Yoga is sometimes assessed in Jaimini
          through the AK's relationship with Rahu/Ketu, though it is not a core
          Jaimini sutra concept.
    conflicts: []
    silent: [kp, tajaka]
    rule_refs: [BPHS.73.2.1, JAIMINI.1.1.5.5]
    flag: C6

  - topic_id: TC.173
    topic: "Balarishtha Yoga — early life challenges to survival"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Balarishtha (early childhood affliction) yogas indicate vulnerability to
      health challenges or mortality risk in early childhood. Multiple configurations
      in BPHS are listed; broadly recognized.
    qualifications:
      - school: parashari
        note: >
          Specific Balarishtha yogas: Moon in the 6th, 8th, or 12th with malefic
          aspects; Moon waning in Scorpio; multiple specific configurations in
          BPHS Ch. 73. Graha Balarishtha (planetary afflictions in early life)
          are time-specific to the first few years of life.
      - school: kp
        note: >
          KP: early health challenges assessed via 1st cusp sub-lord's signification
          of 6/8/12 during early life periods; Balarishtha as a formal yoga category
          is less central to KP methodology.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.73.3.1, KP.4.ch11.balarishtha.1]

  - topic_id: TC.174
    topic: "Vimshottari starting balance — remaining dasha at birth"
    pattern: AGREE
    schools_addressing: [parashari, kp]
    core_agreement: >
      The remaining balance of the current dasha at birth is calculated from the
      Moon's exact position within its nakshatra at birth (proportional to the
      nakshatra traversed). This calculation is identical in Parashari and KP —
      both derive it from the same Moon-nakshatra-balance formula.
    qualifications: []
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.46.2.1, KP.5.ch15.balance.1]

  - topic_id: TC.175
    topic: "Dasha of lagna lord — general importance"
    pattern: AGREE
    schools_addressing: [parashari, kp]
    core_agreement: >
      The Mahadasha of the lagna lord is always significant — it activates the
      1st house's health, self-expression, and overall life direction themes.
      Both Parashari and KP recognize the lagna lord's dasha as a milestone
      period in the native's life.
    qualifications:
      - school: kp
        note: >
          KP: the lagna lord's sub-lord connectivity governs what specifically
          manifests during the lagna lord's dasha; the activation of the 1st
          house is the background condition.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.47.1.2, KP.5.ch17.lagnaLord.1]

  - topic_id: TC.176
    topic: "Transit of planets over natal Moon sign — general sensitivity"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Transits of planets (especially Saturn and Jupiter) over the natal Moon sign
      are sensitive periods for the native. The natal Moon sign is the primary
      reference point for transit assessment in Parashari (Gochar) tradition.
      Broadly accepted across all systems.
    qualifications:
      - school: jaimini
        note: >
          Jaimini also uses transits of planets over the AK's sign and the running
          Chara Dasha sign as transit reference points; natal Moon sign transit is
          one of several active reference points.
      - school: kp
        note: >
          KP: transit significance is assessed via triple-significator logic; a planet
          transiting natal Moon sign must also be a triple-significator for the relevant
          event houses. Simple transit over Moon sign without sub-lord connectivity
          does not trigger events.
    conflicts: []
    rule_refs: [BPHS.48.1.1, KP.5.ch16.transit.1, JAIMINI.2.3.4.1, TAJAKA.ch7.v7.1]

  - topic_id: TC.177
    topic: "Lagnesh (lagna lord) — most important planet in the chart"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      The lord of the lagna (ascendant sign) — the Lagnesh — is the single most
      important planet for chart assessment. All four schools agree on this fundamental
      principle: the lagna lord's condition, strength, and significations are
      paramount in determining the native's life quality.
    qualifications:
      - school: jaimini
        note: >
          Jaimini adds the AK (Atmakaraka) as an equally important, or arguably
          superior, planet for soul-level assessment; in Jaimini's framework AK and
          Lagnesh are both primary, each governing different layers.
    conflicts: []
    rule_refs: [BPHS.34.1.2, JAIMINI.1.1.5.2, KP.1.ch2.lagnesh.1, TAJAKA.ch3.v1.2]

  - topic_id: TC.178
    topic: "11th house as fulfillment — all good things come from 11th"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      The 11th house is the house of fulfillment, gains, and all positive outcomes.
      Any desired result requires favorable 11th house support — income, success in
      undertakings, elder siblings, and the realization of desires. This principle
      is universally accepted across all four schools and is given particular
      prominence in KP's triple-significator method (11th must always be signified
      for a positive result).
    qualifications: []
    conflicts: []
    rule_refs: [BPHS.11.11.2, JAIMINI.1.3.13.1, KP.2.ch6.houses.11, TAJAKA.ch3.v3.6]

  - topic_id: TC.179
    topic: "Planetary combustion threshold — Sun as combustor"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      The Sun is the primary combustor — other planets within defined degree proximity
      to the Sun are considered combust and lose signification-delivery capacity.
      The principle that the Sun's proximity diminishes other planets' independent
      expression is universally accepted.
    qualifications:
      - school: parashari
        note: Specific degree thresholds per planet as listed in TC.099.
      - school: kp
        note: >
          KP: Mercury is the least affected by combustion (due to its naturally
          close orbital proximity to the Sun); Venus's retrograde combustion
          (within 8°) has a different quality from direct combustion (within 10°).
    conflicts: []
    rule_refs: [BPHS.3.45.1, KP.1.ch2.combustion.1, TAJAKA.ch2.v11.1]

  - topic_id: TC.180
    topic: "Rahu's behavior as Saturn-like (Parashari)"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Rahu behaves like Saturn in its natural significations (ambition, delay,
      foreign, unconventional, outcaste) in Parashari and KP traditions. This is
      an approximation used when Rahu has no specific association.
    qualifications:
      - school: parashari
        note: >
          "Rahu acts like Saturn" is a default: when Rahu is not conjoined any planet
          and its dispositor is not strongly modifying it, Rahu's results lean toward
          Saturnian themes. However, Rahu also has its own distinct significations
          (foreign lands, manipulation, maya, amplification) that transcend the
          Saturn analogy.
      - school: kp
        note: >
          KP: Rahu acts as an agent of its sign lord and conjoined planets first;
          the Saturn-like default applies when those associations are weak or absent.
          Rahu in Saturn's sign (Capricorn/Aquarius) is doubly Saturn-like.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.3.8.1, KP.1.ch1.rahu.1]
    flag: C6

  - topic_id: TC.181
    topic: "Ketu's behavior as Mars-like (Parashari)"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Ketu behaves like Mars in its natural significations (cutting, dissociation,
      spiritual fire, injury, surgery) in Parashari and KP traditions. This is
      the default when Ketu has no specific association.
    qualifications:
      - school: kp
        note: >
          KP: Ketu acts as agent of its sign lord and conjoined planets; Mars-like
          default applies in their absence. Ketu in Mars-ruled signs (Aries/Scorpio)
          is doubly Mars-like.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.3.9.1, KP.1.ch1.ketu.1]
    flag: C6

  - topic_id: TC.182
    topic: "Birth rectification — Moon nakshatra and lagna degree accuracy"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Birth time accuracy is critical for all chart-based systems; the lagna degree
      and Moon's nakshatra can change within minutes of birth time difference. All
      three schools acknowledge the importance of birth rectification.
    qualifications:
      - school: parashari
        note: >
          Parashari rectification uses life events mapped to dasha periods; the
          lagna degree rectified so that the dasha sequence matches major life events.
      - school: kp
        note: >
          KP rectification is particularly rigorous: the lagna degree and its sub-lord
          must be consistent with the native's health, marriage, and career outcomes.
          Even a 3–4 minute birth time error can change the sub-lord of the ascendant
          (especially when the lagna is near a sub division boundary).
      - school: jaimini
        note: >
          Jaimini rectification uses the Varnada Lagna and Chara Dasha events; the AK
          planet and its degree are cross-checked against life milestones.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.1.1.1, KP.1.ch1.rectification.1, JAIMINI.1.4.1.1]

  - topic_id: TC.183
    topic: "Panchanga — five limbs of the almanac"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      The Panchanga's five limbs — Tithi (lunar day), Vara (weekday), Nakshatra
      (lunar mansion), Yoga (planetary yoga), Karana (half-tithi) — are universally
      used across all four schools for muhurta selection, quality assessment of a
      given time, and sometimes for natal chart interpretation.
    qualifications:
      - school: kp
        note: >
          KP's primary muhurta method is the sub-lord of the ascendant at the elected
          time; Panchanga quality is a secondary confirmation layer, not the primary
          KP tool.
    conflicts: []
    rule_refs: [BPHS.65.1.1, KP.6.ch22.panchanga.3, TAJAKA.ch8.v2.1]

  - topic_id: TC.184
    topic: "Yoga (Panchanga) — 27 yoga divisions"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      The 27 Yogas (Sun+Moon longitudinal sum divided into 27 equal parts of 13°20')
      are universally used as a Panchanga component: Vishkumbha through Vaidhrti.
      Shubha (benefic) and Ashubha (malefic) yogas classified.
    qualifications: []
    conflicts: []
    rule_refs: [BPHS.65.4.1, KP.6.ch22.yoga.1, TAJAKA.ch8.v5.1]

  - topic_id: TC.185
    topic: "Dasha balance at birth — importance of accurate Moon degree"
    pattern: AGREE
    schools_addressing: [parashari, kp]
    core_agreement: >
      The dasha balance at birth (remaining dasha period) depends on the precise
      degree and minute of the Moon within its nakshatra. Both Parashari and KP
      use identical formulas for this calculation; agreement is complete and the
      formula is mathematically defined.
    qualifications: []
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.46.2.1, KP.5.ch15.balance.1]

  - topic_id: TC.186
    topic: "Divisional charts — Panchamsha (D5) for spiritual inclinations"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini]
    core_agreement: >
      The Panchamsha (D5, 5th harmonic) is used for spiritual inclinations,
      past-life deeds, and creative intelligence. Referenced in Parashari tradition
      and some Jaimini commentary.
    qualifications:
      - school: kp
        note: >
          KP does not systematically use the Panchamsha; divisional charts other
          than D9 (Navamsa) are rarely employed in strict KP methodology.
    conflicts: []
    silent: [kp, tajaka]
    rule_refs: [BPHS.6.5.1, JAIMINI.1.1.9.2]

  - topic_id: TC.187
    topic: "Saptamsha (D7) — children and progeny"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      The Saptamsha (D7, 7th harmonic) is used for children and grandchildren
      assessment — the D7 5th house (and its lord) provides detailed information
      about the native's progeny.
    qualifications:
      - school: kp
        note: KP: D7 is a secondary reference; primary children assessment via
          5th cusp sub-lord in the Rashi chart (Placidus).
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.6.7.1, JAIMINI.1.3.7.2, KP.1.ch4.divisional.7]

  - topic_id: TC.188
    topic: "Shodashamsha (D16) — vehicles and happiness"
    pattern: QUALIFY
    schools_addressing: [parashari]
    core_agreement: >
      The Shodashamsha (D16, 16th harmonic) is used for vehicles, conveyances,
      and happiness. A well-disposed D16 4th house indicates vehicle happiness.
    qualifications: []
    conflicts: []
    silent: [jaimini, kp, tajaka]
    rule_refs: [BPHS.6.16.1]

  - topic_id: TC.189
    topic: "Chaturvimshamsha (D24) — higher education and learning"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini]
    core_agreement: >
      The Chaturvimshamsha (D24, 24th harmonic) is used for higher learning,
      academic achievements, and spiritual knowledge. Mercury and Jupiter's
      condition in D24 are particularly important.
    qualifications: []
    conflicts: []
    silent: [kp, tajaka]
    rule_refs: [BPHS.6.24.1, JAIMINI.1.3.6.3]

  - topic_id: TC.190
    topic: "Trimshamsha (D30) — misfortune and evils"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini]
    core_agreement: >
      The Trimshamsha (D30, 30th harmonic) is used for misfortune, evils,
      diseases, and character defects. Malefics in D30 Lagna or 6th/8th/12th
      houses indicate karmic challenges. Used in both Parashari and some
      Jaimini traditions.
    qualifications: []
    conflicts: []
    silent: [kp, tajaka]
    rule_refs: [BPHS.6.30.1]

  - topic_id: TC.191
    topic: "Shashtiamsha (D60) — cumulative past-life karma"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini]
    core_agreement: >
      The Shashtiamsha (D60, 60th harmonic) is considered the most important
      divisional chart in some Parashari traditions — it captures the cumulative
      effect of past-life karma. Given its sensitivity (requires birth time accurate
      to ~30 seconds), it is used cautiously.
    qualifications:
      - school: parashari
        note: >
          D60 is extremely sensitive to birth time accuracy; even 1 minute of error
          can change the D60 lagna. Used mainly when birth time is confirmed to be
          precise; very important in advanced Parashari reading.
    conflicts: []
    silent: [kp, tajaka]
    rule_refs: [BPHS.6.60.1]

  - topic_id: TC.192
    topic: "Karaka bhaava naasha — significator in its own house destroys that house"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini]
    core_agreement: >
      The principle "Karaka bhava naasha" (the natural significator of a house,
      when placed in that house, tends to harm the matters of that house) is a
      well-known Parashari aphorism. Jupiter (natural children karaka) in 5th,
      Venus (natural spouse karaka) in 7th, and Moon (natural mother karaka)
      in 4th are examples.
    qualifications:
      - school: parashari
        note: >
          This principle applies in specific contexts: a strongly dignified natural
          karaka in its house can overcome the naasha; the principle is most active
          when the karaka is afflicted or weak. It is an important caveat to the
          rule "planet in its natural house is positive" — actually, there is a
          counterintuitive challenging quality.
      - school: jaimini
        note: >
          Jaimini's Chara Karaka system has its own version: when the Chara Karaka
          for a matter is in the same house as the matter it governs (e.g., DK in
          the 7th house), similar bhava naasha considerations apply within the
          Jaimini Karakamsha assessment.
      - school: kp
        note: >
          KP: This principle is noted as a background cautionary rule; the sub-lord
          connectivity determines whether the karaka's presence in its own house
          manifests as naasha or enhancement. A dignified natural karaka with a
          positive sub-lord in its own house does not necessarily cause naasha.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.10.2.1, JAIMINI.1.3.1.3, KP.4.ch12.karaka_naasha.1]
    flag: C1

  - topic_id: TC.193
    topic: "Paka Lagna — digested/processed ascendant (Jaimini)"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      Paka Lagna in Jaimini is the sign in which the lagna lord is placed.
      It represents how the lagna's energy is "processed" and expressed through
      the environment of the sign containing the lagna lord. Assessment of
      the Paka Lagna's strength and the planets aspecting it by rashi drishti
      adds a tertiary layer to Jaimini lagna analysis. No direct equivalent in
      BPHS/KP/Tajaka.
    rule_refs: [JAIMINI.1.2.3.1]
    flag: C1

  - topic_id: TC.194
    topic: "Gnatikaraka — karmic group family, cousins, conflicts"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C1] Jaimini's Gnatikaraka (6th-highest-degree planet in Chara scheme) governs
      karmic group (gnatika), cousins, rivals, competing forces, and extended family.
      The GK's condition and the 6th house from Karakamsha are assessed for conflict
      patterns. This is a Jaimini-specific karaka with no equivalent in the natural
      karaka system (BPHS), KP sub-lord significations, or Tajaka annual chart.
    rule_refs: [JAIMINI.1.1.5.6]
    flag: C1

  - topic_id: TC.195
    topic: "Bhratrukaraka — sibling soul-connection (Jaimini)"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C1] Jaimini's Bhratrukaraka (3rd-highest-degree planet) governs the soul's
      karmic connection with siblings. While Mars is the natural karaka for siblings
      in Parashari (and 3rd house governs siblings in all systems), Jaimini adds the
      Chara Bhratrukaraka as a specific soul-level indicator for sibling relationships.
      These are parallel indicators: Parashari Mars + 3rd house, Jaimini BK + 3rd from
      Karakamsha give complementary (not competing) information.
    rule_refs: [JAIMINI.1.1.5.3]
    flag: C1

  - topic_id: TC.196
    topic: "AK in navamsa — soul's primary area of challenge and focus"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C1] The AK's navamsa placement determines the Karakamsha (TC.093), which
      reveals the soul's primary karmic terrain. Additionally, the sign the AK
      falls in within the navamsa indicates the general area where the soul encounters
      its deepest challenges: AK in Cancer navamsa = emotional/family challenge; AK in
      Scorpio navamsa = occult/transformation challenge; etc. This navamsa-level AK
      reading is uniquely Jaimini; BPHS/KP/Tajaka do not have an AK-navamsa reading
      framework.
    rule_refs: [JAIMINI.1.3.2.2]
    flag: C1

  - topic_id: TC.197
    topic: "Tajaka Patyayini Dasha — annual sub-period system"
    pattern: ORTHOGONAL
    schools_addressing: [tajaka]
    note_on_other_schools: >
      [C5] Patyayini Dasha is an annual-chart-specific sub-period system in Tajaka
      based on point assignments to each planet in the annual chart. The planet with
      the most "Patyayini points" in a given period governs that portion of the year.
      This is entirely specific to the annual Varsha Kundali and has no natal-chart
      equivalent. Cannot be compared with Vimshottari antardasha (natal) or Jaimini
      Chara Dasha (sign-based natal).
    rule_refs: [TAJAKA.ch6.v4.1]
    flag: C5

  - topic_id: TC.198
    topic: "Shadbala minimum thresholds — planet-specific required strength"
    pattern: QUALIFY
    schools_addressing: [parashari]
    core_agreement: >
      Parashari Shadbala has minimum required strength thresholds (in virupas)
      for each planet: Sun ≥390, Moon ≥360, Mars ≥300, Mercury ≥420, Jupiter ≥390,
      Venus ≥330, Saturn ≥300. Planets meeting the threshold are "strong" and
      deliver their significations more fully.
    qualifications:
      - school: parashari
        note: >
          The threshold values vary slightly between BPHS editions and commentators.
          The relative comparison (a planet at 500 virupas is significantly stronger
          than one at 300) is more important than precise threshold adherence.
          Uttarabala (proportional strength above threshold) is the practical metric.
    conflicts: []
    silent: [jaimini, kp, tajaka]
    rule_refs: [BPHS.27.4.1]
    flag: C4

  - topic_id: TC.199
    topic: "Conditional Beneficence — Jupiter for Taurus/Libra Lagna"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      For Taurus and Libra lagnas, Jupiter (natural benefic) is considered a
      functional malefic because it lords the 8th house (Taurus: Jupiter lords 8th
      and 11th; Libra: Jupiter lords 3rd and 6th). The Kendradhipati-dosha and
      Trik-lordship considerations apply.
    qualifications:
      - school: parashari
        note: >
          Jupiter as 8th lord for Taurus Lagna: Jupiter's natural beneficence is
          partially negated. However, Jupiter also lords 11th (gains) for Taurus;
          mixed results. The overall assessment requires weighing both house lordships.
          Not a simple "Jupiter is malefic for Taurus" statement — it is contextual.
      - school: kp
        note: >
          KP: functional malefic status affects the sub-lord assessment quality;
          Jupiter's house connections for Taurus Lagna must be weighed case-by-case.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.34.3.1, KP.2.ch6.functional.2]

  - topic_id: TC.200
    topic: "Rahu/Ketu transit over natal ascendant — sensitivity period"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Rahu or Ketu transiting the natal ascendant degree is considered a sensitive
      and often transformative period. Both Parashari and KP recognize this
      as a significant transit trigger.
    qualifications:
      - school: parashari
        note: >
          Rahu transiting the natal Lagna: often associated with unusual events,
          increased ambition, health changes, or significant changes in life direction.
          Ketu transiting natal Lagna: detachment, spiritual turn, possible health
          vulnerability or loss of something previously valued.
      - school: kp
        note: >
          KP: the specific outcomes depend on Rahu/Ketu's nakshatra lord and the
          sub-lord of the natal ascendant cusp; the transit acts as a timing trigger
          only if triple-significator conditions are also met.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.48.8.1, KP.5.ch16.transit.rahu.1]
    flag: C6

  - topic_id: TC.201
    topic: "Navamsa chart — independent chart reading (second chart)"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini]
    core_agreement: >
      The Navamsa can be read as an independent chart (not just a divisional support
      to the Rashi) for the second half of life, soul's dharmic path, and the
      quality of spouse and spiritual development.
    qualifications:
      - school: parashari
        note: >
          Some Parashari traditions read the Navamsa ascendant as the second
          ascendant governing the second half of life; the navamsa becomes
          more dominant after age ~36-40.
      - school: jaimini
        note: >
          Jaimini's entire Karakamsha analysis uses the Navamsa as the primary
          chart for soul-level assessment — the Navamsa is not secondary to the
          Rashi in Jaimini, it is equally primary for AK/Karakamsha analysis.
    conflicts: []
    silent: [kp, tajaka]
    rule_refs: [BPHS.6.1.1, JAIMINI.1.3.1.1]

  - topic_id: TC.202
    topic: "Mandi and Gulika — shadow planets"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Mandi (also called Mandhi or Gulika's parent) and Gulika are upagrahas
      (sub-planets or shadow bodies) that carry malefic significance, particularly
      related to poison, hidden enemies, and karmic debts. Their positions are
      calculated by day and night formulas.
    qualifications:
      - school: parashari
        note: >
          Mandi is considered the son of Saturn and is placed in the chart based on
          day/night birth and the weekday. Gulika (offspring of Saturn by another
          calculation) similarly. In 6th, 8th, or 12th house, Mandi/Gulika intensify
          those houses' malefic qualities.
      - school: kp
        note: >
          KP: Mandi and Gulika are noted as supplementary factors; the primary KP
          methodology does not heavily feature these upagrahas. Their influence is
          acknowledged but not central to sub-lord connectivity analysis.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.4.5.1, KP.1.ch2.gulika.1]

  - topic_id: TC.203
    topic: "Hora Lagna vs. Ghati Lagna — wealth vs. power"
    pattern: ORTHOGONAL
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C1] Jaimini's Hora Lagna (TC.154) and Ghatika Lagna (TC.155) are two computed
      reference points used in parallel for wealth and power assessment respectively.
      Neither has an equivalent in BPHS natal chart analysis, KP sub-lord framework,
      or Tajaka annual chart system. Both are used within the Jaimini Rashi+Navamsa
      multi-chart system as additional ascendant reference points.
    rule_refs: [JAIMINI.2.4.2.1, JAIMINI.2.4.3.1]
    flag: C1

  - topic_id: TC.204
    topic: "Marriage — multiple marriages and second spouse"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Multiple marriages (or partnerships) are indicated when specific planetary
      configurations are present. All three schools recognize indicators for
      re-marriage or multiple partnerships.
    qualifications:
      - school: parashari
        note: >
          Multiple Venus associations (Venus aspected by/conjunct multiple planets),
          Venus in dual signs (Gemini, Sagittarius, Pisces), Mars or Saturn in 7th,
          Rahu in 7th — these indicators suggest more than one marriage.
      - school: jaimini
        note: >
          Multiple UL (Upapada Lagna) indicators: more than one planet in UL or
          strong DK getting multiple Chara Dasha activations for marriage houses.
          UL2 (second UL computation) specifically governs the second marriage.
      - school: kp
        note: >
          KP: 7th cusp sub-lord signifying 7th + (2nd or 11th) but also 11th alone
          could give second marriage; if 7th cusp sub-lord's signification includes
          2nd house for "dissolution + new bond" pattern, second marriage is possible.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.18.2.1, JAIMINI.1.3.9.3, KP.4.ch11.marriage2.1]

  - topic_id: TC.205
    topic: "Venus combust near Sun — delayed or absent marriage"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Venus combust (particularly when Venus is the 7th lord or natural karaka for
      marriage) in a birth chart is associated with delays or complications in marriage.
      Both systems recognize this.
    qualifications:
      - school: parashari
        note: >
          Venus combust in the 7th house or as 7th lord is particularly significant;
          additional malefic aspects or Saturn/Rahu placement with a combust Venus
          can further delay marriage. However, neecha-bhanga or Jupiter's aspect
          can mitigate.
      - school: kp
        note: >
          KP: Venus combust changes Venus's sub-lord effective connectivity; the
          7th cusp sub-lord governs marriage, not Venus directly. Venus combust
          is a weakening factor but not determinative if the 7th cusp sub-lord
          independently supports marriage.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.3.45.6, KP.1.ch2.combustion.venus.1]

  - topic_id: TC.206
    topic: "Shoola Dasha vs. Marak — adversity timing comparison"
    pattern: ORTHOGONAL
    schools_addressing: [parashari, jaimini]
    note_on_other_schools: >
      [C5] Jaimini's Shoola Dasha (TC.151) and Parashari's Marak planet dasha
      approach different timing methodologies for adversity and death-type events:
      (1) PARASHARI: Marak planets (lords of 2nd and 7th houses, and planets
          placed in or aspecting those houses) deliver death or near-death in their
          Vimshottari dasha/antardasha periods during vulnerable life phases.
      (2) JAIMINI: Shoola Dasha uses the 3rd/8th/12th sign sequence from lagna
          (and Moon/Sun) to time adversity — a sign-based system with different
          logic from the Vimshottari marak approach.
      Both approaches address the same life events (major health crises, near-death)
      through incompatible mechanisms; cross-system triangulation on the same adverse
      period strengthens prediction confidence.
    rule_refs: [BPHS.44.2.1, JAIMINI.2.3.1.1]
    flag: C5

  - topic_id: TC.207
    topic: "Drekkana (D3) for sibling health — detailed analysis"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini]
    core_agreement: >
      The D3 (Drekkana) chart is used for detailed analysis of siblings, particularly
      their health and longevity. The D3 lagna and 8th house condition reveal
      vulnerabilities for siblings.
    qualifications:
      - school: parashari
        note: >
          D3's 8th house and its lord reveal the sibling's longevity; malefics in
          D3's 8th indicate health challenges for siblings. D3 lagna lord's condition
          mirrors the sibling's overall life quality.
    conflicts: []
    silent: [kp, tajaka]
    rule_refs: [BPHS.6.3.1]

  - topic_id: TC.208
    topic: "Sudarshana Chakra — three-wheel chart reading"
    pattern: ORTHOGONAL
    schools_addressing: [parashari]
    note_on_other_schools: >
      The Sudarshana Chakra is a Parashari technique reading the chart from three
      ascendants simultaneously: the natal Lagna, the Moon sign, and the Sun sign
      — all three assessed as equal reference points for any house matter. This is
      a Parashari-specific multi-wheel technique; Jaimini adds the AK-based Karakamsha
      wheel but uses rashi drishti rather than the three-wheel Sudarshana approach;
      KP uses the sub-lord chain from each cusp; Tajaka uses the annual chart Lagna.
      None of the other three schools use the Sudarshana Chakra technique.
    rule_refs: [BPHS.12.1.1]

  - topic_id: TC.209
    topic: "Planetary friendship — compound/actual (tatva) maitri"
    pattern: AGREE
    schools_addressing: [parashari, kp]
    core_agreement: >
      Compound (actual/tatva) friendship = permanent friendship + temporary friendship.
      The four compound relationships: Great Friend (maha-mitra), Friend (mitra),
      Neutral (sama), Enemy (shatru), Great Enemy (maha-shatru). Both Parashari and
      KP use this compound friendship table as a final dignity modifier.
    qualifications: []
