# Concordance classes (v1.1 — see ConcordanceClass enum in concordance_writer.py):
#   agree               — all schools/ayanamshas produce the same conclusion
#   disagree            — contradictory conclusions (class-1 conflict)
#   qualify             — same conclusion with school-specific qualifications
#   orthogonal          — systems address different domains; not comparable
#   ayanamsha_dependent — conclusion changes with ayanamsha offset [NEW v1.1]

# C1–C7 flag index (embedded in relevant topic entries):
# C1: Karaka frameworks PARALLEL (not competing)
# C2: Aspect systems ORTHOGONAL
# C3: House cusp convention SYSTEM-DEFINING (→ ORTHOGONAL for house system itself)
#     Sub-classes TC.C3.SIGN_BOUNDARY / TC.C3.NAKSHATRA_BOUNDARY / TC.C3.DASHA_LORD
#     reclassified as AYANAMSHA_DEPENDENT in concordance_ayanamsha_flags [v1.1]
# C4: Strength systems NON-COMPARABLE
# C5: Timing systems NON-COMPARABLE
# C6: Rahu/Ketu treatment diverges per system
# C7: Retrograde — BPHS vs KP = CONFLICT

# ────────────────────────────────────────────────────────────────────────────
# SECTION 1: PLANETARY DIGNITIES — EXALTATION (TC.001–TC.009)
# ────────────────────────────────────────────────────────────────────────────

topics:

  - topic_id: TC.001
    topic: "Planetary exaltation — Sun"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Sun exalted in Aries at 10° (deepest exaltation point). All four schools
      accept this as a dignity factor elevating Sun's strength and benefic capacity.
    qualifications:
      - school: kp
        note: >
          KP treats exaltation as one input to the sub-lord connectivity assessment;
          exaltation alone does not guarantee fructification — the sub-lord must
          signify the relevant houses.
      - school: jaimini
        note: >
          Jaimini uses exaltation to weight the Atmakaraka's significations; an
          exalted AK strengthens the soul's dharmic trajectory.
      - school: tajaka
        note: >
          In the annual chart, Sun exalted in the Varsha Kundali is weighted as
          a fortifying factor; exaltation in the natal chart is noted but the
          annual placement governs the year's results.
    conflicts: []
    rule_refs: [BPHS.3.21.1, JAIMINI.1.1.5.1, KP.1.ch3.dignity.1, TAJAKA.ch2.v5.1]

  - topic_id: TC.002
    topic: "Planetary exaltation — Moon"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Moon exalted in Taurus at 3°. All schools accept this; full exaltation
      bestows strong, calm, benefic Moon results.
    qualifications:
      - school: parashari
        note: >
          Waxing Moon (Shukla paksha) additionally classified benefic; exaltation
          amplifies this. Waning Moon in exaltation still exalted but less
          benefic by paksha-bala.
      - school: kp
        note: >
          KP: exalted Moon's sub-lord governs whether maternal/mental matters
          signified by Moon fructify; exaltation is a supporting factor only.
    conflicts: []
    rule_refs: [BPHS.3.21.2, KP.1.ch3.dignity.2, TAJAKA.ch2.v5.2]

  - topic_id: TC.003
    topic: "Planetary exaltation — Mars"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Mars exalted in Capricorn at 28°. All schools accept; exalted Mars gives
      disciplined, structured expression of Martian energy.
    qualifications:
      - school: kp
        note: KP sub-lord filter applies; exaltation enhances signification delivery.
    conflicts: []
    rule_refs: [BPHS.3.21.3, KP.1.ch3.dignity.3, TAJAKA.ch2.v5.3]

  - topic_id: TC.004
    topic: "Planetary exaltation — Mercury"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Mercury exalted in Virgo at 15°. Own-sign Virgo + exaltation makes this
      a particularly strong placement across all systems.
    qualifications:
      - school: parashari
        note: >
          Mercury in own-sign Virgo is also exalted — this dual dignity (sign + exaltation)
          is noted as exceptionally strong; Mercury's exaltation point falls within its
          own sign (unique among grahas).
    conflicts: []
    rule_refs: [BPHS.3.21.4, KP.1.ch3.dignity.4, TAJAKA.ch2.v5.4]

  - topic_id: TC.005
    topic: "Planetary exaltation — Jupiter"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Jupiter exalted in Cancer at 5°. All schools accept; exalted Jupiter
      bestows maximum benefic results related to wisdom, dharma, wealth.
    qualifications: []
    conflicts: []
    rule_refs: [BPHS.3.21.5, KP.1.ch3.dignity.5, TAJAKA.ch2.v5.5]

  - topic_id: TC.006
    topic: "Planetary exaltation — Venus"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Venus exalted in Pisces at 27°. All schools accept; exalted Venus gives
      refined, spiritual, and materially comfortable results.
    qualifications:
      - school: tajaka
        note: >
          In the annual chart context, Venus exalted in Varsha Kundali especially
          benefits the 7th-house (partner) matters for that year.
    conflicts: []
    rule_refs: [BPHS.3.21.6, KP.1.ch3.dignity.6, TAJAKA.ch2.v5.6]

  - topic_id: TC.007
    topic: "Planetary exaltation — Saturn"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Saturn exalted in Libra at 20°. All schools accept; exalted Saturn gives
      justice, fairness, and disciplined long-term results.
    qualifications:
      - school: parashari
        note: >
          Vargottama + exaltation is noted as doubly powerful; exalted Saturn
          in Libra is one of the most stable Saturn placements.
    conflicts: []
    rule_refs: [BPHS.3.21.7, KP.1.ch3.dignity.7, TAJAKA.ch2.v5.7]

  - topic_id: TC.008
    topic: "Planetary exaltation — Rahu"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Rahu's exaltation sign is debated. Most BPHS commentaries place exaltation
      in Taurus or Gemini. KP accepts a functional exaltation in Gemini.
      Tajaka does not address Rahu exaltation systematically.
    qualifications:
      - school: parashari
        note: >
          Multiple BPHS commentaries disagree: Taurus (Mantreswara in Phaladeepika),
          Gemini (some BPHS manuscript variants), Virgo (minority view). No single
          exaltation point is universally accepted for Rahu.
      - school: kp
        note: >
          KP uses Rahu's signification through the stellium it occupies; formal
          exaltation point is less emphasized than sub-lord connectivity.
      - school: jaimini
        note: >
          Jaimini treats Rahu as a potential 8th karaka (Pitrukaraka in the 8-karaka
          scheme per Rath); formal exaltation of Rahu is not a Jaimini primary concern.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.3.22.1, KP.1.ch3.rahu.1]
    flag: C6

  - topic_id: TC.009
    topic: "Planetary exaltation — Ketu"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Ketu's exaltation in Scorpio or Sagittarius is debated. Ketu is not assigned
      a formal exaltation in most classical texts; the assignment is interpolated.
    qualifications:
      - school: parashari
        note: >
          Some BPHS editions assign Ketu exaltation in Scorpio (as Rahu's opposite
          axis from Taurus), others in Sagittarius. No textual consensus.
      - school: kp
        note: >
          KP uses Ketu as a moksha-karaka and its significations through nakshatra
          lordship; formal exaltation point rarely employed.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.3.22.2, KP.1.ch3.ketu.1]
    flag: C6

# ────────────────────────────────────────────────────────────────────────────
# SECTION 2: PLANETARY DEBILITATION (TC.010–TC.018)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.010
    topic: "Planetary debilitation — Sun"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Sun debilitated in Libra at 10°. All schools agree debilitation weakens
      the planet's positive significations; results tend toward the negative
      expression of Sun's domains (ego issues, authority conflicts, health of heart).
    qualifications:
      - school: parashari
        note: >
          Neecha-bhanga (cancellation of debilitation) applies if the dispositor
          of debilitation (Venus for Sun in Libra) is in a kendra from lagna or Moon,
          or if the exaltation lord (Mars) aspects the debilitated Sun. Neecha-bhanga
          converts debilitation into a potentially powerful yoga.
      - school: kp
        note: >
          Debilitation is a weakening factor in sub-lord assessment; debilitated
          Sun's sub-lord governs whether the weakening manifests fully or is mitigated.
    conflicts: []
    rule_refs: [BPHS.3.21.1, KP.1.ch3.dignity.1, TAJAKA.ch2.v6.1]

  - topic_id: TC.011
    topic: "Neecha-bhanga raja yoga (cancellation of debilitation)"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Cancellation of debilitation (neecha-bhanga) is recognized — a debilitated
      planet's weakness can be negated, converting it into strength.
    qualifications:
      - school: parashari
        note: >
          Multiple cancellation conditions: dispositor of debilitation sign in kendra
          from lagna or Moon; exaltation lord of the debilitated planet in kendra from
          lagna or Moon; debilitated planet conjoined its exaltation lord; debilitated
          planet aspected by its exaltation lord. When two or more conditions co-occur,
          neecha-bhanga becomes a raja yoga.
      - school: kp
        note: >
          KP does not formally use neecha-bhanga as a yoga construct; debilitation's
          sub-lord connectivity and house significations govern the actual outcome.
          Neecha-bhanga conditions are noted but not elevated to yoga status.
      - school: jaimini
        note: >
          Jaimini uses the Karakamsha and AK sign/house position as the primary
          assessment framework; neecha-bhanga is implicitly recognized but not
          systematically enumerated in sutras.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.26.1.1, KP.2.ch8.dignity.1, JAIMINI.1.3.1.1]

  - topic_id: TC.012
    topic: "Planetary own-sign (Swakshetra) dignity"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      A planet placed in its own sign is strongly dignified (swakshetra). All
      schools accept own-sign as conferring stability and full expression of the
      planet's natural significations. Each planet has one or two own signs.
    qualifications:
      - school: kp
        note: >
          KP: own-sign is a positive dignity factor in sub-lord assessment;
          sub-lord signification chain still governs final fructification.
      - school: tajaka
        note: >
          Annual chart: own-sign planet in Varsha Kundali is a strong annual indicator
          for that planet's domains; natal own-sign is noted as background context.
    conflicts: []
    rule_refs: [BPHS.3.20.1, JAIMINI.1.1.7.1, KP.1.ch3.dignity.8, TAJAKA.ch2.v7.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 3: PLANETARY NATURAL SIGNIFICATIONS (NAISARGIKA KARAKATWA)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.013
    topic: "Natural significator (karaka) of self, soul, father — Sun"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Sun is the natural karaka for soul (atma), father, authority, government,
      vitality, and the right eye. All four schools accept this attribution.
    qualifications:
      - school: jaimini
        note: >
          [C1 flag] Jaimini adds the Chara Karaka layer: the Atmakaraka (AK) — the
          planet with highest degree — ALSO represents the soul and overrides the
          natural karaka Sun for soul assessment in Jaimini method. These are parallel
          assessments, not contradictions.
    conflicts: []
    rule_refs: [BPHS.10.1.1, JAIMINI.1.1.5.1, KP.2.ch5.karaka.1, TAJAKA.ch3.v2.1]
    flag: C1

  - topic_id: TC.014
    topic: "Natural significator — Moon (mind, mother, emotions)"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Moon is the natural karaka for mind (manas), mother, emotions, public,
      left eye, fluids, and milk. All schools agree.
    qualifications:
      - school: jaimini
        note: >
          [C1] Jaimini's Matrukaraka (4th-highest-degree planet) is the specific
          karaka for mother in the Chara scheme — runs parallel to Moon's natural
          karaka status, not replacing it.
    conflicts: []
    rule_refs: [BPHS.10.1.2, JAIMINI.1.1.5.1, KP.2.ch5.karaka.2]
    flag: C1

  - topic_id: TC.015
    topic: "Karaka frameworks — PARALLEL assessment axes (C1)"
    pattern: ORTHOGONAL
    schools_addressing: [parashari, jaimini, kp, tajaka]
    c1_flag: true
    note_on_frameworks: >
      [C1 — ORTHOGONAL] Three distinct karaka frameworks operate in parallel and
      must never be flattened or merged:
      (1) PARASHARI natural karakas (naisargika karakatwa): fixed attributions —
          Sun=soul/father, Moon=mind/mother, Mars=brothers, Mercury=intellect,
          Jupiter=children/husband, Venus=wife/conveyance, Saturn=servants/longevity.
      (2) JAIMINI Chara karakas: dynamic, degree-based assignment each chart —
          AK=soul, AmK=career/ambition, BK=siblings, MK=mother, PK=children,
          GK=relations, DK=spouse (7 or 8 scheme). These override natal natural
          karakas for soul-dharma assessment within Jaimini method.
      (3) KP stellar karakas: planets as significators determined by house lordship
          and nakshatra/sub-lord occupancy — each planet signifies houses it lords
          and occupies, and the houses of its star lord. Completely different axis.
      Using all three in parallel gives a multi-dimensional read of a planet's
      signification. They are never merged or weighted against each other.
    rule_refs: [BPHS.10.1.1, JAIMINI.1.1.5.1, KP.1.ch2.significators.1]
    flag: C1

  - topic_id: TC.016
    topic: "Natural significator — Mars (siblings, courage, land)"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Mars is natural karaka for brothers/siblings, courage, land/real estate,
      weapons, surgery, energy, and accidents. Accepted across all schools.
    qualifications:
      - school: jaimini
        note: "[C1] Jaimini Bhratrukaraka (3rd-highest-degree planet) covers siblings; parallel to Mars's natural karaka role."
    conflicts: []
    rule_refs: [BPHS.10.1.3, JAIMINI.1.1.5.1, KP.2.ch5.karaka.3]
    flag: C1

  - topic_id: TC.017
    topic: "Natural significator — Jupiter (children, wisdom, guru)"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Jupiter is natural karaka for children, husband (in female charts), wisdom,
      dharma, guru, treasury, and liver. All schools accept.
    qualifications:
      - school: jaimini
        note: "[C1] Putrakaraka (5th-highest-degree planet) is Jaimini's children karaka — parallel axis."
      - school: kp
        note: >
          KP uses Jupiter as significator of houses it lords and occupies in the
          natal/annual chart; natural karaka meaning is secondary to house signification.
    conflicts: []
    rule_refs: [BPHS.10.1.5, JAIMINI.1.1.5.1, KP.2.ch5.karaka.5]
    flag: C1

  - topic_id: TC.018
    topic: "Natural significator — Venus (spouse, luxury, arts)"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Venus is natural karaka for wife/partner (male charts), conveyance, luxury,
      arts, beauty, and semen. All schools accept.
    qualifications:
      - school: jaimini
        note: "[C1] Darakaraka (lowest-degree planet) is Jaimini's spouse karaka — parallel axis."
    conflicts: []
    rule_refs: [BPHS.10.1.6, JAIMINI.1.1.5.1, KP.2.ch5.karaka.6]
    flag: C1

