    c7_flag: true
    core_agreement: null
    conflicts:
      - between: [parashari, kp]
        parashari_position: >
          BPHS (Ch.3 and various): A retrograde planet is like an exalted planet —
          it gives stronger results; it acts as if in its exaltation sign regardless
          of its actual sign placement. Additionally, Shadbala's Cheshta Bala
          component grants maximum motional strength to retrograde planets.
          The consensus in Parashari tradition (supported by BPHS text): retrogression
          = increased signification strength.
        kp_position: >
          KP (K.S. Krishnamurti, Reader Vol.1): A retrograde planet is assigned to
