  - topic_id: TC.019
    topic: "House 1 (Lagna / Ascendant) — core significations"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      House 1 signifies self, body, health, appearance, personality, vitality,
      and the overall life trajectory. All four schools agree on these fundamental
      1st-house themes.
    qualifications:
      - school: kp
        note: >
          [C3 flag] KP uses Placidus cusps; the 1st-house cusp (KP ascendant)
          may differ by several degrees from the Parashari Sripati or equal-house
          ascendant. The cusp's sub-lord determines whether 1st-house matters
          (health, self) are activated or suppressed.
      - school: tajaka
        note: >
          [C3] Varsha Lagna (annual ascendant) governs the year's trajectory;
          annual 1st-house lord's condition is the primary annual indicator for
          the native's health and self-expression that year.
    conflicts: []
    rule_refs: [BPHS.11.1.1, JAIMINI.1.2.1.1, KP.2.ch6.houses.1, TAJAKA.ch3.v1.1]
