    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Sasa yoga: Saturn in Kendra in Capricorn/Aquarius/Libra (own or exaltation).
      Results: leadership over large masses (servants, workers, discipline-related
      organizations), disciplined life, sometimes austere.
    qualifications:
      - school: parashari
        note: >
          Sasa yoga often found in political leaders and those who manage large
          workforces; the austerity implied can also manifest as lack of emotional
          warmth; spiritual practice is common.
      - school: kp
        note: KP: yoga is background; sub-lord connectivity determines fructification.
