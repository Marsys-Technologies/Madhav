# ── House cusp system note (C3) ──────────────────────────────────────────────

  - topic_id: TC.031
    topic: "House cusp convention — SYSTEM-DEFINING (C3)"
    pattern: ORTHOGONAL
    schools_addressing: [parashari, jaimini, kp, tajaka]
    c3_flag: true
    note_on_frameworks: >
      [C3 — ORTHOGONAL] House cusp conventions are system-defining and not
      interchangeable:
      (1) PARASHARI: Equal-house or Sripati house system commonly used.
          Equal-house assigns each house exactly 30°; Sripati is a variant.
          The ascendant = 1st-house lord's degree; each house begins at that
          same degree in the next sign (equal-house).
      (2) JAIMINI: Rashi (sign-based) houses — each sign = one house.
          The sign containing the ascendant is the 1st house; every complete
          sign thereafter is a house. No inter-sign cusps.
      (3) KP: Placidus house system exclusively. Cusps can fall in any degree
          of the sign and are NOT sign-boundaries. The sub-lord of a cusp
          (Placidus cusp degree within the KP subdivision scheme) is the
          primary determinant of house activation — not the sign or sign lord.
      (4) TAJAKA: Annual chart uses the Varsha Lagna rising at solar return;
          house division follows the same system as natal (Parashari convention
          typically), but the annual ascendant governs annual house activations.
      These four conventions produce different house boundaries for the same
      birth data. Results assessed within each system must not be merged or
      translated across systems without explicit cusp-system acknowledgment.
    rule_refs: [BPHS.4.1.1, JAIMINI.1.1.1.1, KP.1.ch1.intro.1, TAJAKA.ch1.v2.1]
    flag: C3

# ────────────────────────────────────────────────────────────────────────────
# SECTION 5: PLANET-IN-HOUSE RESULTS — SELECT ENTRIES (TC.032–TC.041)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.032
    topic: "Sun in 1st house — general results"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Sun in 1st house generally gives a strong, authoritative personality,
      leadership qualities, and prominent self-expression. Beneficial when
      Sun is well-placed (exalted, own sign, or strong by aspect).
    qualifications:
      - school: parashari
        note: >
          Sun in 1st gives reddish complexion, bilious constitution, early hair
          loss, strong ego. Benefic Sun in 1st from a powerful lagna gives
          authority and government favor; afflicted Sun (conjunct malefics, or
          debilitated) gives ego problems, health issues.
      - school: kp
        note: >
          Results governed by Sun's sub-lord and its house significations; Sun
          in 1st must have its sub-lord signifying beneficial houses (1/5/9/11)
          for health and self-advancement to materialize.
    conflicts: []
    rule_refs: [BPHS.33.1.1, KP.3.ch10.sun.1]

  - topic_id: TC.033
    topic: "Saturn in 1st house — general results"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Saturn in 1st house generally indicates a lean/thin body, disciplined
      nature, possible delays in life matters, and longevity. Agreement on
      lean physique and disciplined quality.
    qualifications:
      - school: parashari
        note: >
          Saturn in 1st is considered a complex placement: delays in marriage
          and career; potential Sade Sati effects if Saturn is in own or exaltation
          sign, somewhat mitigated. Gives perseverance. Can indicate orphan-hood
          or estrangement from father.
      - school: kp
        note: >
          Saturn in 1st cusp sub if Saturn sub-lord signifies 1/5/9/11, results
          can be positive for career despite delays; signification of 6/8/12
          increases health challenges.
      - school: tajaka
        note: >
          Saturn in annual 1st house is a cautionary indicator; Varshaphal Saturn
          in 1st often coincides with a year of restraint, health concerns, or
          additional responsibilities.
    conflicts: []
    rule_refs: [BPHS.33.7.1, KP.3.ch10.saturn.1, TAJAKA.ch5.v4.1]

  - topic_id: TC.034
    topic: "Jupiter in 1st house — general results"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Jupiter in 1st house is universally considered a highly benefic placement:
      wisdom, wealth, good health, ethical conduct, and spiritual inclination.
      Hamsa yoga (if in Kendra in own/exalted sign) is associated.
    qualifications:
      - school: kp
        note: >
          KP: Jupiter in 1st cusp sub governed by Jupiter's sub-lord; if sub-lord
          signifies 6/8/12, health and self-image may still be compromised despite
          Jupiter's natural beneficence.
    conflicts: []
    rule_refs: [BPHS.33.5.1, KP.3.ch10.jupiter.1]

  - topic_id: TC.035
    topic: "Venus in 7th house — marriage results"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Venus in 7th house is a classic indicator for an attractive, cultured,
      or pleasure-loving spouse. Generally positive for marriage prospects.
    qualifications:
      - school: parashari
        note: >
          Venus in 7th in own sign (Taurus/Libra) or exaltation (Pisces) is
          especially strong for marriage happiness. Venus in 7th but conjunct
          malefics (Rahu, Saturn) may bring troubles in marriage despite
          early promise.
      - school: jaimini
        note: >
          Jaimini assesses Darakaraka (DK) and Upapada Lagna (UL) for marriage
          quality; Venus in 7th from natal lagna is noted but the UL lord's
          condition is the primary marriage indicator.
      - school: kp
        note: >
          Venus in 7th — sub-lord of 7th cusp governs whether marriage happens;
          Venus here as occupant strengthens 7th-house significations only if
          its sub-lord connects 7th with 2nd/11th (marriage) vs 6th/10th/12th
          (separation/divorce).
    conflicts: []
    rule_refs: [BPHS.33.6.7.1, JAIMINI.1.3.9.1, KP.3.ch10.venus.7.1]

  - topic_id: TC.036
    topic: "Rahu in 12th house — results"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Rahu in 12th house is associated with foreign travel, expenditure, spiritual
      seeking, and sometimes unusual or hidden expenses. Broadly recognized across
      systems with important per-system qualifications.
    qualifications:
      - school: parashari
        note: >
          Rahu in 12th can indicate foreign residence, hospital/prison confinement,
          and moksha-oriented tendencies in spiritually advanced charts. Also possible:
          eye ailments, hidden enemies. Results depend heavily on dispositor.
      - school: jaimini
        note: >
          Rahu in 12th from Karakamsha is a significant moksha indicator in Jaimini;
          Ketu in 12th from Karakamsha is even stronger for moksha/liberation.
      - school: kp
        note: >
          KP: Rahu in 12th acts as agent of whatever houses it signifies through
          its nakshatra lord; if sub-lord signifies 3rd (short journeys) + 12th
          (foreign lands), foreign relocation is indicated.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.33.8.12.1, JAIMINI.1.3.14.1, KP.3.ch10.rahu.12.1]
    flag: C6

