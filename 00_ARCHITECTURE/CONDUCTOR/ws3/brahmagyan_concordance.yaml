    rule_refs: [BPHS.3.61.1, KP.1.ch2.friendship.3]

  - topic_id: TC.210
    topic: "Muhurta — avoidance of Rahu Kalam"
    pattern: AGREE
    schools_addressing: [parashari, jaimini, kp, tajaka]
    core_agreement: >
      Rahu Kalam (the daily period governed by Rahu, approximately 1.5 hours per day
      at specific weekday-dependent times) is widely recognized across all four school
      traditions as an inauspicious period to begin important undertakings. Starting
      new ventures, marriages, surgeries, or journeys during Rahu Kalam is generally
      avoided.
    qualifications:
      - school: kp
        note: >
          KP: Rahu Kalam is recognized as part of the Panchanga assessment for
          muhurta; however, KP's primary muhurta method (sub-lord of elected lagna)
          takes precedence over simple Rahu Kalam avoidance.
    conflicts: []
