          the planet's effective sub changes. There is NO dignity implication
          (no "exalted-like" interpretation); the planet simply signifies different
          houses than its apparent degree suggests. This is a stellar-positional
          adjustment, not a strength enhancement.
        resolution: >
          CONFLICT: Not a qualification — these are genuinely contradictory.
          Parashari says retrograde = stronger/exalted-like (dignity + motional strength).
          KP says retrograde = previous sub (positional correction only, no dignity).
          Resolution method: apply each system's rule within its own framework;
          flag all retrograde planet assessments with which system's retrograde
          rule is being applied. Never blend these interpretations.
