    rule_refs: [BPHS.36.3.1, KP.4.ch12.yoga.3]

  - topic_id: TC.046
    topic: "Raja Yoga — 9th and 10th lord conjunction/mutual aspect"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      A conjunction or mutual aspect between the lords of 9th (fortune, dharma)
      and 10th (career, action) produces a potent Raja Yoga — conferring high
      status, authority, and career success. Widely recognized.
    qualifications:
      - school: parashari
        note: >
          Parashari recognizes multiple Raja Yoga varieties; the 9th/10th lord
          combination is among the most powerful. Requires planets to be in good
          dignity (not debilitated or combust) to deliver the yoga's full promise.
      - school: kp
        note: >
          KP: the yoga's promise is recognized as a background condition; the
          sub-lord of the 10th cusp and the dasha/antardasha of the yoga-forming
          planets together determine when and how much success materializes.
      - school: jaimini
        note: >
          Jaimini assesses Amatyakaraka (career) and its relationship with AK and
          the 10th from Karakamsha for career elevation; the natal 9/10 lord
          conjunction is a secondary indicator within Jaimini's framework.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.40.1.1, JAIMINI.1.3.12.1, KP.4.ch13.yoga.1]

  - topic_id: TC.047
    topic: "Dhana Yoga — 2nd and 11th lord conjunction"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Conjunction of 2nd (wealth accumulation) and 11th (gains) lords is a Dhana
      Yoga — indicating wealth accumulation and financial prosperity. Broadly recognized.
    qualifications:
      - school: parashari
        note: >
          Multiple dhana yoga forms recognized: 2nd/11th lord conjunction, exchange,
          mutual aspect; lagna lord + 2nd/11th lord combinations further strengthen
          the yoga. Requires freedom from heavy malefic affliction to deliver wealth.
      - school: kp
        note: >
          KP: 2nd and 11th cusp sub-lords must signify 2nd/11th for wealth to flow;
          dasha/antardasha of yoga-forming planets activates the promise. Yoga
          existence guarantees potential, not actualization.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.41.1.1, KP.4.ch14.yoga.1]

  - topic_id: TC.048
    topic: "Gajakesari Yoga — Jupiter in kendra from Moon"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Gajakesari yoga: Jupiter in 1st, 4th, 7th, or 10th from Moon. Results:
      wisdom, wealth, fame, respected by authorities. Very widely cited yoga.
    qualifications:
      - school: parashari
        note: >
          Quality depends heavily on Moon's and Jupiter's strength; combust or
          debilitated Jupiter weakens or nullifies the yoga. Kendra from Moon
          (not just from lagna) is the requirement.
      - school: kp
        note: >
          KP: Gajakesari is a background indicator; sub-lord connectivity governs
          actual results. Many charts have this yoga without prominent manifestation;
          sub-lord support is essential.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.37.1.1, KP.4.ch12.yoga.6]

  - topic_id: TC.049
    topic: "Kemadruma Yoga — no planets adjacent to Moon"
    pattern: QUALIFY
    schools_addressing: [parashari, jaimini, kp]
    core_agreement: >
      Kemadruma yoga: no planets in 2nd or 12th from Moon (excluding Sun). Indicates
      poverty, mental loneliness, struggle, and possible misfortune. Widely cited.
    qualifications:
      - school: parashari
        note: >
          Multiple cancellation conditions for Kemadruma: exalted planet in kendra
          from lagna, Moon in kendra from lagna, full Moon, etc. Cancellation converts
          Kemadruma into less damaging or even auspicious results.
      - school: kp
        note: >
          KP: Kemadruma is a background indicator; sub-lord of Moon's cusp
          and Moon's own sub-lord govern mental manifestation; the yoga
          may be present without full materialization.
    conflicts: []
    silent: [tajaka]
    rule_refs: [BPHS.37.2.1, KP.4.ch12.yoga.7]

  - topic_id: TC.050
    topic: "Viparita Raja Yoga — 6th/8th/12th lord in 6th/8th/12th"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Viparita Raja Yoga: lords of trik houses (6/8/12) placed in other trik
      houses. Converts suffering into power; unexpected rise from fall; survival
      through adversity. Parashari and KP both recognize the principle.
    qualifications:
      - school: parashari
        note: >
          The yoga is formed when the trik lord is in a trik house without the
          lagna lord or other strong benefics. Most powerful form: 8th lord in 12th
          (Sarala), 12th lord in 6th/8th (Vimala). Timing through dashas.
      - school: kp
        note: >
          KP recognizes trik-lord placements as potentially limiting the damage
          of those houses; formal Viparita Raja Yoga as a yoga class is less
          emphasized; sub-lord connectivity governs outcomes.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.38.1.1, KP.4.ch13.yoga.2]

  - topic_id: TC.051
    topic: "Graha Yuddha (Planetary War)"
    pattern: QUALIFY
    schools_addressing: [parashari, kp]
    core_agreement: >
      Graha Yuddha (planetary war) occurs when two planets (excluding Sun and Moon)
      are within 1° of each other. The planet with lower degree "wins" and the other
      "loses" (loses some strength/benefic capacity). Recognized in Parashari and KP.
    qualifications:
      - school: parashari
        note: >
          The winning planet gains strength; losing planet is weakened and may give
          inauspicious results for its natural and house significations.
          Mars/Saturn war is considered most destructive.
      - school: kp
        note: >
          KP: planetary war is noted as a modifying factor; the sub-lord system's
          strength assessment incorporates proximity (within 1°) as a weakening
          condition for the "loser." Formal planetary war rules from BPHS are
          referenced but KP Reader does not extensively elaborate.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.3.58.1, KP.1.ch2.graha_war.1]

# ────────────────────────────────────────────────────────────────────────────
# SECTION 7: ASPECT SYSTEMS — ORTHOGONAL (C2) (TC.052–TC.066)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.052
    topic: "Aspect systems — ORTHOGONAL meta-entry (C2)"
    pattern: ORTHOGONAL
    schools_addressing: [parashari, jaimini, kp, tajaka]
    c2_flag: true
    note_on_frameworks: >
      [C2 — ORTHOGONAL] The four schools use fundamentally incompatible aspect
      systems. These are not variations of the same concept but entirely different
      mechanisms that cannot be merged:
      (1) PARASHARI graha drishti: orb-based, angular aspects from the planet's
          position. All planets aspect the 7th house/sign from themselves (full
          aspect, 180°). Saturn additionally aspects 3rd and 10th from itself
          (3/4 strength). Jupiter additionally aspects 5th and 9th (3/4 strength).
          Mars additionally aspects 4th and 8th (3/4 strength). Aspects are
          from the planet to the sign/house — NOT reciprocal. Sun, Moon, Mercury,
          Venus aspect only the 7th (full).
      (2) JAIMINI rashi drishti: sign-to-sign aspects, not planet-to-planet.
          Moveable signs (Aries, Cancer, Libra, Capricorn) aspect all fixed signs
          (Taurus, Leo, Scorpio, Aquarius) except the adjacent sign. Fixed signs
          aspect all moveable signs except the adjacent sign. Common (mutable) signs
          aspect each other (all common signs aspect all other common signs except
          the adjacent). These are sign-level, non-directional, non-orb-based —
          completely different from Parashari graha drishti.
      (3) KP: KP does not employ a separate "aspect" classification in the Parashari
          orb sense; planets' significations are channeled through the sub-lord
          connectivity chain. KP does note planetary positions in angular houses as
          influential, but the primary mechanism is nakshatra/sub-lord, not aspect orbs.
      (4) TAJAKA Itthasala/Ishrafa aspects: annual chart aspects based on separating
          (Ishrafa) and applying (Itthasala) contacts between planets within defined
          moiety orbs (half the sum of two planets' moiety orbs). Specifically annual
          chart Arabic-astrology-derived; not used in natal Parashari or KP analysis.
      All concordance entries involving aspects must carry an aspect_system tag
      specifying which system's aspect is being described.
    rule_refs: [BPHS.8.1.1, JAIMINI.1.2.1.1, KP.1.ch2.signif.1, TAJAKA.ch4.v1.1]
    flag: C2

  - topic_id: TC.053
    topic: "Parashari graha drishti — Saturn's special aspects (3rd and 10th)"
    pattern: QUALIFY
    aspect_system: parashari_graha_drishti
    schools_addressing: [parashari, kp]
    core_agreement: >
      Saturn aspects the 3rd and 10th houses from itself (in addition to the
      universal 7th aspect), at 3/4 strength. This is a unique Parashari rule
      giving Saturn broader reach. KP acknowledges this as background context.
    qualifications:
      - school: parashari
        note: >
          Saturn's 3rd aspect (74° approx.) and 10th aspect (270° approx.) are
          considered at 3/4 strength. When Saturn transits key natal points or
          is dasha-lord, these special aspects become significantly important for
          timing and result assessment.
      - school: kp
        note: >
          KP references Parashari aspects as a background layer; Saturn's 3rd/10th
          special aspects are noted but the primary signification mechanism is
          the sub-lord chain. The aspects modulate but don't override sub-lord results.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.8.2.1, KP.1.ch2.aspects.1]
    flag: C2

  - topic_id: TC.054
    topic: "Parashari graha drishti — Jupiter's special aspects (5th and 9th)"
    pattern: QUALIFY
    aspect_system: parashari_graha_drishti
    schools_addressing: [parashari, kp]
    core_agreement: >
      Jupiter aspects the 5th and 9th houses from itself (in addition to 7th),
      at 3/4 strength. Jupiter's 5th/9th aspects are the most benefic in Parashari
      astrology, spreading dharma and wisdom. KP acknowledges as background.
    qualifications:
      - school: kp
        note: Jupiter's 5th/9th aspects noted; sub-lord governs fructification.
    conflicts: []
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.8.3.1, KP.1.ch2.aspects.2]
    flag: C2

  - topic_id: TC.055
    topic: "Parashari graha drishti — Mars's special aspects (4th and 8th)"
    pattern: QUALIFY
