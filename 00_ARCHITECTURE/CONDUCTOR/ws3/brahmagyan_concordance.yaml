  - topic_id: TC.056
    topic: "Jaimini rashi drishti — moveable signs aspect fixed signs"
    pattern: ORTHOGONAL
    aspect_system: jaimini_rashi_drishti
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C2] Jaimini's rashi drishti (sign-based aspect) operates independently of
      Parashari graha drishti. Moveable signs (Aries, Cancer, Libra, Capricorn)
      aspect all fixed signs except the immediately adjacent one. This is a
      sign-to-sign relationship with no orb and no degree measurement — the aspect
      exists if the sign relationship holds, regardless of planet positions within
      those signs. BPHS/KP/Tajaka do not use this mechanism.
    rule_refs: [JAIMINI.1.2.1.1]
    flag: C2

  - topic_id: TC.057
    topic: "Jaimini rashi drishti — fixed signs aspect moveable signs"
    pattern: ORTHOGONAL
    aspect_system: jaimini_rashi_drishti
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C2] Fixed signs (Taurus, Leo, Scorpio, Aquarius) aspect all moveable signs
      except the adjacent one. This is the reciprocal rule of TC.056. The sign
      aspecting and sign aspected both hold; this is non-directional in the sense
      that a fixed sign aspecting a moveable sign means the moveable sign also
      aspects the fixed sign. BPHS/KP/Tajaka do not use this mechanism.
    rule_refs: [JAIMINI.1.2.1.2]
    flag: C2

  - topic_id: TC.058
    topic: "Jaimini rashi drishti — common/mutable signs aspect each other"
    pattern: ORTHOGONAL
    aspect_system: jaimini_rashi_drishti
    schools_addressing: [jaimini]
    note_on_other_schools: >
      [C2] Common (mutable) signs (Gemini, Virgo, Sagittarius, Pisces) aspect all
      other common signs except the adjacent one. This creates a web of aspects
      among all four mutable signs that has no equivalent in Parashari graha drishti.
      KP/Tajaka/BPHS do not use this mechanism.
    rule_refs: [JAIMINI.1.2.1.3]
    flag: C2

  - topic_id: TC.059
    topic: "Tajaka Itthasala — applying aspect between annual chart planets"
    pattern: ORTHOGONAL
    aspect_system: tajaka_itthasala
    schools_addressing: [tajaka]
    note_on_other_schools: >
      [C2] Itthasala is a Tajaka-only aspect mechanism for the annual chart. Two
      planets are in Itthasala (applying contact) when: (a) one faster planet
      applies toward a slower planet; (b) both planets are within the sum of their
      moiety orbs (each planet has a fixed moiety: Sun 15°, Moon 12°, Mars 8°,
      Mercury 7°, Jupiter 9°, Venus 7°, Saturn 9°); (c) the contact completes
      within the current Varsha year. Itthasala indicates the matter signified
      by those two planets' houses will be completed or fulfilled within the year.
      This mechanism does not exist in Parashari/Jaimini/KP natal systems.
    rule_refs: [TAJAKA.ch4.v1.1, TAJAKA.ch4.v2.1]
    flag: C2

  - topic_id: TC.060
    topic: "Tajaka Ishrafa — separating aspect in annual chart"
    pattern: ORTHOGONAL
    aspect_system: tajaka_itthasala
    schools_addressing: [tajaka]
    note_on_other_schools: >
      [C2] Ishrafa is Itthasala's opposite: two planets are in Ishrafa (separating)
      when the faster planet has already passed the applying contact point. Ishrafa
      indicates a matter that was nearly completed or begun in a prior period but
      will not fructify in the current year. No equivalent in Parashari/Jaimini/KP.
    rule_refs: [TAJAKA.ch4.v3.1]
    flag: C2

  - topic_id: TC.061
    topic: "Tajaka Nakta — transferred Itthasala via third planet"
    pattern: ORTHOGONAL
    aspect_system: tajaka_itthasala
    schools_addressing: [tajaka]
    note_on_other_schools: >
      [C2] Nakta is a three-planet Tajaka aspect where a third (faster) planet
      transfers the applying contact between two planets that are themselves
      beyond direct Itthasala range. The third planet carries the signification
      across. No equivalent in Parashari/Jaimini/KP.
    rule_refs: [TAJAKA.ch4.v5.1]
    flag: C2

  - topic_id: TC.062
    topic: "Tajaka Musaripa — frustration of Itthasala"
    pattern: ORTHOGONAL
    aspect_system: tajaka_itthasala
    schools_addressing: [tajaka]
    note_on_other_schools: >
      [C2] Musaripa occurs when a third planet intervenes between two planets in
      Itthasala and intercepts the applying contact before it completes, frustrating
      the matter. The third planet intercepts the light before the applying planet
      reaches the slower. No equivalent in Parashari/Jaimini/KP.
    rule_refs: [TAJAKA.ch4.v6.1]
    flag: C2

# ────────────────────────────────────────────────────────────────────────────
# SECTION 8: STRENGTH SYSTEMS — NON-COMPARABLE (C4) (TC.063–TC.072)
# ────────────────────────────────────────────────────────────────────────────

  - topic_id: TC.063
    topic: "Strength systems — NON-COMPARABLE meta-entry (C4)"
    pattern: ORTHOGONAL
    schools_addressing: [parashari, jaimini, kp, tajaka]
    c4_flag: true
    note_on_frameworks: >
      [C4 — NON-COMPARABLE] Each school uses a fundamentally different strength
      system. These are not interchangeable and a planet's score in one system
      cannot be translated to another:
      (1) PARASHARI Shadbala (six-fold strength): A composite numerical strength
          computed from 6 components — Sthana Bala (positional), Dig Bala (directional),
          Kala Bala (temporal), Cheshta Bala (motional), Naisargika Bala (natural),
          Drik Bala (aspectual). Each planet has a minimum required strength threshold;
          planets above threshold are "strong." Saturn requires 5, Sun 6.5, Moon 6.0
          virupas etc. Computed in virupas; uttarabala is proportional to total shadbala.
      (2) JAIMINI Atmakaraka-by-degree (AK strength): A planet's strength in Jaimini
          is primarily determined by its degree position within its sign — the planet
          with the highest degree is the AK and receives the greatest karmic authority.
          This is not a composite score but a ranking. The AK's dignity in the navamsa
          governs the soul's trajectory; this is a qualitative, ranking-based system.
      (3) KP sub-lord connectivity: A planet's effective strength in KP is measured
          by the quality and relevance of its sub-lord's house significations. A
          strongly dignified planet with an irrelevant sub-lord will not deliver;
          a debilitated planet with a powerful sub-lord connecting desired houses
          may deliver strongly. Strength is contextual, not a single number.
      (4) TAJAKA five dignities: Annual chart planets are assessed by five dignity
          factors — (a) Panchadhikara (the five Tajaka dignities: Dwadasha,
          Ekoddishtam, Trikonastha, Kendrastha, and Apoklima placement relative
          to the annual lagna); (b) planetary strength in the annual chart vs natal;
          (c) dignity in the natal chart as background context. Primarily annual-chart
          focused; uses a separate dignity vocabulary from Parashari Shadbala.
      A planet that is "strong" in Shadbala may have weak sub-lord connectivity (KP)
      and an irrelevant karaka ranking (Jaimini). All four assessments are valid within
      their own frameworks; cross-system comparison is meaningless.
    rule_refs: [BPHS.27.1.1, JAIMINI.1.1.5.1, KP.1.ch2.strength.1, TAJAKA.ch2.v8.1]
    flag: C4

  - topic_id: TC.064
    topic: "Parashari Shadbala — Dig Bala (directional strength)"
    pattern: SILENT
    schools_addressing: [parashari]
    core_agreement: >
      Dig Bala (directional strength): Jupiter and Mercury are strongest in 1st house
      (east); Sun and Mars in 10th house (south); Saturn in 7th house (west);
      Moon and Venus in 4th house (north). Planets in their optimal directional
      position receive full Dig Bala (30 shadbala points). Unique to Parashari/Shadbala system.
    qualifications: []
    conflicts: []
    silent: [jaimini, kp, tajaka]
    rule_refs: [BPHS.27.2.1]
    flag: C4

  - topic_id: TC.065
    topic: "Parashari Shadbala — Cheshta Bala (motional strength / retrogression factor)"
    pattern: CONFLICT
    schools_addressing: [parashari, kp]
    core_agreement: null
    conflicts:
      - between: [parashari, kp]
        parashari_position: >
          In Shadbala, retrograde planets receive maximum Cheshta Bala (motional
          strength) — a retrograde planet is considered to be exerting maximum
          effort (like a wrestler straining backward to gain leverage). This is
          one component of Shadbala only, not an overall exaltation-like result.
          In BPHS Ch.3, retrograde planets are also described as behaving
          "like exalted" planets — giving stronger results, akin to a planet
          in its exaltation sign in terms of output force.
        kp_position: >
          KP treats a retrograde planet as having shifted backward to the previous
          nakshatra's last sub. This is a purely positional/stellar adjustment —
          the planet's sub-lord changes, which changes the houses it signifies.
          There is no "exalted-like strength" implication; a retrograde planet
          simply has different house significations than its apparent degree
          would suggest. This is not a dignity factor at all — it is a stellar
          position correction.
        resolution: >
          These are genuinely incompatible: Parashari says retrograde = stronger/exalted-like;
          KP says retrograde = previous sub (no dignity implication). Use both
          assessments in parallel and flag explicitly when they produce contrary
          results for the same retrograde placement. Do not average or blend them.
          See C7 flag.
    silent: [jaimini, tajaka]
    rule_refs: [BPHS.3.29.1, BPHS.27.3.1, KP.1.ch3.retro.1]
    flag: C4
    cross_flag: C7

  - topic_id: TC.066
    topic: "Tajaka five-dignity assessment — Panchadhikara"
    pattern: ORTHOGONAL
    schools_addressing: [tajaka]
    note_on_other_schools: >
      [C4] Tajaka Panchadhikara (five dignities) is an annual-chart-specific strength
      system. The five categories position planets relative to the annual Lagna:
      (1) Dwadasamsa placement; (2) Ekoddishtam (adjacent to angle); (3) Trikonastha
      (in trine to annual lagna); (4) Kendrastha (in kendra from annual lagna —
      strongest); (5) Apoklima (in cadent house — weakest). This is not a cross-system
      strength metric; it applies only within the Varshaphal annual chart evaluation.
      BPHS Shadbala, Jaimini AK ranking, and KP sub-lord connectivity cannot be
      compared to or translated into Panchadhikara scores.
    rule_refs: [TAJAKA.ch2.v8.1, TAJAKA.ch2.v9.1]
    flag: C4

