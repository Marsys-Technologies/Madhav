      - school: tajaka
        note: >
          Annual chart 7th-house lord and its condition in the Varsha Kundali
          governs relationship events for that year; Itthasala yoga between
          the annual 7th lord and Venus is particularly indicative.
    conflicts: []
    rule_refs: [BPHS.11.7.1, JAIMINI.1.3.9.1, KP.2.ch6.houses.7, TAJAKA.ch4.v3.1]
    flag: C3

  - topic_id: TC.026
