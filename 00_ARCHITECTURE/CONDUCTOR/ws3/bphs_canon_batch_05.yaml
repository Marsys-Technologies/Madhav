  # ─── MERCURY MAHADASHA (BPHS Ch. 49 extended) — R3 APPLIED ──────────────────

  - rule_id: BPHS.49.25.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "49.25"
      text_excerpt: |
        "During Mercury Mahadasha, the native gains through trade, writing, scholarship,
        and communication. The results are very positive when Mercury rules beneficial
        houses from the Lagna. When Mercury rules the 6th, 8th, or 12th, the dasha
        may involve legal disputes, ill health, or intellectual frustration."
    condition: >
      Mercury Mahadasha (17-year period) is running. Mercury's house lordship from
      the Lagna determines the quality of results.
    assertion: >
      Mercury Mahadasha themes: trade, communication, intellectual pursuits, writing,
      education, and financial acumen. Best when Mercury rules trikona or kendra houses.
      Challenging when Mercury rules dusthana houses (6H, 8H, 12H).
    scope: dasha
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka with lagna-conditional qualifier = 0.8; 1 confirming text = 1.15. 0.80 (R3).
    caveats: >
      R3 caveat: Mercury Mahadasha varies sharply by Lagna. For Gemini Lagna (Mercury
      rules 1H and 4H — kendra lord): excellent dasha for personal achievement and property.
      For Virgo Lagna (Mercury rules 1H and 10H — great yoga karaka seeds): outstanding
      career success. For Scorpio Lagna (Mercury rules 8H and 11H): gains alongside
      health challenges and obstacles. For Aquarius Lagna (Mercury rules 5H and 8H):
      intelligence themes mixed with sudden obstacles.
    verified: true
    stub: false
    stub_reason: null

  # ─── VENUS MAHADASHA (BPHS Ch. 50 extended) — R3 APPLIED ───────────────────

  - rule_id: BPHS.50.16.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "50.16"
      text_excerpt: |
        "During Venus Mahadasha (20 years), the native enjoys sensual pleasures, acquires
        vehicles and property, and prospers in arts and relationships. Venus Mahadasha
        is the most pleasure-giving of all dashas when Venus is well-placed. When Venus
        rules dusthana houses, these pleasures may come with complications."
    condition: >
      Venus Mahadasha (20-year period) is running. Venus's house lordship from Lagna
      determines quality of results.
    assertion: >
      Venus Mahadasha themes: luxuries, vehicles, marriages, artistic success, and sensual
      pleasures dominate. Best when Venus is the yoga karaka (Capricorn Lagna: Venus rules
      5H and 10H; Aquarius Lagna: Venus rules 4H and 9H). Challenging when Venus rules
      dusthana houses with simultaneous malefic affliction.
    scope: dasha
    school: parashari
    confidence: 0.85
    confidence_rationale: >
      Sloka with lagna-conditional qualifier = 0.8; 1 confirming text = 1.15. 0.85 (R3).
    caveats: >
      R3 caveat: For Aries Lagna (Venus rules 2H and 7H — both Maraka houses): Venus
      is a Maraka lord; its dasha in the longevity window requires monitoring. For Scorpio
      Lagna (Venus rules 7H and 12H): excellent for marriage and liberation but also
      Maraka quality in 7H. For Pisces Lagna (Venus rules 3H and 8H): pleasure mixed
      with significant obstacles.
    verified: true
    stub: false
    stub_reason: null

  # ─── MOON MAHADASHA (BPHS Ch. 47 extended) — R3 APPLIED ────────────────────

  - rule_id: BPHS.47.18.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "47.18"
      text_excerpt: |
        "During Moon Mahadasha (10 years), the native prospers in maternal matters,
        property, and emotional wellbeing. Moon Mahadasha is most benefic for natives
        whose Moon is waxing (Shukla Paksha) and placed in kendra or trikona from
        Lagna. Waning Moon in Mahadasha may cause emotional turbulence and health issues."
    condition: >
      Moon Mahadasha (10-year period) is running. Moon's phase (waxing/waning) and
      position from Lagna determine results.
    assertion: >
      Moon Mahadasha themes: mother, home, property, emotions, public support, and
      nurturing. Waxing Moon in kendra or trikona from Lagna produces excellent results.
      Waning Moon (Krishna Paksha) or Moon in dusthana produces emotional instability,
      health fluctuations, and domestic challenges.
    scope: dasha
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka = 0.8; 1 confirming text = 1.15. 0.80 (R3 partial application).
    caveats: >
      R3 caveat: Moon Mahadasha's role varies by Lagna. For Cancer Lagna (Moon rules
      1H — the most personal connection): Moon Mahadasha is identity-defining. For
      Scorpio Lagna (Moon rules 9H — the dharma house): Moon Mahadasha gives fortune
      and father-related themes. For Capricorn Lagna (Moon rules 7H — Maraka house):
      Moon Mahadasha in longevity window requires health monitoring.
    verified: true
    stub: false
    stub_reason: null

