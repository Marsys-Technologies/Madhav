    assertion: >
      Mutual aspects: benefic-benefic mutual aspect = enhanced benefic results in both
      aspected areas; malefic-malefic mutual aspect = compounded malefic results;
      benefic-malefic mutual aspect = complex results where the benefic partially
      reduces the malefic's harm while the malefic partially reduces the benefic's
      positive quality.
