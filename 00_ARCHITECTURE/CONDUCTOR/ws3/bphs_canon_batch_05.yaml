      Exaltation and debilitation points of all planets including nodes are being established.
    assertion: >
      Exaltation degrees: Sun = 10° Aries, Moon = 3° Taurus, Mars = 28° Capricorn,
      Mercury = 15° Virgo, Jupiter = 5° Cancer, Venus = 27° Pisces, Saturn = 20° Libra.
      Debilitation = exactly opposite (same degree, opposite sign). Rahu exalts in
      Taurus (per one tradition) or Gemini (per another); Ketu in Scorpio. Node exaltation
      is the most debated.
    scope: graha
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative for 7 planets = 1.0; universally confirmed = 1.3. capped at 0.92.
      R1 for nodes applied: node exaltation claims reduced to 0.59 within this rule.
    caveats: >
      R1 applied for Rahu/Ketu: the exaltation signs for the nodes are contested in
