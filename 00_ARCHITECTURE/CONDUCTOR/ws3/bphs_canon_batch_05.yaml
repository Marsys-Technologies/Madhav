  # ─── ARISHTA YOGA TYPES (BPHS Ch. 71 extended) ─────────────────────────────

  - rule_id: BPHS.71.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "71.3"
      text_excerpt: |
        "Arishta yogas are combinations that bring misfortune and suffering. The primary
        arishta is formed when the 6th, 8th, or 12th lord is placed in the Lagna or
        with the Lagna lord. A secondary arishta occurs when malefics occupy the 1st,
        5th, and 9th houses simultaneously without benefic aspects."
    condition: >
      One or more dusthana lords (6H, 8H, or 12H) are placed in the Lagna or
      conjunct the Lagna lord, or malefics occupy all three trikona houses.
    assertion: >
      Primary arishta: dusthana lord in 1H or conjunct Lagna lord damages the native's
      vitality, wellbeing, and life circumstances. Secondary arishta: malefics in all
      three trikona houses (1H, 5H, 9H) simultaneously destroy dharma, fortune, and
      intelligence. Both types require Jupiter's protective aspect on the Lagna to
      mitigate.
    scope: yoga
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka = 0.8; 1 confirming text = 1.15. 0.80.
    caveats: >
      Arishta yoga is the opposite of raja yoga — rather than elevating, it creates
      specific types of suffering. However, arishta yogas are routinely mitigated by
      Jupiter's aspect, strong benefic planets in kendra, and the native's dharmic merits
      as reflected in the overall chart. No single arishta is absolute.
    verified: true
    stub: false
    stub_reason: null

