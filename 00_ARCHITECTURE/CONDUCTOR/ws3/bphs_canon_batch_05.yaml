      Nakshatra, Yoga, Karana) must be favourable for the activity to proceed auspiciously.
      All 5 favourable = maximum auspiciousness; 3–4 favourable = generally auspicious;
      1–2 favourable = inauspicious; 0 favourable = strongly inauspicious. The Panchanga
      of the natal chart influences the entire life quality.
    scope: muhurta
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative = 1.0; confirmed by Muhurta Chintamani = 1.15. 0.88.
    caveats: >
      Birth Panchanga (the five limbs at the exact time of birth) reflects the native's
      intrinsic cosmic environment. Adverse birth Panchanga (e.g., born on Vishti Karana,
      or during Vyatipata Yoga) is mitigated by strong chart factors but leaves a
      background vulnerability in the natal potential.
    verified: true
    stub: false
    stub_reason: null

