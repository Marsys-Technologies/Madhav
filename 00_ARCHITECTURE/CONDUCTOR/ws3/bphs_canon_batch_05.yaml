  # ─── PLANETARY PERIODS AND LIFE STAGES — NAISARGIKA DASHA ──────────────────

  - rule_id: BPHS.45.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "45.2"
      text_excerpt: |
        "The natural (naisargika) planetary periods govern specific phases of human life:
        Moon rules infancy (0–1 year), Mars rules childhood (1–3 years), Mercury rules
        education period (3–12 years), Venus governs youth (12–32 years), Jupiter rules
        adulthood (32–50 years), Sun rules mature authority (50–70 years), Saturn rules
        old age (70–death)."
    condition: >
      The natural planetary phases of life (naisargika dasha) are being applied to
      identify which planet governs a specific life stage.
    assertion: >
      Naisargika Dasha assigns each life stage to a planet: Moon (0–1: infancy),
      Mars (1–3: toddler), Mercury (3–12: education), Venus (12–32: youth and romance),
      Jupiter (32–50: adulthood/maturity), Sun (50–70: authority/government period),
      Saturn (70+: old age). This is an additional analytical layer — planetary
      influences during each stage reflect the natural karaka for that life phase.
    scope: dasha
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative with specific age ranges = 1.0; confirmed by traditional commentary = 1.15.
      0.88.
    caveats: >
      Naisargika Dasha age ranges are approximate. The concept is that the planet governing
      the life stage should ideally be strong in the natal chart for healthy development
      during that stage. Weak Jupiter in natal chart may manifest as challenges in the
      32–50 adulthood phase.
    verified: true
    stub: false
    stub_reason: null

