      (Libra 0°–15°), Saturn (Aquarius 0°–20°). Within these ranges, a planet is in
      its Moolatrikona — stronger than own sign, slightly weaker than exaltation.
      This distinction is used in Shadbala's Saptavargaja calculations.
    scope: graha
