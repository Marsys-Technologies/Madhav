      Marriage muhurta Lagna preference: fixed signs (Taurus, Leo, Scorpio, Aquarius)
      give stability and permanence in marriage; dual signs (Gemini, Virgo, Sagittarius,
      Pisces) give adaptability and companionship. Avoid movable Lagna signs (Aries,
      Cancer, Libra, Capricorn) for marriage muhurta — they indicate a changeable,
      potentially unstable union.
    scope: muhurta
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative = 1.0; confirmed by Muhurta Chintamani = 1.15. 0.88.
    caveats: >
      Practically, the available fixed or dual Lagnas on a given day depend on the time
      of day. Muhurta selection must balance all five factors (tithi, vara, nakshatra,
