        Capricorn), the badhaka house is the 11th; its lord is the badhaka planet.
        For fixed lagna (Taurus, Leo, Scorpio, Aquarius), the badhaka house is
        the 9th. For dual lagna (Gemini, Virgo, Sagittarius, Pisces), the badhaka
        house is the 7th. The badhaka planet's dasha can trigger health crises
        or major life obstacles."
    condition: >
      The badhaka planet is being identified for a given lagna sign type.
    assertion: >
