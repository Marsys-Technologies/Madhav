      verse_ref: "Vol.4.ch22.significator_count_and_strength"
      text_excerpt: |
        "When multiple planets signify the same house, the house theme is prominent
        in the native's life. When only one or two planets signify a house, the
        theme is present but not dominant. When no planet signifies a house across
        all four tiers, that house's theme is absent or very weak in the native's
        experience. Absent house signification is as important a finding as strong
        signification."
    condition: >
