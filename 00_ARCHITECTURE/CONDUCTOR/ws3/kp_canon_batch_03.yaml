      verse_ref: "Vol.2.ch19.birth_time_and_sublord_sensitivity"
      text_excerpt: |
        "The sensitivity of the sub-lord mechanism to birth time errors must be
        understood. For the ascendant, a birth time error of 3–5 minutes can
        change the ascendant sub-lord. For slower-moving house cusps (3rd, 9th),
        the sub-lord remains stable over longer time windows (15–20 minutes).
        For intermediate cusps (2nd, 8th), 8–12 minutes can change the sub-lord.
        The ascendant is always the most sensitive cusp."
    condition: >
      Birth time accuracy is being evaluated for a KP analysis across different house cusps.
    assertion: >
      Sub-lord sensitivity to birth time errors by cusp type:
      Ascendant (1st cusp): sub-lord changes with ±3–5 minute error.
      Intermediate cusps (2nd, 8th): ±8–12 minutes.
      Slow cusps (3rd, 9th): ±15–20 minutes.
      The ascendant is always the most birth-time-sensitive cusp in KP analysis.
    scope: misc
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with specific time windows (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      The time windows are latitude-dependent approximations; the 3–20 minute
      ranges assume moderate latitudes (~15°–35°N, relevant for Indian births).
      For the native (Bhubaneswar ~20°N): ascendant sub-lord is highly sensitive;
      other cusps are more robust. Birth time precision requirement scales with
      cuspal sensitivity.
    verified: true
    stub: false
    stub_reason: null

