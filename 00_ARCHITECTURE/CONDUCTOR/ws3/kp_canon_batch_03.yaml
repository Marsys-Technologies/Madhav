      Movable lagna (Aries/Cancer/Libra/Capricorn): badhaka = lord of 11th house.
      Fixed lagna (Taurus/Leo/Scorpio/Aquarius): badhaka = lord of 9th house.
      Dual lagna (Gemini/Virgo/Sagittarius/Pisces): badhaka = lord of 7th house.
      The badhaka planet's dasha or its sub-lord connectivity to the 8th cusp
      indicates life crises.
    scope: bhava
    school: kp
    confidence: 0.88
    confidence_rationale: "Declarative classification system (0.88) × partial Parashari confirmation (1.15) = 0.95; cap at 0.95, use 0.90"
    caveats: >
