  note: >
    Batch 3 closes out the KP canon extraction. Coverage: KP school summary divergences,
    the eleven-cusp inter-house derivative technique, compound sub-lord confirmations,
    KP cross-school comparison explicit statements, natal Rahu/Ketu as house occupants
    (KP perspective), sport/competition horary, residential and relocation analysis,
    final advanced prashna rules, and KP's treatment of debilitation/exaltation
    within the sub-lord framework. Total extraction across 3 batches: 280 rules, 14 STUBs.

rules:

  # ── DERIVATIVE HOUSE TECHNIQUE (BHAVAT BHAVAM) IN KP ──

  - rule_id: KP.2.ch18.bhavat_bhavam.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch18.bhavat_bhavam_kp"
      text_excerpt: |
        "The bhavat bhavam (house-from-house) principle is used in KP for derived
        house analysis. The 7th from the 7th is the 1st (the self as seen from
        the partner's perspective). The 4th from the 4th is the 7th (the opposite
        of home). The 8th from the 8th is the 3rd (longevity of longevity — the
        neighbour house to 8). These derived houses enrich the sub-lord analysis
        for complex relational questions."
    condition: >
      A derived house question is being analysed in KP (e.g., longevity of
      spouse, property of father, siblings of mother).
    assertion: >
      KP uses bhavat bhavam (house-from-house) derivation: count from the
      relevant person's house to get their specific house. E.g., 3rd from 7th
      = 9th house (spouse's siblings = 9th from lagna); 8th from 4th = 11th
      (mother's longevity = 11H from lagna). Sub-lord of the derived cusp is
      assessed for the derived question.
    scope: bhava
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with examples (0.72) × partial Parashari confirmation (1.15) = 0.83; cap 0.83"
    caveats: >
      Bhavat bhavam derivation is common to both Parashari and KP, but KP applies
      it via sub-lord of the derived cusp rather than lordship analysis. Results
      depend on sub-lord of the derived cusp.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch18.bhavat_bhavam.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch18.bhavat_bhavam_kp"
      text_excerpt: |
        "The longevity of the spouse is determined from the 8th house from the 7th
        (= 2nd house from lagna). The sub-lord of the 2nd cusp, when analysed
        for the spouse's longevity, must be read as the 8th-from-7th indicator.
        If the sub-lord of the 2nd cusp connects to maraka houses FROM THE 7TH
        HOUSE'S PERSPECTIVE (7th house's 2nd = 8th from lagna; 7th house's 7th
        = 1st from lagna), those houses indicate threat to spouse's life."
    condition: >
      Spouse's longevity is being assessed using bhavat bhavam derivation.
      The 2nd cusp (8th from 7th) sub-lord is analysed from the 7th house's
      perspective (7H's maraka = 8H from lagna and 1H from lagna).
    assertion: >
      Spouse's longevity: assess the sub-lord of the 2nd cusp as the 8th-from-7th
      indicator. Threat to spouse's life: sub-lord connects to 8H from lagna
      (= 7H's 2nd maraka house) or to 1H from lagna (= 7H's 7th maraka house).
      The 7th house's maraka houses are always the 8th and 1st from lagna.
    scope: sub_lord
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with derived house complexity (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results depend on sub-lord. The dual perspective (2nd cusp as both a
      native-finance house AND spouse-longevity indicator) requires clarity
      about which question is being asked before interpreting the sub-lord.
    verified: true
    stub: false
    stub_reason: null

  # ── KP COMPETITIVE / SPORTING QUERIES ──

  - rule_id: KP.6.ch15.competition_victory.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.6.ch15.competition_victory_horary"
      text_excerpt: |
        "For queries about winning a competition or contest, the relevant horary
        houses are 1 (querent's strength), 6 (defeating the enemy/opponent),
        and 11 (victory and gain). The sub-lord of the 1st horary cusp must
        connect to 1, 6, and 11 for victory. The sub-lord of the 7th horary
        cusp (the opponent) connecting to 12 from 7th (= 6th from lagna) weakens
        the opponent and confirms the querent's victory."
    condition: >
      KP horary for competition victory: sub-lord of 1st horary cusp assessed
      for 1H, 6H, 11H connectivity; sub-lord of 7th horary cusp assessed for
      6H connectivity (12th from 7H).
    assertion: >
      Competition victory for querent: (1) sub-lord of 1st horary cusp signifies
      1H, 6H, 11H; AND/OR (2) sub-lord of 7th horary cusp signifies 6H from lagna
      (= 12th from 7th, opponent's 12th = opponent's loss). Meeting either condition
      favours the querent; meeting both is the strongest victory indicator.
    scope: horary
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord. The dual confirmation (querent's 1st cusp
      sub-lord + opponent's 7th cusp sub-lord) is the rigorous KP competition
      verdict. The opponent's 12th (= 6th from lagna) as their loss indicator
      is a bhavat bhavam application.
    verified: true
    stub: false
    stub_reason: null

  # ── KP AND RELATIONSHIP TO PARASHARI: EXPLICIT COMPARISONS ──

  - rule_id: KP.1.ch19.kp_vs_parashari_results.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch19.kp_parashari_comparison"
      text_excerpt: |
        "KP and Parashari often agree on whether a matter is promised but may
        disagree on timing. Parashari uses dasha of the relevant house lord with
        transit support; KP uses dasha of significators of the house group with
        sub-lord verification. When both systems agree (e.g., both identify the
        same dasha as the event period), the prediction confidence is very high.
        When they disagree, the KP sub-lord analysis is the more precise tool."
    condition: >
      KP and Parashari timing predictions for the same matter are being compared.
    assertion: >
      Agreement between KP and Parashari on the same dasha period for an event
      indicates very high prediction confidence. When the two systems disagree
      on timing, KP's sub-lord mechanism is considered more precise than Parashari
      dasha-lord transit analysis. The sub-lord check provides a resolution mechanism
      for cross-school timing disagreements.
    scope: dasha
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with qualified cross-school comparison (0.72) × 1 confirmatory school (1.15) = 0.83"
    caveats: >
      This rule is particularly important for MARSYS multi-school analysis.
      When KP and Parashari agree → high confidence signal. When they disagree,
      both predictions should be recorded in the school_convergence_index with
      the KP sub-lord analysis flagged as the more granular check.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch19.kp_vs_parashari_promise.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch19.kp_parashari_comparison"
      text_excerpt: |
        "When Parashari analysis says a matter is promised (through yogas, house
        lord strength, or dasha combinations) but the KP sub-lord of the relevant
        cusp does not connect to the supportive houses, KP predicts denial or
        significant modification. In practice, KP has been found to provide
        more precise filtering — many Parashari 'yogas' promised by classical
        combinations are neutralised by unfavourable sub-lords."
    condition: >
      Parashari analysis promises a matter through yogas or strong house lords,
      but KP sub-lord of the relevant cusp does not connect to the supportive
      house group.
    assertion: >
      KP prediction: denial or significant modification of the matter despite
      Parashari promise. The sub-lord acts as a precision filter that can
      neutralise classically promised yogas when the sub-lord lacks the
      required house connectivity. For MARSYS: this is a high-priority cross-school
      conflict to flag.
    scope: sub_lord
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with qualified claim (0.72) × Parashari partial contradiction (0.85) = 0.61; qualified at 0.61"
    caveats: >
      This rule represents a fundamental school conflict: Parashari promise vs.
      KP sub-lord denial. For MARSYS multi-school instrument, this should be
      flagged as a CONFLICT type in the school_convergence_index with both
      predictions presented and the uncertainty explicitly stated.
    verified: true
    stub: false
    stub_reason: null

  # ── KP SPECIAL RULES: RAHU/KETU AS HOUSE OCCUPANTS ──

  - rule_id: KP.1.ch20.rahu_ketu_occupation.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch20.rahu_ketu_house_occupation"
      text_excerpt: |
        "When Rahu or Ketu occupies a house, they absorb the significations of
        that house strongly. Rahu in the 7th house acts as a 7th house significator
        as well as an agent of its star lord and sign lord. Ketu in the 12th house
        gives 12th house results (liberation, foreign, hospital) filtered through
        its star lord's significations. The occupation adds the house's themes to
        their already complex stellar-agent significations."
    condition: >
      Rahu or Ketu occupies house H in the natal Bhava Chalit chart.
    assertion: >
      Rahu or Ketu occupying house H becomes a significator of H through occupation,
      in addition to its stellar-agent significations from its star lord and sign lord.
      The occupied house's themes are absorbed and delivered through Rahu/Ketu's
      distinctive mode (Rahu: amplification/obsession; Ketu: detachment/spiritualisation).
    scope: bhava
    school: kp
    confidence: 0.68
    confidence_rationale: "Prose declarative (0.80) × Rahu/Ketu adjustment ×0.85 = 0.68"
    caveats: >
      Rahu/Ketu occupation rules carry confidence × 0.85 per Gate A R1.
      Results depend on sub-lord of Rahu/Ketu determining whether the occupation
      signification manifests positively or negatively.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch20.rahu_ketu_occupation.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch20.rahu_ketu_house_occupation"
      text_excerpt: |
        "Rahu in the 11th house is particularly powerful in KP for material gains.
        As an occupant of the 11th (gains, fulfilment), Rahu amplifies 11th house
        results during its dasha. If Rahu's sub-lord connects to 11H and 2H (income),
        the native will experience significant financial gains during Rahu dasha.
        If Rahu's sub-lord connects to 8H or 12H, even Rahu in 11H may bring losses."
    condition: >
      Rahu occupies the 11th house in the Bhava Chalit chart. Rahu's sub-lord
      is assessed for 11H and 2H connectivity vs. 8H or 12H.
    assertion: >
      Rahu in 11H with sub-lord connecting to 11H and 2H: significant financial gains
      during Rahu dasha. Rahu in 11H with sub-lord connecting to 8H or 12H: losses
      despite apparent 11H placement. Sub-lord override applies even to Rahu in
      the house of gains.
    scope: sub_lord
    school: kp
    confidence: 0.68
    confidence_rationale: "Prose declarative with example (0.80) × Rahu/Ketu adjustment ×0.85 = 0.68"
    caveats: >
      Rahu rules carry confidence × 0.85. This rule demonstrates the sub-lord
      override principle applied to Rahu specifically. Results depend on sub-lord.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch20.rahu_ketu_occupation.3
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch20.rahu_ketu_house_occupation"
      text_excerpt: |
        "Ketu in the 1st house (ascendant) creates a complex chart configuration
        in KP. Ketu absorbs 1st house significations (physical body, self-expression,
        vitality) and spiritualises them. The native may be other-worldly in
        orientation, or have unusual health patterns tied to Ketu's star lord
        and sub-lord. If Ketu's sub-lord connects to 8H or 12H, health vulnerabilities
        or spiritual experiences of a transformative nature occur in Ketu dasha."
    condition: >
      Ketu occupies the 1st house (ascendant house) in the Bhava Chalit chart.
      Ketu's sub-lord is assessed for 8H and 12H connectivity.
    assertion: >
      Ketu in 1H: spiritualisation of self-expression and physical presentation.
      Ketu's sub-lord connecting to 8H and 12H: health vulnerabilities or
      transformative spiritual experiences during Ketu dasha. Ketu in 1H is a
      complex placement requiring sub-lord assessment before any specific prediction.
    scope: sub_lord
    school: kp
    confidence: 0.61
    confidence_rationale: "Prose with qualifiers (0.72) × Rahu/Ketu adjustment ×0.85 = 0.61"
    caveats: >
      Ketu rules carry confidence × 0.85. Results depend on sub-lord. The
      'spiritualisation' of Ketu's occupied house is a general KP principle;
      the specific manifestation is always filtered through the sub-lord.
    verified: true
    stub: false
    stub_reason: null

  # ── PREGNANCY AND CHILDBIRTH TIMING ──

  - rule_id: KP.5.ch15.pregnancy_timing.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.5.ch15.pregnancy_childbirth_timing"
      text_excerpt: |
        "Pregnancy timing in KP uses the 2nd, 5th, and 11th house group. The
        dasha-bhukti-antara must all be significators of 2, 5, and 11 for
        conception and birth to occur. Jupiter (karaka of children) as a dasha
        or bhukti lord that also signifies 2/5/11 is particularly favourable.
        The sub-lord of the 5th cusp must be confirmed as connecting to 5 and 11
        before timing the pregnancy."
    condition: >
      Pregnancy and childbirth timing: sub-lord of 5th cusp confirmed connecting
      to 5H and 11H. Dasha-bhukti-antara of 2/5/11 significators is running.
      Jupiter as dasha/bhukti lord also signifies 2/5/11.
    assertion: >
      Pregnancy and childbirth occur during dasha-bhukti-antara where all lords
      are significators of 2H, 5H, and 11H, AND the sub-lord of the 5th cusp
      connects to 5H and 11H (promise confirmed). Jupiter's period as a 2/5/11
      significator is particularly favourable for childbirth.
    scope: dasha
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord. The pregnancy timing rule applies the general
      three-tier dasha rule to the 2/5/11 house group specifically. Jupiter's
      natural karaka role for children is consistent across schools.
    verified: true
    stub: false
    stub_reason: null

  # ── KP FOR REAL ESTATE AND RELOCATION ──

  - rule_id: KP.5.ch16.property_loss.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.5.ch16.property_loss_sale"
      text_excerpt: |
        "Property loss or compulsory sale in KP is indicated when the sub-lord
        of the 4th cusp connects to houses 3 and 9 (movement away from home)
        rather than to 4 and 11 (stability and gain from property). If the
        sub-lord of the 4th cusp connects to 12 (loss) without 11 (gain),
        property is lost, stolen, or sold at a loss. The 12th from 4th is the
        3rd house — movement away from settled home."
    condition: >
      Property loss, sale, or abandonment is being assessed. Sub-lord of 4th
      cusp connects to 3H and 9H (movement) or to 12H without 11H.
    assertion: >
      Property loss or compulsory sale: 4th cusp sub-lord connecting to 3H and 9H
      (movement away from property) or to 12H without 11H (loss without gain).
      The 12th-from-4th (3H) as movement indicator confirms the relocation-away-from-home
      pattern. Property is stabilised or gained when sub-lord connects to 4H and 11H.
    scope: sub_lord
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with conditional tracks (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results depend on sub-lord. The 3H as 12th from 4th (negation of settled home)
      is a bhavat bhavam derived analysis. Property gain requires 4H + 11H + 12H
      connectivity (per KP.5.ch3.property.1).
    verified: true
    stub: false
    stub_reason: null

  # ── KP AND PLANETS IN THEIR OWN HOUSES ──

  - rule_id: KP.1.ch21.planet_own_house.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch21.planet_in_own_sign_house"
      text_excerpt: |
        "When a planet is in its own sign in the Rasi chart and also in its own
        Bhava Chalit house (e.g., Venus in Taurus in the 7th house when Taurus
        = 7th house), the planet is in its most comfortable and powerful position
        in KP. It is simultaneously the house occupant, the house lord, and in its
        own sign. Its signification of that house is maximum. Still, the sub-lord
        of the cusp determines whether the house matter actually manifests."
    condition: >
      A planet P is in its own sign AND its own house in the Bhava Chalit chart
      (both sign lord and house occupant simultaneously).
    assertion: >
      Maximum signification strength in KP: planet in own sign AND own house is
      simultaneously occupant, lord, and sign-ruler of that house. All four
      tiers of the signification hierarchy converge. However, the sub-lord of
      the cusp still determines whether the house matter manifests.
    scope: bhava
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative with clear compound condition (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord even for maximum-strength placements. This
      rule reinforces the sub-lord primacy axiom (KP.1.ch17) even in the
      strongest possible planet-house combination.
    verified: true
    stub: false
    stub_reason: null

  # ── KP PRINCIPLES FOR SPECIAL LIFE TOPICS ──

  - rule_id: KP.5.ch17.higher_studies_abroad.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.5.ch17.higher_studies_abroad"
      text_excerpt: |
        "For higher studies abroad, the relevant houses are 4 (education foundation),
        9 (higher knowledge, long journeys, foreign countries), 12 (foreign land,
        foreign residence), and 11 (fulfilment, gain). The sub-lord of the 9th cusp
        must connect to all four of these houses for higher studies abroad to be
        both promised and fulfilled. Connection to 4/9/11 without 12 indicates
        higher studies at home, not abroad."
    condition: >
      Higher studies abroad is being assessed. Sub-lord of 9th cusp is evaluated
      for 4H, 9H, 12H, and 11H connectivity.
    assertion: >
      Higher studies abroad promised when sub-lord of 9th cusp signifies 4H, 9H,
      12H, and 11H. Without 12H connectivity (but having 4/9/11): higher studies
      in home country. The 12H connectivity is the decisive indicator for foreign
      component of higher education.
    scope: sub_lord
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative with graduated conditions (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord. The four-house group for higher studies abroad
      combines the education group (4/9) with the foreign residence indicator (12)
      and fulfilment (11). This is a specific KP compound rule for overseas education.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.5.ch18.award_honour.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.5.ch18.awards_honours_recognition"
      text_excerpt: |
        "For awards, honours, and public recognition, the relevant houses are
        1 (native's own standing), 9 (fortune, destiny), 10 (public reputation),
        and 11 (gains, rewards). The sub-lord of the 10th cusp connecting to all
        four of these houses is the KP signature for public recognition and honours.
        The Sun as a significator of 10H reinforces the recognition theme (Sun =
        authority, prominence, government recognition)."
    condition: >
      Awards, honours, and public recognition are being assessed. Sub-lord of
      10th cusp is evaluated for 1H, 9H, 10H, 11H connectivity; Sun's signification
      of 10H is also assessed.
    assertion: >
      Awards and honours promised when sub-lord of 10th cusp signifies 1H, 9H,
      10H, and 11H simultaneously. Sun as 10H significator reinforces prominence
      and government-type recognition. The four-house connectivity represents
      the individual's destiny (9H) manifesting as public career achievement (10H)
      and reward (11H) for the native (1H).
    scope: sub_lord
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with four-house compound rule (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results depend on sub-lord. The four-house requirement for awards (1/9/10/11)
      is more demanding than basic career success (2/6/10). The additional
      1H and 9H components add the personal destiny and self-achievement dimensions.
    verified: true
    stub: false
    stub_reason: null

  # ── INTERCUSP SUB-LORD FOR HEALTH RECOVERY ──

  - rule_id: KP.4.ch17.health_recovery.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.4.ch17.health_recovery_detailed"
      text_excerpt: |
        "For health recovery after illness, the sub-lord of the 1st cusp is
        primary (body-strength recovery), and the sub-lord of the 11th cusp
        is secondary (fulfilment of recovery desire). When both the 1st cusp
        sub-lord and the 11th cusp sub-lord connect to 1H and 11H (life and
        gain), recovery is doubly confirmed. If either connects to 6, 8, or 12
        exclusively, recovery will be slow or incomplete."
    condition: >
      Health recovery after illness: sub-lords of both 1st and 11th cusps are
      assessed for 1H and 11H connectivity vs. 6H/8H/12H connectivity.
    assertion: >
      Full recovery: both sub-lords of 1st and 11th cusps connect to 1H and 11H.
      Partial/slow recovery: one of the two sub-lords connects to 6H, 8H, or 12H.
      No recovery: both sub-lords connect to 6H, 8H, 12H exclusively. The dual
      cusp check provides a graduated recovery assessment.
    scope: sub_lord
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with dual-cusp and graduated outcomes (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results depend on sub-lord at both cusp levels. The two-cusp health
      recovery check (1st and 11th cusps) provides more robust assessment than
      single-cusp analysis for complex recovery situations.
    verified: true
    stub: false
    stub_reason: null

  # ── KP AND THE MOON ──

  - rule_id: KP.1.ch22.moon_mind.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch22.moon_as_mind_indicator"
      text_excerpt: |
        "In KP, the Moon is the primary indicator of the native's mental state
        and emotional nature. The sub-lord of the Moon determines whether the
        mind is settled, disturbed, or in flux. If Moon's sub-lord connects to
        4H (peace and home), the mind is settled. If Moon's sub-lord connects
        to 12H, the mind is restless or prone to escapism. If to 8H, the mind
        is prone to sudden disturbances or deep psychological experiences."
    condition: >
      The native's mental state and emotional nature are being assessed via the Moon.
      Moon's sub-lord is evaluated for 4H, 12H, or 8H connectivity.
    assertion: >
      Moon's sub-lord connecting to 4H: settled mind, emotional stability.
      Moon's sub-lord connecting to 12H: restless mind, prone to escapism or
      fantasy. Moon's sub-lord connecting to 8H: sudden mental disturbances,
      deep psychological depth. The Moon's sub-lord is the primary KP mental
      health indicator.
    scope: sub_lord
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative with three-way classification (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord. Moon as mind indicator is consistent across
      schools; KP's sub-lord classification of mental states (4H=stable,
      12H=restless, 8H=disturbed) is a practical KP analytical framework.
    verified: true
    stub: false
    stub_reason: null

  # ── KP ON EXALTATION/DEBILITATION REDUX ──

  - rule_id: KP.1.ch23.neecha_bhanga.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch23.neecha_bhanga_in_kp"
      text_excerpt: |
        "Neecha Bhanga (cancellation of debilitation) from Parashari tradition
        is not a formal concept in KP. The debilitated planet's results are
        determined entirely by its sub-lord. If the debilitated planet has a
        favourable sub-lord (connecting to the relevant house group), it gives
        positive results despite debilitation. The traditional Neecha Bhanga
        conditions (lord of debilitation in kendra, etc.) are superseded by
        the sub-lord mechanism in KP."
    condition: >
      A debilitated planet has Neecha Bhanga conditions (traditional Parashari
      cancellation) but is being assessed in a KP framework.
    assertion: >
      In KP, Neecha Bhanga (Parashari cancellation of debilitation) is not a
      formal rule. The debilitated planet's results are determined by its sub-lord.
      A debilitated planet with a favourable sub-lord gives positive results.
      Traditional Neecha Bhanga conditions do not modify this assessment in KP.
    scope: graha
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose declarative with explicit Parashari contrast (0.72) × Parashari divergence (0.85) = 0.61; qualified at 0.61"
    caveats: >
