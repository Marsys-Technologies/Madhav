      occupant, star-of-lord, lord) is being assessed.
    assertion: >
      Many planets signifying H → H's theme is prominent/dominant in life.
      One or two planets signifying H → H's theme is present but not central.
      Zero planets signifying H → H's theme is absent or negligible; the native
      has minimal experience of that house's domain. Zero-signification finding
      is diagnostically important.
    scope: bhava
    school: kp
    confidence: 0.72
