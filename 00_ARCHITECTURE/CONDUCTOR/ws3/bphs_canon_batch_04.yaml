  # ─── DISEASE PREDICTION RULES (BPHS Ch. 20-22) ──────────────────────────────

  - rule_id: BPHS.20.4.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "20.4"
      text_excerpt: |
        "If the Lagna or the Lagna lord is afflicted by malefics (Sun, Mars, Saturn,
        Rahu, Ketu) and there are no benefic aspects, the native will suffer from
        diseases related to the body. The type of disease is indicated by the planet
        afflicting the Lagna."
    condition: >
      The Lagna or Lagna lord is afflicted by one or more natural malefics without
      benefic aspect protection.
    assertion: >
      Disease type by afflicting planet: Mars afflicting Lagna = blood diseases, wounds,
      surgical conditions, fever; Saturn = chronic diseases, bone/joint issues, wasting;
      Sun = heart, eye, and vitality conditions; Rahu = unusual or mysterious diseases,
      skin conditions, toxic poisoning; Ketu = abdominal diseases, parasitic conditions,
      spiritual/psychosomatic ailments.
    scope: bhava
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka with planet-type enumeration = 0.8; 1 confirming text (Brihat Jataka on
      disease planets) = 1.15. 0.80.
    caveats: >
      Disease prediction requires: (a) primary Lagna/Lagna lord affliction; (b) 6H and
      its lord's condition; (c) the 8H condition. Affliction to the Lagna alone is
      necessary but not sufficient for health crises.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.20.5.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "20.5"
      text_excerpt: |
        "Diseases of the head and brain are associated with Aries, 1st house, and Sun.
        Diseases of the throat are associated with Taurus and 2nd house. Eye diseases
        are associated with Sun and Moon afflicted in the 2nd house or the 1st house."
    condition: >
      Planetary affliction exists in specific signs and houses relevant to anatomical
      regions.
    assertion: >
      Anatomical disease indicators: Head/brain — Aries or 1H afflicted + Sun afflicted;
      Throat — Taurus or 2H afflicted; Eye diseases — Sun (right eye) and Moon (left eye)
      afflicted, especially in 2H or 12H from Lagna; heart — Leo or 5H afflicted + Sun weak;
      stomach — Virgo or 6H afflicted + Mercury afflicted.
    scope: bhava
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka = 0.8; confirmed by Brihat Jataka medical astrology chapter = 1.15. 0.80.
    caveats: >
      The kalapurusha anatomical correspondence (rashi = body part) provides the
      primary framework. The house placement provides secondary confirmation.
      Both must align for reliable disease prediction.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.21.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "21.3"
      text_excerpt: |
        "When the 6th house and its lord are strongly placed and afflict the Lagna lord,
