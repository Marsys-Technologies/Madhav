  # ─── NAKSHATRA-BASED COMPATIBILITY (ASHTAKUTA) — BPHS Ch. 5 extended ────────

  - rule_id: BPHS.5.94.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "5.94"
      text_excerpt: |
        "Nadi Koota is the most important of the eight compatibility factors (Ashtakuta).
        If the Nadi of bride and groom are the same (Aadi-Aadi, Madhya-Madhya, or
        Antya-Antya), the marriage is contraindicated due to Nadi dosha. Nadi dosha
        causes health problems and loss of children."
    condition: >
      The Nadi (pulse type) of the bride and groom based on their birth nakshatras
      is being evaluated for compatibility.
    assertion: >
      Nadi Koota has 8 points — the maximum weightage in Ashtakuta matching. Same
      Nadi (both Aadi, both Madhya, or both Antya) = Nadi dosha — 0 points and
      marriage is contraindicated. This dosha traditionally indicates: health problems
      for the couple, difficulty with children, and potential early loss of partner.
      Different Nadi = 8 points (full score) — no dosha.
    scope: nakshatra
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative = 1.0; confirmed by Phaladeepika and Saravali on Nadi Koota = 1.15.
      0.88.
    caveats: >
      Nadi dosha can be partially cancelled by: (a) both born in the same rashi or
      nakshatra despite same Nadi; (b) strong benefic aspects on the 7H of both charts;
      (c) strong Jupiter in both nativity charts. Full Ashtakuta analysis requires
      all 8 factors — Nadi alone does not determine marriage suitability.
    verified: true
    stub: false
    stub_reason: null

