      2H or 7H. Saturn is the most feared Maraka when it occupies these houses or
      conjuncts Maraka lords. The Maraka dasha is only dangerous during the appropriate
      longevity window (as determined from ayurvargiya analysis) — a Maraka dasha
      in youth does not cause death, merely health challenges.
    scope: bhava
    school: parashari
    confidence: 0.92
