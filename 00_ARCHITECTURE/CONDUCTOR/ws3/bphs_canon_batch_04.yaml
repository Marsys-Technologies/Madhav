      all fixed signs EXCEPT the immediately adjacent fixed sign; (2) Fixed signs
      (Taurus, Leo, Scorpio, Aquarius) aspect all dual signs except the adjacent;
      (3) Dual signs (Gemini, Virgo, Sagittarius, Pisces) aspect all movable signs
      except the adjacent. Rashi Drishti is mutual — if sign A aspects sign B, then
      B aspects A.
    scope: graha
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative = 1.0; confirmed by Jaimini Sutras (cross-text Rashi Drishti
