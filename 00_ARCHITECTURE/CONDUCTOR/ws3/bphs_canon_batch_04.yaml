      Venus in 6H = kidney or reproductive system conditions; Moon in 6H = digestive or
      lymphatic conditions.
    scope: bhava
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka with planet-specific enumeration = 0.8; 1 confirming text = 1.15. 0.80.
    caveats: >
      6H analysis for disease requires: (a) the 6H planet to be actively involved
      (aspecting, conjuncting, or ruling the affected houses); (b) dasha activation of
      the 6H lord or occupant; (c) supporting transit evidence.
    verified: true
    stub: false
    stub_reason: null

  # ─── LONGEVITY ASSESSMENT (BPHS Ch. 22) ─────────────────────────────────────

  - rule_id: BPHS.22.5.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "22.5"
      text_excerpt: |
        "The three determinants of longevity span (ayurvargiya) are: the Lagna lord
        and the Lagna, the Moon and its placement, and Saturn. If all three are
        strong — Lagna lord in kendra or trikona, Moon with Paksha bala, Saturn
        not afflicting Lagna — the native will be long-lived (purnayu: 100 years)."
    condition: >
      Longevity classification (balarishta, alpayu, madhyayu, or purnayu) is being
      assessed from the natal chart.
    assertion: >
      Three longevity determinants: (1) Lagna and Lagna lord strength; (2) Moon's strength
      (Paksha bala, sign, aspects); (3) Saturn's role (primary longevity karaka — whether
      Saturn is supportive or afflicting). All three strong = long life; one or more
      severely afflicted = reduced lifespan. The interaction of these three factors
      determines the ayurvargiya classification.
    scope: bhava
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative with three-determinant framework = 1.0; confirmed by Brihat Jataka's
      longevity chapter and Phaladeepika = 1.15. 0.88.
    caveats: >
      The ayurvargiya (life span classification) is a rough framework: short life (alpayu
      up to 32 years), medium (madhyayu 32–64), and long (purnayu 64–100+). Modern
      application must account for medical advances, lifestyle, and the native's environment.
      The classical framework was calibrated for pre-modern lifespans.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.22.6.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "22.6"
      text_excerpt: |
        "Balarishta (early death in childhood) occurs when: the 8th house lord is in
        the Lagna, the Lagna lord is in the 8th house, both luminaries are in the 6th
        or 8th, and malefics occupy the Lagna without benefic aspects. All these
        conditions simultaneously indicate severe balarishta."
    condition: >
      Multiple simultaneous afflictions suggesting balarishta (early childhood death risk)
      are present in the natal chart.
    assertion: >
      Balarishta risk indicators (must be multiple to be significant): 8H lord in 1H +
      Lagna lord in 8H (mutual exchange of 1H–8H involvement), both Sun and Moon in
      dusthana (6H or 8H), malefics in 1H without any benefic aspect protection.
      Single indicator is insufficient — multiple simultaneous indicators signal
      balarishta risk.
    scope: bhava
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka with multiple condition requirement = 0.8; 1 confirming text = 1.15. 0.80.
    caveats: >
      Balarishta is significantly mitigated by: (a) strong Jupiter aspect on the Lagna
      or Moon; (b) strong benefic influence on the 8H lord; (c) strong Lagna lord.
      Modern context: childhood mortality has dramatically reduced — balarishta indicators
      may manifest as severe childhood illness rather than death.
    verified: true
    stub: false
    stub_reason: null

  # ─── JAIMINI CHARA DASHA SIGN RESULTS (BPHS Ch. 44 extended) ────────────────

  - rule_id: BPHS.44.5.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "44.5"
      text_excerpt: |
        "During the Chara Dasha of a sign, the results relate to the planets placed in
        that sign, the sign lord, the Atmakaraka's relationship to that sign, and the
        aspects on that sign. If Jupiter is in the sign or aspects it, the period brings
        wisdom, expansion, and fortune."
    condition: >
      A Chara Dasha of a specific sign is operating and the planets in that sign
      and the sign lord are evaluated.
    assertion: >
      Chara Dasha results are determined by: (1) planets placed in the dasha sign;
      (2) the dasha sign's lord and its condition; (3) whether the Atmakaraka is in
      the dasha sign or in a kendra/trikona from it; (4) aspects from benefics or
      malefics on the dasha sign. Jupiter's aspect or placement = expansion and fortune;
      Saturn = delays and lessons; Mars = intensity and conflict; malefic cluster =
      challenging period.
    scope: dasha
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka = 0.8; cross-text Jaimini Sutras partially confirm = 1.15. 0.80.
    caveats: >
      Chara Dasha is Jaimini's primary dasha system. BPHS includes it as a supplementary
      system. For full Chara Dasha results, Jaimini Sutras provide more precise rules.
      This rule gives only the Parashara framework for Chara Dasha interpretation.
    verified: true
    stub: false
    stub_reason: null

