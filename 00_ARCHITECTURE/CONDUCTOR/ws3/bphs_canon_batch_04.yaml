    caveats: >
      Maraka lords are not inherently malefic — the 2H lord and 7H lord can be
      natural benefics (e.g., Jupiter as 7H lord for Gemini Lagna). Their Maraka
      quality activates only in the longevity window. Natural malefics (Saturn, Mars)
