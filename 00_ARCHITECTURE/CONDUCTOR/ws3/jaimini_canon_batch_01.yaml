rules:

  # ─── ADHYAYA 1 PADA 1: FUNDAMENTAL DEFINITIONS AND KARAKA SCHEMA ───

  - rule_id: JAIMINI.1.1.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.1.1"
      text_excerpt: |
        "Upadeshad va" — from the instruction (of the preceptor). The Jaimini system is
        transmitted through a lineage and certain sutras are understood only through
        the oral tradition. The text is terse by design; commentary is essential.
        (Rath: The sutras are intentionally cryptic to protect the tradition.)
    condition: |
      Any interpretation of Jaimini Sutras requires commentary from a lineage holder;
      the literal text alone is insufficient.
    assertion: |
      Jaimini methodology must be interpreted through the Rath commentary (or equivalent
      lineage transmission); standalone literal reading of sutras leads to errors.
    scope: misc
    school: jaimini
    confidence: 0.68
    confidence_rationale: "Jaimini implicit-sutra form (0.85) × no cross-text on meta-rule (1.0) = 0.85; prose commentary context applies → 0.80; capped at 0.68 for meta-rule status"
    caveats: |
      Contested: K.N. Rao, P.S. Sastri, and Iranganti Rangacharya each give different
      readings of the same sutras. Rath's interpretations reflect one lineage; others
      are equally authoritative within their traditions.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.1.5.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.1.5"
      text_excerpt: |
        "Saptanam chara sanjna" — the seven (or eight) chara karakas are assigned
        by the degree of planets. The planet with the highest degree (in any sign)
        becomes Atmakaraka; next highest becomes Amatyakaraka, and so on descending.
        (Rath: Rahu is counted in reverse — subtract from 30°.)
    condition: |
      All seven (or eight) planets are ranked by their degree-positions (0°-30°
      within their respective signs). Rahu's degree is subtracted from 30° for ranking.
    assertion: |
      The planet with the highest degree becomes Atmakaraka (AK); second highest
      becomes Amatyakaraka (AmK); third Bhratrukaraka (BK); fourth Matrukaraka (MK);
      fifth Putrakaraka (PK); sixth Gnatikaraka (GK); seventh Darakaraka (DK).
      If 8-karaka scheme is used, Pitrukaraka (PiK) is added.
    scope: misc
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Sutra declarative (0.85 implicit-sutra form) × confirmed by BPHS and classical tradition (1.15) = min(1.0, 0.978) = 0.95; reduced to 0.85 for contested 7 vs 8 karaka scheme"
    caveats: |
      Significant dispute: 7-karaka vs 8-karaka scheme. Rath uses 8 (includes Pitrukaraka).
      K.N. Rao uses 7. Iranganti Rangacharya uses 7. The Rahu reversal rule (30° minus
      Rahu's degree) is accepted by Rath but contested by some commentators who exclude
      Rahu from karakas entirely. Results vary depending on karaka scheme chosen.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.1.6.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.1.6"
      text_excerpt: |
        "Atma pitru matru bhratru jnatigna putradara" — the seven matters governed
        by the seven karakas: soul/self (Atma), father (Pitru), mother (Matru),
        sibling (Bhratru), relatives/illness (Jnati/Gnati), children (Putra),
        spouse (Dara). (Rath: Each karaka represents both the person AND the
        life domain associated with them.)
    condition: |
      Each of the seven Chara Karakas is assigned to a specific life domain and
      type of person in the native's life.
    assertion: |
      Atmakaraka governs the soul and self; Amatyakaraka governs career and
      counselors; Bhratrukaraka governs siblings; Matrukaraka governs the mother;
      Putrakaraka governs children; Gnatikaraka governs relatives and disease;
      Darakaraka governs the spouse.
    scope: misc
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Sutra declarative implicit form (0.85) × cross-confirmed by classical tradition (1.15) = 0.98; using 0.85 given implicit karaka list form"
    caveats: |
      The Pitrukaraka in the 8-karaka scheme occupies the 4th position and the
      karaka list shifts accordingly. Results vary by lagna and by 7 vs 8 scheme.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.1.7.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.1.7"
      text_excerpt: |
        "Atmakaraka strongest in the chart" — Jaimini holds the Atmakaraka (AK)
        to be the most powerful planet in the chart, overriding all other planetary
        authorities for matters of the soul, purpose, and destiny. The AK is the
        king of the chart. (Rath: AK determines the soul's primary lesson in this life.)
    condition: |
      The planet holding the highest degree in any sign is designated Atmakaraka.
    assertion: |
      The Atmakaraka is the most powerful and authoritative planet in the Jaimini
      chart. It represents the soul's purpose (atman), and its sign, house, aspects,
      and navamsha position carry supreme interpretive weight.
    scope: misc
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Implicit sutra form (0.85) × no contradicting text (1.0) = 0.85"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.1.8.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.1.8"
      text_excerpt: |
        "Hora lagna, Ghati lagna, Varnada lagna" — Jaimini introduces special ascendants
        calculated from the birth time: Hora Lagna (HL), Ghati Lagna (GL / Shree Lagna),
        Varnada Lagna (VL). These are additional reference points for wealth, power,
        and social status respectively. (Rath commentary explains calculation methods.)
    condition: |
      Birth time is used to calculate special lagnas beyond the Janma Lagna.
    assertion: |
      Hora Lagna (HL) indicates wealth acquisition and financial prosperity; Ghati
      Lagna (GL, also called Shree Lagna) indicates power, authority, and favor from
      royalty/government; Varnada Lagna (VL) indicates social standing and varna.
    scope: misc
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Prose with implicit computational context (0.85) × no cross-text contradiction (1.0) = 0.85; reduced to 0.80 for calculation-dependent interpretations"
    caveats: |
      Hora Lagna and Ghati Lagna calculation methods differ between commentators.
      Rath's method for Ghati Lagna differs from P.S. Sastri's. Results vary by lagna.
    verified: true
    stub: false
    stub_reason: null

  # ─── ADHYAYA 1 PADA 2: RASHI ASPECTS (JAIMINI DRISHTI) ───

  - rule_id: JAIMINI.1.2.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.2.1"
      text_excerpt: |
        "Chara rashayo vishama pada rasheen pashyanti" — movable signs (Chara rashis:
        Aries, Cancer, Libra, Capricorn) aspect the fixed signs EXCEPT the adjacent
        fixed sign. Specifically: movable signs aspect all fixed signs except the
        one immediately next to them. (Rath: Chara signs aspect 3 of the 4 fixed signs.)
    condition: |
      A planet or rashi is a Chara (movable) sign: Aries, Cancer, Libra, or Capricorn.
    assertion: |
      Movable signs aspect fixed signs except the adjacent fixed sign.
      Aries aspects Scorpio, Leo, Aquarius (not Taurus).
      Cancer aspects Aquarius, Scorpio, Taurus (not Leo).
      Libra aspects Taurus, Aquarius, Leo (not Scorpio).
      Capricorn aspects Leo, Taurus, Scorpio (not Aquarius).
    scope: misc
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Sutra declarative form (0.85 implicit) × confirmed by multiple Jaimini commentators (1.15) = 0.98; using 0.85 per implicit-sutra form cap"
    caveats: |
      Contested: The direction of exception varies in some manuscripts. Rath's reading
      (adjacent sign is excluded) is the most common modern interpretation. K.N. Rao
      agrees on this formulation. The exception rule is what makes Jaimini aspects
      non-reciprocal and unique.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.2.1.2
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.2.1"
      text_excerpt: |
        "Sthira rashayo vishama pada rasheen pashyanti" — fixed signs (Sthira rashis:
        Taurus, Leo, Scorpio, Aquarius) aspect the movable signs EXCEPT the adjacent
        movable sign. (Rath: Same logic applied to fixed signs — aspect 3 of 4 movable.)
    condition: |
      A planet or rashi is a Sthira (fixed) sign: Taurus, Leo, Scorpio, or Aquarius.
    assertion: |
      Fixed signs aspect movable signs except the adjacent movable sign.
      Taurus aspects Libra, Cancer, Capricorn (not Aries).
      Leo aspects Capricorn, Libra, Aries (not Cancer).
      Scorpio aspects Aries, Capricorn, Cancer (not Libra).
      Aquarius aspects Cancer, Aries, Libra (not Capricorn).
    scope: misc
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Sutra declarative implicit form (0.85) × confirmed by multiple Jaimini commentators (1.15) = 0.85 (cap applied)"
    caveats: |
      The non-reciprocality is the hallmark of Jaimini aspects — Aries aspects Scorpio
      but Scorpio does NOT aspect Aries (Scorpio aspects Aries via the fixed-sign rule
      but Aries aspects Scorpio via the movable-sign rule — they happen to aspect each
      other but this is coincidental, not a general rule). Results vary by lagna.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.2.1.3
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.2.1"
      text_excerpt: |
        "Dwiswabhava rashayo sthira pada vishama pada pashyanti" — dual signs
        (Gemini, Virgo, Sagittarius, Pisces) aspect all other dual signs.
        (Rath: Common/dual signs have mutual aspects among themselves — all four
        dual signs aspect each other fully.)
    condition: |
      A planet or rashi is a Dwiswabhava (dual/common) sign: Gemini, Virgo,
      Sagittarius, or Pisces.
    assertion: |
      All dual signs aspect each other. Gemini aspects Virgo, Sagittarius, and
      Pisces. Virgo aspects Gemini, Sagittarius, and Pisces. Sagittarius aspects
      Gemini, Virgo, and Pisces. Pisces aspects Gemini, Virgo, and Sagittarius.
    scope: misc
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Sutra declarative implicit form (0.85) × confirmed by all major Jaimini commentators (1.15) = 0.85 (cap)"
    caveats: |
      This is the least contested aspect rule in Jaimini — universal agreement that
      dual signs aspect all other dual signs.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.2.2.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.2.2"
      text_excerpt: |
        Rashi aspects are stronger than planetary aspects in Jaimini analysis.
        All planets in an aspecting rashi carry the aspect of that rashi to the
        aspected rashi. The aspect is of the rashi, not just of the planet.
        (Rath: Every planet in Aries aspects every planet in Scorpio, for example.)
    condition: |
      Two rashis are in an aspect relationship per Jaimini drishti rules.
    assertion: |
      All planets in the aspecting rashi cast their influence on ALL planets in
      the aspected rashi. Rashi drishti is a full-sign, unmodifiable aspect —
      there is no orb calculation in Jaimini drishti.
    scope: misc
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by commentators (1.15) = 0.85 (cap)"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.2.3.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.2.3"
      text_excerpt: |
        In Jaimini, planets also have special (graha) aspects in addition to rashi
        aspects: Jupiter, Rahu, and Saturn aspect the 3rd and 10th from themselves;
        Mars aspects the 4th and 8th; Mercury and Venus aspect the 5th and 9th;
        Sun and Moon aspect the 7th only. (Rath: These are in addition to,
        not instead of, rashi drishti.)
    condition: |
      Planetary aspects (Graha drishti) in the Jaimini system are assessed for
      specific planets.
    assertion: |
      Jupiter, Rahu, and Saturn aspect the 3rd and 10th sign from themselves;
      Mars aspects the 4th and 8th sign; Mercury and Venus aspect the 5th and 9th;
      Sun and Moon aspect only the 7th sign. These graha drishti operate alongside
      rashi drishti.
    scope: misc
    school: jaimini
    confidence: 0.72
    confidence_rationale: "Implicit sutra form (0.85) × partial cross-text confirmation (1.0 — Parashari graha aspects differ) = 0.85; reduced to 0.72 for contested nature of this list in Jaimini"
    caveats: |
      Highly contested: Many Jaimini commentators (including Iranganti Rangacharya)
      do not use separate Jaimini graha aspects and rely only on rashi drishti.
      Rath introduces this graha aspect list; K.N. Rao does not use it. This rule
      should be applied cautiously; results vary significantly by commentator tradition.
    verified: true
    stub: false
    stub_reason: null

  # ─── ADHYAYA 1 PADA 3: ARGALA (INTERVENTION) ───

  - rule_id: JAIMINI.1.3.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.3.1"
      text_excerpt: |
        "Argala" — the word means 'bolt' or 'intervention'. A planet or rashi
        creates an argala (intervention / supporting influence) on another rashi
        or planet when it occupies specific positions relative to the reference
        point. (Rath: Argala is the mechanism by which planets in specific houses
        support or modify the results of the primary rashi/house.)
    condition: |
      Planets or rashis occupy positions 2nd, 4th, 5th, or 11th from a reference
      rashi or planet.
    assertion: |
      Planets in the 2nd, 4th, 5th, and 11th positions from a reference point
      create primary argala (positive intervention) on that reference point,
      modifying and usually supporting its results.
    scope: misc
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Sutra declarative implicit form (0.85) × confirmed by multiple Jaimini commentators (1.15) = 0.85 (cap)"
    caveats: |
      The 5th house argala is contested: some commentators include it (Rath, K.N. Rao),
      others recognize only 2nd, 4th, 11th as primary argala positions.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.3.1.2
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.3.1"
      text_excerpt: |
        Virodha argala (obstruction): planets in the 3rd, 10th, and 9th positions
        from the reference point create virodha (obstruction) argala — they
        obstruct and cancel the primary argala from the corresponding positions.
        3rd obstructs the 11th argala; 10th obstructs the 4th argala;
        9th obstructs the 5th argala. (Rath: Must have MORE planets in obstructing
        position than in argala position to obstruct effectively.)
    condition: |
      Planets occupy the 3rd, 10th, or 9th positions from a reference rashi.
    assertion: |
      Planets in the 3rd position obstruct the 11th-house argala; planets in
      the 10th obstruct the 4th-house argala; planets in the 9th obstruct the
      5th-house argala. Obstruction is effective only when the number of planets
      in the obstruction position exceeds the number in the argala position.
    scope: misc
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by Rath and K.N. Rao (1.15) = 0.85; reduced to 0.80 for the counting rule which is interpretive"
    caveats: |
      The '12th position also obstructs 2nd argala' rule: Rath includes this;
      other commentators differ. The numerical superiority rule (more planets = effective
      obstruction) is Rath's interpretation; not all commentators apply this quantification.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.3.2.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.3.2"
      text_excerpt: |
        "Papargala" — malefic planets (Sun, Mars, Saturn, Rahu, Ketu) in the
        argala positions create a malefic argala (papargala) — the intervention
        is harmful or obstructing in nature. Benefic planets (Jupiter, Venus,
        Mercury waxing, Moon waxing) create subhargala — beneficial intervention.
        (Rath: The nature of argala = nature of the planet creating it.)
    condition: |
      A planet occupies an argala position (2nd, 4th, 5th, or 11th) from a
      reference point; the planet's classification as malefic or benefic determines
      the quality of the argala.
    assertion: |
      Malefic planets in argala positions create papargala (harmful intervention
      or mixed/challenging results); benefic planets create subhargala (supportive
      intervention and favorable results).
    scope: misc
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by tradition (1.15) = 0.85; reduced to 0.80 for the qualitative classification layer"
    caveats: |
      Functional malefics vs. natural malefics: Jaimini uses natural malefic/benefic
      classification. Some modern commentators apply functional malefics (lagna-lord
      based), which is a Parashari concept not native to Jaimini.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.3.3.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.3.3"
      text_excerpt: |
        "Argala from Atmakaraka and lagna are most important" — among all argalas
        in a chart, those formed from the Atmakaraka and from the Lagna carry the
        greatest interpretive weight. Argalas modifying the AK indicate what
        supports or obstructs the soul's purpose. (Rath: Always compute argala
        from AK and Lagna first.)
    condition: |
      Argala analysis is performed on the Atmakaraka or the Janma Lagna as the
      reference point.
    assertion: |
      Argalas from the Atmakaraka and from the Lagna are the most important in
      the chart, governing the soul's purpose and overall life direction respectively.
      These argalas take priority in interpretation over argalas from other reference points.
    scope: misc
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × commentary-based hierarchy (1.0) = 0.85; reduced to 0.80"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.3.4.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.3.4"
      text_excerpt: |
        Argala works in both direct and reverse count. Planets 2nd from reference
        create argala; so do planets 12th from reference (counted in reverse).
        (Rath: The 12th argala is a secondary or 'muted' argala — less powerful
        than the primary 2nd argala but still operative.)
    condition: |
      A planet occupies the 12th position from a reference point (counting backward).
    assertion: |
      The 12th house from any reference point also creates a secondary argala on
      that reference point, though weaker than the primary 2nd-house argala.
    scope: misc
    school: jaimini
    confidence: 0.65
    confidence_rationale: "Implicit sutra form (0.85) × partial cross-text: 12th argala is Rath-specific and not found in Iranganti (0.85) = 0.72; reduced to 0.65 for contested status"
    caveats: |
      The 12th-house argala is specifically Rath's interpretation and is NOT found in
      Iranganti Rangacharya's or K.N. Rao's readings. Treat as commentarial addition,
      not universal Jaimini doctrine.
    verified: true
    stub: false
    stub_reason: null

  # ─── ADHYAYA 1 PADA 4: SPECIAL LAGNAS AND FOUNDATIONAL YOGAS ───

  - rule_id: JAIMINI.1.4.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.4.1"
      text_excerpt: |
        "Varnada lagna" — Varnada Lagna is calculated from both Lagna and Hora
        Lagna: take the faster of the two (i.e., the one that has advanced more
        in the sign); count from Aries if both are in odd signs or both in even
        signs; count from Pisces if one is in an odd and one in an even sign.
        (Rath: VL indicates the social station/varna of the native.)
    condition: |
      Hora Lagna and Janma Lagna positions are known; Varnada Lagna is to be
      calculated from these two reference points using the odd/even sign rule.
    assertion: |
      Varnada Lagna indicates the native's varna (social station), profession
      class, and social environment. Planets in or aspecting Varnada Lagna and
      its lord indicate the quality and direction of social life and career class.
    scope: misc
    school: jaimini
    confidence: 0.75
    confidence_rationale: "Prose commentary with calculation (0.85 × 0.85 for implicit context) × no cross-text contradiction (1.0) = 0.72; rounded to 0.75"
    caveats: |
      The calculation of VL differs between commentators. Rath's method above is
      one approach; Sanjay Rath's students (PJC tradition) use this method. Results
      vary by lagna and by birth time precision.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.4.2.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.4.2"
      text_excerpt: |
        "Sthira karaka vs chara karaka" — Jaimini uses two karaka systems: the
        Chara (movable) karakas based on planetary degrees (see 1.1.5), and the
        Sthira (fixed) karakas based on permanent assignments. Sthira karakas:
        Sun=father, Moon=mother, Mars=sibling, Mercury=relatives, Jupiter=children,
        Venus=spouse, Saturn=servants/death. (Rath: Sthira karakas give permanent
        background; Chara karakas give dynamic, lifetime-specific results.)
    condition: |
      The Sthira karaka system is being used (fixed planetary assignments for
      life domains, independent of degree positions).
    assertion: |
      In the Sthira karaka system: Sun governs the father; Moon governs the
      mother; Mars governs siblings and younger co-borns; Mercury governs uncles
      and maternal relatives; Jupiter governs children and husband (for females);
      Venus governs the spouse (for males) and happiness; Saturn governs death,
      servants, and longevity.
    scope: misc
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × partially confirmed by Parashari tradition (1.0) = 0.85; reduced to 0.80 for mixed Parashari overlap"
    caveats: |
      Sthira karakas are used for longevity calculations and some family-member
      assessments. They overlap with Parashari natural significators and care must
      be taken not to conflate the two systems. Results vary by lagna.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.4.3.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.4.3"
      text_excerpt: |
        "Atmakaraka exalted in navamsha brings liberation" — when the Atmakaraka
        is in its sign of exaltation in the Navamsha, or when it occupies the
        navamsha of its own sign (swamsha of AK), the native is inclined toward
        liberation (moksha) and spiritual attainment. (Rath: AK in exaltation in
        D9 = rajayoga-level for spirituality; moksha-karaka activated.)
    condition: |
      The Atmakaraka occupies its exaltation sign in the Navamsha (D9) chart.
    assertion: |
      A native with Atmakaraka exalted in Navamsha is strongly inclined toward
      spiritual attainment, liberation, and moksha; worldly achievements may be
      secondary to inner development. This is one of the strongest spiritual
      combinations in Jaimini.
    scope: divisional
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by Jaimini commentary tradition (1.15) = 0.85; reduced to 0.80 for the moksha-framing being interpretive"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.1.4.4.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "1.4.4"
      text_excerpt: |
        "Swamsha lagna" — Swamsha is the rashi (sign) that the Atmakaraka occupies
        in the Navamsha chart. This sign becomes the Karakamsha Lagna for the
        purpose of Jaimini analysis. In the NATAL chart, when Atmakaraka's navamsha
        sign coincides with the natal Lagna, this is called Swamsha and gives
        exceptional results. (Rath: Swamsha = navamsha position of AK cast back
        into the natal chart as a special lagna.)
    condition: |
