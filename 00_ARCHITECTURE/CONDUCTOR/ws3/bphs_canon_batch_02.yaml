  # ─── HORA STRENGTH — SUN AND MOON HORA (BPHS Ch. 8) ────────────────────────

  - rule_id: BPHS.8.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "8.2"
      text_excerpt: |
        "Each sign is divided into two Horas (halves). The first half (1–15°) of odd signs
        is the Sun's Hora; the second half (16–30°) is the Moon's Hora. For even signs, the
        first half is the Moon's Hora, the second half the Sun's Hora. A planet in the Sun's
        Hora gives wealth through father; in Moon's Hora through mother."
    condition: >
      A planet is in the first or second half of an odd or even sign, and its Hora placement
      is being evaluated.
    assertion: >
      Hora placement: Odd signs (Aries, Gemini, Leo, Libra, Sagittarius, Aquarius):
      1–15° = Sun's Hora, 16–30° = Moon's Hora. Even signs (Taurus, Cancer, Virgo,
      Scorpio, Capricorn, Pisces): 1–15° = Moon's Hora, 16–30° = Sun's Hora.
      A planet in Sun's Hora supports wealth from the father's side; in Moon's Hora
      from the mother's side.
    scope: divisional
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative = 1.0; confirmed by Brihat Jataka Ch. 1 = 1.15. 0.88 (practical
      application of Hora is narrow — this is a D2 divisional, less commonly used).
    caveats: >
      Hora (D2) is one of the 16 divisional charts. Its primary application is assessing
      wealth from the paternal vs maternal sides. The broader D2 analysis follows the
      same rules as D1.
    verified: true
    stub: false
    stub_reason: null

  # ─── DREKKANA (D3) — SIBLINGS AND CO-BORNS (BPHS Ch. 9) ────────────────────

  - rule_id: BPHS.9.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "9.2"
      text_excerpt: |
        "Each sign is divided into three Drekkanas (decanates) of 10° each. The first
        Drekkana of each sign is ruled by the sign itself. The second Drekkana is ruled
        by the 5th sign from that sign. The third Drekkana is ruled by the 9th sign.
        The Drekkana chart (D3) governs siblings and co-borns."
    condition: >
      A planet is in the first, second, or third decanate (Drekkana) of a sign and
      its D3 (Drekkana chart) position is being assessed.
    assertion: >
      Drekkana rulership: 1st decanate (0–10°) of each sign = that sign itself;
      2nd decanate (10–20°) = 5th sign from that sign; 3rd decanate (20–30°) = 9th sign.
      The D3 chart governs siblings, co-borns, and the 3H significations. The 3H lord
      and Mars in D3 specifically indicate the quality and fate of siblings.
    scope: divisional
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with specific rulership assignment = 1.0; confirmed by Brihat Jataka = 1.15.
      0.92.
    caveats: null
    verified: true
    stub: false
    stub_reason: null

