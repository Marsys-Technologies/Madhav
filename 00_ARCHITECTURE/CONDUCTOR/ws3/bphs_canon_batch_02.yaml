      canonical_id: BPHS
      verse_ref: "93.2"
      text_excerpt: |
        "An auspicious muhurta (election chart) should be chosen such that the Lagna of
        the muhurta is not afflicted and does not fall in the 6th, 8th, or 12th sign
        from the native's natal Lagna. The muhurta Lagna in a kendra or trikona from
        the natal Lagna is most auspicious."
    condition: >
      A muhurta (election chart) is being chosen for an important event for a specific native.
    assertion: >
      Muhurta Lagna should be in a kendra (1H, 4H, 7H, 10H) or trikona (1H, 5H, 9H)
      from the native's natal Lagna for maximum benefit. Muhurta Lagna in the 6th,
      8th, or 12th from natal Lagna creates inauspicious conditions. This is the
      primary muhurta-to-natal-chart integration rule.
    scope: muhurta
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative = 1.0; confirmed by Muhurta Chintamani and general muhurta tradition = 1.15.
      0.88.
    caveats: >
      Muhurta analysis combines the election chart (muhurta lagna), the native's natal
      chart, and panchang factors (tithi, vara, nakshatra, yoga, karana). The muhurta-to-
      natal integration is one component — the natal chart's running dasha must also
      support the activity.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.93.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "93.3"
      text_excerpt: |
        "In a muhurta, avoid placing the Moon in the 8th or 12th house. Avoid the Moon
        in the sign occupied by natal Saturn, natal Rahu, or natal Mars without strong
        benefic support. The Moon in 1H, 4H, 7H, 10H of the muhurta is generally
        auspicious."
    condition: >
      Moon's placement in a muhurta (election chart) is being evaluated.
    assertion: >
      Muhurta Moon placement rules: avoid Moon in 8H or 12H of the election chart;
      avoid Moon in the natal sign of Saturn, Rahu, or Mars (without benefic aspects);
      prefer Moon in kendras of the muhurta chart (1H, 4H, 7H, 10H). Moon placement
      is the most important factor after Lagna in muhurta selection.
    scope: muhurta
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative with avoidance rules = 1.0; confirmed by traditional muhurta texts = 1.15.
      0.88.
    caveats: >
      The rule to avoid Moon in the natal position of Saturn/Rahu/Mars reflects the
      concept of natal planetary toxicity in a given sign. This is a refining rule —
      the primary muhurta criteria (Lagna, tithi, vara, nakshatra) take precedence.
    verified: true
    stub: false
    stub_reason: null

  # ─── SPECIAL YOGAS — PARIVARTANA YOGA TYPES (BPHS Ch. 72) ──────────────────

  - rule_id: BPHS.72.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "72.2"
      text_excerpt: |
        "Parivartana yoga (sign exchange) occurs when two planets occupy each other's
        signs of rulership. There are three types: Maha Parivartana (exchange between
        kendra and trikona lords), Dainya Parivartana (exchange involving a dusthana lord),
        and Kahala Parivartana (exchange between other combinations)."
    condition: >
      Two planets occupy each other's sign of rulership (mutual sign exchange).
    assertion: >
      Three types of Parivartana: (1) Maha Parivartana — exchange between lords of
      kendra houses (1H, 4H, 7H, 10H) and trikona houses (1H, 5H, 9H) creates
      powerful raja yoga results; (2) Dainya Parivartana — exchange involving a
      dusthana lord (6H, 8H, or 12H) creates challenges and mixed results;
      (3) Kahala Parivartana — exchange between other house lords creates
      medium results. The house combination determines the yoga type.
    scope: yoga
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with three-type taxonomy = 1.0; confirmed by Phaladeepika and Saravali = 1.15.
      capped at 0.92.
    caveats: >
      The three-type classification gives the general framework. The specific results
      depend on: (a) dignity of both exchanging planets; (b) aspects on each planet;
      (c) the Lagna itself. A strong Maha Parivartana between yogakarakas produces
      extraordinary results; a Maha Parivartana between weakly placed planets gives
      more modest outcomes.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.72.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "72.3"
      text_excerpt: |
        "Maha Parivartana between the 9th and 10th lords is the Dharmakarmadhipati yoga
        in its exchange form — the most powerful of all Maha Parivartana configurations.
        It grants fame, wealth, authority, and dharmic success."
    condition: >
      Lords of the 9th house and 10th house are in mutual sign exchange (parivartana).
    assertion: >
      9H–10H lord parivartana is the strongest form of Dharmakarmadhipati yoga —
      granting extraordinary career success, dharmic fame, and financial prosperity.
      The exchange intensifies both lords' mutual support, creating a virtuous cycle
      between fortune (9H) and action (10H).
    scope: yoga
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with named yoga = 1.0; confirmed by Phaladeepika and Saravali = 1.15.
      capped at 0.92.
    caveats: >
      The 1H (Lagna) also counts as both a kendra and a trikona, so 1H–9H, 1H–5H,
      1H–10H, 9H–10H are all Maha Parivartana configurations. Of these, 9H–10H
      exchange is traditionally cited as the most powerful for worldly success.
    verified: true
    stub: false
    stub_reason: null

  # ─── SPECIAL YOGAS — VIPAREET RAJA YOGA DETAILED (BPHS Ch. 73) ──────────────

  - rule_id: BPHS.73.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "73.2"
      text_excerpt: |
        "Vipareet Raja Yoga occurs when the lords of the 6th, 8th, and 12th houses are
        in each other's houses or in their own houses (dusthana lords in dusthanas).
        Three named forms: Harsha (6H lord in 6H or 8H or 12H), Sarala (8H lord in 6H
        or 8H or 12H), and Vimala (12H lord in 6H or 8H or 12H)."
    condition: >
      Lords of dusthana houses (6H, 8H, 12H) are placed in other dusthana houses
      (or in their own dusthana house).
    assertion: >
      Vipareet Raja Yoga has three named forms: (1) Harsha Yoga — 6H lord in 6H, 8H, or
      12H; gives victory over enemies, good health, competitive success; (2) Sarala Yoga —
      8H lord in 6H, 8H, or 12H; protects longevity, gives fearlessness and occult ability;
      (3) Vimala Yoga — 12H lord in 6H, 8H, or 12H; reduces expenditure and losses,
      gives spiritual liberation tendency. Any of these produces raja yoga results after
      overcoming initial obstacles.
    scope: yoga
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with three named yogas = 1.0; confirmed by Phaladeepika, Saravali,
      Brihat Jataka (≥2 texts) = 1.3. capped at 0.92.
    caveats: >
      The qualifying condition for Vipareet Raja Yoga: the dusthana lord must not
      be conjunct with the Lagna lord or with a natural benefic, as this weakens
      the vipareet effect by "rescuing" the dusthana lord and sending its malefic
      energy toward positive houses instead.
    verified: true
    stub: false
    stub_reason: null

  # ─── SPECIAL COMBINATIONS — MAHAPURUSHA YOGAS (BPHS Ch. 74) ────────────────

  - rule_id: BPHS.74.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "74.2"
      text_excerpt: |
        "The five Mahapurusha Yogas are formed when one of the five tara grahas
        (Mars, Mercury, Jupiter, Venus, Saturn) is in its exaltation or own sign AND
        in a kendra house (1st, 4th, 7th, or 10th) from the Lagna: Ruchaka (Mars),
        Bhadra (Mercury), Hamsa (Jupiter), Malavya (Venus), Shasha (Saturn)."
    condition: >
      A tara graha (Mars, Mercury, Jupiter, Venus, or Saturn) is simultaneously in
      its exaltation or own sign AND in a kendra house from the Lagna.
    assertion: >
      Five Mahapurusha Yogas: (1) Ruchaka — Mars in own sign (Aries/Scorpio) or
      exaltation (Capricorn) in a kendra — gives military prowess, authority, heroism;
      (2) Bhadra — Mercury in own sign (Gemini/Virgo) or exaltation (Virgo) in a
      kendra — gives intelligence, eloquence, financial acumen; (3) Hamsa — Jupiter
      in own sign (Sagittarius/Pisces) or exaltation (Cancer) in a kendra — gives
      wisdom, dharmic greatness, fame; (4) Malavya — Venus in own sign (Taurus/Libra)
      or exaltation (Pisces) in a kendra — gives beauty, luxury, arts, conjugal happiness;
      (5) Shasha — Saturn in own sign (Capricorn/Aquarius) or exaltation (Libra) in
      a kendra — gives service authority, discipline, industry leadership.
    scope: yoga
    school: parashari
    confidence: 0.95
    confidence_rationale: >
      Declarative with five named yogas and specific conditions = 1.0; confirmed by
      Brihat Jataka, Saravali, Phaladeepika (≥2 texts) = 1.3. capped at 0.95.
    caveats: >
      Mahapurusha Yoga requires both conditions simultaneously: own/exalted sign AND
      kendra. A planet in its own sign in a non-kendra house does not qualify.
      The yoga is strongest for the rising sign associated with the planet (e.g.,
      Hamsa yoga is strongest when Jupiter is in Cancer Lagna conjunct 1H or in 4H
      from the Lagna).
    verified: true
    stub: false
    stub_reason: null

  # ─── SPECIAL COMBINATIONS — DHANA YOGAS (BPHS Ch. 26 extended) ──────────────

  - rule_id: BPHS.26.65.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "26.65"
      text_excerpt: |
        "Dhana yoga is formed when the lords of the 2nd and 11th houses are in mutual
        relationship (conjunction, aspect, or exchange) with the lords of 1st, 5th, or
        9th houses. The strength and quality of the Dhana yoga depends on the dignity
        and house placement of these lords."
    condition: >
      Lords of the 2H and 11H are in conjunction, mutual aspect, or sign exchange with
      lords of the 1H, 5H, or 9H.
    assertion: >
      Dhana yoga (wealth yoga) forms when the lords of wealth houses (2H, 11H) connect
      with lords of the trikona houses (1H, 5H, 9H). The yoga produces wealth commensurate
      with the dignity of the participating lords. Multiple overlapping Dhana yogas
      compound: a chart with 3+ Dhana yoga formations involving strong planets produces
      exceptional wealth.
    scope: yoga
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Sloka = 0.8; confirmed by Phaladeepika and Saravali = 1.15. 0.88.
    caveats: >
      Dhana yoga activation occurs primarily during the dashas of the participating
      planets. A Dhana yoga involving Saturn or Mars lords will manifest with delays
      or intensity characteristic of those planets, not as immediate easy wealth.
    verified: true
    stub: false
    stub_reason: null

  # ─── NAKSHATRA-BASED RULES — TARA BALA (BPHS Ch. 35) ───────────────────────

  - rule_id: BPHS.35.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "35.2"
      text_excerpt: |
        "The nine Taras (lunar mansions counted from natal Moon nakshatra) govern
        auspiciousness for activities. Janma (1st), Sampat (2nd), Vipat (3rd), Kshema (4th),
        Pratyak (5th), Sadhana (6th), Naidhana (7th), Mitra (8th), Parama Mitra (9th).
        Then the cycle repeats."
    condition: >
      A specific nakshatra is being evaluated for its Tara relationship to the natal
      Moon nakshatra.
    assertion: >
      Tara Bala (birth-star strength) evaluates nakshatras as Taras from the natal
      Moon nakshatra: Janma (1st = birth star, sensitive), Sampat (2nd = wealth),
      Vipat (3rd = danger/obstacles), Kshema (4th = wellbeing), Pratyak (5th = obstacle),
      Sadhana (6th = achievement), Naidhana (7th = death-like danger), Mitra (8th = friend),
      Parama Mitra (9th = great friend). The cycle repeats three times through 27 nakshatras.
    scope: nakshatra
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with enumeration = 1.0; confirmed by Muhurta Chintamani and Phaladeepika = 1.15.
      0.92.
    caveats: >
      Tara Bala is widely used in muhurta (election) and marriage compatibility
      (Ashtakuta) analysis, not only in natal delineation. The 3rd Tara (Vipat) and
      7th Tara (Naidhana) are the most inauspicious; avoid them for important activities.
    verified: true
    stub: false
    stub_reason: null

