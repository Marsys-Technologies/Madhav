  # ─── SHADBALA EXTENDED — STHANABALA COMPONENTS (BPHS Ch. 87) ────────────────

  - rule_id: BPHS.87.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "87.2"
      text_excerpt: |
        "Sthanabala has five components: Uchcha (exaltation) bala, Saptavargaja bala
        (strength from seven divisionals), Ojayugmarasyamsa bala (odd/even sign strength),
        Kendradi bala (strength from house position — kendra, succedent, cadent), and
        Drekkana bala (triplicity/decanate strength)."
    condition: >
      Sthanabala (positional strength) is being computed for a planet in Shadbala analysis.
    assertion: >
      Sthanabala has five sub-components: (1) Uchcha bala — strength based on proximity
      to exaltation (maximum at deep exaltation, minimum at deep debilitation);
      (2) Saptavargaja bala — strength based on placement across 7 divisional charts;
      (3) Ojayugmarasyamsa bala — planets in odd signs get strength in Day charts,
      even signs in Night charts; (4) Kendradi bala — kendra placement (3 rupas) >
      succedent (2 rupas) > cadent (1 rupa); (5) Drekkana bala — male planets in
      1st decanate, female in 2nd decanate, neuter in 3rd decanate get maximum strength.
    scope: shadbala
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with five enumerated sub-components = 1.0; confirmed by Brihat Jataka
      Shadbala chapter = 1.15 corroboration. 0.92.
    caveats: >
      Full Saptavargaja bala computation requires evaluating all 7 divisional charts
      (D1, D2, D3, D7, D9, D12, D30) and summing strength from each. This is algorithmically
      complex and requires software. The formula: own sign = 30 virupas, great friend = 22.5,
      friend = 15, neutral = 7.5, enemy = 3.75, great enemy = 1.875, debilitation = 0 (per sign).
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.87.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "87.3"
      text_excerpt: |
        "Kalabala has seven sub-components: Natonnata bala (day/night — day planets gain
        during day, night planets during night), Paksha bala (Moon's phase — benefics
        gain in Shukla Paksha, malefics in Krishna Paksha), Tribhaga bala (day divided
        in three parts), Abda/Masa/Dina/Hora bala (year/month/day/hour lord strength),
        and Ayana bala (hemisphere)."
    condition: >
      Kalabala (time-based strength) is being computed for a planet.
    assertion: >
      Kalabala has seven sub-components reflecting temporal placement. Key components:
      (1) Natonnata bala — Sun, Jupiter, Venus are day planets (strong by day);
      Moon, Mars, Saturn are night planets (strong by night); Mercury is both.
      (2) Paksha bala — benefics gain strength in bright half (Shukla Paksha);
      malefics in dark half (Krishna Paksha); Moon increases from 0 to 60 rupas
      over the bright fortnight.
      (3) Hora bala — the planet that rules the birth hora (hour) gets maximum hora bala.
      (4) Ayana bala — Sun is strong in Uttarayana (northern course); Moon in Dakshinayana.
    scope: shadbala
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Sloka with seven sub-components = 0.8; confirmed by Brihat Jataka, Saravali = 1.15.
      min(1.0, 0.8 × 1.15) = 0.88.
    caveats: >
      Paksha bala for Moon is the most variable component — at Purnima (full moon)
      Moon has maximum Paksha bala (60 rupas); at Amavasya (new moon) it has minimum.
      This directly impacts Moon's total Shadbala score.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.87.4.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "87.4"
      text_excerpt: |
        "Cheshtabala: A planet in full retrograde motion receives maximum cheshtabala
        (60 virupas). A planet in slow direct motion receives less. A combust planet
        receives near-zero cheshtabala. The Moon receives Paksha bala as a proxy
        for cheshtabala."
    condition: >
      Cheshtabala (motional strength) is being assessed based on a planet's movement state.
    assertion: >
      Cheshtabala hierarchy: retrograde = maximum (60 virupas); direct but stationary =
      high; direct in normal speed = moderate; combust = near-zero. The Moon does not
      receive traditional Cheshtabala but receives Paksha bala in its place.
      Retrograde planets are paradoxically considered powerful in Shadbala despite
      being functionally problematic in interpretation.
    scope: shadbala
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Sloka with conditional hierarchy = 0.8; confirmed by Brihat Jataka = 1.15. 0.88.
    caveats: >
      The paradox of retrograde = high Cheshtabala is a pure computational rule.
      Interpretively, retrograde planets are often problematic — they have strength
      (Shadbala) but their results may be delayed, reversed, or internal rather than
      manifest outwardly.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.87.5.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "87.5"
      text_excerpt: |
        "Drikbala (aspectual strength) is positive when a planet receives aspects from
        natural benefics (Jupiter, Venus, waxing Moon, Mercury unafflicted) and negative
        when it receives aspects from natural malefics (Sun, Mars, Saturn, waning Moon,
        Rahu, Ketu). The net Drikbala can be positive or negative, affecting total Shadbala."
    condition: >
      A planet's Drikbala is being computed based on the aspects it receives.
    assertion: >
      Drikbala is the net aspectual strength: aspects from natural benefics add positive
      Drikbala; aspects from natural malefics subtract. A planet heavily aspected by
      malefics will have negative Drikbala, reducing its total Shadbala below the
      sum of its other five strengths.
    scope: shadbala
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative = 1.0; but Drikbala calculation formula has some variation across
      sources; 1 confirming text = 1.15. 0.88.
    caveats: >
      Drikbala is the only Shadbala component that can be negative, potentially reducing
      a planet's total Shadbala even when all other components are strong.
    verified: true
    stub: false
    stub_reason: null

  # ─── ISHTA/KASHTA PHALA — RESULT QUALIFICATION (BPHS Ch. 88) ────────────────

  - rule_id: BPHS.88.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "88.2"
      text_excerpt: |
        "Ishta phala (auspicious result potential) = square root of (Uccha bala × Cheshtabala).
        Kashta phala (inauspicious result potential) = square root of (Neecha bala × Nichesta bala).
        A planet's net benefic potential = Ishta phala minus Kashta phala."
    condition: >
      Ishta phala and Kashta phala are being computed to determine a planet's net
      benefic vs malefic result potential.
    assertion: >
      Ishta phala = √(Uchcha bala × Cheshtabala); represents auspicious result potential.
      Kashta phala = √(Neecha bala × Nichesta bala); represents inauspicious result potential.
      Net benefic = Ishta phala − Kashta phala. A planet with high Ishta and low Kashta
      gives predominantly positive results; the reverse gives challenging results.
    scope: shadbala
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative mathematical formula = 1.0; 1 confirming text (Brihat Jataka Shadbala
      chapter confirms the formula) = 1.15. 0.88 (formula variation across sources).
    caveats: >
      Neecha bala = (60 − Uchcha bala) and Nichesta bala = (60 − Cheshtabala). The
      Ishta/Kashta system provides a summary measure but should not substitute for
      full chart interpretation.
    verified: true
    stub: false
    stub_reason: null

