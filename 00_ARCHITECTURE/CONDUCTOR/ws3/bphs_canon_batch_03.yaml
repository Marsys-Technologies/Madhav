  - rule_id: BPHS.32.10.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "32.10"
      text_excerpt: |
        "If the Atmakaraka is Saturn, the native will have karmic lessons in service,
        discipline, and working through hardship. Saturn as Atmakaraka often indicates
        a soul that has accumulated karmas of control and must learn to serve without
        attachment to results."
    condition: >
      The Atmakaraka is Saturn.
    assertion: >
      Saturn as Atmakaraka: soul orientation = karmic purification through service,
      discipline, and endurance; the soul's lesson involves breaking free from rigid
      control patterns and learning detached service (nishkama karma). The native
      frequently experiences delays and obstacles that are karmic in nature.
    scope: graha
    school: parashari
    confidence: 0.85
