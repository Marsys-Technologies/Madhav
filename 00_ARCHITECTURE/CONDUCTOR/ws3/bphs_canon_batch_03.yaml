      Sloka = 0.8; Jaimini cross-text confirm = 1.15. 0.85 (interpretation of "service
      without attachment" is commentary tradition, not purely the verse's own words).
    caveats: >
      R3 caveat: Saturn AK results vary significantly by Lagna. For Taurus or Libra
      Lagnas with Saturn as yogakaraka AND AK, the karmic challenge is mitigated by
      Saturn's favorable functional lordship.
    verified: true
    stub: false
