        "If the Atmakaraka is Jupiter, the native will be deeply spiritual, learned,
        and devoted to truth. If the Atmakaraka is Venus, the native will be oriented
        toward beauty, relationships, pleasure, and the arts as the soul's primary
        mode of expression."
