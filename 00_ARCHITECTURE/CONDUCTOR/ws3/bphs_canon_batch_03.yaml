  # ─── BHAVA STRENGTHENING AND WEAKENING RULES (BPHS Ch. 11) ──────────────────

  - rule_id: BPHS.11.23.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "11.23"
      text_excerpt: |
        "A bhava is strengthened when its lord is in a kendra, when it receives benefic
        aspects, when its lord is in a friendly sign or in exaltation, and when the
        natural karaka of the bhava is strong. A bhava is weakened when these conditions
        are reversed."
    condition: >
      A bhava's strength is being assessed based on its lord's position, aspects received,
      and karaka condition.
    assertion: >
      Bhava (house) strength is maximised when: (1) house lord is in a kendra or trikona;
      (2) house receives aspects from natural benefics; (3) house lord is in exaltation,
      own sign, or friendly sign; (4) natural karaka of the house is strong.
      Bhava is weakened when: (1) house lord is in a dusthana; (2) malefics occupy or
      aspect the house; (3) house lord is in debilitation or enemy sign; (4) natural
      karaka is weak or afflicted.
    scope: bhava
    school: parashari
    confidence: 0.92
    confidence_rationale: >
      Declarative with four-condition enumeration = 1.0; confirmed by Phaladeepika
      and Saravali = 1.15. 0.92.
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.11.24.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "11.24"
      text_excerpt: |
        "When a malefic planet occupies a bhava, the bhava is partially damaged even if
        the lord is strong. However, a strong lord in a kendra can overcome the malefic
        occupation and restore the bhava's full strength."
    condition: >
      A natural malefic (Sun, Mars, Saturn, Rahu, Ketu, waning Moon) occupies a bhava.
    assertion: >
      A malefic occupying a bhava damages its significations partially, even if the
      house lord is strong. The lord's strength can overcome the malefic occupation
      IF the lord is well-placed (kendra or exaltation). If the lord is also weak,
      the malefic occupation becomes devastating for that bhava.
    scope: bhava
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Sloka with conditional qualifier = 0.8; confirmed by Phaladeepika = 1.15. 0.88.
    caveats: >
      Natural malefics (Sun, Mars, Saturn) in kendras actually have low kendradhipati
      dosha risk when they are natural malefics — the rule applies differently to natural
      vs functional malefics. Mars in 1H damages the 1H as a malefic but may be
      the Lagna lord (for Aries Lagna) simultaneously — context required.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.11.25.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "11.25"
      text_excerpt: |
        "The presence of a natural benefic planet in a bhava strengthens that bhava's
        significations even if the lord is weak, provided the benefic is not combust
        or debilitated. Jupiter in a bhava always imparts its divine grace to that bhava."
    condition: >
      A natural benefic (Jupiter, Venus, unafflicted Mercury, waxing Moon) occupies a bhava.
    assertion: >
      A natural benefic in a bhava enhances its significations even when the house lord
      is weak, provided the benefic is not combust or debilitated. Jupiter is the
      most potent bhava-strengthener — its presence in any house imparts wisdom,
      expansion, and divine grace to that house's significations.
    scope: bhava
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Sloka = 0.8; confirmed by Phaladeepika and Saravali on Jupiter's bhava grace = 1.15.
      0.88.
    caveats: >
      Exception: benefics in dusthana houses (6H, 8H, 12H) may paradoxically weaken
      their own benefic quality by being consumed by the dusthana. Jupiter in 8H, for
      instance, may give spiritual benefit but reduces its capacity to protect the
      significations of the houses it lords.
    verified: true
    stub: false
    stub_reason: null

  # ─── PANCHANGA-NATAL INTEGRATION (BPHS Ch. 60) ──────────────────────────────

  - rule_id: BPHS.60.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "60.2"
      text_excerpt: |
        "The tithi (lunar day) at birth influences the native's wealth, vitality, and
        relationship with the Moon. Natives born on Purnima (full Moon) are strong,
        famous, and well-connected. Natives born on Amavasya (new Moon) may face
        initial challenges but have deep inner strength and connection to ancestors."
    condition: >
      The tithi (lunar day) at birth is being evaluated for its influence on the native.
    assertion: >
      Birth tithi shapes the Moon's power in the chart: Purnima birth (full Moon) gives
      a strong Moon with maximum Paksha bala — the native is robust, famous, and
      well-supported. Amavasya birth (new Moon) gives weak Moon Paksha bala but
      strong connection to ancestral karma (Pitru connection) and deep inner resources.
    scope: nakshatra
    school: parashari
    confidence: 0.80
    confidence_rationale: >
      Sloka = 0.8; 1 confirming text (traditional muhurta/jataka texts on birth tithi) = 1.15.
      0.80.
    caveats: >
      Amavasya birth with weak Moon is modifiable by strong Lagna and Lagna lord.
      The "deep inner strength" of Amavasya birth is a commentary-tradition interpretation
      of the Moon's Pitru-connection quality. The primary reading is that Amavasya Moon
      has minimal Paksha bala.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.60.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "60.3"
      text_excerpt: |
        "Shukla Paksha (waxing Moon) births are generally more auspicious than Krishna
        Paksha (waning Moon) births, especially for the Moon's significations. For
        activities requiring initiative and growth, Shukla Paksha is preferred."
    condition: >
      A native is born in Shukla Paksha (waxing Moon, tithi 1–15 of bright fortnight)
      or Krishna Paksha (waning Moon, tithi 1–15 of dark fortnight).
    assertion: >
      Shukla Paksha birth gives a naturally stronger Moon — the native tends toward
      growth, expansion, and outward expression. Krishna Paksha birth gives a weaker
      Moon — the native's emotional life is more internalised; introspection and
      ancestral karma are stronger themes. Neither is entirely positive or negative —
      the context determines the specific results.
    scope: graha
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative = 1.0; confirmed by Paksha bala calculation in Shadbala = 1.15. 0.88.
    caveats: null
    verified: true
    stub: false
    stub_reason: null

