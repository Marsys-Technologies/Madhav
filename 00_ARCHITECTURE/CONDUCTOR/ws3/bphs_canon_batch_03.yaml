        "Durudhara yoga is formed when planets occupy BOTH the 2nd and 12th from the natal
        Moon simultaneously (excluding Sun). When both 2nd and 12th from Moon have planets,
        the native is wealthy, generous, famous, and has many attendants."
    condition: >
      Planets (other than Sun) are placed in BOTH the 2nd house AND the 12th house
      from the natal Moon simultaneously.
    assertion: >
      Durudhara yoga (planets flanking the Moon) combines Sunapha + Anapha into a
      powerful combination — wealth from both the accumulation side (2nd from Moon)
      and the expenditure/pleasure side (12th from Moon). The native is famous, generous,
      and prosperous with a large social following.
    scope: yoga
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative = 1.0; confirmed by Phaladeepika = 1.15. 0.88.
    caveats: >
      When Sun AND another planet are in 2nd from Moon, and the 12th from Moon has
      a planet, Sunapha applies from the non-Sun planet only. The Sun's presence
      does not diminish Durudhara if a second planet is also present in the relevant house.
    verified: true
    stub: false
    stub_reason: null

  # ─── KARAKAMSHA LAGNA (BPHS Ch. 32) ─────────────────────────────────────────

  - rule_id: BPHS.32.5.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "32.5"
      text_excerpt: |
        "The sign occupied by the Atmakaraka in the Navamsha (D9) chart is called the
        Karakamsha. The Karakamsha Lagna is this sign — it is read as the Lagna for
        the soul's direction in this life. The 12th from Karakamsha reveals the native's
        path toward liberation."
    condition: >
      The Karakamsha Lagna (sign of the Atmakaraka in D9) is being identified and used
      as a reference Lagna for soul-level analysis.
    assertion: >
      Karakamsha Lagna = the sign occupied by the Atmakaraka in the Navamsha (D9).
      This sign is the soul's reference point. The 12th from Karakamsha indicates the
      deity of worship and the path toward moksha. Planets in the 1st from Karakamsha
      in D9 reveal the soul's fundamental nature and primary karma.
    scope: divisional
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative with definitional content = 1.0; confirmed by Jaimini Sutras
      (cross-text agreement on Karakamsha) = 1.15. 0.88.
    caveats: >
      The Karakamsha is the primary tool for the soul-level reading in Jaimini-influenced
      Parashari analysis. It must be distinguished from the regular D9 Lagna. Many software
      programs show "Karakamsha" as a derived Lagna in the D9 chart.
    verified: true
    stub: false
    stub_reason: null

  # ─── ASHTAKAVARGA — INDIVIDUAL PLANET BINDUS AND RESULTS (BPHS Ch. 67) ──────

  - rule_id: BPHS.67.30.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "67.30"
      text_excerpt: |
        "When Jupiter transits a sign in which it has 6 or more bindus in its own
        Prastara chart (Ashtakavarga), the native will experience wealth, progeny-related
        happiness, and spiritual growth during that transit. With 7–8 bindus, the results
        are exceptional."
    condition: >
      Jupiter is transiting a sign where it has 6 or more bindus in its Prastara
      Ashtakavarga.
    assertion: >
      Jupiter transit through a sign with 6+ bindus in Jupiter's own Prastara produces
      wealth, happiness related to children, and spiritual growth. 7–8 bindus = exceptional
      Jupiter transit results. This is also the strongest indicator for child-birth timing
      when combined with 5H dasha activation.
    scope: ashtakavarga
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative with specific bindu threshold = 1.0; confirmed by Saravali = 1.15. 0.88.
    caveats: >
      The 6-bindu threshold applies to Jupiter's Prastara specifically. Cross-reference
      with Saturn's Prastara in the same sign (low Saturn bindus + high Jupiter bindus =
      more challenging period overall despite Jupiter's strength).
    verified: true
    stub: false
    stub_reason: null

  # ─── JAIMINI CHARA KARAKA RESULTS IN BPHS (BPHS Ch. 32 extended) ────────────

  - rule_id: BPHS.32.7.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "32.7"
      text_excerpt: |
        "If the Atmakaraka is the Sun, the native will be dedicated to dharma, authority,
        and government service. If the Atmakaraka is the Moon, the native will be devoted
        to mother, and will have a deep emotional or nurturing quality in all endeavours."
    condition: >
      The Atmakaraka (highest-degree planet) is identified as either the Sun or Moon,
      and the soul's primary motivation is being assessed.
    assertion: >
      Sun as Atmakaraka: the soul's primary motivation is dharma, authority, leadership,
      and service to higher principles; the native is drawn to government, administration,
      or solar dharma. Moon as Atmakaraka: the soul's primary motivation is emotional
      connection, nurturing, protection of others, and devotion; particularly to the
      mother and the community.
    scope: graha
    school: parashari
    confidence: 0.88
    confidence_rationale: >
      Declarative with two-case enumeration = 1.0; confirmed by Jaimini Sutras (cross-text
      corroboration from Jaimini on AK Sun/Moon) = 1.15. 0.88.
    caveats: >
      Atmakaraka interpretation is the soul's primary motivation, not necessarily the
      dominant result in life. A Sun AK native may struggle with ego precisely because
      the soul is learning about dharmic authority — the AK indicates the lesson/desire,
      not an effortless gift.
    verified: true
    stub: false
    stub_reason: null

