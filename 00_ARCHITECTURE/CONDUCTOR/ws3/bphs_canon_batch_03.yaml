  # ─── CHANDRA LAGNA (MOON CHART) ANALYSIS (BPHS Ch. 16-17) ──────────────────

  - rule_id: BPHS.16.8.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "16.8"
      text_excerpt: |
        "The Chandra Lagna (Moon as Lagna) chart should be read alongside the natal Lagna
        chart. When both charts agree on an indication, it is certain. When they conflict,
        the Lagna chart takes precedence but the Moon chart's contrary indication tempers
        the result."
    condition: >
      The Chandra Lagna (horoscope from the Moon as Lagna) and the natal Rashi chart
      are being compared for an indication.
    assertion: >
      Dual-chart method: when both Lagna chart and Chandra Lagna chart show the same
      indication, the result is near-certain. When they conflict, Lagna chart dominates
