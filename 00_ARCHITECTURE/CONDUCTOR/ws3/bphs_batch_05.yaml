      Ashadha, Uttara Bhadrapada; Movable (Chara) = Punarvasu, Swati, Shravana, Dhanishtha,
      Shatabhisha; Fierce (Ugra) = Purva Phalguni, Purva Ashadha, Purva Bhadrapada, Bharani,
      Magha; Soft (Mridu) = Mrigashira, Chitra, Anuradha, Revati; Light (Laghu) = Ashwini,
      Pushya, Hasta, Abhijit; Sharp (Tikshna) = Ardra, Ashlesha, Jyeshtha, Mula; each type
      best suits activities matching its quality.
    scope: nakshatra
    school: parashari
