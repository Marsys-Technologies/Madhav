      verse_ref: "26.55"
      text_excerpt: |
        "The aspect of Saturn on the Moon is considered highly challenging for mental peace.
        Saturn's slow, contracting, and depressing quality applied to the Moon's emotional
        sensitivity creates chronic melancholy, pessimism, or depressive tendencies in the
        native's emotional life."
    condition: Saturn aspects the natal Moon by conjunction, opposition, or special aspect.
    assertion: >
      Saturn's aspect on Moon creates a Saturnine filter on emotional experience; the native's
      emotional life is coloured by Saturn's qualities — chronic melancholy, emotional
      constriction, pessimistic tendencies, and a serious or heavy emotional bearing;
      Jupiter's simultaneous aspect on Moon significantly mitigates this; this combination
      requires active cultivation of emotional lightness and gratitude practices.
    scope: graha
    school: parashari
    confidence: 0.80
    confidence_rationale: "Declarative = 1.0; Saravali confirms Saturn-Moon melancholy = 1.0. 0.80."
    caveats: "Saturn-Moon aspect in own or exaltation sign is much less harmful — a Saturn exalted in Libra aspecting the Moon in Aries is less damaging than a debilitated Saturn in Aries aspecting Moon in Cancer."
