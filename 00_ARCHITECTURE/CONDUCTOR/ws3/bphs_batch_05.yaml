  # ─── NAKSHATRA PADA — NAVAMSHA CONNECTION ────────────────────────────────────

  - rule_id: BPHS.5.35.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "5.35"
      text_excerpt: |
        "Each nakshatra is divided into four padas (quarters) of 3 degrees and 20 minutes each.
        The four padas correspond to the four signs of the same triplicity as the nakshatra's
        sign — Aries through Pisces in sequence from the first nakshatra. The pada position
        determines the navamsha sign."
    condition: A planet's nakshatra pada (quarter) is being determined for navamsha chart construction.
    assertion: >
      Each nakshatra's four padas correspond to a navamsha sign: pada 1 = first sign of the
      corresponding triplicity, pada 2 = second, pada 3 = third, pada 4 = fourth; this is
      the foundational mechanism that produces the D9 navamsha chart; the planet's nakshatra
      pada is essential for determining its navamsha placement.
    scope: nakshatra
    school: parashari
    confidence: 0.92
    confidence_rationale: "Declarative system = 1.0; universally confirmed = 1.15. 0.92."
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  # ─── TARA BALAM ───────────────────────────────────────────────────────────────

  - rule_id: BPHS.5.40.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "5.40"
      text_excerpt: |
        "The Tara (nakshatra) counted from the birth nakshatra indicates the quality of
        transit nakshatras. The 1st, 3rd, 5th, 7th nakshatras from birth are generally
        auspicious. The 2nd (Sampat), 4th (Kshema), 6th (Sadhana), 8th (Mitra), and 9th
        (Parama Mitra) are also favorable. The inauspicious Taras are 1st (Janma), 3rd
        (Vipat), 5th (Pratyak), 7th (Naidhana)."
    condition: The Moon's transit nakshatra is being evaluated relative to the birth nakshatra using Tara Balam.
    assertion: >
      Tara Balam (nakshatra strength from birth star) evaluates Moon's transit quality:
      auspicious Taras from birth nakshatra are Sampat (2nd), Kshema (4th), Sadhana (6th),
      Mitra (8th), and Parama Mitra (9th); inauspicious Taras are Janma (1st = birth),
      Vipat (3rd = obstacle), Pratyak (5th = setback), and Naidhana (7th = danger); the
      9-nakshatra cycle repeats for the full 27 nakshatras.
    scope: nakshatra
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative = 1.0; Saravali confirms Tara Balam sequence = 1.15. 0.88."
    caveats: "The 9-Tara system repeats 3 times across the 27 nakshatras from birth; each cycle of 9 reduces in importance (1st cycle most important, 3rd cycle least)."
    verified: true
    stub: false
    stub_reason: null

