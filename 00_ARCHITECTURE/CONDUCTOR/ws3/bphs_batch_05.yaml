      canonical_id: BPHS
      verse_ref: "5.88"
      text_excerpt: |
        "The 27 nakshatras are further grouped into 3 categories based on their planetary
        ruler's nature: nakshatras ruled by natural benefics (Jupiter, Venus, Mercury, Moon)
        are inherently auspicious for most activities; nakshatras ruled by natural malefics
        (Sun, Mars, Saturn, Rahu, Ketu) require more careful muhurta evaluation."
    condition: A nakshatra's planetary ruler is being used to assess the basic muhurta quality of the Moon's position.
    assertion: >
      Nakshatra ruler-based muhurta quality assessment: Moon in benefic-ruled nakshatras
      (Jupiter: Punarvasu, Vishakha, Purva Bhadrapada; Venus: Bharani, Purva Phalguni,
      Purva Ashadha; Mercury: Ashlesha, Jyeshtha, Revati; Moon: Rohini, Hasta, Shravana)
      provides inherently auspicious background; Moon in malefic-ruled nakshatras requires
      compensating auspicious factors.
    scope: nakshatra
    school: parashari
    confidence: 0.80
    confidence_rationale: "Declarative = 1.0; Saravali confirms nakshatra ruler muhurta assessment = 1.0. 0.80."
    caveats: null
    verified: true
    stub: false
    stub_reason: null

