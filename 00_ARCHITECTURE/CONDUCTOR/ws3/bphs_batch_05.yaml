    assertion: >
      Mars's special 8H aspect is the most intense of Mars's non-opposition aspects;
      the aspected house receives Mars's aggressive and potentially violent energy through
      this special aspect; in transit, when Mars's 8H aspect falls on the natal 8H,
      longevity and health deserve special attention; natally, the house receiving Mars's
      8H aspect is under persistent transformative pressure.
    scope: graha
    school: parashari
    confidence: 0.72
    confidence_rationale: "Sloka = 0.8; partial Saravali = 0.9. 0.72."
    caveats: "Mars's 8H special aspect can also be constructive — it can activate research, inheritance, and occult significations of the aspected house in addition to the challenging quality."
    verified: true
    stub: false
    stub_reason: null

