    assertion: >
      Kaal Sarpa Shanti remedies: special pujas at temples associated with Rahu and Ketu
      (Trimbakeshwar/Nashik for Rahu, Srikalahasti for Ketu) are the traditional prescriptions;
      regular Rahu-Ketu mantra recitation; wearing cat's eye and hessonite after careful
      assessment; these remedies reduce the nodal axis's restrictive karmic pressure over time.
    scope: remedy
    school: parashari
    confidence: 0.72
    confidence_rationale: "Sloka = 0.8; partial corroboration from traditional Jyotish sources = 0.9. 0.72."
    caveats: "Kaal Sarpa Dosha's classical status in BPHS is debated — the name and specific puja remedies may be post-BPHS traditions. The underlying nodal-hemming principle is in BPHS; the specific remedy prescriptions may be later additions."
    verified: true
    stub: false
    stub_reason: null

