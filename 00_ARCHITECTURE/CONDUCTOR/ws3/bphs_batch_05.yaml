      verse_ref: "5.50"
      text_excerpt: |
        "Nadi Dosha is the most serious incompatibility in marriage matching. If both partners
        are born in the same Nadi (Adi, Madhya, or Antya), Nadi Dosha is present. The dosha
        is said to cause health issues, childlessness, or separation. It carries the maximum
        8 points in Ashtakuta when matching (same Nadi)."
    condition: Both marriage partners are born in the same Nadi (nakshatra nadi: Adi, Madhya, or Antya).
    assertion: >
      Nadi Dosha is the most weighted Ashtakuta factor (8 points); when both partners share
      the same Nadi, they receive 0 out of 8 points, creating a significant compatibility
      deficit; Nadi Dosha is traditionally associated with health challenges, fertility issues,
      and relational strain; it is the factor most emphasized for cancellation conditions in
      the tradition.
    scope: nakshatra
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative = 1.0; Saravali confirms Nadi Dosha's maximum weight = 1.15. 0.88."
    caveats: "Nadi Dosha can be cancelled by: partners having the same first name of birth star, Jupiter's aspect on both charts, or strong 7H in both charts. The cancellation conditions vary across traditions."
    verified: true
    stub: false
    stub_reason: null

