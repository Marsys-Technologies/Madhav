        new undertaking. It lasts approximately 90 minutes and its timing shifts each day
        of the week. No auspicious work should begin during Rahu Kalam."
    condition: The timing of Rahu Kalam (inauspicious daily period) is being assessed for muhurta.
    assertion: >
      Rahu Kalam is an approximately 90-minute inauspicious window each day (calculated from
      sunrise to sunset divided into 8 equal parts; Rahu Kalam is the portion corresponding
      to each day's assigned sequence); undertakings begun during Rahu Kalam are considered
      to be under Rahu's obstructive influence from the start.
    scope: muhurta
    school: parashari
    confidence: 0.88
