  - rule_id: BPHS.83.20.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "83.20"
      text_excerpt: |
        "Tithi (lunar day) is a primary factor in muhurta selection. The auspicious tithis
        for most activities are: 2nd, 3rd, 5th, 7th, 10th, 11th, and 13th tithis of both
        waxing and waning fortnights. Avoid Amavasya (new Moon), full Moon (for certain
        activities), and 4th, 8th, 9th, 12th, 14th tithis."
    condition: The tithi (lunar day) is being evaluated for muhurta selection.
    assertion: >
      Auspicious tithis for general muhurta: 2nd (Dwitiya), 3rd (Tritiya), 5th (Panchami),
      7th (Saptami), 10th (Dashami), 11th (Ekadashi), 13th (Trayodashi) of both Shukla
      and Krishna pakshas; inauspicious for most activities: 4th (Chaturthi), 8th (Ashtami),
      9th (Navami), 12th (Dwadashi), 14th (Chaturdashi), and new Moon; full Moon is
      auspicious for some activities but inauspicious for others.
    scope: muhurta
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative = 1.0; Saravali confirms tithi quality assignments = 1.15. 0.88."
    caveats: "Tithi quality varies by activity type — Chaturthi (4th) is inauspicious for most activities but auspicious for Ganesh worship; context is important."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.83.22.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "83.22"
      text_excerpt: |
        "Vara (weekday) quality for muhurta: Sunday is auspicious for Sun-related matters
        and government work. Monday for Moon matters, travel, and beginning. Tuesday for
        Mars activities (surgery, competition, litigation). Wednesday for Mercury matters,
        trade, and communication. Thursday for Jupiter matters, education, religion. Friday
        for Venus matters, arts, marriage. Saturday is generally avoided for auspicious starts."
    condition: The weekday (vara) is being evaluated as part of muhurta selection.
    assertion: >
      Vara (weekday) muhurta guidance: Sunday = government, authority, solar activities;
      Monday = travel, beginnings, lunar activities; Tuesday = competition, surgery, Mars
      activities; Wednesday = trade, communication, Mercury activities; Thursday = education,
      religion, wisdom activities; Friday = arts, marriage, Venus activities; Saturday is
      generally unfavourable for beginning new auspicious activities.
    scope: muhurta
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative = 1.0; universally confirmed across Saravali, Phaladeepika = 1.15. 0.88."
    caveats: "Saturday can be used for Saturn-specific activities (agriculture, construction foundations, legal documentation) but is traditionally avoided for auspicious beginnings like marriage or new business."
    verified: true
    stub: false
    stub_reason: null

