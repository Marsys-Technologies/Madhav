  # ─── BATCH 05 SUPPLEMENTAL — FINAL NAKSHATRA, ASPECT, AND REMEDY RULES ────────

  - rule_id: BPHS.5.85.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "5.85"
      text_excerpt: |
        "The Pushya nakshatra is universally recommended as the best Moon nakshatra for
        starting any auspicious activity. In particular, Pushya falling on a Sunday
        (Pushya + Sunday = Pushya-Ravi yoga) creates an extremely auspicious combination
        blessed by both Jupiter (Pushya's ruler) and Sun (Sunday's ruler)."
    condition: Pushya nakshatra coincides with Sunday (Pushya-Ravi yoga) in a muhurta chart.
    assertion: >
      Pushya-Ravi yoga (Pushya nakshatra + Sunday) is one of the most auspicious muhurta
      combinations available; the blessing of Jupiter (Pushya's ruler) combines with Sun's
      authority (Sunday); any activity begun during this combination receives divine
      patronage and auspicious momentum; gold purchase on this day is specifically
      recommended in the classical tradition.
    scope: muhurta
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative = 1.0; Saravali and Phaladeepika confirm Pushya-Ravi yoga's auspiciousness = 1.15. 0.88."
    caveats: "Pushya on Sunday occurs roughly once a month; however, the full combination requires no other muhurta defects (Rahu Kalam, etc.) to be present simultaneously."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.5.88.1
