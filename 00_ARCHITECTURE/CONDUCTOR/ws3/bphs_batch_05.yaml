  # ─── GANA COMPATIBILITY ───────────────────────────────────────────────────────

  - rule_id: BPHS.5.48.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "5.48"
      text_excerpt: |
        "For marriage compatibility (Ashtakuta), the Gana factor checks the nakshatra
        nature of both partners. Deva-Deva match is 6 points. Manushya-Manushya is 6 points.
        Rakshasa-Rakshasa is 6 points. Deva-Manushya is 5 points. Manushya-Rakshasa is 1 point.
        Deva-Rakshasa is 0 points — considered incompatible."
    condition: The Gana (nakshatra nature) compatibility between two individuals' birth nakshatras is being evaluated for marriage.
    assertion: >
      Gana compatibility in Ashtakuta: same-nature matches (Deva-Deva, Manushya-Manushya,
      Rakshasa-Rakshasa) score 6 points; Deva-Manushya scores 5 points; Manushya-Rakshasa
      scores 1 point; Deva-Rakshasa scores 0 points and is traditionally considered incompatible
      for marriage unless other chart factors strongly support the union.
    scope: nakshatra
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative compatibility scoring = 1.0; Saravali confirms Gana scores = 1.15. 0.88."
    caveats: "Gana is one of 8 factors (Ashtakuta) in compatibility analysis; a single low score does not make a marriage inauspicious — the total Guna score (36 points maximum) determines overall compatibility."
    verified: true
    stub: false
    stub_reason: null

  # ─── NADI DOSHA ───────────────────────────────────────────────────────────────

  - rule_id: BPHS.5.50.1
    source_verse:
