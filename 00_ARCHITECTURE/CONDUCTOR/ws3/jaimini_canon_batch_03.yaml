        Lagnas, the 7th. The lord of the Badhaka rashi is the Badhakesh. Chara Dasha
        of the Badhaka rashi or its lord's rashi can coincide with severe obstacles
        or health crises. (Rath: Badhaka = the obstacle that tests the soul's resolve;
        strongest for timing crises.)
    condition: |
      The Badhaka rashi is identified from the natal Lagna type and its lord's position
      is noted.
    assertion: |
      Badhaka rashi determination: for movable Lagna (Aries, Cancer, Libra, Capricorn)
      = 11th house; for fixed Lagna (Taurus, Leo, Scorpio, Aquarius) = 9th house;
      for dual Lagna (Gemini, Virgo, Sagittarius, Pisces) = 7th house. Chara Dasha
      of the Badhaka rashi or Badhakesh rashi coincides with major obstacles.
