rules:

  # ─── ADHYAYA 3 PADA 1: NAVAMSHA INTERPRETATION ───

  - rule_id: JAIMINI.3.1.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.1.1"
      text_excerpt: |
        "Navamsha lagna gives the secret of the soul" — the Lagna in the Navamsha
        chart (D9) reveals the soul's inner nature, hidden character, and the direction
        of spiritual evolution that is not immediately visible from the natal chart.
        The Navamsha Lagna sign and its lord, and planets in the Navamsha Lagna, all
        describe the native's inner character and spiritual destiny. (Rath: D9 Lagna =
        the inner person; reveals what the soul truly seeks.)
    condition: |
      The Navamsha (D9) Lagna sign and its lord and occupants are assessed.
    assertion: |
      The Navamsha Lagna reveals the native's inner character, hidden motivations,
      and spiritual evolution direction. It functions as a secondary (but equally
      important) Lagna for the inner life. The lord of the Navamsha Lagna and planets
      in the Navamsha Lagna describe the inner self's quality and orientation.
    scope: divisional
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by all Jaimini commentators and BPHS (1.15) = 0.85"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.1.2.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.1.2"
      text_excerpt: |
        "Atmakaraka in Navamsha Lagna: 'Swamsha'" — when the Atmakaraka occupies the
        Navamsha Lagna (first house of D9), it is called Swamsha ('own portion'). This
        is a powerful position indicating that the soul is strongly centered in its own
        essence. Swamsha with benefic aspects gives extraordinary gifts; with malefics,
        severe tests of character. (Rath: AK in D9 Lagna = the soul is fully present
        in this life; exceptional potential for both greatness and spiritual development.)
    condition: |
      The Atmakaraka planet occupies the Lagna (1st house) of the Navamsha (D9) chart.
    assertion: |
      AK in Navamsha Lagna (Swamsha) gives extraordinary potential for greatness,
      spiritual development, and soul-fulfillment. The native's soul is fully engaged
      in its life mission. Benefic aspects on D9 Lagna = exceptional results; malefic
      aspects = severe tests that ultimately produce wisdom and strength.
    scope: divisional
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by Rath and classical Jaimini tradition (1.15) = 0.85"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.1.3.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.1.3"
      text_excerpt: |
        "Vargottama: planet in same sign in Rashi and Navamsha" — when a planet
        occupies the same sign in both the Rashi (D1) chart and the Navamsha (D9)
        chart, it is called Vargottama. A Vargottama planet is exceptionally strong —
        it gives results as if it were in its own sign or exaltation. In Jaimini,
        Vargottama Atmakaraka = maximum soul strength. (Rath: Vargottama = the planet
        is 'doubly placed' in its sign; gives results with exceptional clarity.)
    condition: |
      A planet occupies the identical sign in both the Rashi (D1) chart and the
      Navamsha (D9) chart.
    assertion: |
      A Vargottama planet has exceptional strength, delivering its significations
      with maximum clarity and power. Results are purer, more concentrated, and more
      certain than for non-Vargottama planets. Vargottama AK = soul at maximum strength
      in this life; Vargottama lagna lord = exceptionally strong constitution and life force.
    scope: divisional
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Sutra declarative implicit form (0.85) × confirmed by BPHS + Jaimini tradition (1.15) = 0.85"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.1.4.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.1.4"
      text_excerpt: |
        "Exalted planet in Navamsha: elevated life quality" — a planet that is exalted
        in the Navamsha chart (even if debilitated in the natal chart) gives elevated
        results in the inner life and in the domains it governs in the D9. Exaltation
        in D9 means the soul's inner experience of that domain is elevated and refined.
        (Rath: Navamsha exaltation = inner spiritual victory in that planet's domain;
        outer life may still show the natal debility, but inner quality is high.)
    condition: |
      A planet occupies its exaltation sign in the Navamsha (D9) chart.
    assertion: |
      Exaltation in Navamsha elevates a planet's inner-life results. Even if debilitated
      natally, Navamsha exaltation indicates that the native develops excellence in the
      planet's domain through inner development and spiritual maturity. This is particularly
      powerful for AK (indicating moksha potential) and for the 7th lord (indicating
      quality of marriage at the soul level).
    scope: divisional
    school: jaimini
    confidence: 0.82
    confidence_rationale: "Implicit sutra form (0.85) × confirmed (1.0) = 0.85; reduced to 0.82"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.1.5.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.1.5"
      text_excerpt: |
        "Debilitated AK in Navamsha: severe tests of the soul" — when the Atmakaraka
        is debilitated in the Navamsha chart, the soul faces severe tests and obstacles
        in fulfilling its primary life purpose. However, if the debilitation is cancelled
        (Neecha Bhanga in D9), the soul eventually transforms these tests into wisdom and
        achieves its purpose through hard-won experience. (Rath: AK neecha in D9 = the
        hero's journey; the soul must overcome its deepest weakness to fulfill its mission.)
    condition: |
      The Atmakaraka occupies its debilitation sign in the Navamsha (D9) chart.
    assertion: |
      The native's soul faces severe tests in fulfilling its primary life purpose. The
      journey is difficult, often involving repeated setbacks in the AK's domain. However,
      Neecha Bhanga (debility cancellation) in D9 indicates eventual triumph through
      transformation. The soul's challenge becomes its greatest teaching.
    scope: divisional
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × Rath commentary (1.0) = 0.85; reduced to 0.80"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  # ─── ADHYAYA 3 PADA 2: KARAKAMSHA DEEP ANALYSIS ───

  - rule_id: JAIMINI.3.2.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.2.1"
      text_excerpt: |
        "Karakamsha in 1st house (same as Lagna): Rajayoga" — when the Karakamsha
        Lagna falls in the same rashi as the natal Lagna, this is called Swamsha
        (in a different usage) and creates a very powerful Rajayoga. The soul's
        purpose and the native's outer life are perfectly aligned. This position
        gives great success in the native's chosen field. (Rath: KL = natal Lagna =
        the most powerful alignment of inner purpose and outer life.)
    condition: |
      The Karakamsha Lagna (AK's navamsha sign) coincides with the natal Lagna
      (Ascendant sign) in the natal chart.
    assertion: |
      When KL = natal Lagna, a powerful Rajayoga of alignment is formed: the soul's
      purpose and the outer life expression are unified. Great success and recognition
      come because the native is fully living their authentic soul purpose. This is one
      of the rarest and most powerful Jaimini yogas.
    scope: yoga
    school: jaimini
    confidence: 0.82
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by Rath (1.0) = 0.85; reduced to 0.82"
    caveats: "This requires precise birth time to verify. Results vary by lagna sign."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.2.2.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.2.2"
      text_excerpt: |
        "Sun in Karakamsha with Jupiter: government or religious leadership" —
        when both the Sun and Jupiter are in or aspect the Karakamsha Lagna, the
        native is inclined toward government leadership AND religious/philosophical
        wisdom simultaneously. This combination creates a 'philosopher-king' profile.
        (Rath: Sun+Jupiter on KL = minister, judge, head of a religious institution,
        senior government officer with philosophical orientation.)
    condition: |
      Both the Sun and Jupiter occupy or aspect the Karakamsha Lagna sign in
      the natal chart.
    assertion: |
      Native is inclined toward combining authority with wisdom — government leadership
      with philosophical depth, or religious leadership with administrative capacity.
      Judge, senior government officer with dharmic orientation, or head of a
      religious or educational institution are typical profiles.
    scope: yoga
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by Rath (1.0) = 0.85; reduced to 0.80"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.2.3.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.2.3"
      text_excerpt: |
        "Moon and Venus in Karakamsha: arts and public life" — when Moon and Venus
        both occupy or aspect the Karakamsha Lagna, the native is inclined toward
        public-facing artistic or entertainment careers. This combination is especially
        prominent for performers, musicians, and artists who connect with large audiences.
        (Rath: Moon+Venus on KL = the entertainer soul; public, emotional, beautiful work.)
    condition: |
      Both the Moon and Venus occupy or aspect the Karakamsha Lagna sign in the natal chart.
    assertion: |
      Native has strong soul-level inclinations toward performing arts, music, public
      entertainment, or emotionally expressive creative work that reaches large audiences.
      Public recognition through artistic or emotionally resonant work is the primary
      life theme.
    scope: yoga
    school: jaimini
    confidence: 0.78
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.78"
    caveats: "Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.2.4.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.2.4"
      text_excerpt: |
        "Mars and Ketu in Karakamsha: occult and weapons" — when Mars and Ketu both
        occupy or aspect the Karakamsha Lagna, the native is drawn to occult sciences,
        weaponry, surgery, or hidden/esoteric knowledge combined with practical
        application. This is a powerful combination for a surgeon, occultist, or
        military practitioner with spiritual depth. (Rath: Mars+Ketu on KL = warrior-
        mystic profile; practical and esoteric simultaneously.)
    condition: |
      Both Mars and Ketu occupy or aspect the Karakamsha Lagna sign in the natal chart.
    assertion: |
      Native has soul-level inclinations toward occult sciences, surgery, weaponry,
      esoteric or hidden knowledge combined with practical skill. Warrior-mystic profile:
      the native can be both physically courageous and spiritually perceptive.
    scope: yoga
    school: jaimini
    confidence: 0.60
    confidence_rationale: "Implicit sutra form (0.85) × Ketu nodes factor (×0.85) = 0.72; reduced to 0.60 for compound nodal + Mars rule"
    caveats: "Ketu on KL is contested as noted previously. Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.2.5.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.2.5"
      text_excerpt: |
        "Saturn and Rahu in Karakamsha: technology and mass production" — when Saturn
        and Rahu both occupy or aspect the Karakamsha Lagna, the native is drawn to
        large-scale industrial, technical, or mass-production enterprises. Working with
        machinery, chemicals, or infrastructure at scale is typical. (Rath: Saturn+Rahu
        on KL = the industrialist or mass-market technologist soul; works with large
        collectives and industrial systems.)
    condition: |
      Both Saturn and Rahu occupy or aspect the Karakamsha Lagna sign in the natal chart.
    assertion: |
      Native has soul-level inclinations toward large-scale industrial, technical, or
      mass-market enterprises. Working with machinery, infrastructure, chemicals, or
      working-class populations at scale defines the career orientation.
    scope: yoga
    school: jaimini
    confidence: 0.58
    confidence_rationale: "Implicit sutra form (0.85) × Rahu nodes factor (×0.85) = 0.72; reduced to 0.58 for Saturn+Rahu compound contested reading"
    caveats: "Saturn+Rahu on KL is primarily a Rath synthesis reading. Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.2.6.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.2.6"
      text_excerpt: |
        "Malefic in 2nd from Karakamsha: harsh speech or cursed speech (shapa)" —
        when a malefic planet (particularly Saturn, Rahu, or Mars) occupies the 2nd
        house from the Karakamsha Lagna without benefic aspect, there may be a curse
        (shapa) associated with speech. The native's words may carry unintended harm,
        or the native may suffer harm through their own speech. (Rath: 2nd from KL
        malefic without benefic = speech-related karmic pattern requiring attention.)
    condition: |
      A malefic planet (Saturn, Mars, Rahu, or Sun) occupies the 2nd house from the
      Karakamsha Lagna without benefic aspect on that house.
    assertion: |
      A karmic pattern involving speech may exist: native's words may carry unintended
      harm, or native suffers consequences of their own speech. Remedial attention to
      truthful and compassionate speech is indicated. Benefic aspect on 2nd from KL
      mitigates or removes this pattern.
    scope: divisional
    school: jaimini
    confidence: 0.72
    confidence_rationale: "Implicit sutra form (0.85) × Rath commentary (1.0) = 0.85; reduced to 0.72 for 'curse' framing being interpretive"
    caveats: "Shapa (curse) framing is Rath's interpretive layer; the underlying rule (malefic 2nd from KL = speech issues) is more widely accepted. Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.2.7.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.2.7"
      text_excerpt: |
        "Benefic in 3rd from Karakamsha: courage and initiative" — benefic planets
        in the 3rd house from the Karakamsha Lagna indicate a soul with natural courage,
        initiative-taking capacity, and skill with communications and the arts. Jupiter
        or Venus in 3rd from KL is especially favorable for writing, music, and
        communicative arts. (Rath: 3rd from KL with benefic = the creative and courageous
        expression is the soul's mode of engagement.)
    condition: |
      Benefic planets occupy the 3rd house from the Karakamsha Lagna in the natal chart.
    assertion: |
      Native possesses natural courage, communicative gifts, and artistic or creative
      expression as a soul-level strength. Jupiter in 3rd from KL = philosophical
      writing; Venus = music or visual arts; Mercury = literary and communicative arts.
    scope: divisional
    school: jaimini
    confidence: 0.78
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.78"
    caveats: "Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.2.8.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.2.8"
      text_excerpt: |
        "Malefic in 3rd from Karakamsha: cowardice or excessive aggression" —
        malefic planets in the 3rd house from KL can indicate cowardice (malefic
        without good aspect) OR excessive aggression and recklessness (malefic in
        own sign or exaltation here). The quality depends on the malefic's strength.
        (Rath: 3rd from KL malefic = the courage-quality of the soul is impure or
        misdirected; requires conscious development.)
    condition: |
      Malefic planets occupy the 3rd house from the Karakamsha Lagna in the natal chart.
    assertion: |
      Malefics in 3rd from KL indicate challenges with the quality of courage: either
      cowardice (weak malefic) or excessive aggression (strong malefic). The native
      needs to consciously develop balanced, purposeful courage rather than defaulting
      to fear or reckless action.
    scope: divisional
    school: jaimini
    confidence: 0.72
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.72 for dual-direction interpretation (cowardice vs aggression)"
    caveats: "Results vary by lagna and malefic's dignity."
    verified: true
    stub: false
    stub_reason: null

  # ─── ADHYAYA 3 PADA 3: DIVISIONAL CHART ANALYSIS ───

  - rule_id: JAIMINI.3.3.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.3.1"
      text_excerpt: |
        "D9 (Navamsha) as the primary divisional chart in Jaimini" — the Navamsha
        chart is the most important divisional chart in Jaimini, holding equal or
        superior importance to the natal Rashi chart for soul-level analysis. The
        Karakamsha is derived from D9. All Jaimini analyses regarding dharma, marriage
        at the soul level, and spiritual evolution use D9 as the primary reference.
        (Rath: D9 = the dharmic blueprint; D1 = the material blueprint.)
    condition: |
      Divisional chart analysis is performed using the Navamsha (D9) in the Jaimini system.
    assertion: |
      The Navamsha chart is the most important divisional chart for Jaimini analysis.
      It reveals: (1) the soul's inner nature (D9 Lagna); (2) the Karakamsha sign (AK
      in D9); (3) the quality of dharmic life and marriage; (4) the soul's spiritual
      evolution. D9 and D1 must always be read together in Jaimini.
    scope: divisional
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by entire Jaimini tradition (1.15) = 0.85"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.3.2.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.3.2"
      text_excerpt: |
        "D10 (Dashamsha) for career: Jaimini application" — while D10 is primarily
        a Parashari divisional, Jaimini also uses it for career analysis. The D10
        Lagna and planets in D10 refine the career reading. In Jaimini, the AmK's
        position in D10 is especially important for career direction. (Rath: D10
        confirms or qualifies what the natal chart + AmK shows for career; use D10
        as secondary career confirmation.)
    condition: |
      The Dashamsha (D10) chart is assessed in the Jaimini system for career analysis.
    assertion: |
      In Jaimini, D10 serves as a secondary career chart. The Amatyakaraka's position
      in D10 confirms or qualifies the career direction indicated in D1. Benefics in
      D10 Lagna = successful career; malefics = career challenges requiring greater
      effort.
    scope: divisional
    school: jaimini
    confidence: 0.75
    confidence_rationale: "Implicit sutra form (0.85) × D10 primarily Parashari — some loss of Jaimini-specific certainty (0.85) = 0.72; rounded to 0.75"
    caveats: "D10 in Jaimini is less primary than in Parashari. Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.3.3.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.3.3"
      text_excerpt: |
        "D60 (Shastiamsha) in Jaimini: past-life karma" — the Shastiamsha (D60) chart
        reveals the nature of the soul's accumulated karma from past lives. In Jaimini,
        D60 Lagna lord and planets in D60 Lagna describe the karmic heritage the soul
        carries into this life. The AK in D60 shows the most critical karmic pattern
        for the soul to address. (Rath: D60 = the karmic inheritance map; D1 = how
        this karma expresses now; D9 = the path through it.)
    condition: |
      The Shastiamsha (D60) chart is assessed in the Jaimini system for karmic inheritance.
    assertion: |
      The D60 reveals past-life karmic patterns the soul carries into this life.
      The D60 Lagna sign and its lord, and the AK's position in D60, reveal the
      dominant karmic pattern that must be addressed. D60 + D1 + D9 together give
      the full karmic picture in Jaimini.
    scope: divisional
    school: jaimini
    confidence: 0.75
    confidence_rationale: "Implicit sutra form (0.85) × D60 requires accurate birth time (computational dependency) (0.85) = 0.72; rounded to 0.75"
    caveats: "D60 requires extremely accurate birth time (every 2 minutes changes it). Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.3.4.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.3.4"
      text_excerpt: |
        "Planets in own navamsha (Vargottama) in any divisional: exceptional strength" —
        when a planet is Vargottama in any divisional chart (D1/D9, D1/D10, etc.),
        it has exceptional strength in the domain governed by that divisional. Vargottama
        in D10 = extraordinary career strength in that planet's domain. Vargottama in
        D9 = extraordinary soul-level clarity in that planet's domain. (Rath: Vargottama
        status in any varga = extraordinary clarity and strength in that varga's domain.)
    condition: |
      A planet occupies the same sign in a Rashi chart and in any divisional chart
      (D9, D10, D60, etc.).
    assertion: |
      Vargottama status in any divisional chart grants extraordinary strength and
      clarity in the specific domain governed by that divisional. The planet's
      significations manifest with exceptional purity and power in that domain.
    scope: divisional
    school: jaimini
    confidence: 0.82
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by BPHS + Jaimini tradition (1.15) = 0.85; reduced to 0.82"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  # ─── ADHYAYA 3 PADA 4: ADDITIONAL KARAKAMSHA ANALYSIS ───

  - rule_id: JAIMINI.3.4.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.4.1"
      text_excerpt: |
        "4th from Karakamsha: mother's quality and education" — the 4th house from
        the Karakamsha Lagna shows the quality of the native's mother at the soul level,
        foundational education, and the emotional foundation of the inner life. Benefics
        in 4th from KL = excellent mother and strong inner foundation; malefics = maternal
        karmic challenge or disrupted inner emotional stability. (Rath: 4th from KL =
        the inner home; the soul's emotional bedrock.)
    condition: |
      The 4th house from the Karakamsha Lagna and its occupants are assessed.
    assertion: |
      Benefics in 4th from KL indicate a high-quality maternal relationship, strong
      inner emotional foundation, and excellent foundational education. Malefics indicate
      challenges with mother or disruption to the inner sense of emotional security
      and home at the soul level. Moon in 4th from KL is exceptionally favorable.
    scope: divisional
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.80"
    caveats: "Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.4.2.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.4.2"
      text_excerpt: |
        "6th from Karakamsha: disease patterns and enemies at soul level" — the 6th
        house from KL shows the native's primary disease tendencies and enemy patterns
        at the soul level — i.e., the recurring health challenges and adversarial
        relationships that the soul has agreed to work through in this life. Malefics
        in 6th from KL = strong disease and enemy karma; benefics = ability to overcome
        them. (Rath: 6th from KL = the soul's designated adversarial curriculum.)
    condition: |
      The 6th house from the Karakamsha Lagna and its occupants are assessed.
    assertion: |
      Malefics in 6th from KL intensify disease tendencies and adversarial patterns
      as soul-level karmic curriculum. These challenges are not random; they are the
      specific battles the soul has chosen to engage. Benefics in 6th from KL give
      the capacity to overcome adversaries and heal from diseases.
    scope: divisional
    school: jaimini
    confidence: 0.78
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.78"
    caveats: "Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.3.4.3.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "3.4.3"
      text_excerpt: |
        "7th from Karakamsha: spouse quality at soul level" — the 7th house from
        the Karakamsha Lagna shows the soul-level quality of the spouse and the
