  # ─── ADHYAYA 4 PADA 1: LONGEVITY CALCULATION ───

  - rule_id: JAIMINI.4.1.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "4.1.1"
      text_excerpt: |
        "Alpayu, Madhyayu, Purnayu: the three longevity spans" — Jaimini divides
        human life into three potential spans: Alpayu (short life: 0-36 years),
        Madhyayu (middle life: 36-72 years), and Purnayu (full life: 72-120 years).
        The determination of which span applies to a native is the primary task of
        Jaimini longevity calculation. (Rath: Longevity assessment is Jaimini's most
        sophisticated predictive tool — it determines the 'life envelope' before
        event prediction.)
    condition: |
      Jaimini longevity calculation is being performed for a natal chart.
    assertion: |
      All Jaimini longevity assessment must first determine whether the native's span
      is Alpayu (0-36 years), Madhyayu (36-72 years), or Purnayu (72-120 years).
      Event predictions and dasha readings are calibrated within this longevity envelope.
      No life prediction should proceed without first determining the longevity span.
    scope: misc
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Sutra declarative implicit form (0.85) × confirmed by all Jaimini commentators (1.15) = 0.85"
    caveats: |
      The specific calculation method for determining the span is contested.
      All methods agree on the three categories; the determination process varies.
    verified: true
    stub: false
    stub_reason: null

