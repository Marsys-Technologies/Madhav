        longevity span, compare the strength of (1) Lagna and its lord against (2) Hora
        Lagna and its lord. The stronger of these two pairs determines the base longevity.
        If both are strong, Purnayu. If the weaker is very weak, Alpayu. If mixed, Madhyayu.
        (Rath: This is the first of three pairs; all three pairs must be assessed.)
    condition: |
      The strength of the natal Lagna and Hora Lagna are being compared for longevity
      determination.
    assertion: |
      The relative strength of Lagna vs. Hora Lagna is the first of three checks for
      longevity. If both are strong, Purnayu (long life) is indicated; if both are
      weak, Alpayu (short life); if one is strong and one weak, Madhyayu (middle life)
      or further assessment is required.
    scope: misc
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by Rath and K.N. Rao (1.0) = 0.85; reduced to 0.80"
    caveats: |
