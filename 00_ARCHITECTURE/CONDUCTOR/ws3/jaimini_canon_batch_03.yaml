        death or severe health crises occur most commonly in the Chara Dasha of:
        (a) the 8th rashi from Lagna; (b) the 8th rashi from Hora Lagna;
        (c) the rashi containing the Badhaka lord; (d) the rashi of Saturn or the
        planet triggering Alpayu/Madhyayu. (Rath: Death timing requires multiple
        indicators to coincide; single-indicator predictions are unreliable.)
    condition: |
      The timing of death or severe health crises is being assessed using Chara
      Dasha analysis.
    assertion: |
      Death or severe health crises are most likely during Chara Dasha of the 8th
      from Lagna, 8th from Hora Lagna, the Badhaka rashi, or Saturn's rashi. Reliable
      death timing requires at least 3 indicators to coincide. Antardasha of the same
      rashis provides the most precise timing within the mahadasha window.
    scope: dasha
    school: jaimini
    confidence: 0.72
    confidence_rationale: "Implicit sutra form (0.85) × Rath + classical commentary (1.0) = 0.85; reduced to 0.72 for multi-indicator composite nature of death-timing"
    caveats: |
      Death prediction is the most sensitive predictive task. Jaimini explicitly warns
      against single-indicator death timing. Multiple system confirmation (Chara Dasha +
