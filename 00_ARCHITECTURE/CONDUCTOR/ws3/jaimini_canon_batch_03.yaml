metadata:
  source: JAIMINI
  commentary_edition: "Jaimini Sutras — Sanjay Rath commentary edition"
  extraction_session: canon-jaimini
  batch: 3
  rules_in_batch: 100
  rule_range: "JAIMINI.3.1.1.1 — JAIMINI.4.3.20.1"
  coverage: "Adhyaya 3 (Navamsha, Karakamsha deep dive, divisional analysis) + Adhyaya 4 Padas 1-3 (longevity, special yogas, timing)"
