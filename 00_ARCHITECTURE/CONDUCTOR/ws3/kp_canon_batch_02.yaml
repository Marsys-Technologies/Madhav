      text_excerpt: |
        "The KP reading sequence is: (1) Erect the Bhava Chalit chart using
        Placidus cusps. (2) Note which house each planet actually occupies in
        the Bhava Chalit chart. (3) Identify the nakshatra lord and sub-lord
        of each planet and each cusp. (4) List the significators of each house
        using the four-tier hierarchy. (5) Assess the sub-lord of the relevant
        cusp for the queried matter. (6) Apply dasha timing."
    condition: >
      A KP natal chart reading is being conducted for any life matter.
    assertion: >
      Mandatory KP reading sequence: (1) Bhava Chalit with Placidus cusps;
      (2) house placement from Bhava Chalit; (3) nakshatra lord + sub-lord
      for each planet and cusp; (4) four-tier significator list for each house;
      (5) sub-lord of the relevant cusp for the specific query; (6) dasha timing
      via significator alignment. Steps cannot be skipped.
    scope: misc
    school: kp
    confidence: 0.88
    confidence_rationale: "Numbered declarative procedure (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      This six-step sequence encapsulates the entire KP method. Any shortcut
      (e.g., skipping Bhava Chalit, using sign placement instead of house placement)
      produces unreliable KP results. Results depend on sub-lord at each step.
    verified: true
    stub: false
    stub_reason: null

