  - rule_id: KP.2.ch16.promise_vs_timing.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch16.promise_vs_timing_distinction"
      text_excerpt: |
        "In KP, promise (whether a matter is destined to occur) and timing (when
        it will occur) are two separate analytical questions answered by two
        separate mechanisms. Promise is determined by the sub-lord of the relevant
        cusp. Timing is determined by the dasha-bhukti-antara combination of
        significators. A matter can be promised (good sub-lord) but delayed (no
        qualifying dasha period in near future)."
    condition: >
      Both promise (will the matter occur?) and timing (when will it occur?)
      are being assessed for a KP matter.
    assertion: >
      Promise → assessed via sub-lord of relevant cusp (single analytical step).
      Timing → assessed via dasha-bhukti-antara significator alignment (separate step).
      A promised matter can still be delayed if no qualifying dasha period is
      running or near. A matter with no promise cannot be timed — there is nothing
      to time. Sequence: promise check first, then timing check.
    scope: sub_lord
    school: kp
    confidence: 0.88
    confidence_rationale: "Declarative with clear analytic separation (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      The promise/timing separation is a fundamental KP analytical discipline.
      Attempting to time an unpromised matter is a methodological error in KP.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.3.ch16.cusp_strength.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.3.ch16.cusp_strength_measurement"
      text_excerpt: |
        "The strength of a house cusp in KP is determined by the number and
        quality of planets that are significators of that house. The more planets
        that signify a house across all four tiers (star-of-occupant, occupant,
        star-of-lord, lord), the more prominent that house's themes are in the
        native's life. A house with significators at all four tiers is a
        dominant life theme."
    condition: >
      The prominence or strength of a house H in a KP chart is being assessed.
    assertion: >
      A house H is prominent in KP when many planets signify it across all four
      tiers of the significator hierarchy. Maximum prominence: a planet at each
      tier (star-of-occupant, occupant, star-of-lord, lord) signifying H.
      The count and distribution of significators across tiers indicates how
      dominant that house's theme is in the native's life.
    scope: bhava
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with generalisation (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results depend on sub-lord for each significator. Many significators at
