    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch17.kp_core_axioms"
      text_excerpt: |
        "The sub-lord is the final arbiter in KP astrology. No amount of
        beneficial planet placement, sign dignity, yogas, or dashas can
        override a sub-lord that does not connect to the relevant house.
        Conversely, a well-positioned sub-lord can deliver results even when
        other factors appear weak. This is the central axiom of the KP system."
    condition: >
      Any KP prediction is being formed from multiple chart factors.
    assertion: >
      The sub-lord is the final arbiter. Strong planets, dignities, yogas,
      or favourable dashas cannot override a sub-lord lacking the relevant
      house connectivity. A good sub-lord can deliver results despite apparent
      weakness in other chart factors. Sub-lord connectivity is the necessary
      and near-sufficient condition for any KP result.
    scope: sub_lord
    school: kp
    confidence: 0.88
    confidence_rationale: "Declarative core axiom (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
