metadata:
  source: KP
  extraction_session: canon-kp
  batch: 2
  rules_in_batch: 100
  rule_range: "KP.101–KP.200"
  stubbed_in_batch: 5
  pramana_pass_rate: 0.95
  extraction_date: "2026-06-05"
  note: >
    Batch 2 covers: deeper sub-lord applications, KP-specific house groupings
    for 12 life domains, inter-cusp sub-lord chains, horary advanced rules,
    special KP techniques (ruling planets in timing, sookshma precision),
    and comparative divergences from Parashari explicitly stated in KP texts.

rules:

  # ── EXTENDED SUB-LORD FRAMEWORK ──

  - rule_id: KP.2.ch7.cusp_connectivity_chain.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch7.cusp_connectivity_chain"
      text_excerpt: |
        "For complete promise verification, a two-step chain is required. Step 1:
        identify the sub-lord of the cusp. Step 2: verify that the sub-lord's
        own star lord (i.e., the nakshatra lord of the sign-degree where the
        sub-lord is placed) also connects to the relevant house group. When
        both the sub-lord and the sub-lord's star lord signify the relevant
        houses, the promise is doubly confirmed."
    condition: >
      The sub-lord SL of cusp H is identified. SL's own star lord (the nakshatra
      lord of SL's natal position) is then assessed for house connectivity.
    assertion: >
      When both the sub-lord SL AND SL's star lord independently signify the
      relevant house group for H, the promise of H is doubly confirmed and
      particularly strong. Single-step sub-lord connectivity is sufficient for
      basic promise; double-step chain verification is the highest confidence level.
    scope: sub_lord
    school: kp
    confidence: 0.72
    confidence_rationale: "Explanatory prose with two-step chain (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results depend on sub-lord at each step. The two-step chain is an advanced
      KP technique; for routine prediction the one-step sub-lord check suffices.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch8.negative_house_cusps.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch8.negative_cusps_and_timing"
      text_excerpt: |
        "Every house cusp has a positive and a negative expression. The positive
        expression fructifies when the sub-lord of that cusp connects to the
        supporting houses. The negative expression (loss, denial, obstacle)
        occurs when the sub-lord connects to the opposing house group. For house
        4 (property, home): positive sub-lord is 4/11/12; negative sub-lord
        is 10/3/9 (absence from home, career over home)."
    condition: >
      House 4 (property and home) is being assessed. Sub-lord of 4th cusp
      connects to either 4/11/12 or 10/3/9.
    assertion: >
      Sub-lord of 4th cusp signifying 4H, 11H, 12H: positive expression —
      property acquisition, settled home life. Sub-lord signifying 10H, 3H, 9H:
      negative expression — career dominates, frequent travel, absence from
      home, property in foreign place. The opposing house groups create the
      positive/negative duality for each cusp.
    scope: sub_lord
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with positive/negative duality example (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results depend on sub-lord. The opposing-house group framework for each
      cusp's negative expression is a KP analytical tool; the specific opposing
      groups for each house are derived from the thematic opposition of houses
      across the chart wheel.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch9.double_signification.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch9.double_signification_analysis"
      text_excerpt: |
        "When a planet signifies both positive (promise houses) and negative
        (denial houses) for a matter simultaneously, the sub-lord of that
        planet determines which predominates. If the planet's sub-lord connects
        to the positive houses, the positive signification wins. If to the
        negative, denial wins. The sub-lord arbitrates between conflicting
        house significations in the same planet."
    condition: >
      A planet P signifies both the promise-houses (e.g., 2/7/11 for marriage)
      and the denial-houses (e.g., 6/12 for marriage denial) simultaneously.
    assertion: >
      When a planet has mixed significations, its sub-lord determines which
      set of significations manifests. Sub-lord connecting to promise-houses →
      positive results manifest. Sub-lord connecting to denial-houses →
      negative results manifest. The sub-lord is the tie-breaker for mixed
      signification planets.
    scope: sub_lord
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative with clear decision rule (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord. This rule is important for planets that
      are significators of both 2/7/11 and 6/8/12 simultaneously — a common
      occurrence in KP charts where planets occupy or lord multiple houses.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.3.ch9.sublord_of_dashalord.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.3.ch9.sublord_of_dasha_lord"
      text_excerpt: |
        "For more precise dasha analysis, the sub-lord of the dasha lord itself
        should be examined. If the dasha lord's sub-lord is a significator of
        the relevant house group, the dasha will be fully productive for that
        matter. If the dasha lord's sub-lord signifies inimical houses, even a
        dasha lord that is a significant house lord may fail to deliver results."
    condition: >
      The sub-lord of the dasha lord D is assessed to refine the dasha analysis.
    assertion: >
      The dasha lord D's own sub-lord determines whether D will deliver results
      for the relevant matter. If D's sub-lord connects to the relevant house
      group, D's dasha is fully productive. If D's sub-lord connects to inimical
      houses, D's dasha underperforms even if D itself is a strong house significator.
    scope: dasha
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative with clear rule (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord. This is a second-order sub-lord check — the
      sub-lord of the dasha lord, in addition to the sub-lord of the relevant
      cusp. Both checks together provide the highest confidence in dasha-level
      prediction.
    verified: true
    stub: false
    stub_reason: null

  # ── KP HOUSE GROUP SPECIFICATIONS FOR ALL MAJOR LIFE DOMAINS ──

  - rule_id: KP.4.ch10.house_groups.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.4.ch10.house_group_summary"
      text_excerpt: |
        "KP summarizes the house groups for each major life domain:
        Longevity: 1, 8, 3 (1=physical body, 8=danger, 3=neighbours of 8=longevity via 3rd).
        Death: 2, 7, badhaka (2=maraka, 7=maraka, badhaka=obstacle to life).
        Mother: 4, 10 (4=mother, 10=10th from mother is 7th, indicating longevity of mother).
        Father: 9, 3 (9=father, 3=3rd from 9th = longevity of father via 11th).
        Siblings: 3, 11 (3=siblings, 11=11th from 3rd = gain from siblings)."
    condition: >
      House groups for longevity, death, mother, father, and siblings are being applied.
    assertion: >
      KP house groups:
      Longevity: 1H, 8H, 3H (8H = danger; 3H is 8th from 8H = survival).
      Death: 2H, 7H, and badhakasthana.
      Mother: 4H and 10H.
      Father: 9H and 3H.
      Siblings: 3H and 11H (11H = fulfilment from siblings).
    scope: bhava
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose with enumerated summary (0.80) × partial Parashari confirmation (1.15) = 0.92; cap 0.92"
    caveats: >
      House 3 for longevity (as 8th from 8th = second death-chance survived) is
      a KP-specific interpretation. Parashari uses 8H as the primary longevity house.
      Results depend on sub-lord for each specific question.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.4.ch10.house_groups.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.4.ch10.house_group_summary"
      text_excerpt: |
        "Additional house groups:
        Mental health: 1, 4, 5, 8, 12 (1=body/mind integration, 4=emotional home,
        5=mental acuity, 8=deep transformation, 12=seclusion/institutions).
        Legal disputes: 6, 7, 11 (6=enemy/dispute, 7=open opponent, 11=victory).
        Enemies: 6, 12 (6=enemies, 12=bedridden due to enemies, imprisonment).
        Vehicles: 4, 11 (4=vehicles, 11=gains including vehicles)."
    condition: >
      House groups for mental health, legal disputes, enemies, and vehicles are applied.
    assertion: >
      KP house groups:
      Mental health: 1H, 4H, 5H, 8H, 12H.
      Legal disputes: 6H, 7H, 11H (victory); 6H and 12H (defeat).
      Enemies: 6H and 12H (12th from 7H = loss through opposition).
      Vehicles: 4H and 11H.
    scope: bhava
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose enumeration (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Mental health house group (1/4/5/8/12) is a KP-specific expansion;
      Parashari primarily uses 5H for mental stability and 8H/12H for mental
      disturbances. Results depend on sub-lord.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.5.ch8.house_groups.3
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.5.ch8.house_group_additional"
      text_excerpt: |
        "Further house groups in KP:
        Religious activities: 9, 12 (9=dharma/religion, 12=meditation/retreat).
        Occult and mysticism: 8, 12 (8=hidden knowledge, 12=seclusion for practice).
        Overseas travel for work: 3, 6, 9, 12 (3=travel, 6=service/work, 9=abroad, 12=foreign).
        Gain from profession: 2, 6, 10, 11 (2=earnings, 6=service, 10=career, 11=fulfillment)."
    condition: >
      House groups for religious activities, occult, overseas work, and professional
      gain are being applied.
    assertion: >
      KP house groups:
      Religious: 9H and 12H.
      Occult/mysticism: 8H and 12H.
      Overseas work: 3H, 6H, 9H, 12H.
      Professional gain: 2H, 6H, 10H, 11H.
    scope: bhava
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose enumeration (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord. The four-house group for overseas work
      (3/6/9/12) combines travel (3/9), work (6), and foreign residence (12) —
      useful for identifying career-based emigration vs. tourism.
    verified: true
    stub: false
    stub_reason: null

  # ── INTER-CUSP SUB-LORD CHAINS ──

  - rule_id: KP.2.ch10.inter_cusp_chain.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch10.inter_cusp_sublord_chains"
      text_excerpt: |
        "An advanced KP technique uses the inter-cusp sub-lord chain. Take the
        sub-lord of the 7th cusp (for marriage). Then identify the sub-lord of
        the star in which that first sub-lord is placed. If this second-level
        sub-lord also connects to 2/7/11, the marriage promise is further
        confirmed. This chain can be extended one more level for triple confirmation."
    condition: >
      Advanced marriage promise verification via inter-cusp sub-lord chain:
      (1) SL1 = sub-lord of 7th cusp; (2) SL2 = sub-lord of the nakshatra
      in which SL1 is placed; (3) optionally SL3 one level further.
    assertion: >
      Triple sub-lord chain for marriage: SL1 (7th cusp sub-lord) → connects to 2/7/11.
      SL2 (sub-lord of SL1's nakshatra) → also connects to 2/7/11.
      SL3 (optional third level) → also connects to 2/7/11.
      Three-level confirmation gives the highest confidence in marriage promise.
    scope: sub_lord
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with qualifier 'advanced technique' (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results depend on sub-lord at each chain level. The inter-cusp chain is
      not required for basic promise confirmation — the single sub-lord check
      is the standard method. Use this for cases where the basic check gives
      ambiguous results.
    verified: true
    stub: false
    stub_reason: null

  # ── TRANSIT RULES IN DEPTH ──

  - rule_id: KP.3.ch10.saturn_transit.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.3.ch10.saturn_transit_in_kp"
      text_excerpt: |
        "Saturn's transit in KP is judged by the nakshatra Saturn transits,
        not by the sign. When Saturn transits through the nakshatra of a natal
        planet that is a significator of house 8, 12, or the badhakasthana,
        there is a period of hardship, restriction, or health challenge.
        When Saturn transits the nakshatra of a natal significator of 2, 10,
        or 11, career advancement or financial gain is indicated."
    condition: >
      Saturn is transiting through the nakshatra of a natal significator S.
      S signifies either 8/12/badhaka (hardship) or 2/10/11 (advancement).
    assertion: >
      Saturn transit through nakshatra of 8/12/badhaka significator: period of
      restriction, hardship, health challenge. Saturn transit through nakshatra
      of 2/10/11 significator: career advancement or financial gain. KP judges
      Saturn transit by nakshatra, not by sign-from-Moon as in Parashari Sade Sati.
    scope: transit
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with conditional outcomes (0.72) × Parashari divergence (0.85) = 0.61; round to 0.62"
    caveats: >
      KP's Saturn transit method (nakshatra-based) diverges from Parashari Sade
      Sati (sign-from-Moon). Do not apply the 7.5-year Sade Sati framework to
      KP Saturn transit analysis. Results must also align with the running dasha.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.3.ch10.jupiter_transit.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.3.ch10.jupiter_transit_in_kp"
      text_excerpt: |
        "Jupiter's transit is the most benefic transit in KP. When Jupiter transits
        the nakshatra of a natal significator of house 2, 5, 9, or 11, it activates
        those house matters positively. This is especially powerful when Jupiter's
        transit nakshatra simultaneously matches the nakshatra of the sub-lord of
        the relevant cusp — the sub-lord activation by transit Jupiter is the
        KP Jupiter transit rule."
    condition: >
      Jupiter is transiting through the nakshatra of: (a) a natal significator of
      2H, 5H, 9H, or 11H; or (b) the sub-lord of the relevant cusp.
    assertion: >
      Jupiter transit through nakshatra of 2/5/9/11 significator activates those
      house matters positively. If the transiting Jupiter's nakshatra is the same
      as the sub-lord of the relevant cusp's nakshatra, the house matter is
      powerfully triggered and likely to fructify during the current dasha period.
    scope: transit
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with qualifier 'most benefic' and graduated rule (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results must also align with the running dasha-bhukti. Transit Jupiter
      activates promised matters; it cannot deliver unpromised matters.
      Results depend on sub-lord.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.3.ch11.rahu_ketu_transit.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.3.ch11.rahu_ketu_transit"
      text_excerpt: |
        "Rahu and Ketu transits are significant in KP. When Rahu transits through
        the nakshatra of the sub-lord of the 7th cusp, it can trigger foreign
        partnerships or sudden relationships. When Ketu transits through the
        nakshatra of the sub-lord of the 12th cusp, it can trigger periods of
        seclusion or spiritual retreat. The nakshatra-based approach applies
        equally to Rahu and Ketu transits."
    condition: >
      Rahu or Ketu is transiting through the nakshatra of the sub-lord of
      a specific cusp (e.g., 7th or 12th).
    assertion: >
      Rahu transit through nakshatra of 7th cusp sub-lord: trigger for foreign
      partnerships or sudden relationships. Ketu transit through nakshatra of
      12th cusp sub-lord: trigger for seclusion or spiritual retreat.
      The sub-lord's nakshatra is the activation zone for Rahu/Ketu transits.
    scope: transit
    school: kp
    confidence: 0.61
    confidence_rationale: "Prose with qualifier (0.72) × Rahu/Ketu adjustment ×0.85 = 0.61"
    caveats: >
      Rahu/Ketu transit rules carry confidence × 0.85 per Gate A R1. Transit alone
      does not cause events; dasha alignment is still required. Results depend
      on sub-lord.
    verified: true
    stub: false
    stub_reason: null

  # ── RULING PLANET TIMING DETAILS ──

  - rule_id: KP.3.ch12.ruling_planet_selection.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.3.ch12.ruling_planet_dasha_selection"
      text_excerpt: |
        "When selecting the most likely dasha period for an event, the ruling
        planets at the moment of judgment are used as a filter. Among all
        qualifying dasha-bhukti periods (where lords are significators of the
        relevant houses), prefer the period whose lords are also ruling planets
        at the time of judgment. This alignment indicates the event is due
        in the near future."
    condition: >
      Multiple dasha-bhukti periods qualify as significators of the relevant
      house group. The ruling planets at the moment of judgment are identified.
    assertion: >
      Among multiple qualifying dasha-bhukti periods, the period whose lords
      overlap with the ruling planets at the moment of judgment is the most
      proximate prediction. Ruling planet alignment narrows the timing from
      multiple qualifying periods to the most likely one.
    scope: dasha
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative with selection logic (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord. The ruling planet filter is a KP-specific
      timing refinement. It does not override the three-tier significator
      requirement — it selects among periods that already qualify.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.3.ch12.ruling_planet_selection.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.3.ch12.ruling_planet_dasha_selection"
      text_excerpt: |
        "The ruling planet set can also be used to date the event to a specific
        year. The year the dasha-bhukti combination begins in which the ruling
        planets are also significators of the matter is the most likely year
        of the event. For month-level precision, the antara lord must also be
        a ruling planet or a significator of the relevant houses."
    condition: >
      Year- or month-level event timing is being determined using ruling planets
      and dasha-bhukti-antara combination.
    assertion: >
      Year of event: when dasha-bhukti lords are both ruling planets and significators
      of the relevant house group. Month of event: when the antara lord is additionally
      a ruling planet or house significator. Running all three levels through the
      ruling planet filter gives month-level precision.
    scope: dasha
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with multi-condition precision levels (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results depend on sub-lord at each dasha level. Month-level precision requires
      both exact birth data AND correct identification of ruling planets at the
      moment of judgment. Small errors in either propagate to timing errors.
    verified: true
    stub: false
    stub_reason: null

  # ── HORARY ADVANCED ──

  - rule_id: KP.6.ch8.horary_number_validation.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.6.ch8.horary_advanced_validation"
      text_excerpt: |
        "In KP Prashna, the ascendant derived from the number must be in harmony
        with the querent's natal ascendant. If the horary number produces a
        Placidus ascendant in the same sign or nakshatra as the querent's natal
        ascendant, the number is strongly validated. If in the same star as the
        Moon of the natal chart, also valid. Total mismatch with natal positions
        suggests an insincere or distracted query."
    condition: >
      KP horary: the horary ascendant from the querent's number is compared to
      the querent's natal ascendant sign, nakshatra, or natal Moon nakshatra.
    assertion: >
      Horary number is strongly validated when the horary ascendant's sign or
      nakshatra matches the natal ascendant's sign or nakshatra. Also valid if
      it matches the natal Moon's nakshatra. Complete mismatch with natal positions
      suggests the number was given insincerely or the querent was distracted.
    scope: horary
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with conditional validation levels (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      The natal-horary consistency check is an additional validation step beyond
      the ruling planet alignment check (KP.6.ch1.horary.2). Not all practitioners
      use this; it is a KSK advanced technique.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.6.ch9.horary_affirmative.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.6.ch9.horary_affirmative_answer"
      text_excerpt: |
        "In KP Prashna, an affirmative answer (the queried event will occur) is
        given when three conditions are met: (1) the sub-lord of the horary
        ascendant is a significator of the relevant house group; (2) the sub-lord
        is not in the 12th from the relevant cusp; (3) the ruling planets at the
        moment of judgment are signified by the relevant house group. Meeting all
        three confirms a positive answer."
    condition: >
      KP horary: affirmative answer conditions are being checked for a query.
      Three conditions: (1) sub-lord of horary ascendant connects to relevant
      house group; (2) sub-lord not in 12th from relevant cusp; (3) ruling
      planets connect to relevant house group.
    assertion: >
      An affirmative KP horary answer requires: (1) horary ascendant sub-lord
      signifies the relevant house group; (2) sub-lord is not in 12th from
      the relevant cusp; (3) ruling planets at the time of judgment also connect
      to the relevant house group. All three → YES answer. Missing any one →
      qualified or negative answer.
    scope: horary
    school: kp
    confidence: 0.88
    confidence_rationale: "Numbered declarative list with three clear conditions (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      Results depend on sub-lord. The three-condition framework is the most
      rigorous KP horary affirmative standard. In practice, meeting two of
      three conditions gives a qualified positive answer ("likely but with
      obstacles or delay").
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.6.ch9.horary_negative.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.6.ch9.horary_negative_answer"
      text_excerpt: |
        "A negative answer in KP Prashna is given when the sub-lord of the horary
        ascendant is in the 12th from the relevant cusp, or when the sub-lord's
        significations are entirely unrelated to the queried house group, or when
        the ruling planets are significators of the 12th, 8th, or 6th from the
        relevant cusp. Any one of these three conditions is sufficient for a
        definitive negative answer."
    condition: >
      KP horary: any one of three negative conditions is present:
      (1) horary ascendant sub-lord is in 12th from relevant cusp;
      (2) sub-lord's significations are entirely unrelated to the queried house group;
      (3) ruling planets signify 12th, 8th, or 6th from the relevant cusp.
    assertion: >
      Any single one of the three negative conditions is sufficient for a
      definitive negative KP horary answer. The queried event will not occur
      (or will be significantly delayed/frustrated) if even one of these
      conditions is present.
    scope: horary
    school: kp
    confidence: 0.88
    confidence_rationale: "Declarative with three clear conditions (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      Results depend on sub-lord. The 12th-from denial, irrelevance, and ruling
      planet obstruction are the three KP negative answer triggers.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.6.ch10.horary_timing.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.6.ch10.horary_event_timing"
      text_excerpt: |
        "For horary event timing in KP, the sub-lord of the horary ascendant's
        dasha (at the time of the query) is first identified. The remaining
        period of that dasha is the outer time frame. Within that dasha, the
        bhukti of a significator of the relevant house group will be the event
        window. The ruling planets narrow the bhukti to a specific antara."
    condition: >
      KP horary: timing of the queried event is being determined.
    assertion: >
      Horary event timing: (1) identify the current dasha of the chart cast from
      the horary number; (2) the remaining dasha period is the outer frame;
      (3) within the dasha, the bhukti of a house-significator is the event window;
      (4) ruling planets at query moment identify the specific antara within
      that bhukti as the event time.
    scope: horary
    school: kp
    confidence: 0.80
