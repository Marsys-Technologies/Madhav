  # ── KP UNIQUE PRINCIPLES AND DIVERGENCES ──

  - rule_id: KP.1.ch9.sign_vs_house.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch9.sign_vs_house_in_kp"
      text_excerpt: |
        "In KP, the sign a planet occupies is secondary to the house it occupies
        in the Bhava Chalit chart. The sign is used to determine the star lord
        (since nakshatras span signs) but the house for signification analysis
        comes from the Bhava Chalit chart. This is a fundamental departure from
        Parashari where sign and house can be conflated in whole-sign systems."
    condition: >
      A planet P is in a sign S and in house H (from Bhava Chalit). S ≠ H in
      some cases due to Placidus cusp boundaries.
    assertion: >
      In KP: sign S is used only for nakshatra/star-lord identification (since
      nakshatras are zodiacal). House H from Bhava Chalit governs signification
      analysis. If a planet is in Aries (sign) but in the 12th house (Bhava Chalit),
      it is analysed as a 12th house planet, not a 1st house planet.
    scope: bhava
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × Parashari divergence (0.85) = 0.68"
    caveats: >
      The sign/house separation in KP requires the Bhava Chalit chart to be
      computed separately from the Rasi chart. In Parashari whole-sign, the
      two charts are identical. Do not conflate Rasi and Bhava Chalit positions.
    verified: true
    stub: false
    stub_reason: null

