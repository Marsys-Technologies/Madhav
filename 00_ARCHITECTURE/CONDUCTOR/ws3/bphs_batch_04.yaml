      canonical_id: BPHS
      verse_ref: "48.2"
      text_excerpt: |
        "During the Sun mahadasha and Jupiter antardasha: if both are well-placed, the native
        gains authority, recognition, and spiritual wisdom simultaneously. There is favour from
        government, teachers, and the dharmic path opens. This is among the most auspicious
        antardasha combinations."
    condition: The native is in the Sun mahadasha, Jupiter antardasha (sub-period).
    assertion: >
      Sun-Jupiter antardasha (when both are strong) combines solar authority with Jupiterian
      wisdom; the native gains governmental or institutional recognition, spiritual guidance
      from teachers, and general prosperity; this is one of the most beneficial antardasha
      combinations — particularly powerful for authority, education, and spiritual advancement.
    scope: dasha
    school: parashari
    confidence: 0.72
    confidence_rationale: "Sloka with conditional ('if both well-placed') = 0.8; partial Saravali = 0.9. 0.72."
    caveats: "Results require both Sun and Jupiter to be well-placed. If either is weak or a functional malefic for the lagna, results are modified accordingly."
    verified: true
    stub: false
    stub_reason: null

