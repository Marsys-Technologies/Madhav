  - rule_id: BPHS.46.10.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "46.10"
      text_excerpt: |
        "During the Sun's mahadasha, results depend on the Sun's house and sign placement.
        If Sun is strong and benefically placed, the native gains favour from authority,
        father, and government. If Sun is weak or afflicted, there is conflict with father,
        loss of position, and health issues related to the heart and eyes."
    condition: The native is in the Sun mahadasha (6-year period).
    assertion: >
      Sun mahadasha results reflect Sun's natal strength and placement: a strong, well-placed
      Sun gives government favor, career elevation, recognition, and vitality; a weak or
      afflicted Sun brings father-related difficulties, loss of position, and health challenges
      related to the heart, eyes, and bones during the 6-year period.
    scope: dasha
    school: parashari
    confidence: 0.80
    confidence_rationale: "Sloka with conditional = 0.8; Saravali confirms Sun-dasha conditional effects = 1.0. 0.80."
    caveats: "Sun dasha results are further refined by: (1) Sun's sign; (2) functional lordship for the lagna; (3) antardasha lord's condition."
    verified: true
    stub: false
    stub_reason: null

