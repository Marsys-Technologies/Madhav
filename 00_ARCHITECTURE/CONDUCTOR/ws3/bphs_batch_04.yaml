  # ─── TIMING OF EVENTS IN DASHA ───────────────────────────────────────────────

  - rule_id: BPHS.46.5.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "46.5"
      text_excerpt: |
        "Within a mahadasha, events tend to occur during the antardasha (sub-period) of:
        planets associated with the event's natal house, the lord of that house, or the
        significator (karaka) of the event. The antardasha narrows the timing from the
        broad mahadasha window."
    condition: >
      A specific life event is being timed within a mahadasha period using antardasha
      analysis.
    assertion: >
      Event timing within a mahadasha requires identifying the antardasha that corresponds
      to: (1) the planet ruling the event's house; (2) planets occupying or aspecting the
      event's house; (3) the karaka of the event; events cluster in the antardasha of the
      most relevant natal planet for that event type.
    scope: dasha
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative timing methodology = 1.0; Saravali confirms antardasha as event trigger = 1.15. 0.88."
    caveats: "Transit confirmation (particularly Jupiter and Saturn transiting the relevant house or its lord) is required to validate event timing predictions."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.46.6.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "46.6"
      text_excerpt: |
        "Events are more precisely timed by the pratyantardasha (sub-sub-period). The
        pratyantardasha of a planet that is the lord of the relevant house, or is conjunct
        or aspecting that house, narrows the event window to approximately 1-3 months."
    condition: >
      A specific life event is being timed within a mahadasha-antardasha combination
      using pratyantardasha (sub-sub-period) analysis.
    assertion: >
      Pratyantardasha (tertiary period) narrows event timing to 1-3 month windows;
      the pratyantardasha of the planet most connected to the natal house for the predicted
      event (by lordship, occupation, or aspect) identifies the approximate timing;
      combined with transit confirmation, this achieves the most precise Jyotish timing.
    scope: dasha
    school: parashari
    confidence: 0.80
    confidence_rationale: "Sloka = 0.8; Saravali confirms pratyantardasha timing = 1.0. 0.80."
    caveats: "Pratyantardasha timing is an approximation tool — precise day/week timing further requires transit analysis (ashtakavarga bindus, nakshatra transits, etc.)."
