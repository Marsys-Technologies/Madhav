  note: >
    KP Reader verse refs use Amendment R1 convention: KP.<VOL>.ch<N>.<section_slug>
    Page numbers appended only when section spans multiple pages and pinpoint location matters.
    All rules school: kp; KP uses Placidus cusps, not equal-house or Sripati.

rules:

  # ── VOLUME 1: FOUNDATION — STELLAR ASTROLOGY BASICS ──

  - rule_id: KP.1.ch1.intro.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch1.introduction"
      text_excerpt: |
        "The stellar system of astrology is based on the position of planets in the
        zodiac as seen from the earth. The zodiac is divided into 27 constellations
        (Nakshatras), each spanning 13°20'. Each nakshatra is owned by one of the
        nine planets. The planet owning the nakshatra in which another planet is
        placed is called the star lord of that planet."
    condition: >
      Any planet P is positioned within a nakshatra owned by planet S.
    assertion: >
      Planet S is the star lord (nakshatra lord) of planet P. The nakshatra lord
      governs the primary signification channel through which P delivers results.
    scope: nakshatra
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative statement (textual_strength=0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      KP diverges from Parashari: in KP the nakshatra lord of a planet is the primary
      filter for results, superseding the sign lord in importance.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch1.intro.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch1.introduction"
      text_excerpt: |
        "Each nakshatra is further subdivided into 9 parts called subs, in the
        proportion of the Vimshottari dasha periods. The sub-lord is the planet
        owning the sub within the nakshatra where a planet or cusp is placed.
        The sub-lord is the most important factor in KP astrology — it is the
        final arbiter of whether a matter is promised or denied."
    condition: >
      Any planet P or house cusp C falls in the sub owned by planet L within
      the nakshatra where P or C is positioned.
    assertion: >
      Planet L is the sub-lord of P or C. The sub-lord is the final determinant
      of whether the matter signified by that planet or cusp will fructify,
      be modified, or be denied.
    scope: nakshatra
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      The sub-lord system is unique to KP and has no equivalent in Parashari
      astrology. Results depend critically on the sub-lord's significations.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch1.intro.3
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch1.introduction"
      text_excerpt: |
        "Beyond the sub, each sub is further divided into sub-subs (or sub-sub-lords)
        in the same proportion as Vimshottari. This gives a four-tier hierarchy:
        Star Lord → Sub Lord → Sub-Sub Lord → Sub-Sub-Sub Lord. For most practical
        purposes, the three-tier system (Star → Sub → Sub-Sub) is sufficient."
    condition: >
      Precise degree position of a planet or cusp is known within a nakshatra.
    assertion: >
      The position maps to a four-tier hierarchy: nakshatra lord, sub-lord,
      sub-sub-lord, and sub-sub-sub-lord. The sub-lord is the primary decision
      factor; sub-sub-lord refines timing and intensity.
    scope: nakshatra
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with qualifier 'for most practical purposes' (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Sub-sub-lord analysis requires exact degree precision; small errors in birth
      time propagate to sub-sub-lord changes.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch2.sublord_table.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch2.sub_lord_table"
      text_excerpt: |
        "The sub divisions within each nakshatra are allotted in Vimshottari
        proportion: Ketu 7°, Venus 20°, Sun 6°, Moon 10°, Mars 7°, Rahu 18°,
        Jupiter 16°, Saturn 19°, Mercury 17°. The sub starting from 0° Aries
        begins with Ketu, and the cycle repeats through all 27 nakshatras.
        A planet's sub-lord is determined by the exact degree in the zodiac."
    condition: >
      A planet or cusp is at an exact zodiacal degree. The sub-lord allocation
      table (Vimshottari proportions) is applied to identify which planet's
      sub it falls in.
    assertion: >
      The sub-lord is deterministically identified from the degree position using
      the KP sub-lord table derived from Vimshottari dasha proportions. This is
      a fixed computational rule, not an interpretive choice.
    scope: nakshatra
    school: kp
    confidence: 0.88
    confidence_rationale: "Prose declarative with exact proportions stated (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      Different KP editions may present the table in slightly different formats
      but the proportional values are invariant. Verify computation against
      standard KP sub-lord table.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch3.placidus.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch3.placidus_house_system"
      text_excerpt: |
        "KP uses the Placidus house system, not the equal house or Sripati system
        used in Parashari astrology. The cusps are the starting points of each house.
        The planet closest to a cusp, whether in the preceding or following house,
        has strong house connection. A planet within 1° of the next cusp is treated
        as belonging to the next house for signification purposes."
    condition: >
      KP chart is cast using Placidus house cusps.
    assertion: >
      The house cusps are the starting points (not mid-points) of each house.
      A planet within 1° of the next cusp ahead is treated as belonging to
      the next house for signification purposes.
    scope: bhava
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × Parashari contradiction (0.85) = 0.68; floor at 0.68"
    caveats: >
      This is a major divergence from Parashari's equal-house or Sripati system.
      In KP the cusp is the beginning of the house, whereas in Parashari equal-house
      the cusp is the mid-point of the house. Do not mix house-cusp conventions
      between systems.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch3.placidus.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch3.placidus_house_system"
      text_excerpt: |
        "In KP, a planet in the 12th house but within 1 degree of the ascendant
        cusp is considered to be in the first house for the purpose of judging
        results. The house is determined by cusp ownership, not by the 30-degree
        segment calculation used in equal-house systems."
    condition: >
      A planet is positioned in the 12th house but within 1° of the ascendant cusp (1st house cusp).
    assertion: >
      In KP, this planet is treated as a 1st house significator rather than a
      12th house significator when judging results.
    scope: bhava
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      The 1° proximity rule applies to any cusp, not just the ascendant. A planet
      within 1° of any cusp ahead of it acquires that house's signification.
      Results depend on sub-lord verification.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch4.signification.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch4.planet_signification_hierarchy"
      text_excerpt: |
        "The hierarchy of signification in KP is: (1) Planets in the constellation
        (nakshatra) of occupants of a house — strongest significators; (2) Occupants
        of the house themselves; (3) Planets in the constellation of the lord of
        the house; (4) Lord of the house. A planet signifies a house most strongly
        when it is in the star of a planet occupying that house."
    condition: >
      Multiple planets claim signification of a given house.
    assertion: >
      KP hierarchy of signification: (1) planets in star of occupant of the house
      are strongest; (2) occupants of the house; (3) planets in star of the house
      lord; (4) lord of the house. Higher-tier significators override or outweigh
      lower-tier ones when determining results.
    scope: bhava
    school: kp
    confidence: 0.88
    confidence_rationale: "Numbered declarative list (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      This hierarchy is unique to KP and differs from Parashari where the lord
      of a house is typically weighted most strongly. Results depend on
      confirming sub-lord connectivity at each level.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch4.signification.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch4.planet_signification_hierarchy"
      text_excerpt: |
        "A planet becomes a significator of a house if it occupies that house, or
        if it is the lord of that house, or if it is in the constellation of a
        planet that occupies that house, or if it is in the constellation of the
        lord of that house. The stronger the link, the more potent the signification."
    condition: >
      A planet P is being assessed for signification of house H.
    assertion: >
      P signifies H if any of these four conditions apply: P occupies H; P lords H;
      P is in the star of an occupant of H; P is in the star of the lord of H.
      Direct occupation and stellar connection to occupant are stronger than
      lordship and stellar connection to lord.
    scope: bhava
    school: kp
    confidence: 0.88
    confidence_rationale: "Declarative enumeration (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      Results depend on the sub-lord of P also connecting to the house H
      for the signification to fructify in a dasha period.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch5.sublord_result.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch5.sub_lord_determines_result"
      text_excerpt: |
        "The sub-lord of any planet determines whether the planet will give the
        results of the houses it signifies. If the sub-lord is a significator of
        the relevant house, the planet will deliver those results during its dasha.
        If the sub-lord is not connected to the relevant house — or worse, is a
        significator of inimical houses — the results will be denied or reversed."
    condition: >
      Planet P is a significator of house H. P's sub-lord SL is assessed.
    assertion: >
      If SL also signifies house H (or houses related to H), then P will deliver
      the results of H during P's dasha period. If SL does not connect to H,
      or connects to houses inimical to H, P will fail to deliver or will deny
      the results of H.
    scope: sub_lord
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      This is the foundational KP principle. The sub-lord acts as the gatekeeper:
      without sub-lord connectivity, no amount of other signification delivers results.
      Results depend on sub-lord — this rule encodes that dependency directly.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch5.sublord_result.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch5.sub_lord_determines_result"
      text_excerpt: |
        "A planet in a good star but in a bad sub will fail to give good results.
        Conversely, a planet in an unfavourable star but in a good sub can still
        give positive results. The sub-lord's house signification overrides the
        star lord's indication in the final delivery of results."
    condition: >
      Planet P is placed in a star that suggests positive results (star lord signifies
      beneficial houses), but P's sub-lord signifies detrimental or unrelated houses.
    assertion: >
      P will fail to give the positive results suggested by the star lord. The
      sub-lord's signification overrides the star lord's for final result delivery.
      A favourable star with an unfavourable sub produces denied or reversed results.
    scope: sub_lord
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative with explicit contrast (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord — this is a core KP tenet. The override of star
      lord by sub-lord is unique to KP; Parashari has no equivalent sub-division mechanism.
    verified: true
    stub: false
    stub_reason: null

  # ── VOLUME 2: CUSPS AND SUB-LORDS ──

  - rule_id: KP.2.ch1.cusp_sublord.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch1.cusp_sub_lord_rules"
      text_excerpt: |
        "If the sub-lord of a house cusp is in the 12th house from that cusp,
        the matter signified by that house is denied. The 12th from any house
        is its house of negation. When the sub-lord of the cusp tenants the
        12th from that cusp, the promise of that house is cancelled."
    condition: >
      The sub-lord of house cusp H is positioned in the house that is the 12th
      from H (i.e., house H-1, counting from H itself as 1st, so the house
      immediately before H in the wheel).
    assertion: >
      The matter signified by house H is denied. The promise of that house
      is cancelled. The 12th from any house is its house of negation; sub-lord
      placement there nullifies the house's potential.
    scope: sub_lord
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      The 12th-from-cusp denial rule is a KP-specific principle with no direct
      Parashari equivalent. Results depend on sub-lord; even if the sub-lord
      has other positive significations, 12th-from placement for that cusp
      indicates denial for that specific house matter.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch1.cusp_sublord.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch1.cusp_sub_lord_rules"
      text_excerpt: |
        "If the sub-lord of the cusp is itself a significator of that house —
        meaning it occupies, lords, or is in the star of an occupant/lord of
        that house — the matter is promised. When the sub-lord connects back
        to the cusp's own house, the house promise is confirmed and will
        fructify in the appropriate dasha."
    condition: >
      The sub-lord of house cusp H is a significator of house H itself
      (occupies H, lords H, is in star of occupant of H, or in star of lord of H).
    assertion: >
      The matter signified by house H is promised and will fructify in the
      appropriate dasha-bhukti period. Self-referential sub-lord connectivity
      confirms the house's promise.
    scope: sub_lord
    school: kp
    confidence: 0.88
    confidence_rationale: "Declarative rule (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      Promise does not equal immediate delivery. Fructification also requires
      the dasha-bhukti-antara lords to be significators of the house. The sub-lord
      rule confirms the promise; timing requires dasha alignment.
      Results depend on sub-lord.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch1.cusp_sublord.3
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch1.cusp_sub_lord_rules"
      text_excerpt: |
        "The sub-lord of the cusp should be distinguished from the occupant of
        the cusp's sub. The sub-lord is identified by the degree of the cusp
        falling in a particular sub within a nakshatra. This sub-lord's own
        natal position in the chart determines whether the house promise is
        fulfilled or frustrated."
    condition: >
      The sub-lord of house cusp H is identified from the cusp's degree position.
      The sub-lord's own natal chart position is then assessed.
    assertion: >
      The sub-lord's house significations (derived from its own position in the chart)
      determine whether cusp H's matter is fulfilled or frustrated. The sub-lord's
      own natal placement is the decisive factor, not just the fact of its sub ownership.
    scope: sub_lord
    school: kp
    confidence: 0.72
    confidence_rationale: "Explanatory prose (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Results depend on sub-lord's own natal position being assessed independently.
      This requires two lookups: first finding the sub-lord from the cusp degree,
      then assessing the sub-lord's significations from its own placement.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch2.significator_hierarchy.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch2.significator_identification"
      text_excerpt: |
        "To identify significators of any house, follow this order: First, note all
        planets in the constellation of any planet occupying the house. Second, note
        the occupants themselves. Third, note planets in the constellation of the
        house lord. Fourth, note the house lord. This is the order of strength from
        strongest to weakest."
    condition: >
      Significators of house H are being identified in a KP chart.
    assertion: >
      The ordered list of significators from strongest to weakest is:
      (1) planets in star of occupants of H;
      (2) occupants of H;
      (3) planets in star of lord of H;
      (4) lord of H.
      Planets appearing higher in this list are stronger significators and will
      more reliably deliver H's results during their dasha periods.
    scope: bhava
    school: kp
    confidence: 0.88
    confidence_rationale: "Declarative numbered list (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      In Parashari, the lord of a house is typically the primary significator.
      KP reverses this: stellar connection to an occupant trumps lordship.
      Results depend on sub-lord confirmation at each tier.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch2.significator_hierarchy.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch2.significator_identification"
      text_excerpt: |
        "When a planet is in the constellation of another planet that occupies
        multiple houses (due to wide orb of cusp), it acquires the significations
        of all those houses. A planet in the star of a planet in its own sign
        located in a house will signify both the house of occupation and the
        house of which it is lord."
    condition: >
      Planet P is in the star of planet Q. Planet Q occupies house H1 and
      also lords house H2.
    assertion: >
      Planet P acquires significations of both H1 (through stellar occupation)
      and H2 (through the star lord Q's lordship). Multiple house significations
      accumulate through the stellar connection.
    scope: bhava
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with explanatory complexity (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      Multi-house signification is common in KP and is one reason why KP uses
      a refined sub-lord check rather than relying solely on signification count.
      Results depend on sub-lord of P also connecting to the relevant house.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch3.cusp_denial.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch3.cusp_denial_and_promise"
      text_excerpt: |
        "A matter is denied when the sub-lord of the cusp of that house is placed
        in a sign whose lord is a significator of the 12th house from the cusp.
        Alternatively, if the sub-lord itself is the lord of the 12th from the
        cusp, the matter is frustrated. The 12th house principle operates both
        through direct placement and through lordship."
    condition: >
      The sub-lord of cusp H either (a) is placed in a sign whose lord signifies
      the 12th house from H, or (b) is itself the lord of the 12th house from H.
    assertion: >
      The matter signified by house H is frustrated or denied through one of
      two 12th-house mechanisms: direct 12th-house signification by the sub-lord,
      or indirect connection through the sub-lord's sign lord.
    scope: sub_lord
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with two conditional branches (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      This extends the basic 12th-from denial rule to include indirect connections.
      Results depend on sub-lord; the indirect mechanism (sign lord) is weaker
      than direct placement in the 12th from cusp.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch3.cusp_promise.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch3.cusp_denial_and_promise"
      text_excerpt: |
        "A house gives its results when the sub-lord of the cusp is connected
        to the houses that are supportive of the matter. For marriage, the
        sub-lord of the 7th cusp must connect to houses 2, 7, and 11. For
        profession, the sub-lord of the 10th cusp must connect to houses 2,
        6, and 10. This rule of supportive house connectivity is the foundation
        of all KP predictions."
    condition: >
      The sub-lord SL of a cusp H is being assessed for whether it promises
      the matter of H.
    assertion: >
      The sub-lord SL must be a significator of the houses that are thematically
      supportive of H's matter. Connectivity to the correct supporting houses
      confirms the promise of H's matter and its future fructification in
      appropriate dasha periods.
    scope: sub_lord
    school: kp
    confidence: 0.88
    confidence_rationale: "Declarative with concrete examples (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      The specific supporting houses vary by topic (marriage: 2/7/11; career: 2/6/10;
      etc.). The sub-lord connectivity rule is the backbone of all KP topic-analysis.
      Results depend on sub-lord connectivity being verified for the specific topic.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch4.retrograde.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch4.retrograde_planets"
      text_excerpt: |
        "When a planet is retrograde, it should be treated as if it is in the
        sub of the previous star. A retrograde planet does not give results of
        its actual sub-lord but gives results as if it were placed in the sub
        of the planet ruling the previous star's last sub. This is unique to KP
        and has no equivalent in other systems."
    condition: >
      A planet P is retrograde at a given zodiacal degree, placing it in star
      S and sub SL according to the standard KP table.
    assertion: >
      In KP, a retrograde planet P is treated as if placed in the sub of the
      preceding star's last sub-lord. The effective sub-lord for result analysis
      shifts backward to the previous star's final sub. Standard sub-lord tables
      should not be applied directly to retrograde planets without this correction.
    scope: nakshatra
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      This retrograde rule is unique to KP and contradicts standard Parashari
      treatment where retrograde planets are sometimes treated as exalted or
      as if in the previous sign. KP's mechanism is purely stellar-positional.
      Results depend on applying this correction before sub-lord analysis.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.2.ch4.retrograde.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch4.retrograde_planets"
      text_excerpt: |
        "A retrograde planet at the beginning of a nakshatra is to be assessed
        by the sub at the end of the previous nakshatra. If Mercury is retrograde
        at 0°05' of Rohini (Taurus), it behaves as if it were in the last sub
        of Krittika (Aries end) for the purpose of determining its star lord
        and sub-lord for result analysis."
    condition: >
      A planet P is retrograde at the early degrees of nakshatra N (e.g., within
      the first sub of N).
    assertion: >
      P's effective nakshatra for sub-lord analysis is the preceding nakshatra N-1.
      The sub-lord is identified from the end (last degrees) of N-1. This shifts
      P's entire signification chain: star lord becomes lord of N-1, and sub-lord
      is identified from the terminal portion of N-1.
    scope: nakshatra
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose with concrete example (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      The retrograde correction applies at any degree, not just early nakshatra
      degrees — the example illustrates the general principle. Results depend on
      sub-lord derived after retrograde correction.
    verified: true
    stub: false
    stub_reason: null

  # ── VOLUME 3: EVENT TIMING ──

  - rule_id: KP.3.ch1.dasha_timing.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.3.ch1.dasha_bhukti_timing"
      text_excerpt: |
        "For any event to occur, the dasha lord, bhukti lord, and antara lord
        must all be significators of the relevant houses. This triple-significator
        rule is the cornerstone of KP timing. A matter promised by the sub-lord
        of the cusp will fructify only when a dasha-bhukti-antara combination
