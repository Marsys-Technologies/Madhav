  # ── ADDITIONAL FOUNDATIONAL RULES ──

  - rule_id: KP.1.ch6.natural_significators.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch6.natural_significators"
      text_excerpt: |
        "Each planet has natural significations (karakatwas) that it represents
        in any chart. Sun: soul, father, authority, government. Moon: mind,
        mother, public, fluids. Mars: energy, siblings, land, courage. Mercury:
        intellect, communication, commerce. Jupiter: wisdom, children, husband
        (for female), teacher, dharma. Venus: wife (for male), luxury, arts,
        vehicles. Saturn: service, longevity, masses, grief. Rahu: foreign
        elements, sudden events. Ketu: liberation, past karma."
    condition: >
      A planet's natural (universal) karakatwas are being assessed in KP context.
    assertion: >
      Natural karakatwas in KP: Sun → soul/father/authority/government;
      Moon → mind/mother/public/fluids; Mars → energy/siblings/land/courage;
      Mercury → intellect/communication/commerce; Jupiter → wisdom/children/husband(F)/teacher;
      Venus → wife(M)/luxury/arts/vehicles; Saturn → service/longevity/masses/grief;
      Rahu → foreign/sudden events; Ketu → liberation/past karma.
    scope: graha
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose enumeration (0.72) × broad Parashari confirmation (1.15) = 0.83"
    caveats: >
      Rahu/Ketu karakatwa rules carry confidence × 0.85: effective for Rahu/Ketu
      items = 0.83 × 0.85 = 0.71. Natural karakatwas are broadly consistent
      with Parashari tradition; KP uses them as secondary to house-signification
      analysis, not as primary predictors.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.1.ch7.exaltation_debilitation.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.1.ch7.dignity_in_kp"
      text_excerpt: |
        "Exaltation and debilitation of planets are acknowledged in KP but are
        subordinate to the sub-lord principle. An exalted planet in a bad sub
        will give inferior results; a debilitated planet in a good sub can give
        surprisingly positive results. Dignity modifies the quantum of results
        but the sub-lord determines whether results are given or not."
    condition: >
      A planet P is exalted or debilitated in its sign. P's sub-lord is assessed.
    assertion: >
      Exaltation and debilitation modify the quantum (strength/magnitude) of results.
      However, the sub-lord determines whether P gives results at all. An exalted
      planet in a bad sub may give mediocre results; a debilitated planet in a good
      sub can give unexpectedly positive results. Sub-lord primacy overrides dignity.
    scope: graha
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × Parashari divergence (0.85) = 0.68"
    caveats: >
      Results depend on sub-lord. This is a foundational KP tenet that reduces
      the interpretive weight of dignity relative to Parashari tradition where
      exaltation/debilitation have dominant predictive significance.
    verified: true
    stub: false
    stub_reason: null

