      Rahu is placed in the sign of planet S and in the nakshatra of planet N.
    assertion: >
      Rahu acts as an agent primarily of N (star lord) and secondarily of S
      (sign lord). Rahu delivers N's significations first, modified by S's nature.
      The sub-lord of Rahu determines whether these results are positive or negative
      for the matters they relate to.
