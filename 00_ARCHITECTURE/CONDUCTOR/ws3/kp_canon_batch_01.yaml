    caveats: >
      Results depend on sub-lord. The horary ascendant sub-lord rule is the
      KP Prashna equivalent of the natal 7th cusp sub-lord rule for marriage,
      applied universally to whatever house group the query concerns.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.6.ch2.moon_chart.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.6.ch2.kp_moon_chart"
      text_excerpt: |
        "The KP Moon chart (Nirayana Bhava Chalit) uses the Moon's degree position
        as the 1st house cusp. The houses are then equal from the Moon's position.
        The Bhava Chalit chart (which shifts planets to their actual house of
        occupation based on cusp boundaries) is read alongside the Rasi chart.
        In KP, the Bhava Chalit chart is preferred over the Rasi chart for
        house placement of planets."
    condition: >
      KP Bhava Chalit chart is being used for house placement of planets.
    assertion: >
      In KP, the Bhava Chalit chart determines which house a planet actually
      occupies based on Placidus cusp boundaries. A planet that is in Aries
      in the Rasi chart may have shifted to the 12th house in the Bhava Chalit
      chart if it falls before the Aries cusp. The Bhava Chalit placement is
      used for signification analysis, not the Rasi placement.
    scope: bhava
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × Parashari divergence (0.85) = 0.68"
    caveats: >
      This is a major KP divergence from Parashari. In Parashari equal-house,
      a planet in a sign is in the corresponding house; in KP, the planet's
      actual house is determined by Placidus cusp boundaries via the Bhava Chalit
      chart. The Rasi sign is used for sign-based analysis; the Bhava Chalit
      is used for house-based analysis.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.6.ch2.moon_chart.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.6.ch2.kp_moon_chart"
      text_excerpt: |
        "When a planet occupies a different house in the Bhava Chalit chart than
        in the Rasi chart, the Bhava Chalit placement governs its house signification.
        A planet in the Rasi chart occupying the 7th sign but in the Bhava Chalit
        chart occupying the 6th house will signify the 6th house themes, not 7th.
        The star-sub analysis is then applied to the Bhava Chalit position."
    condition: >
      A planet occupies different house positions in the Rasi and Bhava Chalit charts.
    assertion: >
      The Bhava Chalit house position governs the planet's house signification
      in KP. If a planet shifts from the 7th sign (Rasi) to 6th house (Bhava Chalit),
      it signifies 6th house matters, not 7th house matters. The Bhava Chalit
      position is authoritative for signification analysis.
    scope: bhava
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative with concrete example (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      This rule has profound interpretive implications — a planet's entire
      significator profile changes based on Bhava Chalit vs. Rasi placement.
      Results depend on sub-lord. This divergence from Parashari must be noted
      in all cross-school comparison.
    verified: true
    stub: false
    stub_reason: null

