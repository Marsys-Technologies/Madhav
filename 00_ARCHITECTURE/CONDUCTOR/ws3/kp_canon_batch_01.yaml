    source_verse:
      canonical_id: KP
      verse_ref: "Vol.3.ch6.birth_time_rectification"
      text_excerpt: |
        "The accuracy of KP predictions depends critically on the exact birth time.
        The sub changes approximately every 4–8 minutes for the ascendant (at
        moderate latitudes), so a birth time error of 5 minutes can shift the
        ascendant sub-lord, changing the entire framework of analysis. KP demands
        higher birth-time precision than Parashari because the sub-lord mechanism
        amplifies the sensitivity of the ascendant degree."
    condition: >
      Birth time rectification need is being assessed for a KP chart.
    assertion: >
      KP analysis requires birth time precision to within ±4 minutes for reliable
      ascendant sub-lord identification at moderate latitudes. A 5-minute error
      can shift the ascendant sub, invalidating the primary analysis framework.
      KP demands greater birth-time precision than Parashari systems.
    scope: misc
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative with specific timing (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      The 4–8 minute window is latitude-dependent; near the poles the sub changes
      faster; near the equator, slower. For the native's birth location (Bhubaneswar,
      ~20°N latitude), the window is approximately 5–7 minutes.
    verified: true
    stub: false
    stub_reason: null

