      text_excerpt: |
        "The final event timing in KP uses three layers simultaneously:
        (1) Dasha-bhukti-antara significators of the relevant houses confirmed;
        (2) Transit of a slow planet (Saturn, Jupiter, Rahu, or Ketu) through
        the nakshatra of the sub-lord of the relevant cusp;
        (3) Transit of the Sun or Moon through the star of a significator on
