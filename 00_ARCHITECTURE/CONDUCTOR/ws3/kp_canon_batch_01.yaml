      the badhakasthana: if lagna is movable (Aries, Cancer, Libra, Capricorn)
      → badhaka is 11H; if fixed (Taurus, Leo, Scorpio, Aquarius) → 9H;
      if dual (Gemini, Virgo, Sagittarius, Pisces) → 7H.
      Sub-lord of 8th signifying the badhaka house indicates life-endangerment.
