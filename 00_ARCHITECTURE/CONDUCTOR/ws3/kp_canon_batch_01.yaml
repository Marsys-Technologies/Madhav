  # ── VOLUME 6: HORARY (PRASHNA) ──

  - rule_id: KP.6.ch1.horary.1
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.6.ch1.horary_prashna_basics"
      text_excerpt: |
        "In KP horary (Prashna), the querent is asked to give a number between
        1 and 249. This number corresponds to a specific star-sub combination
        within the zodiac, with each number corresponding to approximately 1.46°
        of arc. The number maps directly to a degree in the zodiac, which becomes
        the ascendant of the horary chart. The nakshatra and sub of this degree
        are then used as the primary analytical tool."
    condition: >
      A KP horary (Prashna) reading is being performed. The querent provides
      a number between 1 and 249.
    assertion: >
      The number maps to a specific zodiacal degree (each number = 1.46° of arc,
      spanning the full zodiac 0°–360°). This degree becomes the ascendant of
      the horary chart. The star lord and sub-lord of this ascendant degree are
      used as the primary analytical frame for answering the query.
    scope: horary
    school: kp
    confidence: 0.88
    confidence_rationale: "Declarative technical rule (0.88) × no cross-text (1.0) = 0.88"
    caveats: >
      The 249-number system is unique to KP Prashna. The number 249 spans the
      zodiac because 249 × (360°/249) = 360°. Different KP publishers provide
      the 1–249 table; the mapping is standardized. This has no Parashari equivalent.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.6.ch1.horary.2
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.6.ch1.horary_prashna_basics"
      text_excerpt: |
        "The ruling planets at the moment of the query (weekday lord, Moon's star
        lord, Moon's sign lord, ascendant sign lord, ascendant star lord) must
        align with the star lord and sub-lord derived from the querent's number.
        If the ruling planets and the number's star-sub lords are the same or
        closely related, the number is confirmed as genuine. If they are entirely
        unrelated, the querent may have given the number without sincerity."
    condition: >
      KP horary: the querent has given a number. The ruling planets at the
      moment of query are identified and compared to the star-sub lords
      from the querent's number.
    assertion: >
      The number is confirmed as genuine when the ruling planets at the moment
      of query align with (share planets with) the star lord and sub-lord
      derived from the querent's number. Misalignment suggests the number
      was given insincerely or the querent's mind is not on the actual question.
    scope: horary
    school: kp
    confidence: 0.72
    confidence_rationale: "Prose with conditional scenario (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
      The sincerity validation of the horary number is a KP-specific check.
      It should be used as a confirmation step, not as grounds for refusing
      a reading if the querent is genuinely distressed.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: KP.6.ch1.horary.3
    source_verse:
      canonical_id: KP
      verse_ref: "Vol.6.ch1.horary_prashna_basics"
      text_excerpt: |
        "In KP Prashna, the sub-lord of the ascendant derived from the querent's
