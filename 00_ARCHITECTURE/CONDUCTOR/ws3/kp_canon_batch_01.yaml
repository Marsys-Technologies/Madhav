      Cross-house thematic connections are being used to interpret sub-lord results.
    assertion: >
      Houses participate in multiple thematic networks:
      2H connects to 7H (marriage) and 11H (income);
      6H connects to 12H (hospitalisation through illness);
      5H connects to 11H (children through family joy);
      9H connects to 3H (travel, distant places).
      These cross-connections explain why KP topic-analysis always uses house
      groups (e.g., 2/7/11 for marriage) rather than a single house.
    scope: bhava
    school: kp
    confidence: 0.72
    confidence_rationale: "Explanatory prose (0.72) × no cross-text (1.0) = 0.72"
    caveats: >
