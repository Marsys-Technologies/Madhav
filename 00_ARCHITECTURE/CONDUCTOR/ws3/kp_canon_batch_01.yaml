    assertion: >
      Recovery occurs when significators of houses 1, 5, and 11 are operating
      in the current dasha-bhukti-antara. Houses 1/5/11 vs 6/8/12 is the
      KP longevity/recovery opposition pair. Presence of a 1/5/11 significator
      as bhukti or antara lord during a 6/8/12 dasha brings recovery.
    scope: dasha
    school: kp
    confidence: 0.80
    confidence_rationale: "Prose declarative (0.80) × no cross-text (1.0) = 0.80"
    caveats: >
      Results depend on sub-lord. Houses 1/5/11 as the longevity triad opposing
      6/8/12 as the illness/death triad is a KP framework that partially echoes
