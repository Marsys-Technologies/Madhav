    school: kp
    confidence: 0.68
    confidence_rationale: "Prose declarative (0.80) × Rahu/Ketu adjustment ×0.85 = 0.68"
    caveats: >
      Rahu/Ketu rules carry confidence × 0.85 per Gate A improvement R1.
      Results depend on sub-lord. The agent-of-star-lord principle for Rahu/Ketu
      is unique to KP; Parashari treats Rahu/Ketu as independent malefics with
