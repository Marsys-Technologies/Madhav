    source_verse:
      canonical_id: KP
      verse_ref: "Vol.2.ch5.intersecting_house_significations"
      text_excerpt: |
        "Every house has its own significations and also participates in other
        house themes. House 2 relates to 7 (marriage: family addition) and to
        11 (income and gain). House 6 relates to 12 (hospitalisation: 6th enemy
        to health meets 12th hospitalisation). Understanding these secondary
        connections allows the astrologer to build a more complete picture from
        the sub-lord analysis."
