  # ─── SADE SATI — SATURN'S 7.5-YEAR TRANSIT ───────────────────────────────────

  - rule_id: BPHS.68.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "68.2"
      text_excerpt: |
        "When Saturn transits the 12th, 1st, and 2nd houses from the natal Moon, a period
        known as Sade Sati (seven and a half years) occurs. The three phases of Sade Sati
        each carry different effects: the first phase affects the parents, the second
        phase affects the native directly, and the third phase affects finances and family."
    condition: Saturn is transiting the 12H, 1H, or 2H from the natal Moon's sign.
    assertion: >
      Sade Sati comprises three 2.5-year phases: (1) Saturn in 12H from Moon — affects
      parents, foreign journeys, and losses; (2) Saturn in 1H from Moon (over natal Moon)
      — affects the native's health, mind, and immediate circumstances most directly;
      (3) Saturn in 2H from Moon — affects family, finances, and accumulated resources;
      the middle phase is generally the most challenging.
    scope: transit
    school: parashari
    confidence: 0.92
    confidence_rationale: "Declarative transit rule with phase breakdown = 1.0; Saravali and Phaladeepika confirm Sade Sati = 1.15. 0.92."
    caveats: "Sade Sati's effects are heavily modulated by Saturn's natal strength, the BAV bindus in the three signs, and the active dasha period during the transit. It is not uniformly negative."
    verified: true
    stub: false
    stub_reason: null

