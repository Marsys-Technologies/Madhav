  # ─── OWN SIGNS (SWAKSHETRA) ──────────────────────────────────────────────────

  - rule_id: BPHS.3.21.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "3.21"
      text_excerpt: |
        "The Sun's own sign is Leo. The Moon's own sign is Cancer. Mars rules Aries and
        Scorpio. Mercury rules Gemini and Virgo. Jupiter rules Sagittarius and Pisces.
        Venus rules Taurus and Libra. Saturn rules Capricorn and Aquarius."
    condition: A graha occupies one of its own signs (swakshetra) in the natal chart.
    assertion: >
      A planet in its own sign is in a comfortable and powerful position — it functions
      with confidence and without external constraint; it freely expresses its natural
      significations with a steady, reliable quality.
    scope: graha
    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative rulership assignment = 1.0 textual_strength; universally confirmed across all classical texts = 1.3 corroboration. capped at 0.95."
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  # ─── MOOLATRIKONA ────────────────────────────────────────────────────────────

  - rule_id: BPHS.3.22.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "3.22"
      text_excerpt: |
        "Sun's moolatrikona sign is Leo from 0 to 20 degrees. Moon's is Taurus from
        4 to 20 degrees. Mars: Aries from 0 to 12 degrees. Mercury: Virgo from 16 to 20
        degrees. Jupiter: Sagittarius from 0 to 10 degrees. Venus: Libra from 0 to 15
        degrees. Saturn: Aquarius from 0 to 20 degrees."
    condition: A graha occupies its moolatrikona degrees in its moolatrikona sign.
    assertion: >
      Moolatrikona is a special dignity stronger than own-sign (swakshetra) but weaker
      than exaltation; a planet in moolatrikona produces its significations with great
      clarity, stability, and positive expression; it is well-resourced and purposeful.
    scope: graha
    school: parashari
    confidence: 0.92
    confidence_rationale: "Declarative with specific degree ranges = 1.0; Saravali and Brihat Jataka confirm moolatrikona concept = 1.15. min(1.0, 1.0 × 1.15) → capped at 0.92 (minor degree-range variations across texts noted)."
    caveats: "Degree ranges vary slightly across traditions and commentators. Rahu/Ketu have no moolatrikona in BPHS."
    verified: true
    stub: false
    stub_reason: null

  # ─── DIGNITY HIERARCHY ───────────────────────────────────────────────────────

  - rule_id: BPHS.49.1.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "49.1"
      text_excerpt: |
        "Exaltation gives the strongest strength. Moolatrikona is next, followed by own
        sign, then great friend's sign, then friend's sign, then neutral sign, then enemy
        sign, then great enemy sign, then debilitation — which gives the least strength."
    condition: >
      A graha is to be evaluated for its positional strength (sthana bala) based
      on its sign placement.
    assertion: >
      The dignity hierarchy for sthana bala (positional strength) in descending order is:
      exaltation > moolatrikona > own sign > great friend's sign > friend's sign >
      neutral sign > enemy sign > great enemy sign > debilitation. A planet's results
      improve or diminish according to this hierarchy.
    scope: graha
    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative hierarchy = 1.0 textual_strength; confirmed across Brihat Jataka, Saravali, Phaladeepika = 1.3 corroboration. capped at 0.95."
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  # ─── NATURAL BENEFICS AND MALEFICS ──────────────────────────────────────────

  - rule_id: BPHS.3.26.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "3.26"
      text_excerpt: |
        "Jupiter, Mercury, and the waxing Moon are natural benefics. The Sun, Saturn, Mars,
        Rahu, and Ketu are natural malefics. Mercury associated with malefics becomes
        malefic. The waning Moon is also a malefic."
    condition: A graha is being evaluated for its natural (naisargika) benefic or malefic quality.
    assertion: >
      Jupiter, Mercury (when unafflicted), and the waxing Moon are natural benefics that
      incline toward positive outcomes through their aspects and conjunctions; Sun, Saturn,
      Mars, Rahu, and Ketu are natural malefics; Mercury turns malefic when conjunct malefics;
      the waning Moon (from full to new) functions as a malefic.
    scope: graha
    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative = 1.0; ≥2 texts confirm = 1.3 corroboration. capped at 0.95."
    caveats: "Even natural malefics can be functional benefics for specific lagnas (e.g., Saturn is yogakaraka for Taurus/Libra)."
    verified: true
    stub: false
    stub_reason: null

  # ─── DIRECTIONAL STRENGTH (DIG BALA) ────────────────────────────────────────

  - rule_id: BPHS.26.2.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "26.2"
      text_excerpt: |
        "Jupiter and Mercury have full directional strength in the ascendant (East).
        The Sun and Mars have full directional strength in the 10th house (South).
        Saturn has full directional strength in the 7th house (West).
        The Moon and Venus have full directional strength in the 4th house (North)."
    condition: A graha occupies the bhava corresponding to its direction of maximum dig bala.
    assertion: >
      Directional strength (dig bala) is maximised when: Jupiter/Mercury are in 1H (East),
      Sun/Mars are in 10H (South/Midheaven), Saturn is in 7H (West), Moon/Venus are in 4H
      (North). A planet with full dig bala powerfully expresses its natural significations
      from that house with minimal impediment.
    scope: graha
    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative = 1.0; Saravali Ch.5, Brihat Jataka 2.11 confirm dig bala positions = 1.3 corroboration. capped at 0.95."
    caveats: "Dig bala is one of six strength factors (shadbala); it must be weighed alongside others."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.26.3.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "26.3"
      text_excerpt: |
        "A planet receives zero directional strength when it is in the house opposite to
        its direction of full strength — Jupiter/Mercury in 7H, Sun/Mars in 4H,
        Saturn in 1H, Moon/Venus in 10H."
    condition: A graha is in the bhava diametrically opposite to its dig bala position.
    assertion: >
      A planet in the house of zero directional strength has severely diminished ability
      to express its natural significations through house placement; this weakens that
      specific dimension of its strength even if it is exalted or in own sign.
    scope: graha
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative = 1.0; Saravali confirms = 1.15. But verse is extrapolative (BPHS states the full-strength positions; the zero-strength corollary is standard but derived). 0.8 × 1.15 = 0.92 → adjusted to 0.88 for derived nature."
    caveats: "Zero dig bala does not mean the planet is powerless — other strength factors still apply."
    verified: true
    stub: false
    stub_reason: null

  # ─── PLANETARY WAR (GRAHA YUDDHA) ───────────────────────────────────────────

  - rule_id: BPHS.3.31.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "3.31"
      text_excerpt: |
        "When two planets are within one degree of each other, a planetary war (graha yuddha)
        occurs. The planet that is more northerly in latitude wins the war. The loser of
        the war is considered defeated and weakened as if debilitated."
    condition: Two planets occupy the same degree (within 1°) in a natal or transit chart.
    assertion: >
      A planetary war occurs when two planets are within 1° of each other (applies to
      Mars, Mercury, Jupiter, Venus, Saturn — not luminaries or nodes); the planet with
      greater northern celestial latitude wins; the losing planet is severely weakened,
      treated as debilitated in terms of its capacity to produce results.
    scope: graha
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative rule = 1.0; Saravali and Brihat Jataka confirm planetary war concept but differ slightly on the latitude criterion = 1.15 corroboration with minor variation. 0.8 × 1.15 = 0.92 → adjusted to 0.88."
    caveats: "Sun and Moon do not participate in graha yuddha. Rahu/Ketu are also excluded. The latitude criterion is contested — some use brightness."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: BPHS.3.32.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "3.32"
      text_excerpt: |
        "The planet winning a war gives results quickly. The planet losing the war
        gives weak, delayed, or harmful results even during its own dasha."
    condition: A planet has lost a graha yuddha (planetary war) in the natal chart.
    assertion: >
      The war-defeated planet's dasha or antardasha produces weakened, delayed, or
      adverse results even if that planet is otherwise well-placed; the war winner's
      periods produce accelerated, powerful results.
