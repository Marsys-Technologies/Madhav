    assertion: >
      Vashya compatibility (2 points): Moon signs that naturally dominate (vashya) each
      other in the scheme (Lion dominating Goat, Snake dominating Frog, etc.) receive
      2 points; partial matches receive 1 point; incompatible pairs receive 0 points;
      this factor addresses the power dynamic and cooperative flow in the relationship.
    scope: nakshatra
    school: parashari
    confidence: 0.72
    confidence_rationale: "Sloka = 0.8; partial Saravali = 0.9. 0.72."
    caveats: "Vashya carries the smallest weight (2 points) in Ashtakuta; it provides context for the relationship's natural power balance rather than a critical compatibility factor."
