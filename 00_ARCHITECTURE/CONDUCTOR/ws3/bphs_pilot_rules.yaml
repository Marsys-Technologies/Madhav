    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative system rule = 1.0; universally confirmed = 1.3. capped at 0.95."
    caveats: "Ayanamsha choice (Lahiri, Raman, etc.) affects the Moon's nakshatra position and therefore the dasha balance — different ayanamshas can shift the dasha starting point by several months."
    verified: true
    stub: false
