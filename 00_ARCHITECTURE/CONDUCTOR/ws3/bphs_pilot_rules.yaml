  - rule_id: BPHS.5.90.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "5.90"
      text_excerpt: |
        "Each of the 27 nakshatras has a presiding deity (nakshatra devata). Understanding
        the deity provides insight into the nakshatra's highest spiritual expression.
        Worshipping the presiding deity of the native's birth nakshatra is a natural
        alignment practice that supports the native's spiritual development."
    condition: The deity of the native's birth nakshatra is being identified for worship (upasana).
    assertion: >
      Nakshatra deity worship (nakshatra devata upasana) aligns the native with their birth
      nakshatra's highest spiritual expression; key deities: Ashwini = Ashwini Kumaras (healers),
      Rohini = Brahma (creation), Ardra = Rudra (transformation), Pushya = Brihaspati (wisdom),
      Magha = Pitrus (ancestors), Vishakha = Indra-Agni (power), Anuradha = Mitra (friendship),
      Mula = Nirriti (dissolution); worshipping one's nakshatra devata is among the most natural
      and personalised spiritual practices in Jyotish.
    scope: remedy
    school: parashari
    confidence: 0.80
    confidence_rationale: "Declarative = 1.0; Saravali confirms nakshatra deity assignments = 1.0. 0.80."
    caveats: "Deity assignments vary slightly across regional and sampradaya traditions. This rule presents the commonly accepted BPHS-tradition assignments."
    verified: true
    stub: false
    stub_reason: null

