  # ─── NAKSHATRA SYSTEM — OVERVIEW ─────────────────────────────────────────────

  - rule_id: BPHS.5.1.1
    source_verse:
      canonical_id: BPHS
      verse_ref: "5.1"
      text_excerpt: |
        "There are 27 nakshatras (lunar mansions), each spanning 13 degrees and 20 minutes
        of arc. Each nakshatra is ruled by a planet in the Vimshottari system. The 28th
        nakshatra (Abhijit) is used in muhurta calculations only."
    condition: The nakshatra system is being described and applied.
    assertion: >
      The zodiac is divided into 27 equal nakshatras of 13°20' each; each nakshatra is ruled
      by one of the 9 Vimshottari planets (Moon's position at birth in a nakshatra determines
      the dasha sequence); Abhijit (28th nakshatra) has limited use — primarily in muhurta and
      timing calculations, not natal chart analysis.
    scope: nakshatra
    school: parashari
    confidence: 0.95
    confidence_rationale: "Declarative system definition = 1.0; universally confirmed = 1.3. capped at 0.95."
    caveats: null
    verified: true
    stub: false
    stub_reason: null

