      verse_ref: "81.25"
      text_excerpt: |
        "For Moon remedies, Pearl should only be worn by those with a waxing Moon in
        their chart or by those in Moon mahadasha with a strong functional Moon. For
        a waning Moon that is also a functional malefic for the lagna, Pearl strengthening
        can amplify the malefic's harm."
    condition: A Pearl (Moon gemstone) remedy is being considered for a native.
    assertion: >
      Pearl prescription principle: Pearl strengthens the Moon; appropriate when Moon is
      a functional benefic (rules a trinal or angular house auspiciously) AND is natally
      waxing or in a dignified sign; inappropriate when Moon is waning AND a functional
      malefic for the lagna; most beneficial during Moon mahadasha for functional-benefic
      Moon natives.
    scope: remedy
    school: parashari
    confidence: 0.88
    confidence_rationale: "Declarative = 1.0; Saravali confirms Moon gemstone functional-benefic requirement = 1.15. 0.88."
    caveats: null
