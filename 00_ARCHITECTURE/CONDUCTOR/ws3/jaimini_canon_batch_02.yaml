rules:

  # ─── ADHYAYA 2 PADA 1: CHARA DASHA FUNDAMENTALS ───

  - rule_id: JAIMINI.2.1.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.1.1"
      text_excerpt: |
        "Chara dasha" — the primary dasha system in Jaimini is Chara (movable) dasha
        based on rashis (signs), not on nakshatras. Each rashi rules a dasha period.
        The duration of each rashi's dasha is determined by a calculation involving
        the sign's lord's distance. This is distinct from Vimshottari dasha which is
        nakshatra-based. (Rath: Chara dasha is Jaimini's signature dasha system.)
    condition: |
      The Jaimini Chara Dasha system is being applied to a natal chart.
    assertion: |
      Chara Dasha operates on rashis (signs), not nakshatras. Each of the 12 rashis
      gets a dasha period. The rashis are the primary timing agents, not planets.
      The activation of a rashi in dasha brings forth the karma associated with that
      rashi — its occupants, aspects, and argala relationships become active.
    scope: dasha
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Sutra declarative implicit form (0.85) × confirmed by all Jaimini commentators (1.15) = 0.85"
    caveats: |
      Multiple versions of Chara Dasha exist. The most common (used by Rath, K.N. Rao)
      is the Parashari-Jaimini Chara Dasha. Some scholars use Krishnamurti's modification.
      Calculation method must be specified when applying.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.1.2.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.1.2"
      text_excerpt: |
        "Duration of Chara Dasha: standard method" — the duration of each rashi's
        Chara Dasha period is calculated as follows: count from the rashi to its
        lord's sign (using the shorter arc — either direct or reverse); the number
        of signs in that count = years of the dasha. Exception applies for Scorpio
        and Aquarius. (Rath: Standard Chara Dasha years = distance from rashi to
        its lord's sign, minimum 1 year, maximum 12 years.)
    condition: |
      The duration of any rashi's Chara Dasha period is being calculated using
      the standard Jaimini method.
    assertion: |
      Count the number of signs from the dasha rashi to its lord's natal sign
      (using the shorter arc — whichever is fewer signs). That count = years of
      that rashi's Chara Dasha period. The minimum is 1 year; the maximum is 12 years.
      The 12 rashi periods sum to the full life span.
    scope: dasha
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by multiple Jaimini authorities (1.15) = 0.85; reduced to 0.80 for calculation method variation"
    caveats: |
      Significantly contested: K.N. Rao uses a different formula (counting from rashi
      to lord using the longer arc in some cases). Iranganti Rangacharya has yet another
      method. The Rath/PJC method (shorter arc) is most widely used in current practice.
      Results vary substantially depending on which calculation method is applied.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.1.3.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.1.3"
      text_excerpt: |
        "Exception rule for Scorpio dasha duration" — Scorpio has a unique exception
        in Chara Dasha calculation. Scorpio has two lords: Mars (traditional) and Ketu
        (modern/Jaimini). When computing Scorpio dasha duration, use Ketu's position
        (not Mars) in the calculation per the Jaimini exception rule. If Ketu is in
        Scorpio itself, special rules apply. (Rath: Ketu is the Jaimini lord of Scorpio;
        Mars is used only if Ketu exception doesn't apply.)
    condition: |
      Scorpio's Chara Dasha duration is being calculated.
    assertion: |
      For Scorpio dasha calculation, use Ketu's natal position as the ruler (not Mars).
      Count from Scorpio to Ketu's sign using the standard shorter-arc method.
      If Ketu is in Scorpio itself, the dasha period is 1 year (minimum).
    scope: dasha
    school: jaimini
    confidence: 0.72
    confidence_rationale: "Implicit sutra form (0.85) × Ketu nodes factor (×0.85 per R1) = 0.72"
    caveats: |
      Highly contested: Iranganti Rangacharya uses Mars for Scorpio and does not use
      Ketu as Scorpio's lord. K.N. Rao acknowledges the exception but applies it
      differently. The Ketu-as-Scorpio-lord rule is specific to the Rath/PJC lineage.
      This rule must be flagged when used — it is a contested sutra interpretation.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.1.3.2
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.1.3"
      text_excerpt: |
        "Exception rule for Aquarius dasha duration" — Aquarius also has an exception
        in Chara Dasha. Aquarius has two lords: Saturn (traditional) and Rahu (Jaimini).
        When computing Aquarius dasha duration, use Rahu's position as the ruler.
        Count from Aquarius to Rahu's sign using the shorter-arc method. If Rahu is
        in Aquarius itself, special minimum-period rules apply. (Rath: Rahu is the
        Jaimini lord of Aquarius.)
    condition: |
      Aquarius's Chara Dasha duration is being calculated.
    assertion: |
      For Aquarius dasha calculation, use Rahu's natal position as the ruler (not Saturn
      as primary lord). Count from Aquarius to Rahu's sign using the shorter-arc method.
      If Rahu is in Aquarius, the period is 1 year.
    scope: dasha
    school: jaimini
    confidence: 0.61
    confidence_rationale: "Implicit sutra form (0.85) × Rahu nodes factor (×0.85 per R1) = 0.72; reduced to 0.61 for high contestation"
    caveats: |
      Same contestation as Scorpio exception — Rahu as Aquarius lord is specific to
      Rath/PJC lineage. Iranganti and K.N. Rao use Saturn only. This contested sutra
      should be applied with explicit disclosure.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.1.4.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.1.4"
      text_excerpt: |
        "Chara Dasha sequence: from Lagna or from its 7th" — the sequence of Chara
        Dasha periods begins from Lagna if Lagna is in an odd sign (Aries, Gemini,
        Leo, Libra, Sagittarius, Aquarius) and proceeds in zodiacal order. If Lagna
        is in an even sign (Taurus, Cancer, Virgo, Scorpio, Capricorn, Pisces),
        the sequence begins from Lagna and proceeds in REVERSE zodiacal order.
        (Rath: Odd lagna = direct sequence; even lagna = reverse sequence.)
    condition: |
      The starting sequence of Chara Dasha is being determined from the natal Lagna.
    assertion: |
      When Lagna is in an odd sign, Chara Dasha runs in direct zodiacal order from
      Lagna (Aries→Taurus→Gemini→... or from Lagna's sign onward). When Lagna is
      in an even sign, Chara Dasha runs in reverse zodiacal order from Lagna
      (Pisces→Aquarius→Capricorn→... or from Lagna's sign backward).
    scope: dasha
    school: jaimini
    confidence: 0.82
    confidence_rationale: "Sutra declarative implicit form (0.85) × confirmed by Rath and K.N. Rao (1.15) = 0.85; reduced to 0.82 for some complexity in odd/even determination"
    caveats: |
      The odd/even sign rule for sequence direction is widely accepted. Some advanced
      practitioners also consider whether the dasha rashi itself is odd or even for
      the sub-period sequence direction (antardasha direction). Results vary by lagna.
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.1.5.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.1.5"
      text_excerpt: |
        "Chara Dasha antardasha (sub-period) sequence" — within each Chara Dasha
        mahadasha (main period), the antardashas (sub-periods) proceed through the
        12 rashis in the same direction as the mahadasha sequence (direct if main
        period rashi is odd; reverse if even). Each antardasha duration = 1 year
        total divided by 12 (i.e., 1 month each as base, adjusted proportionally).
        (Rath: Antardasha direction mirrors mahadasha rashi odd/even nature.)
    condition: |
      The antardasha sub-periods within a Chara Dasha mahadasha are being calculated.
    assertion: |
      Within each Chara mahadasha, antardashas proceed through all 12 signs. The
      direction (direct or reverse) is determined by whether the mahadasha rashi is
      odd or even. Each antardasha lasts proportionally (total years of mahadasha ÷ 12).
      The antardasha starts from the mahadasha rashi itself.
    scope: dasha
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × Rath + K.N. Rao confirmation (1.0) = 0.85; reduced to 0.80"
    caveats: |
      Sub-period calculation method is more contested than the mahadasha calculation.
      Some commentators give different antardasha starting points. Results vary by lagna.
    verified: true
    stub: false
    stub_reason: null

  # ─── ADHYAYA 2 PADA 2: CHARA DASHA RESULTS ───

  - rule_id: JAIMINI.2.2.1.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.1"
      text_excerpt: |
        "Results of a Chara Dasha rashi: planets in the dasha rashi" — the primary
        results of a Chara Dasha period come from the planets located IN the dasha
        rashi in the natal chart. Each planet in the dasha rashi activates its
        natural and functional significations during the dasha period.
        (Rath: Planets in the dasha rashi = primary karma delivery mechanism
        of that dasha.)
    condition: |
      One or more planets occupy the rashi whose Chara Dasha period is active.
    assertion: |
      Planets in the dasha rashi are the primary activators of that dasha's results.
      Their significations (as natural karakas and by house lordship) manifest during
      the dasha period. Benefics in dasha rashi = favorable results from their domains;
      malefics = challenging results from their domains.
    scope: dasha
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by all Jaimini commentators (1.15) = 0.85"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.2.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.2"
      text_excerpt: |
        "Results of Chara Dasha: planets aspecting the dasha rashi" — the secondary
        results of a Chara Dasha come from planets that aspect the dasha rashi by
        Jaimini rashi drishti. These planets' significations manifest after the
        primary (in-rashi) planets' results, or run concurrently with lesser emphasis.
        (Rath: Aspecting planets = secondary karma; in-rashi planets = primary karma.)
    condition: |
      One or more planets aspect the dasha rashi by Jaimini rashi drishti from
      other signs.
    assertion: |
      Planets aspecting the dasha rashi by Jaimini rashi drishti give secondary
      results during that dasha. Their significations activate but with less
      intensity than planets directly in the dasha rashi. This is the second
      layer of dasha results.
    scope: dasha
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Implicit sutra form (0.85) × confirmed (1.15) = 0.85"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.3.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.3"
      text_excerpt: |
        "Results of Chara Dasha: the sign lord's position" — the lord of the dasha
        rashi (its owner sign lord) and that lord's natal position provide the third
        layer of results. The dasha rashi lord's house and sign at birth indicate
        where the native's focus shifts during the dasha. (Rath: Dasha lord's natal
        position = where the dasha energy channels — that area of life activates.)
    condition: |
      The lord of the current Chara Dasha rashi's natal position is assessed.
    assertion: |
      The natal house and sign position of the dasha rashi's lord shows the area of
      life that receives focused attention during the dasha. The lord's aspects,
      conjunctions, and dignity in the natal chart shape how this focus manifests.
    scope: dasha
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by commentators (1.0) = 0.85"
    caveats: "For Scorpio, use Ketu; for Aquarius, use Rahu (per contested exception rules — see 2.1.3)."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.4.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.4"
      text_excerpt: |
        "Karakas activated during Chara Dasha" — when the dasha rashi contains
        or is aspected by a Chara Karaka planet (AK, AmK, BK, MK, PK, GK, DK),
        the life domain governed by that karaka becomes activated during the dasha
        period. The AK's dasha or a dasha where AK is strongly present = soul-level
        transformation period. (Rath: Karaka activation = life-domain awakening.)
    condition: |
      The dasha rashi contains or is aspected by one or more Chara Karaka planets.
    assertion: |
      The life domains governed by the activated Chara Karakas manifest prominently
      during the dasha period. AK involvement = soul-level themes dominate;
      AmK involvement = career changes; DK involvement = spouse/relationship events;
      PK involvement = children-related events; GK involvement = health/relative events.
    scope: dasha
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by Rath and PJC tradition (1.0) = 0.85"
    caveats: "Results vary by lagna and by nativity specifics."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.5.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.5"
      text_excerpt: |
        "Atmakaraka dasha: the most important period" — the Chara Dasha of the rashi
        containing the Atmakaraka (or the dasha of the Atmakaraka's sign) is the
        most significant period in the native's life for soul-level transformation,
        spiritual events, and fulfillment of the primary life purpose.
        (Rath: AK dasha = most powerful and transformative dasha in the chart.)
    condition: |
      The Chara Dasha rashi contains or is the sign of the Atmakaraka planet.
    assertion: |
      The Chara Dasha period of the rashi containing the Atmakaraka is the most
      significant dasha for soul-level transformation, spiritual awakening, life-
      purpose fulfillment, and major karmic events. This period transforms the
      native at the deepest level.
    scope: dasha
    school: jaimini
    confidence: 0.85
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by Jaimini tradition (1.15) = 0.85"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.6.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.6"
      text_excerpt: |
        "Rajayoga in Chara Dasha: 5th and 9th lords mutual aspect" — when the
        lord of the 5th house and the lord of the 9th house are in mutual aspect
        (Jaimini rashi drishti), this creates a powerful Jaimini Rajayoga. The
        dasha of either the 5th or 9th lord's rashi, or the rashi they aspect,
        activates this yoga and brings status, success, and elevated fortune.
        (Rath: 5th-9th lord mutual aspect = primary Jaimini Rajayoga.)
    condition: |
      The lord of the 5th house and the lord of the 9th house are in mutual Jaimini
      rashi aspect (each aspects the other's sign by Jaimini drishti).
    assertion: |
      When 5th and 9th lords mutually aspect each other by Jaimini rashi drishti,
      a powerful Rajayoga is formed. During the Chara Dasha of either lord's rashi
      or of a rashi they both aspect, the native experiences elevation in status,
      fortune, and achievement. Success in academic, dharmic, and career endeavors
      is pronounced.
    scope: yoga
    school: jaimini
    confidence: 0.82
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by K.N. Rao and Rath (1.15) = 0.85; reduced to 0.82"
    caveats: "Results vary by lagna; the lords must be in true Jaimini mutual aspect (rashi drishti), not just Parashari 7th-aspect mutual."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.7.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.7"
      text_excerpt: |
        "Rajayoga involving Atmakaraka: AK with 5th or 9th lord" — when the Atmakaraka
        is in the same rashi as the 5th lord or 9th lord, or when AK and 5th/9th lord
        are in mutual Jaimini aspect, a high-grade Rajayoga is formed. The dasha of the
        AK's rashi is elevated to a rajayoga dasha. (Rath: AK-5L or AK-9L connection
        = exceptional life fortune, spiritual and worldly success together.)
    condition: |
      The Atmakaraka occupies the same rashi as the 5th or 9th house lord, or they
      are in mutual Jaimini rashi aspect.
    assertion: |
      When AK joins or mutually aspects the 5th or 9th lord, a high-grade Rajayoga
      is created. The Chara Dasha of the rashi containing AK brings exceptional success
      in career, spiritual attainment, and fortune simultaneously. This is among the
      most powerful yogas in Jaimini.
    scope: yoga
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × Rath + K.N. Rao confirmation (1.0) = 0.85; reduced to 0.80"
    caveats: null
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.8.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.8"
      text_excerpt: |
        "Argala on the dasha rashi activating the dasha results" — when planets are
        in argala positions (2nd, 4th, 5th, 11th) from the dasha rashi AND from the
        Lagna simultaneously, the argala creates especially strong activation during
        that dasha period. Benefic argala on dasha rashi = highly supportive dasha.
        (Rath: Double argala — from both dasha rashi and lagna = maximum strength.)
    condition: |
      Planets are in argala positions from both the current Chara Dasha rashi AND
      from the natal Lagna simultaneously.
    assertion: |
      When argala-creating planets are positioned to create argala on both the dasha
      rashi and the natal lagna simultaneously, the dasha period is exceptionally
      active and its results are intensified. Benefic double argala = peak life
      periods; malefic double argala = periods of concentrated challenge.
    scope: dasha
    school: jaimini
    confidence: 0.75
    confidence_rationale: "Implicit sutra form (0.85) × Rath commentary (1.0) = 0.85; reduced to 0.75 for composite interpretation"
    caveats: "Double argala is a Rath synthesis; not an isolated sutra. Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  # ─── SPECIFIC PLANET IN DASHA RASHI RESULTS ───

  - rule_id: JAIMINI.2.2.10.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.10"
      text_excerpt: |
        "Sun in dasha rashi: government favor, authority, health of father" —
        when Sun occupies the Chara Dasha rashi being active, the native experiences
        government or authority-related events, receives favor from father figures,
        father's health comes into focus. If Sun is well-placed, success; if afflicted,
        conflicts with authority or father's illness. (Rath: Sun in dasha rashi =
        dharmic issues, government, father come to the fore.)
    condition: |
      Sun occupies the rashi whose Chara Dasha period is currently active.
    assertion: |
      Events involving government, authority, the native's father, health issues
      related to bones/heart/eyes, and matters of public status manifest during
      this dasha. Benefic aspects on Sun = success in these domains; malefic = conflict.
    scope: dasha
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × Rath commentary (1.0) = 0.85; reduced to 0.80"
    caveats: "Results vary by lagna and Sun's natal dignity."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.11.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.11"
      text_excerpt: |
        "Moon in dasha rashi: emotional shifts, public events, mother's welfare" —
        Moon in the active dasha rashi brings emotional life to the forefront, public
        or popular activities increase, the mother's welfare comes into focus. A strong
        Moon gives public recognition; a weak Moon indicates emotional turbulence or
        mother-related concerns. (Rath: Moon in dasha rashi = public life, emotions,
        maternal themes.)
    condition: |
      Moon occupies the rashi whose Chara Dasha period is currently active.
    assertion: |
      Events involving public life, emotional experiences, the native's mother,
      liquid-related businesses, and emotional decision-making manifest prominently.
      Well-placed Moon = public recognition and emotional fulfillment; afflicted Moon =
      emotional difficulties or mother's health concerns.
    scope: dasha
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × Rath + classical (1.0) = 0.85; reduced to 0.80"
    caveats: "Results vary by lagna and Moon's natal phase/dignity."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.12.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.12"
      text_excerpt: |
        "Mars in dasha rashi: property, siblings, energy, disputes" — Mars in the
        active dasha rashi activates property transactions, sibling relationships,
        physical energy, and disputes or legal conflicts. Well-placed Mars = gains
        in property and siblings prosper; afflicted Mars = disputes, accidents,
        or sibling conflicts. (Rath: Mars dasha rashi = action, property, courage themes.)
    condition: |
      Mars occupies the rashi whose Chara Dasha period is currently active.
    assertion: |
      Events involving property transactions, siblings, physical energy and health,
      disputes, litigation, and action-oriented pursuits manifest during this dasha.
      Well-placed Mars = successful ventures and sibling harmony; afflicted = disputes
      or accidents.
    scope: dasha
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.80"
    caveats: "Results vary by lagna and Mars's natal dignity."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.13.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.13"
      text_excerpt: |
        "Mercury in dasha rashi: trade, education, communication, intellect" —
        Mercury in the active dasha rashi brings intellectual and commercial activities
        to the fore. Educational events, writing, trade, and communication opportunities
        arise. Well-placed Mercury = intellectual achievements and business success;
        afflicted = communication difficulties or failed business ventures.
        (Rath: Mercury dasha rashi = learning, commerce, speech.)
    condition: |
      Mercury occupies the rashi whose Chara Dasha period is currently active.
    assertion: |
      Events involving education, trade, writing, communication, intellectual
      pursuits, and commercial activities manifest. Well-placed Mercury = success
      in these domains; afflicted Mercury = miscommunication, commercial setbacks.
    scope: dasha
    school: jaimini
    confidence: 0.80
    confidence_rationale: "Implicit sutra form (0.85) × Rath (1.0) = 0.85; reduced to 0.80"
    caveats: "Results vary by lagna."
    verified: true
    stub: false
    stub_reason: null

  - rule_id: JAIMINI.2.2.14.1
    source_verse:
      canonical_id: JAIMINI
      verse_ref: "2.2.14"
      text_excerpt: |
        "Jupiter in dasha rashi: children, spiritual growth, learning, fortune" —
        Jupiter in the active dasha rashi activates children's events (birth, progress),
        spiritual growth, higher learning, fortune improvement, and dharmic activities.
        Well-placed Jupiter = blessed with children, wisdom, and fortune; afflicted =
        setbacks in these domains. (Rath: Jupiter dasha rashi = expansion, dharma,
        prosperity themes.)
    condition: |
      Jupiter occupies the rashi whose Chara Dasha period is currently active.
    assertion: |
      Events involving children, higher education, spiritual growth, fortune
      improvement, religious activities, and dharmic pursuits manifest. Well-placed
      Jupiter = blessings in all these areas; afflicted Jupiter = excess or setbacks
      in dharmic domains.
    scope: dasha
    school: jaimini
    confidence: 0.82
    confidence_rationale: "Implicit sutra form (0.85) × confirmed by tradition (1.15) = 0.85; reduced to 0.82"
    caveats: null
    verified: true
