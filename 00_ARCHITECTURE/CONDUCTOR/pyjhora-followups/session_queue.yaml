      brief: 00_ARCHITECTURE/BRIEFS/CLAUDECODE_BRIEF_JH_PARITY_RESIDUE_CLEANUP_v1_0.md
      branch: chore/jh-parity-residue-cleanup
      worktree: /Users/Dev/Vibe-Coding/Apps/MadhavS2-JHParity
