        - platform/src/lib/build/jobInvoker.ts
        - platform/src/app/api/build/__tests__/task_route.test.ts
        - platform/scripts/governance/edge_security_smoke.sh
      gate_check:
        - "tsc --noEmit clean"
        - "vitest run platform/src/app/api/build/__tests__/task_route.test.ts green"
        - "BUILD_TASK_AUTH_BYPASS zero-effect regression test still green"
      deploy: false   # batched into Phase B
      on_done: [merge_to_main, append_run_log, retire_worktree]

    - id: S2
