        - platform/src/app/api/engine/__tests__/current_route.test.ts
        - platform/src/app/api/build/__tests__/build.integration.test.ts
        - platform/python-sidecar/tests/test_pyjhora_adapter/_scratch/   # DELETE + gitignore
        - .gitignore
      gate_check:
        - "grep -rn 'jh_parity|jh_oracle' platform/ src/ → 0 hits in executable code paths"
        - "hard_gates_check.sh no longer rewards jh_oracle.json presence"
        - "_scratch untracked + gitignored"
        - "tsc --noEmit clean; vitest + pytest green"
      deploy: false
      on_done: [merge_to_main, append_run_log, retire_worktree]

    - id: S3
      title: Forensic renderer wiring (un-stub forensic_writer)
      brief: 00_ARCHITECTURE/BRIEFS/CLAUDECODE_BRIEF_STREAM_F_FORENSIC_RENDER_v1_0.md
      branch: feature/stream-f-forensic-render
      worktree: /Users/Dev/Vibe-Coding/Apps/MadhavS3-Forensic
