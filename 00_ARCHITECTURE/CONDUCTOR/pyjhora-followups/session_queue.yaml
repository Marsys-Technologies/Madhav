# ── Phase B — convergence: deploy + migrate + native e2e + ledger ──────────────
phase_B:
  parallel: false
  enter_when: [S1.status == merged, S2.status == merged, S3.status == merged]
  sessions:
    - id: B
      title: Deploy, migrate, native e2e, ledger close
      runs_on: main
      steps:
        - deploy: "gh workflow run deploy.yml --ref main; wait deploy-web + deploy-sidecar green"
        - verify_S1: "POST /api/build/start (native chart) via Cloud Tasks path → build_complete (NOT job-direct)"
        - verify_S3: "chart_documents has 1 forensic_render doc/ayanamsha, content_md non-empty, linter clean; rag_chunks present"
        - migrate: "apply 121/122/124 (query_trace_steps partitions) — now unblocked; verify chart_id non-NULL first"
        - hygiene: "gcloud run services update amjis-web --remove-env-vars BUILD_TASK_AUTH_BYPASS"
        - eval: "run answer:eval ONCE (consolidated)"
        - ledger: "apply OPERATOR_LEDGER_PATCH_PYJHORA_POSTMERGE_v1_0.md; CURRENT_STATE bump (verify next free version on origin/main); OPERATOR_ACTIONS_PENDING; single SESSION_LOG entry for S1+S2+S3+B"
        - redteam: "IS.8(b) if cadence due"
      on_done: [run_log: RUN_COMPLETE]

guardrails:
  - no_anthropic_models
  - no_jh_parity_or_forensic_v8_value_oracle
  - no_cross_stream_file_edits
  - governance_docs_written_in_phase_B_only   # avoid SESSION_LOG/CURRENT_STATE merge conflicts
  - tsc_noemit_plus_tests_after_any_merge_resolution
  - answer_eval_once_in_phase_B_not_per_stream
