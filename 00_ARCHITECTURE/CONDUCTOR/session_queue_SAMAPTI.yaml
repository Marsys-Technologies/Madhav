    model: opus
    effort: xhigh
    writes_code: false
    mandate: >
      Independently re-derive every lane's claims. Adversarial — try to REFUTE. Sole authority to
      move a lane to `done`. Returns CONFIRMED | REFUTED | INSUFFICIENT-EVIDENCE. Also holds the
      whole-run view: flag any lane that contradicts an already-confirmed result.
  - id: DVA
    role: Dvārapāla
    model: opus
    effort: high
    writes_code: false
    mandate: >
      Human-replacement. Resolves every would-be human gate with a documented decision. Understands
      portal, product, domain, corpus. "Ask the native" is not an available output. Every ruling
      appended to SAMAPTI_DVARAPALA_LEDGER.md.

