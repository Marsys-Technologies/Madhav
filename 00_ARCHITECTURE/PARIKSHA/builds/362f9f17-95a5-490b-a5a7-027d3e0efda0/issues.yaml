  - id: I-015
    discovered_by: drashta
    discovered_at: "2026-06-01T08:00:00Z"
    surface: "POST /api/build/start → Cloud Tasks"
    stage: 2
    severity: workflow_blocking
    title: "Build stuck in queued — enqueueBuild failure is non-fatal"
    description: |
      After clicking Build, the build stayed in status='queued' for 5+ minutes
      with no Cloud Run Job dispatch. Root cause: build/start route wraps
      enqueueBuild() in a non-fatal try/catch:
        "console.warn('[api/build/start] enqueueBuild skipped (non-fatal):', ...)"
      If Cloud Tasks API call fails for any reason (quota, auth, config), the
      build row is persisted with status='queued' but no job is ever dispatched.
      No background worker polls for stuck builds. build_events table had 0 rows
      for the new build, confirming the enqueue call never reached persistEnqueuedRow.
      Also noted: BUILD_TASK_AUTH_BYPASS=test is set on production amjis-web,
      allowing unauthenticated /api/build/task invocation by anyone who knows
      the endpoint URL.
    evidence:
      db_state: |
        SELECT * FROM build_events WHERE build_id = 'a62395ea...'; → 0 rows
        -- Build stayed queued for 5+ minutes with no job execution
        SELECT status FROM builds WHERE build_id = 'a62395ea...'; → queued (after 5 min)
      workaround_applied: "POST /api/build/task directly with bypass auth — dispatched successfully"
    suspected_root_cause: RC-006
    suspected_files:
      - platform/src/app/api/build/start/route.ts
      - platform/src/lib/build/trigger.ts
    status: open
    severity_reason: "Guests with builds that fail to enqueue will wait forever with no feedback."
    fix_attempts: 0

