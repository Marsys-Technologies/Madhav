# Secret Manager runtime inventory for the Pūrṇa Anveṣaṇa transition and final
# least-privilege posture. This includes Cloud Run Jobs that reuse a service
# account; inventorying services alone misses those mounts.
version: 2
inventory:
  - env_var: FIREBASE_ADMIN_CREDENTIALS
    secret_name: firebase-admin-credentials
    accessors: [amjis-web-runtime]
    pinned_version: true

  - env_var: DB_PASSWORD
    secret_name: amjis-db-password
    accessors: [amjis-web-runtime]
    pinned_version: true

  - env_var: DB_INQUIRY_PASSWORD
    secret_name: amjis-inquiry-db-password
    accessors: [amjis-web-runtime]
    pinned_version: true
    notes: Dedicated Pūrṇa serving LOGIN credential; never used by migration jobs.

  - env_var: NIRMANA_CAMPAIGN_CONTROL_DB_PASSWORD
    secret_name: nirmana-campaign-control-db-password
    accessors: [amjis-web-runtime]
    pinned_version: false

  - env_var: NIRMANA_EVIDENCE_INGRESS_DB_PASSWORD
    secret_name: nirmana-evidence-ingress-db-password
    accessors: [amjis-web-runtime]
    pinned_version: false

  - env_var: OPENAI_API_KEY
    secret_name: openai-api-key
    accessors: [amjis-web-runtime]
    pinned_version: true

  - env_var: GOOGLE_GENERATIVE_AI_API_KEY
    secret_name: GOOGLE_GENERATIVE_AI_API_KEY
    canonical: false
    rename_to: google-generative-ai-api-key
    accessors: [amjis-web-runtime, amjis-sidecar-runtime]
    pinned_version: true

  - env_var: DEEPSEEK_API_KEY
    secret_name: DEEPSEEK_API_KEY
    canonical: false
    rename_to: deepseek-api-key
    accessors: [amjis-web-runtime]
    pinned_version: true

  - env_var: NVIDIA_NIM_API_KEY
    secret_name: NVIDIA_NIM_API_KEY
    canonical: false
    rename_to: nvidia-nim-api-key
    accessors: [amjis-web-runtime]
    pinned_version: true

  - env_var: PYTHON_SIDECAR_API_KEY
    secret_name: PYTHON_SIDECAR_API_KEY
    canonical: false
    rename_to: python-sidecar-api-key
    accessors: [amjis-web-runtime, amjis-sidecar-runtime, amjis-mcp-runtime]
    pinned_version: true

  - env_var: SUPER_ADMIN_EMAIL
    secret_name: SUPER_ADMIN_EMAIL
    canonical: false
    rename_to: super-admin-email
    accessors: [amjis-web-runtime]
    pinned_version: true

  - env_var: MARSYS_CRON_SECRET
    secret_name: mcpt-scheduler-secret
    accessors: [amjis-web-runtime]
    pinned_version: false
    notes: Web cron routes only; unrelated to watchdog authentication.

  - env_var: MCP_INTERNAL_TOKEN
    secret_name: mcp-internal-token
    accessors: [amjis-web-runtime, amjis-mcp-runtime]
    pinned_version: true

  - env_var: MCP_CANARY_KEY
    secret_name: mcp-canary-key
    accessors: [amjis-web-runtime]
    pinned_version: false
    notes: Web readiness uses the key id; deploy identity reads plaintext for candidate smoke. Not mounted in MCP.

  - env_var: INQUIRY_LIFECYCLE_SIGNING_KEY_CURRENT
    secret_name: inquiry-lifecycle-signing-key
    accessors: [amjis-web-runtime]
    pinned_version: true

  - env_var: DATABASE_URL
    secret_name: amjis-pipeline-db-url
    accessors: [amjis-web-runtime, amjis-sidecar-runtime]
    pinned_version: false
    notes: Used by brahma-build-pipeline-job under web runtime and the serving sidecar.
